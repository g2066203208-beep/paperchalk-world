<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paperchalk 纸艺世界视觉 Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fb5c8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#3b2d23}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:5;left:18px;top:18px;max-width:min(520px,calc(100vw - 36px));padding:14px 16px;border:2px solid rgba(94,67,46,.52);border-radius:18px;background:rgba(244,231,199,.92);box-shadow:0 7px 0 rgba(76,55,41,.18),0 18px 36px rgba(43,31,23,.12);backdrop-filter:blur(8px)}
.panel h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}.panel p{margin:0;font-size:12px;line-height:1.5;opacity:.76}
.controls{position:fixed;z-index:6;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(650px,calc(100vw - 32px))}
button{appearance:none;border:2px solid rgba(89,63,42,.42);background:#f3e5c2;color:#453326;font-weight:700;padding:10px 13px;border-radius:14px;box-shadow:0 4px 0 rgba(77,54,37,.16);cursor:pointer;font-size:13px}
button.active{background:#5f5142;color:#fff3cf;border-color:#e8c65c}
.badge{position:fixed;z-index:6;left:18px;bottom:18px;padding:8px 12px;border-radius:999px;background:rgba(47,39,32,.72);color:#fff7e6;font-size:12px;backdrop-filter:blur(6px)}
@media(max-width:720px){.panel{left:10px;top:10px;padding:11px 12px}.panel h1{font-size:16px}.panel p{font-size:11px}.controls{right:10px;bottom:10px;gap:6px}button{padding:9px 10px;font-size:12px}.badge{display:none}}
</style>
</head>
<body>
<div class="panel">
  <h1>纸艺世界视觉 Demo</h1>
  <p>不是只换贴图：纸板厚度 + 纸纹 + 柔光软阴影 + 接触层次 + 纸天空 + 远景雾 + 统一色调。点击“基础方块”可直接对比。</p>
</div>
<div class="controls">
  <button id="compare" class="active">目标效果</button>
  <button id="sky" class="active">纸天空</button>
  <button id="layers" class="active">纸层厚度</button>
  <button id="shadow" class="active">软阴影</button>
  <button id="fog" class="active">空气雾</button>
  <button id="tone" class="active">统一色调</button>
</div>
<div class="badge">拖动旋转 · 滚轮/双指缩放</div>
<script type="module">
import * as THREE from './vendor/three/three.module.js';

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ca1ad);
scene.fog=new THREE.Fog(0xaec8d3,15,34);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
const target=new THREE.Vector3(0,1.15,0);
let yaw=.02,pitch=.23,dist=17.5;
function placeCamera(){
  camera.position.set(
    target.x+Math.sin(yaw)*Math.cos(pitch)*dist,
    target.y+Math.sin(pitch)*dist,
    target.z+Math.cos(yaw)*Math.cos(pitch)*dist
  );
  camera.lookAt(target);
}
placeCamera();

function rng(seed){let s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function paperTexture(base,variants,seed,side){
  const size=512,c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d'),r=rng(seed);
  g.fillStyle=base;g.fillRect(0,0,size,size);
  for(let i=0;i<(side?62:48);i++){
    const cx=r()*size,cy=r()*size,w=55+r()*160,h=35+r()*120;
    const col=variants[(r()*variants.length)|0];
    g.globalAlpha=side?.22:.15;g.fillStyle=col;
    g.beginPath();
    const n=14;
    for(let j=0;j<n;j++){
      const a=Math.PI*2*j/n,rr=1+(r()-.5)*.22;
      const x=cx+Math.cos(a)*w*.5*rr,y=cy+Math.sin(a)*h*.5*rr;
      if(j===0)g.moveTo(x,y);else g.lineTo(x,y);
    }
    g.closePath();g.fill();
  }
  g.globalAlpha=1;
  for(let i=0;i<(side?1800:1350);i++){
    const x=r()*size,y=r()*size,len=1.2+r()*8,a=r()*Math.PI;
    g.strokeStyle=r()>.5?'rgba(255,244,213,.12)':'rgba(63,42,28,.08)';
    g.lineWidth=.45+r()*.8;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }
  for(let i=0;i<180;i++){
    g.fillStyle=r()>.55?'rgba(53,39,24,.12)':'rgba(255,248,225,.08)';
    const q=.4+r()*1.15;g.fillRect(r()*size,r()*size,q,q);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}
function skyTexture(){
  const w=1024,h=512,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),r=rng(9173);
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#78add2');grad.addColorStop(.58,'#91bfdb');grad.addColorStop(1,'#b6d5df');
  g.fillStyle=grad;g.fillRect(0,0,w,h);
  for(let band=0;band<9;band++){
    const y=band*(h/8)-26+r()*34;
    g.fillStyle=band%3===0?'rgba(217,237,244,.10)':band%3===1?'rgba(70,130,174,.08)':'rgba(244,247,238,.06)';
    g.beginPath();g.moveTo(-40,y);
    for(let x=-40;x<=w+60;x+=34)g.lineTo(x,y+(r()-.5)*22);
    g.lineTo(w+60,y+78+r()*45);
    for(let x=w+60;x>=-40;x-=34)g.lineTo(x,y+82+(r()-.5)*18);
    g.closePath();g.fill();
  }
  for(let i=0;i<3000;i++){
    const x=r()*w,y=r()*h,len=1+r()*6,a=r()*Math.PI;
    g.strokeStyle=r()>.5?'rgba(255,255,245,.10)':'rgba(33,83,118,.07)';
    g.lineWidth=.45+r()*.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.anisotropy=4;return t;
}

const grassTex=paperTexture('#a9c96f',['#bfd882','#93b961','#afcd72','#9ec26a'],731,false);
const dirtTex=paperTexture('#a9683f',['#bd7b4c','#935532','#c1865c','#a7613c'],991,true);
const edgeTex=paperTexture('#9dbc5f',['#b4cf70','#88a951','#a6c363'],371,false);
grassTex.repeat.set(1.15,1.15);dirtTex.repeat.set(1.05,1.05);edgeTex.repeat.set(1.4,1.4);

function mat(map,color=0xffffff){
  return new THREE.MeshStandardMaterial({map,color,roughness:.97,metalness:0});
}
const dirtMat=mat(dirtTex),grassMat=mat(grassTex),edgeMat=mat(edgeTex);
const bottomMat=new THREE.MeshStandardMaterial({color:0x7d4d31,roughness:1});
const blockGeo=new THREE.BoxGeometry(1,.78,1);
const capGeo=new THREE.BoxGeometry(1.025,.055,1.025);
const terrain=new THREE.Group();scene.add(terrain);
const caps=[];

function addColumn(x,z,h){
  for(let y=0;y<=h;y++){
    const mesh=new THREE.Mesh(blockGeo,[dirtMat,dirtMat,y===h?grassMat:dirtMat,bottomMat,dirtMat,dirtMat]);
    mesh.position.set(x,y*.78,z);mesh.castShadow=true;mesh.receiveShadow=true;terrain.add(mesh);
  }
  const cap=new THREE.Mesh(capGeo,[edgeMat,edgeMat,grassMat,edgeMat,edgeMat,edgeMat]);
  cap.position.set(x,h*.78+.4175,z);cap.castShadow=true;cap.receiveShadow=true;
  cap.userData.paperCap=true;caps.push(cap);terrain.add(cap);
}

const cols=[];
for(let z=-3;z<=3;z++)for(let x=-7;x<=7;x++){
  let h=0;
  if(x<-5||x>5)h=1;
  if((x<-6&&z<1)||(x>5&&z>0))h=2;
  if((x===-4||x===4)&&Math.abs(z)>1)h=1;
  if(z===3&&Math.abs(x)>2)h++;
  if((x===-2&&z===-2)||(x===3&&z===2))h++;
  cols.push([x,z,h]);
}
cols.forEach(v=>addColumn(v[0],v[1],v[2]));

function tuft(x,z,y,scale=.42){
  const group=new THREE.Group();
  const pm=new THREE.MeshStandardMaterial({map:grassTex,color:0x769c50,roughness:1,side:THREE.DoubleSide,transparent:false});
  for(let i=0;i<3;i++){
    const shape=new THREE.Shape();shape.moveTo(-.11,0);shape.quadraticCurveTo(0,.55,.09,0);
    const geo=new THREE.ShapeGeometry(shape,5),m=new THREE.Mesh(geo,pm);
    m.scale.setScalar(scale);m.rotation.y=i*Math.PI/3;m.castShadow=true;group.add(m);
  }
  group.position.set(x,y,z);scene.add(group);
}
tuft(-3.2,-1.7,.45,.55);tuft(2.3,1.7,.45,.48);tuft(5.2,-.6,1.22,.46);tuft(-5.8,1.8,1.22,.5);

const stoneMat=new THREE.MeshStandardMaterial({color:0xa89c8f,roughness:1,metalness:0});
function stone(x,z,y,s){
  const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),stoneMat);
  m.position.set(x,y,z);m.scale.y=.62;m.rotation.set(.2,.4,.1);m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
stone(-1.8,1.4,.48,.26);stone(1.2,-2.2,.45,.18);

const texLoader=new THREE.TextureLoader();
texLoader.load('./assets/player/protagonist.webp',t=>{
  t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.12,side:THREE.DoubleSide,toneMapped:false});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(1.12,2.24),m);
  p.position.set(0,1.55,.15);p.castShadow=true;scene.add(p);
});

const hemi=new THREE.HemisphereLight(0xd9ecff,0x8b6549,1.45);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0ad,3.0);
sun.position.set(-7,12,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=11;sun.shadow.camera.bottom=-8;
sun.shadow.camera.near=.1;sun.shadow.camera.far=40;sun.shadow.bias=-.0006;sun.shadow.normalBias=.025;
scene.add(sun);scene.add(sun.target);sun.target.position.set(0,0,0);

const skyMat=new THREE.MeshBasicMaterial({map:skyTexture(),side:THREE.BackSide,fog:false,toneMapped:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(48,32,18),skyMat);
sky.scale.y=.72;scene.add(sky);

const state={sky:true,layers:true,shadow:true,fog:true,tone:true,final:true};
function apply(){
  sky.visible=state.sky;
  caps.forEach(c=>c.visible=state.layers);
  renderer.shadowMap.enabled=state.shadow;
  sun.castShadow=state.shadow;
  scene.fog=state.fog?new THREE.Fog(0xaec8d3,15,34):null;
  renderer.toneMapping=state.tone?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
  renderer.toneMappingExposure=state.tone?1.03:1;
  document.getElementById('sky').classList.toggle('active',state.sky);
  document.getElementById('layers').classList.toggle('active',state.layers);
  document.getElementById('shadow').classList.toggle('active',state.shadow);
  document.getElementById('fog').classList.toggle('active',state.fog);
  document.getElementById('tone').classList.toggle('active',state.tone);
  document.getElementById('compare').classList.toggle('active',state.final);
  document.getElementById('compare').textContent=state.final?'目标效果':'基础方块';
}
function setFinal(v){
  state.final=v;state.sky=v;state.layers=v;state.shadow=v;state.fog=v;state.tone=v;
  if(!v){scene.background=new THREE.Color(0xaaa5b1);hemi.intensity=1.0;sun.intensity=2.1}
  else{scene.background=new THREE.Color(0x9ca1ad);hemi.intensity=1.45;sun.intensity=3.0}
  apply();
}
document.getElementById('compare').onclick=()=>setFinal(!state.final);
['sky','layers','shadow','fog','tone'].forEach(id=>{
  document.getElementById(id).onclick=()=>{state[id]=!state[id];state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone;apply()}
});
apply();

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastX)*.006;pitch=Math.max(.08,Math.min(.56,pitch+(e.clientY-lastY)*.004));
  lastX=e.clientX;lastY=e.clientY;placeCamera();
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(10,Math.min(27,dist+e.deltaY*.012));placeCamera()},{passive:true});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
});

function animate(){
  requestAnimationFrame(animate);
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
