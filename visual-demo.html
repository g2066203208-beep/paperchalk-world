<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paperchalk 纸艺世界视觉 Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fb5c8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#3b2d23}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:5;left:18px;top:18px;max-width:min(560px,calc(100vw - 36px));padding:14px 16px;border:2px solid rgba(94,67,46,.52);border-radius:18px;background:rgba(244,231,199,.92);box-shadow:0 7px 0 rgba(76,55,41,.18),0 18px 36px rgba(43,31,23,.12);backdrop-filter:blur(8px)}
.panel h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}.panel p{margin:0;font-size:12px;line-height:1.5;opacity:.76}
.controls{position:fixed;z-index:6;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(780px,calc(100vw - 32px))}
button{appearance:none;border:2px solid rgba(89,63,42,.42);background:#f3e5c2;color:#453326;font-weight:700;padding:10px 13px;border-radius:14px;box-shadow:0 4px 0 rgba(77,54,37,.16);cursor:pointer;font-size:13px}
button.active{background:#5f5142;color:#fff3cf;border-color:#e8c65c}
.groupBreak{flex-basis:100%;height:0}
.badge{position:fixed;z-index:6;left:18px;bottom:18px;padding:8px 12px;border-radius:999px;background:rgba(47,39,32,.72);color:#fff7e6;font-size:12px;backdrop-filter:blur(6px)}
@media(max-width:720px){.panel{left:10px;top:10px;padding:11px 12px}.panel h1{font-size:16px}.panel p{font-size:11px}.controls{right:10px;bottom:10px;gap:6px}button{padding:9px 10px;font-size:12px}.badge{display:none}}
</style>
</head>
<body>
<div class="panel">
  <h1>纸艺世界视觉 Demo v7</h1>
  <p>深林动态纸雾 v7：改成实例化纸雾卡 + 深度软交界 + 风场漂移。雾会明显流动、绕地形、分前中远三层；仍然是撕边纸片，不是写实烟。</p>
</div>
<div class="controls">
  <button id="compare" class="active">目标效果</button>
  <button id="sky" class="active">纸天空</button>
  <button id="layers" class="active">纸层厚度</button>
  <button id="shadow" class="active">软阴影</button>
  <button id="fog" class="active">动态纸雾</button>
  <button id="tone" class="active">统一色调</button>
  <button id="random" class="active">随机材质</button>
  <button id="bounce" class="active">地面反射光</button>
  <div class="groupBreak"></div>
  <button id="dawn">清晨</button>
  <button id="noon" class="active">正午</button>
  <button id="sunset">黄昏</button>
  <button id="night">夜晚</button>
  <button id="cycle">自动昼夜</button>
</div>
<div class="badge">拖动旋转 · 滚轮缩放 · GPU纸雾动态漂移</div>

<script type="module">
import * as THREE from './vendor/three/three.module.js';

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
let shadowDirty=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ca1ad);
scene.fog=new THREE.Fog(0xaec8d3,15,36);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
const target=new THREE.Vector3(0,1.25,0);
let yaw=.03,pitch=.24,dist=17.5;
function placeCamera(){
  camera.position.set(
    target.x+Math.sin(yaw)*Math.cos(pitch)*dist,
    target.y+Math.sin(pitch)*dist,
    target.z+Math.cos(yaw)*Math.cos(pitch)*dist
  );
  camera.lookAt(target);
}
placeCamera();

function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function hash3(x,y,z){
  let h=(Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,2246822519))>>>0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967295;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smoothstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}

function paperTexture(base,variants,seed,side,version=0){
  const size=512,c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d'),r=rng(seed+version*9973);
  g.fillStyle=base;g.fillRect(0,0,size,size);

  // Large torn-paper patches: the important non-repeating macro structure.
  for(let i=0;i<(side?88:62);i++){
    const cx=r()*size,cy=r()*size,w=38+r()*(side?125:185),h=24+r()*(side?95:145);
    const col=variants[(r()*variants.length)|0];
    g.globalAlpha=side?.27:.18;g.fillStyle=col;g.beginPath();
    const n=16;
    for(let j=0;j<n;j++){
      const a=Math.PI*2*j/n,rr=1+(r()-.5)*.25;
      const px=cx+Math.cos(a)*w*.5*rr,py=cy+Math.sin(a)*h*.5*rr;
      if(j===0)g.moveTo(px,py);else g.lineTo(px,py);
    }
    g.closePath();g.fill();
  }
  g.globalAlpha=1;

  // Pulp/fibre detail. Side stock is coarser than the top sheet.
  for(let i=0;i<(side?2400:1550);i++){
    const x=r()*size,y=r()*size,len=.9+r()*(side?9:6.5),a=r()*Math.PI;
    g.strokeStyle=r()>.52?'rgba(255,244,213,.14)':'rgba(59,39,27,.09)';
    g.lineWidth=.38+r()*(side?.9:.65);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }

  for(let i=0;i<(side?300:210);i++){
    const dark=r()>.55;
    g.fillStyle=dark?'rgba(53,37,24,.13)':'rgba(255,248,225,.08)';
    const q=.35+r()*(side?1.35:1.0);g.fillRect(r()*size,r()*size,q,q);
  }

  if(side){
    // Faint compressed cardboard strata, intentionally irregular.
    let yy=20+r()*20;
    while(yy<size){
      g.fillStyle='rgba(255,236,200,.055)';g.fillRect(0,yy,size,1+r()*2);
      g.fillStyle='rgba(78,43,26,.045)';g.fillRect(0,yy+3,size,1);
      yy+=44+r()*38;
    }
  }

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}

function skyTexture(mode='day'){
  const w=1024,h=512,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),r=rng(mode==='night'?4721:mode==='sunset'?8813:mode==='dawn'?6113:9173);
  const grad=g.createLinearGradient(0,0,0,h);
  if(mode==='night'){grad.addColorStop(0,'#1c2b46');grad.addColorStop(.55,'#314765');grad.addColorStop(1,'#536b83')}
  else if(mode==='sunset'){grad.addColorStop(0,'#5475a4');grad.addColorStop(.5,'#91b7d1');grad.addColorStop(1,'#e1b88f')}
  else if(mode==='dawn'){grad.addColorStop(0,'#718db6');grad.addColorStop(.5,'#a6c2d8');grad.addColorStop(1,'#ded0bb')}
  else{grad.addColorStop(0,'#73a8cf');grad.addColorStop(.58,'#91bed9');grad.addColorStop(1,'#bdd8df')}
  g.fillStyle=grad;g.fillRect(0,0,w,h);

  // Large overlapping handmade-paper sheets, but still quiet enough for sky.
  for(let band=0;band<8;band++){
    const y=band*(h/7)-34+r()*38;
    g.fillStyle=band%3===0?'rgba(225,239,241,.11)':band%3===1?'rgba(62,121,163,.075)':'rgba(247,241,225,.055)';
    g.beginPath();g.moveTo(-50,y);
    for(let x=-50;x<=w+60;x+=38)g.lineTo(x,y+(r()-.5)*25);
    g.lineTo(w+60,y+74+r()*50);
    for(let x=w+60;x>=-50;x-=38)g.lineTo(x,y+82+(r()-.5)*21);
    g.closePath();g.fill();
  }
  for(let i=0;i<3300;i++){
    const x=r()*w,y=r()*h,len=.8+r()*6,a=r()*Math.PI;
    g.strokeStyle=r()>.5?'rgba(255,255,245,.105)':'rgba(30,73,105,.065)';
    g.lineWidth=.4+r()*.55;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.anisotropy=4;return t;
}

function mistTexture(seed=1){
  const w=512,h=192,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),r=rng(7400+seed*131);
  g.clearRect(0,0,w,h);

  // One strong torn-paper silhouette plus one lighter offset layer.
  for(let s=0;s<2;s++){
    const top=28+s*30+r()*8;
    const thickness=74+r()*34;
    const bottom=top+thickness;

    g.beginPath();
    g.moveTo(-24,top);
    for(let x=-24;x<=w+24;x+=16){
      const y=top+(r()-.5)*18+Math.sin((x+seed*37)*.034)*5;
      g.lineTo(x,y);
    }
    for(let x=w+24;x>=-24;x-=16){
      const y=bottom+(r()-.5)*20+Math.sin((x+seed*19)*.029)*6;
      g.lineTo(x,y);
    }
    g.closePath();

    const grad=g.createLinearGradient(0,top,0,bottom);
    const a=s===0?.88:.62;
    grad.addColorStop(0,'rgba(255,255,248,'+(a*.68).toFixed(3)+')');
    grad.addColorStop(.18,'rgba(252,253,247,'+a.toFixed(3)+')');
    grad.addColorStop(.74,'rgba(236,245,239,'+(a*.94).toFixed(3)+')');
    grad.addColorStop(1,'rgba(205,221,214,'+(a*.60).toFixed(3)+')');
    g.fillStyle=grad;g.fill();

    // Paper underside/edge.
    g.strokeStyle='rgba(91,112,104,.25)';
    g.lineWidth=1.6+s*.5;g.stroke();

    g.save();g.clip();
    for(let i=0;i<320;i++){
      const x=r()*w,y=top+r()*thickness,len=2+r()*11,a2=r()*Math.PI;
      g.strokeStyle=r()>.5?'rgba(255,255,255,.24)':'rgba(78,100,91,.14)';
      g.lineWidth=.45+r()*.75;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a2)*len,y+Math.sin(a2)*len);g.stroke();
    }
    for(let i=0;i<54;i++){
      g.fillStyle=r()>.5?'rgba(255,255,255,.13)':'rgba(66,88,80,.10)';
      const q=.8+r()*3.2;g.fillRect(r()*w,top+r()*thickness,q,q);
    }
    g.restore();
  }

  // Fade only at horizontal ends; keep the torn top/bottom crisp.
  const sideFade=g.createLinearGradient(0,0,w,0);
  sideFade.addColorStop(0,'rgba(255,255,255,0)');
  sideFade.addColorStop(.045,'rgba(255,255,255,1)');
  sideFade.addColorStop(.955,'rgba(255,255,255,1)');
  sideFade.addColorStop(1,'rgba(255,255,255,0)');
  g.globalCompositeOperation='destination-in';
  g.fillStyle=sideFade;g.fillRect(0,0,w,h);
  g.globalCompositeOperation='source-over';

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

const variantCount=6;
const grassTextures=[],edgeTextures=[],dirtTextures=[];
for(let i=0;i<variantCount;i++){
  grassTextures.push(paperTexture('#accb74',['#c0d987','#92b961','#b7d47a','#9fc36b','#a5c96f'],731,false,i));
  edgeTextures.push(paperTexture('#98b95d',['#aecf6e','#86a950','#a2c568','#91b357'],381,false,i));
  dirtTextures.push(paperTexture('#aa693f',['#c18150','#935431','#b97548','#cb8a5a','#a55f39'],991,true,i));
}

const blockGeo=new THREE.BoxGeometry(1,.78,1);
const rimGeo=new THREE.BoxGeometry(1.035,.035,1.035);
const capGeo=new THREE.BoxGeometry(1.055,.085,1.055);
const terrain=new THREE.Group();scene.add(terrain);
const caps=[],rims=[],paperObjects=[];
const materialCache=new Map();

function makeMaterial(tex,tint=1,sat=0){
  const m=new THREE.MeshLambertMaterial({map:tex});
  m.color.setRGB(tint,tint,tint);m.color.offsetHSL(0,sat,0);
  return m;
}
function materialSet(x,y,z,topGrass=true,randomOn=true){
  const rv=randomOn?hash3(x,y,z):.22;
  const gv=randomOn?hash3(x+91,y+31,z+61):.22;
  const idx=Math.min(variantCount-1,Math.floor(rv*variantCount));
  const gidx=Math.min(variantCount-1,Math.floor(gv*variantCount));
  const jitter=randomOn?.94+hash3(x+11,y+7,z+3)*.12:1;
  const sat=randomOn?(hash3(x+37,y+17,z+47)-.5)*.05:0;
  const key=[idx,gidx,Math.round(jitter*100),Math.round(sat*1000),topGrass?1:0].join(':');
  if(materialCache.has(key))return materialCache.get(key);
  const dirt=makeMaterial(dirtTextures[idx],jitter,sat);
  const top=topGrass?makeMaterial(grassTextures[gidx],clamp(jitter*1.015,.94,1.08),sat*.7):dirt;
  const edge=makeMaterial(edgeTextures[gidx],clamp(jitter*.98,.92,1.05),sat*.6);
  const set={dirt,top,edge};materialCache.set(key,set);return set;
}

const bottomMat=new THREE.MeshLambertMaterial({color:0x78472e});
const columnRecords=[];

function addColumn(x,z,h){
  const rec={x,z,h,blocks:[],cap:null,rim:null};
  for(let y=0;y<=h;y++){
    const s=materialSet(x,y,z,y===h,true);
    const mesh=new THREE.Mesh(blockGeo,[s.dirt,s.dirt,y===h?s.top:s.dirt,bottomMat,s.dirt,s.dirt]);
    mesh.position.set(x,y*.78,z);mesh.castShadow=true;mesh.receiveShadow=true;
    terrain.add(mesh);paperObjects.push(mesh);rec.blocks.push(mesh);
  }
  const s=materialSet(x,h,z,true,true);
  const rim=new THREE.Mesh(rimGeo,[s.edge,s.edge,s.edge,s.edge,s.edge,s.edge]);
  rim.position.set(x,h*.78+.386,z);rim.castShadow=true;rim.receiveShadow=true;
  terrain.add(rim);rims.push(rim);paperObjects.push(rim);
  const cap=new THREE.Mesh(capGeo,[s.edge,s.edge,s.top,s.edge,s.edge,s.edge]);
  cap.position.set(x,h*.78+.445,z);cap.castShadow=true;cap.receiveShadow=true;
  terrain.add(cap);caps.push(cap);paperObjects.push(cap);
  rec.rim=rim;rec.cap=cap;columnRecords.push(rec);
}

for(let z=-3;z<=3;z++)for(let x=-7;x<=7;x++){
  let h=0;
  if(x<-5||x>5)h=1;
  if((x<-6&&z<1)||(x>5&&z>0))h=2;
  if((x===-4||x===4)&&Math.abs(z)>1)h=1;
  if(z===3&&Math.abs(x)>2)h++;
  if((x===-2&&z===-2)||(x===3&&z===2))h++;
  addColumn(x,z,h);
}

function rebuildMaterialRandomness(on){
  materialCache.clear();
  for(const rec of columnRecords){
    rec.blocks.forEach((mesh,y)=>{
      const s=materialSet(rec.x,y,rec.z,y===rec.h,on);
      mesh.material=[s.dirt,s.dirt,y===rec.h?s.top:s.dirt,bottomMat,s.dirt,s.dirt];
    });
    const s=materialSet(rec.x,rec.h,rec.z,true,on);
    rec.rim.material=[s.edge,s.edge,s.edge,s.edge,s.edge,s.edge];
    rec.cap.material=[s.edge,s.edge,s.top,s.edge,s.edge,s.edge];
  }
}

function tuft(x,z,y,scale=.42){
  const group=new THREE.Group();
  const pm=new THREE.MeshLambertMaterial({map:grassTextures[(hash3((x*10)|0,0,(z*10)|0)*variantCount)|0],color:0x71984d,side:THREE.DoubleSide});
  for(let i=0;i<3;i++){
    const shape=new THREE.Shape();shape.moveTo(-.11,0);shape.quadraticCurveTo(0,.55,.09,0);
    const geo=new THREE.ShapeGeometry(shape,5),m=new THREE.Mesh(geo,pm);
    m.scale.setScalar(scale);m.rotation.y=i*Math.PI/3;m.castShadow=true;m.receiveShadow=true;group.add(m);
  }
  group.position.set(x,y,z);scene.add(group);
}
tuft(-3.2,-1.7,.47,.55);tuft(2.3,1.7,.47,.48);tuft(5.2,-.6,1.25,.46);tuft(-5.8,1.8,1.25,.5);

const stoneMat=new THREE.MeshLambertMaterial({color:0xa69a8d});
function stone(x,z,y,s){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),stoneMat);m.position.set(x,y,z);m.scale.y=.62;m.rotation.set(.2,.4,.1);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
stone(-1.8,1.4,.49,.26);stone(1.2,-2.2,.46,.18);

// GPU-friendly instanced paper fog cards.
// We use two InstancedMeshes (upright banks + ground sheets), update instance
// matrices at low frequency, and sample a cached scene depth texture to soften
// intersections with terrain ("soft particles" technique).

const forestMist=new THREE.Group();
scene.add(forestMist);

const fogTex=mistTexture(11);
const fogUniforms={
  map:{value:fogTex},
  tint:{value:new THREE.Color(0xe4ebe2)},
  opacity:{value:.82},
  time:{value:0},
  tDepth:{value:null},
  resolution:{value:new THREE.Vector2(1,1)},
  depthFade:{value:.0045}
};

const fogVertex=`
  varying vec2 vUv;
  void main(){
    vUv=uv;
    vec4 mvPosition=modelViewMatrix*instanceMatrix*vec4(position,1.0);
    gl_Position=projectionMatrix*mvPosition;
  }
`;

const fogFragment=`
  uniform sampler2D map;
  uniform sampler2D tDepth;
  uniform vec3 tint;
  uniform float opacity;
  uniform float time;
  uniform vec2 resolution;
  uniform float depthFade;
  varying vec2 vUv;

  void main(){
    // Gentle wind ripple inside the paper strip.
    vec2 uv=vUv;
    uv.x += sin(uv.y*10.0 + time*.55)*.008;
    uv.y += sin(uv.x*8.0 - time*.38)*.004;

    vec4 paper=texture2D(map,uv);
    float a=paper.a;

    // Visible breathing in the fibres, without becoming smoke.
    a *= .91 + .09*sin(time*.72 + uv.x*11.0);

    // Soft-particle depth fade: remove the hard card/terrain intersection.
    vec2 suv=gl_FragCoord.xy/resolution;
    float sceneDepth=texture2D(tDepth,suv).x;
    float delta=sceneDepth-gl_FragCoord.z;
    float soft=smoothstep(.00035,depthFade,max(delta,0.0));

    a *= soft*opacity;
    if(a<.025) discard;

    gl_FragColor=vec4(paper.rgb*tint,a);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

const fogMat=new THREE.ShaderMaterial({
  uniforms:fogUniforms,
  vertexShader:fogVertex,
  fragmentShader:fogFragment,
  transparent:true,
  depthWrite:false,
  depthTest:true,
  side:THREE.DoubleSide,
  toneMapped:true
});

const BANK_COUNT=18;
const GROUND_COUNT=10;
const bankGeo=new THREE.PlaneGeometry(1,1);
const groundGeo=new THREE.PlaneGeometry(1,1);
const fogBanks=new THREE.InstancedMesh(bankGeo,fogMat,BANK_COUNT);
const groundFog=new THREE.InstancedMesh(groundGeo,fogMat,GROUND_COUNT);
fogBanks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
groundFog.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
fogBanks.frustumCulled=false;groundFog.frustumCulled=false;
fogBanks.renderOrder=4;groundFog.renderOrder=5;
forestMist.add(fogBanks,groundFog);

const fogDummy=new THREE.Object3D();
const fogBankData=[];
const groundFogData=[];

function seedFogData(){
  const r=rng(99127);
  for(let i=0;i<BANK_COUNT;i++){
    const lane=i%3; // near/mid/far
    const spread=lane===0?7.5:lane===1?11.0:14.5;
    fogBankData.push({
      baseX:(r()-.5)*spread*1.8,
      baseZ: lane===0 ? 2.2+r()*1.4 : lane===1 ? -1.0+r()*2.4 : -4.5+r()*2.4,
      baseY: lane===0 ? .78+r()*.45 : lane===1 ? .92+r()*.65 : 1.05+r()*.8,
      width:(lane===0?3.8:lane===1?5.4:7.0)+r()*(lane===0?2.3:3.2),
      height:(lane===0?1.2:1.5)+r()*(lane===2?1.2:.8),
      speed:(lane===0?.22:lane===1?.13:.075)*(r()>.5?1:-1),
      phase:r()*Math.PI*2,
      bob:.035+r()*.06
    });
  }
  for(let i=0;i<GROUND_COUNT;i++){
    groundFogData.push({
      baseX:(r()-.5)*13,
      baseZ:(r()-.5)*6,
      baseY:.49+r()*.30,
      width:4.2+r()*4.4,
      depth:2.0+r()*2.8,
      speed:.055+r()*.085,
      phase:r()*Math.PI*2,
      bob:.018+r()*.035
    });
  }
}
seedFogData();

function updateFogInstances(t){
  for(let i=0;i<BANK_COUNT;i++){
    const d=fogBankData[i];
    const x=d.baseX+Math.sin(t*d.speed+d.phase)*.65;
    const y=d.baseY+Math.sin(t*.36+d.phase)*d.bob;
    const z=d.baseZ+Math.cos(t*d.speed*.43+d.phase)*.14;

    fogDummy.position.set(x,y,z);
    // Upright billboard to camera.
    const dx=camera.position.x-x,dz=camera.position.z-z;
    fogDummy.rotation.set(0,Math.atan2(dx,dz),0);
    fogDummy.scale.set(d.width,d.height,1);
    fogDummy.updateMatrix();
    fogBanks.setMatrixAt(i,fogDummy.matrix);
  }
  fogBanks.instanceMatrix.needsUpdate=true;

  for(let i=0;i<GROUND_COUNT;i++){
    const d=groundFogData[i];
    fogDummy.position.set(
      d.baseX+Math.sin(t*d.speed+d.phase)*.48,
      d.baseY+Math.sin(t*.28+d.phase)*d.bob,
      d.baseZ+Math.cos(t*d.speed*.5+d.phase)*.28
    );
    fogDummy.rotation.set(-Math.PI/2,0,Math.sin(t*.12+d.phase)*.035);
    fogDummy.scale.set(d.width,d.depth,1);
    fogDummy.updateMatrix();
    groundFog.setMatrixAt(i,fogDummy.matrix);
  }
  groundFog.instanceMatrix.needsUpdate=true;
}
updateFogInstances(0);

// Cached low-resolution scene depth for soft intersection fading.
let depthTarget=null,depthDirty=true;
function resizeDepthTarget(){
  const scale=.45;
  const drawSize=new THREE.Vector2();
  renderer.getDrawingBufferSize(drawSize);
  const w=Math.max(256,Math.floor(drawSize.x*scale));
  const h=Math.max(144,Math.floor(drawSize.y*scale));
  if(depthTarget)depthTarget.dispose();
  depthTarget=new THREE.WebGLRenderTarget(w,h,{
    minFilter:THREE.NearestFilter,
    magFilter:THREE.NearestFilter
  });
  depthTarget.depthTexture=new THREE.DepthTexture(w,h);
  depthTarget.depthTexture.type=THREE.UnsignedShortType;
  fogUniforms.tDepth.value=depthTarget.depthTexture;
  // gl_FragCoord is in the main framebuffer's pixel coordinates.
  fogUniforms.resolution.value.copy(drawSize);
  depthDirty=true;
}
resizeDepthTarget();

function updateDepthTexture(){
  if(!depthDirty||!state.fog)return;
  const mistWasVisible=forestMist.visible;
  const skyWasVisible=sky.visible;
  const sunWasVisible=sunDisc.visible;
  const moonWasVisible=moonDisc.visible;
  forestMist.visible=false;sky.visible=false;sunDisc.visible=false;moonDisc.visible=false;

  renderer.setRenderTarget(depthTarget);
  renderer.clear();
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);

  forestMist.visible=mistWasVisible;sky.visible=skyWasVisible;
  sunDisc.visible=sunWasVisible;moonDisc.visible=moonWasVisible;
  depthDirty=false;
}

// Soft fake contact shadow below the paper-doll, in addition to the real shadow map.
const sc=document.createElement('canvas');sc.width=sc.height=256;
{
  const g=sc.getContext('2d'),rg=g.createRadialGradient(128,128,8,128,128,110);
  rg.addColorStop(0,'rgba(0,0,0,.34)');rg.addColorStop(.5,'rgba(0,0,0,.15)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,256,256);
}
const contactShadow=new THREE.Mesh(
  new THREE.PlaneGeometry(1.45,.62),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false,toneMapped:false})
);
contactShadow.rotation.x=-Math.PI/2;contactShadow.position.set(0,.487,.13);scene.add(contactShadow);

let playerMesh=null,playerMat=null,playerDepthMat=null;
const playerDayTint=new THREE.Color(0xffffff);
const playerDuskTint=new THREE.Color(0xffead8);
const playerNightTint=new THREE.Color(0xc9d6ee);
const playerTintTmp=new THREE.Color();

new THREE.TextureLoader().load('./assets/player/protagonist.webp',t=>{
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());

  // The protagonist is a real paper object in the scene now: it receives
  // sunlight/moonlight, fog, tone mapping and shadows instead of glowing like UI.
  playerMat=new THREE.MeshLambertMaterial({
    map:t,
    transparent:true,
    alphaTest:.06,
    side:THREE.DoubleSide,
    color:0xffffff,
    // Matte paper should receive diffuse light, but a flat billboard has only
    // one normal. A very small texture-matched emissive term represents soft
    // sky/ground bounce so the printed character never collapses into black.
    emissive:0xffffff,
    emissiveMap:t,
    emissiveIntensity:.07,
    depthWrite:true
  });

  playerMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.12,2.24),playerMat);
  playerMesh.position.set(0,1.59,.15);
  playerMesh.castShadow=true;
  playerMesh.receiveShadow=true;

  // Make the alpha silhouette cast a proper paper-doll shadow.
  playerDepthMat=new THREE.MeshDepthMaterial({
    depthPacking:THREE.RGBADepthPacking,
    map:t,
    alphaTest:.06
  });
  playerMesh.customDepthMaterial=playerDepthMat;
  scene.add(playerMesh);
});

const hemi=new THREE.HemisphereLight(0xdceeff,0x8b6549,1.45);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe1b1,3.0);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=11;sun.shadow.camera.bottom=-8;
sun.shadow.camera.near=.1;sun.shadow.camera.far=42;sun.shadow.bias=-.0005;sun.shadow.normalBias=.025;sun.shadow.radius=3.5;
scene.add(sun);scene.add(sun.target);sun.target.position.set(0,0,0);

const moon=new THREE.DirectionalLight(0xa9c4ff,0);
moon.castShadow=true;moon.shadow.mapSize.set(512,512);
moon.shadow.camera.left=-12;moon.shadow.camera.right=12;moon.shadow.camera.top=11;moon.shadow.camera.bottom=-8;
moon.shadow.camera.near=.1;moon.shadow.camera.far=42;moon.shadow.bias=-.0004;moon.shadow.normalBias=.02;moon.shadow.radius=3;
scene.add(moon);scene.add(moon.target);moon.target.position.set(0,0,0);

// Cheap stylized ground bounce.
// The previous version used two PointLights close to the floor. Those created the
// two visible white hotspots and were expensive on every paper fragment.
// A single no-shadow DirectionalLight gives broad colour bleed with no hotspot.
const groundBounce=new THREE.DirectionalLight(0xc6cf9a,.34);
groundBounce.position.set(0,-3,6);
groundBounce.castShadow=false;
scene.add(groundBounce);scene.add(groundBounce.target);
groundBounce.target.position.set(0,1.0,0);

// Art-directed fill for a comfortable stylized game look.
// AmbientFill prevents deep blacks; viewFill is a very soft camera-side light
// so the player and terrain silhouettes stay readable without looking self-lit.
const ambientFill=new THREE.AmbientLight(0xdde8f2,.38);
scene.add(ambientFill);

const viewFill=new THREE.DirectionalLight(0xf5efe5,.24);
viewFill.castShadow=false;
scene.add(viewFill);scene.add(viewFill.target);
viewFill.target.position.copy(target);

const skyMat=new THREE.MeshBasicMaterial({map:skyTexture('day'),side:THREE.BackSide,fog:false,toneMapped:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(48,32,18),skyMat);sky.scale.y=.72;scene.add(sky);

// Visible sun/moon discs so the lighting direction reads immediately.
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(.72,40),new THREE.MeshBasicMaterial({color:0xffe5a8,toneMapped:false,transparent:true,opacity:.96}));
const moonDisc=new THREE.Mesh(new THREE.CircleGeometry(.54,40),new THREE.MeshBasicMaterial({color:0xe4ecff,toneMapped:false,transparent:true,opacity:.9}));
scene.add(sunDisc,moonDisc);

const state={sky:true,layers:true,shadow:true,fog:true,tone:true,random:true,bounce:true,final:true,timePreset:'noon',auto:false,time:.5};
let skyMode='day';

function setSkyMode(mode){
  if(mode===skyMode)return;
  skyMode=mode;
  if(skyMat.map)skyMat.map.dispose();
  skyMat.map=skyTexture(mode);skyMat.needsUpdate=true;
}
function updateLighting(t){
  state.time=((t%1)+1)%1;
  const a=state.time*Math.PI*2-Math.PI/2;
  const rawSun=Math.sin(a),sunUp=Math.max(rawSun,0),moonUp=Math.max(-rawSun,0);
  const twilight=1-smoothstep(.025,.34,Math.abs(rawSun));

  // Sun and moon still move physically around the scene, but the intensity
  // curves are deliberately art-directed: dawn/dusk/night remain readable.
  const sx=Math.cos(a)*18,sy=2.8+Math.max(rawSun,.03)*15,sz=Math.sin(a)*8;
  const ma=a+Math.PI,mx=Math.cos(ma)*18,my=3+Math.max(-rawSun,.03)*15,mz=Math.sin(ma)*8;
  sun.position.set(sx,sy,sz);moon.position.set(mx,my,mz);

  const sunWarm=new THREE.Color(0xffa96f);
  const sunDay=new THREE.Color(0xffe5bd);
  sun.color.copy(sunWarm).lerp(sunDay,smoothstep(.10,.72,sunUp));
  sun.intensity=.18+sunUp*2.55+twilight*.82;

  moon.color.set(0xb7cfff);
  moon.intensity=.08+moonUp*1.18;

  // Stronger sky/ground diffuse fill: this is intentionally more generous than
  // reality so the handmade-paper colours never collapse into black.
  hemi.intensity=.78+sunUp*.62+moonUp*.15+twilight*.18;
  const hemiDay=new THREE.Color(0xdceeff);
  const hemiNight=new THREE.Color(0x9fb8df);
  const hemiWarm=new THREE.Color(0xffd8bd);
  hemi.color.copy(hemiNight).lerp(hemiDay,Math.pow(sunUp,.45)).lerp(hemiWarm,twilight*.24);

  const groundDay=new THREE.Color(0x9c7656);
  const groundNight=new THREE.Color(0x606b7d);
  const groundWarm=new THREE.Color(0xb37b58);
  hemi.groundColor.copy(groundNight).lerp(groundDay,Math.pow(sunUp,.45)).lerp(groundWarm,twilight*.24);

  // Global fill + camera-side key keep all gameplay-critical shapes readable.
  ambientFill.intensity=.30+sunUp*.12+moonUp*.11+twilight*.08;
  const ambientDay=new THREE.Color(0xe7edf0);
  const ambientNight=new THREE.Color(0x9daccc);
  const ambientWarm=new THREE.Color(0xffd9c1);
  ambientFill.color.copy(ambientNight).lerp(ambientDay,Math.pow(sunUp,.4)).lerp(ambientWarm,twilight*.18);

  viewFill.intensity=.16+(1-sunUp)*.20+twilight*.12;
  const viewDay=new THREE.Color(0xf7f0e6);
  const viewNight=new THREE.Color(0xa9bfe4);
  const viewWarm=new THREE.Color(0xffc9aa);
  viewFill.color.copy(viewNight).lerp(viewDay,Math.pow(sunUp,.5)).lerp(viewWarm,twilight*.34);

  const horizonDay=new THREE.Color(0xb9d9e2);
  const horizonNight=new THREE.Color(0x667d9b);
  const horizonWarm=new THREE.Color(0xe6c2a4);
  const fogColor=horizonNight.clone().lerp(horizonDay,Math.pow(sunUp,.38)).lerp(horizonWarm,twilight*.38);

  // Forest air: exponential distance haze gives a softer "air volume" than
  // a hard linear start/end fog. Keep it stylized and readable.
  if(state.fog){
    const density=.030+twilight*.008+moonUp*.006;
    scene.fog=new THREE.FogExp2(fogColor,density);
  }

  const mistDay=new THREE.Color(0xe4ece3);
  const mistNight=new THREE.Color(0xb6c8da);
  const mistWarm=new THREE.Color(0xecd8c1);
  const mistColor=mistNight.clone().lerp(mistDay,Math.pow(sunUp,.42)).lerp(mistWarm,twilight*.30);
  fogUniforms.tint.value.copy(mistColor);
  fogUniforms.opacity.value=.78+twilight*.08+moonUp*.05;

  // Narrow exposure range = comfortable stylized game image instead of
  // physically dark dawn/night.
  renderer.toneMappingExposure=state.tone?(.90+sunUp*.12+twilight*.045):1;
  scene.background.copy(fogColor);

  let mode='night';
  if(sunUp>.30)mode='day';
  else if(rawSun>=0)mode=state.time<.5?'dawn':'sunset';
  setSkyMode(mode);

  const sunDir=new THREE.Vector3(sx,sy,sz).normalize();
  const moonDir=new THREE.Vector3(mx,my,mz).normalize();
  sunDisc.position.copy(camera.position).addScaledVector(sunDir,34);
  moonDisc.position.copy(camera.position).addScaledVector(moonDir,34);
  sunDisc.lookAt(camera.position);moonDisc.lookAt(camera.position);
  sunDisc.visible=state.sky&&rawSun>-0.08;moonDisc.visible=state.sky&&rawSun<0.12;
  sunDisc.material.opacity=.72+sunUp*.26;moonDisc.material.opacity=.72+moonUp*.22;

  if(playerMat){
    const dayAmount=smoothstep(.02,.68,sunUp);
    playerTintTmp.copy(playerNightTint).lerp(playerDayTint,dayAmount);
    if(twilight>0)playerTintTmp.lerp(playerDuskTint,twilight*.32);
    playerMat.color.copy(playerTintTmp);

    // Only a tiny safety floor remains; readable brightness now mainly comes
    // from world diffuse fill + terrain bounce.
    playerMat.emissiveIntensity=.012+(1-sunUp)*.018;
  }

  // Broad ground colour bleed: intentionally subtle and uniform so it reads
  // as reflected environment light rather than a lamp shining on the floor.
  const bounceDay=.22+sunUp*.28+twilight*.10;
  const bounceNight=moonUp*.16;
  groundBounce.intensity=state.bounce?(bounceDay+bounceNight):0;
  const bounceDayColor=new THREE.Color(0xc8d49b);
  const bounceNightColor=new THREE.Color(0x91a7c8);
  const bounceWarmColor=new THREE.Color(0xd3a47b);
  groundBounce.color.copy(bounceNightColor).lerp(bounceDayColor,Math.pow(sunUp,.45)).lerp(bounceWarmColor,twilight*.18);

  if(contactShadow?.material){
    // Never crush the feet into a black blob at dawn/night.
    contactShadow.material.opacity=.25+sunUp*.32+moonUp*.08+twilight*.06;
  }
  renderDirty=true;
  shadowDirty=true;
}
function preset(name){
  state.auto=false;document.getElementById('cycle').classList.remove('active');
  state.timePreset=name;
  if(name==='dawn')state.time=.27;
  else if(name==='sunset')state.time=.73;
  else if(name==='night')state.time=.0;
  else state.time=.5;
  updateLighting(state.time);syncButtons();renderDirty=true;shadowDirty=true;
}
function syncButtons(){
  sky.visible=state.sky;contactShadow.visible=state.shadow;forestMist.visible=state.fog;
  caps.forEach(c=>c.visible=state.layers);rims.forEach(r=>r.visible=state.layers);
  renderer.shadowMap.enabled=state.shadow;
  // Only one shadow-casting directional light at a time.
  const sunIsDominant=state.time>.18&&state.time<.82;
  sun.castShadow=state.shadow&&sunIsDominant;
  moon.castShadow=state.shadow&&!sunIsDominant;
  shadowDirty=true;
  if(!state.fog)scene.fog=null;
  renderer.toneMapping=state.tone?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
  ['sky','layers','shadow','fog','tone','random','bounce'].forEach(id=>document.getElementById(id).classList.toggle('active',state[id]));
  document.getElementById('compare').classList.toggle('active',state.final);
  document.getElementById('compare').textContent=state.final?'目标效果':'基础方块';
  ['dawn','noon','sunset','night'].forEach(id=>document.getElementById(id).classList.toggle('active',state.timePreset===id&&!state.auto));
}
function setFinal(v){
  state.final=v;state.sky=v;state.layers=v;state.shadow=v;state.fog=v;state.tone=v;state.random=v;state.bounce=v;
  depthDirty=true;
  rebuildMaterialRandomness(v);
  if(v){updateLighting(state.time)}
  else{
    state.auto=false;document.getElementById('cycle').classList.remove('active');
    scene.background.set(0xaaa5b1);scene.fog=null;hemi.intensity=1;sun.intensity=2.0;moon.intensity=0;groundBounce.intensity=0;ambientFill.intensity=.18;viewFill.intensity=.10;
    renderer.toneMapping=THREE.NoToneMapping;renderer.toneMappingExposure=1;
  }
  syncButtons();
}
document.getElementById('compare').onclick=()=>{setFinal(!state.final);renderDirty=true;shadowDirty=true};
['sky','layers','shadow','fog','tone'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    state[id]=!state[id];if(id==='layers')depthDirty=true;
    state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce;
    updateLighting(state.time);syncButtons();renderDirty=true;shadowDirty=true;
  };
});
document.getElementById('random').onclick=()=>{
  state.random=!state.random;rebuildMaterialRandomness(state.random);
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce;syncButtons();renderDirty=true;shadowDirty=true;
};
document.getElementById('bounce').onclick=()=>{
  state.bounce=!state.bounce;
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce;
  updateLighting(state.time);syncButtons();
};
document.getElementById('dawn').onclick=()=>preset('dawn');
document.getElementById('noon').onclick=()=>preset('noon');
document.getElementById('sunset').onclick=()=>preset('sunset');
document.getElementById('night').onclick=()=>preset('night');
document.getElementById('cycle').onclick=()=>{
  state.auto=!state.auto;document.getElementById('cycle').classList.toggle('active',state.auto);
  if(state.auto)state.timePreset='';syncButtons();renderDirty=true;shadowDirty=true;
};

let dragging=false,lastX=0,lastY=0,renderDirty=true,autoShadowFrame=0,lastMistTick=0,mistClock=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastX)*.006;pitch=clamp(pitch+(e.clientY-lastY)*.004,.08,.62);
  lastX=e.clientX;lastY=e.clientY;placeCamera();renderDirty=true;shadowDirty=true;depthDirty=true;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.012,10,27);placeCamera();renderDirty=true;shadowDirty=true;depthDirty=true},{passive:true});
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));resizeDepthTarget();renderDirty=true;shadowDirty=true;depthDirty=true;
});

let prev=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;

  if(state.auto){
    state.time=(state.time+dt/48)%1;
    updateLighting(state.time);
    // Updating a 1k shadow map every frame is wasteful. In auto-cycle mode
    // refresh it at ~7.5 fps; the colour/sky motion still renders smoothly.
    autoShadowFrame=(autoShadowFrame+1)%8;
    if(autoShadowFrame!==0)shadowDirty=false;
  }

  // Dynamic paper fog: ~20 fps motion is enough to read clearly and stays light.
  if(state.fog&&now-lastMistTick>50){
    const step=(now-lastMistTick)/1000;
    lastMistTick=now;mistClock+=Math.min(.12,step);
    fogUniforms.time.value=mistClock;
    updateFogInstances(mistClock);
    renderDirty=true;
  }

  if(!state.auto&&!renderDirty)return;

  sky.position.copy(camera.position);

  if(playerMesh){
    const dx=camera.position.x-playerMesh.position.x;
    const dz=camera.position.z-playerMesh.position.z;
    playerMesh.rotation.y=Math.atan2(dx,dz);

    const len=Math.max(.001,Math.hypot(dx,dz));
    const fx=dx/len,fz=dz/len;
    groundBounce.position.set(
      playerMesh.position.x+fx*4,
      -3,
      playerMesh.position.z+fz*4
    );
    groundBounce.target.position.set(playerMesh.position.x,1.1,playerMesh.position.z);
  }

  viewFill.position.copy(camera.position);
  viewFill.target.position.set(0,1.1,0);

  if(state.shadow&&shadowDirty){
    renderer.shadowMap.needsUpdate=true;
    shadowDirty=false;
  }

  updateDepthTexture();
  renderer.render(scene,camera);
  renderDirty=false;
}
updateLighting(.5);syncButtons();animate(performance.now());
</script>
