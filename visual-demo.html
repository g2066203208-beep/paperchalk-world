<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fb5c8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#3b2d23}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:5;left:18px;top:18px;max-width:min(560px,calc(100vw - 36px));padding:14px 16px;border:2px solid rgba(94,67,46,.52);border-radius:18px;background:rgba(244,231,199,.92);box-shadow:0 7px 0 rgba(76,55,41,.18),0 18px 36px rgba(43,31,23,.12);backdrop-filter:blur(8px)}
.panel h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}.panel p{margin:0;font-size:12px;line-height:1.5;opacity:.76}
.controls{position:fixed;z-index:6;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(780px,calc(100vw - 32px))}
button{appearance:none;border:2px solid rgba(89,63,42,.42);background:#f3e5c2;color:#453326;font-weight:700;padding:10px 13px;border-radius:14px;box-shadow:0 4px 0 rgba(77,54,37,.16);cursor:pointer;font-size:13px}
button.active{background:#5f5142;color:#fff3cf;border-color:#e8c65c}
.groupBreak{flex-basis:100%;height:0}
.badge{position:fixed;z-index:6;left:18px;bottom:18px;padding:8px 12px;border-radius:999px;background:rgba(47,39,32,.72);color:#fff7e6;font-size:12px;backdrop-filter:blur(6px)}
.sunPanel{position:fixed;z-index:7;right:16px;top:18px;width:min(300px,calc(100vw - 32px));padding:11px 12px;border:2px solid rgba(89,63,42,.38);border-radius:16px;background:rgba(244,231,199,.92);box-shadow:0 5px 0 rgba(77,54,37,.13),0 14px 30px rgba(43,31,23,.10);backdrop-filter:blur(8px)}
.sunPanel .title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:13px;font-weight:800}
.sunPanel .sunRow{display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:7px;margin:6px 0;font-size:12px}
.sunPanel input[type="range"]{width:100%;accent-color:#c58c34}
.sunPanel .sunVal{font-variant-numeric:tabular-nums;text-align:right;font-weight:750}
.sunPanel button{width:100%;margin-top:5px;padding:7px 9px;font-size:11px;border-radius:11px}
@media(max-width:720px){.panel{left:10px;top:10px;padding:11px 12px;max-width:calc(100vw - 150px)}.panel h1{font-size:16px}.panel p{font-size:10px}.controls{right:10px;bottom:10px;gap:6px}button{padding:9px 10px;font-size:12px}.badge{display:none}.sunPanel{right:10px;top:10px;width:132px;padding:8px}.sunPanel .title{font-size:11px}.sunPanel .sunRow{grid-template-columns:1fr;gap:2px;margin:4px 0}.sunPanel .sunVal{text-align:left;font-size:10px}.sunPanel button{font-size:10px;padding:6px}.sunPanel input[type="range"]{width:100%}}
</style>
</head>
<body>
<div class="panel">
  <h1>纸艺世界视觉 Demo v13</h1>
  <p>深林清晰体积光 v13：保留树缝光束，但降低全局空气泛白。体积介质只集中在树林到前景的湿润空气带，并改成“透射率 + 入射散射”合成；弱散射会被压掉，只有真正穿过树缝的光束明显发亮。</p>
</div>
<div class="sunPanel">
  <div class="title"><span>太阳光方向</span><span id="sunMode">跟随昼夜</span></div>
  <div class="sunRow">
    <span>左右方向</span>
    <input id="sunAzimuth" type="range" min="-75" max="75" step="1" value="-36">
    <span id="sunAzimuthVal" class="sunVal">-36°</span>
  </div>
  <div class="sunRow">
    <span>高度角</span>
    <input id="sunElevation" type="range" min="5" max="60" step="1" value="13">
    <span id="sunElevationVal" class="sunVal">13°</span>
  </div>
  <button id="sunFollow">恢复跟随昼夜</button>
</div>
<div class="controls">
  <button id="compare" class="active">目标效果</button>

  <button id="layers" class="active">纸层厚度</button>
  <button id="shadow" class="active">软阴影</button>
  <button id="fog" class="active">动态纸雾</button>
  <button id="tone" class="active">统一色调</button>
  <button id="random" class="active">随机材质</button>
  <button id="bounce" class="active">地面反射光</button>
  <button id="papergrass" class="active">剪纸小草</button>
  <button id="godrays" class="active">清晰体积光</button>
  <div class="groupBreak"></div>
  <button id="dawn" class="active">清晨</button>
  <button id="noon">正午</button>
  <button id="sunset">黄昏</button>
  <button id="night">夜晚</button>
  <button id="cycle">自动昼夜</button>
</div>
<div class="badge">拖动旋转 · 滚轮缩放 · Shadow-map Raymarch 体积散射</div>

<script type="module">
import * as THREE from './vendor/three/three.module.js';

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
let shadowDirty=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ca1ad);
scene.fog=new THREE.Fog(0xaec8d3,15,36);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
const target=new THREE.Vector3(0,1.75,-.35);
let yaw=.02,pitch=.18,dist=19.2;
function placeCamera(){
  camera.position.set(
    target.x+Math.sin(yaw)*Math.cos(pitch)*dist,
    target.y+Math.sin(pitch)*dist,
    target.z+Math.cos(yaw)*Math.cos(pitch)*dist
  );
  camera.lookAt(target);
}
placeCamera();

function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function hash3(x,y,z){
  let h=(Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,2246822519))>>>0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967295;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smoothstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}

function paperTexture(base,variants,seed,side,version=0){
  const size=512,c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d'),r=rng(seed+version*9973);
  g.fillStyle=base;g.fillRect(0,0,size,size);

  // Large torn-paper patches: the important non-repeating macro structure.
  for(let i=0;i<(side?88:62);i++){
    const cx=r()*size,cy=r()*size,w=38+r()*(side?125:185),h=24+r()*(side?95:145);
    const col=variants[(r()*variants.length)|0];
    g.globalAlpha=side?.27:.18;g.fillStyle=col;g.beginPath();
    const n=16;
    for(let j=0;j<n;j++){
      const a=Math.PI*2*j/n,rr=1+(r()-.5)*.25;
      const px=cx+Math.cos(a)*w*.5*rr,py=cy+Math.sin(a)*h*.5*rr;
      if(j===0)g.moveTo(px,py);else g.lineTo(px,py);
    }
    g.closePath();g.fill();
  }
  g.globalAlpha=1;

  // Pulp/fibre detail. Side stock is coarser than the top sheet.
  for(let i=0;i<(side?2400:1550);i++){
    const x=r()*size,y=r()*size,len=.9+r()*(side?9:6.5),a=r()*Math.PI;
    g.strokeStyle=r()>.52?'rgba(255,244,213,.14)':'rgba(59,39,27,.09)';
    g.lineWidth=.38+r()*(side?.9:.65);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }

  for(let i=0;i<(side?300:210);i++){
    const dark=r()>.55;
    g.fillStyle=dark?'rgba(53,37,24,.13)':'rgba(255,248,225,.08)';
    const q=.35+r()*(side?1.35:1.0);g.fillRect(r()*size,r()*size,q,q);
  }

  if(side){
    // Faint compressed cardboard strata, intentionally irregular.
    let yy=20+r()*20;
    while(yy<size){
      g.fillStyle='rgba(255,236,200,.055)';g.fillRect(0,yy,size,1+r()*2);
      g.fillStyle='rgba(78,43,26,.045)';g.fillRect(0,yy+3,size,1);
      yy+=44+r()*38;
    }
  }

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}

function skyTexture(mode='day'){
  const w=1024,h=512,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),r=rng(mode==='night'?4721:mode==='sunset'?8813:mode==='dawn'?6113:9173);
  const grad=g.createLinearGradient(0,0,0,h);
  if(mode==='night'){grad.addColorStop(0,'#1c2b46');grad.addColorStop(.55,'#314765');grad.addColorStop(1,'#536b83')}
  else if(mode==='sunset'){grad.addColorStop(0,'#5475a4');grad.addColorStop(.5,'#91b7d1');grad.addColorStop(1,'#e1b88f')}
  else if(mode==='dawn'){grad.addColorStop(0,'#718db6');grad.addColorStop(.5,'#a6c2d8');grad.addColorStop(1,'#ded0bb')}
  else{grad.addColorStop(0,'#73a8cf');grad.addColorStop(.58,'#91bed9');grad.addColorStop(1,'#bdd8df')}
  g.fillStyle=grad;g.fillRect(0,0,w,h);

  // Large overlapping handmade-paper sheets, but still quiet enough for sky.
  for(let band=0;band<8;band++){
    const y=band*(h/7)-34+r()*38;
    g.fillStyle=band%3===0?'rgba(225,239,241,.11)':band%3===1?'rgba(62,121,163,.075)':'rgba(247,241,225,.055)';
    g.beginPath();g.moveTo(-50,y);
    for(let x=-50;x<=w+60;x+=38)g.lineTo(x,y+(r()-.5)*25);
    g.lineTo(w+60,y+74+r()*50);
    for(let x=w+60;x>=-50;x-=38)g.lineTo(x,y+82+(r()-.5)*21);
    g.closePath();g.fill();
  }
  for(let i=0;i<3300;i++){
    const x=r()*w,y=r()*h,len=.8+r()*6,a=r()*Math.PI;
    g.strokeStyle=r()>.5?'rgba(255,255,245,.105)':'rgba(30,73,105,.065)';
    g.lineWidth=.4+r()*.55;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.anisotropy=4;return t;
}

function mistTexture(seed=1){
  const w=512,h=192,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),r=rng(7400+seed*131);
  g.clearRect(0,0,w,h);

  // One strong torn-paper silhouette plus one lighter offset layer.
  for(let s=0;s<2;s++){
    const top=28+s*30+r()*8;
    const thickness=74+r()*34;
    const bottom=top+thickness;

    g.beginPath();
    g.moveTo(-24,top);
    for(let x=-24;x<=w+24;x+=16){
      const y=top+(r()-.5)*18+Math.sin((x+seed*37)*.034)*5;
      g.lineTo(x,y);
    }
    for(let x=w+24;x>=-24;x-=16){
      const y=bottom+(r()-.5)*20+Math.sin((x+seed*19)*.029)*6;
      g.lineTo(x,y);
    }
    g.closePath();

    const grad=g.createLinearGradient(0,top,0,bottom);
    const a=s===0?.88:.62;
    grad.addColorStop(0,'rgba(255,255,248,'+(a*.68).toFixed(3)+')');
    grad.addColorStop(.18,'rgba(252,253,247,'+a.toFixed(3)+')');
    grad.addColorStop(.74,'rgba(236,245,239,'+(a*.94).toFixed(3)+')');
    grad.addColorStop(1,'rgba(205,221,214,'+(a*.60).toFixed(3)+')');
    g.fillStyle=grad;g.fill();

    // Paper underside/edge.
    g.strokeStyle='rgba(91,112,104,.25)';
    g.lineWidth=1.6+s*.5;g.stroke();

    g.save();g.clip();
    for(let i=0;i<320;i++){
      const x=r()*w,y=top+r()*thickness,len=2+r()*11,a2=r()*Math.PI;
      g.strokeStyle=r()>.5?'rgba(255,255,255,.24)':'rgba(78,100,91,.14)';
      g.lineWidth=.45+r()*.75;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a2)*len,y+Math.sin(a2)*len);g.stroke();
    }
    for(let i=0;i<54;i++){
      g.fillStyle=r()>.5?'rgba(255,255,255,.13)':'rgba(66,88,80,.10)';
      const q=.8+r()*3.2;g.fillRect(r()*w,top+r()*thickness,q,q);
    }
    g.restore();
  }

  // Fade only at horizontal ends; keep the torn top/bottom crisp.
  const sideFade=g.createLinearGradient(0,0,w,0);
  sideFade.addColorStop(0,'rgba(255,255,255,0)');
  sideFade.addColorStop(.045,'rgba(255,255,255,1)');
  sideFade.addColorStop(.955,'rgba(255,255,255,1)');
  sideFade.addColorStop(1,'rgba(255,255,255,0)');
  g.globalCompositeOperation='destination-in';
  g.fillStyle=sideFade;g.fillRect(0,0,w,h);
  g.globalCompositeOperation='source-over';

  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

const variantCount=6;
const grassTextures=[],edgeTextures=[],dirtTextures=[];
for(let i=0;i<variantCount;i++){
  grassTextures.push(paperTexture('#accb74',['#c0d987','#92b961','#b7d47a','#9fc36b','#a5c96f'],731,false,i));
  edgeTextures.push(paperTexture('#98b95d',['#aecf6e','#86a950','#a2c568','#91b357'],381,false,i));
  dirtTextures.push(paperTexture('#aa693f',['#c18150','#935431','#b97548','#cb8a5a','#a55f39'],991,true,i));
}

const blockGeo=new THREE.BoxGeometry(1,.78,1);
const rimGeo=new THREE.BoxGeometry(1.035,.035,1.035);
const capGeo=new THREE.BoxGeometry(1.055,.085,1.055);
const terrain=new THREE.Group();scene.add(terrain);
const caps=[],rims=[],paperObjects=[];
const materialCache=new Map();

function makeMaterial(tex,tint=1,sat=0){
  const m=new THREE.MeshLambertMaterial({map:tex});
  m.color.setRGB(tint,tint,tint);m.color.offsetHSL(0,sat,0);
  return m;
}
function materialSet(x,y,z,topGrass=true,randomOn=true){
  const rv=randomOn?hash3(x,y,z):.22;
  const gv=randomOn?hash3(x+91,y+31,z+61):.22;
  const idx=Math.min(variantCount-1,Math.floor(rv*variantCount));
  const gidx=Math.min(variantCount-1,Math.floor(gv*variantCount));
  const jitter=randomOn?.94+hash3(x+11,y+7,z+3)*.12:1;
  const sat=randomOn?(hash3(x+37,y+17,z+47)-.5)*.05:0;
  const key=[idx,gidx,Math.round(jitter*100),Math.round(sat*1000),topGrass?1:0].join(':');
  if(materialCache.has(key))return materialCache.get(key);
  const dirt=makeMaterial(dirtTextures[idx],jitter,sat);
  const top=topGrass?makeMaterial(grassTextures[gidx],clamp(jitter*1.015,.94,1.08),sat*.7):dirt;
  const edge=makeMaterial(edgeTextures[gidx],clamp(jitter*.98,.92,1.05),sat*.6);
  const set={dirt,top,edge};materialCache.set(key,set);return set;
}

const bottomMat=new THREE.MeshLambertMaterial({color:0x78472e});
const columnRecords=[];

function addColumn(x,z,h){
  const rec={x,z,h,blocks:[],cap:null,rim:null};
  for(let y=0;y<=h;y++){
    const s=materialSet(x,y,z,y===h,true);
    const mesh=new THREE.Mesh(blockGeo,[s.dirt,s.dirt,y===h?s.top:s.dirt,bottomMat,s.dirt,s.dirt]);
    mesh.position.set(x,y*.78,z);mesh.castShadow=true;mesh.receiveShadow=true;
    terrain.add(mesh);paperObjects.push(mesh);rec.blocks.push(mesh);
  }
  const s=materialSet(x,h,z,true,true);
  const rim=new THREE.Mesh(rimGeo,[s.edge,s.edge,s.edge,s.edge,s.edge,s.edge]);
  rim.position.set(x,h*.78+.386,z);rim.castShadow=true;rim.receiveShadow=true;
  terrain.add(rim);rims.push(rim);paperObjects.push(rim);
  const cap=new THREE.Mesh(capGeo,[s.edge,s.edge,s.top,s.edge,s.edge,s.edge]);
  cap.position.set(x,h*.78+.445,z);cap.castShadow=true;cap.receiveShadow=true;
  terrain.add(cap);caps.push(cap);paperObjects.push(cap);
  rec.rim=rim;rec.cap=cap;columnRecords.push(rec);
}

for(let z=-3;z<=3;z++)for(let x=-7;x<=7;x++){
  let h=0;
  if(x<-5||x>5)h=1;
  if((x<-6&&z<1)||(x>5&&z>0))h=2;
  if((x===-4||x===4)&&Math.abs(z)>1)h=1;
  if(z===3&&Math.abs(x)>2)h++;
  if((x===-2&&z===-2)||(x===3&&z===2))h++;
  addColumn(x,z,h);
}

function rebuildMaterialRandomness(on){
  materialCache.clear();
  for(const rec of columnRecords){
    rec.blocks.forEach((mesh,y)=>{
      const s=materialSet(rec.x,y,rec.z,y===rec.h,on);
      mesh.material=[s.dirt,s.dirt,y===rec.h?s.top:s.dirt,bottomMat,s.dirt,s.dirt];
    });
    const s=materialSet(rec.x,rec.h,rec.z,true,on);
    rec.rim.material=[s.edge,s.edge,s.edge,s.edge,s.edge,s.edge];
    rec.cap.material=[s.edge,s.edge,s.top,s.edge,s.edge,s.edge];
  }
}

// Cut-paper grass: each clump is one hand-cut silhouette from a paper sheet.
// Two crossed sheets plus a dark offset backing make the paper thickness readable.
function cutGrassGeometry(){
  const s=new THREE.Shape();
  s.moveTo(-.36,0);
  s.lineTo(-.32,.12);
  s.lineTo(-.29,.40);
  s.lineTo(-.24,.58);
  s.lineTo(-.19,.22);
  s.lineTo(-.14,.34);
  s.lineTo(-.10,.78);
  s.lineTo(-.045,.91);
  s.lineTo(-.01,.36);
  s.lineTo(.035,.24);
  s.lineTo(.075,.63);
  s.lineTo(.12,.73);
  s.lineTo(.155,.31);
  s.lineTo(.21,.20);
  s.lineTo(.255,.48);
  s.lineTo(.30,.57);
  s.lineTo(.315,.24);
  s.lineTo(.38,.12);
  s.lineTo(.34,0);
  s.closePath();
  const geo=new THREE.ShapeGeometry(s,2);
  geo.translate(0,0,0);
  return geo;
}

const paperGrassGroup=new THREE.Group();
scene.add(paperGrassGroup);

const grassCutGeo=cutGrassGeometry();
const grassFrontMat=new THREE.MeshLambertMaterial({
  map:grassTextures[1],
  color:0xa8c970,
  side:THREE.DoubleSide,
  transparent:false
});
const grassEdgeMat=new THREE.MeshLambertMaterial({
  color:0x5d713f,
  side:THREE.DoubleSide
});

const grassSpots=[
  [-3.30,-1.70,.49,.63,.10],[-2.25,.95,.49,.50,.68],[-1.55,1.90,.49,.45,1.30],
  [-.75,-2.18,.49,.48,2.05],[1.20,-2.05,.49,.43,.35],[2.35,1.72,.49,.58,1.05],
  [3.42,-1.45,.49,.47,2.45],[4.55,.85,.49,.44,.82],
  [-5.72,1.55,1.27,.60,.25],[-5.45,-1.65,1.27,.48,1.54],
  [5.42,-.72,1.27,.54,.95],[5.65,1.72,1.27,.50,2.20],
  [-4.05,2.30,1.27,.46,.42],[4.08,2.22,1.27,.52,1.76],
  [-6.55,2.18,2.05,.45,.72],[6.38,1.52,2.05,.44,2.48]
];

const GRASS_PLANES=grassSpots.length*2;
const grassFront=new THREE.InstancedMesh(grassCutGeo,grassFrontMat,GRASS_PLANES);
const grassEdge=new THREE.InstancedMesh(grassCutGeo,grassEdgeMat,GRASS_PLANES);
grassFront.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
grassEdge.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
grassFront.castShadow=true;grassFront.receiveShadow=true;
grassEdge.castShadow=true;grassEdge.receiveShadow=true;
grassFront.frustumCulled=false;grassEdge.frustumCulled=false;
paperGrassGroup.add(grassEdge,grassFront);

const grassDummy=new THREE.Object3D();
const grassBladeData=[];
{
  let idx=0;
  for(let s=0;s<grassSpots.length;s++){
    const [x,z,y,scale,baseAngle]=grassSpots[s];
    for(let layer=0;layer<2;layer++){
      const angle=baseAngle+layer*(Math.PI*.47);
      const sc=scale*(layer===0?1:.82);
      grassBladeData.push({x,z,y,scale:sc,angle,phase:s*.73+layer*1.3});
      const nx=Math.sin(angle),nz=Math.cos(angle);

      grassDummy.position.set(x,y,z);
      grassDummy.rotation.set(0,angle,0);
      grassDummy.scale.set(sc,sc,sc);
      grassDummy.updateMatrix();
      grassFront.setMatrixAt(idx,grassDummy.matrix);

      // A tiny offset behind the green sheet reads as the darker cut-paper edge.
      grassDummy.position.set(x-nx*.018,y-.008,z-nz*.018);
      grassDummy.updateMatrix();
      grassEdge.setMatrixAt(idx,grassDummy.matrix);
      idx++;
    }
  }
  grassFront.instanceMatrix.needsUpdate=true;
  grassEdge.instanceMatrix.needsUpdate=true;
}

function updatePaperGrass(t){
  for(let i=0;i<grassBladeData.length;i++){
    const d=grassBladeData[i];
    // Very restrained paper-card sway: the clump remains visibly rigid/cut-out.
    const sway=Math.sin(t*.72+d.phase)*.035;
    const angle=d.angle+sway;
    const nx=Math.sin(angle),nz=Math.cos(angle);

    grassDummy.position.set(d.x,d.y,d.z);
    grassDummy.rotation.set(0,angle,Math.sin(t*.54+d.phase)*.018);
    grassDummy.scale.set(d.scale,d.scale,d.scale);
    grassDummy.updateMatrix();
    grassFront.setMatrixAt(i,grassDummy.matrix);

    grassDummy.position.set(d.x-nx*.018,d.y-.008,d.z-nz*.018);
    grassDummy.updateMatrix();
    grassEdge.setMatrixAt(i,grassDummy.matrix);
  }
  grassFront.instanceMatrix.needsUpdate=true;
  grassEdge.instanceMatrix.needsUpdate=true;
}

  uniform sampler2D map;

  uniform float opacity;
  uniform float time;
  uniform vec2 resolution;
  uniform float depthFade;
  varying vec2 vUv;

  void main(){

    vec2 uv=vUv;
    uv.x += sin(uv.y*10.0 + time*.55)*.008;
    uv.y += sin(uv.x*8.0 - time*.38)*.004;

    float a=paper.a;

    a *= .91 + .09*sin(time*.72 + uv.x*11.0);

    gl_FragColor=vec4(paper.rgb*tint,a);

    #include <colorspace_fragment>

// Real shadow-map raymarched volumetric light.
// Core technique follows the open-source goodGodRays approach:
// reconstruct a world-space camera ray from depth, march through the atmosphere,
// project every sample into a light-space depth map, and accumulate scattering
// only when the sample is actually visible from the sun/moon.
// ---------------------------------------------------------------------------
const fsCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const VOLUME_SHADOW_SIZE=512;

const volumeShadowMatrix=new THREE.Matrix4();
const volumeLightTarget=new THREE.Vector3(0,1.0,.6);
const volumeActiveLightPos=new THREE.Vector3();

const volumeDepthMat=new THREE.MeshBasicMaterial({side:THREE.DoubleSide});
volumeDepthMat.colorWrite=false;
volumeDepthMat.depthWrite=true;
volumeDepthMat.depthTest=true;

const volumeUniforms={
  sceneDepth:{value:null},
  lightDepth:{value:null},
  cameraProjectionInv:{value:new THREE.Matrix4()},
  cameraMatrixWorld:{value:new THREE.Matrix4()},
  lightMatrix:{value:new THREE.Matrix4()},
  cameraPos:{value:new THREE.Vector3()},
  lightDir:{value:new THREE.Vector3(0,-1,0)},
  scatteringColor:{value:new THREE.Color(0xffe6ad)},
  density:{value:.018},
  intensity:{value:.56},
  maxDistance:{value:46.0},
  time:{value:0},
  shadowBias:{value:.0022},
  steps:{value:22.0}
};

const volumeMat=new THREE.ShaderMaterial({
  uniforms:volumeUniforms,
  depthWrite:false,depthTest:false,toneMapped:false,
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D sceneDepth;
    uniform sampler2D lightDepth;
    uniform mat4 cameraProjectionInv;
    uniform mat4 cameraMatrixWorld;
    uniform mat4 lightMatrix;
    uniform vec3 cameraPos;
    uniform vec3 lightDir;
    uniform vec3 scatteringColor;
    uniform float density;
    uniform float intensity;
    uniform float maxDistance;
    uniform float time;
    uniform float shadowBias;
    uniform float steps;

    float hash12(vec2 p){
      vec3 p3=fract(vec3(p.xyx)*.1031);
      p3+=dot(p3,p3.yzx+33.33);
      return fract((p3.x+p3.y)*p3.z);
    }

    vec3 worldFromDepth(vec2 uv,float depth){
      vec4 clip=vec4(uv*2.0-1.0,depth*2.0-1.0,1.0);
      vec4 view=cameraProjectionInv*clip;
      view/=max(view.w,1e-6);
      return (cameraMatrixWorld*view).xyz;
    }

    float shadowVisibility(vec3 worldPos){
      vec4 lp=lightMatrix*vec4(worldPos,1.0);
      vec3 ndc=lp.xyz/max(lp.w,1e-6);
      vec3 uvz=ndc*.5+.5;
      if(uvz.x<=0.0||uvz.x>=1.0||uvz.y<=0.0||uvz.y>=1.0||uvz.z<=0.0||uvz.z>=1.0){
        return 0.0;
      }
      float blocker=texture2D(lightDepth,uvz.xy).x;
      return step(uvz.z-shadowBias,blocker);
    }

    void main(){
      float depth=texture2D(sceneDepth,vUv).x;
      vec3 endPos=worldFromDepth(vUv,depth);
      vec3 ray=endPos-cameraPos;
      float fullDist=length(ray);
      if(fullDist<.001){gl_FragColor=vec4(0.0,0.0,0.0,1.0);return;}

      vec3 dir=ray/fullDist;
      float rayDist=min(fullDist,maxDistance);
      float stepLen=rayDist/max(steps,1.0);
      float jitter=fract(hash12(gl_FragCoord.xy)+time*.071);

      float scatterAccum=0.0;
      float extinctionAccum=0.0;

      for(int i=0;i<32;i++){
        if(float(i)>=steps)break;

        float t=(float(i)+jitter)*stepLen;
        vec3 p=cameraPos+dir*t;
        float visible=shadowVisibility(p);

        // Keep the foreground and upper air clear. Most participating medium
        // exists from the background forest through the lower play space.
        float lowMist=1.0-smoothstep(.55,5.8,p.y);
        float forestEntry=smoothstep(-16.0,-10.5,p.z);
        float foregroundExit=1.0-smoothstep(4.0,9.0,p.z);
        float corridor=forestEntry*foregroundExit;
        float localDensity=density*(.045+.955*lowMist)*corridor;

        float nearFade=smoothstep(1.0,3.5,t);

        // Strong forward scattering makes actual tree-gap shafts pop without
        // raising the brightness of the entire image.
        float cosTheta=clamp(dot(dir,-normalize(lightDir)),-1.0,1.0);
        float phase=.34+.66*pow(max(cosTheta,0.0),4.5);

        scatterAccum+=visible*localDensity*stepLen*nearFade*phase;
        extinctionAccum+=localDensity*stepLen*.16;
      }

      // Kill weak uniform haze; preserve stronger continuous shafts.
      float scatter=(1.0-exp(-scatterAccum*2.45))*intensity;
      scatter=max(scatter-.022,0.0)*1.18;

      // Store transmittance separately from in-scattering.
      float transmittance=exp(-extinctionAccum);
      gl_FragColor=vec4(scatteringColor*scatter,transmittance);
    }
  `
});
const volumeScene=new THREE.Scene();
volumeScene.add(new THREE.Mesh(fsGeo,volumeMat));

const compositeUniforms={
  sceneColor:{value:null},volumeColor:{value:null},volumeStrength:{value:1.0}
};
const compositeMat=new THREE.ShaderMaterial({
  uniforms:compositeUniforms,
  depthWrite:false,depthTest:false,toneMapped:false,
  vertexShader:`
    varying vec2 vUv;
    void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}
  `,
  fragmentShader:`
    varying vec2 vUv;
    uniform sampler2D sceneColor;
    uniform sampler2D volumeColor;
    uniform float volumeStrength;
    void main(){
      vec4 base=texture2D(sceneColor,vUv);
      vec4 vol=texture2D(volumeColor,vUv);
      float trans=clamp(vol.a,0.0,1.0);

      // Suppress low-level veil while retaining the brighter shafts.
      vec3 rays=max(vol.rgb-vec3(.006),vec3(0.0))*volumeStrength;

      // Physically-inspired structure: transmitted scene + in-scattering.
      // Extinction is intentionally restrained so paper textures stay crisp.
      vec3 transmitted=base.rgb*mix(.985,1.0,trans);
      gl_FragColor=vec4(transmitted+rays,base.a);
      #include <colorspace_fragment>
    }
  `
});
const compositeScene=new THREE.Scene();
compositeScene.add(new THREE.Mesh(fsGeo,compositeMat));

function resizeVolumetricTargets(){
  const size=new THREE.Vector2();
  renderer.getDrawingBufferSize(size);
  const w=Math.max(2,Math.floor(size.x)),h=Math.max(2,Math.floor(size.y));
  const vw=Math.max(160,Math.floor(w*VOLUME_SCALE));
  const vh=Math.max(90,Math.floor(h*VOLUME_SCALE));

  if(sceneTarget)sceneTarget.dispose();
  sceneTarget=new THREE.WebGLRenderTarget(w,h,{
    minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
    format:THREE.RGBAFormat,type:THREE.UnsignedByteType
  });
  sceneTarget.depthTexture=new THREE.DepthTexture(w,h);
  sceneTarget.depthTexture.type=THREE.UnsignedShortType;

  if(volumeTarget)volumeTarget.dispose();
  volumeTarget=new THREE.WebGLRenderTarget(vw,vh,{
    minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
    format:THREE.RGBAFormat,type:THREE.UnsignedByteType,depthBuffer:false
  });

  if(!volumeShadowTarget){
    volumeShadowTarget=new THREE.WebGLRenderTarget(VOLUME_SHADOW_SIZE,VOLUME_SHADOW_SIZE,{
      minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,
      format:THREE.RGBAFormat,type:THREE.UnsignedByteType
    });
    volumeShadowTarget.depthTexture=new THREE.DepthTexture(VOLUME_SHADOW_SIZE,VOLUME_SHADOW_SIZE);
    volumeShadowTarget.depthTexture.type=THREE.UnsignedIntType;
    volumeShadowTarget.depthTexture.format=THREE.DepthFormat;
    volumeShadowTarget.depthTexture.compareFunction=null;
    volumeShadowTarget.depthTexture.minFilter=THREE.NearestFilter;
    volumeShadowTarget.depthTexture.magFilter=THREE.NearestFilter;
  }

  volumeUniforms.sceneDepth.value=sceneTarget.depthTexture;
  volumeUniforms.lightDepth.value=volumeShadowTarget.depthTexture;
  compositeUniforms.sceneColor.value=sceneTarget.texture;
  compositeUniforms.volumeColor.value=volumeTarget.texture;
}
resizeVolumetricTargets();

let volumeShadowDirty=true,volumeShadowFrame=0,volumeUseMoon=false;

function updateVolumetricSettings(t){
  const a=((t%1)+1)%1*Math.PI*2-Math.PI/2;
  const rawSun=Math.sin(a),sunUp=Math.max(rawSun,0),moonUp=Math.max(-rawSun,0);
  const twilight=1-smoothstep(.025,.34,Math.abs(rawSun));
  volumeUseMoon=sunUp<.025&&moonUp>.02;

  const active=volumeUseMoon?moon:sun;
  volumeActiveLightPos.copy(active.position);
  volumeUniforms.lightDir.value.copy(volumeLightTarget).sub(volumeActiveLightPos).normalize();

  const dayColor=new THREE.Color(0xffe7b5);
  const warmColor=new THREE.Color(0xffb878);
  const moonColor=new THREE.Color(0xa9c7ff);

  if(volumeUseMoon){
    volumeUniforms.scatteringColor.value.copy(moonColor);
    volumeUniforms.intensity.value=.14+.10*moonUp;
    volumeUniforms.density.value=.010+.004*moonUp;
  }else{
    volumeUniforms.scatteringColor.value.copy(dayColor).lerp(warmColor,twilight*.82);
    volumeUniforms.intensity.value=.28+sunUp*.20+twilight*.24;
    volumeUniforms.density.value=.012+twilight*.008;
  }
  if(state.fog){
    volumeUniforms.intensity.value*=1.06;
    volumeUniforms.density.value*=1.02;
  }
}

function updateVolumetricShadow(force=false){
  if(!state.godrays||(!force&&!volumeShadowDirty))return;

  volumeLightCamera.position.copy(volumeActiveLightPos);
  volumeLightCamera.lookAt(volumeLightTarget);
  volumeLightCamera.updateMatrixWorld(true);
  volumeLightCamera.matrixWorldInverse.copy(volumeLightCamera.matrixWorld).invert();
  volumeLightCamera.updateProjectionMatrix();
  volumeShadowMatrix.multiplyMatrices(volumeLightCamera.projectionMatrix,volumeLightCamera.matrixWorldInverse);
  volumeUniforms.lightMatrix.value.copy(volumeShadowMatrix);

  const fogVisible=forestMist.visible,skyVisible=sky.visible;
  const sunVisible=sunDisc.visible,moonVisible=moonDisc.visible;
  const contactVisible=contactShadow.visible;
  const playerVisible=playerMesh?playerMesh.visible:false;

  forestMist.visible=false;sky.visible=false;
  sunDisc.visible=false;moonDisc.visible=false;contactShadow.visible=false;
  if(playerMesh)playerMesh.visible=false;

  const oldOverride=scene.overrideMaterial;
  scene.overrideMaterial=volumeDepthMat;
  renderer.setRenderTarget(volumeShadowTarget);
  renderer.clear();
  renderer.render(scene,volumeLightCamera);
  renderer.setRenderTarget(null);
  scene.overrideMaterial=oldOverride;

  forestMist.visible=fogVisible;sky.visible=skyVisible;
  sunDisc.visible=sunVisible;moonDisc.visible=moonVisible;
  contactShadow.visible=contactVisible;
  if(playerMesh)playerMesh.visible=playerVisible;

  volumeShadowDirty=false;
}

function renderWithVolumetrics(){
  renderer.setRenderTarget(sceneTarget);
  renderer.clear();
  renderer.render(scene,camera);

  updateVolumetricShadow(false);
  volumeUniforms.cameraProjectionInv.value.copy(camera.projectionMatrixInverse);
  volumeUniforms.cameraMatrixWorld.value.copy(camera.matrixWorld);
  volumeUniforms.cameraPos.value.copy(camera.position);

  renderer.setRenderTarget(volumeTarget);
  renderer.clear();
  renderer.render(volumeScene,fsCamera);

  renderer.setRenderTarget(null);
  renderer.render(compositeScene,fsCamera);
}

const state={sky:true,layers:true,shadow:true,fog:true,tone:true,random:true,bounce:true,papergrass:true,godrays:true,final:true,timePreset:'dawn',auto:false,time:.27,manualSun:false,sunAzimuth:-36,sunElevation:13};
let skyMode='day';

function setSkyMode(mode){
  if(mode===skyMode)return;
  skyMode=mode;
  if(skyMat.map)skyMat.map.dispose();
  skyMat.map=skyTexture(mode);skyMat.needsUpdate=true;
}
function updateLighting(t){
  state.time=((t%1)+1)%1;
  const a=state.time*Math.PI*2-Math.PI/2;
  const rawSun=Math.sin(a),sunUp=Math.max(rawSun,0),moonUp=Math.max(-rawSun,0);
  const twilight=1-smoothstep(.025,.34,Math.abs(rawSun));

  // Sun and moon still move physically around the scene, but the intensity
  // curves are deliberately art-directed: dawn/dusk/night remain readable.
  let sx=-Math.cos(a)*14,sy=3.2+Math.max(rawSun,.03)*13.5,sz=-18;
  const ma=a+Math.PI;
  let mx=Math.cos(a)*12,my=3.2+Math.max(-rawSun,.03)*12.0,mz=-18;

  // Manual sun direction: keep the light behind the forest, but let the user
  // steer it left/right and up/down. All shadows + volumetric scattering use
  // this exact same DirectionalLight position.
  if(state.manualSun){
    const az=THREE.MathUtils.degToRad(state.sunAzimuth);
    const el=THREE.MathUtils.degToRad(state.sunElevation);
    const radius=23;
    const horizontal=Math.cos(el)*radius;
    sx=Math.sin(az)*horizontal;
    sy=3.0+Math.sin(el)*radius;
    sz=-Math.cos(az)*horizontal;
  }
  sun.position.set(sx,sy,sz);moon.position.set(mx,my,mz);

  const sunWarm=new THREE.Color(0xffa96f);
  const sunDay=new THREE.Color(0xffe5bd);
  sun.color.copy(sunWarm).lerp(sunDay,smoothstep(.10,.72,sunUp));
  sun.intensity=.18+sunUp*2.55+twilight*.82;

  moon.color.set(0xb7cfff);
  moon.intensity=.08+moonUp*1.18;

  // Stronger sky/ground diffuse fill: this is intentionally more generous than
  // reality so the handmade-paper colours never collapse into black.
  hemi.intensity=.78+sunUp*.62+moonUp*.15+twilight*.18;
  const hemiDay=new THREE.Color(0xdceeff);
  const hemiNight=new THREE.Color(0x9fb8df);
  const hemiWarm=new THREE.Color(0xffd8bd);
  hemi.color.copy(hemiNight).lerp(hemiDay,Math.pow(sunUp,.45)).lerp(hemiWarm,twilight*.24);

  const groundDay=new THREE.Color(0x9c7656);
  const groundNight=new THREE.Color(0x606b7d);
  const groundWarm=new THREE.Color(0xb37b58);
  hemi.groundColor.copy(groundNight).lerp(groundDay,Math.pow(sunUp,.45)).lerp(groundWarm,twilight*.24);

  // Global fill + camera-side key keep all gameplay-critical shapes readable.
  ambientFill.intensity=.30+sunUp*.12+moonUp*.11+twilight*.08;
  const ambientDay=new THREE.Color(0xe7edf0);
  const ambientNight=new THREE.Color(0x9daccc);
  const ambientWarm=new THREE.Color(0xffd9c1);
  ambientFill.color.copy(ambientNight).lerp(ambientDay,Math.pow(sunUp,.4)).lerp(ambientWarm,twilight*.18);

  viewFill.intensity=.16+(1-sunUp)*.20+twilight*.12;
  const viewDay=new THREE.Color(0xf7f0e6);
  const viewNight=new THREE.Color(0xa9bfe4);
  const viewWarm=new THREE.Color(0xffc9aa);
  viewFill.color.copy(viewNight).lerp(viewDay,Math.pow(sunUp,.5)).lerp(viewWarm,twilight*.34);

  const horizonDay=new THREE.Color(0xb9d9e2);
  const horizonNight=new THREE.Color(0x667d9b);
  const horizonWarm=new THREE.Color(0xe6c2a4);
  const fogColor=horizonNight.clone().lerp(horizonDay,Math.pow(sunUp,.38)).lerp(horizonWarm,twilight*.38);

  // Forest air: exponential distance haze gives a softer "air volume" than
  // a hard linear start/end fog. Keep it stylized and readable.
  if(state.fog){
    const density=.014+twilight*.004+moonUp*.003;
    scene.fog=new THREE.FogExp2(fogColor,density);
  }

  const mistDay=new THREE.Color(0xe4ece3);
  const mistNight=new THREE.Color(0xb6c8da);
  const mistWarm=new THREE.Color(0xecd8c1);
  const mistColor=mistNight.clone().lerp(mistDay,Math.pow(sunUp,.42)).lerp(mistWarm,twilight*.30);
  fogUniforms.tint.value.copy(mistColor);
  fogUniforms.opacity.value=.52+twilight*.06+moonUp*.04;

  // Narrow exposure range = comfortable stylized game image instead of
  // physically dark dawn/night.
  renderer.toneMappingExposure=state.tone?(.86+sunUp*.11+twilight*.035):1;
  scene.background.copy(fogColor);

  let mode='night';
  if(sunUp>.30)mode='day';
  else if(rawSun>=0)mode=state.time<.5?'dawn':'sunset';
  setSkyMode(mode);

  const sunDir=new THREE.Vector3(sx,sy,sz).normalize();
  const moonDir=new THREE.Vector3(mx,my,mz).normalize();
  sunDisc.position.copy(camera.position).addScaledVector(sunDir,34);
  moonDisc.position.copy(camera.position).addScaledVector(moonDir,34);
  sunDisc.lookAt(camera.position);moonDisc.lookAt(camera.position);
  sunDisc.visible=state.sky&&rawSun>-0.08;moonDisc.visible=state.sky&&rawSun<0.12;
  sunDisc.material.opacity=.72+sunUp*.26;moonDisc.material.opacity=.72+moonUp*.22;

  if(playerMat){
    const dayAmount=smoothstep(.02,.68,sunUp);
    playerTintTmp.copy(playerNightTint).lerp(playerDayTint,dayAmount);
    if(twilight>0)playerTintTmp.lerp(playerDuskTint,twilight*.32);
    playerMat.color.copy(playerTintTmp);

    // Only a tiny safety floor remains; readable brightness now mainly comes
    // from world diffuse fill + terrain bounce.
    playerMat.emissiveIntensity=.012+(1-sunUp)*.018;
  }

  // Broad ground colour bleed: intentionally subtle and uniform so it reads
  // as reflected environment light rather than a lamp shining on the floor.
  const bounceDay=.22+sunUp*.28+twilight*.10;
  const bounceNight=moonUp*.16;
  groundBounce.intensity=state.bounce?(bounceDay+bounceNight):0;
  const bounceDayColor=new THREE.Color(0xc8d49b);
  const bounceNightColor=new THREE.Color(0x91a7c8);
  const bounceWarmColor=new THREE.Color(0xd3a47b);
  groundBounce.color.copy(bounceNightColor).lerp(bounceDayColor,Math.pow(sunUp,.45)).lerp(bounceWarmColor,twilight*.18);

  if(contactShadow?.material){
    // Never crush the feet into a black blob at dawn/night.
    contactShadow.material.opacity=.25+sunUp*.32+moonUp*.08+twilight*.06;
  }
  updateVolumetricSettings(state.time);
  syncSunControls();
  volumeShadowDirty=true;
  renderDirty=true;
  shadowDirty=true;
}
function syncSunControls(){
  const az=document.getElementById('sunAzimuth');
  const el=document.getElementById('sunElevation');
  const azv=document.getElementById('sunAzimuthVal');
  const elv=document.getElementById('sunElevationVal');
  const mode=document.getElementById('sunMode');
  if(!az||!el)return;
  az.value=String(state.sunAzimuth);
  el.value=String(state.sunElevation);
  azv.textContent=Math.round(state.sunAzimuth)+'°';
  elv.textContent=Math.round(state.sunElevation)+'°';
  mode.textContent=state.manualSun?'手动':'跟随昼夜';
  document.getElementById('sunFollow').classList.toggle('active',!state.manualSun);
}
function applyManualSun(){
  state.manualSun=true;
  state.auto=false;
  state.timePreset='';
  document.getElementById('cycle').classList.remove('active');
  updateLighting(state.time);
  syncSunControls();
  syncButtons();
  renderDirty=true;shadowDirty=true;volumeShadowDirty=true;
}
function preset(name){
  state.auto=false;state.manualSun=false;document.getElementById('cycle').classList.remove('active');
  state.timePreset=name;
  if(name==='dawn')state.time=.27;
  else if(name==='sunset')state.time=.73;
  else if(name==='night')state.time=.0;
  else state.time=.5;
  updateLighting(state.time);syncSunControls();syncButtons();renderDirty=true;shadowDirty=true;
}
function syncButtons(){
  sky.visible=state.sky;contactShadow.visible=state.shadow;forestMist.visible=state.fog;paperGrassGroup.visible=state.papergrass;canopyGroup.visible=true;
  caps.forEach(c=>c.visible=state.layers);rims.forEach(r=>r.visible=state.layers);
  renderer.shadowMap.enabled=state.shadow;
  // Only one shadow-casting directional light at a time.
  const sunIsDominant=state.time>.18&&state.time<.82;
  sun.castShadow=state.shadow&&sunIsDominant;
  moon.castShadow=state.shadow&&!sunIsDominant;
  shadowDirty=true;
  if(!state.fog)scene.fog=null;
  renderer.toneMapping=state.tone?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
  ['sky','layers','shadow','fog','tone','random','bounce','papergrass','godrays'].forEach(id=>document.getElementById(id).classList.toggle('active',state[id]));
  document.getElementById('compare').classList.toggle('active',state.final);
  document.getElementById('compare').textContent=state.final?'目标效果':'基础方块';
  ['dawn','noon','sunset','night'].forEach(id=>document.getElementById(id).classList.toggle('active',state.timePreset===id&&!state.auto));
}
function setFinal(v){
  state.final=v;state.sky=v;state.layers=v;state.shadow=v;state.fog=v;state.tone=v;state.random=v;state.bounce=v;state.papergrass=v;state.godrays=v;
  depthDirty=true;volumeShadowDirty=true;
  rebuildMaterialRandomness(v);
  if(v){updateLighting(state.time)}
  else{
    state.auto=false;document.getElementById('cycle').classList.remove('active');
    scene.background.set(0xaaa5b1);scene.fog=null;hemi.intensity=1;sun.intensity=2.0;moon.intensity=0;groundBounce.intensity=0;ambientFill.intensity=.18;viewFill.intensity=.10;
    renderer.toneMapping=THREE.NoToneMapping;renderer.toneMappingExposure=1;
  }
  syncButtons();
}
document.getElementById('compare').onclick=()=>{setFinal(!state.final);renderDirty=true;shadowDirty=true};
['sky','layers','shadow','fog','tone'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    state[id]=!state[id];if(id==='layers'){depthDirty=true;volumeShadowDirty=true;}
    state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce&&state.papergrass&&state.godrays;
    updateLighting(state.time);syncButtons();renderDirty=true;shadowDirty=true;
  };
});
document.getElementById('random').onclick=()=>{
  state.random=!state.random;rebuildMaterialRandomness(state.random);
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce&&state.papergrass&&state.godrays;syncButtons();renderDirty=true;shadowDirty=true;
};
document.getElementById('bounce').onclick=()=>{
  state.bounce=!state.bounce;
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce&&state.papergrass&&state.godrays;
  updateLighting(state.time);syncButtons();
};
document.getElementById('papergrass').onclick=()=>{
  state.papergrass=!state.papergrass;
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce&&state.papergrass&&state.godrays;
  paperGrassGroup.visible=state.papergrass;
  depthDirty=true;volumeShadowDirty=true;renderDirty=true;shadowDirty=true;
  syncButtons();
};
document.getElementById('godrays').onclick=()=>{
  state.godrays=!state.godrays;
  state.final=state.sky&&state.layers&&state.shadow&&state.fog&&state.tone&&state.random&&state.bounce&&state.papergrass&&state.godrays;
  volumeShadowDirty=true;renderDirty=true;
  updateVolumetricSettings(state.time);syncButtons();
};
document.getElementById('sunAzimuth').oninput=e=>{
  state.sunAzimuth=+e.target.value;
  document.getElementById('sunAzimuthVal').textContent=state.sunAzimuth+'°';
  applyManualSun();
};
document.getElementById('sunElevation').oninput=e=>{
  state.sunElevation=+e.target.value;
  document.getElementById('sunElevationVal').textContent=state.sunElevation+'°';
  applyManualSun();
};
document.getElementById('sunFollow').onclick=()=>{
  state.manualSun=false;
  updateLighting(state.time);
  syncSunControls();syncButtons();
  renderDirty=true;shadowDirty=true;volumeShadowDirty=true;
};
document.getElementById('dawn').onclick=()=>preset('dawn');
document.getElementById('noon').onclick=()=>preset('noon');
document.getElementById('sunset').onclick=()=>preset('sunset');
document.getElementById('night').onclick=()=>preset('night');
document.getElementById('cycle').onclick=()=>{
  state.auto=!state.auto;document.getElementById('cycle').classList.toggle('active',state.auto);
  if(state.auto){state.timePreset='';state.manualSun=false;}
  syncSunControls();syncButtons();renderDirty=true;shadowDirty=true;volumeShadowDirty=true;
};

let dragging=false,lastX=0,lastY=0,renderDirty=true,autoShadowFrame=0,lastMistTick=0,mistClock=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lastX)*.006;pitch=clamp(pitch+(e.clientY-lastY)*.004,.08,.62);
  lastX=e.clientX;lastY=e.clientY;placeCamera();renderDirty=true;shadowDirty=true;depthDirty=true;
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.012,10,27);placeCamera();renderDirty=true;shadowDirty=true;depthDirty=true},{passive:true});
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));resizeDepthTarget();resizeVolumetricTargets();renderDirty=true;shadowDirty=true;depthDirty=true;volumeShadowDirty=true;
});

let prev=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;

  if(state.auto){
    state.time=(state.time+dt/48)%1;
    updateLighting(state.time);
    // Updating a 1k shadow map every frame is wasteful. In auto-cycle mode
    // refresh it at ~7.5 fps; the colour/sky motion still renders smoothly.
    autoShadowFrame=(autoShadowFrame+1)%8;
    volumeShadowFrame=(volumeShadowFrame+1)%8;
    if(autoShadowFrame!==0)shadowDirty=false;
    if(volumeShadowFrame===0)volumeShadowDirty=true;
    updateVolumetricSettings(state.time);
  }

  // Dynamic paper fog + low-cost temporal volumetric jitter (~20 fps).
  if(state.fog&&now-lastMistTick>50){
    const step=(now-lastMistTick)/1000;
    lastMistTick=now;mistClock+=Math.min(.12,step);
    fogUniforms.time.value=mistClock;
    updateFogInstances(mistClock);
    if(state.papergrass)updatePaperGrass(mistClock);
    volumeUniforms.time.value=mistClock;
    renderDirty=true;
  }

  if(!state.auto&&!renderDirty)return;

  sky.position.copy(camera.position);

  if(playerMesh){
    const dx=camera.position.x-playerMesh.position.x;
    const dz=camera.position.z-playerMesh.position.z;
    playerMesh.rotation.y=Math.atan2(dx,dz);

    const len=Math.max(.001,Math.hypot(dx,dz));
    const fx=dx/len,fz=dz/len;
    groundBounce.position.set(
      playerMesh.position.x+fx*4,
      -3,
      playerMesh.position.z+fz*4
    );
    groundBounce.target.position.set(playerMesh.position.x,1.1,playerMesh.position.z);
  }

  viewFill.position.copy(camera.position);
  viewFill.target.position.set(0,1.1,0);

  if(state.shadow&&shadowDirty){
    renderer.shadowMap.needsUpdate=true;
    shadowDirty=false;
  }

  updateDepthTexture();
  if(state.godrays)renderWithVolumetrics();
  else{
    renderer.setRenderTarget(null);
    renderer.render(scene,camera);
  }
  renderDirty=false;
}
updateLighting(state.time);syncSunControls();syncButtons();animate(performance.now());
</script>
