function tone(f){if(!sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type="sine";osc.frequency.value=f;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.19);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2)}catch(e){}}
function show(s,t){$("speaker").textContent=s;line.textContent=t;$("choices").replaceChildren();next.hidden=false}
function choices(options){next.hidden=true;const wrap=$("choices");wrap.replaceChildren();options.forEach(o=>{const b=document.createElement("button");b.textContent=o[0];b.onclick=()=>{tone(440);next.hidden=false;wrap.replaceChildren();o[1]()};wrap.appendChild(b)})}
function drawHotspots(){spots.replaceChildren();layouts[scene].forEach(o=>{const b=document.createElement("button");b.className="hotspot";b.style.left=o.x+"%";b.style.top=o.y+"%";b.dataset.title=o.t;b.textContent=found[o.id]?"✓":"+";b.setAttribute("aria-label",o.t);b.onclick=()=>inspect(o.id);spots.appendChild(b)})}
function move(to){
 scene=to;for(const id of ["hall","classroom","stairs"])$(id).classList.toggle("active",id===to);
 $("world").classList.toggle("duel",to==="classroom");
 $("boy-tie").classList.remove("attention","dimmed");$("boy-untied").classList.remove("attention","dimmed");
 $("location").textContent={hall:"旧校舍三层 · 18:47",classroom:"3-B 教室 · 18:47",stairs:"三楼楼梯 · 18:47"}[to];
 drawHotspots();tone(185)
}
function inspect(id){if(id==="hall"){move("hall");show("我","走廊里的灯比刚才暗了一些。");return}found[id]=true;drawHotspots();tone(id==="door"?145:300);if(id==="door"){show("我","门里站着两个男同学。左边系红领带，右边没有。他们的脸、声音和穿着几乎一样，只有这一个细节不同。");setTimeout(()=>{$("flash").classList.add("on");setTimeout(()=>$("flash").classList.remove("on"),140)},170);move("classroom");return}
if(id==="stair"&&scene==="hall"){move("stairs");show(...scripts.stair);return}
show(...scripts[id]);
if(id==="tie"||id==="untied"){
 const a=$("boy-tie"),b=$("boy-untied"),focus=id==="tie"?a:b,other=id==="tie"?b:a;
 focus.classList.add("attention");focus.classList.remove("dimmed");
 other.classList.remove("attention");other.classList.add("dimmed");
 if(found.tie&&found.untied&&ending!=="tie"&&ending!=="untied"){
  show("我","两个人都坚持自己是原来的他。但红领带和敞开的领口无法同时成立。我究竟记得哪个版本？");
  choices([["我记得红领带",()=>finish("tie")],["我记得他没系领带",()=>finish("untied")],["暂时不判断",()=>{show("我","我不回答。他们同时转过头，动作一模一样。");$("boy-tie").classList.remove("dimmed");$("boy-untied").classList.remove("dimmed");}]]);
 }
}
$("status").textContent="已发现 "+Object.values(found).filter(Boolean).length+" / 8 条线索";
if(Object.values(found).filter(Boolean).length>=4&&!ending&&!found.tie&&!found.untied){ending="ready";setTimeout(()=>{show("内心独白","我终于明白：学校不是在复制一个人，而是在不停替换谁才有资格成为「原来的我」。");choices([["保持原样，离开这里",()=>finish("leave")],["去寻找那个自己",()=>finish("meet")]])},850)}
}
function finish(route){
 ending=route;
 const outcomes={
 leave:["记录 · 结局一","我走出了校门。第二天早上，课桌上仍放着我昨晚写下的笔记。可是这一次，笔记里的名字不是我的。","残留"],
 meet:["记录 · 结局二","我推开最后一道门。那个人看着我，像看着一段已经被遗忘的过去。她先开口了：「你终于回来替我上课了。」","替代"],
 tie:["记录 · 红色领带","我指向系着领带的人。另一人沉默地解开了一个不存在的结，随后连我自己的领口也空了。","红领带"],
 untied:["记录 · 空白领口","我指向没有领带的人。左边的男生却从我的衣袋里抽出一条红色领带。那是我从未见过的东西。","无领带"]
 };
 show(outcomes[route][0],outcomes[route][1]);spots.replaceChildren();
 $("status").textContent="序章结束 · "+outcomes[route][2];
 $("boy-tie").classList.remove("dimmed","attention");$("boy-untied").classList.remove("dimmed","attention");
 try{localStorage.setItem("false-memory-ending",route)}catch(e){}
}
function advance(){tone(510);if(step<narrative.length){show(narrative[step][0],narrative[step][1]);step++;return}if(!ending){show("提示","点击场景里的调查标记，检查教室、时钟、纸条与楼梯。");next.textContent="继续探索 ›"}}
$("next").onclick=advance;
$("restart").onclick=()=>{step=0;ending="";found={note:false,door:false,clock:false,desk:false,window:false,stair:false,tie:false,untied:false};move("hall");$("hero").classList.remove("ghost");next.hidden=false;next.textContent="继续 ›";$("status").textContent="";show("我","放学后，我收到了一封署名是自己的短信：「今晚别回家。」");};
$("sound").onclick=()=>{sound=!sound;$("sound").textContent="声音 · "+(sound?"开":"关");$("sound").setAttribute("aria-pressed",String(sound));tone(660)};
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){if(e.target.tagName==="BUTTON")return;e.preventDefault();if(!next.hidden)advance()}});
drawHotspots();$("restart").click();
})();
