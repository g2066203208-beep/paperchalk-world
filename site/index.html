<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>教室 · 连续流动黑雾</title>
<style>
@font-face{font-family:"PaperSerif";src:url("./assets/fonts/PaperSerif-Medium.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"PaperSans";src:url("./assets/fonts/PaperSans-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark;
 --font-menu:"PaperSerif","Noto Serif CJK SC","Songti SC",serif;
 --font-name:"PaperSerif","Noto Serif CJK SC","Songti SC",serif;
 --font-dialogue:"PaperSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 --font-ui:"PaperSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#view{
  position:fixed;inset:0;display:grid;place-items:center;
  overflow:hidden;background:#000;perspective:1500px;
  container-type:size;touch-action:none;
}
/* The Android APK uses a real landscape Activity. A normal browser tab
   cannot force OS rotation, so render its COMPLETE game viewport rotated
   immediately in portrait. No tap, permission, overlay, or fake lock needed. */
body.mobile-mode.virtual-landscape #view{
  inset:auto;top:0;left:100vw;width:100dvh;height:100vw;
  transform-origin:top left;transform:rotate(90deg);
}
#scene{
  position:relative;flex:none;margin:0;
  width:min(90vw,calc(88dvh * 16 / 9));
  width:min(90cqw,calc(88cqh * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  transform-origin:center center;
  transform:rotateX(0deg) rotateY(0deg);
  will-change:transform;backface-visibility:hidden;
}
#scene img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none;-webkit-user-drag:none}
#scene::after{
  /* FIXED image-attached protection; rotating the scene also rotates this.
     Four original picture edges are solid #000, with no dynamic exceptions. */
  content:"";
  position:absolute;
  z-index:1;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right,
      #000 0%,#000 3%,rgba(0,0,0,.96) 6%,
      rgba(0,0,0,.77) 11%,rgba(0,0,0,.34) 16%,
      transparent 23%,transparent 77%,
      rgba(0,0,0,.34) 84%,rgba(0,0,0,.77) 89%,
      rgba(0,0,0,.96) 94%,#000 97%,#000 100%),
    linear-gradient(to bottom,
      #000 0%,#000 4%,rgba(0,0,0,.96) 8%,
      rgba(0,0,0,.74) 13%,rgba(0,0,0,.35) 19%,
      transparent 27%,transparent 73%,
      rgba(0,0,0,.35) 81%,rgba(0,0,0,.74) 87%,
      rgba(0,0,0,.96) 92%,#000 96%,#000 100%);
}
#fog{
  position:fixed;inset:0;display:block;width:100%;height:100%;
  pointer-events:none;image-rendering:auto;
  /* independent viewport-space layer: mouse never transforms the fog */
}


/* 1803 × 872 approved landscape reference, scaled in LOGICAL GAME viewport.
   3.1% / 4.0% top controls; 8.3% / 8% dialogue. Container units
   correctly follow the game in actual Android landscape and rotated browser portrait.
   No panel, no rectangular frame, no extra gradient, no smoke layers. */
#novel-ui{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-dialogue);
  font-weight:400;letter-spacing:.045em;
  --ui-ink:#f5f5f1;
}
#novel-ui button{
  appearance:none;border:0!important;border-radius:0!important;box-shadow:none!important;
  background:none!important;backdrop-filter:none!important;
  -webkit-tap-highlight-color:transparent;color:inherit;font:inherit;
  pointer-events:auto;cursor:pointer;touch-action:manipulation;
  text-shadow:0 1px 5px #000;
}
#novel-ui button:focus-visible{outline:1px solid var(--ui-ink);outline-offset:3px}
#top-menu{position:absolute;top:max(7px,3.7cqh);left:max(8px,2.7cqw)}
#top-menu button{font-family:var(--font-ui);font-size:clamp(19px,3.7cqh,88px);font-weight:300;line-height:1;min-width:38px;min-height:38px;text-align:left;padding:2px 4px}
#top-actions{position:absolute;top:max(7px,3.8cqh);right:max(9px,3.0cqw);display:flex;align-items:center;gap:max(10px,3.2cqw)}
#top-actions button{font-family:var(--font-ui);font-size:clamp(11px,2.45cqh,60px);min-height:36px;min-width:38px;padding:4px 2px}
#top-actions button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:6px}
#dialogue{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;pointer-events:auto;text-shadow:0 1px 6px #000}
#speaker{font-family:var(--font-name);font-weight:500;font-size:clamp(12px,2.75cqh,70px);line-height:1.25;margin:0 0 max(7px,1.8cqh)}
#dialogue-text{font-family:var(--font-dialogue);font-weight:400;font-size:clamp(14px,2.95cqh,74px);line-height:1.46;margin:0;max-width:100%;overflow-wrap:anywhere}
#advance{position:absolute;right:max(15px,8.8cqw);bottom:max(16px,6.3cqh)}
#advance button{font-size:clamp(18px,2.8cqh,70px);line-height:1;min-width:44px;min-height:40px;padding:0;text-align:center}
#menu-choices{position:absolute;top:max(45px,11.5cqh);left:max(9px,2.7cqw);display:flex;flex-direction:column;align-items:flex-start;gap:max(4px,1.1cqh);pointer-events:auto}
#menu-choices button{font-size:clamp(12px,2.1cqh,52px);padding:5px 8px;min-height:35px;text-align:left}
#history{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;max-height:54cqh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;text-shadow:0 1px 6px #000;scrollbar-width:thin}
#history p{font-size:clamp(12px,2.15cqh,54px);line-height:1.65;margin:.28em 0}
#history .log-speaker{color:#eee9}
#novel-ui [hidden]{display:none!important}
@container (max-height:445px){
  #novel-ui{letter-spacing:.015em}
  #top-menu{top:5px}
  #top-actions{top:5px}
  #dialogue{width:78cqw;bottom:max(15px,7.5cqh)}
  #speaker{font-size:clamp(11px,2.65cqh,15px);margin-bottom:5px}
  #dialogue-text{font-size:clamp(12px,3.0cqh,17px);line-height:1.38}
  #advance{right:clamp(10px,8.5cqw,100px);bottom:max(12px,6cqh)}
}


/* SCENE TEMPLATE: one image, 3D tilt, stage-locked actions, viewport black fog. */
#scene-menu{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-menu);
  font-weight:400;letter-spacing:.065em;text-shadow:0 1px 5px #000;
}
#scene-menu .scene-menu-options{
  position:absolute;left:60.5%;top:44%;display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(3px,1.0cqh,18px);
}
#scene-menu button{
  font-family:var(--font-menu);
  appearance:none;display:block;border:0;border-radius:0;background:none;
  box-shadow:none;color:inherit;font:inherit;font-size:clamp(14px,2.8cqh,38px);
  line-height:1.35;white-space:nowrap;text-align:left;
  min-width:44px;min-height:38px;padding:3px 7px;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  opacity:.90;transition:opacity 150ms ease;text-shadow:inherit;
}
#scene-menu button:hover,#scene-menu button:focus-visible{opacity:1}
#scene-menu button:focus-visible{outline:1px solid #ccc;outline-offset:2px}
#scene-menu button:disabled{opacity:.28;cursor:default}
#scene-menu [hidden],#scene-menu[hidden],#novel-ui[hidden]{display:none!important}
@container (max-height:445px){
  #scene-menu .scene-menu-options{left:60%;top:39%;gap:2px}
  #scene-menu button{font-size:clamp(12px,2.7cqh,23px);min-height:30px}
}


/* Real depth composition, front to back:
   camera player (fixed) > original viewport black fog > enemy (parallax)
   > background (independently tilted). Nothing else is drawn. */
#scene{z-index:1}
#enemy-depth-root{
  position:absolute;left:50%;top:50%;
  width:min(90vw,calc(88dvh * 16 / 9));
  width:min(90cqw,calc(88cqh * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  z-index:2;pointer-events:none;
  transform-origin:center center;
  transform:translate(-50%,-50%) rotateY(0deg) rotateX(0deg);
  will-change:transform;backface-visibility:hidden;
}
#enemy-depth-root[hidden],#camera-player-root[hidden]{display:none!important}
#enemy-depth-root #actor-enemy{
  position:absolute;display:block;left:61.5%;bottom:18%;height:64%;
  width:auto;max-width:none;object-fit:contain;object-position:bottom center;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
#fog{z-index:3}
#camera-player-root{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  /* This node stays attached to the CAMERA, never stage perspective. */
  transform:none!important;
}
#camera-player-root #actor-player{
  position:absolute;display:block;left:8cqw;bottom:-3cqh;height:82cqh;
  width:auto;max-width:none;object-fit:contain;object-position:bottom center;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
@container (max-height:445px){
  #enemy-depth-root #actor-enemy{height:62%;left:62%;bottom:18%}
  #camera-player-root #actor-player{height:82cqh;left:8cqw;bottom:-3cqh}
}

/* BLACK-only scene transition, independent of the original running fluid fog */
#scene-transition{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse at 50% 47%,rgba(0,0,0,0) 0%,rgba(0,0,0,.23) 37%,rgba(0,0,0,.68) 69%,#000 100%);
 --core-black:0}
#scene-transition::after{content:"";position:absolute;inset:0;background:#000;
 opacity:var(--core-black);pointer-events:none}
#scene-transition[data-active="true"]{pointer-events:auto;touch-action:none}
#scene-menu,#novel-ui{transition:opacity 150ms ease}
@media(prefers-reduced-motion:reduce){#scene-menu,#novel-ui{transition:none}}
@media(prefers-reduced-motion:reduce){#scene{transform:none!important;will-change:auto}}

/* OPTIONAL scene-layer development editor: live planes, not a flattened mockup.
   Outside dev mode the exact approved gameplay transforms remain unchanged. */
#dev-trigger{
  position:absolute;z-index:14;top:3.8cqh;left:48%;transform:translateX(-50%);
  padding:5px 9px;border:0;background:transparent;color:#eee;
  font:400 clamp(11px,2.0cqh,17px) var(--font-ui);letter-spacing:.09em;
  opacity:.58;text-shadow:0 1px 5px #000;cursor:pointer;pointer-events:auto;
}
#dev-trigger:hover,#dev-trigger:focus-visible{opacity:1}
#dev-stage{position:absolute;inset:0;z-index:9;overflow:hidden;touch-action:none;perspective:1150px}
#dev-stage[hidden],#dev-tools[hidden]{display:none!important}
#dev-rig{position:absolute;inset:0;transform-style:preserve-3d;
  transform-origin:50% 50%;will-change:transform;pointer-events:none}
#view.dev-mode{perspective:none}
#view.dev-mode #dev-trigger,#view.dev-mode #novel-ui,
#view.dev-mode #scene-transition{display:none!important}
#view.dev-mode #dev-rig > #scene,
#view.dev-mode #dev-rig > #enemy-depth-root,
#view.dev-mode #dev-rig > #fog,
#view.dev-mode #dev-rig > #camera-player-root{
  z-index:auto!important;transform-style:preserve-3d;backface-visibility:visible;
  pointer-events:none!important;
}
#view.dev-mode #dev-rig > #scene{
  position:absolute!important;left:50%;top:50%;margin:0!important;
  transform:translate(-50%,-50%) translateZ(var(--dev-depth-bg))!important;
  border:1px solid rgba(111,173,210,.9);
}
#view.dev-mode #dev-rig > #enemy-depth-root{
  transform:translate(-50%,-50%) translateZ(var(--dev-depth-enemy))!important;
  border:1px solid rgba(241,166,105,.95);
}
#view.dev-mode #dev-rig > #fog{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  transform:translateZ(var(--dev-depth-fog))!important;
}
#view.dev-mode #dev-rig > #camera-player-root{
  transform:translateZ(var(--dev-depth-player))!important;
  border:1px solid rgba(123,230,182,.9);
}
#view.dev-mode #dev-rig > #scene::before{
  content:"01 / 背景";position:absolute;top:4px;left:7px;z-index:8;
  color:#a6daef;font:12px var(--font-ui);text-shadow:0 1px 4px #000;
}
#view.dev-mode #enemy-depth-root::after,
#view.dev-mode #camera-player-root::after{
  position:absolute;top:6px;left:8px;font:12px var(--font-ui);
  color:#ffdaa9;text-shadow:0 1px 4px #000;pointer-events:none;
}
#view.dev-mode #enemy-depth-root::after{content:"02 / 敌人"}
#view.dev-mode #camera-player-root::after{content:"04 / 主角";color:#9eeac4}
#dev-fog-guide{
  position:absolute;inset:0;transform:translateZ(var(--dev-depth-fog));
  border:1px dashed rgba(186,186,203,.75);pointer-events:none;
}
/* Never reparent the original WebGL canvas: some browsers lose their WebGL
   context when a live canvas moves into a 3D stacking context. The preview
   mirrors the actual flowing fog after each render, at a cheap low resolution. */
#view.dev-mode > #fog{visibility:hidden}
#dev-fog-preview{
  position:absolute;inset:0;width:100%;height:100%;
  transform:translateZ(var(--dev-depth-fog));
  pointer-events:none;image-rendering:auto;
}
#dev-fog-guide::before{content:"03 / 实时黑雾";position:absolute;left:8px;top:6px;
  color:#c6c6d0;font:12px var(--font-ui);text-shadow:0 1px 5px #000}
#view.dev-mode #dev-rig #actor-enemy,
#view.dev-mode #dev-rig #actor-player{pointer-events:auto!important;cursor:grab;touch-action:none}
#view.dev-mode #dev-rig #actor-enemy:active,
#view.dev-mode #dev-rig #actor-player:active{cursor:grabbing}
#dev-tools{
  position:absolute;z-index:40;right:1.4cqw;top:2.5cqh;
  width:min(298px,39cqw);max-height:95cqh;overflow:auto;
  padding:12px 13px 14px;color:#eee;pointer-events:auto;
  font:13px var(--font-ui);background:rgba(10,14,18,.89);
  border:1px solid #777b80;border-radius:6px;touch-action:pan-y;
}
#dev-tools header{display:flex;justify-content:space-between;align-items:center;gap:8px}
#dev-tools header strong{font-size:15px;letter-spacing:.04em}
#dev-tools button,#dev-tools select{
  cursor:pointer;border:1px solid #777;background:#20252a;color:#f1f1f1;
  padding:5px 8px;border-radius:3px;font:inherit;min-height:27px;
}
#dev-tools button:focus-visible,#dev-tools input:focus-visible,
#dev-tools select:focus-visible{outline:2px solid #a6d7ff}
#dev-tools .dev-buttons{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
#dev-tools p{font-size:11px;color:#bbb;line-height:1.5;margin:6px 0 9px}
#dev-tools label{display:block;margin:7px 0 1px;font-size:12px}
#dev-tools .dev-value{float:right;font-variant-numeric:tabular-nums;color:#a6ddfa}
#dev-tools input[type="range"]{display:block;width:100%;margin:4px 0 8px;accent-color:#a3cde4}
#dev-tools select{width:100%;margin-top:4px}
#dev-tools .dev-state{color:#9edebd;min-height:1.3em;display:block;font-size:11px}
#dev-tools .dev-hint{color:#c5c5c5;margin-bottom:0}
@container (max-height:445px){
  #dev-tools{font-size:11px;padding:7px 9px;width:min(270px,41cqw)}
  #dev-tools p{margin:3px 0 5px}
  #dev-tools label{margin:4px 0 0}
  #dev-tools input[type="range"]{margin:1px 0 4px}
  #dev-tools .dev-buttons{margin:4px 0}
}
</style>
</head>
<body>
<main id="view" aria-label="同一场景模板：背景和菜单随视角倾斜，纯黑流体雾固定在屏幕上">
  <figure id="scene" data-scene="menu" aria-label="主菜单：一面墙、一扇门和一盏灯">
    <img id="source" src="./assets/menu-wall.webp" width="1024" height="576"
         alt="昏暗的墙壁，一扇闭合的旧门和顶上的灯。" draggable="false">
    <div id="scene-menu" aria-label="主菜单场景文字">
      <nav id="scene-menu-main" class="scene-menu-options" aria-label="主菜单选项">
        <button id="menu-start" type="button">开始游戏</button>
        <button id="menu-continue" type="button" disabled>继续游戏</button>
        <button id="menu-settings-button" type="button">设置</button>
      </nav>
      <nav id="scene-menu-settings" class="scene-menu-options" aria-label="场景设置" hidden>
        <button id="tilt-toggle" type="button">场景倾斜：开启</button>
        <button id="menu-settings-back" type="button">返回</button>
      </nav>
    </div>
  </figure>
  <div id="enemy-depth-root" aria-label="第二景深层：敌人（在黑雾后方）" hidden>
    <img id="actor-enemy" src="./assets/battle/enemy-front.webp" alt="面向玩家的敌人" draggable="false">
  </div>
  <canvas id="fog" aria-hidden="true"></canvas>
  <div id="camera-player-root" aria-label="镜头前景层：玩家（在黑雾前方）" hidden>
    <img id="actor-player" src="./assets/battle/player-back.webp" alt="背对镜头的主角" draggable="false">
  </div>
  <div id="novel-ui" aria-label="黑雾极简互动界面" hidden>
    <nav id="top-menu" aria-label="游戏菜单">
      <button id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="menu-choices">☰</button>
    </nav>
    <div id="top-actions" aria-label="对话控制">
      <button id="auto-button" type="button" aria-pressed="false">AUTO</button>
      <button id="log-button" type="button" aria-pressed="false">LOG</button>
    </div>
    <div id="menu-choices" hidden aria-label="游戏操作">
      <button id="restart-button" type="button">重新开始</button>
      <button id="return-main" type="button">返回主菜单</button>
      <button id="hide-button" type="button">隐藏文字</button>
    </div>
    <section id="dialogue" aria-label="人物对白" aria-live="polite">
      <p id="speaker">???</p>
      <p id="dialogue-text">这间教室……和我记忆里的，不太一样。</p>
    </section>
    <div id="advance"><button id="next-line" type="button" aria-label="下一句">▸</button></div>
    <div id="history" hidden role="region" aria-label="对白记录"></div>
  </div>
  <div id="scene-transition" data-phase="idle" data-active="false" aria-hidden="true"></div>

  <button id="dev-trigger" type="button" aria-label="打开分层开发者模式">分层 DEV</button>
  <div id="dev-stage" hidden aria-label="三维场景分层检查器">
    <div id="dev-rig">
      <canvas id="dev-fog-preview" width="384" height="216" aria-label="实时黑雾图层的缩小镜像"></canvas>
      <div id="dev-fog-guide" aria-hidden="true"></div>
    </div>
  </div>
  <aside id="dev-tools" hidden aria-label="开发者分层编辑面板">
    <header><strong>分层开发者模式</strong><button id="dev-exit" type="button">完成 / 返回</button></header>
    <p>拖动空白区域旋转镜头；滚轮缩放；右键拖动平移。拖动人物可直接改位置。</p>
    <div class="dev-buttons">
      <button id="dev-front" type="button">正视角</button>
      <button id="dev-side" type="button">侧视角</button>
      <button id="dev-camera-reset" type="button">重置镜头</button>
    </div>
    <label for="dev-layer">正在编辑图层</label>
    <select id="dev-layer">
      <option value="enemy">02 / 敌人</option>
      <option value="player">04 / 主角</option>
      <option value="bg">01 / 背景</option>
      <option value="fog">03 / 黑雾</option>
    </select>
    <div id="dev-actor-controls">
      <label for="dev-x">水平位置 <output id="dev-x-value" class="dev-value"></output></label>
      <input id="dev-x" type="range" min="-20" max="110" step=".5">
      <label for="dev-y">底部位置 <output id="dev-y-value" class="dev-value"></output></label>
      <input id="dev-y" type="range" min="-40" max="85" step=".5">
      <label for="dev-size">角色大小 <output id="dev-size-value" class="dev-value"></output></label>
      <input id="dev-size" type="range" min="12" max="120" step=".5">
    </div>
    <label for="dev-z">图层深度（Z）<output id="dev-z-value" class="dev-value"></output></label>
    <input id="dev-z" type="range" min="-420" max="350" step="5">
    <div class="dev-buttons">
      <button id="dev-save" type="button">保存位置</button>
      <button id="dev-reset" type="button">恢复默认</button>
      <button id="dev-copy" type="button">复制参数</button>
    </div>
    <output id="dev-status" class="dev-state" aria-live="polite"></output>
    <p class="dev-hint">保存到本机浏览器。普通视角保留主角贴镜头、敌人轻微视差、黑雾独立。</p>
  </aside>
</main>
<script id="vertex" type="x-shader/x-vertex">
attribute vec2 a_position;
varying vec2 v_uv;
void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}
</script>
<script id="fluid" type="x-shader/x-fragment">
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_previous;
uniform vec2 u_simSize;
uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;
uniform float u_dt;
float edgeDistance(vec2 uv){
  vec2 v=u_half-abs(uv-.5);
  return min(v.x*u_viewSize.x,v.y*u_viewSize.y);
}
void main(){
  vec2 uv=v_uv;
  vec2 pixel=1.0/u_simSize;
  vec2 p=(uv-.5)*vec2(u_viewSize.x/u_viewSize.y,1.);
  float t=u_time;
  // Time-varying curl velocity from a stream function, not frame-swapped images.
  float ax=p.x*5.0+t*.39, ay=p.y*7.7-t*.34;
  float bx=p.x*11.0-t*.24,by=p.y*8.0+t*.28;
  vec2 v=vec2(
    42.0*(7.7*sin(ax)*cos(ay)+.34*8.0*cos(bx)*cos(by))/7.7,
   -42.0*(5.0*cos(ax)*sin(ay)-.34*11.0*sin(bx)*sin(by))/7.7
  );
  // Semi-Lagrangian transport: density persists from the preceding frame.
  vec2 back=clamp(uv-v*(u_dt/u_viewSize),pixel*.5,1.-pixel*.5);
  float transported=texture2D(u_previous,back).r;
  // Diffusion softens the smoke instead of teleporting or blinking it.
  vec2 a=vec2(pixel.x,0.),b=vec2(0.,pixel.y);
  float neighbors=(texture2D(u_previous,back+a).r+
                   texture2D(u_previous,back-a).r+
                   texture2D(u_previous,back+b).r+
                   texture2D(u_previous,back-b).r)*.25;
  float density=mix(transported,neighbors,clamp(u_dt*1.5,0.,.11));
  float d=edgeDistance(uv);
  // Continuous injection on all four image edges, with turbulent wave fronts.
  float w1=sin(p.x*15.7+p.y*4.2+t*.82+sin(p.y*8.-t*.36)*1.8);
  float w2=sin(p.y*18.4-p.x*6.6-t*.61+sin(p.x*10.+t*.4));
  float envelope=.52+.26*w1+.19*w2;
  float reach=63.+18.*w1+15.*w2+9.*sin(t*.73+p.x*8.);
  float inlet=1.-smoothstep(-15.,max(12.,reach),d);
  float injection=inlet*max(.04,envelope)*2.4;
  density=clamp(density*exp(-u_dt*.55)+u_dt*injection,0.,1.);
  gl_FragColor=vec4(density,density,density,1.);
}

uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;

 // Smoke no longer has to hide picture edges: the picture's own CSS

             (u_half.y-abs(uv.y-.5))*u_viewSize.y);

}

<script>

    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Fog framebuffer incomplete');
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
    return {tex,fb};
  }
  function initGPU(){
    try{
      gl=fog.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false,preserveDrawingBuffer:false});
      if(!gl)return false;
      quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const vertex=shader(gl.VERTEX_SHADER,document.getElementById('vertex').textContent);
      simulate=program('fluid',vertex);composite=program('display',vertex);
      fog.dataset.renderer='gpu-advected-fluid';
      return true;
    }catch(e){console.warn('GPU fluid unavailable; using CPU fluid fallback:',e);gl=null;return false;}
  }
  function initCPU(){
    fallback=fog.getContext('2d',{alpha:true});
    fog.dataset.renderer='cpu-advected-fluid';
  }
  function resize(){
    const logical=logicalSize();
    const w=Math.max(1,logical.w),h=Math.max(1,logical.h);
    const scale=Math.min(.72,devicePixelRatio||1);
    // The visible fog gets a responsive canvas, while the simulation runs
    // on a smaller persistent density field for per-frame performance.
    const fw=Math.max(1,Math.round(w*scale)),fh=Math.max(1,Math.round(h*scale));
    const simulationScale=Math.min(.36,360/Math.max(w,h));
    const sw=Math.max(80,Math.round(w*simulationScale));
    const sh=Math.max(80,Math.round(h*simulationScale));
    sizes={w,h,sw,sh};
    if(gl){
      for(const t of simTargets){gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fb)}
      simTargets=[];
      fog.width=fw;fog.height=fh;gl.viewport(0,0,fw,fh);
      simTargets=[target(sw,sh),target(sw,sh)];
      simIndex=0;gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      for(const p of [simulate,composite]){
        gl.useProgram(p);
        gl.uniform2f(gl.getUniformLocation(p,'u_viewSize'),w,h);
        gl.uniform2f(gl.getUniformLocation(p,'u_half'),sceneHalf.x,sceneHalf.y);
      }
      gl.useProgram(simulate);gl.uniform2f(gl.getUniformLocation(simulate,'u_simSize'),sw,sh);
      gl.uniform1i(gl.getUniformLocation(simulate,'u_previous'),0);
      gl.useProgram(composite);gl.uniform1i(gl.getUniformLocation(composite,'u_density'),0);
    }else if(fallback){
      const sx=Math.max(90,Math.round(w*.24)),sy=Math.max(70,Math.round(h*.24));
      fog.width=sx;fog.height=sy;
      fallbackState={sx,sy,a:new Float32Array(sx*sy),b:new Float32Array(sx*sy),image:fallback.createImageData(sx,sy)};
    }
    half();
  }
  function drawGPU(dt,t){
    gl.activeTexture(gl.TEXTURE0);
    gl.useProgram(simulate);
    gl.bindFramebuffer(gl.FRAMEBUFFER,simTargets[1-simIndex].fb);
    gl.viewport(0,0,sizes.sw,sizes.sh);
    gl.bindTexture(gl.TEXTURE_2D,simTargets[simIndex].tex);
    gl.uniform1f(gl.getUniformLocation(simulate,'u_time'),t);
    gl.uniform1f(gl.getUniformLocation(simulate,'u_dt'),dt);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    simIndex=1-simIndex;
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,fog.width,fog.height);
    gl.useProgram(composite);
    gl.bindTexture(gl.TEXTURE_2D,simTargets[simIndex].tex);
    gl.uniform1f(gl.getUniformLocation(composite,'u_time'),t);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function sample(arr,fx,fy,w,h){
    fx=clamp(fx,0,w-1);fy=clamp(fy,0,h-1);
    const x=Math.floor(fx),y=Math.floor(fy),u=fx-x,v=fy-y;
    const x1=Math.min(x+1,w-1),y1=Math.min(y+1,h-1);
    return (arr[y*w+x]*(1-u)+arr[y*w+x1]*u)*(1-v)
       +(arr[y1*w+x]*(1-u)+arr[y1*w+x1]*u)*v;
  }
  function drawCPU(dt,t){
    const s=fallbackState;if(!s)return;
    const {sx,sy,a,b,image}=s;
    for(let y=0;y<sy;y++)for(let x=0;x<sx;x++){
      const uvx=(x+.5)/sx,uvy=(y+.5)/sy;
      const px=(uvx-.5)*sizes.w/sizes.h,py=(uvy-.5);
      const ax=px*5+t*.39,ay=py*7.7-t*.34,bx=px*11-t*.24,by=py*8+t*.28;
      const vx=42*(7.7*Math.sin(ax)*Math.cos(ay)+.34*8*Math.cos(bx)*Math.cos(by))/7.7;
      const vy=-42*(5*Math.cos(ax)*Math.sin(ay)-.34*11*Math.sin(bx)*Math.sin(by))/7.7;
      const old=sample(a,x-vx*dt*sx/sizes.w,y-vy*dt*sy/sizes.h,sx,sy);
      const distance=Math.min((sceneHalf.x-Math.abs(uvx-.5))*sizes.w,
                              (sceneHalf.y-Math.abs(uvy-.5))*sizes.h);
      const w1=Math.sin(px*15.7+py*4.2+t*.82+Math.sin(py*8-t*.36)*1.8);
      const w2=Math.sin(py*18.4-px*6.6-t*.61+Math.sin(px*10+t*.4));
      const reach=63+18*w1+15*w2+9*Math.sin(t*.73+px*8);
      const inlet=1-(clamp((distance+15)/(Math.max(12,reach)+15),0,1))**2;
      const source=inlet*Math.max(.04,.52+.26*w1+.19*w2)*2.4;
      const d=b[y*sx+x]=clamp(old*Math.exp(-dt*.55)+dt*source,0,1);
      const p=(y*sx+x)*4;
      const curl=Math.sin(uvx*23+t*.68+Math.sin(uvy*19-t*.47)*1.7);
      const width=Math.min(93,sizes.h*.16);
      const v=clamp((distance+curl*11-7)/Math.max(1,width-7),0,1);
      const smokeZone=1-v*v*(3-2*v);
      const alpha=clamp(d**.80*.66*smokeZone,0,.72);
      image.data[p]=0;image.data[p+1]=0;image.data[p+2]=0;image.data[p+3]=Math.round(255*alpha);
    }
    s.a=b;s.b=a;fallback.putImageData(image,0,0);
  }

  // Developer-only 3D inspection. The actual live background, enemy, WebGL/CPU
  // fog canvas and camera player are reparented, not replaced or screenshotted.
  const devStage=document.getElementById('dev-stage');
  const devRig=document.getElementById('dev-rig');
  const devTools=document.getElementById('dev-tools');
  const devSelect=document.getElementById('dev-layer');
  const devActorControls=document.getElementById('dev-actor-controls');
  const devStatus=document.getElementById('dev-status');
  const editorDefaults=Object.freeze({
    bg:{z:-235},enemy:{x:61.5,y:18,size:64,z:-190},
    fog:{z:0},player:{x:8,y:-3,size:82,z:160}
  });
  const EDITOR_KEY='paperchalk-layer-editor-v1';
  const editorBounds={
    x:[-20,110],y:[-40,85],size:[12,120],z:[-420,350]
  };
  const copyDefaults=()=>JSON.parse(JSON.stringify(editorDefaults));
  function sanitizeEditor(data){
    const next=copyDefaults();
    if(!data||typeof data!=='object')return next;
    for(const id of ['bg','enemy','fog','player']){
      const item=data[id];
      if(!item||typeof item!=='object')continue;
      for(const key of Object.keys(next[id])){
        const value=Number(item[key]),bounds=editorBounds[key];
        if(Number.isFinite(value))next[id][key]=clamp(value,...bounds);
      }
    }
    return next;
  }
  function readEditor(){
    try{return sanitizeEditor(JSON.parse(localStorage.getItem(EDITOR_KEY)))}
    catch(_){return copyDefaults()}
  }
  let editorConfig=readEditor(),editorActive=false;
  let selectedLayer='enemy';
  const devCamera={yaw:-36,pitch:-11,zoom:.68,panX:-45,panY:12};
  // Fog stays attached to its original view; only its live texture is mirrored.
  const devPlanes=[stage,enemyDepth,cameraPlayer];
  const devFogPreview=document.getElementById('dev-fog-preview');
  const devFogContext=devFogPreview.getContext('2d',{alpha:true});
  let lastFogMirror=0;
  const layerAnchors=new Map();
  function applyEditorVisuals(){
    const enemy=editorConfig.enemy,player=editorConfig.player;
    document.getElementById('actor-enemy').style.left=enemy.x+'%';
    document.getElementById('actor-enemy').style.bottom=enemy.y+'%';
    document.getElementById('actor-enemy').style.height=enemy.size+'%';
    document.getElementById('actor-player').style.left=player.x+'cqw';
    document.getElementById('actor-player').style.bottom=player.y+'cqh';
    document.getElementById('actor-player').style.height=player.size+'cqh';
    for(const name of ['bg','enemy','fog','player']){
      devRig.style.setProperty('--dev-depth-'+name,editorConfig[name].z+'px');
    }
  }
  function applyDevCamera(){
    devRig.style.transform='translate3d('+devCamera.panX.toFixed(1)+'px,'+
      devCamera.panY.toFixed(1)+'px,0) rotateY('+devCamera.yaw.toFixed(1)+
      'deg) rotateX('+devCamera.pitch.toFixed(1)+'deg) scale('+devCamera.zoom.toFixed(3)+')';
    devStage.dataset.yaw=String(devCamera.yaw);
    devStage.dataset.zoom=String(devCamera.zoom);
  }
  function setDevStatus(message){devStatus.textContent=message}
  function refreshEditorControls(){
    const config=editorConfig[selectedLayer];
    devSelect.value=selectedLayer;
    devActorControls.hidden=!(selectedLayer==='enemy'||selectedLayer==='player');
    for(const field of ['x','y','size','z']){
      const input=document.getElementById('dev-'+field);
      const output=document.getElementById('dev-'+field+'-value');
      if(config[field]!==undefined){
        input.value=String(config[field]);
        output.textContent=String(config[field])+(field==='z'?'px':'%');
      }
    }
  }
  function selectEditorLayer(name){
    if(!editorConfig[name])return;
    selectedLayer=name;refreshEditorControls();
    devStage.dataset.selected=name;
  }
  function enterDeveloper(){
    if(editorActive||transitioning)return;
    if(stage.dataset.scene!=='classroom')openScene('classroom');
    editorActive=true;
    for(const plane of devPlanes){
      const mark=document.createComment('original position for '+plane.id);
      plane.before(mark);layerAnchors.set(plane,mark);devRig.appendChild(plane);
    }
    view.classList.add('dev-mode');
    devStage.hidden=false;devTools.hidden=false;
    applyEditorVisuals();applyDevCamera();selectEditorLayer(selectedLayer);
    setDevStatus('正在查看实时图层');
    start();
  }
  function exitDeveloper(){
    if(!editorActive)return;
    editorActive=false;view.classList.remove('dev-mode');
    for(const plane of devPlanes){
      const mark=layerAnchors.get(plane);
      if(mark)mark.replaceWith(plane);
    }
    layerAnchors.clear();
    devStage.hidden=true;devTools.hidden=true;
    start();
  }
  document.getElementById('dev-trigger').addEventListener('click',enterDeveloper);
  document.getElementById('dev-exit').addEventListener('click',exitDeveloper);
  devSelect.addEventListener('change',()=>selectEditorLayer(devSelect.value));
  for(const field of ['x','y','size','z']){
    document.getElementById('dev-'+field).addEventListener('input',event=>{
      if(editorConfig[selectedLayer][field]===undefined)return;
      editorConfig[selectedLayer][field]=Number(event.target.value);
      applyEditorVisuals();refreshEditorControls();
      setDevStatus('已预览修改；点击保存位置以保留');
    });
  }
  document.getElementById('dev-save').addEventListener('click',()=>{
    try{
      localStorage.setItem(EDITOR_KEY,JSON.stringify(editorConfig));
      setDevStatus('已保存到当前浏览器，退出后仍然生效');
    }catch(_){setDevStatus('浏览器未允许本地保存')}
  });
  document.getElementById('dev-reset').addEventListener('click',()=>{
    editorConfig=copyDefaults();applyEditorVisuals();refreshEditorControls();
    try{localStorage.removeItem(EDITOR_KEY)}catch(_){}
    setDevStatus('已恢复原始位置与层间距');
  });
  document.getElementById('dev-copy').addEventListener('click',async()=>{
    const data=JSON.stringify(editorConfig,null,2);
    try{
      await navigator.clipboard.writeText(data);
      setDevStatus('参数 JSON 已复制');
    }catch(_){
      window.prompt('复制分层参数',data);
    }
  });
  function setDevView(yaw,pitch,zoom,panX=0,panY=0){
    Object.assign(devCamera,{yaw,pitch,zoom,panX,panY});applyDevCamera();
  }
  document.getElementById('dev-front').addEventListener('click',
    ()=>setDevView(0,0,.77,-70,0));
  document.getElementById('dev-side').addEventListener('click',
    ()=>setDevView(-69,-8,.65,-85,5));
  document.getElementById('dev-camera-reset').addEventListener('click',
    ()=>setDevView(-36,-11,.68,-45,12));
  devStage.addEventListener('contextmenu',e=>e.preventDefault());
  let cameraDrag=null;
  devStage.addEventListener('pointerdown',e=>{
    if(!editorActive||e.target.id==='actor-enemy'||e.target.id==='actor-player')return;
    e.preventDefault();
    cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY,
      yaw:devCamera.yaw,pitch:devCamera.pitch,
      panX:devCamera.panX,panY:devCamera.panY,
      pan:e.button===2||e.shiftKey};
    devStage.setPointerCapture(e.pointerId);
  });
  devStage.addEventListener('pointermove',e=>{
    if(!cameraDrag||cameraDrag.id!==e.pointerId)return;
    let dx=e.clientX-cameraDrag.x,dy=e.clientY-cameraDrag.y;
    if(isVirtualLandscape()){const tmp=dx;dx=dy;dy=-tmp}
    if(cameraDrag.pan){
      devCamera.panX=cameraDrag.panX+dx;
      devCamera.panY=cameraDrag.panY+dy;
    }else{
      devCamera.yaw=clamp(cameraDrag.yaw+dx*.36,-88,88);
      devCamera.pitch=clamp(cameraDrag.pitch-dy*.32,-70,70);
    }
    applyDevCamera();
  });
  function stopCameraDrag(e){
    if(cameraDrag&&cameraDrag.id===e.pointerId)cameraDrag=null;
  }
  devStage.addEventListener('pointerup',stopCameraDrag);
  devStage.addEventListener('pointercancel',stopCameraDrag);
  devStage.addEventListener('wheel',e=>{
    if(!editorActive)return;
    e.preventDefault();
    devCamera.zoom=clamp(devCamera.zoom*Math.exp(-e.deltaY*.0012),.28,1.7);
    applyDevCamera();
  },{passive:false});
  for(const [imageId,key] of [['actor-enemy','enemy'],['actor-player','player']]){
    const img=document.getElementById(imageId);
    let drag=null;
    img.addEventListener('pointerdown',e=>{
      if(!editorActive)return;
      e.stopPropagation();e.preventDefault();
      selectEditorLayer(key);
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,
        startX:editorConfig[key].x,startY:editorConfig[key].y};
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener('pointermove',e=>{
      if(!drag||drag.id!==e.pointerId)return;
      e.stopPropagation();
      let dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(isVirtualLandscape()){const temp=dx;dx=dy;dy=-temp}
      const reference=key==='enemy'?enemyDepth:cameraPlayer;
      const scaleW=reference.offsetWidth*devCamera.zoom||1;
      const scaleH=reference.offsetHeight*devCamera.zoom||1;
      editorConfig[key].x=clamp(Math.round((drag.startX+dx/scaleW*100)*2)/2,...editorBounds.x);
      editorConfig[key].y=clamp(Math.round((drag.startY-dy/scaleH*100)*2)/2,...editorBounds.y);
      applyEditorVisuals();refreshEditorControls();
      setDevStatus('拖动位置已预览；点击保存位置确认');
    });
    const end=e=>{if(drag&&drag.id===e.pointerId){e.stopPropagation();drag=null}};
    img.addEventListener('pointerup',end);
    img.addEventListener('pointercancel',end);
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='F2'){
      e.preventDefault();editorActive?exitDeveloper():enterDeveloper();
    }else if(e.key==='Escape'&&editorActive){e.preventDefault();exitDeveloper()}
  },true);
  applyEditorVisuals();
  if(new URLSearchParams(location.search).get('dev')==='1'){
    enterDeveloper();
  }
  function tick(now){
    raf=0;if(document.hidden)return;
    let dt=last?clamp((now-last)/1000,.001,.055):1/60;last=now;
    const k=1-Math.exp(-dt*7);
    if(reduced.matches||!tiltEnabled||editorActive){aimX=0;aimY=0}
    currentX+=(aimX-currentX)*k;currentY+=(aimY-currentY)*k;
    stage.style.transform='rotateY('+(currentX*6.0).toFixed(3)+'deg) rotateX('+(-currentY*4.6).toFixed(3)+'deg)';
    // Enemy is only slightly nearer than the classroom back wall.
    // The player stays camera-pinned; black fog remains screen-space.
    // Editor Z gap changes the in-game enemy parallax without ever moving
    // the camera player. Defaults exactly match the approved subtle tilt.
    const depthFactor=clamp((editorConfig.enemy.z-editorConfig.bg.z)/45,0,3);
    const parallaxPx=Math.min(6,sizes.w*.005)*depthFactor;
    enemyDepth.style.transform='translate(-50%,-50%) translate3d('+
      (currentX*parallaxPx).toFixed(2)+'px,'+
      (currentY*parallaxPx*.55).toFixed(2)+'px,0) rotateY('+
      (currentX*(6.0+.3*depthFactor)).toFixed(3)+'deg) rotateX('+
      (-currentY*(4.6+.22*depthFactor)).toFixed(3)+'deg)';
    fluidTime+=reduced.matches?0:dt;
    if(gl)drawGPU(dt,fluidTime);
    else if(fallback)drawCPU(dt,fluidTime);
    fog.dataset.frames=String(++frameNumber);
    if(editorActive && now-lastFogMirror>=85){
      lastFogMirror=now;
      try{
        devFogContext.clearRect(0,0,devFogPreview.width,devFogPreview.height);
        devFogContext.drawImage(fog,0,0,devFogPreview.width,devFogPreview.height);
        devFogPreview.dataset.mirrorFrames=String(frameNumber);
      }catch(error){
        // Fog must never stop rendering because the preview is unavailable.
        devFogPreview.dataset.mirrorError=String(error);
      }
    }
    // No 10/16/24 FPS steps: every browser animation frame advances the SAME
    // persistent fluid density and composites the independent screen fog.
    if(!reduced.matches||Math.abs(currentX)+Math.abs(currentY)>.001)raf=requestAnimationFrame(tick);
  }
  function start(){if(!raf)raf=requestAnimationFrame(tick)}
  window.addEventListener('pointermove',e=>{
    if(editorActive||!fine.matches||e.pointerType==='touch'||reduced.matches)return;
    aimX=clamp(e.clientX/Math.max(1,innerWidth)*2-1,-1,1);
    aimY=clamp(e.clientY/Math.max(1,innerHeight)*2-1,-1,1);
    start();
  },{passive:true});
  view.addEventListener('pointerleave',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('blur',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('resize',()=>{updatePhoneLayout();resize();centreSensor();start()},{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0;if(!document.hidden)start()});
  reduced.addEventListener?.('change',()=>{last=0;start()});
  if(!initGPU())initCPU();
  updatePhoneLayout();resize();start();
})();
</script>
</body>
</html>
