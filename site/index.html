<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Paperchalk World · 场景</title>
<style>
@font-face{font-family:"PaperSerif";src:url("./assets/fonts/PaperSerif-Medium.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"PaperSans";src:url("./assets/fonts/PaperSans-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark;
 --font-menu:"PaperSerif","Noto Serif CJK SC","Songti SC",serif;
 --font-name:var(--font-menu);
 --font-dialogue:var(--font-menu);
 --font-ui:var(--font-menu)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#view{
  position:fixed;inset:0;display:grid;place-items:center;
  overflow:hidden;background:#000;perspective:1500px;
  container-type:size;touch-action:none;
  /* One logical-viewport scale for every player-facing game control. */
  --game-control-size:clamp(52px,8.2cqh,64px);
  --game-control-icon:clamp(30px,4.7cqh,36px);
  --game-control-row:clamp(52px,7.7cqh,62px);
  --game-control-text:clamp(16px,2.75cqh,22px);
}
/* The Android APK uses a real landscape Activity. A normal browser tab
   cannot force OS rotation, so render its COMPLETE game viewport rotated
   immediately in portrait. No tap, permission, overlay, or fake lock needed. */
body.mobile-mode.virtual-landscape #view{
  inset:auto;top:0;left:100vw;width:100dvh;height:100vw;
  transform-origin:top left;transform:rotate(90deg);
}
#scene{
  --rim-solid:12px;--rim-feather:7px;
  position:relative;flex:none;margin:0;
  width:min(94vw,calc(94dvh * 16 / 9));
  width:min(94cqw,calc(94cqh * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  transform-origin:center center;
  transform:rotateX(0deg) rotateY(0deg);
  will-change:transform;backface-visibility:hidden;
}
#scene img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none;-webkit-user-drag:none}
#scene::after{
  /* STEP 1: A tiny photo-attached black feather with smoothly rounded
     corners. No intersecting horizontal/vertical dark gradients. */
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  /* Solid 12px edge plus 7px feather: ~1–2% of the original image.
     This stays black even after the picture rotates behind the fog. */
  box-sizing:border-box;
  border:var(--rim-solid) solid #000;
  border-radius:16px;
  box-shadow:inset 0 0 var(--rim-feather) 0 #000;
}
#fog{
  position:fixed;inset:0;display:block;width:100%;height:100%;
  pointer-events:none;image-rendering:auto;
  /* independent viewport-space layer: mouse never transforms the fog */
}


/* 1803 × 872 approved landscape reference, scaled in LOGICAL GAME viewport.
   3.1% / 4.0% top controls; 8.3% / 8% dialogue. Container units
   correctly follow the game in actual Android landscape and rotated browser portrait.
   No panel, no rectangular frame, no extra gradient, no smoke layers. */
#novel-ui{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-dialogue);
  font-weight:400;letter-spacing:.045em;
  --ui-ink:#f5f5f1;
}
#novel-ui button{
  appearance:none;border:0!important;border-radius:0!important;box-shadow:none!important;
  background:none!important;backdrop-filter:none!important;
  -webkit-tap-highlight-color:transparent;color:inherit;font:inherit;
  pointer-events:auto;cursor:pointer;touch-action:manipulation;
  text-shadow:0 1px 5px #000;
}
#novel-ui button:focus-visible{outline:1px solid var(--ui-ink);outline-offset:3px}
#top-menu{position:absolute;top:max(7px,3.7cqh);left:max(8px,2.7cqw)}
#top-menu button{font-family:var(--font-ui);font-size:var(--game-control-icon);font-weight:300;line-height:1;width:var(--game-control-size);height:var(--game-control-size);display:grid;place-items:center;text-align:center;padding:0}
#top-actions{position:absolute;top:max(7px,3.8cqh);right:max(9px,3.0cqw);display:flex;align-items:center;gap:max(10px,3.2cqw)}
#top-actions button{font-family:var(--font-ui);font-size:var(--game-control-text);min-height:var(--game-control-size);min-width:var(--game-control-size);padding:0 8px}
#top-actions button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:6px}
#dialogue{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;pointer-events:auto;text-shadow:0 1px 6px #000}
#speaker{font-family:var(--font-name);font-weight:500;font-size:clamp(12px,2.75cqh,70px);line-height:1.25;margin:0 0 max(7px,1.8cqh)}
#dialogue-text{font-family:var(--font-dialogue);font-weight:400;font-size:clamp(14px,2.95cqh,74px);line-height:1.46;margin:0;max-width:100%;overflow-wrap:anywhere}
#advance{position:absolute;right:max(15px,8.8cqw);bottom:max(16px,6.3cqh)}
#advance button{font-size:var(--game-control-icon);line-height:1;width:var(--game-control-size);height:var(--game-control-size);padding:0;display:grid;place-items:center;text-align:center}
#menu-choices{position:absolute;top:calc(max(7px,3.7cqh) + var(--game-control-size) + 8px);left:max(9px,2.7cqw);display:flex;flex-direction:column;align-items:flex-start;gap:max(4px,1.1cqh);max-height:calc(100% - max(7px,3.7cqh) - var(--game-control-size) - 18px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;pointer-events:auto}
#menu-choices button{font-size:var(--game-control-text);padding:8px 10px;min-height:var(--game-control-row);min-width:clamp(150px,21cqw,230px);text-align:left}
#history{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;max-height:54cqh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;text-shadow:0 1px 6px #000;scrollbar-width:thin}
#history p{font-size:clamp(12px,2.15cqh,54px);line-height:1.65;margin:.28em 0}
#history .log-speaker{color:#eee9}
#novel-ui [hidden]{display:none!important}
@container (max-height:445px){
  #novel-ui{letter-spacing:.015em}
  #top-menu{top:5px}
  #top-actions{top:5px}
  #dialogue{width:78cqw;bottom:max(15px,7.5cqh)}
  #speaker{font-size:clamp(11px,2.65cqh,15px);margin-bottom:5px}
  #dialogue-text{font-size:clamp(12px,3.0cqh,17px);line-height:1.38}
  #advance{right:clamp(10px,8.5cqw,100px);bottom:max(12px,6cqh)}
}



/* RIGHT QUICK TOOLS V2: equal 52–64px touch areas and 30–36px stroke icons;
   transparent, frameless, and anchored at the same right-center position. */
#quick-tools{
  position:absolute;right:max(8px,2.6cqw);top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px,2.9cqh,22px);pointer-events:auto;
  font-family:var(--font-ui);
}
#quick-tools .quick-tool{
  width:var(--game-control-size);height:var(--game-control-size);
  min-width:var(--game-control-size);min-height:var(--game-control-size);padding:0!important;
  display:flex;align-items:center;justify-content:center;
  color:var(--ui-ink);background:transparent!important;
  border:0!important;box-shadow:none!important;
}
#quick-tools .quick-tool-icon{
  display:block;width:var(--game-control-icon);
  height:var(--game-control-icon);
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
  flex:none;overflow:visible;
}
#quick-tools .quick-tool:focus-visible{
  outline:1px solid var(--ui-ink);outline-offset:1px;
}
#quick-tools .quick-tool[aria-expanded="true"] .quick-tool-icon{opacity:1}
#quick-tools .quick-tool:active .quick-tool-icon{transform:scale(.94)}
#quick-tools .quick-tool:hover .quick-tool-icon{opacity:.8}
#quick-panel{
  position:absolute;top:50%;right:calc(max(8px,2.6cqw) + var(--game-control-size) + clamp(10px,1.5cqw,22px));
  transform:translateY(-50%);
  width:clamp(160px,22cqw,320px);max-height:65cqh;
  padding:8px 4px;color:var(--ui-ink);
  border:0!important;border-radius:0!important;
  box-shadow:none!important;background:transparent!important;
  backdrop-filter:none!important;
  pointer-events:auto;overflow-y:auto;
  font-family:var(--font-ui);font-size:clamp(11px,2.1cqh,16px);
  line-height:1.7;text-shadow:0 1px 5px #000;
}
#quick-panel h2{
  margin:0 0 8px;font:inherit;font-weight:500;
  font-size:clamp(14px,2.5cqh,19px);
}
#quick-panel p{margin:0;color:#eaeae6}
#quick-panel button{margin-top:8px;padding:8px 0!important;min-height:var(--game-control-row);font-size:var(--game-control-text)}
@media (prefers-reduced-motion:reduce){
  #quick-tools .quick-tool-icon{transition:none}
}

/* APPROVED TOP HUD V2 — centred on the ENTIRE logical viewport.
   Everything uses unframed white strokes, native status segments and numbers;
   the right-hand clock is positioned independently of the three vitals. */
#hud-top{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  white-space:nowrap;color:#f5f5f1;font-family:var(--font-ui);
  font-variant-numeric:tabular-nums;font-weight:400;
  font-size:clamp(12px,2.55cqh,24px);line-height:1.12;
  text-shadow:0 1px 5px #000;letter-spacing:.005em;
}
#hud-vitals{
  position:absolute;top:max(7px,3.35cqh);left:50%;
  display:flex;align-items:center;gap:clamp(10px,1.35cqw,24px);
  width:max-content;max-width:none;
  transform:translateX(-50%) scale(var(--hud-scale,1));
  transform-origin:50% 0;
}
.hud-stat{display:flex;align-items:center;gap:clamp(6px,.58cqw,12px);flex:none}
.hud-stat-icon{
  display:block;width:clamp(22px,3.25cqh,34px);height:clamp(22px,3.25cqh,34px);
  flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.hud-segments{
  /* Ten fixed tracks. Only the white fill inside each slot is allowed to
     change; empty tracks always remain visible at their original positions. */
  display:grid;grid-template-columns:repeat(10,minmax(0,1fr));
  align-items:stretch;gap:clamp(2px,.16cqw,4px);
  flex:none;width:clamp(54px,7.2cqw,129px);height:clamp(5px,.65cqh,7px);
}
.hud-segment{position:relative;min-width:0;width:100%;height:100%;background:rgba(245,245,241,.34);border-radius:1px;overflow:hidden}
.hud-segment>i{position:absolute;inset:0 auto 0 0;display:block;height:100%;width:0;background:#f5f5f1;transition:width .48s cubic-bezier(.2,.75,.3,1)}
@media(prefers-reduced-motion:reduce){.hud-segment>i{transition:none!important}}
.hud-exact[data-pulse="true"]{animation:stat-delta .5s ease-out}
@keyframes stat-delta{0%{opacity:.46;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
.hud-exact{
  /* Reserve the entire numeric field even when 100/100 becomes 9/100.
     Otherwise text reflow changes total HUD width and fit scale as HP drains. */
  flex:none;width:var(--hud-number-width,7.4ch);min-width:0;
  font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1;text-align:left;
}
.hud-divider{flex:none;width:1px;height:clamp(18px,2.35cqh,26px);background:rgba(245,245,241,.56)}
#hud-clock{
  position:absolute;top:max(7px,3.35cqh);right:2.65cqw;
  display:flex;align-items:center;gap:clamp(7px,1.05cqw,20px);
  line-height:1.12;letter-spacing:.02em;
}
#hud-clock .hud-moon{
  width:clamp(15px,2.25cqh,24px);height:clamp(15px,2.25cqh,24px);
  flex:none;fill:none;stroke:currentColor;stroke-width:1.65;
  stroke-linecap:round;stroke-linejoin:round;
}
@container (max-width:1100px){
  #hud-top{font-size:clamp(11px,2.42cqh,19px)}
  #hud-vitals{gap:clamp(7px,1.1cqw,15px)}
  .hud-stat{gap:clamp(4px,.45cqw,7px)}
  .hud-segments{width:clamp(37px,6.5cqw,83px)}
  #hud-clock{gap:clamp(5px,.72cqw,11px);right:2.3cqw}
}
@container (max-width:740px){
  #hud-top{font-size:clamp(10px,2.2cqh,14px)}
  #hud-vitals{gap:clamp(4px,.7cqw,8px)}
  .hud-stat{gap:3px}
  .hud-stat-icon{width:clamp(16px,2.9cqh,23px);height:clamp(16px,2.9cqh,23px)}
  .hud-segments{width:clamp(25px,5.55cqw,44px);gap:1px;height:4px}
  .hud-exact{width:var(--hud-number-width,7.4ch)}
  .hud-divider{height:15px}
  #hud-clock{gap:clamp(3px,.6cqw,7px);right:1.8cqw}
}
/* No fog background for always-visible top HUD, only the ORIGINAL scene rim. */

/* The moving scene fog and UI-edge smoke are WORLD fog. Both MUST remain
   behind the visible player L2D and in front of enemy L2D. The UI controls
   themselves remain above the player, so dialogue stays interactive.
   A UI-edge canvas nested inside #novel-ui (z=6) used to darken the player. */
#ui-edge-fog{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;z-index:4;pointer-events:none;image-rendering:auto;
}
#ui-edge-fog[hidden],#view.dev-mode #ui-edge-fog,
#view.fog-edit-mode #ui-edge-fog{display:none!important}
/* Only the phone's tiny localized contact fog is an above-player UI effect.
   The full-width bottom/side/top smoke is now beneath the player. */
#novel-ui > :not(#ui-phone-fog):not(#ui-fog-state){z-index:1}
#novel-ui #ui-phone-fog{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:2;display:block;pointer-events:none;image-rendering:auto;
}
#novel-ui > #phone-ui{z-index:1!important}
#novel-ui > #quick-tools,
#novel-ui > #top-menu,
#novel-ui > #menu-choices,
#novel-ui > #dialogue,
#novel-ui > #advance,
#novel-ui > #history,
#novel-ui > #quick-panel{z-index:3!important}
#novel-ui #ui-fog-state{display:none!important}
#novel-ui #dialogue:not([hidden]),#novel-ui #history:not([hidden]),
#novel-ui #menu-choices:not([hidden]){
  animation:ui-content-settle 230ms ease-out both;
}
@keyframes ui-content-settle{from{opacity:.35}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  #novel-ui #dialogue,#novel-ui #history,#novel-ui #menu-choices{animation:none!important}
}

/* SCENE TEMPLATE: one image, 3D tilt, stage-locked actions, viewport black fog. */
#scene-menu{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-menu);
  font-weight:400;letter-spacing:.065em;text-shadow:0 1px 5px #000;
}
#scene-menu .scene-menu-options{
  position:absolute;left:60.5%;top:44%;display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(3px,1.0cqh,18px);
}
#scene-menu button{
  font-family:var(--font-menu);
  appearance:none;display:block;border:0;border-radius:0;background:none;
  box-shadow:none;color:inherit;font:inherit;
  line-height:1.35;white-space:nowrap;text-align:left;
  font-size:var(--game-control-text);
  min-width:clamp(168px,22cqw,232px);min-height:var(--game-control-row);
  padding:8px 10px;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  opacity:.90;transition:opacity 150ms ease;text-shadow:inherit;
}
#scene-menu button:hover,#scene-menu button:focus-visible{opacity:1}
#scene-menu button:focus-visible{outline:1px solid #ccc;outline-offset:2px}
#scene-menu button:disabled{opacity:.28;cursor:default}
#scene-menu [hidden],#scene-menu[hidden],#novel-ui[hidden]{display:none!important}
@container (max-height:445px){
  #scene-menu .scene-menu-options{left:60%;top:33%;gap:2px}
  #scene-menu button{font-size:clamp(15px,2.7cqh,19px);min-height:48px}
}


/* Real depth composition, front to back:
   interactive UI (6) > camera player L2D (5) > live UI-edge smoke (4)
   > original viewport fog (3) > enemy L2D (2) > scene (1).
   Fog may obscure the enemy but NEVER paint over the visible heroine. */
#scene{z-index:1}
#enemy-depth-root{
  position:absolute;left:50%;top:50%;
  width:min(94vw,calc(94dvh * 16 / 9));
  width:min(94cqw,calc(94cqh * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  z-index:2;pointer-events:none;
  transform-origin:center center;
  transform:translate(-50%,-50%) rotateY(0deg) rotateX(0deg);
  will-change:transform;backface-visibility:hidden;
}
#enemy-depth-root[hidden],#camera-player-root[hidden]{display:none!important}
#enemy-depth-root #actor-enemy[hidden]{display:none!important}
#enemy-depth-root #actor-enemy{
  position:absolute;display:block;left:46%;bottom:12%;height:48%;
  width:auto;aspect-ratio:1 / 1;max-width:none;object-fit:contain;object-position:bottom center;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
#fog{z-index:3}
#camera-player-root{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  /* The player stays camera-near but responds subtly to view direction.
     Its plane tilts independently; it never inherits the background tilt. */
  transform-origin:27% 42%;
  transform:rotateY(0deg) rotateX(0deg);
  will-change:transform;
}
#camera-player-root #actor-player{
  position:absolute;display:block;left:calc(27cqw - 64cqh);bottom:-43.5cqh;height:128cqh;
  width:auto;aspect-ratio:1 / 1;max-width:none;object-fit:contain;object-position:bottom center;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
/* The same saved protagonist transform is used in classrooms and all rooms.
   Do not override the DEV-authored inline x/y/size on environment scenes. */
@container (max-height:445px){
  #enemy-depth-root #actor-enemy{height:48%;width:27%;left:46%;bottom:12%}
  #camera-player-root #actor-player{height:128cqh;width:128cqh;left:calc(27cqw - 64cqh);bottom:-43.5cqh}
}

/* BLACK-only scene transition, independent of the original running fluid fog */
#scene-transition{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse at 50% 47%,rgba(0,0,0,0) 0%,rgba(0,0,0,.23) 37%,rgba(0,0,0,.68) 69%,#000 100%);
 --core-black:0}
#scene-transition::after{content:"";position:absolute;inset:0;background:#000;
 opacity:var(--core-black);pointer-events:none}
#scene-transition[data-active="true"]{pointer-events:auto;touch-action:none}
#scene-menu,#novel-ui{transition:opacity 150ms ease}
@media(prefers-reduced-motion:reduce){#scene-menu,#novel-ui{transition:none}}
@media(prefers-reduced-motion:reduce){#scene{transform:none!important;will-change:auto}}

/* One developer panel: fog on current scene; other layers in 3D. */
#view.fog-edit-mode #novel-ui,#view.fog-edit-mode #scene-menu,
#view.dev-mode #scene-menu{opacity:0!important;pointer-events:none!important}
#dev-fog-tools[hidden],#dev-z-control[hidden],#dev-layer-actions[hidden],
#dev-3d-controls[hidden]{display:none!important}
#dev-stage{position:absolute;inset:0;z-index:9;overflow:hidden;touch-action:none;perspective:950px}
#dev-stage[hidden],#dev-tools[hidden]{display:none!important}
#dev-rig{position:absolute;inset:0;transform-style:preserve-3d;
  transform-origin:50% 50%;will-change:transform;pointer-events:none}
#view.dev-mode{perspective:none}
#view.dev-mode #novel-ui,
#view.dev-mode #scene-transition{display:none!important}
#view.dev-mode #dev-rig > #scene,
#view.dev-mode #dev-rig > #enemy-depth-root,
#view.dev-mode #dev-rig > #fog,
#view.dev-mode #dev-rig > #camera-player-root{
  z-index:auto!important;transform-style:preserve-3d;backface-visibility:visible;
  pointer-events:none!important;
}
#view.dev-mode #dev-rig > #scene{
  position:absolute!important;left:50%;top:50%;margin:0!important;
  transform:translate(-50%,-50%) translateZ(var(--dev-depth-bg))!important;
  border:1px solid rgba(111,173,210,.9);
}
#view.dev-mode #dev-rig > #enemy-depth-root{
  transform:translate(-50%,-50%) translateZ(var(--dev-depth-enemy))!important;
  border:1px solid rgba(241,166,105,.95);
}
#view.dev-mode #dev-rig > #fog{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  transform:translateZ(var(--dev-depth-fog))!important;
}
#view.dev-mode #dev-rig > #camera-player-root{
  transform:translateZ(var(--dev-depth-player))!important;
  border:1px solid rgba(123,230,182,.9);
}
#view.dev-mode #dev-rig > #scene::before{
  content:"01 / 背景";position:absolute;top:4px;left:7px;z-index:8;
  color:#a6daef;font:12px var(--font-ui);text-shadow:0 1px 4px #000;
}
#view.dev-mode #enemy-depth-root::after,
#view.dev-mode #camera-player-root::after{
  position:absolute;top:6px;left:8px;font:12px var(--font-ui);
  color:#ffdaa9;text-shadow:0 1px 4px #000;pointer-events:none;
}
#view.dev-mode #enemy-depth-root::after{content:"02 / 敌人"}
#view.dev-mode #camera-player-root::after{content:"04 / 主角";color:#9eeac4}
#dev-fog-guide{
  position:absolute;inset:0;transform:translateZ(var(--dev-depth-fog));
  border:1px dashed rgba(186,186,203,.75);pointer-events:none;
}

/* DEV ONLY: an actual horizontal 3D floor, not a second flat background.
   Positive local Y becomes positive world Z after rotateX(90deg);
   perspective/grid convergence comes from the same camera as the scene planes. */
#dev-ground{
  position:absolute;left:50%;top:var(--dev-floor-y,77%);
  width:172cqw;height:230cqh;box-sizing:border-box;
  transform-origin:50% 0%;transform-style:preserve-3d;
  transform:translateX(-50%) translateZ(var(--dev-depth-ground,-215px)) rotateX(90deg);
  backface-visibility:visible;pointer-events:none;
  border:2px solid rgba(118,208,175,.8);
  background:
    linear-gradient(90deg,transparent calc(50% - 1px),rgba(239,189,104,.95) 50%,transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg,rgba(110,204,180,.65) 0 1px,transparent 1px 66px),
    repeating-linear-gradient(0deg,rgba(110,204,180,.65) 0 1px,transparent 1px 66px),
    linear-gradient(0deg,rgba(10,51,48,.12),rgba(11,58,48,.24));
  box-shadow:inset 0 0 70px rgba(26,100,79,.15);
}
#dev-ground[hidden]{display:none!important}
#dev-ground::before{
  content:"地板 / 水平XZ参照平面";position:absolute;top:10px;left:calc(50% + 8px);
  color:#d4ffed;background:rgba(5,21,20,.8);padding:3px 6px;
  font:15px var(--font-ui);white-space:nowrap;transform:translateZ(2px);
}
#dev-ground::after{
  content:"后墙 / 地面参考线";position:absolute;top:0;left:8px;
  color:#adffe0;background:rgba(4,20,17,.8);font:12px var(--font-ui);
  padding:3px 5px;transform:translateZ(2px);
}
#dev-ground-contact{
  position:absolute;top:var(--dev-foot-distance,25px);
  left:calc(50% + var(--dev-foot-x,0px));
  width:17px;height:17px;margin:-8px 0 0 -8px;
  border:3px solid #ffbd67;background:#131b14;border-radius:50%;
  transform:translateZ(3px);box-shadow:0 0 0 6px rgba(255,189,103,.16);
}
/* Real foot markers are projected onto the horizontal ground at exactly
   each character's L2D shoe-contact X/Z, never a fake image-edge marker. */
#dev-ground-contact{display:none!important}
#dev-ground .dev-shoe-contact{
  position:absolute;z-index:2;display:block;min-width:12px;height:16px;
  transform:translate(-50%,-50%) translateZ(3px);pointer-events:none;
  color:#f3e0a2;font:11px var(--font-ui);white-space:nowrap;
  text-shadow:0 1px 3px #000;background:#12170dda;border:1px solid #fff3ab;
  border-radius:10px;padding:2px 6px;
}
#dev-ground .dev-shoe-contact[data-actor="player"]{border-color:#8be5c8;color:#b1ffe3}
#dev-ground .dev-shoe-contact[data-actor="enemy"]{border-color:#ffbd67;color:#ffe6b9}
#dev-ground .dev-shoe-contact[hidden]{display:none!important}
#dev-floor-controls[hidden]{display:none!important}
#dev-tools .dev-floor-toggle{display:flex;align-items:center;gap:7px;margin:7px 0}
#dev-tools .dev-floor-toggle input{width:16px;height:16px;accent-color:#9ce6c8}

/* Never reparent the original WebGL canvas: some browsers lose their WebGL
   context when a live canvas moves into a 3D stacking context. The preview
   mirrors the actual flowing fog after each render, at a cheap low resolution. */
#view.dev-mode > #fog{visibility:hidden}
#dev-fog-preview{
  position:absolute;inset:0;width:100%;height:100%;
  transform:translateZ(var(--dev-depth-fog));
  pointer-events:none;image-rendering:auto;
}
#dev-fog-guide::before{content:"03 / 实时黑雾";position:absolute;left:8px;top:6px;
  color:#c6c6d0;font:12px var(--font-ui);text-shadow:0 1px 5px #000}
#view.dev-mode #dev-rig #actor-enemy,
#view.dev-mode #dev-rig #actor-player{pointer-events:auto!important;cursor:grab;touch-action:none}
#view.dev-mode #dev-rig #actor-enemy:active,
#view.dev-mode #dev-rig #actor-player:active{cursor:grabbing}
/* DEV panel must be an unframed layer of controls over native live black fog. */
#dev-tools{
  position:absolute;z-index:40;right:1.4cqw;top:2.5cqh;
  width:min(340px,46cqw);max-height:95cqh;overflow:auto;
  padding:12px 13px 14px;color:#eee;pointer-events:auto;
  font:13px var(--font-ui);background:transparent;
  border:0;border-radius:0;box-shadow:none;backdrop-filter:none;
  touch-action:pan-y;
}
#dev-panel-fog{
  position:absolute;inset:0;width:100%;height:100%;z-index:39;
  background:transparent;pointer-events:none;
  image-rendering:auto;
}
#dev-tools header,#dev-tools p,#dev-tools label,
#dev-tools strong,#dev-tools output,#dev-tools button{
  text-shadow:0 1px 5px rgba(0,0,0,.9);
}
#dev-tools button,#dev-tools select{
  appearance:none!important;background:transparent!important;
  border:0!important;border-radius:0!important;
  box-shadow:none!important;backdrop-filter:none!important;
}
#dev-tools select{
  border-bottom:1px solid rgba(224,229,226,.33)!important;
  padding:6px 2px;cursor:pointer;
}
#dev-tools option{background:#162029;color:#f5f5f1}
#dev-tools input[type=file]::file-selector-button{
  background:transparent;color:inherit;border:0;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
#dev-tools .dev-buttons button:hover,#dev-tools button:focus-visible{
  text-decoration:underline;text-underline-offset:3px;
}
#dev-fog-tools{border-top:0!important}
#dev-fog-tools button{
  background:transparent!important;border:0!important;
  border-radius:0!important;box-shadow:none!important;
}
#dev-tools header{display:flex;justify-content:space-between;align-items:center;gap:8px}
#dev-tools header strong{font-size:15px;letter-spacing:.04em}
#dev-tools button,#dev-tools select{
  cursor:pointer;border:1px solid #777;background:#20252a;color:#f1f1f1;
  padding:5px 8px;border-radius:3px;font:inherit;min-height:27px;
}
#dev-tools button:focus-visible,#dev-tools input:focus-visible,
#dev-tools select:focus-visible{outline:2px solid #a6d7ff}
#dev-tools .dev-buttons{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
#dev-tools p{font-size:11px;color:#bbb;line-height:1.5;margin:6px 0 9px}
#dev-tools label{display:block;margin:7px 0 1px;font-size:12px}
#dev-tools .dev-value{float:right;font-variant-numeric:tabular-nums;color:#a6ddfa}
#dev-tools input[type="range"]{display:block;width:100%;margin:4px 0 8px;accent-color:#a3cde4}
#dev-tools select{width:100%;margin-top:4px}
#dev-tools .dev-state{color:#9edebd;min-height:1.3em;display:block;font-size:11px}
#dev-tools .dev-hint{color:#c5c5c5;margin-bottom:0}
@container (max-height:445px){
  #dev-tools{font-size:11px;padding:7px 9px;width:min(270px,41cqw)}
  #dev-tools p{margin:3px 0 5px}
  #dev-tools label{margin:4px 0 0}
  #dev-tools input[type="range"]{margin:1px 0 4px}
  #dev-tools .dev-buttons{margin:4px 0}
}
/* Integrated fog settings share the existing developer panel. */
#fog-safe-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:9;pointer-events:none;box-sizing:border-box;border:1px dashed rgba(147,248,195,.85)}
#fog-safe-guide[hidden]{display:none!important}
#dev-fog-tools{border-top:1px solid #77929a;padding-top:7px;margin-top:8px}
#dev-fog-tools label{display:block;margin-top:8px}
#dev-fog-tools output{float:right;color:#9cdeb8;font-variant-numeric:tabular-nums}
#dev-fog-tools input[type="range"]{width:100%;margin:4px 0;accent-color:#8cd9b6}
#dev-fog-tools .fog-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
#dev-fog-tools p{font-size:11px;line-height:1.45;color:#bcd0ce}
#dev-fog-tools button{cursor:pointer;border:1px solid #77929a;border-radius:3px;background:#23343b;color:white;padding:6px}
/* Dynamic room selector reuses minimal UI, no new overlay during gameplay */
#scene-menu-gallery{max-height:52cqh;overflow-y:auto;scrollbar-width:thin}
#scene-switcher{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-height:45cqh;overflow-y:auto;scrollbar-width:thin}
#scene-switcher button{min-height:var(--game-control-row)}

/* Runtime L2D is the ONLY visible character renderer. Invisible images
   remain as layout/DEV drag targets; both player and every NPC use canvas. */
[data-l2d-image]{opacity:0!important}
[data-l2d-actor] [data-l2d-canvas]{
 position:absolute;display:block;width:auto;height:auto;max-width:none;
 left:0;top:0;pointer-events:none;user-select:none;image-rendering:auto;
}
[data-l2d-actor]:not([data-l2d-state="ready"]) [data-l2d-canvas]{visibility:hidden}
[data-l2d-actor][data-l2d-state="ready"] [data-l2d-canvas]{visibility:visible}
/* The baked V4 animated WebP is the visible final character inside the
   protagonist/NPC depth plane; no simple breathing canvas over it. */
[data-l2d-actor][data-l2d-mode="v4-native"] [data-l2d-canvas]{visibility:hidden!important}
[data-l2d-actor] img[data-l2d-v4]{opacity:1!important;visibility:visible!important;pointer-events:none!important}

</style>

<script src="./game/phone-ui.js?v=char001-confirmed-art-large-v3"></script>

<body>
<main id="view" aria-label="同一场景模板：背景和菜单随视角倾斜，纯黑流体雾固定在屏幕上">
  <figure id="scene" data-scene="menu" aria-label="主菜单：一面墙、一扇门和一盏灯">
    <img id="source" src="./assets/menu-wall.webp" width="1024" height="576"
         alt="昏暗的墙壁，一扇闭合的旧门和顶上的灯。" draggable="false">
    <div id="scene-menu" aria-label="主菜单场景文字">
      <nav id="scene-menu-main" class="scene-menu-options" aria-label="主菜单选项">
        <button id="menu-start" type="button">开始游戏</button>
        <button id="menu-continue" type="button" disabled>继续游戏</button>
        <button id="menu-settings-button" type="button">设置</button>
         <button id="menu-gallery-button" type="button">场景预览</button>
      </nav>
      <nav id="scene-menu-gallery" class="scene-menu-options" aria-label="场景列表" hidden></nav>
       <nav id="scene-menu-settings" class="scene-menu-options" aria-label="场景设置" hidden>
        <button id="tilt-toggle" type="button">场景倾斜：开启</button>
         <button id="menu-dev" type="button" aria-controls="dev-tools">开发者 DEV</button>
        
        <button id="menu-settings-back" type="button">返回</button>
      </nav>
    </div>
  </figure>
  <div id="enemy-depth-root" data-l2d-actor="enemy" aria-label="第二景深层：敌人（在黑雾后方）" hidden>
    <img id="actor-enemy" data-l2d-image alt="NPC 素材布局锚点" draggable="false" hidden>
    <canvas id="actor-enemy-l2d" data-l2d-canvas width="1024" height="1024" aria-label="NPC L2D 动画画布"></canvas>
  </div>
  <canvas id="fog" aria-hidden="true"></canvas>
  <!-- World-space dynamic UI fog is below the protagonist's complete L2D rig,
       not inside #novel-ui: fog obscures NPCs, never the foreground heroine. -->
  <canvas id="ui-edge-fog" aria-hidden="true" hidden></canvas>
  <div id="camera-player-root" data-l2d-actor="player" aria-label="镜头前景层：玩家（在黑雾前方）" hidden>
    <img id="actor-player" data-l2d-image src="./assets/characters/protagonist-back.webp" alt="背对镜头的主角素材定位锚点" draggable="false">
    <canvas id="actor-player-l2d" data-l2d-canvas width="1024" height="1024" aria-label="主角 L2D 动画画布"></canvas>
  </div>
  <div id="novel-ui" aria-label="黑雾极简互动界面" hidden>
    <canvas id="ui-phone-fog" aria-hidden="true"></canvas>
    <div id="ui-fog-state" hidden aria-hidden="true">
      <i class="ui-fog-band" data-edge="bottom" data-active="false"></i>
      <i class="ui-fog-band" data-edge="top" data-active="false"></i>
      <i class="ui-fog-band" data-edge="left" data-active="false"></i>
      <i class="ui-fog-band" data-edge="right" data-active="false"></i>
    </div>
    <nav id="top-menu" aria-label="游戏菜单">
      <button id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="menu-choices">☰</button>
    </nav>
    <nav id="quick-tools" aria-label="快捷工具">
      <button id="quick-backpack" class="quick-tool" type="button"
        aria-label="背包" aria-controls="quick-panel" aria-expanded="false" title="背包">
        <svg class="quick-tool-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 7V5.3a4 4 0 0 1 8 0V7"/>
          <rect x="4.5" y="6.5" width="15" height="15" rx="3"/>
          <path d="M4.5 11H3.2v6.8h1.3M19.5 11h1.3v6.8h-1.3"/>
          <path d="M8 13.5h8v4.2H8z"/>
        </svg>
      </button>
      <button id="quick-phone" class="quick-tool" type="button"
        aria-label="手机" aria-controls="phone-ui" aria-expanded="false" title="手机">
        <svg class="quick-tool-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4.2" y="2" width="15.6" height="20" rx="2"/>
          <path d="M10 4.3h4M4.2 18.8h15.6"/>
          <circle cx="12" cy="20.3" r=".55" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="quick-map" class="quick-tool" type="button"
        aria-label="地图" aria-controls="quick-panel" aria-expanded="false" title="地图">
        <svg class="quick-tool-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 5.5 9 3l6 2.5L21.5 3v15.5L15 21l-6-2.5-6.5 2.5z"/>
          <path d="M9 3v15.5M15 5.5V21"/>
        </svg>
      </button>
    </nav>
    <section id="quick-panel" data-ui-fog-edge="right" hidden
      aria-label="快捷工具内容" aria-live="polite">
      <h2 id="quick-panel-title"></h2>
      <p id="quick-panel-content"></p>
      <button id="quick-panel-close" type="button" aria-label="关闭快捷工具">关闭</button>
    </section>
    <div id="hud-top" aria-label="游戏日期时间与角色状态">
      <div id="hud-vitals" aria-label="生命、饥饿、理智">
        <div class="hud-stat" data-stat="health" role="group" aria-label="生命 82/100">
          <svg class="hud-stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 4.8c-2.2-2.2-5.8-2.2-8 0l-.6.6-.6-.6c-2.2-2.2-5.8-2.2-8 0s-2.2 5.8 0 8L12 21l8.6-8.2c2.2-2.2 2.2-5.8 0-8Z"/></svg>
          <span class="hud-segments" id="hud-health-meter" aria-hidden="true"></span>
          <span class="hud-exact" id="hud-health-value">82/100</span>
        </div>
        <span class="hud-divider" aria-hidden="true"></span>
        <div class="hud-stat" data-stat="hunger" role="group" aria-label="饥饿 67/100">
          <svg class="hud-stat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 2.5v6.1c0 1.8 1.5 3.3 3.3 3.3s3.3-1.5 3.3-3.3V2.5M5.7 2.5v6.7M7.9 2.5v6.7M6.8 11.9V21.5"/>
            <path d="M19.3 2.5c-3 2.1-4.7 5.1-4.7 10.3v1.1h4.7M19.3 2.5v19"/>
          </svg>
          <span class="hud-segments" id="hud-hunger-meter" aria-hidden="true"></span>
          <span class="hud-exact" id="hud-hunger-value">67/100</span>
        </div>
        <span class="hud-divider" aria-hidden="true"></span>
        <div class="hud-stat" data-stat="sanity" role="group" aria-label="理智 91/100">
          <svg class="hud-stat-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.7A4.1 4.1 0 0 0 4.7 6a4.2 4.2 0 0 0-2 6 4 4 0 0 0 2.2 5.8A4.1 4.1 0 0 0 12 20m0-15.3A4.1 4.1 0 0 1 19.3 6a4.2 4.2 0 0 1 2 6 4 4 0 0 1-2.2 5.8A4.1 4.1 0 0 1 12 20m0-15.3V20"/>
            <path d="M5 8.6c2.1-.1 3.3 1 3.3 3M4.3 15c1.8-1.1 3.5-.8 4.2.6M9 5.6c-1.4 2.2-.9 4.1 1 5.1M19 8.6c-2.1-.1-3.3 1-3.3 3M19.7 15c-1.8-1.1-3.5-.8-4.2.6M15 5.6c1.4 2.2.9 4.1-1 5.1"/>
          </svg>
          <span class="hud-segments" id="hud-sanity-meter" aria-hidden="true"></span>
          <span class="hud-exact" id="hud-sanity-value">91/100</span>
        </div>
      </div>
      <div id="hud-clock" aria-label="4月12日 周五 21点36分">
        <span id="hud-date">4月12日</span>
        <span id="hud-weekday">周五</span>
        <span id="hud-time">21:36</span>
        <svg class="hud-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14.7A9 9 0 0 1 9.3 3.2a9.2 9.2 0 1 0 11.5 11.5Z"/></svg>
      </div>
    </div>
    <div id="top-actions" aria-label="对话控制" hidden aria-hidden="true">
      <button id="auto-button" type="button" aria-pressed="false">AUTO</button>
      <button id="log-button" type="button" aria-pressed="false">LOG</button>
    </div>
    <div id="menu-choices" data-ui-fog-edge="left" hidden aria-label="游戏操作">
      <button id="restart-button" type="button">重新开始</button>
      <button id="return-main" type="button">返回主菜单</button>
      <button id="hide-button" type="button">隐藏文字</button>
       <button id="game-dev" type="button" aria-controls="dev-tools">开发者 DEV</button>
       <button id="scene-switcher-toggle" type="button" aria-expanded="false">切换场景</button>
       <div id="scene-switcher" aria-label="已安装场景" hidden></div>
    </div>
    <section id="dialogue" data-ui-fog-edge="bottom" aria-label="人物对白" aria-live="polite">
      <p id="speaker">???</p>
      <p id="dialogue-text">这间教室……和我记忆里的，不太一样。</p>
    </section>
    <div id="advance" data-ui-fog-edge="bottom"><button id="next-line" type="button" aria-label="下一句">▸</button></div>
    <div id="history" data-ui-fog-edge="bottom" hidden role="region" aria-label="对白记录"></div>
  </div>
  <div id="scene-transition" data-phase="idle" data-active="false" aria-hidden="true"></div>

  <div id="fog-safe-guide" aria-hidden="true" hidden></div>

  <div id="dev-stage" hidden aria-label="三维场景分层检查器">
    <div id="dev-rig">
      <div id="dev-ground" aria-label="人物 L2D 鞋底共用的真实水平三维地板">
        <div id="dev-ground-contact" aria-hidden="true"></div>
      </div>
      <canvas id="dev-fog-preview" width="384" height="216" aria-label="实时黑雾图层的缩小镜像"></canvas>
      <div id="dev-fog-guide" aria-hidden="true"></div>
    </div>
  </div>
  <canvas id="dev-panel-fog" aria-hidden="true"></canvas>
  <aside id="dev-tools" hidden aria-label="开发者分层编辑面板" data-ui-fog-edge="right">
    <header><strong>DEV · 分层与黑雾</strong><button id="dev-exit" type="button">完成 / 返回</button></header>
    <p>黑雾直接在当前场景预览；其他图层切换到 3D 视图，拖动空白处旋转镜头。</p>
    <div id="dev-3d-controls">
    <div class="dev-buttons">
      <button id="dev-front" type="button">正视角</button>
      <button id="dev-side" type="button">侧视角</button>
      <button id="dev-camera-reset" type="button">重置镜头</button>
      <button id="dev-top" type="button">俯视地板</button>
    </div>
    <label class="dev-floor-toggle" for="dev-ground-toggle">
      <input id="dev-ground-toggle" type="checkbox" checked>显示 3D 透视地板
    </label>
    </div>
    <label for="dev-layer">正在编辑图层</label>
    <select id="dev-layer">
      <option value="enemy">02 / 敌人</option>
      <option value="player">04 / 主角</option>
      <option value="bg">01 / 背景</option>
      <option value="fog">03 / 黑雾</option>
      <option value="ground">05 / 共同地板（脚底吸附）</option>
    </select>
    <div id="dev-actor-controls">
      <label for="dev-x">水平位置 <output id="dev-x-value" class="dev-value"></output></label>
      <input id="dev-x" type="range" min="-65" max="110" step=".5">

<script id="vertex" type="x-shader/x-vertex">
attribute vec2 a_position;

void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}

<script id="fluid" type="x-shader/x-fragment">
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_previous;
uniform vec2 u_simSize;
uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;
uniform float u_dt;
float edgeDistance(vec2 uv){
  vec2 v=u_half-abs(uv-.5);
  return min(v.x*u_viewSize.x,v.y*u_viewSize.y);
}
void main(){
  vec2 uv=v_uv;
  vec2 pixel=1.0/u_simSize;
  vec2 p=(uv-.5)*vec2(u_viewSize.x/u_viewSize.y,1.);
  float t=u_time;
  // Time-varying curl velocity from a stream function, not frame-swapped images.
  float ax=p.x*5.0+t*.39, ay=p.y*7.7-t*.34;
  float bx=p.x*11.0-t*.24,by=p.y*8.0+t*.28;
  vec2 v=vec2(
    42.0*(7.7*sin(ax)*cos(ay)+.34*8.0*cos(bx)*cos(by))/7.7,
   -42.0*(5.0*cos(ax)*sin(ay)-.34*11.0*sin(bx)*sin(by))/7.7
  );
  // Semi-Lagrangian transport: density persists from the preceding frame.
  vec2 back=clamp(uv-v*(u_dt/u_viewSize),pixel*.5,1.-pixel*.5);
  float transported=texture2D(u_previous,back).r;
  // Diffusion softens the smoke instead of teleporting or blinking it.
  vec2 a=vec2(pixel.x,0.),b=vec2(0.,pixel.y);
  float neighbors=(texture2D(u_previous,back+a).r+
                   texture2D(u_previous,back-a).r+
                   texture2D(u_previous,back+b).r+
                   texture2D(u_previous,back-b).r)*.25;
  float density=mix(transported,neighbors,clamp(u_dt*1.5,0.,.11));
  float d=edgeDistance(uv);
  // Shallow continuous fluid injection confined to the room perimeter.
  float w1=sin(p.x*15.7+p.y*4.2+t*.82+sin(p.y*8.-t*.36)*1.8);
  float w2=sin(p.y*18.4-p.x*6.6-t*.61+sin(p.x*10.+t*.4));
  float envelope=.57+.25*w1+.18*w2;
  float reach=40.+12.*w1+9.*w2+4.*sin(t*1.15+p.x*9.);
  float inlet=1.-smoothstep(-24.,max(24.,reach),d);
  float injection=inlet*max(.06,envelope)*3.8;
  density=clamp(density*exp(-u_dt*.44)+u_dt*injection,0.,1.);
  gl_FragColor=vec4(density,density,density,1.);
}
</script>
<script id="display" type="x-shader/x-fragment">
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_density;
uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;
uniform vec4 u_fogSettings; // width in px, opacity 0..1, signed inset px, clear-zone %
void main(){
 vec2 uv=v_uv;
 float density=texture2D(u_density,uv).r;
 // STEP 2: Rounded scene safe area in STATIC screen space.
 // The entire area OUTSIDE this safe area is ALWAYS fully opaque black.
 vec2 p=abs((uv-.5)*u_viewSize);
 vec2 halfSafe=u_half*u_viewSize*clamp(u_fogSettings.w*.01,.01,1.);
 float corner=min(16.,min(halfSafe.x,halfSafe.y)*.12);
 vec2 q=p-(halfSafe-vec2(corner));
 float safeDistance=corner-length(max(q,vec2(0.)))-min(max(q.x,q.y),0.);
 // Narrow time-varying smoke lives along the INSIDE of the safe area only.
 float wave=3.1*sin(uv.x*26.+u_time*.89+sin(uv.y*17.+u_time*.31))
           +2.1*sin(uv.y*32.-u_time*.76);
 float smokeDistance=safeDistance-u_fogSettings.z+wave;
 float band=1.-smoothstep(0.,max(1.,u_fogSettings.x),smokeDistance);
 float core=1.-smoothstep(0.,min(3.5,max(1.,u_fogSettings.x*.24)),safeDistance);
 float smokeOpacity=clamp((.32+.68*pow(max(density,0.),.66))*u_fogSettings.y,0.,.94);
 float alpha=safeDistance<=0.?1.:max(core,band*smokeOpacity);
 gl_FragColor=vec4(0.,0.,0.,alpha);
}
</script>
<script>
(()=>{

    const result={...fogDefaults};
    if(!raw||typeof raw!=='object')return result;
    for(const key of Object.keys(fogDefaults)){
      const value=Number(raw[key]);

      width:stage.offsetHeight*fogConfig.width*.01,

    fog.dataset.safe=String(fogConfig.safe);

      const progress=Math.min(1,(now-started)/480);

      edge==='right'?boundary+outside:boundary+inside));

    sideFogSampleCtx.drawImage(fog,sx,sy,ex-sx,sh,0,0,sideFogW,sideFogH);
    const live=sideFogSampleCtx.getImageData(0,0,sideFogW,sideFogH).data;
    const pixels=sideFogPixels.data,tm=fluidTime;
    const getAlpha=(xf,yf)=>{
      const x=clamp(xf,0,sideFogW-1),y=clamp(yf,0,sideFogH-1);
      const x0=Math.floor(x),y0=Math.floor(y);
      const x1=Math.min(sideFogW-1,x0+1),y1=Math.min(sideFogH-1,y0+1);
      const dx=x-x0,dy=y-y0;
      const a00=live[(y0*sideFogW+x0)*4+3],a10=live[(y0*sideFogW+x1)*4+3];
      const a01=live[(y1*sideFogW+x0)*4+3],a11=live[(y1*sideFogW+x1)*4+3];
      return ((a00+(a10-a00)*dx)*(1-dy)+(a01+(a11-a01)*dx)*dy)/255;

      const ny=(y+.5)/sideFogH;

      // straight dividing line. The front fluctuates strongly by height.
      const front=.57
        +.105*Math.sin(ny*8.8+tm*.36)
        +.082*Math.sin(ny*17.5-tm*.57+1.5)
        +.046*Math.sin(ny*34.0+tm*.28+2.2)
        +.021*Math.sin(ny*53.0-tm*.45);

        const sampleY=(ny+.012*Math.sin(nx*14.+tm*.30))*(sideFogH-1);

        const nativeWisp=getAlpha(sampleX+sideFogW*.13,sampleY);

        // precisely zero. Only a dark, textured cloud touches the scene.

      const vy=-42*(5*Math.cos(ax)*Math.sin(ay)-.34*11*Math.sin(bx)*Math.sin(by))/7.7;
      const old=sample(a,x-vx*dt*sx/sizes.w,y-vy*dt*sy/sizes.h,sx,sy);
      const distance=Math.min((sceneHalf.x-Math.abs(uvx-.5))*sizes.w,
                              (sceneHalf.y-Math.abs(uvy-.5))*sizes.h);
      const w1=Math.sin(px*15.7+py*4.2+t*.82+Math.sin(py*8-t*.36)*1.8);
      const w2=Math.sin(py*18.4-px*6.6-t*.61+Math.sin(px*10+t*.4));
      const reach=40+12*w1+9*w2+4*Math.sin(t*1.15+px*9);
      const inletT=clamp((distance+24)/(Math.max(24,reach)+24),0,1);
      const inlet=1-inletT*inletT*(3-2*inletT);
      const source=inlet*Math.max(.06,.57+.25*w1+.18*w2)*3.8;
      const d=b[y*sx+x]=clamp(old*Math.exp(-dt*.44)+dt*source,0,1);
      const p=(y*sx+x)*4;
      // Same rounded-rectangle signed distance and opaque outside as WebGL.
      const posX=Math.abs((uvx-.5)*sizes.w),posY=Math.abs((uvy-.5)*sizes.h);
      const qx=posX-safeHalfX+safeCorner,qy=posY-safeHalfY+safeCorner;
      const safeDistance=safeCorner-Math.hypot(Math.max(qx,0),Math.max(qy,0))
                         -Math.min(Math.max(qx,qy),0);
      const wave=3.1*Math.sin(uvx*26+t*.89+Math.sin(uvy*17+t*.31))
                +2.1*Math.sin(uvy*32-t*.76);
      const smokeDistance=safeDistance-m.offset+wave;
      const band=1-smooth(smokeDistance/Math.max(1,m.width));
      const core=1-smooth(safeDistance/Math.min(3.5,Math.max(1,m.width*.24)));
      const smokeOpacity=clamp((.32+.68*d**.66)*m.opacity,0,.94);
      const alpha=safeDistance<=0?1:Math.max(core,band*smokeOpacity);
      image.data[p]=0;image.data[p+1]=0;image.data[p+2]=0;image.data[p+3]=Math.round(255*alpha);
    }
    s.a=b;s.b=a;fallback.putImageData(image,0,0);

    const estimate=sharedGround.projectStandingActor({

      horizonY:planeTop+planeH*g.horizon/100+floorShiftY,
      referenceVisiblePx:viewH*crop.referenceBodyHeightRatio*

      actorVisiblePx:planeH*e.size/100*enemyFraction,

    });
    img.addEventListener('pointermove',e=>{
      if(!drag||drag.id!==e.pointerId)return;
      e.stopPropagation();
      let dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(isVirtualLandscape()){const temp=dx;dx=dy;dy=-temp}
      const reference=key==='enemy'?enemyDepth:cameraPlayer;
      const scaleW=reference.offsetWidth*devCamera.zoom||1;
      const scaleH=reference.offsetHeight*devCamera.zoom||1;
      editorConfig[key].x=clamp(Math.round((drag.startX+dx/scaleW*100)*2)/2,...editorBounds.x);
      editorConfig[key].y=clamp(Math.round((drag.startY-dy/scaleH*100)*2)/2,...editorBounds.y);
      applyEditorVisuals();refreshEditorControls();
      setDevStatus('拖动位置已预览；点击保存位置确认');
    });
    const end=e=>{if(drag&&drag.id===e.pointerId){e.stopPropagation();drag=null}};
    img.addEventListener('pointerup',end);
    img.addEventListener('pointercancel',end);
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&editorActive){e.preventDefault();exitDeveloper()}
  },true);
  window.PaperWorldGroundPerspective=Object.freeze({
    inspect:()=>calculateGroundFit(),
    current:()=>({
      horizon:editorConfig.ground.horizon,
      locked:!!editorConfig.ground.lockPerspective,
      autoDepth:editorConfig.ground.autoDepth!==0,
      ground:{...editorConfig.ground},
      player:{...editorConfig.player},enemy:{...editorConfig.enemy}
    })
  });
  applyEditorVisuals();
  enemyImage.addEventListener('load',applyEditorVisuals);
  const protagonistImage=document.getElementById('actor-player');
  protagonistImage.addEventListener('load',applyEditorVisuals);
  for(const img of [enemyImage,protagonistImage]){
    new MutationObserver(()=>{applyEditorVisuals();refreshEditorControls()})
      .observe(img,{attributes:true,attributeFilter:['data-character-id','data-character-side']});
  }
  if(new URLSearchParams(location.search).get('dev')==='1'){
    enterDeveloper('enemy');
  }
  function tick(now){
    raf=0;if(document.hidden)return;
    let dt=last?clamp((now-last)/1000,.001,.055):1/60;last=now;
    const k=1-Math.exp(-dt*7);
    if(reduced.matches||!tiltEnabled||editorActive){aimX=0;aimY=0}
    currentX+=(aimX-currentX)*k;currentY+=(aimY-currentY)*k;
    stage.style.transform='rotateY('+(currentX*6.0).toFixed(3)+'deg) rotateX('+(-currentY*4.6).toFixed(3)+'deg)';
    // A shoulder-mounted camera keeps the near back almost fixed;
    // the room and the enemy supply the majority of view parallax.
    cameraPlayer.style.transform='rotateY('+(currentX*.65).toFixed(3)+
      'deg) rotateX('+(-currentY*.45).toFixed(3)+'deg)';
    // A midground encounter: opponent is not a far-wall miniature;
    // protagonist stays camera-near, deliberately cropped by the frame.
    // Keep mouse parallax subtle and separate from physical Z projection.
    const depthFactor=clamp((editorConfig.enemy.z-editorConfig.bg.z)/45,0,3);
    const parallaxPx=Math.min(6,sizes.w*.005)*depthFactor;
    enemyDepth.style.transform='translate(-50%,-50%) translate3d('+
      (currentX*parallaxPx).toFixed(2)+'px,'+
      (currentY*parallaxPx*.55).toFixed(2)+'px,0) rotateY('+
      (currentX*(6.0+.3*depthFactor)).toFixed(3)+'deg) rotateX('+
      (-currentY*(4.6+.22*depthFactor)).toFixed(3)+'deg)';
    fluidTime+=reduced.matches?0:dt;
    if(gl)drawGPU(dt,fluidTime);
    else if(fallback)drawCPU(dt,fluidTime);
    // CPU-heavy UI fog compositing is limited to 30 fps, while the original
    // advected world fog continues at the full browser animation cadence.
    const overlayFrame=fogOverlayPacer.sample(now);
    if(overlayFrame){
      paintUiFog(overlayFrame.dt);
      paintDevPanelFog(overlayFrame.dt);
    }
    fog.dataset.frames=String(++frameNumber);
    if(editorActive && now-lastFogMirror>=85){
      lastFogMirror=now;
      try{
        devFogContext.clearRect(0,0,devFogPreview.width,devFogPreview.height);
        devFogContext.drawImage(fog,0,0,devFogPreview.width,devFogPreview.height);
        devFogPreview.dataset.mirrorFrames=String(frameNumber);
      }catch(error){
        // Fog must never stop rendering because the preview is unavailable.
        devFogPreview.dataset.mirrorError=String(error);
      }
    }
    // No 10/16/24 FPS steps: every browser animation frame advances the SAME
    // persistent fluid density and composites the independent screen fog.
    if(!reduced.matches||Math.abs(currentX)+Math.abs(currentY)>.001)raf=requestAnimationFrame(tick);
  }
  function start(){if(!raf)raf=requestAnimationFrame(tick)}
  window.addEventListener('pointermove',e=>{
    if(editorActive||!fine.matches||e.pointerType==='touch'||reduced.matches)return;
    aimX=clamp(e.clientX/Math.max(1,innerWidth)*2-1,-1,1);
    aimY=clamp(e.clientY/Math.max(1,innerHeight)*2-1,-1,1);
    start();
  },{passive:true});
  view.addEventListener('pointerleave',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('blur',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('resize',()=>{updatePhoneLayout();resize();centreSensor();fitTopHud();start()},{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0;fogOverlayPacer.reset();if(!document.hidden)start()});
  reduced.addEventListener?.('change',()=>{last=0;fogOverlayPacer.reset();start()});
  window.PaperWorldRenderMetrics=()=>Object.freeze({
    worldFrames:frameNumber,overlay:fogOverlayPacer.inspect(),
    renderer:fog.dataset.renderer,simulation:{width:sizes.sw,height:sizes.sh}
  });
  if(!initGPU())initCPU();
  updatePhoneLayout();resize();fitTopHud();start();
})();
</script>
