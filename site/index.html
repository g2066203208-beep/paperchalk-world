<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#161b21"/><meta name="description" content="夜港·首领办公室：点击黑帮老大的地图、电话、文件和账本，在办公室听取手下汇报与规划行动。"/><title>夜港 · 首领办公室</title><link rel="stylesheet" href="./style.css"/><script type="module" src="./app.js"></script></head>
<body><div class="game" id="game">
<header class="topbar"><div class="logo"><span class="logo-emblem">N<span>°</span></span><div><strong>夜港</strong><small>THE OFFICE / FROM ZERO</small></div></div>
<div class="stats"><span class="stat"><small>DAY</small><b id="day">01</b></span><span class="stat"><small>资金</small><b id="cash">＄190</b></span><span class="stat"><small>声望</small><b id="respect">01</b></span><span class="stat"><small>关注</small><b id="heat">12</b></span></div>
<button class="help-control" id="help-btn" type="button" aria-label="查看游戏玩法">?</button></header>
<main class="scene" aria-label="可交互的黑帮首领办公室">
<div class="scene-art" id="scene-art">
<img src="./office-art.svg" class="office-svg" alt="原创二次元办公室，年轻下属站在办公桌后，桌上有地图、文件、电话和其他办公物件" draggable="false"/><span class="character-figure" aria-hidden="true"></span>
<!-- hotspots anchored to painted objects -->
<button class="prop prop-phone" type="button" data-open="phone" aria-label="拿起电话"><span class="prop-mark">☎</span><span class="prop-label">电话</span></button>
<button class="prop prop-map" type="button" data-open="map" aria-label="展开城区地图规划行动"><span class="prop-mark">⌖</span><span class="prop-label">城区地图</span></button>
<button class="prop prop-folder" type="button" data-open="reports" aria-label="翻开部下汇报文件"><span class="prop-mark">✉</span><span class="prop-label">汇报</span></button>
<button class="prop prop-ledger" type="button" data-open="ledger" aria-label="打开组织账本"><span class="prop-mark">＄</span><span class="prop-label">账本</span></button>
<button class="prop prop-gun" type="button" data-open="gun" aria-label="观察桌上的旧手枪"><span class="prop-mark">✧</span><span class="prop-label">旧物</span></button>
<button class="prop prop-calendar" type="button" data-open="calendar" aria-label="翻动日历进入下一天"><span class="prop-mark">↷</span><span class="prop-label">明日</span></button>
</div>
<div class="scene-info"><span class="scene-tag"><strong>01</strong> CHAPTER / 白手起家</span><div class="briefing" id="briefing"><small id="speaker">阿凯 · 汇报</small><p id="briefing-text">老板，城区地图和今天的情报都已经放在桌上了。</p><button type="button" id="open-reports" aria-label="打开最新报告">查看汇报 <span>›</span></button></div><span class="scene-note">CLICK THE OBJECTS / 点击桌面物件</span></div>
</main>
<footer class="bottom-ribbon"><div class="day-mark">NO. <span id="ribbon-day">001</span></div><div class="foot-copy">一间办公室。两名伙伴。从这里开始，这座城会记住你的名字。</div><div class="goal-marker" id="goal-marker">目标 · 2 区影响力 55 / 声望 24 / 资金 1400</div></footer>
<div id="overlay" class="overlay" hidden><section class="paper-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-chrome"><span id="panel-kicker">NIGHT HARBOR / PRIVATE FILE</span><button id="close-panel" type="button" aria-label="收起当前物件">×</button></div><div id="panel-body" class="panel-body"></div></section></div>
<div class="toast" id="toast" aria-live="polite" role="status"></div></div></body></html>
