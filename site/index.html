<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>教室 · 连续流动黑雾</title>
<style>
@font-face{font-family:"PaperSerif";src:url("./assets/fonts/PaperSerif-Medium.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"PaperSans";src:url("./assets/fonts/PaperSans-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark;
 --font-menu:"PaperSerif","Noto Serif CJK SC","Songti SC",serif;
 --font-name:"PaperSerif","Noto Serif CJK SC","Songti SC",serif;
 --font-dialogue:"PaperSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 --font-ui:"PaperSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#view{
  position:fixed;inset:0;display:grid;place-items:center;
  overflow:hidden;background:#000;perspective:1500px;
  container-type:size;touch-action:none;
}
/* The Android APK uses a real landscape Activity. A normal browser tab
   cannot force OS rotation, so render its COMPLETE game viewport rotated
   immediately in portrait. No tap, permission, overlay, or fake lock needed. */
body.mobile-mode.virtual-landscape #view{
  inset:auto;top:0;left:100vw;width:100dvh;height:100vw;
  transform-origin:top left;transform:rotate(90deg);
}
#scene{
  position:relative;flex:none;margin:0;
  width:min(90vw,calc(88dvh * 16 / 9));
  width:min(90cqw,calc(88cqh * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  transform-origin:center center;
  transform:rotateX(0deg) rotateY(0deg);
  will-change:transform;backface-visibility:hidden;
}
#scene img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none;-webkit-user-drag:none}
#scene::after{
  /* FIXED image-attached protection; rotating the scene also rotates this.
     Four original picture edges are solid #000, with no dynamic exceptions. */
  content:"";
  position:absolute;
  z-index:1;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right,
      #000 0%,#000 3%,rgba(0,0,0,.96) 6%,
      rgba(0,0,0,.77) 11%,rgba(0,0,0,.34) 16%,
      transparent 23%,transparent 77%,
      rgba(0,0,0,.34) 84%,rgba(0,0,0,.77) 89%,
      rgba(0,0,0,.96) 94%,#000 97%,#000 100%),
    linear-gradient(to bottom,
      #000 0%,#000 4%,rgba(0,0,0,.96) 8%,
      rgba(0,0,0,.74) 13%,rgba(0,0,0,.35) 19%,
      transparent 27%,transparent 73%,
      rgba(0,0,0,.35) 81%,rgba(0,0,0,.74) 87%,
      rgba(0,0,0,.96) 92%,#000 96%,#000 100%);
}
#fog{
  position:fixed;inset:0;display:block;width:100%;height:100%;
  pointer-events:none;image-rendering:auto;
  /* independent viewport-space layer: mouse never transforms the fog */
}


/* 1803 × 872 approved landscape reference, scaled in LOGICAL GAME viewport.
   3.1% / 4.0% top controls; 8.3% / 8% dialogue. Container units
   correctly follow the game in actual Android landscape and rotated browser portrait.
   No panel, no rectangular frame, no extra gradient, no smoke layers. */
#novel-ui{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-dialogue);
  font-weight:400;letter-spacing:.045em;
  --ui-ink:#f5f5f1;
}
#novel-ui button{
  appearance:none;border:0!important;border-radius:0!important;box-shadow:none!important;
  background:none!important;backdrop-filter:none!important;
  -webkit-tap-highlight-color:transparent;color:inherit;font:inherit;
  pointer-events:auto;cursor:pointer;touch-action:manipulation;
  text-shadow:0 1px 5px #000;
}
#novel-ui button:focus-visible{outline:1px solid var(--ui-ink);outline-offset:3px}
#top-menu{position:absolute;top:max(7px,3.7cqh);left:max(8px,2.7cqw)}
#top-menu button{font-family:var(--font-ui);font-size:clamp(19px,3.7cqh,88px);font-weight:300;line-height:1;min-width:38px;min-height:38px;text-align:left;padding:2px 4px}
#top-actions{position:absolute;top:max(7px,3.8cqh);right:max(9px,3.0cqw);display:flex;align-items:center;gap:max(10px,3.2cqw)}
#top-actions button{font-family:var(--font-ui);font-size:clamp(11px,2.45cqh,60px);min-height:36px;min-width:38px;padding:4px 2px}
#top-actions button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:6px}
#dialogue{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;pointer-events:auto;text-shadow:0 1px 6px #000}
#speaker{font-family:var(--font-name);font-weight:500;font-size:clamp(12px,2.75cqh,70px);line-height:1.25;margin:0 0 max(7px,1.8cqh)}
#dialogue-text{font-family:var(--font-dialogue);font-weight:400;font-size:clamp(14px,2.95cqh,74px);line-height:1.46;margin:0;max-width:100%;overflow-wrap:anywhere}
#advance{position:absolute;right:max(15px,8.8cqw);bottom:max(16px,6.3cqh)}
#advance button{font-size:clamp(18px,2.8cqh,70px);line-height:1;min-width:44px;min-height:40px;padding:0;text-align:center}
#menu-choices{position:absolute;top:max(45px,11.5cqh);left:max(9px,2.7cqw);display:flex;flex-direction:column;align-items:flex-start;gap:max(4px,1.1cqh);pointer-events:auto}
#menu-choices button{font-size:clamp(12px,2.1cqh,52px);padding:5px 8px;min-height:35px;text-align:left}
#history{position:absolute;left:8.3cqw;bottom:max(24px,8.4cqh);width:76cqw;max-height:54cqh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;text-shadow:0 1px 6px #000;scrollbar-width:thin}
#history p{font-size:clamp(12px,2.15cqh,54px);line-height:1.65;margin:.28em 0}
#history .log-speaker{color:#eee9}
#novel-ui [hidden]{display:none!important}
@container (max-height:445px){
  #novel-ui{letter-spacing:.015em}
  #top-menu{top:5px}
  #top-actions{top:5px}
  #dialogue{width:78cqw;bottom:max(15px,7.5cqh)}
  #speaker{font-size:clamp(11px,2.65cqh,15px);margin-bottom:5px}
  #dialogue-text{font-size:clamp(12px,3.0cqh,17px);line-height:1.38}
  #advance{right:clamp(10px,8.5cqw,100px);bottom:max(12px,6cqh)}
}


/* SCENE TEMPLATE: one image, 3D tilt, stage-locked actions, viewport black fog. */
#scene-menu{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  color:#f5f5f1;font-family:var(--font-menu);
  font-weight:400;letter-spacing:.065em;text-shadow:0 1px 5px #000;
}
#scene-menu .scene-menu-options{
  position:absolute;left:60.5%;top:44%;display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(3px,1.0cqh,18px);
}
#scene-menu button{
  font-family:var(--font-menu);
  appearance:none;display:block;border:0;border-radius:0;background:none;
  box-shadow:none;color:inherit;font:inherit;font-size:clamp(14px,2.8cqh,38px);
  line-height:1.35;white-space:nowrap;text-align:left;
  min-width:44px;min-height:38px;padding:3px 7px;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  opacity:.90;transition:opacity 150ms ease;text-shadow:inherit;
}
#scene-menu button:hover,#scene-menu button:focus-visible{opacity:1}
#scene-menu button:focus-visible{outline:1px solid #ccc;outline-offset:2px}
#scene-menu button:disabled{opacity:.28;cursor:default}
#scene-menu [hidden],#scene-menu[hidden],#novel-ui[hidden]{display:none!important}
@container (max-height:445px){
  #scene-menu .scene-menu-options{left:60%;top:39%;gap:2px}
  #scene-menu button{font-size:clamp(12px,2.7cqh,23px);min-height:30px}
}


/* Background, enemy and player are independent visual layers in the
   already existing tilting scene. Pure black fluid fog is unchanged. */
#actor-enemy-layer,#actor-player-layer{
  position:absolute;inset:0;z-index:0;pointer-events:none;
}
#scene[data-scene="menu"] .cast-layer{display:none}
#scene #actor-enemy,#scene #actor-player{
  position:absolute;display:block;width:auto;max-width:none;
  object-fit:contain;object-position:bottom center;pointer-events:none;
}
#scene #actor-enemy{left:61.5%;bottom:18%;height:64%}
#scene #actor-player{left:7%;bottom:0;height:80%}
@container (max-height:445px){
  #scene #actor-enemy{height:62%;left:62%;bottom:18%}
  #scene #actor-player{height:78%;left:6%;bottom:0}
}

/* BLACK-only scene transition, independent of the original running fluid fog */
#scene-transition{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
 background:radial-gradient(ellipse at 50% 47%,rgba(0,0,0,0) 0%,rgba(0,0,0,.23) 37%,rgba(0,0,0,.68) 69%,#000 100%);
 --core-black:0}
#scene-transition::after{content:"";position:absolute;inset:0;background:#000;
 opacity:var(--core-black);pointer-events:none}
#scene-transition[data-active="true"]{pointer-events:auto;touch-action:none}
#scene-menu,#novel-ui{transition:opacity 150ms ease}
@media(prefers-reduced-motion:reduce){#scene-menu,#novel-ui{transition:none}}
@media(prefers-reduced-motion:reduce){#scene{transform:none!important;will-change:auto}}
</style>
</head>
<body>
<main id="view" aria-label="同一场景模板：背景和菜单随视角倾斜，纯黑流体雾固定在屏幕上">
  <figure id="scene" data-scene="menu" aria-label="主菜单：一面墙、一扇门和一盏灯">
    <img id="source" src="./assets/menu-wall.webp" width="1024" height="576"
         alt="昏暗的墙壁，一扇闭合的旧门和顶上的灯。" draggable="false">
    <div id="actor-enemy-layer" class="cast-layer" aria-label="敌人立绘">

  </figure>
  <canvas id="fog" aria-hidden="true"></canvas>

    <div id="menu-choices" hidden aria-label="游戏操作">
      <button id="restart-button" type="button">重新开始</button>

    </div>
    <section id="dialogue" aria-label="人物对白" aria-live="polite">

    </section>

    <div id="history" hidden role="region" aria-label="对白记录"></div>
  </div>
  <div id="scene-transition" data-phase="idle" data-active="false" aria-hidden="true"></div>
</main>
<script id="vertex" type="x-shader/x-vertex">
attribute vec2 a_position;
varying vec2 v_uv;
void main(){v_uv=a_position*.5+.5;gl_Position=vec4(a_position,0.,1.);}
</script>
<script id="fluid" type="x-shader/x-fragment">
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_previous;
uniform vec2 u_simSize;
uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;
uniform float u_dt;
float edgeDistance(vec2 uv){
  vec2 v=u_half-abs(uv-.5);
  return min(v.x*u_viewSize.x,v.y*u_viewSize.y);
}
void main(){
  vec2 uv=v_uv;
  vec2 pixel=1.0/u_simSize;
  vec2 p=(uv-.5)*vec2(u_viewSize.x/u_viewSize.y,1.);
  float t=u_time;
  // Time-varying curl velocity from a stream function, not frame-swapped images.
  float ax=p.x*5.0+t*.39, ay=p.y*7.7-t*.34;
  float bx=p.x*11.0-t*.24,by=p.y*8.0+t*.28;
  vec2 v=vec2(
    42.0*(7.7*sin(ax)*cos(ay)+.34*8.0*cos(bx)*cos(by))/7.7,
   -42.0*(5.0*cos(ax)*sin(ay)-.34*11.0*sin(bx)*sin(by))/7.7
  );
  // Semi-Lagrangian transport: density persists from the preceding frame.
  vec2 back=clamp(uv-v*(u_dt/u_viewSize),pixel*.5,1.-pixel*.5);
  float transported=texture2D(u_previous,back).r;
  // Diffusion softens the smoke instead of teleporting or blinking it.
  vec2 a=vec2(pixel.x,0.),b=vec2(0.,pixel.y);
  float neighbors=(texture2D(u_previous,back+a).r+
                   texture2D(u_previous,back-a).r+
                   texture2D(u_previous,back+b).r+
                   texture2D(u_previous,back-b).r)*.25;
  float density=mix(transported,neighbors,clamp(u_dt*1.5,0.,.11));
  float d=edgeDistance(uv);
  // Continuous injection on all four image edges, with turbulent wave fronts.
  float w1=sin(p.x*15.7+p.y*4.2+t*.82+sin(p.y*8.-t*.36)*1.8);
  float w2=sin(p.y*18.4-p.x*6.6-t*.61+sin(p.x*10.+t*.4));
  float envelope=.52+.26*w1+.19*w2;
  float reach=63.+18.*w1+15.*w2+9.*sin(t*.73+p.x*8.);
  float inlet=1.-smoothstep(-15.,max(12.,reach),d);
  float injection=inlet*max(.04,envelope)*2.4;
  density=clamp(density*exp(-u_dt*.55)+u_dt*injection,0.,1.);
  gl_FragColor=vec4(density,density,density,1.);
}
</script>
<script id="display" type="x-shader/x-fragment">
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_density;
uniform vec2 u_viewSize;
uniform vec2 u_half;
uniform float u_time;
void main(){
 vec2 uv=v_uv;
 float density=texture2D(u_density,uv).r;
 // Fixed SCREEN-SPACE smoke zone; independent of the tilted classroom.
 // Smoke no longer has to hide picture edges: the picture's own CSS
 // gradient guarantees those are opaque black in every perspective pose.
 float d=min((u_half.x-abs(uv.x-.5))*u_viewSize.x,
             (u_half.y-abs(uv.y-.5))*u_viewSize.y);
 float curl=sin(uv.x*23.+u_time*.68+sin(uv.y*19.-u_time*.47)*1.7);
 float width=min(93.,u_viewSize.y*.16);
 float smokeZone=1.-smoothstep(7.,width,d+curl*11.);
 float alpha=clamp(pow(max(density,0.),.80)*.66*smokeZone,0.,.72);
 gl_FragColor=vec4(0.,0.,0.,alpha);
}
</script>
<script>
(()=>{
  'use strict';
  const stage=document.getElementById('scene');
  const fog=document.getElementById('fog');
  const view=document.getElementById('view');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const fine=matchMedia('(pointer:fine)');
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  let aimX=0,aimY=0,currentX=0,currentY=0,last=0,raf=0,frameNumber=0;
  let gl=null,simulate=null,composite=null,simTargets=[],simIndex=0,quad=null;
  let sizes={w:1,h:1,sw:1,sh:1},fluidTime=0;
  let fallback=null,fallbackState=null;
  let sceneHalf={x:.4,y:.4};
  function logicalSize(){
    const rotated=document.body.classList.contains('virtual-landscape');
    return rotated ? {w:innerHeight,h:innerWidth} : {w:innerWidth,h:innerHeight};
  }
  function isVirtualLandscape(){return document.body.classList.contains('virtual-landscape')}
  function half(){
    const r=stage.getBoundingClientRect();
    // Geometry is calculated from CSS dimensions (untransformed), not the
    // current tilted bounds. Fog stays centered on screen independently.
    const {w,h}=logicalSize();
    sceneHalf={x:stage.offsetWidth/(2*w),y:stage.offsetHeight/(2*h)};
    if(gl){
      for(const p of [simulate,composite]){
        gl.useProgram(p);
        gl.uniform2f(gl.getUniformLocation(p,'u_half'),sceneHalf.x,sceneHalf.y);
      }
    }
  }

  const coarse=matchMedia('(pointer:coarse)');
  const nativeApp=window.PaperworldSensor?.isNativeApp?.()===true;
  const mobile=coarse.matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  let sensorEnabled=false,sensorSamples=0,sensorCenter=null,sensorAngle=null;
  let nativeCenter=null,nativeSamples=0,nativeActive=false,touchStart=null;
  function orientationAngle(){
    const actual=(((screen.orientation&&Number.isFinite(screen.orientation.angle)
      ?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0))%360)+360)%360;
    // For simulated landscape on a portrait-locked browser, map the sensor
    // to the same game-space X/Y axes as a physically landscape Android app.
    return (actual+(isVirtualLandscape()?90:0))%360;
  }
  function updatePhoneLayout(){
    document.body.classList.toggle('mobile-mode',mobile);
    // The APK is ALREADY physically landscape at the Android window level.
    // 90-degree CSS rotation is only a fallback for regular browser portrait.
    document.body.classList.toggle('virtual-landscape',mobile&&!nativeApp&&innerHeight>innerWidth);
  }
  function centreSensor(){
    sensorCenter=null;nativeCenter=null;aimX=0;aimY=0;start();
  }
  function deltaDegrees(a,b){return ((a-b+540)%360)-180}
  function deadzone(x){return Math.sign(x)*Math.max(0,Math.abs(x)-1.3)}
  function webOrientation(e){
    if(!sensorEnabled||nativeActive||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    const a=orientationAngle(),beta=e.beta,gamma=e.gamma;
    let x=gamma,y=beta;
    if(a===90){x=beta;y=-gamma}
    else if(a===270){x=-beta;y=gamma}
    else if(a===180){x=-gamma;y=-beta}
    if(!sensorCenter||sensorAngle!==a){
      sensorAngle=a;sensorCenter={x,y};aimX=0;aimY=0;
    }else if(!reduced.matches){
      // Calibrated, bounded motion; same normalized yaw/pitch as desktop mouse.
      aimX=clamp(deadzone(deltaDegrees(x,sensorCenter.x))/18,-1,1);
      aimY=clamp(deadzone(deltaDegrees(y,sensorCenter.y))/18,-1,1);
    }
    sensorSamples++;
    start();
  }
  // Android app's native GAME_ROTATION_VECTOR bridge is used when present;
  // the public HTTPS website uses the standards-based deviceorientation API.
  window.__PAPERWORLD_NATIVE_ORIENTATION__=(w,x,y,z)=>{
    if(!nativeActive||![w,x,y,z].every(Number.isFinite))return;
    const norm=Math.hypot(w,x,y,z);if(norm<.1)return;
    w/=norm;x/=norm;y/=norm;z/=norm;
    if(!nativeCenter){nativeCenter={w,x,y,z};aimX=0;aimY=0}
    else if(!reduced.matches){
      const b=nativeCenter;
      const dx=b.w*x-b.x*w-b.y*z+b.z*y;
      const dy=b.w*y+b.x*z-b.y*w-b.z*x;
      const dw=b.w*w+b.x*x+b.y*y+b.z*z;
      let px=2*Math.atan2(dx,dw)*180/Math.PI;
      let py=2*Math.atan2(dy,dw)*180/Math.PI;
      const a=orientationAngle();
      if(a===90){const t=px;px=py;py=-t}
      else if(a===270){const t=px;px=-py;py=t}
      else if(a===180){px=-px;py=-py}
      aimX=clamp(deadzone(px)/18,-1,1);
      aimY=clamp(deadzone(py)/18,-1,1);
    }
    nativeSamples++;
    start();
  };
  function beginWebSensor(){
    if(sensorEnabled)return;
    sensorEnabled=true;
    window.addEventListener('deviceorientation',webOrientation,{passive:true});
  }
  async function tryLandscape(fullscreen){
    // Web browsers may reject lock() outside fullscreen or without a gesture.
    // Never fake successful orientation locking on unsupported iOS browsers.
    if(fullscreen&&view.requestFullscreen&&!document.fullscreenElement){
      try{await view.requestFullscreen()}catch(_){}
    }
    if(screen.orientation&&typeof screen.orientation.lock==='function'){
      try{await screen.orientation.lock('landscape')}catch(_){}
    }
    updatePhoneLayout();
  }
  // iOS requires a user gesture to authorize motion; use the first ordinary
  // interaction with the game, never a persistent on-screen button or label.
  // Android native and permissionless browser sensors initialize automatically.
  function enableIOSMotionOnFirstTouch(){
    if(!mobile || nativeActive || sensorEnabled) return;
    if(typeof DeviceOrientationEvent==='undefined' ||
       typeof DeviceOrientationEvent.requestPermission!=='function') return;
    try{
      Promise.resolve(DeviceOrientationEvent.requestPermission())
        .then(result=>{if(result==='granted')beginWebSensor()})
        .catch(()=>{});
    }catch(_){}
  }
  view.addEventListener('pointerdown',enableIOSMotionOnFirstTouch,{once:true,passive:true});
  window.addEventListener('orientationchange',()=>{
    updatePhoneLayout();centreSensor();resize();
  },{passive:true});
  // A practical fallback if mobile browser blocks sensors: drag to tilt.
  view.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch'||reduced.matches)return;
    touchStart={x:e.clientX,y:e.clientY,id:e.pointerId};
  },{passive:true});
  view.addEventListener('pointermove',e=>{
    if(!touchStart||touchStart.id!==e.pointerId||e.pointerType!=='touch'||reduced.matches)return;
    const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
    const {w,h}=logicalSize();
    aimX=clamp((isVirtualLandscape()?dy:dx)/(Math.max(w,1)*.24),-1,1);
    aimY=clamp((isVirtualLandscape()?-dx:dy)/(Math.max(h,1)*.24),-1,1);
    start();
  },{passive:true});
  function finishTouch(){if(touchStart){touchStart=null;aimX=0;aimY=0;start()}}
  window.addEventListener('pointerup',finishTouch,{passive:true});
  window.addEventListener('pointercancel',finishTouch,{passive:true});
  updatePhoneLayout();
  // Android's own WebView can start the trusted native sensor bridge immediately.
  try{
    if(mobile&&window.PaperworldSensor?.available?.()){
      nativeActive=true;window.PaperworldSensor.start();
    }else if(mobile&&'DeviceOrientationEvent' in window&&
      typeof DeviceOrientationEvent.requestPermission!=='function'){
      beginWebSensor();
    }
  }catch(_){}
  // An automatic lock is allowed in some installed web apps, but not ordinary
  // browser tabs. Failure is expected and is handled by the visible button.
  if(mobile)tryLandscape(false);

  // Reference UI layout is expressed in % of the logical landscape canvas,
  // not the phone's physical portrait axes. No new smoke, shadow layer or panel.
  const uiRoot=document.getElementById('novel-ui');
  const speakerLabel=document.getElementById('speaker');
  const dialogueText=document.getElementById('dialogue-text');
  const dialogue=document.getElementById('dialogue');
  const nextLineButton=document.getElementById('next-line');
  const autoButton=document.getElementById('auto-button');
  const logButton=document.getElementById('log-button');
  const menuButton=document.getElementById('menu-toggle');
  const menuChoices=document.getElementById('menu-choices');
  const restartButton=document.getElementById('restart-button');
  const hideButton=document.getElementById('hide-button');
  const history=document.getElementById('history');
  const lines=[
    {speaker:'???',text:'这间教室……和我记忆里的，不太一样。'},
    {speaker:'???',text:'明明已经放学了，为什么还有声音？'},
    {speaker:'???',text:'有人……在看着这里吗？'}
  ];
  // Scene assets/content are data; rendering, 3D tilt and black fog are shared.
  const SCENES=Object.freeze({
    menu:Object.freeze({image:'./assets/menu-wall.webp',alt:'一面旧墙、一扇门和一盏灯',type:'menu'}),
    classroom:Object.freeze({image:'./assets/classroom.webp',alt:'空教室全景：黑板、课桌、左侧窗户',type:'story'})
  });
  const sourceImage=document.getElementById('source');
  const sceneMenu=document.getElementById('scene-menu');
  const mainOptions=document.getElementById('scene-menu-main');
  const settingsOptions=document.getElementById('scene-menu-settings');
  const continueButton=document.getElementById('menu-continue');
  const tiltButton=document.getElementById('tilt-toggle');
  const SAVE_KEY='paperchalk-scene-v1';
  const TILT_KEY='paperchalk-tilt-v1';
  function loadSetting(){
    try{return localStorage.getItem(TILT_KEY)!=='off'}catch(_){return true}
  }
  let tiltEnabled=loadSetting();
  let dialogueIndex=0,autoEnabled=false,autoTimer=0,logOpen=false,textHidden=false;
  const classroomPreload=new Image();
  classroomPreload.src=SCENES.classroom.image;
  const mainMenuPreload=new Image();
  mainMenuPreload.src=SCENES.menu.image;
  function readSave(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return null;
      const save=JSON.parse(raw);
      return save&&save.scene==='classroom'&&Number.isInteger(save.line)&&
        save.line>=0&&save.line<lines.length?save:null;
    }catch(_){return null}
  }
  function writeSave(){
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({scene:'classroom',line:dialogueIndex}))}catch(_){}
    continueButton.disabled=false;
  }
  function openScene(name){
    const def=SCENES[name];if(!def)throw new Error('Unknown scene: '+name);
    // Swapping only image and scene content NEVER recreates the fluid simulator.
    sourceImage.src=def.image;sourceImage.alt=def.alt;
    stage.dataset.scene=name;stage.setAttribute('aria-label',def.alt);
    sceneMenu.hidden=def.type!=='menu';
    uiRoot.hidden=def.type!=='story';
    if(def.type==='menu'){
      cancelAuto();if(logOpen)toggleLog();
      mainOptions.hidden=false;settingsOptions.hidden=true;
      continueButton.disabled=!readSave();
    }else{
      menuChoices.hidden=true;menuButton.setAttribute('aria-expanded','false');
      textHidden=false;dialogue.hidden=false;
      nextLineButton.parentElement.hidden=false;renderDialogue();writeSave();
    }
    start(); // continuous, same original fog frame chain
  }

  // Reusable transition state: idle -> preload -> out -> covered -> in -> idle.
  // Same live WebGL/CPU black fog canvas persists behind the black veil.
  const shade=document.getElementById('scene-transition');
  let transitioning=false;
  function easeDark(t){return t*t*(3-2*t)}
  function setDark(amount){
    const a=clamp(amount,0,1);
    shade.style.opacity=String(a);
    shade.style.setProperty('--core-black',String(clamp((a-.28)/.72,0,1)));
    shade.dataset.darkness=a.toFixed(3);
  }
  function animateDark(from,to,duration,phase){
    shade.dataset.phase=phase;
    return new Promise(done=>{
      const startAt=performance.now();
      function frame(now){
        const t=clamp((now-startAt)/duration,0,1);
        setDark(from+(to-from)*easeDark(t));
        if(t<1)requestAnimationFrame(frame);else done();
      }
      requestAnimationFrame(frame);
    });
  }
  function waitForPaint(){return new Promise(done=>requestAnimationFrame(()=>requestAnimationFrame(done)))}
  async function ensureAsset(name){
    const image=new Image();image.decoding='async';image.src=SCENES[name].image;
    let timeout;
    try{
      await Promise.race([image.decode(),
        new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error('image timeout')),6500)})]);
      return true;
    }catch(e){console.error('Scene asset unavailable',name,e);return false}
    finally{clearTimeout(timeout)}
  }
  async function changeScene(name){
    if(transitioning||!SCENES[name]||stage.dataset.scene===name)return false;
    transitioning=true;shade.dataset.active='true';shade.dataset.phase='preload';
    const outgoing=stage.dataset.scene==='menu'?sceneMenu:uiRoot;
    if(!(await ensureAsset(name))){
      shade.dataset.phase='idle';shade.dataset.active='false';transitioning=false;
      return false;
    }
    try{
      outgoing.style.opacity='0';
      await animateDark(0,1,reduced.matches?145:440,'out');
      shade.dataset.phase='covered';
      openScene(name); // replace image ONLY after center is fully black
      await waitForPaint();
      await new Promise(done=>setTimeout(done,reduced.matches?35:105));
      const incoming=name==='menu'?sceneMenu:uiRoot;
      incoming.style.opacity='0';
      const textTimer=setTimeout(()=>{incoming.style.opacity='1'},reduced.matches?0:165);
      await animateDark(1,0,reduced.matches?170:500,'in');
      clearTimeout(textTimer);
      incoming.style.opacity='1';
      return true;
    }finally{
      setDark(0);shade.dataset.phase='idle';shade.dataset.active='false';
      transitioning=false;
    }
  }
  function beginStory(resume){
    if(transitioning)return;
    const save=resume?readSave():null;
    dialogueIndex=save?save.line:0;
    changeScene('classroom');
  }
  document.getElementById('menu-start').addEventListener('click',()=>beginStory(false));
  continueButton.addEventListener('click',()=>{if(readSave())beginStory(true)});
  document.getElementById('menu-settings-button').addEventListener('click',()=>{
    mainOptions.hidden=true;settingsOptions.hidden=false;
  });
  document.getElementById('menu-settings-back').addEventListener('click',()=>{
    settingsOptions.hidden=true;mainOptions.hidden=false;
  });
  tiltButton.addEventListener('click',()=>{
    tiltEnabled=!tiltEnabled;
    tiltButton.textContent=tiltEnabled?'场景倾斜：开启':'场景倾斜：关闭';
    try{localStorage.setItem(TILT_KEY,tiltEnabled?'on':'off')}catch(_){}
    if(!tiltEnabled){aimX=0;aimY=0}
    start();
  });
  tiltButton.textContent=tiltEnabled?'场景倾斜：开启':'场景倾斜：关闭';
  continueButton.disabled=!readSave();
  function cancelAuto(){
    clearTimeout(autoTimer);autoTimer=0;autoEnabled=false;
    autoButton.setAttribute('aria-pressed','false');
  }
  function renderDialogue(){
    const line=lines[dialogueIndex];
    speakerLabel.textContent=line.speaker;dialogueText.textContent=line.text;
    nextLineButton.setAttribute('aria-label',dialogueIndex===lines.length-1?'重新播放':'下一句');
  }
  function advanceDialogue(){
    if(logOpen||textHidden)return;
    dialogueIndex=(dialogueIndex+1)%lines.length;renderDialogue();writeSave();
    if(autoEnabled)scheduleAuto();
  }
  function scheduleAuto(){
    clearTimeout(autoTimer);
    if(autoEnabled&&!document.hidden&&!logOpen&&!textHidden){
      const wait=Math.max(2800,Math.min(6600,lines[dialogueIndex].text.length*190));
      autoTimer=setTimeout(()=>{
        if(dialogueIndex===lines.length-1){cancelAuto();return}
        advanceDialogue();
      },wait);
    }
  }
  function updateHistory(){
    // All markup comes from fixed app-owned strings; textContent prevents injection.
    history.replaceChildren();
    for(let i=0;i<=dialogueIndex;i++){
      const p=document.createElement('p');
      const who=document.createElement('span');who.className='log-speaker';
      who.textContent=lines[i].speaker+'  ';
      p.append(who,document.createTextNode(lines[i].text));
      history.appendChild(p);
    }
    history.scrollTop=history.scrollHeight;
  }
  function toggleLog(){
    logOpen=!logOpen;
    if(logOpen){
      cancelAuto();updateHistory();history.hidden=false;
      dialogue.hidden=true;nextLineButton.parentElement.hidden=true;
      menuChoices.hidden=true;menuButton.setAttribute('aria-expanded','false');
    }else{
      history.hidden=true;dialogue.hidden=textHidden;
      nextLineButton.parentElement.hidden=textHidden;
    }
    logButton.setAttribute('aria-pressed',String(logOpen));
  }
  nextLineButton.addEventListener('click',e=>{e.stopPropagation();advanceDialogue()});
  // Clicking text/black fog advances, but sensor and fog calculations are untouched.
  dialogue.addEventListener('click',e=>{e.stopPropagation();advanceDialogue()});
  autoButton.addEventListener('click',()=>{
    if(logOpen)toggleLog();
    if(textHidden){textHidden=false;dialogue.hidden=false;nextLineButton.parentElement.hidden=false}
    autoEnabled=!autoEnabled;autoButton.setAttribute('aria-pressed',String(autoEnabled));
    if(autoEnabled)scheduleAuto();else clearTimeout(autoTimer);
  });
  logButton.addEventListener('click',toggleLog);
  menuButton.addEventListener('click',()=>{
    const opening=menuChoices.hidden;
    menuChoices.hidden=!opening;menuButton.setAttribute('aria-expanded',String(opening));
  });
  restartButton.addEventListener('click',()=>{
    cancelAuto();dialogueIndex=0;renderDialogue();writeSave();
    if(logOpen)toggleLog();
    textHidden=false;dialogue.hidden=false;nextLineButton.parentElement.hidden=false;
    menuChoices.hidden=true;menuButton.setAttribute('aria-expanded','false');
  });
  document.getElementById('return-main').addEventListener('click',()=>changeScene('menu'));
  hideButton.addEventListener('click',()=>{
    cancelAuto();textHidden=!textHidden;
    dialogue.hidden=textHidden;nextLineButton.parentElement.hidden=textHidden;
    hideButton.textContent=textHidden?'显示文字':'隐藏文字';
    menuChoices.hidden=true;menuButton.setAttribute('aria-expanded','false');
  });
  window.addEventListener('keydown',e=>{
    if(transitioning)return;
    if(e.key==='Escape'){
      if(stage.dataset.scene==='menu'){settingsOptions.hidden=true;mainOptions.hidden=false}
      else if(logOpen)toggleLog();
      else{menuChoices.hidden=true;menuButton.setAttribute('aria-expanded','false')}
    }else if((e.key===' '||e.key==='Enter')&&
      !['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
      if(stage.dataset.scene==='classroom'){e.preventDefault();advanceDialogue()}
    }
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)clearTimeout(autoTimer);
    else if(autoEnabled)scheduleAuto();
  });
  renderDialogue();
  openScene('menu');
  function shader(type,text){
    const s=gl.createShader(type);
    gl.shaderSource(s,text);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(id,vertex){
    const p=gl.createProgram();
    gl.attachShader(p,vertex);
    gl.attachShader(p,shader(gl.FRAGMENT_SHADER,document.getElementById(id).textContent));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);
    const loc=gl.getAttribLocation(p,'a_position');
    gl.bindBuffer(gl.ARRAY_BUFFER,quad);
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    return p;
  }
  function target(sw,sh){
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,sw,sh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    const fb=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Fog framebuffer incomplete');
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
    return {tex,fb};
  }
  function initGPU(){
    try{
      gl=fog.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false,preserveDrawingBuffer:false});
      if(!gl)return false;
      quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const vertex=shader(gl.VERTEX_SHADER,document.getElementById('vertex').textContent);
      simulate=program('fluid',vertex);composite=program('display',vertex);
      fog.dataset.renderer='gpu-advected-fluid';
      return true;
    }catch(e){console.warn('GPU fluid unavailable; using CPU fluid fallback:',e);gl=null;return false;}
  }
  function initCPU(){
    fallback=fog.getContext('2d',{alpha:true});
    fog.dataset.renderer='cpu-advected-fluid';
  }
  function resize(){
    const logical=logicalSize();
    const w=Math.max(1,logical.w),h=Math.max(1,logical.h);
    const scale=Math.min(.72,devicePixelRatio||1);
    // The visible fog gets a responsive canvas, while the simulation runs
    // on a smaller persistent density field for per-frame performance.
    const fw=Math.max(1,Math.round(w*scale)),fh=Math.max(1,Math.round(h*scale));
    const simulationScale=Math.min(.36,360/Math.max(w,h));
    const sw=Math.max(80,Math.round(w*simulationScale));
    const sh=Math.max(80,Math.round(h*simulationScale));
    sizes={w,h,sw,sh};
    if(gl){
      for(const t of simTargets){gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fb)}
      simTargets=[];
      fog.width=fw;fog.height=fh;gl.viewport(0,0,fw,fh);
      simTargets=[target(sw,sh),target(sw,sh)];
      simIndex=0;gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      for(const p of [simulate,composite]){
        gl.useProgram(p);
        gl.uniform2f(gl.getUniformLocation(p,'u_viewSize'),w,h);
        gl.uniform2f(gl.getUniformLocation(p,'u_half'),sceneHalf.x,sceneHalf.y);
      }
      gl.useProgram(simulate);gl.uniform2f(gl.getUniformLocation(simulate,'u_simSize'),sw,sh);
      gl.uniform1i(gl.getUniformLocation(simulate,'u_previous'),0);
      gl.useProgram(composite);gl.uniform1i(gl.getUniformLocation(composite,'u_density'),0);
    }else if(fallback){
      const sx=Math.max(90,Math.round(w*.24)),sy=Math.max(70,Math.round(h*.24));
      fog.width=sx;fog.height=sy;
      fallbackState={sx,sy,a:new Float32Array(sx*sy),b:new Float32Array(sx*sy),image:fallback.createImageData(sx,sy)};
    }
    half();
  }
  function drawGPU(dt,t){
    gl.activeTexture(gl.TEXTURE0);
    gl.useProgram(simulate);
    gl.bindFramebuffer(gl.FRAMEBUFFER,simTargets[1-simIndex].fb);
    gl.viewport(0,0,sizes.sw,sizes.sh);
    gl.bindTexture(gl.TEXTURE_2D,simTargets[simIndex].tex);
    gl.uniform1f(gl.getUniformLocation(simulate,'u_time'),t);
    gl.uniform1f(gl.getUniformLocation(simulate,'u_dt'),dt);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    simIndex=1-simIndex;
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,fog.width,fog.height);
    gl.useProgram(composite);
    gl.bindTexture(gl.TEXTURE_2D,simTargets[simIndex].tex);
    gl.uniform1f(gl.getUniformLocation(composite,'u_time'),t);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function sample(arr,fx,fy,w,h){
    fx=clamp(fx,0,w-1);fy=clamp(fy,0,h-1);
    const x=Math.floor(fx),y=Math.floor(fy),u=fx-x,v=fy-y;
    const x1=Math.min(x+1,w-1),y1=Math.min(y+1,h-1);
    return (arr[y*w+x]*(1-u)+arr[y*w+x1]*u)*(1-v)
       +(arr[y1*w+x]*(1-u)+arr[y1*w+x1]*u)*v;
  }
  function drawCPU(dt,t){
    const s=fallbackState;if(!s)return;
    const {sx,sy,a,b,image}=s;
    for(let y=0;y<sy;y++)for(let x=0;x<sx;x++){
      const uvx=(x+.5)/sx,uvy=(y+.5)/sy;
      const px=(uvx-.5)*sizes.w/sizes.h,py=(uvy-.5);
      const ax=px*5+t*.39,ay=py*7.7-t*.34,bx=px*11-t*.24,by=py*8+t*.28;
      const vx=42*(7.7*Math.sin(ax)*Math.cos(ay)+.34*8*Math.cos(bx)*Math.cos(by))/7.7;
      const vy=-42*(5*Math.cos(ax)*Math.sin(ay)-.34*11*Math.sin(bx)*Math.sin(by))/7.7;
      const old=sample(a,x-vx*dt*sx/sizes.w,y-vy*dt*sy/sizes.h,sx,sy);
      const distance=Math.min((sceneHalf.x-Math.abs(uvx-.5))*sizes.w,
                              (sceneHalf.y-Math.abs(uvy-.5))*sizes.h);
      const w1=Math.sin(px*15.7+py*4.2+t*.82+Math.sin(py*8-t*.36)*1.8);
      const w2=Math.sin(py*18.4-px*6.6-t*.61+Math.sin(px*10+t*.4));
      const reach=63+18*w1+15*w2+9*Math.sin(t*.73+px*8);
      const inlet=1-(clamp((distance+15)/(Math.max(12,reach)+15),0,1))**2;
      const source=inlet*Math.max(.04,.52+.26*w1+.19*w2)*2.4;
      const d=b[y*sx+x]=clamp(old*Math.exp(-dt*.55)+dt*source,0,1);
      const p=(y*sx+x)*4;
      const curl=Math.sin(uvx*23+t*.68+Math.sin(uvy*19-t*.47)*1.7);
      const width=Math.min(93,sizes.h*.16);
      const v=clamp((distance+curl*11-7)/Math.max(1,width-7),0,1);
      const smokeZone=1-v*v*(3-2*v);
      const alpha=clamp(d**.80*.66*smokeZone,0,.72);
      image.data[p]=0;image.data[p+1]=0;image.data[p+2]=0;image.data[p+3]=Math.round(255*alpha);
    }
    s.a=b;s.b=a;fallback.putImageData(image,0,0);
  }
  function tick(now){
    raf=0;if(document.hidden)return;
    let dt=last?clamp((now-last)/1000,.001,.055):1/60;last=now;
    const k=1-Math.exp(-dt*7);
    if(reduced.matches||!tiltEnabled){aimX=0;aimY=0}
    currentX+=(aimX-currentX)*k;currentY+=(aimY-currentY)*k;
    stage.style.transform='rotateY('+(currentX*6.0).toFixed(3)+'deg) rotateX('+(-currentY*4.6).toFixed(3)+'deg)';
    fluidTime+=reduced.matches?0:dt;
    if(gl)drawGPU(dt,fluidTime);
    else if(fallback)drawCPU(dt,fluidTime);
    fog.dataset.frames=String(++frameNumber);
    // No 10/16/24 FPS steps: every browser animation frame advances the SAME
    // persistent fluid density and composites the independent screen fog.
    if(!reduced.matches||Math.abs(currentX)+Math.abs(currentY)>.001)raf=requestAnimationFrame(tick);
  }
  function start(){if(!raf)raf=requestAnimationFrame(tick)}
  window.addEventListener('pointermove',e=>{
    if(!fine.matches||e.pointerType==='touch'||reduced.matches)return;
    aimX=clamp(e.clientX/Math.max(1,innerWidth)*2-1,-1,1);
    aimY=clamp(e.clientY/Math.max(1,innerHeight)*2-1,-1,1);
    start();
  },{passive:true});
  view.addEventListener('pointerleave',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('blur',()=>{aimX=0;aimY=0;start()});
  window.addEventListener('resize',()=>{updatePhoneLayout();resize();centreSensor();start()},{passive:true});
  document.addEventListener('visibilitychange',()=>{last=0;if(!document.hidden)start()});
  reduced.addEventListener?.('change',()=>{last=0;start()});
  if(!initGPU())initCPU();
  updatePhoneLayout();resize();start();
})();
</script>
</body>
</html>
