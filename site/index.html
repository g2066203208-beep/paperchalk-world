<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="极简教室场景：柔和动态黑影与轻微鼠标视差。">
<title>教室 · 黑场舞台</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden}
main{
  width:100%;min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;
  background:#000;perspective:1600px;overflow:hidden;
}
.scene{
  --sx:0px;--sy:0px;--rx:0deg;--ry:0deg;
  position:relative;margin:0;isolation:isolate;
  width:min(90vw,1440px,calc(82dvh * 16 / 9));
  aspect-ratio:16 / 9;
  transform:translate3d(var(--sx),var(--sy),0) rotateX(var(--rx)) rotateY(var(--ry));
  transform-style:preserve-3d;
  will-change:transform;
  /* Fade only the outer edge; keep almost the entire classroom clear. */
  -webkit-mask-image:radial-gradient(ellipse 54% 58% at 50% 50%,
    #000 0%,#000 73%,rgba(0,0,0,.87) 80%,
    rgba(0,0,0,.34) 94%,transparent 105%);
  mask-image:radial-gradient(ellipse 54% 58% at 50% 50%,
    #000 0%,#000 73%,rgba(0,0,0,.87) 80%,
    rgba(0,0,0,.34) 94%,transparent 105%);
}
.scene img{
  display:block;width:100%;height:100%;object-fit:cover;
  user-select:none;-webkit-user-drag:none;
}
.scene::after{
  content:"";position:absolute;inset:-4%;pointer-events:none;
  background:
    radial-gradient(ellipse 43% 60% at 84% 73%,rgba(0,0,0,.20),transparent 78%),
    radial-gradient(ellipse 46% 63% at 13% 26%,rgba(0,0,0,.10),transparent 80%);
  opacity:.6;
  animation:shadow-drift 19s ease-in-out infinite alternate;
  will-change:transform,opacity;
}
@keyframes shadow-drift{
  0%{transform:translate3d(-1.2%,.6%,0) scale(1.02);opacity:.36}
  50%{opacity:.56}
  100%{transform:translate3d(1.2%,-.8%,0) scale(1.055);opacity:.72}
}
@media(max-width:700px){
  .scene{width:min(98vw,calc(78dvh * 16 / 9))}
}
@media(max-height:440px) and (orientation:landscape){
  .scene{width:min(95vw,calc(92dvh * 16 / 9))}
}
@media(prefers-reduced-motion:reduce){
  .scene{transform:none!important;will-change:auto}
  .scene::after{animation:none;opacity:.44;will-change:auto}
}
</style>
</head>
<body>
<main aria-label="极简游戏场景">
  <figure class="scene" aria-label="中央的空教室，周围只有少量柔和流动的黑影">
    <img src="./assets/classroom.webp" width="1024" height="576"
      alt="空无一人的教室，黑板与课桌，左侧的窗户透入日光。" draggable="false">
  </figure>
</main>
<script>
(()=>{
  const stage=document.querySelector('.scene');
  const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const fine=window.matchMedia('(pointer:fine)');
  let targetX=0,targetY=0,x=0,y=0,frame=0;
  const clamp=n=>Math.max(-1,Math.min(1,n));
  function draw(){
    frame=0;
    if(motion.matches||!fine.matches)return;
    x+=(targetX-x)*.065;
    y+=(targetY-y)*.065;
    // Cinematic, limited perspective: max 1.5 degrees and a 5px drift.
    stage.style.setProperty('--sx',(x*5).toFixed(2)+'px');
    stage.style.setProperty('--sy',(y*3).toFixed(2)+'px');
    stage.style.setProperty('--rx',(-y*1.15).toFixed(3)+'deg');
    stage.style.setProperty('--ry',(x*1.5).toFixed(3)+'deg');
    if(Math.abs(targetX-x)+Math.abs(targetY-y)>.001)queue();
  }
  function queue(){if(!frame)frame=requestAnimationFrame(draw)}
  function pointerMove(e){
    if(motion.matches||!fine.matches||e.pointerType==='touch')return;
    targetX=clamp((e.clientX/window.innerWidth-.5)*2);
    targetY=clamp((e.clientY/window.innerHeight-.5)*2);
    queue();
  }
  function reset(){targetX=0;targetY=0;queue()}
  window.addEventListener('pointermove',pointerMove,{passive:true});
  document.addEventListener('pointerleave',reset);
  window.addEventListener('blur',reset);
  motion.addEventListener?.('change',reset);
})();
</script>
</body>
</html>
