<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>王城 · 城市场景 V01</title><style>*{box-sizing:border-box}body{margin:0;background:#1e2422;color:#e9e4d8;font:14px system-ui}#view{width:100vw;height:100dvh;display:block;touch-action:none;image-rendering:pixelated}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.panel{background:#202721db;padding:10px 13px;border:1px solid #857e68;border-radius:5px;pointer-events:auto}h1{font-size:17px;margin:0 0 5px}button{background:#373e36;color:#f0e6ce;border:1px solid #8d846b;border-radius:4px;font:inherit;padding:8px 10px;cursor:pointer;touch-action:none}button:active{background:#746447}.nav{display:flex;gap:5px;flex-wrap:wrap;max-width:370px}.sub{font-size:12px;color:#cdc3aa;margin-top:5px}#pad{position:absolute;bottom:20px;left:20px;display:grid;grid-template-columns:repeat(3,50px);gap:4px}#pad button{height:47px;font-size:20px}#run{position:absolute;bottom:22px;right:22px;padding:18px}#error{position:absolute;top:45%;left:10%;right:10%;color:#ffcdab;background:#231b18;padding:12px;display:none}#stats{white-space:pre-wrap;font-size:11px}details{margin-top:6px}@media(max-width:650px){.hud{display:block}.panel{padding:7px;margin-bottom:5px}.nav{max-width:100%}button{padding:6px 8px}.sub{font-size:11px}}</style><canvas id="view"></canvas><div class="hud"><div class="panel"><h1>王城 · 河岸旧城区</h1><div id="near">初始化</div><div class="sub" id="pos"></div><div class="sub">WASD 移动 · Shift 跑步 · 拖动观察</div><details><summary>场景数据</summary><pre id="stats"></pre></details></div><div class="panel nav"><button data-jump="market">集市</button><button data-jump="bridge">石桥</button><button data-jump="castle">城堡</button><button data-jump="riverside">河岸</button><button data-jump="street">商铺街</button><button id="overview">鸟瞰</button><button id="night">昼夜</button></div></div
