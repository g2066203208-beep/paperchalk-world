<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#393657">
<meta name="description" content="PAPERWORLD 原生四色像素画专业编辑器：精确像素、图层、动画、网格、选区、JSON 工程与 PNG 导出">
<title>PIXEL ATELIER · PAPERWORLD</title>
<link rel="stylesheet" href="./editor.css?v=atelier-1">
</head>
<body>
<div class="app" id="app">
 <header class="topbar">
  <a class="back" href="../index.html" aria-label="返回 PAPERWORLD 游戏">‹ 游戏</a>
  <div class="brand"><span class="mark" aria-hidden="true">▦</span><div><strong>PIXEL ATELIER</strong><small>PAPERWORLD · 逐像素绘画</small></div></div>
  <div class="head-actions">
   <span id="save-status" aria-live="polite">本机自动保存</span>
   <button id="new-project" title="创建新画布">新建</button>
   <button id="import-project" title="打开 JSON/PNG">导入</button>
   <button class="primary" id="export-png">导出 PNG <span aria-hidden="true">↗</span></button>
  </div>
 </header>
 <div class="workspace">
  <nav class="tools" aria-label="绘画工具">
   <span class="rail-label">TOOLS</span>
   <button class="tool active" data-tool="pencil" title="铅笔 B" aria-pressed="true"><span>✎</span><small>铅笔</small></button>
   <button class="tool" data-tool="eraser" title="橡皮 E" aria-pressed="false"><span>◇</span><small>橡皮</small></button>
   <button class="tool" data-tool="fill" title="油漆桶 F" aria-pressed="false"><span>▨</span><small>填充</small></button>
   <button class="tool" data-tool="line" title="直线 L" aria-pressed="false"><span>╱</span><small>直线</small></button>
   <button class="tool" data-tool="rect" title="矩形 R" aria-pressed="false"><span>□</span><small>矩形</small></button>
   <button class="tool" data-tool="ellipse" title="椭圆 O" aria-pressed="false"><span>◯</span><small>椭圆</small></button>
   <button class="tool" data-tool="picker" title="取色 I" aria-pressed="false"><span>◉</span><small>取色</small></button>
   <button class="tool" data-tool="select" title="选区 M" aria-pressed="false"><span>⬚</span><small>选区</small></button>
   <button class="tool" data-tool="pan" title="移动画布 H" aria-pressed="false"><span>✥</span><small>平移</small></button>
  </nav>
  <main class="canvas-area" aria-label="像素绘画工作区">
   <div class="canvas-top">
    <div class="doc-title"><strong id="doc-title">未命名像素画</strong><span id="doc-info">64 × 64 · 4 INKS</span></div>
    <div class="shortcuts">
     <button id="undo" title="Ctrl/⌘ + Z">↶ <span>撤销</span></button>
     <button id="redo" title="Ctrl/⌘ + Y">↷ <span>重做</span></button>
     <button id="zoom-out" aria-label="缩小">−</button>
     <button id="zoom-label" title="适应画布">800%</button>
     <button id="zoom-in" aria-label="放大">＋</button>
     <button id="fit" title="适应窗口">适应</button>
    </div>
   </div>
   <div class="canvas-viewport" id="canvas-viewport">
    <canvas id="paint-canvas" aria-label="像素画布：可用鼠标、触摸或触控笔绘制" tabindex="0"></canvas>
    <span class="canvas-hint" id="canvas-hint">单指绘制 · 双指平移/缩放 · 滚轮缩放</span>
   </div>
   <div class="canvas-bottom">
    <div class="group">
     <label><input type="checkbox" id="grid" checked> 网格</label>
     <label><input type="checkbox" id="mirror"> 左右镜像</label>
     <label><input type="checkbox" id="filled"> 实心形状</label>
    </div>
    <div class="group">
     <label for="brush">笔刷 <span id="brush-label">1px</span></label>
     <input id="brush" type="range" min="1" max="8" step="1" value="1">
     <span id="pointer-position">x — · y —</span>
    </div>
   </div>
  </main>
  <aside class="inspector" aria-label="颜色与图层">
   <section class="palette-panel">
    <div class="panel-heading"><h2>游戏标准色板</h2><small>固定 4 色 + 透明</small></div>
    <div id="swatches" class="swatches" role="group" aria-label="选择颜色"></div>
    <div class="selected-color"><span id="selected-chip"></span><div><strong id="selected-name">深紫</strong><code id="selected-hex">#393657</code></div></div>
    <p>只用正式四色，导出的每个像素都可定位。透明不会被自动填白。</p>
   </section>
   <section class="layer-panel">
    <div class="panel-heading"><h2>图层 <span id="layer-count">1 / 16</span></h2><div class="panel-actions"><button id="add-layer" title="添加图层">＋</button><button id="delete-layer" title="删除图层">−</button></div></div>
    <div id="layers" class="layer-list" role="list"></div>
   </section>
   <section class="operations">
    <div class="panel-heading"><h2>精细操作</h2></div>
    <div class="ops-grid">
     <button id="copy">复制选区</button><button id="cut">剪切选区</button>
     <button id="paste">粘贴选区</button><button id="clear-selection">取消选区</button>
     <button id="clear-layer">清空当前层</button><button id="resize-project">画布尺寸</button>
     <button id="export-sheet">导出序列帧</button><button id="export-json">保存工程</button>
    </div>
   </section>
  </aside>
 </div>
 <section class="timeline" aria-label="动画帧">
  <div class="timeline-header"><div><strong>时间轴 <span id="frame-counter">01 / 01</span></strong><small>每一帧都保留独立图层</small></div>
   <div class="timeline-actions"><label>FPS <input id="fps" type="number" min="1" max="24" value="6"></label><button id="play" aria-pressed="false">▶ 预览</button><button id="add-frame">＋ 帧</button><button id="delete-frame">删除帧</button></div>
  </div>
  <div class="frames" id="frames" role="list"></div>
 </section>
 <footer class="statusbar"><span id="help">铅笔 · B · 拖动绘制像素</span><span>透明索引 PNG / 可编辑 JSON / 最多 16 层 × 24 帧</span></footer>
</div>
<input id="file-picker" type="file" accept=".json,.png,application/json,image/png" hidden>
<script type="module" src="./editor.js?v=atelier-1"></script>
</body>
</html>
