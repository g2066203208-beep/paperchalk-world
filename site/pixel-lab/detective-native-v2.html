<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL LAB / R2C2侦探像素审核</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171a23;color:#f4eddd;font:15px/1.65 system-ui,"Noto Sans SC",sans-serif}main{max-width:1180px;padding:26px 16px 80px;margin:auto}a{color:#bcdcc5}h1{font-size:clamp(25px,4vw,42px);line-height:1.2;margin:14px 0}p{color:#bec5d1}figure{margin:0;min-width:0}img,canvas{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f8ecd2;image-rendering:pixelated;display:block;border:1px solid #66748c;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:#252a39;border:1px solid #455063;padding:14px;border-radius:12px;margin:15px 0}figcaption{font-weight:600;margin:8px 0}.muted{color:#bbc6d0;font-size:13px}pre{white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;background:#0e1620;padding:14px;border-radius:8px}label{cursor:pointer}#checker:checked~.grid #work{background-size:6.25% 6.25%;background-image:linear-gradient(to right,rgba(128,130,130,.1) 1px,transparent 1px),linear-gradient(to bottom,rgba(128,130,130,.1) 1px,transparent 1px)}@media(max-width:670px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><a href="./index.html">← 像素工作室</a>
<h1>R2C2 抽烟侦探 · 原生像素候选 V2</h1>
<p>输入使用已确认的V4原创角色图鉴，不重新生图。GitHub训练了CNN，并对眼睛、鼻子、嘴角、香烟、烟雾与漫画框实施结构保护。保留真实128×128原生网格、14色和8倍整数展示。</p>
<div class="panel"><strong>未达到「完美像素」验收</strong><p class="muted">模型如果增加杂点或降低源图保真度，就自动回退到清理后的传统基线。两种方法均是实验性候选；精确网格≠艺术家精修。</p><label><input id="checker" type="checkbox"> 显示逻辑像素格（仅预览叠加）</label></div>
<div class="grid"><figure><canvas id="orig" width="128" height="128"></canvas><figcaption>左：V4源图侦探区域（预览缩放）</figcaption></figure>
<figure><img id="work" src="./portrait-v4/R2C2-detective-approved-direction-preview-1024.png" alt="GitHub训练和门控后选择的侦探128x128逻辑像素候选" width="1024" height="1024"><figcaption>右：GitHub选中版本，128×128逻辑像素</figcaption></figure></div>
<div class="panel"><strong>产物、记录与审计</strong><p><a href="./portrait-v4/R2C2-detective-approved-direction-candidate-128.png">下载128×128原生像素PNG</a> · <a href="./portrait-v4/R2C2-detective-approved-direction-preview-1024.png">查看1024×1024最近邻预览</a> · <a href="https://github.com/g2066203208-beep/paperchalk-world/actions/workflows/detective-pixel-ml.yml">GitHub Actions训练</a> · <a href="https://github.com/g2066203208-beep/paperchalk-world/blob/main/ml/portrait_v4/detective_topology.py">查看修复代码</a></p><pre id="report">正在读取 GitHub 像素审计报告…</pre></div>
</main><script>
const img=new Image();img.onload=()=>{let c=document.querySelector('#orig');let g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(img,128,128,128,128,0,0,128,128)};img.src='./portrait-v4/source-v4-640-q92.webp';
fetch('./portrait-v4/R2C2-detective-topology-report.json').then(r=>r.json()).then(j=>{let a=j.candidate_comparison;document.querySelector('#report').textContent=['最终选择: '+j.selected,'使用训练模型: '+j.model_was_trained,'CNN自动晋升: '+j.model_automatically_promoted,'尺寸: '+j.native_logic.join('×'),'CNN碎色簇: '+a.trained_cnn.original_tiny_components+' → '+a.trained_cnn.tiny_8_connected_color_components,'基线碎色簇: '+a.baseline.original_tiny_components+' → '+a.baseline.tiny_8_connected_color_components,'五官及香烟保护区误修改像素: '+a[j.selected].protected_pixels_changed,'结果: 实验候选，不是最终美术Gold'].join('\n')}).catch(e=>document.querySelector('#report').textContent='报告尚未部署：'+e.message);
</script></body></html>
