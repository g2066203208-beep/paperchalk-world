<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素动作先验 · 真实训练</title><style>body{margin:0;background:#393657;color:#FFF5E6;font:15px/1.55 system-ui,"Noto Sans SC",sans-serif}main{max-width:1000px;margin:auto;padding:20px}a{color:#A9BAE9}h1{font-size:clamp(25px,4vw,40px)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.grid img{width:100%;height:auto;image-rendering:pixelated;border:1px solid #F2A5C2}.grid figure{min-width:0;margin:0}.grid figcaption{font-size:12px}p{max-width:840px}.note{border:1px solid #A9BAE9;padding:12px}small{color:#A9BAE9}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><a href="./learn.html">← 系统02</a><p><small>TRAINED FROM THREE CC0 ANIMATED CHARACTER SHEETS · DIAGNOSTIC ONLY</small></p><h1>动作模型 · 16种神经生成姿态</h1><p id="status">读取云端真实模型报告……</p><p class="note">真正的机器学习：从三个不同 CC0 像素角色的动作帧学习，再由网络按角色和动作类别推理新帧。它的训练分辨率只有16×16；**尚未把动作迁移到用户上传的384×512立绘**，不能拿这批小人当作目标高质量作品。</p><div class="grid" id="frames"></div><p><a href="./style2/motion-prior/report.json">查看训练、测试与独立性限制</a> · <a href="./new-reference.html">查看用户上传新图的真像素和模型修复</a></p></main><script>
fetch("./style2/motion-prior/report.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("本轮模型未部署");return r.json()}).then(d=>{if(!d.trained||d.actions<12)throw Error("报告校验失败");document.querySelector("#status").textContent="3个不同人物、"+d.training_images+"帧训练、"+d.heldout_images+"帧留出；"+d.steps+"步；网络输出"+d.actions+"张，其中不同像素图"+d.distinct_predictions+"张；未见帧像素准确率"+(100*d.pixel_accuracy_heldout_frames).toFixed(1)+"%。";const g=document.querySelector("#frames");for(let i=0;i<d.actions;i++){const f=document.createElement("figure"),img=document.createElement("img"),c=document.createElement("figcaption");img.src="./style2/motion-prior/motion_"+String(i).padStart(2,"0")+".png";img.width=128;img.height=128;img.loading="lazy";img.alt="模型不同动作"+(i+1);c.textContent="动作 "+String(i+1).padStart(2,"0");f.append(img,c);g.append(f)}}).catch(e=>document.querySelector("#status").textContent=e.message);
</script></body></html>
