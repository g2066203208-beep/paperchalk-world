<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#131a27">
<title>恶魔商店集团｜L2D 工作室独立展示间</title>
<style>
:root{--base:#111824;--surface:#1d2837;--muted:#91a1ae;--line:#344457;--gold:#ccaa70;--text:#f1f3f4}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--base);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);overflow-x:hidden}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #d6c5a3;outline-offset:4px}a{color:inherit;text-decoration:none}
.shell{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse 54% 65% at 52% 44%,#2c394e 0%,#171f2d 55%,#0e1621 100%)}
header{height:64px;min-height:64px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 clamp(16px,3vw,48px);background:#101722b0}
.brand{font-weight:750;letter-spacing:.035em;font-size:15px;display:flex;align-items:center;gap:11px}.brand .crest{color:var(--gold);font-size:23px}.brand small{font-size:10px;display:block;color:var(--muted);letter-spacing:.12em;font-weight:400}
nav{display:flex;align-items:center;gap:12px}.quiet{background:none;border:1px solid #ffffff30;color:#d2dbe4;border-radius:9px;padding:8px 14px;white-space:nowrap}.quiet:hover{border-color:#b2c2d1}.tag{color:var(--muted);font-size:11px;letter-spacing:.13em}
main{width:min(1440px,100%);margin:0 auto;display:grid;grid-template-columns:100px minmax(0,1fr) minmax(225px,300px);column-gap:clamp(24px,4vw,70px);align-items:center;flex:1;padding:30px clamp(18px,3vw,45px) 22px;min-height:0}
.rail{display:flex;flex-direction:column;gap:12px;align-self:center;justify-self:center;max-height:calc(100dvh - 120px);overflow:auto;scrollbar-width:thin}
.thumb{position:relative;width:70px;height:86px;background:#f7f7f3;border:2px solid #77889a80;border-radius:8px;padding:0;overflow:hidden;opacity:.65;transition:opacity .18s,border .18s,transform .18s;flex-shrink:0}.thumb:hover{opacity:1}.thumb[aria-current=true]{opacity:1;border-color:var(--gold);transform:translateX(5px);box-shadow:0 0 0 3px #c5b28d22}.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}.thumb span{position:absolute;left:3px;bottom:3px;padding:1px 3px;font:600 10px/1.3 system-ui;color:#fff;background:#101722a6;border-radius:2px}
.stage{width:100%;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;flex-direction:column}.stage:before{content:"";position:absolute;top:6%;left:50%;height:78%;width:60%;max-width:450px;transform:translateX(-50%);border:1px solid #b6bba925;border-radius:50%;pointer-events:none}
.frame{position:relative;width:min(49vh, 39vw, 400px);min-width:248px;aspect-ratio:704/1024;background:#fbfaf7;border:7px solid #d6d8d5;border-radius:14px;overflow:hidden;box-shadow:0 32px 75px #0007,0 0 0 1px #cfbc91,0 0 0 8px #fefefe0a;isolation:isolate;transition:transform .25s}.frame:hover{transform:translateY(-4px)}.frame img{width:100%;height:100%;object-fit:contain;display:block}.frame .placeholder{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:14px;color:#465b6b;background:linear-gradient(155deg,#f6f5f2,#dce5e9)}.frame.missing img{display:none}.frame.missing .placeholder{display:grid}.placeholder strong{font-family:Georgia,serif;font-size:74px;font-weight:400;color:#adc1c8}.placeholder span{font-size:13px}.placeholder button{border:1px solid #9eacb4;color:#384b5a;background:#fff;border-radius:7px;padding:9px 16px}
.frame .number{position:absolute;top:12px;left:14px;color:#273b49;padding:3px 9px;background:#ffffffe9;border:1px solid #ddd;border-radius:3px;font:500 11px Georgia,serif;letter-spacing:.12em}
.art-link{border:none;background:none;color:#acb5c1;padding:13px;font-size:12px;letter-spacing:.1em}.art-link:hover{color:#fff}
.info{align-self:center;padding-bottom:3vh}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.2em;margin:0 0 19px}.name{margin:0 0 9px;font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:500;font-size:clamp(30px,4vw,54px);letter-spacing:.06em}.en{margin:0;color:#a0b0c2;font:12px/1.6 Georgia,serif;letter-spacing:.17em;text-transform:uppercase}.rule{height:1px;background:linear-gradient(90deg,#bba47d,#bba47d00);margin:35px 0 20px;max-width:230px}.desc{color:#c3d0d9;max-width:250px;line-height:1.8;font-size:14px}.xp{display:flex;gap:12px;align-items:center;color:#d7c5a6;margin-top:22px;font-size:13px}.xp b{font-weight:500;color:#e7e9ec}.xp em{font-style:normal;color:#8697a8}.controls{display:flex;gap:8px;margin-top:36px}.controls button{border:1px solid #415469;border-radius:8px;padding:11px 16px;background:#203044;color:#f0f3f8}.controls button:hover{background:#31465c}.controls .import{border-color:#9b8969;background:#bdae88;color:#17212e;font-weight:650}.controls .import:hover{background:#d8c39d}
footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px clamp(16px,3vw,48px);border-top:1px solid #ffffff16;color:var(--muted);font-size:11px;min-height:50px}footer strong{color:#c9b48d;font-weight:500}
#art-dialog{border:0;padding:0;max-width:min(95vw,900px);max-height:95vh;border-radius:14px;background:#0d1320;color:white;box-shadow:0 18px 80px #000d}#art-dialog::backdrop{background:#030810dd}#art-dialog img{display:block;max-height:88vh;max-width:92vw;object-fit:contain}#art-dialog button{position:absolute;right:8px;top:8px;border:0;background:#111b2bcc;color:white;border-radius:8px;padding:8px 12px}
input[type=file]{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:760px){header{height:56px;min-height:56px}.brand{font-size:13px}header .tag{display:none}main{display:flex;flex-direction:column;gap:16px;padding:20px 12px}.stage{order:0}.frame{width:min(64vw,320px);min-width:215px}.info{order:1;text-align:center;padding:0}.eyebrow{margin-bottom:5px}.name{font-size:30px}.en{font-size:10px}.rule{margin:13px auto 10px}.desc{font-size:12px;max-width:300px}.xp{justify-content:center;margin-top:8px}.controls{justify-content:center;margin-top:15px}.controls button{padding:9px 13px}.rail{order:2;flex-direction:row;width:100%;max-height:none;justify-content:flex-start;overflow-x:auto;padding:5px 8px}.thumb{width:56px;height:70px}.thumb[aria-current=true]{transform:translateY(-4px)}footer{font-size:10px;min-height:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media(max-width:760px){header nav a:not(:last-child){display:none}header{gap:8px}header .brand small{font-size:8px}header .quiet{padding:7px 10px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span class="crest" aria-hidden="true">✥</span><div>黑心恶魔商店集团<small>DEMON TRADING COMPANY · 7 PORTRAITS</small></div></div><nav><span class="tag">L2D STUDIO / 恶魔集团</span><a class="quiet" href="./knight-booth.html">骑士团</a><a class="quiet" href="./witch-booth.html">魔女工坊</a><a class="quiet" href="./index.html">返回工作室</a></nav></header>
<main>
<div id="rail" class="rail" aria-label="七名恶魔集团成员"></div>
<div class="stage"><div id="frame" class="frame"><img id="hero" alt="恶魔集团成员立绘"><div class="placeholder"><strong>✥</strong><span>这张原画尚未发布到 GitHub</span><button type="button" id="slot-import">导入原画</button></div><span id="frame-index" class="number"></span></div><button class="art-link" id="view-art" type="button">查看完整原画 ↗</button></div>
<section class="info"><p class="eyebrow">SEVEN / DEMON COMPANY</p><h1 id="name" class="name"></h1><p id="name-en" class="en"></p><div class="rule"></div><div id="description" class="desc"></div><div class="xp"><em>XP</em><b id="xp"></b></div><div class="controls"><button type="button" id="prev" aria-label="上一位">←</button><button type="button" id="next" aria-label="下一位">→</button><button class="import" type="button" id="import-all">导入立绘</button></div></section>
</main>
<footer><span>独立美术展示 · 不修改恐怖游戏剧情与 L2D 人物库</span><strong id="save-status" role="status">恶魔集团 / 7 张正式原画</strong></footer>
</div>
<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple aria-label="导入七名恶魔立绘"><dialog id="art-dialog" aria-label="完整原画"><button type="button" id="close-art" aria-label="关闭">✕</button><img id="art-image" alt="原画鉴赏"></dialog>
<script>
(()=>{'use strict';
const roster=[{"id":"01-owner","name":"店长","en":"Demon Shop Owner","xp":"贪婪","desc":"笑着招呼顾客，也笑着赚走最后一枚金币。","file":"shop-owner.webp","words":["店长","老板","shop-owner","01"]},{"id":"02-contract","name":"契约经理","en":"Contract Manager","xp":"契约","desc":"最擅长把危险的条件藏在温柔的营业微笑里。","file":"contract-manager.webp","words":["契约经理","contract","02"]},{"id":"03-finance","name":"财务主管","en":"Finance Director","xp":"复利","desc":"一分钱都不会放过的精明财务主管。","file":"finance-director.webp","words":["财务","finance","03"]},{"id":"04-purchasing","name":"采购主管","en":"Purchasing Director","xp":"套利","desc":"会以最低的价格买到最好的宝物。","file":"purchasing-director.webp","words":["采购","purchasing","04"]},{"id":"05-loan","name":"放贷主管","en":"Loan Director","xp":"借贷","desc":"坐在钱箱上微笑着递出代价高昂的贷款。","file":"loan-director.webp","words":["放贷","loan","05"]},{"id":"06-debt","name":"催收主管","en":"Debt Collection Director","xp":"追债","desc":"最后期限到了，她会亲自带着账单上门。","file":"debt-collector.webp","words":["催收","debt","06"]},{"id":"07-security","name":"安保主管","en":"Security Director","xp":"守财","desc":"不声不响的恶魔女保镖，谁也别想动店里的钱。","file":"security-director.webp","words":["安保","security","07"]}];
const $=id=>document.getElementById(id),urls=new Map();let current=0,db;
const base='../assets/characters/demon-merchant/';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('paperchalk-demon-booth-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('portraits')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function query(id){return new Promise(resolve=>{if(!db){resolve(null);return}const tx=db.transaction('portraits','readonly');const r=tx.objectStore('portraits').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)})}
function save(id,blob){return new Promise((resolve,reject)=>{if(!db){reject(Error('浏览器存储不可用'));return}const tx=db.transaction('portraits','readwrite');tx.objectStore('portraits').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function source(entry){if(urls.has(entry.id))return urls.get(entry.id);const blob=await query(entry.id);if(blob){const url=URL.createObjectURL(blob);urls.set(entry.id,url);return url}return base+entry.file}
function assign(img,src,onMissing){img.onerror=()=>{img.onerror=null;onMissing?.()};img.src=src}
async function show(index){current=(index+roster.length)%roster.length;const v=roster[current];$('name').textContent=v.name;$('name-en').textContent=v.en;$('description').textContent=v.desc;$('xp').textContent=v.xp;$('frame-index').textContent=String(current+1).padStart(2,'0')+' / 07';$('frame').classList.remove('missing');$('hero').alt=v.name+'原画';const id=current;assign($('hero'),await source(v),()=>{if(id===current)$('frame').classList.add('missing')});
for(const t of $('rail').children)t.setAttribute('aria-current',String(Number(t.dataset.index)===current));}
async function refreshThumb(i){const v=roster[i],button=$('rail').children[i],img=button.querySelector('img');assign(img,await source(v),()=>{img.style.visibility='hidden';button.style.background='#293b50'})}
async function importFiles(files,onlyCurrent=false){let assigned=0;const images=[...files].filter(f=>/^image\/(png|jpeg|webp)$/.test(f.type));for(let i=0;i<images.length;i++){
 const file=images[i];let idx=onlyCurrent?current:-1;
 if(idx<0){const lower=file.name.toLowerCase();idx=roster.findIndex(r=>r.words.some(w=>lower.includes(w.toLowerCase())));if(idx<0&&images.length===7)idx=i;if(idx<0&&images.length===1)idx=current}
 if(idx<0)continue;const r=roster[idx];try{await save(r.id,file);const old=urls.get(r.id);if(old)URL.revokeObjectURL(old);urls.set(r.id,URL.createObjectURL(file));await refreshThumb(idx);assigned++}catch(e){$('save-status').textContent='保存失败：'+e.message}}
 await show(current);if(assigned)$('save-status').textContent='✓ '+assigned+' 张原画已保存至此浏览器';else $('save-status').textContent='文件名未能识别，可逐张选中后导入';}
function choose(onlyCurrent){$('files').multiple=!onlyCurrent;$('files').dataset.one=String(onlyCurrent);$('files').click()}
$('files').onchange=async e=>{await importFiles(e.target.files,e.target.dataset.one==='true');e.target.value=''};
$('import-all').onclick=()=>choose(false);$('slot-import').onclick=()=>choose(true);$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);
$('view-art').onclick=()=>{if($('frame').classList.contains('missing')){choose(true);return}$('art-image').src=$('hero').src;$('art-image').alt=roster[current].name+'完整原画';$('art-dialog').showModal()};$('close-art').onclick=()=>$('art-dialog').close();$('art-dialog').onclick=e=>{if(e.target===$('art-dialog'))e.target.close()};
window.addEventListener('keydown',e=>{if(e.target.closest('input')||$('art-dialog').open)return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
let startX=0;$('frame').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('frame').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>55)show(current+(dx>0?-1:1))},{passive:true});
roster.forEach((r,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';b.dataset.index=i;b.setAttribute('aria-label',r.name);b.innerHTML='<img alt=""><span>'+String(i+1).padStart(2,'0')+'</span>';b.onclick=()=>show(i);$('rail').append(b)});
openDb().then(x=>{db=x;roster.forEach((_,i)=>refreshThumb(i));show(0)}).catch(()=>{roster.forEach((_,i)=>refreshThumb(i));show(0);$('save-status').textContent='浏览器本地存储不可用，仅可查看已发布原画'});
window.addEventListener('beforeunload',()=>{for(const u of urls.values())URL.revokeObjectURL(u)});
})();
</script></body></html>
