<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c2531">
<title>七层纸片纵深舞台｜实际可操作场景</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#121b22}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh}
#view{position:relative;width:100vw;height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:center}
#scene{position:relative;width:min(100vw,177.78dvh);aspect-ratio:16/9;margin:0;overflow:hidden}
#source{width:100%;height:100%;object-fit:cover}</style>
<link rel="stylesheet" href="./game/paper-ocean-stage.css?v=depth-v2">
<script defer src="./game/paper-ocean-stage.js?v=depth-v2"></script>
</head><body><main id="view"><figure id="scene"><img id="source" src="./assets/paper-ocean/depth-journey-master.png" alt=""></figure></main>
<script>addEventListener('DOMContentLoaded',()=>{
const renderer=PaperWorldPaperOcean.create({stage:document.querySelector('#scene'),view:document.querySelector('#view')});
window.PaperWorldPaperOceanRenderer=renderer;renderer.setActive(true);
document.addEventListener('keydown',event=>{if(event.target?.tagName==='BUTTON')return;
if(event.key==='ArrowRight'||event.key===' '){event.preventDefault();renderer.advance()}
if(event.key==='ArrowLeft'){event.preventDefault();renderer.retreat()}
if(event.key.toLowerCase()==='r'){renderer.reset()}});
});</script></body></html>
