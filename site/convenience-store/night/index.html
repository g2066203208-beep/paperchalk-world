<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d15"><title>深夜便利店 · 第一晚</title><link rel="stylesheet" href="./night.css?v=1"><script src="./night-core.js?v=1"></script><script src="./night-game.js?v=1" defer></script></head><body>
<main id="game" data-area="counter" data-phase="0" aria-label="深夜便利店规则怪谈第一晚">
 <div id="scene-image" role="img" aria-label="雨夜便利店的场景"></div><div class="cinematic-shade" aria-hidden="true"></div><div class="light-flicker" aria-hidden="true"></div><div id="specter" aria-hidden="true"><div class="specter-head"></div></div><div id="power-off" aria-hidden="true"></div>
 <header id="hud"><div class="branding"><span class="mark">◈</span><span>深夜便利店<small>FIRST NIGHT / 23:00—06:00</small></span></div><div class="shift-time" id="clock" aria-live="off">23:00</div><div class="quiet-stats"><span title="夜班收入" id="money">¥0</span><span title="已完成订单" id="orders">0 单</span><span title="紧张程度" class="stress" id="stress">平静</span></div></header>
 <div id="place-name"><span class="area-dot"></span><span id="area-label">收银区</span><span id="ambient-line">雨点不时敲在落地玻璃上。</span></div>
 <nav id="toolbar" aria-label="夜班工具"><button id="open-manual" aria-label="工作手册" title="工作手册 [R]">▤<span>规则</span></button><button id="open-cctv" aria-label="监控" title="监控 [C]">◉<span>监控</span></button><button id="open-phone" aria-label="值班手机" title="手机 [P]">▣<span>手机</span></button><button id="open-log" aria-label="记录" title="夜班记录 [L]">≡<span>记录</span></button><button id="open-settings" aria-label="设置" title="设置">⚙<span>设置</span></button></nav>
 <nav id="area-nav" aria-label="便利店地点"><button data-area="counter">收银台</button><button data-area="aisle">货架</button><button data-area="cooler">冷柜</button><button data-area="stockroom">仓库</button><button data-area="office">员工室</button><button data-area="entrance">店外</button></nav>
 <div id="scene-sound" aria-hidden="true">♪</div>
 <section id="scene-action" aria-label="场景互动"><div id="scene-prompt">一张未看过的值班手册压在收银台下。</div><div class="scene-action-buttons" id="scene-action-buttons"></div></section>
 <aside id="cashier" aria-label="收银台操作" hidden><div class="cashier-head"><span><b id="customer-name">夜班顾客</b><small id="customer-sub">顾客正在等待结账</small></span><button id="cashier-close" aria-label="收起收银台">×</button></div>
  <div class="counter-parts" aria-label="分层可交互收银设备"><img class="counter-base" src="../parts/counter-body.svg" alt="柜台主体"><img class="counter-countertop" src="../parts/counter-top.svg" alt="台面"><img class="counter-pos" src="../parts/pos-terminal.svg" alt="收银终端"><button class="counter-scan" id="model-scanner" title="使用真实扫码枪"><img src="../parts/scanner.svg" alt="扫码枪"></button><button class="counter-card" id="model-card" title="刷卡收款"><img src="../parts/card-reader.svg" alt="读卡器"></button><button class="counter-bag" id="model-bag" title="购物袋"><img src="../parts/bag-rack.svg" alt="购物袋架"></button></div>
  <div class="cashier-order"><strong id="order-instruction">扫描顾客的商品</strong><span id="order-total">¥0</span></div><div id="product-buttons" class="product-buttons" aria-label="顾客待结账商品"></div><div class="checkout-progress" id="checkout-progress">已扫描 0 / 0</div>
  <div class="checkout-actions"><button id="checkout-scan" type="button">▥ 扫码</button><button id="checkout-pay" type="button">¥ 收款</button><button id="checkout-bag" type="button">▣ 装袋交付</button><button id="checkout-no-bag" type="button">直接交付</button></div>
 </aside>
 <aside id="incident" hidden aria-live="polite"><span class="incident-kicker">SHIFT INCIDENT</span><strong id="incident-title">异常</strong><p id="incident-description"></p><div id="incident-buttons" class="incident-buttons"></div></aside>
 <aside id="toast" aria-live="polite" hidden></aside>
 <section id="modal-layer" hidden aria-label="夜班工具面板"><button id="modal-backdrop" aria-label="关闭面板"></button><section class="modal-card"><div class="modal-top"><span id="modal-heading">工作手册</span><button id="modal-close" title="关闭">×</button></div><div id="modal-content"></div></section></section>
 <section id="intro" class="intro-screen"><div class="intro-overline">PAPERCHALK WORLD — SIDE STORY</div><h1>深夜便利店</h1><p class="intro-subtitle">第一晚 · 23:00 — 06:00</p><div class="intro-copy">接班记录只有一句话：<br>“有客人的时候，别忘了继续工作。”</div><button id="begin" class="begin-btn">接班</button><div class="intro-bottom">夜班模拟经营 × 规则怪谈　｜　建议佩戴耳机</div></section>
 <section id="ending" class="ending-screen" hidden><span class="ending-kicker">06:00 / SHIFT OVER</span><h2 id="ending-title">天亮了</h2><p id="ending-text"></p><div id="ending-stats"></div><div class="ending-actions"><button id="ending-restart">重新开始第一晚</button><a href="../">返回便利店日常</a></div></section>
 <div class="game-bottom"><span id="task">完成顾客订单，检查交接手册。</span><div><button id="skip-15" title="推进夜班时间">继续值班 +15分</button><button id="toggle-sound" aria-pressed="false">♪ 音效：关</button><a href="../" title="返回原便利店">↩</a></div></div>
</main></body></html>
