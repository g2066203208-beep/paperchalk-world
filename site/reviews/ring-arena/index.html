<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans CJK SC",sans-serif}

main{max-width:1500px;margin:0 auto;padding:28px clamp(16px,3vw,45px) 64px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
figure{margin:0;border:1px solid #30343a;border-radius:12px;overflow:hidden;background:#16191e}
a{display:block;color:inherit;text-decoration:none}

<h2 style="font-weight:600;font-size:19px;margin:32px 0 10px">鼠标环顾舒适度 · 左右极限实机</h2>
<p>以下两张由真实 WebGL 画面截取：仅视线轻微转动，人物世界位置、原始越肩摄像机眼点和 FOV 不改变；左右最大 7.5°。若截图尚未发布，先在下方检查对应测试的提交版本。</p>
<div class="grid">
<figure><a href="https://raw.githubusercontent.com/g2066203208-beep/paperchalk-world/ring-arena-screenshots/ring-arena/human-look-left-1280x720.png"><img src="https://raw.githubusercontent.com/g2066203208-beep/paperchalk-world/ring-arena-screenshots/ring-arena/human-look-left-1280x720.png" alt="原地向左轻微环顾的真实游戏截图" loading="lazy"></a><figcaption>鼠标移到最左侧 · 最多 -7.5°</figcaption></figure>
<figure><a href="https://raw.githubusercontent.com/g2066203208-beep/paperchalk-world/ring-arena-screenshots/ring-arena/human-look-right-1280x720.png"><img src="https://raw.githubusercontent.com/g2066203208-beep/paperchalk-world/ring-arena-screenshots/ring-arena/human-look-right-1280x720.png" alt="原地向右轻微环顾的真实游戏截图" loading="lazy"></a><figcaption>鼠标移到最右侧 · 最多 +7.5°</figcaption></figure>

<p id="capture-revision" style="margin-top:20px">截图版本核对中……</p>
<script>
fetch('https://raw.githubusercontent.com/g2066203208-beep/paperchalk-world/ring-arena-screenshots/ring-arena/manifest.json?v=human-look-v2',{cache:'no-store'})
.then(r=>r.json()).then(m=>{
 document.getElementById('capture-revision').textContent='截图对应源提交：'+(m.commit||'未知')+
  '。若与 GitHub 最新提交不一致，此处图片仍是旧版，不能用于新版本验收。';
}).catch(()=>{document.getElementById('capture-revision').textContent='无法读取截图版本，请检查 GitHub Actions。';});
</script>
