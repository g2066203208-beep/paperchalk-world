<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>霧浜市 · 120地点严格区位规划</title>
<style>
:root{color-scheme:dark;font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;background:#0b131a;color:#d9e1dd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 52% 15%,#172a34 0,#0b131a 65%)}
header{padding:18px clamp(16px,3vw,38px);border-bottom:1px solid #6f89902b;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0 0 5px;font-size:clamp(19px,2vw,26px);font-weight:630;letter-spacing:.055em}
header p{margin:0;color:#98adb1;font-size:12px;line-height:1.7}header a{color:#9ab5b8;text-decoration:none;border-bottom:1px solid #658188}
main{display:grid;grid-template-columns:minmax(205px,250px) minmax(300px,1fr) minmax(210px,265px);min-height:calc(100vh - 90px)}
aside{padding:15px;overflow:auto;max-height:calc(100vh - 90px)}
aside:first-child{border-right:1px solid #5f7c8135}aside:last-child{border-left:1px solid #5f7c8135}
h2{font-size:12px;color:#98adb1;letter-spacing:.12em;font-weight:600;margin:8px 0 14px}
#districts{display:grid;gap:3px}#districts button{border:0;border-left:2px solid transparent;background:transparent;color:#b6c5c4;text-align:left;font:inherit;cursor:pointer;padding:9px 10px;font-size:12px;display:flex;justify-content:space-between;gap:8px;border-radius:2px}
#districts button:hover{background:#23353d}#districts button[aria-pressed="true"]{border-left-color:#d8b887;background:#1b313d;color:#f4ebd7}
#districts small{color:#879da2}#search{width:100%;font:inherit;font-size:12px;background:#182831;border:1px solid #546c734f;border-radius:5px;padding:10px;color:#e5eeeb;margin:0 0 12px}
#map-wrap{position:relative;min-height:560px;overflow:hidden;touch-action:none;background:linear-gradient(110deg,#0f1d25,#13232a)}
#map{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#map-legend{position:absolute;left:12px;bottom:12px;pointer-events:none;font-size:11px;line-height:1.8;color:#a6bcbe;background:#07151de0;padding:9px 12px;border:1px solid #35505c66;max-width:min(350px,80%)}
#map-legend strong{color:#e2caa0;font-weight:650}
#map-badge{position:absolute;top:12px;left:12px;font-size:11px;color:#c4d2d1;background:#0e2029da;padding:6px 9px;max-width:80%}
#map-actions{position:absolute;right:12px;top:12px;display:flex;gap:5px}
#map-actions button{width:33px;height:32px;border:1px solid #607f8580;color:#d7e4e2;background:#162831dd;font-size:16px;cursor:pointer;border-radius:4px}
#map .site{cursor:pointer;outline:none}#map .site:focus-visible circle,#map .site:hover circle{stroke:#fff5cc;stroke-width:.12}
#map .site[data-active="true"] circle{fill:#f2d8a7;stroke:#fff3cb;stroke-width:.115}
#map .site text{display:none;paint-order:stroke;stroke:#0c1d27;stroke-width:.18;stroke-linejoin:round;font-size:.46px;fill:#f4efdc}
#map .site[data-active="true"] text,#map .site:hover text{display:block}
#site-list{display:grid;gap:3px;margin-top:14px}
#site-list button{width:100%;border:0;border-bottom:1px solid #44596230;padding:9px 3px;background:transparent;text-align:left;color:#d3dfd9;font:inherit;font-size:12px;cursor:pointer}
#site-list button:hover,#site-list button[aria-current="true"]{color:#f5dfa6}
#site-list small{display:block;color:#7e9da1;padding-top:4px;font-size:10px}
#information{padding:12px 0 10px}#information b{display:block;font-weight:630;font-size:18px;color:#f3e0bb;margin-bottom:11px}#information p{color:#b4c6c5;line-height:1.8;font-size:12px;margin:0 0 7px}
#information span{color:#7e9fa3}#status{color:#d6b784!important}
#rail-note{font-size:11px;color:#829da0;line-height:1.9;border-top:1px solid #536e7640;margin-top:12px;padding-top:12px}
#district-desc{font-size:12px;line-height:1.8;color:#bdc8c4;margin:6px 0}
@media(max-width:1000px){main{grid-template-columns:195px minmax(290px,1fr)}aside:last-child{grid-column:1/-1;border:0;border-top:1px solid #45606b58;max-height:none}aside:first-child{max-height:600px}#map-wrap{min-height:630px}}
@media(max-width:640px){main{display:block}aside:first-child{max-height:192px;overflow:auto;border:0;border-bottom:1px solid #49606b4c}#districts{display:flex;overflow:auto;gap:4px;white-space:nowrap}#districts button{flex:0 0 auto;font-size:11px;padding:10px}#map-wrap{min-height:520px}aside:last-child{max-height:none;padding:13px}#site-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<header><div><h1>霧浜市 <span style="color:#d8bd91">/</span> 区位与轨道规划</h1><p>15 个功能片区 · 120 个地点 · 70 座真实地铁站 · 示意地形 / 物理坐标分离</p></div><p>规划审核工具，<strong>不是正式游戏地图</strong> · <a href="./">返回游戏</a></p></header>
<main><aside><input id="search" type="search" placeholder="搜索地点或车站…" aria-label="搜索规划地点"><div id="districts" aria-label="选择功能片区"></div></aside>
<section id="map-wrap" aria-label="霧浜城市地点布置图"><svg id="map" role="img" aria-label="真实地铁站和规划场景地点" viewBox="-1 -1 38 28"></svg>
<div id="map-badge">点击左侧片区，显示其地点与实际步行接驳</div>
<div id="map-actions"><button id="zoom-in" title="放大">+</button><button id="zoom-out" title="缩小">−</button><button id="zoom-reset" title="全图">⌖</button></div>
<div id="map-legend"><strong>黄色点</strong>：当前片区规划地点　<strong>淡白环</strong>：对应地铁站<br>彩色细线：真实 10 条运营轨道；青色：河道；蓝灰：湾海。<br>地点以车站为锚点，按米数偏移，未建成场景不冒充已开放。</div>
</section><aside><h2>所选区域与地点</h2><div id="district-desc"></div><div id="information"></div><div id="site-list"></div><div id="rail-note">采用虚构城市米制坐标，点阵 1 格对应规划约 900 米。步行距离属于道路建模前的绕行估算，尚不是 GIS 测量结果。地铁只属于霧浜市，不和其他城市线路混画。地面与地下地点使用不同楼层编号。</div></aside></main>
<script src="./game/metro-graph.js?v=curated70-review-map-20261108"></script>
<script src="./game/metro-map-geometry.js?v=authored-corners-review-20261108"></script>
<script src="./game/kirihama-location-plan.js?v=120-authored-station-pins-v1-20261108"></script>
<script>
(()=>{'use strict';
 const plan=window.PaperWorldKirihamaLocationPlan;
 const rail=window.PaperWorldMetro,geo=window.PaperWorldMetroGeometry;
 const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
 const districtList=document.getElementById('districts'),siteList=document.getElementById('site-list');
 const placeInfo=document.getElementById('information'),districtInfo=document.getElementById('district-desc');
 const badge=document.getElementById('map-badge');
 const el=(tag,attrs,cls)=>{const n=document.createElementNS(NS,tag);if(cls)n.setAttribute('class',cls);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,String(v));return n};
 const html=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
 const point=s=>({x:s.localPosition.eastM/900,y:s.localPosition.southM/900});
 const station=s=>rail.STATIONS[s.metroStationId];
 const selected={district:'central',site:null};
 const viewport={x:-1,y:-1,w:38,h:28};
 const setView=()=>svg.setAttribute('viewBox',[viewport.x,viewport.y,viewport.w,viewport.h].join(' '));
 const base=el('g',{'data-name':'geography'}),lines=el('g',{'data-name':'tracks'}),hubs=el('g',{'data-name':'hubs'}),pins=el('g',{'data-name':'sites'});
 svg.append(base,lines,hubs,pins);
 base.append(el('rect',{x:-2,y:-2,width:40,height:31,fill:'#13242a'}));
 base.append(el('path',{d:'M-2,-2 H12 L9,1.5 6.8,4.8 4,5.7 -2,4Z',fill:'#22392f',opacity:.56}));
 base.append(el('path',{d:'M36 0 L36 26 34.8 24 35 22 32.5 20 29.5 18 29.2 15 31.8 12 34.6 9 35.3 0Z',fill:'#244654',opacity:.76}));
 base.append(el('path',{d:'M0 14.4 C5 14.9 9 14.2 13 14.8 C15 16 12 19 13.8 26',fill:'none',stroke:'#386974','stroke-width':.38,opacity:.65}));
 for(const line of rail.LINES){
  for(const [a,b] of geo.segments(line)){
   const from=rail.STATIONS[a],to=rail.STATIONS[b];
   const coords=[[from.gx,from.gy],...(geo.routes[line.id+':'+a+':'+b]||[]),[to.gx,to.gy]];
   const d=coords.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');
   const outer=el('path',{d,stroke:'#081c23','stroke-width':.23,fill:'none','stroke-linejoin':'round','stroke-linecap':'round'});
   const n=el('path',{d,stroke:line.color,'stroke-width':.095,fill:'none',opacity:.68,'stroke-linejoin':'round','stroke-linecap':'round'});
   lines.append(outer,n);
  }
 }
 function zoom(f,x,y){
  const targetW=Math.max(5,Math.min(38,viewport.w*f)),targetH=targetW*28/38;
  const fx=x??viewport.x+viewport.w/2,fy=y??viewport.y+viewport.h/2;
  viewport.x=fx-(fx-viewport.x)*targetW/viewport.w;
  viewport.y=fy-(fy-viewport.y)*targetH/viewport.h;
  viewport.w=targetW;viewport.h=targetH;setView();
 }
 function setSite(s){
  selected.site=s.id;
  const st=station(s),coord=point(s);
  placeInfo.replaceChildren();
  placeInfo.append(html('b','',s.name));
  const rows=[
   ['片区',plan.districts.find(d=>d.id===s.districtId)?.name||'—'],
   ['地铁站',st?.label||s.metroStationId],
   ['相对车站', (s.localPosition.eastM-st.gx*900)+'m 东，'+(s.localPosition.southM-st.gy*900)+'m 南'],
   ['局部米制坐标',s.localPosition.eastM+' m E / '+s.localPosition.southM+' m S'],
   ['步行接驳估算',s.walking.distanceM+' 米 / '+s.walking.minutes+' 分钟'],
   ['楼层',s.localPosition.level===0?'地面':s.localPosition.level+' 地下层'],
   ['开发状态',s.status==='日常'?'已具备日常场景入口':s.status==='未开放'?'已登记但未开放':'仅规划，未制作完整场景']
  ];
  for(const [name,value]of rows){
   const p=html('p');p.append(html('span','',name+'：'),document.createTextNode(String(value)));if(name==='开发状态')p.id='status';placeInfo.append(p);
  }
  for(const g of pins.querySelectorAll('.site'))g.dataset.active=String(g.dataset.id===s.id);
  for(const b of siteList.querySelectorAll('button'))b.setAttribute('aria-current',String(b.dataset.id===s.id));
  badge.textContent=s.name+' · '+st.label+' · 步行估算 '+s.walking.distanceM+'m';
 }
 function drawDistrict(id){
  const d=plan.districts.find(d=>d.id===id);if(!d)return;
  selected.district=id;selected.site=null;
  districtInfo.textContent=d.character;
  pins.replaceChildren();hubs.replaceChildren();siteList.replaceChildren();placeInfo.replaceChildren();
  const active=plan.sites.filter(s=>s.districtId===id);
  const byStation=new Map();
  for(const s of active)byStation.set(s.metroStationId,rail.STATIONS[s.metroStationId]);
  for(const [id,st] of byStation){
   const g=el('g',{'data-station':id});g.append(el('circle',{cx:st.gx,cy:st.gy,r:.19,fill:'#263a42',stroke:'#d1d8cb','stroke-width':.09}));
   const t=el('text',{x:st.gx+.24,y:st.gy-.24,'font-size':.42,fill:'#c2d5ce'});t.textContent=st.label;g.append(t);hubs.append(g);
  }
  for(const s of active){
   const p=point(s),st=station(s);
   const g=el('g',{'class':'site','data-id':s.id,role:'button',tabindex:0,'aria-label':s.name});
   const leader=el('line',{x1:st.gx,y1:st.gy,x2:p.x,y2:p.y,stroke:'#b9c7b8','stroke-width':.035,'stroke-dasharray':'.11 .09',opacity:.54});
   g.append(leader);
   g.append(el('circle',{cx:p.x,cy:p.y,r:.17,fill:s.status==='日常'?'#ddc88c':'#b6a68c',stroke:'#0f1b22','stroke-width':.07}));
   const label=el('text',{x:p.x+.24,y:p.y-.21});label.textContent=s.name;g.append(label);
   g.addEventListener('click',()=>setSite(s));g.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setSite(s)}});
   pins.append(g);
   const b=html('button');b.dataset.id=s.id;b.append(document.createTextNode(s.name),html('small','',st.label+' · '+s.walking.distanceM+'m · '+s.status));
   b.addEventListener('click',()=>{setSite(s);zoom(.86,p.x,p.y)});siteList.append(b);
  }
  for(const b of districtList.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===id));
  badge.textContent=d.name+' · '+active.length+' 个规划地点';
  if(active.length)setSite(active[0]);
 }
 for(const d of plan.districts){
  const b=html('button');b.dataset.id=d.id;b.setAttribute('aria-pressed','false');b.append(html('span','',d.name),html('small','',d.siteCount));
  b.addEventListener('click',()=>drawDistrict(d.id));districtList.append(b);
 }
 document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim();if(!q)return;
  const found=plan.sites.find(p=>p.name.includes(q)||rail.STATIONS[p.metroStationId]?.label.includes(q));
  if(found){if(selected.district!==found.districtId)drawDistrict(found.districtId);setSite(found)}
 });
 document.getElementById('zoom-in').addEventListener('click',()=>zoom(.77));
 document.getElementById('zoom-out').addEventListener('click',()=>zoom(1.3));
 document.getElementById('zoom-reset').addEventListener('click',()=>{Object.assign(viewport,{x:-1,y:-1,w:38,h:28});setView()});
 svg.addEventListener('wheel',e=>{e.preventDefault();const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const ctm=svg.getScreenCTM();if(!ctm)return;const loc=pt.matrixTransform(ctm.inverse());zoom(e.deltaY>0?1.15:.87,loc.x,loc.y)},{passive:false});
 let pan=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.site'))return;pan={id:e.pointerId,x:e.clientX,y:e.clientY,vx:viewport.x,vy:viewport.y};svg.classList.add('dragging');svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!pan||pan.id!==e.pointerId)return;const b=svg.getBoundingClientRect();viewport.x=pan.vx-(e.clientX-pan.x)*viewport.w/b.width;viewport.y=pan.vy-(e.clientY-pan.y)*viewport.h/b.height;setView()});
 const stop=e=>{if(pan?.id===e.pointerId)pan=null;svg.classList.remove('dragging')};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
 drawDistrict('central');setView();
})();
</script></body></html>
