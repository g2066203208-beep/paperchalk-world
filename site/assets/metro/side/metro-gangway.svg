<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="metal" x2="1" y2=".3"><stop stop-color="#4d5656"/><stop offset=".26" stop-color="#90958b"/><stop offset=".58" stop-color="#747c79"/><stop offset="1" stop-color="#3f4a4c"/></linearGradient>
