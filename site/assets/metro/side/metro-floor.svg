<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
 <pattern id="grain" width="70" height="70" patternUnits="userSpaceOnUse">
 <rect width="70" height="70" fill="#434f51"/>
 <g fill="#81908d" opacity=".24"><circle cx="8" cy="11" r="1.7"/><circle cx="34" cy="17" r="1.1"/><circle cx="53" cy="44" r="1.8"/><circle cx="16" cy="56" r="1.2"/><circle cx="67" cy="5" r="1.2"/></g>
 <g fill="#22353a" opacity=".32"><circle cx="21" cy="24" r="1.7"/><circle cx="59" cy="26" r="1.5"/><circle cx="43" cy="62" r="1.2"/></g>
 </pattern>
 <linearGradient id="wear" x2="1" y2="1"><stop stop-color="#586563" stop-opacity=".22"/><stop offset=".65" stop-color="#253338" stop-opacity=".05"/><stop offset="1" stop-color="#87938b" stop-opacity=".13"/></linearGradient>
 </defs>
 <!-- Quiet one-piece dark anti-slip rubber vinyl as a real 3D floor material.
      No big office ceramic tiles, no wooden planks or baked-in shadows. -->
 <rect width="1024" height="1024" fill="url(#grain)"/>
 <rect width="1024" height="1024" fill="url(#wear)"/>
 <!-- Continuous rubber floor, not ceramic/wood planks. No artificial
      high-contrast rectangular tile boundaries at each texture repeat. -->
 <path d="M80 340L134 364M343 600L385 616M700 143L750 166M892 781L937 807" stroke="#82908b" stroke-width="8" opacity=".14"/>
 </svg>