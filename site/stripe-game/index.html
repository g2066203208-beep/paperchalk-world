<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF5E6">
<meta name="description" content="四种固定颜色，原生像素格绘制的安静粗斜纹循环背景。手机全屏适配。">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>四色 · 像素循环背景</title>
<style>
:root{--ink:#393657;--pink:#F2A5C2;--blue:#A9BAE9;--paper:#FFF5E6; color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper)}
body{font:14px/1.5 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#scene{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#pattern{position:absolute;top:0;left:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#settingsButton{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font:700 21px/1 monospace;cursor:pointer;display:grid;place-items:center}
#settingsButton[hidden]{display:none}
#panel{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(354px,calc(100vw - 20px));max-height:min(86dvh,720px);overflow-y:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--pink);padding:15px;display:none}
#panel.open{display:block}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:800}.heading h1{font-size:19px;line-height:1.3;margin:4px 0 10px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#close{background:var(--ink);color:var(--paper);border:0;width:38px;height:38px;font-size:23px;flex:none}
.palette{display:flex;gap:5px;margin:6px 0 16px}.palette span{height:15px;flex:1;border:1px solid var(--ink)}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:750;margin:12px 0 3px}label output{font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--ink);height:28px;margin:0;cursor:pointer}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.actions button{min-height:43px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font-size:13px;font-weight:750}.actions button.secondary{background:var(--paper);color:var(--ink)}
.status{font-size:11px;line-height:1.6;border-top:2px solid var(--pink);margin:13px 0 0;padding-top:10px}.status strong{color:var(--ink)}
#notice{position:fixed;z-index:4;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 12px;font-size:12px;display:none;max-width:calc(100vw - 24px);text-align:center}
@media (max-width:480px){#panel{border-width:2px;padding:14px;box-shadow:3px 3px 0 var(--pink)}}
</style>
</head>
<body>
<main id="scene" aria-label="使用正式四色色板中的奶油白与樱粉绘制的缓慢循环粗斜纹背景"><canvas id="pattern"></canvas></main>
<div id="notice" role="status" aria-live="polite"></div>
<button id="settingsButton" aria-label="打开背景设置" aria-controls="panel" aria-expanded="false">⚙</button>
<section id="panel" role="dialog" aria-label="背景设置" aria-modal="false">
 <div class="heading"><div><div class="eyebrow">PIXEL BACKGROUND / D-4</div><h1>双色粗斜纹 · 程序循环</h1></div><button id="close" aria-label="关闭背景设置">×</button></div>
 <div class="palette" aria-label="全游戏正式四色"><span style="background:#393657"></span><span style="background:#F2A5C2"></span><span style="background:#A9BAE9"></span><span style="background:#FFF5E6"></span></div>
 <label for="pixelSize">逻辑像素大小 <output id="pixelSizeValue">4 CSS px</output></label>
 <input id="pixelSize" type="range" min="2" max="8" step="1" value="4">
 <label for="stripeWidth">条纹宽度 <output id="stripeWidthValue">36 格</output></label>
 <input id="stripeWidth" type="range" min="16" max="72" step="2" value="36">
 <label for="gapWidth">条纹间距 <output id="gapWidthValue">44 格</output></label>
 <input id="gapWidth" type="range" min="20" max="80" step="2" value="44">
 <label for="period">平移循环时间 <output id="periodValue">36 秒</output></label>
 <input id="period" type="range" min="18" max="90" step="6" value="36">
 <div class="actions"><button id="toggleMotion">暂停动画</button><button id="reset" class="secondary">恢复默认</button><button id="toggleFullscreen" class="secondary">进入全屏</button><button id="install" class="secondary" hidden>安装到手机</button></div>
 <p class="status"><strong>正式四色：</strong>#393657 / #F2A5C2 / #A9BAE9 / #FFF5E6<br><strong>背景实际输出：</strong>仅 #FFF5E6 + #F2A5C2。<br><strong>特性：</strong>整数像素网格、函数生成、无缝循环、屏幕自适应、联网检查新版。<br><span id="versionInfo">版本 2026.10.30.1</span></p>
</section>
<script>
(()=>{
'use strict';
const PALETTE=Object.freeze({dark:'#393657',pink:'#F2A5C2',blue:'#A9BAE9',cream:'#FFF5E6'});
const RGB_CREAM=[255,245,230],RGB_PINK=[242,165,194];
const BUILD='2026.10.30.1';
const $=s=>document.getElementById(s);
const canvas=$('pattern'),ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:false});
let cfg={pixel:4,stripe:36,gap:44,seconds:36};
let isPaused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let elapsed=0,lastStamp=null,lastPhase=-1,needsPaint=true,w=0,h=0;
const panel=$('panel'),settings=$('settingsButton');
const notice=$('notice');
function remod(n,p){return ((n%p)+p)%p}
function resize(){
 const ww=Math.max(1,document.documentElement.clientWidth), hh=Math.max(1,window.innerHeight);
 const nextW=Math.ceil(ww/cfg.pixel),nextH=Math.ceil(hh/cfg.pixel);
 if(nextW===w&&nextH===h)return;
 w=nextW;h=nextH;canvas.width=w;canvas.height=h;
 canvas.style.width=(w*cfg.pixel)+'px';canvas.style.height=(h*cfg.pixel)+'px';
 ctx.imageSmoothingEnabled=false;needsPaint=true;
}
function render(phase){
 if(!w||!h)return;
 const pixels=ctx.createImageData(w,h),data=pixels.data,p=cfg.stripe+cfg.gap;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const fg=remod(x+y+phase,p)<cfg.stripe;
  const color=fg?RGB_PINK:RGB_CREAM,i=(y*w+x)*4;
  data[i]=color[0];data[i+1]=color[1];data[i+2]=color[2];data[i+3]=255;
 }
 ctx.putImageData(pixels,0,0);lastPhase=phase;needsPaint=false;
}
function animate(stamp){
 if(lastStamp===null)lastStamp=stamp;
 const dt=Math.max(0,Math.min((stamp-lastStamp)/1000,.1));lastStamp=stamp;
 if(!isPaused&&!document.hidden)elapsed=(elapsed+dt)%cfg.seconds;
 const phase=Math.floor(elapsed/cfg.seconds*(cfg.stripe+cfg.gap))%(cfg.stripe+cfg.gap);
 if(needsPaint||phase!==lastPhase)render(phase);
 requestAnimationFrame(animate);
}
function sync(){
 $('pixelSize').value=cfg.pixel;$('pixelSizeValue').textContent=cfg.pixel+' CSS px';
 $('stripeWidth').value=cfg.stripe;$('stripeWidthValue').textContent=cfg.stripe+' 格';
 $('gapWidth').value=cfg.gap;$('gapWidthValue').textContent=cfg.gap+' 格';
 $('period').value=cfg.seconds;$('periodValue').textContent=cfg.seconds+' 秒';
 $('toggleMotion').textContent=isPaused?'继续动画':'暂停动画';
}
function setPanel(open){panel.classList.toggle('open',open);settings.hidden=open;settings.setAttribute('aria-expanded',String(open));if(open)$('close').focus()}
settings.onclick=()=>setPanel(true);$('close').onclick=()=>{setPanel(false);settings.focus()};
$('pixelSize').oninput=e=>{cfg.pixel=+e.target.value;resize();sync()};
$('stripeWidth').oninput=e=>{const phase=elapsed/cfg.seconds;cfg.stripe=+e.target.value;elapsed=phase*cfg.seconds;needsPaint=true;sync()};
$('gapWidth').oninput=e=>{cfg.gap=+e.target.value;needsPaint=true;sync()};
$('period').oninput=e=>{const phase=elapsed/cfg.seconds;cfg.seconds=+e.target.value;elapsed=phase*cfg.seconds;needsPaint=true;sync()};
$('toggleMotion').onclick=()=>{isPaused=!isPaused;sync()};
$('reset').onclick=()=>{cfg={pixel:4,stripe:36,gap:44,seconds:36};elapsed=0;isPaused=false;resize();needsPaint=true;sync()};
$('toggleFullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();$('toggleFullscreen').textContent='进入全屏'}else{await document.documentElement.requestFullscreen();$('toggleFullscreen').textContent='退出全屏'}}catch(e){flash('当前浏览器不允许全屏')}};
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('orientationchange',()=>{lastStamp=null;resize()},{passive:true});
document.addEventListener('visibilitychange',()=>{lastStamp=null;if(!document.hidden)checkForUpdate()});
window.addEventListener('app-resume',checkForUpdate);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))setPanel(false);if(e.code==='Space'&&e.target===document.body){e.preventDefault();isPaused=!isPaused;sync()}});
function flash(message){notice.textContent=message;notice.style.display='block';setTimeout(()=>{notice.style.display='none'},2400)}
async function checkForUpdate(){
 try{const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const remote=await r.json();if(remote.version&&remote.version!==BUILD){
  location.reload();
 }}catch(e){/* Offline: the service worker provides the last known app. */}
}
window.checkForUpdate=checkForUpdate;
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false});
$('install').onclick=async()=>{if(!installPrompt){flash('可使用浏览器菜单中的“添加到主屏幕”');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').hidden=true};
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
sync();resize();requestAnimationFrame(animate);checkForUpdate();setInterval(()=>{if(!document.hidden)checkForUpdate()},5*60*1000);
})();
</script>
</body>
</html>
