<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>老虎机吐币 · 白模真实碰撞实验</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#101317;color:#f4f5f5}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center}
  .page{width:min(100%,1320px);padding:clamp(10px,2vw,26px);display:flex;flex-direction:column;gap:12px}
  .top{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(18px,2.3vw,27px);margin:0 0 4px;font-weight:700;letter-spacing:.05em}
  .lead{margin:0;color:#9ea6ae;font-size:clamp(11px,1.3vw,14px)}
  a{color:#dfe3e6;text-underline-offset:3px}
  nav{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:6px 0}
  .stage{width:100%;position:relative;border:1px solid #41464b;border-radius:12px;overflow:hidden;background:#171b20;touch-action:manipulation}
  canvas{display:block;width:100%;height:auto;aspect-ratio:5/3;background:#171b20}
  .corner{position:absolute;top:10px;left:12px;color:#adb5bc;font:600 clamp(9px,1.2vw,12px) ui-monospace,monospace;pointer-events:none;letter-spacing:.08em}
  .detail-wrap{display:none}
  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  button{border:1px solid #7c8289;color:#f2f3f4;background:#343b42;min-height:44px;padding:10px 16px;border-radius:7px;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{background:#4b525b}
  button:focus-visible{outline:3px solid white;outline-offset:3px}
  #start{background:#eceff0;border-color:#eceff0;color:#191d21}
  #start:hover{background:#c5cbcf}
  .data{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;font:12px ui-monospace,Consolas,monospace;color:#b6bec5}
  .metric{background:#1e2429;border:1px solid #30373d;border-radius:6px;padding:9px}
  .metric b{color:white;display:block;font:700 19px ui-monospace,Consolas,monospace;margin-top:5px}
  .bottom{font-size:11px;line-height:1.6;color:#87929a}
  @media(max-width:620px){
    .page{padding:10px;gap:11px;align-self:flex-start}
    .stage{margin-top:6px}
    .corner{display:none}
    .detail-wrap{display:block;border:1px solid #41464b;border-radius:10px;overflow:hidden;background:#171b20}
    .detail-wrap canvas{aspect-ratio:580/310}
    .detail-label{padding:6px 10px;color:#b3bcc3;font:11px ui-monospace,monospace;background:#252b30}
    .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    button{padding:9px 6px;font-size:12px}
    .data{grid-template-columns:repeat(3,minmax(0,1fr));font-size:10px;gap:5px}
    .metric{padding:7px}.metric b{font-size:15px}
    .bottom{font-size:10px}
  }
</style>
</head>
<body>
<main class="page">
 <div class="top">
  <div><h1>金币喷发 · 纯白模物理版</h1><p class="lead">先验证出币力度、相互碰撞、反弹、托盘堆叠；无贴图、无金属材质、无光影。</p></div>
  <nav><a href="./coin-fx-lab.html">返回旧版金色特效</a><a href="./snowbound-journey.html">雪境游戏</a></nav>
 </div>
 <div class="stage">
  <canvas id="game" width="1000" height="600" aria-label="机械老虎机喷出薄片白模金币，在盘里真实碰撞反弹堆积"></canvas>
  <span class="corner">PHYSICS WHITEBOX / 120 Hz / NO MATERIAL</span>
 </div>
 <div class="detail-wrap" aria-label="手机金币碰撞和堆叠放大视图"><div class="detail-label">金币碰撞与堆叠局部放大 / SAME PHYSICS</div><canvas id="detail" width="580" height="310" aria-label="接币盘堆叠细节放大"></canvas></div>
 <div class="controls">
  <button id="start" type="button">旋转中奖 · 48 枚</button>
  <button id="few" type="button">12 枚小额喷发</button>
  <button id="many" type="button">76 枚大额喷发</button>
  <button id="replay" type="button">重播当前数量</button>
  <button id="pause" type="button">暂停</button>
  <button id="step" type="button">前进一步 1/120s</button>
  <button id="slow" type="button">速度 1×</button>
 </div>
 <div class="data" aria-live="off">
  <div class="metric">已吐出 <b id="emitted">0 / 48</b></div>
  <div class="metric">金币互撞 <b id="coin-collisions">0</b></div>
  <div class="metric">底盘/边缘碰撞 <b id="wall-collisions">0</b></div>
  <div class="metric">停止运动 <b id="sleeping">0</b></div>
  <div class="metric">相对时间 <b id="elapsed">0.00 s</b></div>
 </div>
 <div class="bottom">原创物理白模：固定 120 Hz，确定性随机喷发、薄片视觉、2D 圆形接触代理刚体、七轮位置修正与冲量、相互摩擦、阻尼和静止判定。此页用于动画节奏验收；不声称已取得《Slots & Daggers》原始逐帧文件或复刻其内部 3D 物理。</div>
</main>
<script src="./motion/slot-whitebox-physics.js?v=20261118-wb1"></script>
<script>
(()=>{'use strict';
 const {Payout,WORLD,STEP}=window.PaperchalkSlotWhitebox;
 const $=id=>document.getElementById(id);
 const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false});
 const detail=$('detail'),detailCtx=detail.getContext('2d',{alpha:false});
 if(!ctx)throw new Error('2D canvas is required for the whitebox');
 let sim=new Payout({count:48,seed:20261118});
 let mode='idle', spinTime=0,seed=20261118, requested=48;
 let paused=false,speed=1,last=0,accum=0,raf=0;
 function setText(id,s){if($(id).textContent!==String(s))$(id).textContent=String(s);}
 function showStats(){
   setText('emitted',`${sim.emitted} / ${sim.requested}`);
   setText('coin-collisions',sim.coinImpacts);
   setText('wall-collisions',sim.wallImpacts);
   setText('sleeping',sim.coins.filter(c=>c.sleeping).length);
   setText('elapsed',`${sim.time.toFixed(2)} s`);
   setText('pause',paused?'继续':'暂停');
   setText('slow',`速度 ${speed===1?'1×':'0.35×'}`);
 }
 const line=(a,b,c,d,width=2,color='#d5d9dc')=>{
   ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();
 };
 function machine(){
   const running=mode==='spin';
   ctx.fillStyle='#15191e';ctx.fillRect(0,0,1000,600);
   // A clean non-material mechanical outline. No gradients or specular passes.
   ctx.strokeStyle='#383f45';ctx.lineWidth=1;
   for(let y=95;y<535;y+=74)line(40,y,960,y,1,'#252b30');
   // Rigid machine silhouette; the coin outlet is attached at x=405/y=332.
   ctx.fillStyle='#aeb4b8';ctx.fillRect(468,112,388,344);
   ctx.fillStyle='#e8eaeb';ctx.fillRect(481,123,362,23);
   ctx.fillStyle='#7f878d';ctx.fillRect(468,112,22,344);
   ctx.fillStyle='#9ba2a7';ctx.fillRect(470,442,383,25);
   ctx.fillStyle='#20272c';ctx.fillRect(521,177,283,150);
   ctx.fillStyle='#474f55';ctx.fillRect(541,195,244,116);
   const sec=running?spinTime:sim.time;
   for(let j=0;j<3;j++){
     const x=547+j*80;
     ctx.fillStyle='#dddfe1';ctx.fillRect(x,204,70,98);
     ctx.fillStyle='#30363b';ctx.fillRect(x+4,208,62,90);
     ctx.fillStyle='#cdd1d4';
     if(running){
       const yy=212+((sec*820+j*43)%66);
       ctx.fillRect(x+13,yy,43,7);
       ctx.fillRect(x+13,212+(yy-212+28)%72,43,6);
     }else{
       ctx.beginPath();ctx.arc(x+35,252,22,0,Math.PI*2);ctx.fill();
       ctx.fillStyle='#434a50';ctx.beginPath();ctx.arc(x+35,252,15,0,Math.PI*2);ctx.fill();
     }
   }
   ctx.fillStyle='#ededee';ctx.font='bold 31px ui-monospace,monospace';
   ctx.textAlign='center';ctx.fillText('SLOT',663,168);
   ctx.fillStyle='#373c41';ctx.fillRect(542,355,243,55);
   ctx.fillStyle='#e0e3e5';ctx.font='bold 30px ui-monospace,monospace';
   ctx.fillText(mode==='spin'?'SPIN':mode==='idle'?'READY':'WIN',664,394);
   // Mechanical mouth, open left. Coin particles emerge from this exact outlet.
   ctx.fillStyle='#8b9297';ctx.fillRect(388,303,93,70);
   ctx.fillStyle='#d6dadc';ctx.fillRect(390,303,88,11);
   ctx.fillStyle='#555d62';ctx.fillRect(394,317,71,38);
   ctx.fillStyle='#141a1e';ctx.fillRect(386,320,31,27);
   ctx.fillStyle='#d8dadc';ctx.fillRect(387,310,78,9);
   // U-shaped solid catch tray; bounds agree with physics WORLD.
   ctx.fillStyle='#b6bcc0';ctx.fillRect(WORLD.left-11,WORLD.floor, WORLD.right-WORLD.left+22,15);
   ctx.fillStyle='#e4e6e7';ctx.fillRect(WORLD.left-14,WORLD.floor+14,WORLD.right-WORLD.left+28,10);
   ctx.fillStyle='#92999e';ctx.fillRect(WORLD.left-12,WORLD.floor-74,12,100);
   ctx.fillRect(WORLD.right,WORLD.floor-74,12,100);
   ctx.fillStyle='#d8dcde';ctx.fillRect(WORLD.left-18,WORLD.floor-76,18,9);
   ctx.fillRect(WORLD.right,WORLD.floor-76,18,9);
   // Two minimal fixed feet; no wood, lighting, color or unnecessary decoration.
   ctx.fillStyle='#666d73';ctx.fillRect(550,467,30,68);ctx.fillRect(758,467,30,68);
   ctx.fillStyle='#a7aeb3';ctx.fillRect(531,525,76,11);ctx.fillRect(740,525,76,11);
 }
 function drawCoin(c){
   const facing=Math.cos(c.flip);
   const squeeze=Math.max(.10,Math.abs(facing));
   ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
   // Every coin stays a PAPER-THIN white disc/card silhouette. No metal shader.
   ctx.scale(squeeze,1);
   ctx.fillStyle='#f6f7f8';ctx.strokeStyle='#899198';ctx.lineWidth=2/Math.max(squeeze,.32);
   ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.strokeStyle='#b0b6bb';ctx.lineWidth=1.4/Math.max(squeeze,.32);
   ctx.beginPath();ctx.arc(0,0,c.r*.73,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='#d5dade';ctx.fillRect(-c.r*.30,-1,c.r*.6,2);
   ctx.restore();
 }
 function draw(){
   machine();
   // Render by y then by id to give predictable overlapping order.
   const sorted=sim.coins.slice().sort((a,b)=>a.y-b.y||a.id-b.id);
   for(const c of sorted)drawCoin(c);
   ctx.fillStyle='#cbd0d4';ctx.font='bold 13px ui-monospace,monospace';ctx.textAlign='left';
   if(window.innerWidth>620)ctx.fillText('THIN COIN / RIGID CONTACT / NO SHADING',40,47);
   ctx.fillStyle='#8a949c';if(window.innerWidth>620)ctx.fillText('TIME '+sim.time.toFixed(2)+'s     '+sim.emitted+'/'+sim.requested+' COINS',40,69);
   if(paused){ctx.fillStyle='#ebeff1';ctx.textAlign='right';ctx.fillText('PAUSED / FRAME STEP',960,47);}
   // Mobile uses a SECOND view of the SAME physical state, not fake particles.
   if(window.innerWidth<=620 && detailCtx){detailCtx.drawImage(canvas,85,250,540,290,0,0,580,310);}
   showStats();
 }
 function spin(count){
   requested=count;seed=(seed+1)>>>0;
   sim=new Payout({count,seed});mode='spin';spinTime=0;accum=0;
   paused=false;last=performance.now();draw();
 }
 function replay(){
   sim=new Payout({count:requested,seed});mode='spin';spinTime=0;accum=0;
   paused=false;last=performance.now();draw();
 }
 function stepTime(dt){
   if(mode==='spin'){
     spinTime+=dt;
     if(spinTime>=.86){mode='payout';sim.launch(requested,seed);}
   }else if(mode==='payout'){sim.step();}
 }
 function update(t){
   if(!last)last=t;
   const dt=Math.min(.055,Math.max(0,(t-last)/1000))*speed;last=t;
   if(!paused){
     accum+=dt;let n=0;
     while(accum>=STEP&&n++<9){stepTime(STEP);accum-=STEP;}
   }
   draw();raf=requestAnimationFrame(update);
 }
 $('start').addEventListener('click',()=>spin(48));
 $('few').addEventListener('click',()=>spin(12));
 $('many').addEventListener('click',()=>spin(76));
 $('replay').addEventListener('click',replay);
 $('pause').addEventListener('click',()=>{paused=!paused;draw()});
 $('slow').addEventListener('click',()=>{speed=speed===1?.35:1;draw()});
 $('step').addEventListener('click',()=>{
   paused=true;stepTime(STEP);draw();
 });
 window.PaperchalkWhiteboxQA=Object.freeze({
   start(count=48,withSpin=true){requested=count;seed=20261118;sim=new Payout({count,seed});
     spinTime=0;mode=withSpin?'spin':'payout';if(!withSpin)sim.launch(count,seed);
     paused=true;accum=0;draw();return sim.snapshot();},
   seek(ms){sim.seek(ms);mode='payout';spinTime=0;paused=true;accum=0;draw();return sim.snapshot();},
   next(){paused=true;stepTime(STEP);draw();return sim.snapshot();},
   get state(){return sim.snapshot()},get paused(){return paused},get mode(){return mode},
   get world(){return WORLD}
 });
 draw();raf=requestAnimationFrame(update);
})();
</script>
</body>
</html>
