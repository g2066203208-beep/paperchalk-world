const $=id=>document.getElementById(id),g=$('world').getContext('2d');
const roles=['先锋','盾卫','斥候','医师','游侠','剑士','弓手'];
const strength=[3,2,2,1,3,3,2], gates=[48,108], end=150;
let state='walk',dist=0,minutes=17*60+32,gate=0,round=1,chosen=-1,orders=2,used=new Set(),hp=[],enemies=[],fireReady=false,barrier=false,turnLock=false,last=0,t=0,W,H,dpr;
function resize(){W=innerWidth;H=$('world').clientHeight;dpr=Math.min(devicePixelRatio||1,1.5);$('world').width=W*dpr;$('world').height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function note(msg){$('hint').textContent=msg}
function drawCard(index,enemy=false){
 const life=enemy?enemies[index]:hp[index],b=document.createElement('button');
 if(enemy&&!life){b.className='empty';b.disabled=true;b.setAttribute('aria-label','空席');return b}
 const name=enemy?life.name:roles[index],left=enemy?life.hp:life;
 b.className='card'+(left<=0?' dead':'')+(!enemy&&used.has(index)?' used':'')+(!enemy&&chosen===index?' sel':'');
 b.innerHTML='<img alt="" src="'+portraits[enemy?life.art:index]+'"><small>♥ '+left+'</small><b>'+name+'</b>';
 b.setAttribute('aria-label',name+'，生命 '+left);
 b.onclick=()=>enemy?attack(index):choose(index);b.disabled=state!=='fight'||turnLock||left<=0||(!enemy&&used.has(index));return b
}
function board(){const a=$('allies');a.replaceChildren(...hp.map((_,i)=>drawCard(i)));a.classList.toggle('camp',state==='camp');
 if(state==='camp')Array.from(a.children).forEach((b,i)=>{let ang=i*2*Math.PI/7-Math.PI/2;b.style.setProperty('--cx',50+Math.cos(ang)*28+'%');b.style.setProperty('--cy',57+Math.sin(ang)*16+'%')});
 const e=$('rivals');e.hidden=state!=='fight';if(!e.hidden)e.replaceChildren(...Array.from({length:7},(_,i)=>drawCard(i,true)));
 $('public').classList.toggle('hot',fireReady||state==='camp');$('public').textContent=state==='camp'?'篝火':barrier?'路障':fireReady?'落牌':'公共位';
 $('act').textContent=state==='walk'?(fireReady?'收回篝火牌':'篝火牌'):state==='camp'?'收营出发':state==='fight'?'结束指挥':state==='end'?'再次上路':'重新集结';
 $('public').disabled=!(state==='walk'&&fireReady||state==='fight'&&!barrier&&!turnLock);
}
function start(){state='walk';dist=0;gate=0;minutes=1052;hp=roles.map(()=>7);used.clear();chosen=-1;barrier=false;turnLock=false;fireReady=false;note('沿山道自动前进');board()}
function encounter(){state='fight';round=1;orders=2;chosen=-1;used.clear();barrier=false;fireReady=false;enemies=Array(7).fill(null);[1,3,5].forEach((i,j)=>enemies[i]={hp:gate?5:4,art:7+j,name:['截路者','巡山客','伏弓手'][j]});note('伏兵拦路 · 选队友，再点敌人');board()}
function choose(i){if(state!=='fight'||used.has(i)||turnLock||hp[i]<=0)return;chosen=i;note(roles[i]+'就位 · 点选目标');board()}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function attack(i){if(state!=='fight'||turnLock||!enemies[i]||enemies[i].hp<=0)return;if(chosen<0){note('先点下排一名队友');return}turnLock=true;let who=chosen;used.add(who);enemies[i].hp=Math.max(0,enemies[i].hp-strength[who]);if(who===3){let j=hp.indexOf(Math.min(...hp.filter(n=>n>0)));hp[j]=Math.min(7,hp[j]+3)}orders--;chosen=-1;board();$('rivals').children[i].classList.add('hit');await delay(340);turnLock=false;
 if(enemies.every(e=>!e||!e.hp)){gate++;state='walk';barrier=false;used.clear();note('山道已清 · 队伍继续前进');board()}else if(!orders)await enemyTurn();else{note('还可指挥一次');board()}}
async function enemyTurn(){if(turnLock||state!=='fight')return;turnLock=true;for(const [i,e] of enemies.entries()){if(!e||!e.hp)continue;const live=hp.map((n,j)=>n>0?j:-1).filter(j=>j>=0);if(!live.length)break;const j=live[(i+round)%live.length];hp[j]=Math.max(0,hp[j]-(barrier?0:1));board();$('allies').children[j].classList.add('hit');await delay(190)}
 turnLock=false;barrier=false;round++;orders=2;used.clear();chosen=-1;if(!hp.some(Boolean)){state='lost';note('队伍撤退')}else note('第 '+round+' 回合 · 选择队友');board()}
$('act').onclick=()=>{if(state==='fight')return enemyTurn();if(state==='camp'){state='walk';minutes=6*60+10;hp=hp.map(n=>Math.min(7,n+2));note('天亮了 · 队伍继续沿瀑布前进')}else if(state==='walk'){fireReady=!fireReady;note(fireReady?'点中央公共位扎营':'沿山道自动前进')}else return start();board()};
