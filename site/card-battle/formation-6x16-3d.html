#note{position:fixed;inset:auto 0 10px;text-align:center;font:11px system-ui,sans-serif;color:#777;opacity:0;pointer-events:none}

.hand-card.active{outline:2px solid #3c985a;outline-offset:2px}.hand-card img{width:100%;height:100%;object-fit:cover;display:block}
.hand-card .name{display:block;font:clamp(11px,1.1vw,17px) serif;color:#514e43}
.hand-card .kind{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:10px system-ui;color:#777466}
#reset,#demo{background:#eae9e3cf;border:1px solid #b3afa6;border-radius:7px;padding:6px 9px;cursor:pointer;margin-bottom:3px;font:11px system-ui!important}
.hand-card.terrain{background:linear-gradient(155deg,#e5d6b4,#baa17b);border-color:#ede4cf;box-shadow:0 4px 0 #967b59,0 10px 18px #0002}
.hand-card.terrain .name{font-weight:700;color:#493926}
.hand-card.terrain .kind{color:#61513f}

function worldFromPointer(clientX,clientY,planeY=.1){let box=canvas.getBoundingClientRect(),nx=(clientX-box.left)/box.width*2-1,ny=1-(clientY-box.top)/box.height*2;
let x=nx*camera.orthoHeight*camera.aspect/2,y=ny*camera.orthoHeight/2;
let origin=[camera.eye[0]+camera.right[0]*x+camera.up[0]*y,camera.eye[1]+camera.right[1]*x+camera.up[1]*y,camera.eye[2]+camera.right[2]*x+camera.up[2]*y];
let t=(planeY-origin[1])/camera.forward[1];return {x:origin[0]+camera.forward[0]*t,z:origin[2]+camera.forward[2]*t};}
let hoverCard=null,pointerDown=null,dragCard=null,overSlot=null,now=0;
let active=null,preview=null,handDown=null,onBoard=false,serial=0,noticeTimer=0;
const hand=document.getElementById('hand'),note=document.getElementById('note');
const buttons=new Map();
function message(t){note.textContent=t;note.style.opacity='1';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>note.style.opacity='0',1400);}
function makeCard(def,s=null){
 const n=++serial;
 const restingY=s?terrain.cell(s.tileC,s.tileR).height+.25:.13;
 return{id:'c'+n,def,side:'ally',kind:def.kind,slot:s,homeX:s?.x||0,homeZ:s?.z||0,
 x:s?.x||0,z:s?.z||0,seed:n*1.317,t:0,y:restingY,hover:0,flip:0,flipTarget:0,attackStart:-10000,placeStart:-10000,dragged:false,texture:texCache.get(def.id)||null};
}
function facilityTexture(name){
 // Temporary neutral test face; real facility art is supplied separately by Anima.
 const cv=document.createElement('canvas');cv.width=512;cv.height=768;const ctx=cv.getContext('2d');
 ctx.fillStyle='#e6e0d2';ctx.fillRect(0,0,512,768);ctx.strokeStyle='#b4ac99';ctx.lineWidth=8;ctx.strokeRect(22,22,468,724);
 ctx.fillStyle='#514d42';ctx.textAlign='center';ctx.font='bold 82px serif';ctx.fillText(name,256,410);
 ctx.font='34px serif';ctx.fillText('设施',256,700);
 const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return tex;
}
function sync(){for(const d of handDefs){let b=buttons.get(d.id);
 b.hidden=d.kind!=='terrain'&&cards.some(c=>c.def.id===d.id);b.classList.toggle('active',active?.id===d.id);
 b.setAttribute('aria-pressed',active?.id===d.id?'true':'false');}}
function clearPick(){active=null;preview=null;overSlot=null;onBoard=false;sync();}
function pick(d){
 if(d.kind!=='terrain'&&cards.some(c=>c.def.id===d.id))return;
 active=d;preview=d.kind==='terrain'?null:makeCard(d);hoverCard=null;sync();
}
for(const d of handDefs){
 const b=document.createElement('button');b.type='button';b.className='hand-card'+(d.kind==='terrain'?' terrain':'');
 b.dataset.cardId=d.id;b.title=d.name;b.setAttribute('aria-label',d.name);
 b.innerHTML=d.src?'<img src="'+d.src+'" draggable="false" alt="'+d.name+'">':
 '<span class="name">'+d.name+'</span><span class="kind">'+(d.kind==='terrain'?(d.direction<0?'地形 -1':'地形 +1'):'设施')+'</span>';
 hand.insertBefore(b,document.getElementById('reset'));buttons.set(d.id,b);
 b.addEventListener('pointerdown',e=>{if(b.hidden)return;e.preventDefault();handDown={id:d.id,x:e.clientX,y:e.clientY,moved:false};pick(d);});
 b.addEventListener('click',e=>{if(e.detail===0)pick(d);});
 if(d.src)loadTexture(d.src,tex=>{texCache.set(d.id,tex);for(const c of cards)if(c.def.id===d.id)c.texture=tex;if(preview?.def.id===d.id)preview.texture=tex;});
 else if(d.kind==='facility')texCache.set(d.id,facilityTexture(d.name));
}
function inCanvas(e){let b=canvas.getBoundingClientRect();return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom;}
function slotAt(x,z){
 let best=null,dd=Infinity;for(const s of slotCenters){let dx=Math.abs(x-s.x),dz=Math.abs(z-s.z);
 if(dx>slotW/2||dz>slotH/2)continue;let d=dx*dx+dz*dz;if(d<dd){best=s;dd=d;}}return best;
}
function valid(d,s,move=null){
 if(!d||!s)return false;
 if(d.kind==='terrain'){
  if(!terrain.canAdjust(s.tileC,s.tileR,d.direction))return false;
  // Avoid leaving played cards suspended or embedded in a modified earth block.
  return !cards.some(c=>c.slot&&c.slot.tileC===s.tileC&&c.slot.tileR===s.tileR);
 }
 if(s.side!=='ally'||s.zone!==d.kind)return false;
 if(occupied.has(s.id)&&occupied.get(s.id)!==move)return false;
 if(d.kind==='unit'&&cards.filter(c=>c.kind==='unit'&&c!==move).length>=7)return false;
 return true;
}
function drop(s){
 if(!active)return;
 if(!valid(active,s)){message('红色区域不可操作（已到三层极限或已有卡牌）');return;}
 if(active.kind==='terrain'){
  const tile=terrain.adjust(s.tileC,s.tileR,active.direction);
  message((active.direction<0?'挖掘':'堆土')+'成功 · 高度 '+(tile.level>0?'+':'')+tile.level+' / -3～+3');
  overSlot=s;return; // Reusable terrain action cards: keep selected for repeated excavation/building.
 }
 const c=makeCard(active,s);c.x=preview.x;c.z=preview.z;c.y=terrain.cell(s.tileC,s.tileR).height+.7;c.placeStart=now;
 occupied.set(s.id,c);cards.push(c);clearPick();
}
function move(c,s){
 if(!valid(c.def,s,c)){message('此处无法放置');return;}
 occupied.delete(c.slot.id);c.slot=s;c.homeX=s.x;c.homeZ=s.z;occupied.set(s.id,c);c.placeStart=now;
}
function reset(){cards.length=0;occupied.clear();dragCard=null;pointerDown=null;handDown=null;hoverCard=null;terrain.reset('grass');clearPick();}
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('demo').addEventListener('click',()=>{
 // Role-aware 3-3-1 formation: 3 frontline, 3 middle, ringmaster protected at rear center.
 cards.length=0;occupied.clear();dragCard=null;pointerDown=null;handDown=null;hoverCard=null;clearPick();
 const lineup=[
 {id:'strong',r:0,c:0},{id:'tamer',r:0,c:1},{id:'escape',r:0,c:2},
 {id:'acrobat',r:1,c:0},{id:'clown',r:1,c:1},{id:'knife',r:1,c:2},
 {id:'ringmaster',r:2,c:1}
 ];
 lineup.forEach(({id,r,c},i)=>{
  const def=handDefs.find(d=>d.id===id);
  const slot=slotCenters.find(s=>s.side==='ally'&&s.zone==='unit'&&s.r===r&&s.c===c);
  if(!slot||!def)return;
  const card=makeCard(def,slot);
  card.placeStart=now-i*.055-.25;occupied.set(slot.id,card);cards.push(card);
 });
 sync();message('已摆好前3、中3、后排团长的阵型，可拖动调整');
});
function closestCard(clientX,clientY){
 const cr=canvas.getBoundingClientRect(),px=(clientX-cr.left)*w/cr.width,py=(clientY-cr.top)*h/cr.height;
 let best=null,score=1e9;for(const c of cards){
 const q=projection2D(c.x,c.y,c.z);const l=projection2D(c.x-cardW/2,c.y,c.z);
 const t=projection2D(c.x,c.y,c.z-cardH/2),b=projection2D(c.x,c.y,c.z+cardH/2);
 const hw=Math.abs(q.x-l.x)+8,hh=Math.abs(b.y-t.y)/2+10;
 if(Math.abs(q.x-px)<hw&&Math.abs(q.y-py)<hh){let d=Math.abs(q.x-px)/hw+Math.abs(q.y-py)/hh;if(d<score){score=d;best=c;}}}return best;
}
function tileAtPointer(clientX,clientY){
 // Orthographic ray height search: choose the first elevated terrain top hit.
 // This stays aligned when a player digs to -3 or stacks a mountain to +3.
 for(let level=terrain.maxLevel;level>=terrain.minLevel;level--){
  const p=worldFromPointer(clientX,clientY,terrain.topY+level*terrain.levelStep);
  const t=terrain.atWorld(p.x,p.z);
  if(t&&t.level===level)return terrainTarget(t.c,t.r);
 }
 const flat=worldFromPointer(clientX,clientY,terrain.topY);
 const t=terrain.atWorld(flat.x,flat.z);
 return t?terrainTarget(t.c,t.r):null;
}
function track(e){
 onBoard=inCanvas(e);if(!onBoard){overSlot=null;return;}
 if(active?.kind==='terrain'){overSlot=tileAtPointer(e.clientX,e.clientY);return;}
 const plane=dragCard?.slot?terrain.cell(dragCard.slot.tileC,dragCard.slot.tileR).height+.25:.18;
 const p=worldFromPointer(e.clientX,e.clientY,plane);
 overSlot=slotAt(p.x,p.z);
 if(dragCard){dragCard.x=p.x;dragCard.z=p.z;}
 else if(active&&preview){preview.x=p.x;preview.z=p.z;}
 else hoverCard=closestCard(e.clientX,e.clientY);
}
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;track(e);
 if(active){pointerDown={placement:true,x:e.clientX,y:e.clientY};return;}
 const c=closestCard(e.clientX,e.clientY);pointerDown={card:c,x:e.clientX,y:e.clientY};
 if(c){canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';}
});
window.addEventListener('pointermove',e=>{
 if(handDown&&Math.hypot(e.clientX-handDown.x,e.clientY-handDown.y)>7)handDown.moved=true;
 if(pointerDown?.card&&!dragCard&&Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>7){
 dragCard=pointerDown.card;dragCard.dragged=true;}
 track(e);canvas.style.cursor=dragCard?'grabbing':active?'crosshair':hoverCard?'grab':'default';
});
window.addEventListener('pointerup',e=>{
 track(e);
 if(handDown){if(handDown.moved&&onBoard&&active?.id===handDown.id)drop(overSlot);handDown=null;return;}
 if(pointerDown?.placement&&active&&onBoard)drop(overSlot);
 else if(dragCard){move(dragCard,overSlot);dragCard.dragged=false;dragCard=null;}
 else if(pointerDown?.card)pointerDown.card.attackStart=now;
 pointerDown=null;canvas.style.cursor=active?'crosshair':'default';
});
window.addEventListener('pointercancel',()=>{if(dragCard){dragCard.dragged=false;dragCard=null;}pointerDown=null;handDown=null;});
canvas.addEventListener('dblclick',e=>{if(active)return;let c=closestCard(e.clientX,e.clientY);if(c){c.flipTarget+=Math.PI;c.attackStart=now;}});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(active)return;let c=closestCard(e.clientX,e.clientY);if(c)c.flipTarget+=Math.PI;});
window.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();cards.forEach((c,i)=>{c.attackStart=now+(i%7)*.07;});}
 if(e.code==='Escape')clearPick();if(e.code==='KeyR'&&!e.repeat)reset();
});
function drawHighlights(){
 const d=dragCard?.def||active;if(!d)return;
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
 const targets=d.kind==='terrain'?terrainTargets:slotCenters;
 for(const s of targets){
  const near=s===overSlot&&onBoard,good=valid(d,s,dragCard);
  const relevant=d.kind==='terrain'||(s.side==='ally'&&s.zone===d.kind);
  if(!relevant&&!near)continue;
  const fill=good?[.19,.72,.31,near?.36:(d.kind==='terrain'?.11:.18)]:[.90,.20,.23,near?.35:.045];
  const edge=good?[.08,.61,.25,near?.85:.24]:[.85,.18,.19,near?.82:.11];
  const y=terrain.cell(s.tileC,s.tileR).height+.014;
  const sz=d.kind==='terrain'?S(terrain.tileW/slotW*.98,terrain.tileD/slotH*.98,1):I();
  renderGeom(slotFill,mul(mul(T(s.x,y,s.z),RX(-Math.PI/2)),sz),fill,null,true);
  renderGeom(RRstrip,mul(mul(T(s.x,y+.008,s.z),RX(-Math.PI/2)),sz),edge,null,true);
 }
 gl.depthMask(true);gl.disable(gl.BLEND);
}
function drawShadows(now){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
for(const c of cards){for(let i=0;i<1;i++){let scale=1+.04*i;
let m=mul(T(c.x+.10+i*.025,terrain.cell(c.slot.tileC,c.slot.tileR).height+.185+i*.001,c.z+.12+i*.022),RX(-Math.PI/2));m=mul(m,S(scale,scale,1));renderGeom(plate,m,i===0?colors.shadow:colors.shadow2,null,true);}}
gl.depthMask(true);gl.disable(gl.BLEND);}
function drawStage(){terrainRenderer.draw();}
function frame(timeMs){
 now=timeMs/1000;resize();gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
 gl.clearColor(...colors.background);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 drawStage();drawHighlights();
 for(const c of cards){
  c.hover=lerp(c.hover,(c===hoverCard||c.dragged)?1:0,.17);
  if(!c.dragged){c.x=lerp(c.x,c.homeX,.16);c.z=lerp(c.z,c.homeZ,.16);}
  const levelY=c.slot?terrain.cell(c.slot.tileC,c.slot.tileR).height+.25:.13;
  c.y=lerp(c.y,levelY+Math.sin(now*1.15+c.seed)*.017+(c.hover*.23)+(c.dragged?.36:0),.2);
  c.flip=lerp(c.flip,c.flipTarget,.11);
 }
 drawShadows(now);
 for(const c of [...cards].sort((a,b)=>a.z-b.z))drawCard(c,now);
 if(active&&preview&&onBoard&&!dragCard){preview.hover=1;preview.y=(overSlot?terrain.cell(overSlot.tileC,overSlot.tileR).height:.0)+.85+Math.sin(now*2)*.025;drawCard(preview,now);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
