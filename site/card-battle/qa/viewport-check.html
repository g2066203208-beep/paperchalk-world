<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渡魂牌局 · 视口回归</title><style>*{box-sizing:border-box}body{margin:0;background:#101613;color:#efdab2;font:16px system-ui}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px}button{padding:8px;cursor:pointer}#stage{position:relative}iframe{border:0;transform-origin:top left;position:absolute}output{display:block;padding:6px}</style>
<nav><button data-size="390,844">手机竖屏</button><button data-size="844,390">手机横屏</button><button data-size="1440,900">PC</button><button data-size="320,568">小屏</button></nav><div id="stage"></div><output aria-live="polite"></output>
<script>
const host=document.querySelector('#stage'), out=document.querySelector('output');
let frame, width,height;
function fit(){if(!frame)return;const scale=Math.min(1,innerWidth/width,Math.max(180,innerHeight-110)/height);frame.style.transform='scale('+scale+')';host.style.height=height*scale+'px';frame.style.left=(innerWidth-width*scale)/2+'px'}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(condition){for(let i=0;i<1000;i++){if(condition())return;await wait(50)}throw Error('等待动画结束超时')}
function checkLayout(d){const body=d.documentElement;if(body.scrollWidth>width||body.scrollHeight>height+1)throw Error('页面溢出 '+body.scrollWidth+'×'+body.scrollHeight);
for(const node of d.querySelectorAll('.pile,.slot,.card,#actions button,#help')){const b=node.getBoundingClientRect();if(b.left<0||b.right>width+1||b.top<0||b.bottom>height+1)throw Error('控件越界 '+node.textContent)}}
async function verify(f){try{const d=f.contentDocument;checkLayout(d);
const ready=()=>!d.querySelector('.field').inert;const find=t=>Array.from(d.querySelectorAll('button')).find(b=>b.textContent===t&&!b.disabled);
find('换位').click();await until(()=>ready()&&!find('换位')&&(find('停牌')||find('下一局')));if(find('下一局'))find('下一局').click();
find('抽牌').click();find('灰烬').click();await until(()=>ready()&&d.querySelector('#player em')&&Array.from(d.querySelectorAll('#player em')).some(n=>n.textContent.includes('灰烬'))&&(find('下一局')||find('停牌')));
if(find('停牌'))find('停牌').click();await until(()=>ready()&&find('下一局'));checkLayout(d);
if(f===frame)out.textContent=width+' × '+height+' · 换位、抽牌、灰烬、结算及边界检查通过';}
catch(e){if(f===frame)out.textContent='检查失败 · '+e.message}}
function openSize(dim){[width,height]=dim.split(',').map(Number);const f=document.createElement('iframe');f.title='真实游戏视口';frame=f;f.width=width;f.height=height;f.onload=()=>verify(f);f.src='../soul-table.html';host.replaceChildren(f);out.textContent='检查中…';fit()}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>openSize(b.dataset.size));window.addEventListener('resize',fit);if(new URLSearchParams(location.search).has('film')){
  document.querySelector('nav').hidden=true;
  width=844;height=390;
  const f=document.createElement('iframe');frame=f;f.width=width;f.height=height;f.title='动画逐帧';f.src='../soul-table.html';
  f.onload=async()=>{
    const d=f.contentDocument;
    d.querySelector('#player .pile').click();
    Array.from(d.querySelectorAll('#player button')).find(b=>b.textContent==='灰烬').click();
    await until(()=>d.querySelector('.slash') && d.getAnimations().some(a=>a.effect.target.matches('.slash')));
    const anim=d.getAnimations().filter(a=>a.effect.target.matches('.faces,.embers,.slash'));
    anim.forEach(a=>{a.pause();a.currentTime=0});
    let n=0;
    const next=document.createElement('button');next.textContent='下一帧';
    next.onclick=()=>{n=Math.min(28,n+1);anim.forEach(a=>a.currentTime=Math.min(n*1001/30,a.effect.getTiming().duration-.01));label.textContent='灰烬 · 第 '+n+' 帧'};
    const label=document.createElement('span');label.textContent='灰烬 · 第 0 帧';out.replaceChildren(next,label)
  };host.replaceChildren(f);fit()
}else openSize('390,844');
</script></html>
