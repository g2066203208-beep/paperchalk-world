<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 硬膝盖测试</title><style>body{background:#f7f6f6;font:16px system-ui;color:#333;margin:0}main{max-width:850px;margin:auto;padding:16px}canvas{width:100%;max-width:760px;display:block;margin:auto;touch-action:none}input[type=range]{width:100%}button{font:inherit;padding:8px;margin:4px}</style><main><h1>V18 · 独立刚性髌骨</h1><p>红色为刚性前侧膝盖区域，9顶点/侧。仅局部后侧接触区域修形，未完成全身动作验证。</p><canvas id="view" width="1100" height="900"></canvas><label>屈膝 <output id="v">90°</output><input id="angle" type="range" min="0" max="145" value="90"></label><div><button data-a="90">侧面</button><button data-a="0">正面</button><button data-a="45">斜视</button><label><input type="checkbox" id="wire" checked>线框</label><label><input type="checkbox" id="white" checked>白模</label><label><input type="checkbox" id="mark" checked>硬膝盖标记</label><input type="checkbox" id="ears" hidden></div><p id="status"></p><p><a href="knee-v18-sculpt-preview.svg">高清实渲染</a> · <a href="knee-v18-sculpt-audit.json">检测报告</a></p></main><script type="module">import{kneeBindings,bend}from'./knee-v17-isolated.mjs';import{patellaBindings,hardKnee}from'./knee-v18-patella.mjs';import{sculptPatella}from'./knee-v18-sculpt.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let opt={"pivotZ":-0.055,"slide":-0.025,"bulge":0.026,"taper":0.008,"patellaFollow":0.5,"calfContact":true,"gap":0.025,"squeeze":0.45,"patella":0},M,B,L,ids,az=Math.PI/2;function draw(){if(!M)return;let deg=+$('angle').value,P=hardKnee(M,B,deg,opt,bend),minY=Math.min(...ids.map(i=>P[i][1])),maxY=Math.max(...ids.map(i=>P[i][1])),minZ=Math.min(...ids.map(i=>P[i][2])),maxZ=Math.max(...ids.map(i=>P[i][2]));setStage({cy:(minY+maxY)/2,cx:.1,cz:(minZ+maxZ)/2,span:1.12,floor:-10});setPose(L,P,$('mark').checked?L.polygons.map(f=>f.every(i=>B[i].patella)?.65:.04):null);render(az,0,false,1);$('v').value=deg+'°';let r=check(L,P);$('status').textContent='相交 '+r.pairs.length+' / 折面 '+r.folds.length+'（单腿测试）'}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};for(let k of ['angle','wire','white','mark'])$(k).oninput=draw;let r=await fetch('./hip-retopo-v13-asset.json'),A=await r.json();M=sculptPatella(A.mesh,opt);B=patellaBindings(M,kneeBindings(M));let fs=M.polygons.map((f,i)=>i).filter(i=>M.polygons[i].every(v=>M.zones[v]===3&&M.positions[v][1]<1.25));L={...M,modules:{},polygons:fs.map(i=>M.polygons[i]),origFace:fs};ids=[...new Set(L.polygons.flat())];setup(L,null);draw()</script></html>
