<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V12 抱膝坐姿测试</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae5;color:#302f2b;font:15px system-ui}main{max-width:820px;margin:auto;padding:14px}canvas{width:100%;max-width:650px;display:block;margin:auto;touch-action:none}section{background:white;border:1px solid #ccc;border-radius:8px;padding:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}button{font:inherit;border:1px solid #aaa;border-radius:5px;background:white;padding:8px}input[type=range]{width:100%}a{color:#61503c}</style><main><h1>V12 · 抱膝坐姿</h1><p>单动作实验。最终姿势已做对称局部修形，站立到坐下的过渡未通过，髋腹部表面应变仍过大。</p><section><canvas id="view" width="680" height="680"></canvas><div class="row"><button data-a="0">正面</button><button data-a="90">侧面</button><button data-a="45">斜侧</button><button data-a="180">背面</button><label><input id="wire" type="checkbox">网格</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="ears" type="checkbox" checked>耳朵</label></div><div class="row"><button id="play">播放未通过的过渡</button><button id="end">最终坐姿</button></div><input id="t" type="range" min="0" max="1" step=".001" value="1"><p id="status"></p></section><p><a href="seated-knee-hug-v12-preview.svg">实际渲染三视图</a> · <a href="seated-knee-hug-v12-target.json">最终顶点修形目标</a> · <a href="seated-knee-hug-v12-motion-audit.json">过渡检测</a> · <a href="vertex-rig-v12-bindings.json">顶点绑定表（独立实验）</a></p></main><script type="module">import{buildSeat,makeSeatClip}from'./seated-knee-hug-v12.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let M,sample,t=1,az=Math.PI/4,pitch=0,playing=false,drag=null,start=0;function draw(){if(!M)return;let q=sample(t),top=Math.max(...q.positions.map(p=>p[1]));setStage({cx:0,cy:top*.5,cz:.17,span:Math.max(1.85,top*1.13),floor:0});setPose({...M,modules:q.modules},q.positions,null);render(az,pitch,false,1);let r=check(M,q.positions);$('status').textContent='进度 '+Math.round(t*100)+'% · 相交 '+r.pairs.length+' / 折面 '+r.folds.length+' / 退化 '+r.deg+'（视觉未验收）';$('t').value=t}function tick(now){if(!playing)return;if(!start)start=now;t=Math.min(1,(now-start)/3000);draw();if(t<1)requestAnimationFrame(tick);else{playing=false;$('play').textContent='播放未通过的过渡'}}$('play').onclick=()=>{playing=!playing;if(playing){start=0;$('play').textContent='暂停';requestAnimationFrame(tick)}else $('play').textContent='播放未通过的过渡'};$('end').onclick=()=>{playing=false;t=1;draw();$('play').textContent='播放未通过的过渡'};$('t').oninput=()=>{playing=false;t=+$('t').value;draw()};for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};for(let k of ['wire','white','ears'])$(k).onchange=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;try{let [d,q]=await Promise.all(['./body_v46/data.json','./seated-knee-hug-v12-target.json'].map(async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));M=buildSeat(d);sample=makeSeatClip(M,q);setup(M,null);draw()}catch(e){$('status').textContent='加载失败：'+e.message}</script></html>
