<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V46 V8 全身动作测试</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae5;color:#302f2b;font:15px system-ui}main{max-width:960px;margin:auto;padding:12px}canvas{display:block;width:100%;max-width:650px;margin:auto;touch-action:none}section{background:#fff;border:1px solid #d6d0c7;border-radius:9px;padding:12px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}button,select{font:inherit;background:#fff;border:1px solid #b6b0a7;border-radius:5px;padding:8px}input[type=range]{width:100%}a{color:#65503e}</style><main><h1>V46 V8 全身运动试验</h1><p>实际 518 四边形。保护大腿主要截面，髋根局部变形，小腹分侧让位。保留旧素体，不是最终游戏资产。</p><section><canvas id="view" width="680" height="680"></canvas><div class="row"><label>动作<select id="clip"><option value="squat">深蹲</option><option value="run">跑步</option><option value="jump">跳跃</option><option value="slash">挥砍</option><option value="climb">攀爬姿态（无接触锁定）</option><option value="vault">越障姿态（无接触锁定）</option></select></label><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度<select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label></div><input id="time" type="range" min="0" max="1" step=".001" value="0"><div class="row"><button data-angle="0">正面</button><button data-angle="45">斜侧</button><button data-angle="90">侧面</button><button data-angle="180">背面</button><label><input id="wire" type="checkbox">四边形</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="ears" type="checkbox" checked>耳朵</label><label><input id="live" type="checkbox" checked>实时检查</label></div><p id="status"></p><p id="audit"></p></section><p><a href="body-motion-v8-squat-preview.svg">深蹲 V7/V8 同角度对比</a> · <a href="body-motion-v8-audit.json">366 姿势检查</a> · <a href="limb-v6.html">独立四肢控制</a></p><p>限制：跑步、深蹲、挥砍仅通过现有网格检测，不代表动作已符合人体或接地标准；跳跃、攀爬与越障仍存在相交。尚未接入真实 IK 接触与障碍碰撞。</p></main><script type="module">
import{build,evaluate}from'./body-motion-v8-core.mjs';import{check}from'./motion-collision-check.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';const $=id=>document.getElementById(id);let M,t=0,angle=Math.PI/3,pitch=.02,playing=true,drag,last=0,drawAt=0;let dur={squat:2.2,run:1,jump:1.6,slash:1.3,climb:2.4,vault:1.6};
function draw(){if(!M)return;let id=$('clip').value,q=evaluate(M,id,t);setStage({cx:0,cy:1.75,cz:0,span:3.45,floor:.3213431245877313});setPose({...M,modules:q.modules},q.positions,null);render(angle,pitch,false,1);$('time').value=t;$('status').textContent='动作进度 '+Math.round(t*100)+'% · '+M.polygons.length+' 四边形';if(!playing||$('live').checked){let r=check(M,q.positions);$('audit').textContent='相交 '+r.pairs.length+' / 折面 '+r.folds.length+' / 退化 '+r.deg}else $('audit').textContent='暂停进行几何检查'}
function tick(now){if(last&&playing&&M){t=(t+(now-last)/1000*(+$('speed').value)/dur[$('clip').value])%1}last=now;if(playing&&now-drawAt>40){drawAt=now;draw()}requestAnimationFrame(tick)}function stop(){playing=false;$('play').textContent='播放';draw()}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';draw()};$('clip').onchange=()=>{t=0;draw()};$('time').oninput=()=>{t=+$('time').value;stop()};$('prev').onclick=()=>{t=Math.max(0,t-1/60);stop()};$('next').onclick=()=>{t=Math.min(1,t+1/60);stop()};for(let el of document.querySelectorAll('[data-angle]'))el.onclick=()=>{angle=+el.dataset.angle*Math.PI/180;draw()};for(let k of ['wire','white','ears','live'])$(k).onchange=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;
try{let r=await fetch('./body_v46/data.json');if(!r.ok)throw Error(r.status);M=build(await r.json());setup(M,null);draw();requestAnimationFrame(tick)}catch(e){$('status').textContent='加载失败：'+e.message}
</script></html>
