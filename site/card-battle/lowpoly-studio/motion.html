<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V46 关节变形实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#efedef;color:#343139;font:15px system-ui}main{max-width:1080px;margin:auto;padding:14px}h1{font-size:23px}a{color:#6f518a}p{line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.panel{background:#fff;border:1px solid #ddd8df;border-radius:10px;padding:12px}canvas{width:100%;height:auto;display:block;touch-action:none;border:1px solid #ddd;background:#f7f6f6}button,select,input{font:inherit}button,select{padding:7px;border:1px solid #ccc;border-radius:5px;background:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}label{display:block;margin:8px 0}input[type=range]{width:100%}small{color:#706876}.legend{height:10px;background:linear-gradient(90deg,#5096d2,#e6e655,#e6552d);border-radius:4px}dl{display:grid;grid-template-columns:1fr auto;gap:8px}dd{margin:0}#joints label{display:grid;grid-template-columns:80px 1fr 36px;align-items:center;gap:5px}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style><main><a href="v46.html">返回建模工作台</a><h1>V46 · 关节变形实验室 01</h1><p>原始素体冻结。对比原始四边形和局部环线加密；可实时调节关节、播放原地步态、观察边长变化。</p><div class="layout"><section class="panel"><div class="row"><button data-view="0">正面</button><button data-view="90">侧面</button><button data-view="180">背面</button><button data-view="45">斜面</button><button id="play">播放</button><button id="reset">复位</button></div><canvas id="view" width="540" height="600"></canvas><small>拖动旋转 · 测试为原地关节运动，不含脚底 IK</small><div class="row"><label><input id="wire" type="checkbox" checked>四边形线框</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="heat" type="checkbox">边长变化热力图</label><label><input id="ears" type="checkbox" checked>耳朵</label></div><div class="legend"></div><small>蓝：变形小　黄：中等　红：较大。色标为 |ln(当前边长/原边长)|，0–0.65 截断。</small></section><aside class="panel"><label>网格 <select id="mesh"><option value="refined">局部加密 578 面</option><option value="original">原版 438 面</option></select></label><label>动作 <select id="mode"><option value="bend">关节弯曲压力测试</option><option value="walk">原地步态循环</option><option value="manual">独立关节控制</option></select></label><label>动作进度 <span id="percent">0%</span><input id="time" type="range" min="0" max="1" step=".005" value="0"></label><div id="joints"></div><h3>当前变形指标</h3><dl id="metrics"></dl><small>面积低于原面积 10% 的三角渲染单元计为严重压缩；不等同于应力或翻面检测。</small><p><a href="motion-audit.json">42 姿势数值报告</a> · <a href="motion-preview.png">原版/加密截图</a> · <a href="motion-refined.json">加密网格</a></p><h3>破面与穿模验收：未通过</h3><p><a href="motion-collision-preview.png">异常面定位截图</a> · <a href="motion-collision-audit.json">逐姿势检测</a> · <a href="motion-collision-notes.md">检测说明</a></p><p id="status">加载中…</p></aside></div><input id="isolate" type="checkbox" hidden><select id="layers" hidden><option value="all">all</option></select></main><script type="module" src="motion-ui.mjs"></script></html>
