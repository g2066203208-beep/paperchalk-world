<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V14 刚体优先</title><style>body{font:15px system-ui;background:#f5f3f0;color:#333;margin:0}main{max-width:800px;margin:auto;padding:12px}canvas{display:block;width:100%;max-width:680px;margin:auto;touch-action:none}button,select{font:inherit;padding:8px;margin:4px}input[type=range]{width:100%}</style><main><h1>V14 · 纯刚体测试</h1><p>608 个顶点每个仅有一个刚体归属。默认隐藏跨关节的连接面，保留原形。连接面的拉伸与碰撞尚未解决。</p><canvas id="view" width="680" height="680"></canvas><div><button data-a="0">正面</button><button data-a="90">侧面</button><button data-a="180">背面</button><button id="rest">原始站立</button><button id="seat">抱膝坐姿</button><label><input type="checkbox" id="seams">显示未修连接面</label><label><input type="checkbox" id="wire">线框</label><label><input type="checkbox" id="white" checked>白模</label><label><input type="checkbox" id="ears" checked>耳朵</label></div><label>屈髋 <output id="hv"></output>°<input id="h" type="range" min="0" max="145" value="130"></label><label>屈膝 <output id="kv"></output>°<input id="k" type="range" min="0" max="145" value="91"></label><p id="status"></p><p><a href="rigid-body-v14-preview.svg">实际渲染对比</a> · <a href="rigid-body-v14-bindings.json">所有顶点绑定</a> · <a href="rigid-body-v14-audit.json">刚体检测</a></p></main><script type="module">import{pose,rigidity}from'./rigid-body-v14.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let M,V,az=Math.PI/2,pitch=0,drag,rest=false;function draw(){if(!M)return;let h=+$('h').value,k=+$('k').value;$('hv').value=h;$('kv').value=k;let q=rest?{positions:M.positions,modules:M.modules}:pose(M,V,{tilt:-10,h,k}),P=q.positions,lo=Math.min(...P.map(p=>p[1])),hi=Math.max(...P.map(p=>p[1])),full=$('seams').checked,mesh=full||rest?M:{...M,polygons:M.polygons.filter(f=>f.every(i=>V[i].owner===V[f[0]].owner))};let heat=full||rest?null:mesh.polygons.map(f=>{let n=V[f[0]].owner;return n==='torso'?.08:n.startsWith('thigh')?.55:n.startsWith('shin')?.36:n.startsWith('foot')?.2:n.startsWith('upperArm')?.24:n.startsWith('forearm')?.4:.65});setStage({cy:(lo+hi)/2,cx:0,cz:rest?0:.16,span:(hi-lo)*1.12,floor:lo});setPose({...mesh,modules:q.modules},P,heat);render(az,pitch,false,1);let e=Math.max(...Object.values(rigidity(V,P)).map(r=>r.maxRelativeError)),r=check(M,P);$('status').textContent='刚体内部最大相对误差 '+e.toExponential(2)+'；完整连接网格相交 '+r.pairs.length+' / 折面 '+r.folds.length+'（未验收）'}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};$('rest').onclick=()=>{rest=true;draw()};$('seat').onclick=()=>{rest=false;$('h').value=130;$('k').value=91;draw()};for(let k of ['h','k'])$(k).oninput=()=>{rest=false;draw()};for(let k of ['wire','white','ears','seams'])$(k).onchange=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;try{let [a,b]=await Promise.all(['./hip-retopo-v13-asset.json','./rigid-body-v14-bindings.json'].map(async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));M=a.mesh;V=b;setup(M,null);draw()}catch(e){$('status').textContent='加载失败 '+e.message}</script></html>
