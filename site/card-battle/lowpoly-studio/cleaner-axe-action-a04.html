const CLEANER=(()=>{

const avg=(P,f)=>[0,1,2].map(k=>f.reduce((v,i)=>v+P[i][k],0)/f.length),sub=(a,b)=>a.map((v,i)=>v-b[i]),add=(a,b)=>a.map((v,i)=>v+b[i]),mul=(a,t)=>a.map(v=>v*t),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/(Math.hypot(...a)||1));
function build(P,rest,quads,zones,show={hair:true,clothes:true,axe:true}){
let out=P.map(p=>p.slice()),faces=quads.map(f=>f.slice()),mats=quads.map(()=>'skin'),orig=quads.map((_,i)=>i),norm=P.map(()=>[0,0,0]),restNorm=P.map(()=>[0,0,0]);
function face(f,m){faces.push(f);mats.push(m);orig.push(-1)}
function vert(p){out.push(p);return out.length-1}
function patch(rows,m){let ids=rows.map(r=>r.map(vert));for(let j=0;j<ids.length-1;j++)for(let i=0;i<ids[j].length-1;i++)face([ids[j][i],ids[j][i+1],ids[j+1][i+1],ids[j+1][i]],m);return ids}
function rings(rows,m,cap=true){let ids=rows.map(r=>r.map(vert)),n=ids[0].length;for(let k=0;k<ids.length-1;k++)for(let j=0;j<n;j++)face([ids[k][j],ids[k][(j+1)%n],ids[k+1][(j+1)%n],ids[k+1][j]],typeof m==='function'?m(k,j):m);if(cap)for(let k of [0,ids.length-1]){let c=vert(avg(out,ids[k]));for(let j=0;j<n;j++)face(k===0?[c,ids[k][(j+1)%n],ids[k][j]]:[c,ids[k][j],ids[k][(j+1)%n]],typeof m==='function'?m(k,j):m)}return ids}

function renderFrame(m,t){if(!original)return null;const a=AXE_MOTION.evaluate(m,t,$('hairOn').checked),q=FACE.sample('idle',t);R.setStage({cx:0,cy:1.80,cz:a.audit.rootTravel,span:3.65,floor:.321,guide:''});R.setup({...SOURCE,modules:a.modules,cleaner:a.model},FACE.texture(original,q));R.render(angle,pitch,false,1);$('line').textContent=AXE_MOTION.labels[m];$('status').textContent='左握点误差 '+a.audit.leftGrip.toFixed(3)+' / 右 '+(a.audit.rightGrip===null?'自由':a.audit.rightGrip.toFixed(3))+' / '+t.toFixed(2)+'s';window.__axeState=a;return a}
function draw(){renderFrame(mode,clock);$('time').value=clock}function reset(m){mode=m;clock=0;last=0;$('mode').value=m;$('time').max=AXE_MOTION.durations[m];draw()}
function tick(t){if(!playing)return;if(last)clock+=Math.min(.1,(t-last)/1000);last=t;clock%=AXE_MOTION.durations[mode];if(t-lastDraw>=66){lastDraw=t;draw()}requestAnimationFrame(tick)}function start(){if(playing)return;playing=true;last=0;$('play').textContent='暂停';requestAnimationFrame(tick)}
$('play').onclick=()=>{if(playing){playing=false;$('play').textContent='播放'}else start()};$('restart').onclick=()=>{reset(mode);start()};$('mode').onchange=()=>reset($('mode').value);$('time').oninput=()=>{playing=false;$('play').textContent='播放';clock=+$('time').value;draw()};for(let [id,v] of [['front',0],['three',.65],['side',Math.PI/2]])$(id).onclick=()=>{angle=v;pitch=0;draw()};for(let id of ['white','wire','ears','hairOn'])$(id).oninput=draw;
$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.01;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;
window.__axeFrame=renderFrame;window.__axeAPI=AXE_MOTION;
let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');g.drawImage(img,0,0);original=g.getImageData(0,0,256,256).data;reset('run');if(!window.__axeTest)start()};img.onerror=()=>{$('status').textContent='面部贴图加载失败'};img.src=facePng;
</script></html>
