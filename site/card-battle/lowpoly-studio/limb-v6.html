<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V46 V6 四肢关节实验</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae5;color:#302f2b;font:15px system-ui}main{max-width:960px;margin:auto;padding:14px}canvas{width:100%;max-width:680px;display:block;margin:auto;touch-action:none}section{background:white;border:1px solid #d6d0c7;border-radius:8px;padding:12px}button,select{font:inherit;padding:8px;background:white;border:1px solid #aaa;border-radius:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input[type=range]{width:100%}a{color:#61503c}</style><main><h1>V46 V6 · 膝 / 肘 / 手腕</h1><p>518 四边形；保留原始 V46，未接入全身动作。145° 肘部及极端组合有手胸相交。</p><section><canvas id="view" width="680" height="680"></canvas><div class="row"><button data-angle="0">正面</button><button data-angle="90">侧面</button><button data-angle="180">背面</button><button data-angle="270">另一侧</button><label><input id="wire" type="checkbox">四边形</label><label><input id="white" type="checkbox" checked>白模</label><label hidden><input id="ears" type="checkbox"></label><label>特写<select id="zoom"><option value="elbow">肘</option><option value="knee">膝</option><option value="hand">手腕</option><option value="full">全身</option></select></label></div><div id="sliders"></div><div class="row"><button id="reset">复位</button><button id="demo">大角度组合</button></div><p id="status"></p><p id="audit"></p></section><p><a href="limb-v6-preview.svg">实际网格渲染</a> · <a href="limb-v6-audit.json">全角度审计</a> · <a href="knee-v5.html">V5</a></p></main><script type="module">
import{build,pose,handError}from'./limb-v6-core.mjs';import{check}from'./motion-collision-check.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';const $=id=>document.getElementById(id);let M,angle=Math.PI/2,pitch=0,drag;
for(let [k,label,min,max,v] of [['er','右肘',0,145,90],['el','左肘',0,145,0],['wr','右手腕',-70,70,0],['wl','左手腕',-70,70,0],['kr','右膝',0,145,0],['kl','左膝',0,145,0]]){$('sliders').insertAdjacentHTML('beforeend','<label>'+label+' <output id="'+k+'v"></output>°<input type="range" id="'+k+'" min="'+min+'" max="'+max+'" value="'+v+'"></label>');$(k).oninput=draw}
let keys=['er','el','wr','wl','kr','kl'];function draw(){if(!M)return;let p=Object.fromEntries(keys.map(k=>[k,+$(k).value])),P=pose(M,p);for(let k of keys)$(k+'v').value=p[k];let z=$('zoom').value,center=z==='elbow'?P[182]:z==='hand'?P[194]:z==='knee'?P[244]:[0,1.65,0];setStage({cx:center[0],cy:center[1],cz:center[2],span:z==='full'?2.9:z==='hand'?.58:z==='elbow'?.85:1.02,floor:-10});setPose(M,P,null);render(angle,pitch,false,1);let q=check(M,P);$('audit').textContent='相交 '+q.pairs.length+' / 折面 '+q.folds.length+' / 退化 '+q.deg+'；手掌最大内部距离误差 '+(100*Math.max(handError(M,P,0),handError(M,P,1))).toFixed(9)+'%'}
for(let e of document.querySelectorAll('[data-angle]'))e.onclick=()=>{angle=+e.dataset.angle*Math.PI/180;draw()};for(let id of ['wire','white','zoom'])$(id).oninput=draw;$('reset').onclick=()=>{keys.forEach(k=>$(k).value=0);draw()};$('demo').onclick=()=>{Object.entries({er:135,el:120,wr:20,wl:-20,kr:145,kl:90}).forEach(([k,v])=>$(k).value=v);$('zoom').value='full';draw()};$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;
try{let r=await fetch('./body_v46/data.json');if(!r.ok)throw Error(r.status);M=build(await r.json());setup(M,null);$('status').textContent='实际 V46 网格：'+M.positions.length+' 顶点，'+M.polygons.length+' 四边形';draw()}catch(e){$('status').textContent='加载失败：'+e.message}
</script></html>
