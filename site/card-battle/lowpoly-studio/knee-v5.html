<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V46 V5 膝关节实验</title><style> *{box-sizing:border-box}body{margin:0;background:#eeeae5;color:#302f2b;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}h1{font-size:23px}canvas{width:100%;display:block;touch-action:none;background:#f7f6f6}section{background:white;border:1px solid #d6d0c7;border-radius:8px;padding:12px;margin:12px 0}button,select{font:inherit;padding:8px;border:1px solid #b7b0a8;border-radius:5px;background:white}input[type=range]{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}a{color:#61503c}small{color:#655d55}</style><main><h1>V46 · V5 膝盖独立屈曲实验</h1><p>原素体 506 四边形。髌骨前侧独立刚性变换，膝窝局部压缩。此页仅测试膝关节，不代表全身动作通过。</p><section><canvas id="view" width="680" height="680"></canvas><div class="row"><button data-angle="0">正面</button><button data-angle="90">侧面</button><button data-angle="180">背面</button><button data-angle="270">另一侧</button><button id="play">播放往返</button><label><input id="wire" type="checkbox">四边形</label><label><input id="bones" type="checkbox" checked>关节轴</label><label><input id="white" type="checkbox" checked>白模</label><label hidden><input id="ears" type="checkbox">耳朵</label></div><label>观察范围 <select id="zoom"><option value="close">膝盖特写</option><option value="full">全身</option></select></label><p>右膝 <output id="rv"></output>°</p><input id="right" type="range" min="0" max="145" value="90"><p>左膝 <output id="lv"></output>°</p><input id="left" type="range" min="0" max="145" value="0"><div class="row" id="presets"></div><p id="status">加载实际模型…</p><p id="audit"></p></section><p><a href="knee-v5-preview.svg">实际网格渲染预览</a> · <a href="knee-v5-audit.json">438 个姿势检测结果</a> · <a href="anatomy-v4.html">旧 V4 实验</a></p><small>当前只是固定轴屈曲试件。完整 IK、接触、髌骨形状重拓扑、攀岩与深蹲视觉验收尚未完成。</small></main><script type="module">
import{refine}from'./motion-v2-core.mjs';import{check}from'./motion-collision-check.mjs';import{pose,auditRigid}from'./knee-v5-core.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';const $=id=>document.getElementById(id);let M,angle=Math.PI/2,pitch=0,drag,playing=false,last=0,phase=90;
function draw(){if(!M)return;let r=+$('right').value,l=+$('left').value,P=pose(M,r,l),close=$('zoom').value==='close',bones=[r,l].map((a,i)=>{let s=i?-1:1,h=a*Math.PI/180,b=[s*.1,.918,0],d=.489,c=[b[0],b[1]-d*Math.cos(h),-d*Math.sin(h)];return{a:[s*.145,1.36,0],b,c,end:c,target:b,locked:true}});$('rv').value=r;$('lv').value=l;setStage({cy:close?.90:1.65,cx:0,cz:close?-.16:0,span:close?1.10:2.9,floor:-10,bones});setPose(M,P,null);render(angle,pitch,false,1);let q=check(M,P),a=auditRigid(M,P,0),b=auditRigid(M,P,1);$('audit').textContent='相交 '+q.pairs.length+' / 折面 '+q.folds.length+' / 退化 '+q.deg+'；髌骨三点距离误差 '+(100*Math.max(a.patella.maxRelativeError,b.patella.maxRelativeError)).toFixed(9)+'%'}
for(let id of ['right','left','wire','white','bones','zoom'])$(id).oninput=()=>{playing=false;$('play').textContent='播放往返';draw()};for(let e of document.querySelectorAll('[data-angle]'))e.onclick=()=>{angle=+e.dataset.angle*Math.PI/180;draw()};for(let n of [0,30,60,90,120,145]){let b=document.createElement('button');b.textContent=n+'°';b.onclick=()=>{$('right').value=n;$('left').value=0;draw()};$('presets').append(b)}
$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;
function tick(t){if(!playing)return;if(t-last>35){phase=(phase+2)%290;$('right').value=Math.round(145-Math.abs(145-phase));draw();last=t}requestAnimationFrame(t)}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放往返';if(playing){phase=+$('right').value;requestAnimationFrame(tick)}};
try{let r=await fetch('./body_v46/data.json');if(!r.ok)throw Error(r.status);M=refine(await r.json());setup(M,null);$('status').textContent='已加载 V46 原始网格；独立固定轴试验';draw()}catch(e){$('status').textContent='加载失败：'+e.message}
</script></html>
