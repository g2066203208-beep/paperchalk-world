<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V9 · 模块化头部建模</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0eeed;color:#343039;font:15px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:25px;margin:4px 0}p{line-height:1.65}a{color:#685c80}.grid{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr);gap:12px}.panel{background:white;border:1px solid #d9d4d5;border-radius:12px;padding:12px;min-width:0}.view{height:clamp(300px,55vh,610px);background:#f6f4f4;position:relative;overflow:hidden;border-radius:8px}canvas{width:100%;height:100%;display:block;touch-action:none}#refImage{width:100%;height:100%;object-fit:contain}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button,input{font:inherit}button{background:#fff;border:1px solid #c7c1ca;border-radius:7px;padding:9px 13px;color:#343039;cursor:pointer}button[aria-pressed=true]{background:#685c80;color:white}label{display:inline-flex;gap:6px;align-items:center;padding:6px 0}small{color:#766e79}.stats{display:flex;flex-wrap:wrap;gap:20px}.stats strong{font-size:20px;display:block}#error{white-space:pre-wrap;color:#9b3535}@media(max-width:720px){main{padding:10px}.grid{gap:7px}.panel{padding:7px}.view{height:250px}h1{font-size:20px}button{padding:7px 9px;font-size:13px}.controls{gap:5px}}
</style></head><body><main><header><div><small>CHARACTER LAB / V9</small><h1>三视图头部 · 模块化模型</h1><p>头骨属于连续人体；发型、呆毛、左耳、右耳独立挂接头骨。</p></div><nav><a href="./">旧工作室</a> · <a href="../coin-fx-lab.html">返回老虎机</a></nav></header>
<div class="grid"><section class="panel"><strong>批准的三视图参考</strong><div class="view"><img id="refImage" alt="导入已批准的原始三视图"></div><label>导入原始三视图 <input id="refFile" type="file" accept="image/*"></label><small>参考图片仅用于对照，不参与三维几何生成。</small></section><section class="panel"><strong>V9 实际三维模型</strong><div class="view"><canvas id="view"></canvas></div><div class="controls"><button data-angle="0">正面</button><button data-angle="90">侧面</button><button data-angle="180">背面</button><button data-angle="35">3/4</button><button id="spin" aria-pressed="false">旋转</button></div></section></div>
<section class="panel" style="margin-top:12px"><div class="controls"><button id="white" aria-pressed="false">白模</button><button id="wire" aria-pressed="false">线框</button><button id="full" aria-pressed="false">全身</button><button id="bare">仅基础头部</button><button id="restore">恢复全部模块</button><button id="shot">保存实际截图</button><button id="obj">导出几何 OBJ</button></div><div class="controls" id="parts"></div><label>转头蒙皮 <input id="turn" type="range" min="-0.85" max="0.85" step=".01" value="0"></label><div id="stats" class="stats"></div><p id="error" role="status"></p><small>几何为本地实际测试的 V9 数据；线上显示与浏览器测试状态以实际运行结果为准。</small></section></main>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {buildBody as buildV3} from './body-extreme.mjs';
import {meshGzip,facePNG} from './v9-data.mjs';
const $=id=>document.getElementById(id);
let refURL=null;$('refFile').onchange=()=>{if(refURL)URL.revokeObjectURL(refURL);const f=$('refFile').files[0];if(f){refURL=URL.createObjectURL(f);$('refImage').src=refURL}};
try{
const bytes=Uint8Array.from(atob(meshGzip),c=>c.charCodeAt(0));
const raw=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const old=buildV3(),keep=old.positions.map((_,i)=>i).filter(i=>i<28||i>=50),map=new Map(keep.map((i,j)=>[i,j]));
const P=keep.map(i=>old.positions[i]).concat(raw.body.positions),T=old.triangles.filter(t=>t.every(i=>map.has(i))).map(t=>t.map(i=>map.get(i))).concat(raw.body.triangles);
const weights=keep.map(i=>old.weights[i]).concat(raw.body.positions.map(()=>[[2,1]])),groups=Array(146).fill('body').concat(raw.body.groups);
if(P.length!==121||T.length!==238||groups.length!==238)throw Error('V9 geometry count mismatch');
const body={positions:P,triangles:T,weights,groups,bones:old.bones,boneNames:old.boneNames};
function audit(d){const E=new Map(),adj=d.positions.map(()=>new Set());let deg=0,vol=0;for(const f of d.triangles){const [a,b,c]=f.map(i=>new THREE.Vector3(...d.positions[i]));const n=b.clone().sub(a).cross(c.clone().sub(a));if(n.length()<1e-9)deg++;vol+=a.dot(b.clone().cross(c))/6;for(let i=0;i<3;i++){const a=f[i],b=f[(i+1)%3],k=[Math.min(a,b),Math.max(a,b)].join(':');let e=E.get(k)||[0,0];e[0]++;e[1]+=a<b?1:-1;E.set(k,e);adj[a].add(b);adj[b].add(a)}}const visited=new Set([0]),queue=[0];for(const a of queue)for(const b of adj[a])if(!visited.has(b)){visited.add(b);queue.push(b)}const bad=[...E.values()].filter(e=>e[0]!==2||e[1]!==0).length;const euler=d.positions.length-E.size+d.triangles.length;if(bad||deg||visited.size!==d.positions.length||euler!==2||vol<=0)throw Error('mesh topology audit failed');return {vertices:d.positions.length,triangles:d.triangles.length,bad,deg,euler,vol}}
const checks={body:audit(body)};for(const [k,d] of Object.entries(raw.modules))checks[k]=audit(d);
const canvas=$('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0xf6f4f4);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-.8,.8,.8,-.8,.01,100);
const hemi=new THREE.HemisphereLight(0xfff4ea,0xd3c4c4,2.1);scene.add(hemi);const light=new THREE.DirectionalLight(0xffffff,.95);light.position.set(-3,5,6);scene.add(light);
const tex=new THREE.TextureLoader().load(facePNG);tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;
const material=(color,map=null)=>new THREE.MeshStandardMaterial({color,map,roughness:1,metalness:0,flatShading:true});
const bodyMat=material(0xdcd8d3),skinMat=material(0xfad2c0),faceMat=material(0xffffff,tex);
const bodyMats=[bodyMat,skinMat,faceMat],hairMat=material(0xa16158),hairDark=material(0x845047),earMat=material(0x96544c),earInner=material(0xbd776d);
const mats=[...bodyMats,hairMat,hairDark,earMat,earInner],original=mats.map(m=>m.color.clone());
function geometry(d){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(d.positions.flat(),3));g.setIndex(d.triangles.flat());g.computeVertexNormals();return g}
function groupsFor(g,ids){let start=0;for(let i=1;i<=ids.length;i++)if(i===ids.length||ids[i]!==ids[start]){g.addGroup(start*3,(i-start)*3,ids[start]);start=i}}
const geo=geometry(body);geo.setAttribute('uv',new THREE.Float32BufferAttribute(P.flatMap(([x,y])=>[x+.5,(y-1.7)/.95]),2));groupsFor(geo,groups.map(x=>x==='body'?0:x==='face'?2:1));
const si=[],sw=[];for(const w of weights)for(let j=0;j<4;j++){si.push(w[j]?.[0]||0);sw.push(w[j]?.[1]||0)}geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(si,4));geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(sw,4));
const model=new THREE.SkinnedMesh(geo,bodyMats);model.name='body';scene.add(model);
const bones=body.bones.map(([p,x,y,z],i)=>{const b=new THREE.Bone();b.name=body.boneNames[i];const a=p<0?[0,0,0,0]:body.bones[p];b.position.set(x-a[1],y-a[2],z-a[3]);return b});body.bones.forEach(([p],i)=>p<0?model.add(bones[i]):bones[p].add(bones[i]));model.updateMatrixWorld(true);model.bind(new THREE.Skeleton(bones));model.frustumCulled=false;
const root=new THREE.Group(),headRest=body.bones[2];root.position.set(-headRest[1],-headRest[2],-headRest[3]);bones[2].add(root);
const wires=[];const wireMat=new THREE.MeshBasicMaterial({color:0x4d434a,wireframe:true,transparent:true,opacity:.8,depthTest:true,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
const bodyWireMat=wireMat.clone(),headWireMat=wireMat.clone();const bodyWire=new THREE.SkinnedMesh(geo,[bodyWireMat,headWireMat,headWireMat]);bodyWire.bind(model.skeleton,model.bindMatrix);bodyWire.frustumCulled=false;bodyWire.visible=false;scene.add(bodyWire);wires.push(bodyWire);
const objects={};for(const [k,d] of Object.entries(raw.modules)){const g=geometry(d);let ms=[hairMat,hairDark];if(k.startsWith('ear')){ms=[earMat,earInner];groupsFor(g,d.triangles.map((_,i)=>i>=12&&i<16?1:0))}else{groupsFor(g,d.triangles.map(f=>{const [a,b,c]=f.map(i=>new THREE.Vector3(...d.positions[i]));return k==='hair'&&(a.y+b.y+c.y)/3<2.14&&b.clone().sub(a).cross(c.clone().sub(a)).normalize().y<.05?1:0}))}
const mesh=new THREE.Mesh(g,ms),wire=new THREE.Mesh(g,wireMat);wire.visible=false;mesh.add(wire);root.add(mesh);objects[k]=mesh;wires.push(wire)}
const names={hair:'发型',cowlick:'呆毛',earL:'左耳',earR:'右耳'};for(const k of Object.keys(objects)){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.id='part-'+k;c.onchange=()=>{objects[k].visible=c.checked;stats()};l.append(c,names[k]||k);$('parts').append(l)}
function stats(){let n=T.length,v=P.length;for(const [k,o] of Object.entries(objects))if(o.visible){n+=raw.modules[k].triangles.length;v+=raw.modules[k].positions.length}$('stats').innerHTML='<div><small>当前组合顶点</small><strong>'+v+'</strong></div><div><small>三角面</small><strong>'+n+'</strong></div><div><small>素体连通网格</small><strong>1</strong></div><div><small>非流形边</small><strong>0</strong></div>'}stats();
function showParts(on){for(const [k,o] of Object.entries(objects)){o.visible=on;$('part-'+k).checked=on}stats()}$('bare').onclick=()=>showParts(false);$('restore').onclick=()=>showParts(true);
let angle=0,pitch=0,zoom=1,spin=false,white=false,wire=false,full=false,last=performance.now(),drag=null;
function toggle(id,fn){$(id).onclick=()=>{let on=$(id).getAttribute('aria-pressed')!=='true';$(id).setAttribute('aria-pressed',String(on));fn(on)}}toggle('spin',v=>spin=v);toggle('white',v=>{white=v;mats.forEach((m,i)=>{m.color.copy(v?new THREE.Color(i<3?0xf0edeb:0xd5d7e1):original[i]);if(m===faceMat)m.map=v?null:tex;m.needsUpdate=true})});toggle('wire',v=>{wire=v;wires.forEach(x=>x.visible=v)});toggle('full',v=>{full=v;zoom=1});document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=+b.dataset.angle*Math.PI/180;pitch=0});
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){angle-=(e.clientX-drag[0])*.012;pitch=Math.max(-.9,Math.min(.9,pitch+(e.clientY-drag[1])*.009));drag=[e.clientX,e.clientY]}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('shot').onclick=()=>canvas.toBlob(b=>save(b,'head-v9.png'));$('obj').onclick=()=>{let off=0;const entries=[['body',body],...Object.entries(raw.modules).filter(([k])=>objects[k].visible)];const s=entries.map(([k,d])=>{const o='o '+k+'\n'+d.positions.map(p=>'v '+p.join(' ')).join('\n')+'\n'+d.triangles.map(f=>'f '+f.map(i=>i+1+off).join(' ')).join('\n');off+=d.positions.length;return o}).join('\n');save(new Blob([s],{type:'text/plain'}),'head-v9.obj')};
function render(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(spin)angle+=dt*.8;bones[2].rotation.y=+$('turn').value;const y=full?1.57:2.42,h=(full?3.65:1.65)/zoom,w=Math.max(1,canvas.clientWidth),ch=Math.max(1,canvas.clientHeight),pr=renderer.getPixelRatio();if(canvas.width!==Math.round(w*pr)||canvas.height!==Math.round(ch*pr))renderer.setSize(w,ch,false);const aspect=w/ch;camera.left=-h*aspect/2;camera.right=h*aspect/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();camera.position.set(5*Math.sin(angle)*Math.cos(pitch),y+5*Math.sin(pitch),5*Math.cos(angle)*Math.cos(pitch));camera.lookAt(0,y,0);bodyMat.visible=full;bodyWireMat.visible=full;renderer.render(scene,camera);requestAnimationFrame(render)}
window.__v9={body,raw,checks,objects,bones,renderer};requestAnimationFrame(render)
}catch(e){$('error').textContent='初始化失败：'+e.message;console.error(e)}
</script></body></html>
