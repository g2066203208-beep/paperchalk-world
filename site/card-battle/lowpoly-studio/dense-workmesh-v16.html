<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16 高密度工作网格</title><style>body{font:15px system-ui;margin:0;background:#f7f6f6;color:#333}main{max-width:1000px;margin:auto;padding:16px}canvas{display:block;width:100%;max-width:900px;margin:auto;touch-action:none}button{font:inherit;padding:8px;margin:3px}label{margin:8px}input[type=range]{width:160px}a{color:#365c8e}</style><main><h1>V16 · 9696 四边形工作网格</h1><p>先制作高密度工作模型，暂不减面。站立网格通过现有几何检测；抱膝姿势仍有相交，未验收。默认显示原始站姿。</p><canvas id="view" width="1200" height="1200"></canvas><div><button data-a="0">正面</button><button data-a="90">侧面</button><button data-a="180">背面</button><button data-a="45">斜侧</button><button id="rest">站立</button><button id="seat">抱膝（失败姿势）</button><label><input id="wire" type="checkbox">四边形线框</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="ears" type="checkbox" checked>耳朵</label></div><div><label>放大<input id="zoom" type="range" min="1" max="3" step=".05" value="1"></label><label>垂直观察位置<input id="pan" type="range" min="-1" max="1" step=".02" value="0"></label></div><p id="status"></p><p><a href="dense-workmesh-v16-preview.svg">1800×1400 实际渲染原图</a> · <a href="dense-workmesh-v16-audit.json">高密度网格检测报告</a></p></main><script type="module">import{level2}from'./dense-workmesh-v16-level2.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';const $=id=>document.getElementById(id);let M,T,rest=true,az=0,pitch=0,drag;function draw(){if(!M)return;let q=rest?M:T,P=q.positions,lo=Math.min(...P.map(p=>p[1])),hi=Math.max(...P.map(p=>p[1]));setStage({cx:0,cy:(lo+hi)/2+(hi-lo)*.45*(+$('pan').value),cz:rest?0:.23,span:(hi-lo)*1.13/(+$('zoom').value),floor:lo});setPose({...M,modules:q.modules},P,null);render(az,pitch,false,1);$('status').textContent=(rest?'站立工作网格':'抱膝测试：未通过')+' · '+M.positions.length+' 顶点 · '+M.polygons.length+' 四边形'}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};$('rest').onclick=()=>{rest=true;draw()};$('seat').onclick=()=>{rest=false;draw()};for(let k of ['wire','white','ears','zoom','pan'])$(k).oninput=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;try{let [a,b,t]=await Promise.all(['./hip-retopo-v13-asset.json','./joint-only-v15-bindings.json','./grounded-joint-v15-target.json'].map(async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));let A=level2(a.mesh,b,t);M=A.mesh;T=A.target;setup(M,null);draw()}catch(e){$('status').textContent='加载失败 '+e.message}</script></html>
