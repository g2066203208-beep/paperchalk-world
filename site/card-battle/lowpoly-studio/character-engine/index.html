<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用角色建模程序 V1</title><style>body{font:15px system-ui;margin:0;background:#f7f6f6;color:#302a27}main{max-width:1050px;margin:auto;padding:16px}canvas{width:100%;max-height:70vh;object-fit:contain;touch-action:none}button,select{font:inherit;padding:8px;margin:4px}section{display:grid;grid-template-columns:2fr 1fr;gap:12px}img{width:100%;max-height:68vh;object-fit:contain}@media(max-width:650px){section{grid-template-columns:1fr}img{max-height:38vh}}pre{white-space:pre-wrap}</style><main><h2>共用角色建模程序 V1</h2><p>公共素体、角色配方、发型模块、像素图集、统一渲染与拓扑检查。医生是历史否决版，不是新定稿。</p><select id="role"><option value="marksman">赏金枪手</option><option value="cleaner">清道夫</option><option value="doctor">医生（历史对照）</option></select><button data-a="0">正面</button><button data-a=".65">斜面</button><button data-a="1.570796">侧面</button><button data-a="3.141593">背面</button><label><input type="checkbox" id="white">白模</label><label><input type="checkbox" id="wire">线框</label><label><input type="checkbox" id="head">头部</label><button id="export">导出网格</button><section><canvas id="view" width="480" height="620"></canvas><div><img id="ref" alt="原版立绘"><p id="status"></p><pre id="audit"></pre></div></section><p id="error" role="alert"></p></main><script type="module">
import {buildCharacter,render,audit,VERSION} from './core.mjs';import {getTextures} from './textures.mjs';
const $=id=>document.getElementById(id),C=$('view'),g=C.getContext('2d');let mesh,textures,angle=.45,pitch=0,drag,seq=0;
const db=fetch('./characters.json').then(r=>{if(!r.ok)throw Error('角色数据 '+r.status);return r.json()});
function draw(){if(!mesh)return;let f=render(mesh,textures,{width:C.width,height:C.height,angle,pitch,white:$('white').checked,wire:$('wire').checked,head:$('head').checked});let im=g.createImageData(f.width,f.height);im.data.set(f.data);g.putImageData(im,0,0)}
async function load(){let n=++seq,id=$('role').value;$('error').textContent='';try{let [data,t]=await Promise.all([db,getTextures(id)]);if(n!==seq)return;let r=data.roles[id];mesh=buildCharacter(data.base,r);textures=t;$('ref').src=r.reference;$('status').textContent=r.label+' · '+r.status;$('audit').textContent=JSON.stringify(audit(mesh),null,2);draw()}catch(e){$('error').textContent=String(e)}}
$('role').onchange=load;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{angle=+b.dataset.a;pitch=0;draw()});for(let id of ['white','wire','head'])$(id).onchange=draw;C.onpointerdown=e=>{drag=[e.clientX,e.clientY];C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.01;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};C.onpointerup=C.onpointercancel=()=>drag=null;$('export').onclick=()=>{if(!mesh)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(mesh)],{type:'application/json'}));a.download=mesh.id+'.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></html>
