<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V21 高密度膝盖蒙皮</title><style>body{font:15px system-ui;background:#f7f6f6;color:#333;margin:0}main{max-width:900px;margin:auto;padding:16px}canvas{width:100%;display:block;margin:auto}input[type=range]{width:100%}button{font:inherit;padding:8px;margin:4px}</style><main><h1>V21 · 高密度膝盖蒙皮</h1><p>9696四边形工作模型，单腿显示1302面。全新权重，非旧姿势插值。仍有局部过度拉伸，未验收。</p><canvas id="view" width="1100" height="1000"></canvas><label>屈膝 <output id="v"></output><input id="angle" type="range" min="0" max="145" value="90"></label><button data-a="90">侧面</button><button data-a="0">正面</button><button data-a="45">斜视</button><label><input id="wire" type="checkbox">网格</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="mark" type="checkbox">权重区域</label><input id="ears" type="checkbox" hidden><p id="status"></p><p><a href="knee-v21-dense-preview.svg">高清实渲染</a> · <a href="knee-v21-audit.json">检测报告</a></p></main><script type="module">import{subdivide}from'./dense-workmesh-v16.mjs';import{bindDense,bendDense}from'./knee-v21-dense-rig.mjs';import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let opt={"upper":1.12,"lower":0.785,"pivotZ":-0.065,"slide":-0.02,"rear":0,"ease":0,"width":0.065},N,V,L,ids,az=Math.PI/2;function draw(){if(!N)return;let deg=+$('angle').value,P=bendDense(N,V,deg,opt),ys=ids.map(i=>P[i][1]),zs=ids.map(i=>P[i][2]);setStage({cy:(Math.min(...ys)+Math.max(...ys))/2,cx:.1,cz:(Math.min(...zs)+Math.max(...zs))/2,span:1.09,floor:-10});setPose(L,P,$('mark').checked?L.polygons.map(f=>f.reduce((n,i)=>n+(V[i].owner.startsWith('shin')||V[i].owner.startsWith('thigh')?.08:V[i].hard===1?.65:.35),0)/4):null);render(az,0,false,1);$('v').value=deg+'°';let r=check(L,P);$('status').textContent='相交 '+r.pairs.length+' / 折面 '+r.folds.length+'；局部拉伸仍未验收'}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};for(let k of ['angle','wire','white','mark'])$(k).oninput=draw;try{let [a,b]=await Promise.all(['./hip-retopo-v13-asset.json','./joint-only-v15-bindings.json'].map(async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));let S=subdivide(a.mesh,b,a.mesh.positions),D=subdivide(S.mesh,S.bindings,S.mesh.positions);N=D.mesh;V=bindDense(N,D.bindings,opt);let fs=N.polygons.map((f,i)=>i).filter(i=>N.polygons[i].every(v=>N.zones[v]===3&&N.positions[v][1]<1.23));L={...N,modules:{},polygons:fs.map(i=>N.polygons[i]),origFace:fs};ids=[...new Set(L.polygons.flat())];setup(L,null);draw()}catch(e){$('status').textContent='加载失败 '+e.message}</script></html>
