<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V13 髋部局部重拓扑</title><style>body{margin:0;background:#eeece8;color:#302f2b;font:15px system-ui}main{max-width:800px;margin:auto;padding:14px}canvas{width:100%;max-width:680px;display:block;margin:auto;touch-action:none}button{font:inherit;padding:9px;margin:4px;background:white;border:1px solid #aaa;border-radius:5px}p{line-height:1.5}</style><main><h1>V13 · 臀部与大腿根</h1><p>606个四边形，608个顶点。局部环带重建与坐姿修形实验；尚有折面及局部应变，未验收。</p><canvas id="view" width="680" height="680"></canvas><div><button data-a="0">正面</button><button data-a="90">侧面</button><button data-a="180">背面</button><button data-a="45">斜侧</button><button id="rest">切换站立/坐姿</button><label><input id="wire" type="checkbox" checked>网格</label><label><input id="white" type="checkbox" checked>白模</label><label><input id="ears" type="checkbox" checked>耳朵</label></div><p id="status"></p><p><a href="hip-retopo-v13-preview.svg">实际渲染</a> · <a href="hip-retopo-v13-asset.json">网格、局部权重标签、修形目标和检测报告</a></p></main><script type="module">import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let A,rest=false,az=Math.PI/2,pitch=0,drag;function draw(){if(!A)return;let M=A.mesh,T=rest?M:A.target,P=T.positions,lo=Math.min(...P.map(p=>p[1])),hi=Math.max(...P.map(p=>p[1]));setStage({cx:0,cy:(lo+hi)/2,cz:rest?0:.2,span:(hi-lo)*1.18,floor:lo});setPose({...M,modules:T.modules},P,null);render(az,pitch,false,1);let r=check(M,P);$('status').textContent=(rest?'站立':'抱膝坐姿')+' · 相交 '+r.pairs.length+' · 折面 '+r.folds.length+' · 退化 '+r.deg}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};$('rest').onclick=()=>{rest=!rest;draw()};for(let id of ['wire','white','ears'])$(id).onchange=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;try{let r=await fetch('./hip-retopo-v13-asset.json');if(!r.ok)throw Error(r.status);A=await r.json();setup(A.mesh,null);draw()}catch(e){$('status').textContent=e.message}</script></html>
