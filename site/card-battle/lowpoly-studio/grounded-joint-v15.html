<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V15 关节局部修形</title><style>body{font:15px system-ui;background:#f5f3f0;color:#333;margin:0}main{max-width:800px;margin:auto;padding:12px}canvas{display:block;width:100%;max-width:680px;margin:auto;touch-action:none}button{font:inherit;padding:8px;margin:4px}</style><main><h1>V15 · 刚体主体 / 关节修形</h1><p>368个主体顶点锁定，关节区240个顶点允许修形。最终网格仍未通过，静态姿势不等于动画合格。</p><canvas id="view" width="680" height="680"></canvas><div><button data-a="0">正面</button><button data-a="90">侧面</button><button data-a="180">背面</button><button data-m="core">刚体主体</button><button data-m="before">未修连接</button><button data-m="after">关节修形</button><label><input type="checkbox" id="wire">线框</label><label><input type="checkbox" id="white" checked>白模</label><label><input type="checkbox" id="ears" checked>耳朵</label></div><p id="status"></p><p><a href="grounded-joint-v15-preview.svg">实际渲染</a> · <a href="grounded-joint-v15-target.json">顶点坐标及检测报告</a> · <a href="joint-only-v15-bindings.json">锁定和关节顶点记录</a></p></main><script type="module">import{setup,setStage,setPose,render}from'./traversal-render.mjs';import{check}from'./motion-collision-check.mjs';const $=id=>document.getElementById(id);let M,B,T,az=Math.PI/2,pitch=0,drag,mode='after';function draw(){if(!M)return;let P=mode==='before'?T.baselineRigidPositions:T.positions,ids=M.polygons.map((f,i)=>i).filter(i=>M.polygons[i].every(v=>B[v].locked)&&M.polygons[i].every(v=>B[v].owner===B[M.polygons[i][0]].owner)),mesh=mode==='core'?{...M,polygons:ids.map(i=>M.polygons[i]),origFace:ids.map(i=>M.origFace[i])}:M,hi=Math.max(...P.map(p=>p[1])),heat=mode==='core'?mesh.polygons.map(f=>{let n=B[f[0]].owner;return n==='torso'?.08:n.startsWith('thigh')?.55:n.startsWith('shin')?.36:n.startsWith('foot')?.2:n.startsWith('upperArm')?.24:n.startsWith('forearm')?.4:.65}):null;setStage({cy:hi*.5,cx:0,cz:.25,span:Math.max(1.8,hi*1.12),floor:0});setPose({...mesh,modules:T.modules},P,heat);render(az,pitch,false,1);let r=check(mesh,P);$('status').textContent=mode+' · 相交 '+r.pairs.length+' / 折面 '+r.folds.length+' / 退化 '+r.deg+'；锁定主体顶点位移 0'}for(let b of document.querySelectorAll('[data-a]'))b.onclick=()=>{az=+b.dataset.a*Math.PI/180;draw()};for(let b of document.querySelectorAll('[data-m]'))b.onclick=()=>{mode=b.dataset.m;draw()};for(let k of ['wire','white','ears'])$(k).onchange=draw;$('view').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.012;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('view').onpointerup=$('view').onpointercancel=()=>drag=null;try{let [a,b,t]=await Promise.all(['./hip-retopo-v13-asset.json','./joint-only-v15-bindings.json','./grounded-joint-v15-target.json'].map(async u=>{let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));M=a.mesh;B=b;T=t;setup(M,null);draw()}catch(e){$('status').textContent=e.message}</script></html>
