<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#d8dade" />
<title>卡牌战斗 · 正面九宫格编队</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden}
body{background:#d8dade;color:#30353b}
#viewport{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:default;outline:0}
#viewport:active{cursor:default}
.toolbar{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch;pointer-events:none;z-index:4;max-width:135px}
.toolbar>*{pointer-events:auto}
.toolbar a,.toolbar button{border:1px solid #b9bec6c9;border-radius:8px;background:#fffefeee;color:#3d4249;min-height:37px;padding:8px 11px;text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px #34393e14;white-space:nowrap}
.toolbar button:hover,.toolbar a:hover{background:#fff}
.toolbar button.active{background:#353b42;color:#fff;border-color:#353b42}
.toolbar .headline{display:none}
.toolbar a,.toolbar button{width:100%;text-align:center}
.toolbar .headline{padding:8px 12px;border:1px solid #ffffffb8;border-radius:8px;background:#f8f9f9eb;font-size:13px;font-weight:650;pointer-events:none}
.hint{position:fixed;left:14px;bottom:14px;background:#fffedddd;color:#525961;border:1px solid #ffffffa6;border-radius:8px;padding:9px 12px;font-size:12px;pointer-events:none;line-height:1.55}
.legend{position:fixed;right:14px;bottom:14px;background:#fffedddd;border:1px solid #ffffffa6;border-radius:8px;padding:9px 13px;font-size:12px;pointer-events:none;line-height:1.55;text-align:right}
.legend b{display:block;font-size:13px}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 16px;background:#fffffff0;border-radius:9px;font-size:14px;color:#51565a;box-shadow:0 4px 20px #0002}
#loading[hidden]{display:none}
.error-note{position:fixed;top:95px;left:14px;right:14px;display:none;padding:10px 12px;background:#fff9ef;color:#78452d;border-radius:8px;font-size:13px}
.error-note.visible{display:block}
#card-peek[hidden]{display:none}
#card-peek{position:fixed;z-index:5;pointer-events:none;background:#fff;border:7px solid #fff;border-radius:14px;box-shadow:0 16px 44px #171b2255;overflow:hidden}
#card-peek img{display:block;width:100%;aspect-ratio:2/3;object-fit:contain;background:#f6f5f1;border-radius:8px}
#card-peek-label{text-align:center;padding:6px 4px 2px;color:#45484c;font-size:12px;line-height:1.3}
#card-inspect[hidden]{display:none}#card-inspect{position:fixed;inset:0;background:#111c;display:grid;place-items:center;z-index:9;cursor:zoom-out;padding:24px}
#card-inspect .viewer{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;max-height:100%;max-width:95%;cursor:default}
#card-inspect img{display:block;max-height:min(83vh,920px);max-width:95vw;width:auto;height:auto;object-fit:contain;border-radius:13px;box-shadow:0 10px 36px #0007;background:#fff}
#card-inspect .caption{font-size:13px;color:#fff}#card-inspect button{position:absolute;right:0;top:-38px;border:0;background:#fff;color:#333;padding:7px 12px;border-radius:7px;cursor:pointer}
@media(max-width:850px){.toolbar{gap:5px;top:8px;left:8px;max-width:102px}.toolbar a,.toolbar button{padding:6px 7px;font-size:11px;min-height:30px}.hint{bottom:8px;left:8px;font-size:10px;max-width:64%;padding:6px 8px}.legend{font-size:10px;bottom:8px}.legend b{font-size:11px}}
@media(hover:none){#card-peek{display:none}}
</style>
</head>
<body>
<canvas id="viewport" aria-label="固定无透视卡牌编队：宽屏猎人和马戏团左右两组九宫格，窄屏上下两组，每组七张牌和两个空位"></canvas>
<nav class="toolbar" aria-label="3D卡牌试验操作">
  <a href="../">← 返回主页</a>
  <span class="headline">猎人团 7 / 9　｜　马戏团 7 / 9　·　正面无透视</span>
  
  
  
  
  <button id="view-outline" type="button" aria-pressed="false">显示卡位</button>
  <a href="./whitebox_tabletop_3d.glb" download>桌面 GLB</a>
</nav>
<div id="loading" role="status">正在载入两组原始卡牌…</div>
<div id="error" class="error-note" role="alert"></div>
<div class="hint">猎人 7/9　·　马戏团 7/9<br>正面无透视 · 悬停放大 · 点击看原图</div>
<div id="card-peek" hidden aria-hidden="true"><img id="card-peek-image" alt=""><div id="card-peek-label"></div></div>

<div id="card-inspect" hidden role="dialog" aria-label="查看高清卡牌"><div class="viewer"><button data-close-inspect type="button" aria-label="关闭">关闭 ×</button><img id="card-inspect-image" alt="卡牌高清原图"><div class="caption" id="card-inspect-label"></div></div></div>
<script type="module" src="./scene.js?v=frontal-grid-fit-20261113"></script>
</body>
</html>
