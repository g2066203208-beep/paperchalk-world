<title>纸牌时序 · 暗木桌战斗</title>
<style>
:root{color-scheme:dark;font-family:ui-serif,Georgia,"Noto Serif SC","Songti SC","Microsoft YaHei",serif;--ink:#140f0c;--paper:#d6b985;--paper-light:#efddb8;--gold:#d4a361;--red:#a85349;--soft:#d5b98a;--wood:url('');font-synthesis:none}

.board-top{position:absolute;inset:0;border-radius:20px 19px 30px 28px;transform:rotateX(13deg) translateZ(-2px);transform-origin:50% 58%;overflow:hidden;background:linear-gradient(105deg,#27160f,#55301a 15%,#382015 45%,#4c2a18 74%,#21140e);border:8px solid #25160f;box-shadow:0 28px 0 2px #1a100b,0 44px 0 -4px #100a08,0 70px 65px #000c,inset 0 0 0 2px #76513955,inset 0 0 90px #080605aa}

.portrait:after{content:"";position:absolute;inset:5px;box-shadow:inset 0 0 23px #2e140f55;pointer-events:none;border:1px solid #51372355}

.unit-label{display:flex;align-items:center;gap:9px;white-space:nowrap;background:#130c08c9;color:#d7b98b;padding:6px 14px;border:1px solid #ac7b4566;box-shadow:0 3px 13px #0008;font-size:clamp(11px,1.05vw,14px);letter-spacing:.02em;min-width:120px;justify-content:center}
.hp{font-variant-numeric:tabular-nums;font-size:12px;color:#edd4a2}.hp b{color:#e9a88a}

.plaque-header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#cba374;margin:0 0 8px;letter-spacing:.10em}

.tick-row.header .tick{background:none;border:0;box-shadow:none;min-height:18px;color:#bb9671;font-size:10px;text-shadow:0 1px 1px #000}

.status-note{position:absolute;z-index:8;top:64.5%;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.02em;white-space:nowrap;color:#e7c293c9;text-shadow:0 2px 4px #000;text-align:center;max-width:75%;overflow:hidden;text-overflow:ellipsis}
.interface-top{position:absolute;z-index:20;left:clamp(12px,3vw,52px);right:clamp(12px,3vw,52px);top:clamp(8px,1.7vh,22px);display:flex;justify-content:space-between;gap:12px;align-items:center;color:#c4a785;pointer-events:none}

.nameplate{font-size:15px;letter-spacing:.11em;text-shadow:0 2px 4px #000b}

.hand{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(2px,.6vw,12px);pointer-events:none}
.action-card{--angle:0deg;--lift:0px;--tilt-x:0deg;--tilt-y:0deg;flex:0 1 auto;pointer-events:auto;position:relative;width:clamp(124px,10.4vw,172px);height:clamp(175px,15.6vw,247px);padding:10px 10px 12px;background:#cbaa78;color:#22150e;border:2px solid #2d1c12;border-radius:3px;box-shadow:0 5px 0 #66503a,1px 14px 18px #000a,inset 0 0 0 3px #e6d3a2,inset 0 0 20px #8b6d3e55;transform:translateY(calc(22px + var(--lift))) rotate(var(--angle)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));transform-origin:50% 93%;transition:transform .22s cubic-bezier(.15,.8,.2,1),box-shadow .17s,filter .17s;display:flex;flex-direction:column;align-items:stretch;gap:7px;touch-action:none;user-select:none}
.action-card:before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--paper-texture);background-size:cover;mix-blend-mode:multiply;opacity:.65;pointer-events:none}

.action-card.dragging{opacity:.25;--lift:-4px}

.action-card .sigil{flex:1;min-height:55px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;color:#543624;text-shadow:0 2px #f3e3bf;filter:drop-shadow(0 2px 0 #846a47)}
.action-card .desc{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;line-height:1.3;text-align:center;min-height:27px;max-height:46px;overflow:hidden;color:#55371d}

.action-card.attack .sigil{color:#833b29}.action-card.defense .sigil{color:#36574b}.action-card.skill .sigil{color:#534527}

.table-button{background:linear-gradient(140deg,#72502d,#39261a 55%,#24160f);border:2px solid #b78d55;color:#f3dfb4;border-radius:3px;padding:12px 20px;font-size:clamp(13px,1.1vw,17px);font-weight:750;letter-spacing:.12em;box-shadow:0 5px 0 #1a100a,0 10px 22px #000b,inset 0 2px 1px #ceaa7259;transition:transform .12s,box-shadow .12s}

/* Inscription-style tactile art pass: aged paper, etched wood, warm spot lighting.
   No borrowed assets or copied Inscryption cards. */
.stage{background:radial-gradient(ellipse 62% 73% at 50% 41%,#493224 0%,#1c1612 63%,#090808 100%)}
.board-perspective{perspective:1130px;top:13.5%;bottom:9%}
.board-top{
  transform:rotateX(20deg) translateZ(-4px);
  border-color:#281a12;
  box-shadow:0 8px 0 #734b2b,0 22px 0 #29170e,0 34px 2px #170e0a,0 75px 62px #000d,
    inset 0 0 0 2px #b78b5840,inset 0 0 68px #100905a6;
}
.board-top:after{
  background:radial-gradient(ellipse 68% 72% at 49% 39%,#e0a55e3c 0%,#ca823019 56%,transparent 87%),
    linear-gradient(90deg,#08050478 0%,transparent 16%,transparent 84%,#0b070681 100%),
    linear-gradient(180deg,#08050336 0%,transparent 23%,transparent 76%,#0b06064d);
}
.ambient{background:radial-gradient(ellipse 53% 62% at 48% 42%,#f3b46329 0%,transparent 76%),
 radial-gradient(ellipse 40% 65% at 83% 40%,#a5443227 0%,transparent 82%)}
.lamp-glow{opacity:.92;filter:blur(17px) brightness(1.4)}
.timeline-plaque{background:linear-gradient(160deg,#251b15e9,#140f0cdd);
 border:2px solid #977045;box-shadow:0 3px 0 #1a0e09,0 13px 23px #000a,inset 0 1px 0 #dbaf725e}
.plaque-header{color:#f1ce93;font-size:12px}
.tick-row.header .tick{color:#edc894;font-size:12px}
.tick-label{color:#f0c38a}
.tick{border-color:#aa825449;color:#eed8ab;background:linear-gradient(150deg,#423021de,#2b1d15e0)}
.tick.empty{box-shadow:inset 0 0 0 1px #6a49303b,inset 1px 2px 4px #140d0b,0 1px 2px #0008}
.tick.can-drop.empty{border:1px dashed #c19b5c95}
.tick.can-drop.empty:hover{box-shadow:0 0 16px #e6ae5580,inset 0 0 7px #d4a85b55}
.unit-label{color:#efd4a2;border-color:#c1995b80;font-weight:700;box-shadow:0 4px 12px #000b}
.hp{color:#f8dbae}.hp b{color:#f1b49a}
.action-card{background:#d3b88b;box-shadow:0 5px 0 #73563a,1px 15px 20px #000b,
 inset 0 0 0 3px #ead7a6,inset 0 0 35px #7552355c}
.action-card:after{inset:7px;border:2px double #745337a6}
.action-card .type{font-weight:700;color:#694528}
.action-card strong{font-family:Georgia,"Songti SC","Microsoft YaHei",serif;color:#28160d;letter-spacing:.025em}
.action-card .sigil{
  position:relative;min-height:65px;
  color:#59361e;filter:drop-shadow(0 2px 0 #f0d8ad);
}
.action-card .sigil:before{
 content:"";position:absolute;width:67px;height:67px;border:1px solid #714b2a75;border-radius:50%;
 background:radial-gradient(circle at 50% 50%,#eed3a248,#b88d5933 70%,transparent 73%);
 box-shadow:inset 0 0 9px #5e3e1a33;
}
.action-card .sigil svg{position:relative;width:66px;height:66px;max-height:100%;stroke:currentColor;
 fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(1px 1px 0 #f8e0ad)}
.action-card.attack .sigil{color:#7d3828}
.action-card.defense .sigil{color:#3e6258}
.action-card.skill .sigil{color:#5a4829}
.action-card .desc{font-weight:500;color:#3d281c}
.action-card .ticks{border-top-color:#775a39aa}
.action-card:hover{filter:brightness(1.06)}
.action-card.selected{filter:brightness(1.10)}
.interface-top{top:clamp(12px,2vh,25px)}
.nameplate{color:#f0d2a2;text-shadow:0 3px 7px #000}
.stat{color:#f3d0a0}.stat b{color:#ffe0a5}
.table-button{box-shadow:0 5px 0 #1a100a,0 10px 22px #000b,0 0 18px #df9d4033,inset 0 2px 1px #ceaa7259}
.stage:before{
 content:"";position:absolute;inset:0;z-index:17;pointer-events:none;
 background-image:url('../assets/ui/horror-analog-grain-tile.png');background-repeat:repeat;
 background-size:250px 250px;opacity:.06;mix-blend-mode:screen;
}
@media(min-width:651px){
 .fighter.enemy{left:71%;top:3.5%}
 .fighter.ally{left:16%;top:55%}
 .timeline-plaque{top:41%;left:54%;width:min(82%,1010px)}
 .tick{min-height:48px}
 .hand-surface{bottom:34px}
 .action-card{transform:translateY(calc(18px + var(--lift) + var(--fan,0px))) rotate(var(--angle))
 rotateX(var(--tilt-x)) rotateY(var(--tilt-y))}
}
@media(max-width:650px){
 .board-perspective{top:12%;bottom:16%;left:0;right:0}
 .board-top{transform:rotateX(9deg)}
 .fighter.enemy{left:50%;top:3%}
 .fighter.ally{left:50%;top:55%}
 .fighter.ally .portrait{width:80px;height:110px}
 .timeline-plaque{left:50%;top:33%;width:96%}
 .tick{min-height:34px;font-size:10px}
 .tick-row.header .tick{font-size:10px}
 .hand-surface{bottom:105px}
 .action-card{height:136px;transform:translateY(calc(0px + var(--lift) + var(--fan,0px))) rotate(var(--angle))
 rotateX(var(--tilt-x)) rotateY(var(--tilt-y))}
 .action-card .sigil{min-height:30px}
 .action-card .sigil:before{width:35px;height:35px}
 .action-card .sigil svg{width:35px;height:35px}
 .action-card .desc{min-height:20px}
 .action-card .ticks{gap:2px}
}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="第一人称暗木桌 1v1 纸牌时间步战场">
 <div class="back-wall" aria-hidden="true"></div><div class="overhang" aria-hidden="true"></div><div class="opponent-shadow" aria-hidden="true"></div>
 <div class="lamp-wire" aria-hidden="true"></div><div class="lamp" aria-hidden="true"></div><div class="lamp-glow" aria-hidden="true"></div><div class="ambient" aria-hidden="true"></div>
 <div class="board-perspective" id="board">
  <div class="board-top">
   <div class="board-seam seam-a"></div><div class="board-seam seam-b"></div><div class="board-nails"></div>
   <div class="engrave engrave-top">— NIGHT TABLE / NO. 01 —</div><div class="engrave engrave-middle">· · · · · · · · · ·</div>
   <span class="zone-caption caption-enemy">ENEMY</span><span class="zone-caption caption-ally">ALLY</span>
   <div class="fighter enemy" id="enemy-fighter">
    <div class="portrait" id="enemy-portrait"><img src="../assets/cards/wonder-circus/01_ringmaster.png" alt="GitHub 已有马戏团团长卡牌"><span class="fallback">原图加载失败</span></div>
    <div class="unit-label"><span>马戏团 · 团长</span><span class="hp">♥ <b id="enemy-hp">65</b></span></div>
   </div>
   <div class="timeline-plaque">
    <div class="plaque-header"><span>时间刻痕 / 10 STEPS</span><span id="phase">规划中 · 时间暂停</span></div>
    <div class="timegrid" id="timeline" aria-label="敌我共享的10格时间轴"></div>
   </div>
   <div class="status-note" id="status" role="status">从下方拿起行动卡，再选择时间格</div>
   <div class="fighter ally" id="ally-fighter">
    <div class="portrait" id="ally-portrait"><img src="../assets/characters/monster-hunters/01-legendary-hunter.png" alt="GitHub 怪物猎人传奇猎人原画"><span class="fallback">原图加载失败</span></div>
    <div class="unit-label"><span>猎人 · 传奇猎人</span><span class="hp">♥ <b id="ally-hp">77</b></span></div>
   </div>
  </div>
 </div>
 <div class="table-edge-light" aria-hidden="true"></div>
 <div class="candle" aria-hidden="true"><div class="candle-base"></div><div class="candle-body"></div><div class="candle-flame"></div></div>
 <div class="interface-top">
  <div class="nameplate">纸牌时序<small>ONE ON ONE · TIMEGRID</small></div>
  <div class="top-controls"><span class="round" id="round">第 1 轮</span><button type="button" id="sound" aria-pressed="true">音效：开</button><button id="restart" type="button">重开</button><button type="button" id="back">返回</button></div>
 </div>
 <div class="hand-surface" id="hand-surface"><div class="hand-header" id="hand-count">手牌 · 4</div><div class="hand" id="hand" aria-label="可操作的行动手牌"></div></div>
 <div class="side-desk left"><div class="stat">绝杀能量 <b id="energy">55</b> / 100</div><button class="minor-button" id="undo" type="button">取回上一张</button><div class="bottom-note" id="notice">先排动作 · 再执行</div></div>
 <div class="side-desk right"><div class="stat" id="round-phase">10 格同步结算</div><button class="table-button" id="execute" type="button">执行时间步</button><div class="bottom-note" id="last-event" aria-live="polite">敌人的行动已刻在木板上</div></div>
 <div class="toast" id="toast" role="status" hidden></div>
</main>
