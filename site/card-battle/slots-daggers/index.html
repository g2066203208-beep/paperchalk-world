<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191c17">
<title>Slots &amp; Daggers · 原创机台习作</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111612;color:#e8c77e;font-family:'Courier New',monospace}body{overscroll-behavior:none}main{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;isolation:isolate;background:#192019}#glass{width:100%;height:100%;display:block;touch-action:none;user-select:none}#keys{position:absolute;inset:0;pointer-events:none}#keys button{position:absolute;pointer-events:auto;appearance:none;border:0;color:transparent;background:transparent;touch-action:manipulation;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}#keys button:focus-visible{outline:2px solid #fff0b6;outline-offset:0;border-radius:4px}button[hidden]{display:none!important}.sr{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden;white-space:nowrap}
#loading{position:absolute;inset:0;display:grid;place-content:center;letter-spacing:.15em;background:#151914}#loading[hidden]{display:none}
dialog{border:3px ridge #72664a;box-shadow:0 12px 48px #050906bd,inset 0 0 34px #111910;border-radius:5px;background:repeating-linear-gradient(0deg,#273025 0 2px,#2b3327 3px 4px);color:#ead29b;width:min(420px,90vw);padding:20px 24px 18px}dialog::backdrop{background:#090d0abb}dialog h1{font-size:21px;margin:0 0 6px;color:#f0d28c}dialog p{font:14px/1.6 system-ui,sans-serif;color:#ded1b7;margin:10px 0}dialog .notes{font-size:11px;color:#b5b097;margin:16px 0 0}dialog button,dialog select{font:inherit;margin:4px 2px;padding:7px 11px;color:#f2d79e;background:#3b3e2d;border:2px outset #796c50;border-radius:2px;cursor:pointer}dialog label{display:block;color:#d4c19c;font:13px/1.5 system-ui,sans-serif;margin:9px 0}dialog a{color:#e9c981}#menuResume{background:#614b30}


/* WORK's compact, brass-edged page selector, separate from the original game canvas. */
.work-arcade-pages{position:fixed;z-index:110;top:max(7px,env(safe-area-inset-top));right:max(7px,env(safe-area-inset-right));display:flex;align-items:center;gap:3px;padding:3px;background:linear-gradient(180deg,#394336ef,#171e17f5);border:1px solid #9a8357;border-radius:5px;box-shadow:inset 0 1px 0 #e3cf9a52,inset 0 -2px 0 #0b140f,0 3px 13px #080f0ad4;font:600 11px/1.1 monospace;letter-spacing:.025em;pointer-events:auto;isolation:isolate}
.work-arcade-pages a{display:grid;place-items:center;min-height:32px;padding:5px 10px;border-radius:3px;text-decoration:none;color:#bdb69d;border:1px solid transparent;-webkit-tap-highlight-color:transparent;white-space:nowrap;touch-action:manipulation}
.work-arcade-pages a[aria-current="page"]{background:linear-gradient(180deg,#786441,#51462f);border-color:#c6aa6c;color:#ffe3a3;text-shadow:0 1px 2px #150e05}
.work-arcade-pages a:not([aria-current]):hover,.work-arcade-pages a:focus-visible{color:#ffe7ad;border-color:#aa9469;background:#283a2b;outline:2px solid #e0c68e;outline-offset:1px}
@media(max-width:430px){.work-arcade-pages{top:max(5px,env(safe-area-inset-top));right:max(5px,env(safe-area-inset-right));padding:2px}.work-arcade-pages a{min-height:36px;padding:5px 7px;font-size:10px}}

</style></head><body>
<nav class="work-arcade-pages" aria-label="Work 游戏机页面"><a href="./index.html" aria-current="page">① 原老虎机</a><a href="./coin-pusher/index.html" >② 推币塔</a></nav>

<main id="cabinet"><canvas id="glass" aria-label="可操作的机械卷轴战斗机台"></canvas><div id="keys" aria-label="机台按键"></div><p id="status" class="sr" role="status" aria-live="polite"></p><div id="loading" role="status">正在装入机台…</div></main>
<dialog id="settings"><h1>机台手册</h1><p>点 STOP 停下当前卷轴。三个相邻图案相同会暴击。出现 GO 时，让指针落在金色刻度。空格和回车也能操作。</p><p>胜利后点符号购买升级。下方可补血、买护甲或提高生命上限，右侧三角键前往下一战。</p>
<label>练习遭遇 <select id="encounter" aria-label="选择练习遭遇"></select></label>
<button id="practice">从此开局</button><button id="sound">声音 · 开</button><button id="menuResume" autofocus>继续</button>
<p class="notes">本作是独立制作的非官方习作。机壳、铸币、符号、场景、角色和声音均由本页代码生成。参考游戏为 Friedemann 的《Slots &amp; Daggers》。</p></dialog>

<script src="pixel-type.js"></script>
<script src="cabinet-art.js"></script>
<script src="world-art.js"></script>
<script src="coin-art.js"></script>
<script src="reel-art.js"></script>
<script src="light-field.js"></script>
<script src="effects.js"></script>
<script src="graphics.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body></html>
