<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#000000"><title>WORK · 黑室监视终端</title>
<style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#000;color:#d7bb7a}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;background:#000;outline:0;touch-action:none}
#scene:focus-visible{outline:2px solid #c9aa65;outline-offset:-4px}
#sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head><body>
<canvas id="scene" tabindex="0" aria-label="WORK 三维监视电视，黑色空间中仅有一台金属电视。拖动查看实体厚度，点击旋钮开关机"></canvas>
<div id="sr" role="status" aria-live="polite"></div>
<script src="../cabinet-art.js"></script>
<script src="television.js"></script>
</body></html>
