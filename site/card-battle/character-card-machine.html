<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141316">
<title>七席牌桌 · 人物卡战斗</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;--bg:#121317;--panel:#1d1e23;--ink:#efede7;--muted:#9a9ca4;--line:#58565a;--gold:#b9a47b;--red:#623a48;--felt:#222c2c;--green:#789e92}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#292429,#111317 75%);color:var(--ink);min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
button:disabled{opacity:.39;cursor:not-allowed}
button:focus-visible{outline:3px solid #e0cc94;outline-offset:2px}
a{color:#d6c6a4;text-decoration:none}
main{max-width:1350px;margin:0 auto;padding:12px clamp(8px,2vw,24px) 24px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 10px}
.brand h1{font-size:clamp(18px,2vw,27px);margin:0;font-weight:720;letter-spacing:.08em}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.links{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.links button,.controls button,.preview-actions button{background:#2b2930;border:1px solid #6a6160;padding:9px 12px;border-radius:6px;min-height:39px}
.links button:hover,.controls button:hover{border-color:#c1aa7e}
.board{padding:12px clamp(8px,1.8vw,24px) 14px;border-radius:12px;border:1px solid #494c4c;position:relative;background:radial-gradient(ellipse at 50% 60%,#32403d 0,#222a2b 52%,#181c20 100%);box-shadow:0 18px 60px #0007,inset 0 0 0 1px #ffffff08;overflow:hidden}
.board:before{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background:repeating-linear-gradient(112deg,transparent 0px,transparent 5px,#a09e8933 6px,transparent 7px)}
.board>*{position:relative}
.board-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 0 8px;border-bottom:1px solid #77786d42;margin-bottom:9px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 9px;background:#171b1cbf;border:1px solid #65655d80;border-radius:5px;font-size:11px;color:#e4e1d8}
.board-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.08em;margin:0 0 6px}
.board-label.enemy{color:#e7a9a9}.board-label.ally{color:#a7d6c5}
.board-label span:last-child{font-weight:400;letter-spacing:0;color:#b7b7b4}
.seats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,.65vw,10px);justify-items:center;align-items:center}
.seat{width:100%;max-width:121px;aspect-ratio:0.7;min-height:0;padding:0;position:relative;border:1px solid #78766d88;border-radius:6px;background:linear-gradient(155deg,#151c1df2,#272a2a);box-shadow:inset 0 0 0 3px #090a0b55,0 2px 9px #0008;overflow:hidden;display:block;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.seat[data-occupied="false"]{border:1px dashed #988c786a;background:repeating-linear-gradient(-45deg,#20282a 0,#20282a 8px,#252e2e 8px,#252e2e 16px)}
.seat[data-occupied="true"]{border:1px solid #8b8172;background:linear-gradient(150deg,#665058,#392f35)}
.seat:hover{transform:translateY(-3px);border-color:#d0ba8e}
.seat[data-selectable="true"]{border:2px solid #e5c689;box-shadow:0 0 15px #d9ae6447,inset 0 0 0 2px #ffffff28}
.seat[data-target="true"]{border-color:#93d2bb;box-shadow:0 0 13px #9af7ca52}
.seat.is-fallen{filter:saturate(.25);opacity:.5}
.seat img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:linear-gradient(155deg,#8b716a,#493644)}
.seat-num{position:absolute;left:4px;top:4px;font-size:10px;color:#b4b2aa;opacity:.8}
.seat-empty{position:absolute;inset:0;display:grid;place-items:center;color:#828b89;font-size:clamp(9px,1.5vw,13px);text-align:center;letter-spacing:.1em}
.seat-name{position:absolute;left:0;right:0;bottom:0;padding:15px 2px 3px;background:linear-gradient(transparent,#0b0b10ea);font-weight:700;font-size:clamp(8px,.95vw,12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-stats{position:absolute;top:3px;right:3px;display:flex;flex-direction:column;gap:3px}
.seat-hp,.seat-shield{background:#151419ed;padding:2px 3px;border-radius:3px;font-size:clamp(8px,.75vw,11px);font-weight:700;box-shadow:0 0 2px #000}
.seat-hp{color:#ffe0ca}.seat-shield{color:#a9daed}
.mid{height:clamp(58px,10vh,103px);margin:9px 0;position:relative;display:grid;place-items:center;border-top:1px solid #8b8c7c30;border-bottom:1px solid #8b8c7c30}
.mid:before{content:"";position:absolute;left:1%;right:1%;top:50%;border-top:1px dashed #a1b5a448;pointer-events:none}
.mid .cue{position:relative;background:#151a1bdd;padding:8px 13px;border:1px solid #79807970;border-radius:5px;max-width:94%;text-align:center;min-width:min(370px,94%)}
.mid .cue strong{display:block;font-size:clamp(11px,1vw,15px);color:#e8e0cb}
.mid .cue small{display:block;color:#aab5ae;margin-top:3px;font-size:10px;line-height:1.5}
.bottom{display:grid;gap:9px;padding-top:12px}
.tool-label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#b9b7b6;font-size:11px;letter-spacing:.04em}
.tool-label strong{color:#ede4d1;font-size:13px}
.rail{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;scrollbar-color:#777064 transparent;min-height:55px}
.reserve{width:82px;flex:0 0 82px;height:112px;position:relative;background:#322d32;border:1px solid #7c7166;border-radius:6px;padding:0;overflow:hidden;text-align:center;box-shadow:0 3px 10px #0007}
.reserve img{width:100%;height:100%;object-fit:contain;display:block;background:linear-gradient(140deg,#75615c,#34282e)}
.reserve .tag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#090b0def);padding:9px 2px 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reserve[data-selected="true"]{border:2px solid #e5c98a;transform:translateY(-3px)}
.reserve[data-deployed="true"]{filter:saturate(.35);opacity:.48}
.reserve[data-deployed="true"]:after{content:"已上场";position:absolute;top:37%;left:0;right:0;font-size:11px;background:#111a1bcb;padding:4px 0}
.decks{display:flex;gap:7px;overflow-x:auto;padding:3px 0 7px;min-height:65px}
.deck{position:relative;display:flex;align-items:center;gap:8px;min-height:58px;flex:0 0 148px;text-align:left;border:1px solid #857765;background:#322c2e;border-radius:6px;padding:5px 8px}
.deck img{width:33px;height:47px;object-fit:cover;border-radius:3px;border:1px solid #b59f79}
.deck strong{display:block;font-size:11px;white-space:nowrap;max-width:85px;overflow:hidden;text-overflow:ellipsis}
.deck small{display:block;font-size:10px;color:#b4a9a3;margin-top:4px}
.hand{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 12px;min-height:98px}
.action{flex:0 0 122px;height:141px;text-align:left;border:1px solid #867762;border-radius:6px;background:linear-gradient(#65505a,#352e33 32%,#27242a);padding:9px 8px;position:relative;box-shadow:0 3px 10px #0006;transition:transform .12s}
.action .owner{font-size:10px;color:#ddc9ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action strong{display:block;margin:13px 0 7px;font-size:15px}
.action small{display:block;color:#d3ced0;font-size:10px;line-height:1.5}
.action .cost{position:absolute;right:6px;top:6px;border:1px solid #cfac75;border-radius:50%;padding:2px 6px;font-size:12px}
.action[data-selected="true"]{transform:translateY(-5px);outline:2px solid #dbc08e;outline-offset:0}
.action:disabled{opacity:.5}
.rail-empty{color:#898e92;font-size:12px;align-self:center;padding:10px 3px}
.controls{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.controls .primary{background:#bba274;color:#17181a;border:1px solid #e8d7a8;font-weight:800}
.controls small{color:#a9a9a7;font-size:11px}
#notification{color:#ded0b2;font-size:12px;min-height:24px;padding:3px 0;line-height:1.5}
.log{border-top:1px solid #65615b66;padding:10px 0;color:#aaa9aa;font-size:11px;line-height:1.65}
.log ul{list-style:none;padding:0;margin:5px 0;max-height:100px;overflow:auto}
.log li{border-left:2px solid #775c5c;padding-left:8px;margin:5px 0}
#preview[hidden]{display:none}
#preview{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#08090bd9;padding:15px;backdrop-filter:blur(6px)}
.preview-card{width:min(420px,94vw);max-height:92dvh;display:flex;flex-direction:column;align-items:center;background:#222026;border:1px solid #958472;border-radius:12px;padding:12px;box-shadow:0 18px 90px #000b}
.preview-card img{display:block;max-height:min(68dvh,690px);max-width:100%;aspect-ratio:704/1024;object-fit:contain;background:linear-gradient(135deg,#8d6869,#39292e);border-radius:6px}
.preview-card h2{font-size:16px;margin:8px 0}
.preview-actions{display:flex;justify-content:center}
#ghost{position:fixed;z-index:99;pointer-events:none;width:85px;height:120px;object-fit:contain;opacity:.88;border-radius:4px;transform:translate(-50%,-50%) rotate(-6deg);filter:drop-shadow(0 12px 18px #000a)}
#ghost[hidden]{display:none}
@media(min-width:1100px){.bottom{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);column-gap:18px}.reserve-section{grid-column:1}.deck-section{grid-column:2}.hand-section,.controls,.log{grid-column:1/-1}}
@media(max-width:600px){
 main{padding:6px 6px 12px}
 .top{margin-bottom:6px}.brand h1{font-size:17px}.brand small{font-size:10px}.links{gap:8px;font-size:10px}
 .links a:nth-child(2){display:none}
 .board{padding:7px 5px 8px;border-radius:7px}
 .board-status{font-size:10px;padding-bottom:5px;margin-bottom:6px;gap:5px}
 .chip{font-size:9px;padding:4px 5px}
 .board-label{font-size:10px;margin-bottom:4px}
 .board-label span:last-child{font-size:9px}
 .seats{gap:3px}
 .seat{border-radius:4px}
 .seat-name{font-size:8px;padding:10px 1px 2px}
 .seat-hp,.seat-shield{font-size:8px;padding:1px 2px}
 .seat-stats{top:2px;right:2px;gap:2px}
 .seat-num{font-size:8px;top:1px;left:1px}
 .seat-empty{font-size:8px}
 .mid{height:53px;margin:6px 0}
 .mid .cue{padding:6px 7px}.mid .cue strong{font-size:11px}.mid .cue small{font-size:9px}
 .bottom{gap:5px;padding-top:8px}
 .tool-label{font-size:9px}.tool-label strong{font-size:11px}
 .reserve{width:62px;flex-basis:62px;height:88px}
 .deck{flex-basis:124px;min-height:53px}
 .hand{min-height:90px}
 .action{flex-basis:103px;height:122px;padding:7px 6px}
 .action strong{font-size:13px;margin:10px 0 6px}
 .action small{font-size:9px}
 .controls button{font-size:11px;min-height:36px;padding:7px 9px}
 .log{padding-top:5px}
}
@media(orientation:landscape) and (max-height:480px){
 .brand small{display:none}.top{margin-bottom:2px}
 .board{padding-top:3px;padding-bottom:4px}
 .board-status{margin-bottom:3px;padding-bottom:3px}
 .board-label{margin-bottom:2px}
 .seat{max-width:75px}
 .mid{height:33px;margin:3px 0}
 .mid .cue{padding:2px 8px}
 .mid .cue small{display:none}
 .bottom{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 8px}
 .reserve-section{grid-column:1}.deck-section{grid-column:2}
 .hand-section,.controls,.log{grid-column:1/-1}
 .reserve{flex-basis:46px;width:46px;height:65px}
 .action{height:100px}
 .log{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* Seven fixed seats may never cause the WHOLE mobile viewport to grow. */
html,body{width:100%;max-width:100%;overflow-x:clip}
main{width:100%;min-width:0}
main>.board,main>.bottom,main>.top,.board-status,.board-label,.seats{min-width:0;max-width:100%}
.bottom{width:100%;min-width:0;grid-template-columns:minmax(0,1fr)}
.bottom>*{min-width:0;max-width:100%}
.rail,.decks,.hand{width:100%;max-width:100%;min-width:0}
.tool-label{min-width:0;flex-wrap:wrap;row-gap:2px}
.tool-label>*{min-width:0}
.controls{min-width:0;max-width:100%}
.controls small{flex:1 1 150px}
@media(max-width:600px){
 .tool-label>strong{font-size:10px}
 .tool-label>span{text-align:right}
 .reserve-section,.deck-section,.hand-section{overflow:hidden}
}

/* Seven-character tabletop, inheriting the original slot's burgundy ink,
   finely grained paper, thin cardstock and neutral-gold PBR lighting. */
.board{background:
 radial-gradient(ellipse at 51% 46%,#3b4340 0,#272d2e 37%,#171a21 88%),
 repeating-linear-gradient(107deg,#ffffff02 0,#ffffff02 1px,transparent 2px,transparent 9px);
 border-color:#88765a80;box-shadow:0 20px 70px #000a,inset 0 0 26px #f4ca6240,
 inset 0 0 0 2px #100d15}
.board:before{opacity:.23;background:repeating-linear-gradient(87deg,transparent 0,transparent 18px,#ccb38b12 19px,transparent 21px)}
.board:after{content:"";position:absolute;inset:7px;pointer-events:none;border:1px solid #b3a47a20;border-radius:9px}
.board-label{color:#e2d6bc;filter:drop-shadow(0 1px 1px #0009)}
.mid{background:radial-gradient(ellipse,#a7a17b10,transparent 66%);border-color:#aeb8a63c}
.seat{box-shadow:inset 0 0 0 1px #cebea829,0 9px 15px #0007;transform-style:preserve-3d;will-change:transform}
.seat[data-occupied="true"]{background:linear-gradient(135deg,#78565a,#322a30);
 border-color:#bba584;border-bottom-color:#433136}
.seat[data-occupied="true"]:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(116deg,transparent 9%,#ffffff13 23%,transparent 38%,#f9d8a30b 66%,transparent 83%);
 mix-blend-mode:screen}
.seat img{background:linear-gradient(138deg,#aa8680,#554044 56%,#352b34);
 filter:contrast(1.035) saturate(.95)}
.seat:active{transform:translateY(2px) scale(.985)}
.seat[data-target="true"]{border-color:#d5f5c6;box-shadow:0 0 13px #6dc9c669,0 4px 13px #000c}
.seat[data-selectable="true"]{border-color:#e9cf94;box-shadow:0 0 17px #e2aa655e}
.enemy-row,.ally-row{align-items:start}
.seat-column{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;width:100%;isolation:isolate}
.seat-column>.seat{width:100%;z-index:3;flex:0 0 auto}
.person-pocket,.enemy-pocket{position:relative;width:100%;height:clamp(40px,6.7vw,87px);margin-top:-6px;
 padding:0;z-index:1;contain:layout style;filter:drop-shadow(0 6px 5px #000a)}
.enemy-pocket{height:clamp(22px,3.7vw,46px);margin-top:-4px;pointer-events:none;opacity:.78}
.person-pocket[data-empty="true"]{border:1px dashed #aea08b33;border-radius:0 0 7px 7px;
 background:linear-gradient(#f2d8a006,#070b100a)}
.pocket-deck,.pocket-mini,.pocket-open,.enemy-pile{position:absolute;border:1px solid #af946d;background:#5b3644;
 border-radius:3px;box-shadow:0 2px 3px #000a,inset 0 0 0 1px #edcc9830;min-width:0}
.pocket-deck{width:47%;height:85%;left:3%;top:4%;z-index:3;overflow:hidden;transform:rotate(-5deg);padding:0}
.pocket-deck:before,.enemy-pile:before{content:"";position:absolute;inset:auto 2px -2px 2px;height:5px;
 box-shadow:0 2px 0 #ead4b683,0 4px 0 #65574de0;z-index:-1}
.pocket-deck img,.enemy-pile img{height:100%;width:100%;object-fit:cover;display:block}
.pocket-deck .pocket-count{position:absolute;top:0;right:0;background:#131016d9;
 color:#f2e0bd;font-size:10px;padding:2px 4px;line-height:1.1;border-radius:0 0 0 3px}
.pocket-mini{width:46%;height:82%;top:8%;left:var(--offset,32%);padding:2px;
 transform:rotate(var(--angle,0deg));z-index:var(--depth,4);
 display:flex;align-items:end;justify-content:center;color:#fff3db;font-size:clamp(8px,.87vw,12px);
 overflow:hidden;line-height:1;cursor:pointer;
 background:linear-gradient(160deg,#6e4757,#2f2733 67%,#231e29)}
.pocket-mini b{background:#141018cc;border-radius:2px;padding:3px 1px;max-width:100%;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pocket-mini[data-selected="true"]{border:2px solid #f4d99e;transform:translateY(-5px) rotate(0)}
.pocket-mini .pip{position:absolute;top:2px;left:2px;font-size:9px;color:#eed3a4}
.pocket-open{width:29%;height:52%;top:47%;right:0;z-index:10;padding:1px 0;
 color:#ead8b0;font-size:clamp(9px,.9vw,12px);background:#1f2427eb;border-color:#9e8e70}
.pocket-open[data-focused="true"]{background:#76604c;border-color:#eccf9c}
.person-pocket .pocket-help{position:absolute;top:47%;left:55%;font-size:clamp(7px,.78vw,10px);color:#c1b49c;
 white-space:nowrap;pointer-events:none}
.enemy-pile{width:38%;height:82%;left:32%;top:6%;transform:rotate(3deg);border-color:#a88f73;overflow:hidden}
.enemy-pile:nth-child(2){left:38%;top:10%;transform:rotate(-5deg);opacity:.78}
.enemy-pocket .enemy-label{position:absolute;top:18%;left:2%;font-size:clamp(6px,.7vw,9px);
 color:#c8b9a0;writing-mode:vertical-rl}
.owner-fan[hidden]{display:none!important}
.owner-fan{width:min(100%,720px);margin:10px auto 2px;padding:10px 13px 13px;
 background:linear-gradient(165deg,#372d35f2,#171a20f6);border:1px solid #a69175ad;
 border-radius:9px;box-shadow:0 14px 25px #0008,inset 0 0 0 1px #ffffff0a;
 position:relative;z-index:12;animation:owner-fan-rise .2s cubic-bezier(.2,.74,.2,1) both;
 transform-origin:var(--owner-origin,50%) top}
.owner-fan:before{content:"";position:absolute;top:-7px;left:var(--owner-origin,50%);
 width:12px;height:12px;transform:rotate(45deg);background:#372d35;
 border-top:1px solid #a69175;border-left:1px solid #a69175}
.owner-fan-header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;
 font-size:12px;color:#c9bda6;position:relative}
.owner-fan-header strong{font-size:14px;color:#f0dcc2}
.owner-fan-header button{background:#28252a;border:1px solid #8b7f71;border-radius:4px;
 font-size:11px;padding:5px 8px;min-height:30px}
.owner-fan-cards{display:flex;align-items:center;gap:8px;padding:12px 2px 4px;overflow-x:auto;
 max-width:100%;scrollbar-width:thin}
.owner-fan-cards .action{height:145px;flex-basis:114px;border-radius:5px;
 transform:rotate(var(--card-tilt,0deg));transform-origin:50% 92%;
 box-shadow:0 9px 12px #0008}
.owner-fan-cards .action:hover,.owner-fan-cards .action[data-selected="true"]{
 transform:translateY(-6px) rotate(0);box-shadow:0 14px 20px #000b}
.owner-fan-cards .action:before{content:"";position:absolute;inset:3px;pointer-events:none;
 border:1px solid #d0b18a5c;border-radius:3px}
.owner-fan-cards .rail-empty{padding:16px;color:#a9a395}
@keyframes owner-fan-rise{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
.layout-legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;color:#bdbaae;font-size:11px}
.layout-legend b{display:inline-grid;place-items:center;background:#564b49;color:#f6e0b1;
 width:19px;height:19px;border-radius:50%;margin-right:4px}
.bottom{grid-template-columns:minmax(0,1fr)!important;gap:8px}
.reserve-section{width:100%;min-width:0}
.rail{justify-content:center;gap:clamp(4px,1vw,14px)}
.reserve{border-color:#a78b73;background:linear-gradient(140deg,#60414c,#342d36);
 box-shadow:0 6px 10px #0009;transform-style:preserve-3d}
.reserve:hover{transform:translateY(-6px) rotate(-2deg)}
.reserve img{filter:saturate(.96)}
/* Fullscreen transparent real WebGL physics layer; pointer-through so
   all 14 interactive target cards remain usable while a 3D card flies. */
#physical-card-fx{position:fixed;inset:0;width:100vw;height:100dvh;z-index:35;
 pointer-events:none;display:block;opacity:0;transition:opacity .1s}
#physical-card-fx[data-active="true"]{opacity:1}
.seat.hit-shock{animation:card-hit-physical .44s cubic-bezier(.2,.8,.2,1) both}
.seat.healed{animation:card-heal-pulse .62s ease-out both}
.seat.shielded{animation:card-shield-pulse .6s ease-out both}
.seat.deployed{animation:card-landing .5s cubic-bezier(.15,.8,.3,1) both}
@keyframes card-landing{0%{transform:translateY(-18px) scale(1.10);filter:brightness(1.65)}
 45%{transform:translateY(4px) scale(.98)}73%{transform:translateY(-2px) scale(1.01)}
 100%{transform:none;filter:none}}
@keyframes card-hit-physical{0%{transform:none;filter:none}
 24%{transform:translate(-6px,3px) rotate(-3deg);filter:brightness(2)}
 44%{transform:translate(4px,-2px) rotate(2deg)}
 65%{transform:translate(-1px,1px) rotate(-1deg)}100%{transform:none;filter:none}}
@keyframes card-heal-pulse{25%{transform:translateY(-4px);box-shadow:0 0 30px #7df8bcac}
 100%{transform:none;box-shadow:0 4px 12px #0008}}
@keyframes card-shield-pulse{35%{transform:scale(1.045);box-shadow:0 0 30px #80d7ffb5}
 100%{transform:none}}
@media(max-width:600px){
 .person-pocket{height:clamp(33px,10vw,48px);margin-top:-3px}
 .enemy-pocket{height:22px;margin-top:-3px}
 .pocket-deck .pocket-count,.pocket-mini .pip{font-size:8px;padding:1px}
 .pocket-mini b{font-size:8px;writing-mode:vertical-rl}
 .pocket-help{display:none}
 .pocket-open{font-size:9px;min-width:20px}
 .owner-fan{padding:8px 7px}
 .owner-fan-cards .action{flex-basis:97px;height:122px}
 .layout-legend{font-size:9px;justify-content:start;gap:4px}
 .layout-legend b{width:14px;height:14px;font-size:9px}
 .rail{justify-content:start}
 .reserve{width:54px;flex-basis:54px;height:78px}
}
@media(orientation:landscape) and (max-height:480px){
 .person-pocket{height:28px;margin-top:-3px}
 .enemy-pocket{height:16px}
 .owner-fan-cards .action{height:108px}
 .layout-legend{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
 .seat.hit-shock,.seat.healed,.seat.shielded,.seat.deployed{animation:none!important}
 #physical-card-fx{transition:none}
}

</style>
</head>
<body>
<main id="duel-app">
 <header class="top">
  <div class="brand"><h1>七席牌桌 <span style="color:#b9a47b">/</span> 人物卡对战</h1><small>敌我各七席 · 上场解锁角色专属卡组 · 可攻击或支援双方</small></div>
  <nav class="links"><a href="../index.html">主菜单</a><a href="./character-card-machine-legacy.html">旧人物抽卡机（归档）</a><button id="restart" type="button">重新开局</button></nav>
 </header>
 <section class="board" aria-label="七对七人物卡对阵牌桌">
  <div class="board-status">
   <span class="chips"><span class="chip" id="round-label">第 1 回合</span><span class="chip" id="energy-label">行动点 4/4</span><span class="chip" id="hand-count">手牌 0/10</span></span>
   <span class="chip" id="battle-status">正在载入真实人物原画…</span>
  </div>
  <div class="board-label enemy"><span>敌方 · 七个卡位</span><span id="enemy-count">已上场 3 / 7</span></div>
  <div class="seats enemy-row" id="enemy-seats" aria-label="敌方七个可选人物卡位"></div>
  <div class="mid" aria-live="polite"><div class="cue"><strong id="cue-title">先从下方候补打出一张人物卡</strong><small id="cue-sub">之后点击人物专属牌堆摸行动牌，可打队友或敌人</small></div></div>
  <div class="board-label ally"><span>我方 · 七个卡位</span><span id="ally-count">已上场 0 / 7</span></div>
  <div class="seats ally-row" id="ally-seats" aria-label="我方七个部署卡位，每张人物卡下面叠放其个人牌堆和手牌"></div>
  <div id="owner-fan" class="owner-fan" hidden aria-label="从所选人物卡下方展开的专属手牌">
   <div class="owner-fan-header">
    <strong id="owner-fan-name">人物专属手牌</strong>
    <span id="owner-fan-count">0 张</span>
    <button id="owner-fan-close" type="button" aria-label="把手牌叠回人物卡下面">收拢手牌 <span aria-hidden="true">⌄</span></button>
   </div>
   <div id="owner-fan-cards" class="owner-fan-cards"></div>
  </div>
 </section>
 <section class="bottom" aria-label="人物部署与行动手牌">
  <div class="reserve-section">
   <div class="tool-label"><strong>候补人物卡</strong><span>点击 / 拖到我方空席上场</span></div>
   <div class="rail" id="hero-reserve" aria-label="七张候补人物卡"></div>
  </div>
  <div class="layout-legend" aria-label="卡牌玩法说明">
   <span><b>1</b> 候补人物卡放入我方空席</span>
   <span><b>2</b> 点击人物卡下的酒红卡背抽其专属卡</span>
   <span><b>3</b> 点击叠牌展开，选行动牌施放到敌我任一目标</span>
  </div>
  <div class="controls">
   <button class="primary" id="end-turn" type="button">结束回合</button>
   <button id="inspect-selected" type="button" disabled>放大查看所选人物</button>
   <small>每位人物的牌堆和手牌都收在该人物卡下面；展开单人手牌不会打乱其他六席。</small>
  </div>
  <div id="notification" role="status" aria-live="polite">加载人物卡组…</div>
  <div class="log" aria-label="实时战斗记录"><strong>行动记录</strong><ul id="action-log"></ul></div>
 </section>
</main>
<div id="preview" hidden role="dialog" aria-modal="true" aria-label="角色原画放大预览">
 <div class="preview-card"><img id="preview-img" alt=""><h2 id="preview-name"></h2><div class="preview-actions"><button id="preview-close" type="button">关闭预览</button></div></div>
</div>
<img id="ghost" hidden alt="" aria-hidden="true">
<canvas id="physical-card-fx" aria-hidden="true"></canvas>
<script type="module" src="./seven-seat-battle.mjs?v=20261120-owner-pockets-real-3d-physics-v2"></script>
</body>
</html>
