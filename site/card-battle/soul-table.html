<main><div id="table-rim"></div><canvas id="grain" aria-hidden="true"></canvas><header><div><small>冥河渡口</small><h1>渡魂牌局</h1></div><span id="journey"></span><button id="help">桌规</button></header><section class="field"><div class="row" id="enemy"></div><div class="scores"><div class="score"><i id="myScore"></i><small>你的点数</small></div><div class="target">21</div><div class="score foe"><i id="theirScore"></i><small>亡魂点数</small></div></div><div class="row" id="player"></div><p class="message" aria-live="polite" id="message"></p><div class="actions" id="actions"></div></section><footer><a href="./coin-payout-3d.html">返回金币机</a><span id="progress"></span></footer></main>
<dialog id="rules"><h2>渡口桌规</h2><p>上下两席轮流行动。点击自己的牌堆，抽一张牌，再点空位落牌。每回合限抽一次，也可以停牌。双方停牌、牌位满或爆点后比大小，超过 21 点的一方落败。</p><p>每局可使用一次换位，交换双方最后落下的一张牌，随后亡魂行动。</p><p>A 计 1 或 11，自动取最优值。洞察位可看下张牌，灰烬位让该牌减 2 点（最低 1 点）。每局双方各押一枚魂币，平局各自取回。</p><p>赢光对手的魂币，选一项遗物再前往下一桌。过三桌即可渡河。</p><button id="closeRules">回到牌桌</button></dialog>

<script>
const el=id=>document.getElementById(id);
const suits=['♣','♦','♠','♥'], names=['守灯人','无名水手','摆渡人'], places=['芦苇岸','沉船湾','忘川'];
let stage=0,coins=4,rival=3,round=0,phase,deck,mine,theirs,pending,passed,insight,ash=2,ward=false,usedWard=false,log='';
function texture(){
 const c=el('grain'),w=c.width=1000,h=c.height=650,g=c.getContext('2d');let seed=23;
 function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
 for(let i=0;i<105000;i++){g.fillStyle=random()>.5?'rgba(0,0,0,.10)':'rgba(243,207,138,.08)';g.fillRect(random()*w,random()*h,random()*3+1,1)}
 for(let i=0;i<200;i++){let x=random()*w,y=random()*h;g.beginPath();g.moveTo(x,y);for(let j=0;j<9;j++){x+=random()*9-2;y+=random()*8-3;g.lineTo(x,y)}g.strokeStyle='rgba(35,24,15,.16)';g.stroke()}
}texture();
function shuffled(){let d=[];for(const s of suits)for(let n=1;n<=10;n++)d.push({n,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function total(hand){let t=0,a=0;for(const c of hand.filter(Boolean)){t+=c.value??c.n;if(c.n===1&&c.value===undefined)a++}return a&&t+10<=21?t+10:t}
function begin(){exchanged=false;busy=false;round++;deck=shuffled();mine=[deck.pop(),null,null,null,null];theirs=[deck.pop(),null,null,null,null];passed=false;insight=false;usedWard=false;pending=null;phase='play';log='轮到你了。点击左侧牌堆抽牌。';render();opening()}
function badge(c){return c.n===1?'A':c.n}
function card(c,i){const node=document.createElement('div');node.className='card '+('♦♥'.includes(c.s)?'red':'');node.style.setProperty('--tilt',[-3,2,-2,3,-1][i]+'deg');node.innerHTML='<b class="corner">'+badge(c)+c.s+'</b><span class="pips">'+Array.from({length:c.n},()=>'<span>'+c.s+'</span>').join('')+'</span><em>'+(c.value!==undefined?'灰烬 · '+c.value:'')+'</em>';const front=document.createElement('span');front.className='front';front.dataset.rank=badge(c)+c.s;front.append(...node.childNodes);const faces=document.createElement('span');faces.className='faces';const back=document.createElement('span');back.className='back';faces.append(front,back);node.append(faces);node.setAttribute('aria-label',badge(c)+c.s);return node}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
function row(id,hand,own){const r=el(id);r.replaceChildren();const pile=button('',draw);pile.className='pile';pile.innerHTML='<span>'+(own?(pending?badge(pending)+pending.s:'抽牌'):'亡魂')+'</span>';pile.disabled=!own||phase!=='play'||!!pending;r.append(pile);
 hand.forEach((c,i)=>{if(c){r.append(card(c,i));return}const active=own&&phase==='play'&&!!pending;const b=button(own?(['','洞察','', '灰烬',''][i]||'落牌'):'',()=>place(i));b.className='slot'+(active?' available':'');b.disabled=!active;r.append(b)});
 const seat=document.createElement('span');seat.className='seat';seat.innerHTML=(own?'旅人':names[stage])+'<b>'+(own?coins:rival)+'</b>';r.append(seat)}
const handMarkup=document.querySelector('#grip-art').innerHTML;
const stageFx=el('stage-fx');
let heldActor=null;
function actor(node,enemy){
  const shell=document.createElement('div');
  shell.className='motion-rig'+(enemy?' north':' south');
  const size=el('player').querySelector('.card,.slot');
  const w=size.offsetWidth,h=size.offsetHeight;
  shell.style.setProperty('--cw',w+'px');shell.style.setProperty('--ch',h+'px');
  shell.innerHTML='<div class="contact-shadow"></div><div class="lift"><div class="plane"></div></div><div class="wrist"><div class="palm">'+handMarkup+'</div></div>';
  const replica=node.cloneNode(true);shell.querySelector('.plane').append(replica);
  stageFx.append(shell);
  return {shell,w,h,enemy};
}
// x/y are the contact point on the table. Lift, roll, wrist bend and finger curl share one clock.
async function gesture(rig,frames,ms){
  const {shell,w,h,enemy}=rig, side=enemy?1:-1;
  const motions=[
    [shell,f=>'translate('+f.x+'px,'+f.y+'px)'],
    [shell.querySelector('.lift'),f=>'translateY('+(-f.z*h*.18)+'px) scale('+(1+f.z*.08)+')'],
    [shell.querySelector('.plane'),f=>'rotate('+f.tilt+'deg) rotateY('+f.roll+'deg)'],
    [shell.querySelector('.contact-shadow'),f=>'translate('+f.z*w*.18+'px,'+(2+f.z*h*.17)+'px) rotate('+f.tilt+'deg) scale('+(1+f.z*.15)+')'],
    [shell.querySelector('.wrist'),f=>'translate('+f.hx*w+'px,'+((f.hy-f.z*.15)*h)+'px) rotate('+(enemy?0:180)+'deg) rotate('+f.wrist*side+'deg)'],
    ...Array.from(shell.querySelectorAll('.digit'),(node,i)=>[node,f=>'rotate('+f.curl*[15,10,4,-4,-16][i]+'deg) scaleY('+(1-f.curl*.21)+')'])
  ];
  const tracks=motions.map(([node,fn])=>[node,frames.map(f=>({offset:f.at,transform:fn(f)}))]);
  tracks.push([shell.querySelector('.contact-shadow'),frames.map(f=>({offset:f.at,opacity:.62-f.z*.24,filter:'blur('+(1+f.z*10)+'px)'}))]);
  tracks.push([shell.querySelector('.plane'),frames.map(f=>({offset:f.at,filter:'brightness('+(1.01+.24*f.z)+')'}))]);
  tracks.push([shell.querySelector('.palm'),frames.map(f=>({offset:f.at,filter:'drop-shadow('+(2+f.z*3)+'px '+(3+f.z*6)+'px '+(1+f.z*4)+'px #1b0e12a8)'}))]);
  const tasks=tracks.map(([node,keys])=>{
    const last=keys[keys.length-1];Object.entries(last).forEach(([k,v])=>{if(k!=='offset')node.style[k]=v});
    return animate(node,keys,ms);
  });
  await Promise.all(tasks);
}
function pose(at,x,y,z,roll,tilt,hx,hy,wrist,curl){return {at,x,y,z,roll,tilt,hx,hy,wrist,curl}}
function gripY(rig){return rig.enemy?-.39:.39}
function heldPoint(){
 const p=center(el('player').firstElementChild),r=el('player').querySelector('.card,.slot');
 return {x:Math.max(r.offsetWidth*.65,p.x),y:p.y-r.offsetHeight*.32};
}
async function liftCard(rig,source,target) {
 const g=gripY(rig),s=rig.enemy?-1:1;
 await gesture(rig,[
 pose(0,source.x,source.y,0,180,-7,.35,g+s*1.7,-26,0),
 pose(.27,source.x,source.y,0,180,-7,.06,g,-16,.2),
 pose(.42,source.x,source.y,.12,158,-11,.04,g,-13,.9),
 pose(.65,(source.x+target.x)*.5,(source.y+target.y)*.5,.84,81,-13,.08,g,-8,.95),
 pose(.85,target.x,target.y,.94,18,-8,.08,g,-5,.8),
 pose(1,target.x,target.y,.88,8,-6,.08,g,-5,.8)],530);
}
async function deliver(rig,from,to,backFirst){
 const g=gripY(rig),s=rig.enemy?-1:1;
 const x=t=>from.x+(to.x-from.x)*t,y=t=>from.y+(to.y-from.y)*t;
 await gesture(rig,[
 pose(0,x(0),y(0),.88,backFirst?164:8,-6,.08,g,-8,.8),
 pose(.22,x(.35),y(.31),1,backFirst?148:20,-16,.06,g,-14,.95),
 pose(.41,x(.8),y(.72),.78,backFirst?93:37,-19,.05,g,-18,.85),
 pose(.56,x(.99),y(.98),.34,backFirst?29:12,-8,.01,g,-8,.45),
 pose(.65,x(1),y(1),0,0,-2,-.02,g+s*.04,-4,.05),
 pose(.77,x(1),y(1),0,0,-2,-.05,g+s*.06,-4,0),
 pose(.88,x(1),y(1),0,0,-2,.04,g+s*.58,-12,.2),
 pose(1,x(1),y(1),0,0,-2,.2,g+s*3.5,-21,.1)],890);
}
async function dealFromDeck(node,enemy){
 if(reduced())return;
 const row=el(enemy?'enemy':'player'),start=center(row.firstElementChild),to=center(node);
 node.style.visibility='hidden';
 const rig=actor(node,enemy);rig.shell.querySelector('.card').style.visibility='visible';
 try{await deliver(rig,start,to,true)}finally{node.style.visibility='';rig.shell.remove()}
}
async function opening(){
 lockTable(true);
 try{await Promise.all(['enemy','player'].map(id=>dealFromDeck(el(id).children[1],id==='enemy')))}
 finally{lockTable(false)}
}
async function draw(){
 if(busy||phase!=='play'||pending)return;
 lockTable(true);pending=deck.pop();
 log='抽到 '+badge(pending)+pending.s+'，点下排空位落牌。';render();
 try{if(!reduced()){
   heldActor=actor(card(pending,0),false);
   await liftCard(heldActor,center(el('player').firstElementChild),heldPoint());
   heldActor.shell.classList.add('holding');
 }}finally{lockTable(false)}
}

let busy = false;
let exchanged = false;
function lockTable(value) {
  busy=value;
  const field=document.querySelector('.field');
  field.inert=value;
  field.setAttribute('aria-busy',String(value));
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const frameMs = 1001 / 30;
function animate(node, frames, duration, delay = 0) {
  if (reduced() || !node.animate) return Promise.resolve();
  const animation = node.animate(frames, {duration, delay, easing:'linear', fill:'backwards'});
  return animation.finished.catch(() => {});
}
function center(node) {
  const rect = node.getBoundingClientRect();
  return {x:rect.left + rect.width / 2, y:rect.top + rect.height / 2};
}
async function burn(node) {
  if (reduced()) return;
  const glow = document.createElement('span');
  glow.className = 'embers';
  const streak = document.createElement('span');
  streak.className = 'slash';
  node.append(glow,streak);
  const face = node.querySelector('.faces');
  await Promise.all([
    animate(face,[{transform:'rotateY(0deg)',offset:0},{transform:'rotateY(0deg)',offset:.17},{transform:'rotateY(90deg)',offset:.34},{transform:'rotateY(179deg)',offset:.46},{transform:'rotateY(180deg)',offset:.57},{transform:'rotateY(270deg)',offset:.66},{transform:'rotateY(360deg)',offset:.82},{transform:'rotateY(360deg)',offset:1}],29*frameMs),
    animate(glow,[{opacity:0,scale:'.25'},{opacity:.95,scale:'1',offset:.48},{opacity:.8,scale:'1.2',offset:.7},{opacity:0,scale:'1.6'}],29*frameMs),
    animate(streak,[{opacity:0,scale:'0 1'},{opacity:1,scale:'1 1',offset:.24},{opacity:.9,scale:'1.15 .8',offset:.56},{opacity:0,scale:'1.25 .1'}],23*frameMs)
  ]);
  glow.remove();streak.remove();
}
function pulse(id) {
  return animate(el(id),[{filter:'brightness(1)',scale:'.92'},{filter:'brightness(1.9)',scale:'1.18',offset:.35},{filter:'brightness(1)',scale:'1'}],8*frameMs);
}
async function opponentTurn(standing) {
  const purseBefore=coins;
  const previous = theirs.slice();
  const oldScore = total(theirs);
  opponent(standing);
  // Reveal each draw before the resulting score and settlement become visible.
  const added = theirs.map((c,i) => c && !previous[i] ? i : -1).filter(i => i>=0);
  for (const i of added) {
    const row = el('enemy'), target = row.children[i+1];
    const start = center(row.firstElementChild), end = center(target);
    const node = card(theirs[i],i);
    target.replaceWith(node);
    await dealFromDeck(node,true);
    previous[i] = theirs[i];
    el('theirScore').textContent = total(previous);
    await pulse('theirScore');
  }
  if(coins!==purseBefore && !reduced()){
    const gained=coins>purseBefore, origin=center(el(gained?'enemy':'player').querySelector('.seat b')), dest=center(el(gained?'player':'enemy').querySelector('.seat b'));
    const coin=document.createElement('span');coin.className='soul-coin';coin.style.left=(dest.x-11)+'px';coin.style.top=(dest.y-9)+'px';stageFx.append(coin);
    const dx=origin.x-dest.x,dy=origin.y-dest.y;
    await animate(coin,[{transform:'translate('+dx+'px,'+dy+'px) rotateY(0deg)'},{offset:.48,transform:'translate('+(dx*.5-16)+'px,'+(dy*.5-28)+'px) rotateY(240deg)'},{transform:'translate(0,0) rotateY(540deg)'}],420);
    coin.remove();
  }
  lockTable(false);
  render();
  if (!added.length && oldScore!==total(theirs)) await pulse('theirScore');
}
async function exchange() {
  if (busy || exchanged || pending || phase!=='play') return;
  lockTable(true);exchanged=true;
  const p=mine.findLastIndex(Boolean), e=theirs.findLastIndex(Boolean);
  const a=el('player').children[p+1], b=el('enemy').children[e+1];
  const pa=center(a), pb=center(b);
  el('message').textContent='换位 · 交换双方末张牌';
  const cross = (node, from, to) => animate(node, [0,.14,.38,.67,.9,1].map((t,i)=>({
    offset:[0,.15,.33,.5,.73,1][i],
    transform:'translate('+((to.x-from.x)*t)+'px,'+((to.y-from.y)*t)+'px)'
  })),7*frameMs);
  await Promise.all([cross(a,pa,pb),cross(b,pb,pa)]);
  [mine[p],theirs[e]]=[theirs[e],mine[p]];
  render();
  await Promise.all([pulse('myScore'),pulse('theirScore')]);
  await opponentTurn(false);
}
async function place(i) {
  if (busy || !pending || mine[i] || phase!=='play') return;
  lockTable(true);
  const row=el('player'), start=center(row.firstElementChild), end=center(row.children[i+1]);
  const selected=pending;pending=null;mine[i]=selected;insight=i===1;
  const node=card(selected,i);
  row.children[i+1].replaceWith(node);
  if(heldActor){
    const rig=heldActor;heldActor=null;rig.shell.classList.remove('holding');
    node.style.visibility='hidden';
    try{await deliver(rig,heldPoint(),end,false)}finally{node.style.visibility='';rig.shell.remove()}
  }
  if(i===3){
    await burn(node);
    selected.value=Math.max(1,selected.n-ash);
    node.querySelector('em').textContent='灰烬 · '+selected.value;
  }
  el('myScore').textContent=total(mine);
  await pulse('myScore');
  await opponentTurn(false);
  if(phase==='play' && insight) {
    log+=' 下张牌：'+badge(deck.at(-1))+deck.at(-1).s;
    el('message').textContent=log;
  }
}
function opponent(standing){const threshold=15+stage;let draws=0;while(total(mine)<=21&&!passed&&total(theirs)<threshold&&theirs.includes(null)){theirs[theirs.indexOf(null)]=deck.pop();draws++;if(!standing)break}
 passed=passed||total(theirs)>=threshold||!theirs.includes(null);
 if(standing||!mine.includes(null)||total(mine)>=21||total(theirs)>21){if(!standing&&total(mine)<=21&&total(theirs)<=21&&!passed){opponent(true);return}settle();return}
 log=total(theirs)>21?'亡魂爆点。':passed?'亡魂已停牌。你仍可以抽牌。':draws?'亡魂落了一张牌。轮到你。':'轮到你。'}
function settle(){let a=total(mine),b=total(theirs);let diff=a>21?-1:b>21?1:Math.sign(a-b);if(diff<0&&ward&&!usedWard&&a===22){diff=0;usedWard=true}coins+=diff;rival-=diff;log=a+' 比 '+b+' · '+(diff>0?'你赢得一枚魂币。':diff<0?'亡魂取走一枚魂币。':'平局，各自取回魂币。');phase=coins===0?'lost':rival===0?(stage===2?'won':'reward'):'next';if(phase==='won')log+=' 摆渡人收起船桨，让你登船。';if(phase==='lost')log+=' 你的魂币已耗尽。'}
function reward(type){if(type==='ash')ash+=2;else if(type==='coin')coins+=2;else ward=true;stage++;rival=3+stage;round=0;begin()}
function reset(){stage=0;coins=4;rival=3;round=0;ash=2;ward=false;begin()}
function render(){row('enemy',theirs,false);row('player',mine,true);el('myScore').textContent=total(mine);el('theirScore').textContent=total(theirs);el('journey').textContent=places[stage]+' · 第 '+round+' 局';el('progress').textContent='渡程 '+(stage+1)+' / 3';el('message').textContent=log;const a=el('actions');a.replaceChildren();
 if(phase==='play'&&!pending)a.append(button('停牌',async()=>{if(busy)return;lockTable(true);await opponentTurn(true)}));if(phase==='play'&&!pending&&!exchanged)a.append(button('换位',exchange));if(phase==='next')a.append(button('下一局',begin));if(phase==='reward'){a.append(button('取两枚魂币',()=>reward('coin')),button('强化灰烬位',()=>reward('ash')));if(!ward)a.append(button('护符 · 22点免败',()=>reward('ward')))}if(['lost','won'].includes(phase))a.append(button('再渡一次',reset))}
const felt=document.querySelector('.field');
felt.addEventListener('pointermove',event=>{
 const r=felt.getBoundingClientRect();
 felt.style.setProperty('--light-x',((event.clientX-r.left)/r.width*100)+'%');
 felt.style.setProperty('--light-y',((event.clientY-r.top)/r.height*100)+'%');
});
window.addEventListener('resize',()=>{if(heldActor&&!busy){const pt=heldPoint();heldActor.shell.style.transform='translate('+pt.x+'px,'+pt.y+'px)'}});
el('help').onclick=()=>el('rules').showModal();el('closeRules').onclick=()=>el('rules').close();begin();
</script></html>
