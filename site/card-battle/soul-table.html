.front .seat-art{mix-blend-mode:multiply;filter:saturate(.84) contrast(1.07);border-radius:3%}

<main id="board" class="on-road"><div id="forest" aria-hidden="true"><div class="scroll-layer" id="road"></div><div class="scroll-layer" id="shadow"></div><div class="scroll-layer" id="bough"></div><div class="scroll-layer" id="crown"></div></div><div id="table-rim"></div><header><div><small>渡魂牌局</small><h1>七席牌桌</h1></div><div id="commands"><span id="turn-label"></span><button id="camp" disabled>篝火牌</button><button id="resolve">交锋</button><button id="help">桌规</button></div></header><section class="seven" id="enemy" aria-label="敌方七席"></section><div class="public-line"><button id="public" class="public" aria-label="公共牌位"></button></div><section class="seven" id="player" aria-label="我方七席"></section><div class="seat-info" id="info" role="status">点中央队伍牌组队 · 再沿林路前行</div><section id="decks" class="seven stackrail" aria-label="七个人物牌堆"></section><button id="party" aria-label="展开或收起队伍"></button><canvas id="raylight" aria-hidden="true"></canvas></main><dialog id="rules"><h2>七席牌桌</h2><p>每一列属于一位人物。先选屏幕底边的人物牌，再点同列我方席位部署，该列专属牌堆随即开放。抽到的牌点亮可选目标；场地牌打到中央公共位。</p><p>每轮可上场两人、打两张专属牌。点击交锋后，我方按从左到右的顺序出击，随后存活的敌人反击。优先攻击同列，再找最近的目标（等距先左）。敌牌左上角显示当前目标席号。掩护抵消伤害，篝火每轮为所有存活队友恢复 1 生命。敌方全灭获胜，上场队员全倒下则败退。</p><button id="closeRules">回到牌桌</button></dialog><div id="stage-fx" aria-hidden="true"></div><template id="grip-art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -210 160 320" overflow="visible" aria-hidden="true">

<script>
const el=id=>document.getElementById(id);

const handMarkup=document.querySelector('#grip-art').innerHTML;
const stageFx=el('stage-fx');
let heldActor=null;
function actor(node,enemy){
  const shell=document.createElement('div');
  shell.className='motion-rig'+(enemy?' north':' south');
  const size=el('player').firstElementChild;
  const w=size.offsetWidth,h=size.offsetHeight;

    [shell.querySelector('.lift'),f=>'translateY('+(-f.z*h*.18)+'px) scale('+(1+f.z*.08)+')'],
    [shell.querySelector('.plane'),f=>'rotate('+f.tilt+'deg) rotateY('+f.roll+'deg)'],
    [shell.querySelector('.contact-shadow'),f=>'translate('+f.z*w*.18+'px,'+(2+f.z*h*.17)+'px) rotate('+f.tilt+'deg) scale('+(1+f.z*.15)+')'],

  const tracks=motions.map(([node,fn])=>[node,frames.map(f=>({offset:f.at,transform:fn(f)}))]);
  tracks.push([shell.querySelector('.contact-shadow'),frames.map(f=>({offset:f.at,opacity:.62-f.z*.24,filter:'blur('+(1+f.z*10)+'px)'}))]);

    const last=keys[keys.length-1];Object.entries(last).forEach(([k,v])=>{if(k!=='offset')node.style[k]=v});

let marching=true, leg=0, distance=0, encounterDistance=82, frameTime=0, visualDistance=0, forestSpeed=0;
const forestLayers=[['road',1],['shadow',1.23],['bough',1.38],['crown',1.76]];
let floorPeriod=0;
function measureForest(){
 const width=el('board').clientWidth;
 // A portrait viewport crops the sides of the map rather than squeezing its stone and leaf shapes.
 const mapWidth=Math.max(width,Math.min(width*1.16,innerHeight*.86));
 floorPeriod=Math.round(mapWidth*0.4642857142857143);
 el('forest').style.setProperty('--map-width',mapWidth+'px');
 el('forest').style.setProperty('--period',floorPeriod+'px');
}
let clock=16,campReady=false,drawer=false;
function updateForest(now){
 const dt=frameTime?Math.min((now-frameTime)/1000,.15):0;frameTime=now;
 if(!document.hidden){
  const moving=marching&&!el('rules').open, target=moving&&!campReady&&!common?1:0;
  forestSpeed+=Math.min(1,dt*3.8)*(target-forestSpeed);
  if(forestSpeed<.002)forestSpeed=0;
  const step=dt*forestSpeed*(reduced()?9:36);
  visualDistance+=step;
  if(moving&&!campReady&&!common)distance+=dt*5;
  if(!el('rules').open)clock=(clock+dt*.11)%24;
  const night=Math.max(0,Math.min(1,(Math.abs(clock-12)-4)/4));
  el('board').style.setProperty('--night',(night*.76).toFixed(2));el('board').style.setProperty('--illum',(1-night*(common?.16:.34)).toFixed(2));
  if(marching)el('turn-label').textContent=(common?'营地 ': '行军 ')+String(Math.floor(clock)).padStart(2,'0')+':'+String(Math.floor(clock%1*60)).padStart(2,'0');
 
  for(const [id,rate] of forestLayers){
   const phase=(visualDistance*rate)%floorPeriod;
   el(id).style.transform='translate3d(0,'+phase.toFixed(2)+'px,0)';
  }
  if(moving&&!common&&!campReady&&!locked&&!held&&dealt.some((x,i)=>x&&vitality[i])&&distance>=encounterDistance){
   drawer=false;el('board').classList.add('unfold');setTimeout(()=>el('board').classList.remove('unfold'),540);marching=false;recruits=2;leg++;el('board').classList.remove('on-road');selected=-1;
   say('前方遭遇敌队 · 队伍停步');render();el('enemy').classList.add('arrival');setTimeout(()=>el('enemy').classList.remove('arrival'),720);
  }
 }
 lighting(now);requestAnimationFrame(updateForest);
}
// Intersect rays through the occluder with a horizontal receiving surface.
function projectRay(light,x,y,z,receiver=0){
 const scale=(light.z-receiver)/Math.max(1,light.z-z);
 return [light.x+(x-light.x)*scale,light.y+(y-light.y)*scale];
}
const lightCanvas=el('raylight'),ctx=lightCanvas.getContext('2d');
const lampMask=document.createElement('canvas'),mask=lampMask.getContext('2d');
const leafMask=new Image();
leafMask.src=getComputedStyle(el('crown')).backgroundImage.slice(5,-2);
// An overhead leaf-opacity field. Wrap its two axes before sampling the light ray.
const canopySize=256, canopy=new Float32Array(canopySize*canopySize);
{
 let seed=4919;
 const rand=()=>((seed=Math.imul(1664525,seed)+1013904223>>>0)/4294967296);
 const lattices=[8,16,32,64].map(n=>({n,a:Float32Array.from({length:n*n},rand)}));
 function noise({n,a},x,y){
  x*=n;y*=n;const i=Math.floor(x),j=Math.floor(y);
  let u=x-i,v=y-j;u=u*u*(3-2*u);v=v*v*(3-2*v);
  const at=(dx,dy)=>a[((j+dy)%n)*n+(i+dx)%n];
  return (at(0,0)*(1-u)+at(1,0)*u)*(1-v)+(at(0,1)*(1-u)+at(1,1)*u)*v
 }
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){
  const density=lattices.reduce((a,l,i)=>a+noise(l,x/256,y/256)*[.53,.27,.14,.06][i],0);
  canopy[y*256+x]=Math.min(1,Math.max(0,(density-.47)*13+.20));
 }
}
const shafts=document.createElement('canvas'),shaftContext=shafts.getContext('2d');
let shaftPixels,shaftTime=0;
function forestSunlight(now,w,h){
 const scale=Math.min(1,200/Math.max(w,h)),sw=Math.max(1,Math.round(w*scale)),sh=Math.max(1,Math.round(h*scale));
 if(!shaftPixels||sw!==shafts.width||sh!==shafts.height){
  shafts.width=sw;shafts.height=sh;shaftPixels=shaftContext.createImageData(sw,sh);shaftTime=-1000
 }
 if(now-shaftTime>=64){
  shaftTime=now;
  const noon=(clock-12)*Math.PI/12,day=Math.max(0,Math.min(1,(Math.cos(noon)+.16)*1.8));
  const unit=212/Math.max(w,h),time=now*.001;
  const wind=reduced()?0:Math.sin(time*.61)*2.1+Math.sin(time*.27)*3;
  const drift=visualDistance*1.76*unit;
  const dx=Math.sin(noon)*95+14,dy=-44+Math.cos(noon)*14;
  const elevation=Math.cos(noon),warm=1-Math.max(0,elevation),pixels=shaftPixels.data;
  for(let j=0,n=0;j<sh;j++)for(let i=0;i<sw;i++,n+=4){
   const u=i/scale*unit+wind,v=j/scale*unit-drift+wind*.4;
   let sum=0,ground=0;
   for(let k=0;k<12;k++){
    const f=1-k/13,x=(Math.floor(u+dx*f)&255),y=(Math.floor(v+dy*f)&255);
    const open=1-canopy[(y<<8)+x];if(!k)ground=open;sum+=open
   }
   // Direct irradiance at ground plus fog scattered along the camera ray.
   const beam=sum/12,light=(ground*.40+beam*beam*.92)*day;
   const shade=(1-ground)*.32*day;
   const alpha=Math.min(.7,light*.58+shade);
   const mix=light*.58/(light*.58+shade+.00001);
   pixels[n]=34+220*mix;pixels[n+1]=55+(179-30*warm)*mix;pixels[n+2]=70+(96-35*warm)*mix;
   pixels[n+3]=Math.round(alpha*255)
  }
  shaftContext.putImageData(shaftPixels,0,0)
 }
 ctx.drawImage(shafts,0,0,w,h)
}

let nextLightFrame=0;
function poly(c,points){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function lighting(now){
 if(now<nextLightFrame)return;
 nextLightFrame=now+33;
 const w=innerWidth,h=innerHeight,k=Math.min(1,900/w),cw=Math.round(w*k),ch=Math.round(h*k);
 if(lightCanvas.width!==cw||lightCanvas.height!==ch){for(const c of [lightCanvas,lampMask]){c.width=cw;c.height=ch}}
 for(const c of [ctx,mask]){c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,w,h)}
 const t=now*.001,angle=(clock-12)*Math.PI/12;
 const sun={x:w*(.5-5*Math.sin(angle)),y:-h*2,z:Math.max(w,h)*4};
 const shapes=[];
 for(const node of document.querySelectorAll('#party,#board .place>.card,#decks .stack,#stage-fx .card,#public:has(.card)')){
  if(!node.clientWidth||node.closest('#enemy,#player,#decks')&&getComputedStyle(node).visibility==='hidden')continue;
  const r=node.getBoundingClientRect();if(!r.width||!r.height)continue;
  const rig=node.closest('.motion-rig');
  let z=Math.max(2,r.width*.045);
  if(rig){const lift=rig.querySelector('.lift');z+=Math.max(0,-new DOMMatrix(getComputedStyle(lift).transform).m42)*2}
  else if(node.closest('#stage-fx')||node.id==='party')z+=r.width*.052;
  shapes.push({r,z,pts:[[r.left,r.top],[r.right,r.top],[r.right,r.bottom],[r.left,r.bottom]]});
 }
 // Remove shadow on its own caster while retaining shadows on the road.
 function cardOcclusion(c,L,color){
  c.fillStyle=color;
  for(const {r,z,pts} of shapes){
   c.save();c.beginPath();c.rect(-w,-h,w*3,h*3);c.rect(r.left,r.top,r.width,r.height);c.clip('evenodd');
   poly(c,pts.map(([x,y])=>projectRay(L,x,y,z)));c.restore()
  }
 }
 cardOcclusion(ctx,sun,'rgba(37,44,49,.25)');
 if(leafMask.complete&&leafMask.naturalWidth&&floorPeriod){
  const width=parseFloat(el('forest').style.getPropertyValue('--map-width')),phase=visualDistance*1.76%floorPeriod;
  const [x,y]=projectRay(sun,(w-width)/2,phase,Math.min(w,h)*.047);
  ctx.save();ctx.globalAlpha=.15;ctx.filter='brightness(0) blur(2px)';
  for(let top=y-floorPeriod*2;top<h;top+=floorPeriod)ctx.drawImage(leafMask,x,top,width,floorPeriod);
  ctx.restore();
 }
 forestSunlight(now,w,h);
 if(!common)return;
 const r=el('public').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.max(r.width*4,Math.min(w,h)*.43);
 const flick=reduced()?0:Math.sin(t*5.3)*.55+Math.sin(t*9.7)*.23;
 const lamp={x:x+flick*r.width*.036,y:y-r.height*.08,z:r.width*(.82+.045*flick)};
 // Integrate three samples across the flame for a soft penumbra.
 for(const shift of [-.1,0,.1]){
  mask.clearRect(0,0,w,h);const L={...lamp,x:lamp.x+shift*r.width};
  const g=mask.createRadialGradient(L.x,L.y,0,L.x,L.y,R);
  for(const [stop,a] of [[0,.34],[.14,.26],[.38,.13],[.7,.038],[1,0]])g.addColorStop(stop,'rgba(255,163,65,'+a*(1+.06*flick)+')');
  mask.fillStyle=g;mask.fillRect(0,0,w,h);
  mask.globalCompositeOperation='destination-out';cardOcclusion(mask,L,'#000');mask.globalCompositeOperation='source-over';
  ctx.drawImage(lampMask,0,0,w,h);
 }
}

function resumeTrail(){
 ending='';round=1;orders=2;recruits=2;selected=-1;held=null;common=null;
 guard.fill(0);for(let i=0;i<7;i++){life[i]=rivals[i]===null?0:5;if(dealt[i])vitality[i]=6}
 encounterDistance=distance+105;marching=true;el('board').classList.add('on-road');
 say('队伍继续沿林道前进');render()
}

function nearest(seat,valid){
 let target=-1;
 for(let i=0;i<7;i++)if(valid(i)&&(target<0||Math.abs(i-seat)<Math.abs(target-seat)))target=i;
 return target;
}
function threat(i){return nearest(i,j=>dealt[j]&&vitality[j]>0)}
function refreshHeader(){
 el('turn-label').textContent=(marching?'林道行军':ending)||('第 '+round+' 轮 · 指挥 '+orders+'/2');
 el('resolve').textContent=ending==='胜利'?'继续行军':ending?'再战':marching?'迎敌':'交锋';
 el('resolve').disabled=!ending&&(locked||(marching&&(campReady||!!common))||!!held||!dealt.some((a,i)=>a&&vitality[i]>0));
}
function checkEnd(){
 if(life.every(x=>x<=0))ending='胜利';
 else if(dealt.some(Boolean)&&!dealt.some((a,i)=>a&&vitality[i]>0))ending='队伍败退';
 if(ending){held=null;selected=-1;say(ending+' · 本场交锋结束')}
 return !!ending;
}
async function strike(side,source,target,damage){
 const allied=side==='player',from=el(side).children[source],to=el(allied?'enemy':'player').children[target];
 const a=center(from),b=center(to),dx=b.x-a.x,dy=b.y-a.y;
 const copy=from.firstElementChild.cloneNode(true),rect=from.getBoundingClientRect();
 Object.assign(copy.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',zIndex:'12',pointerEvents:'none'});
 stageFx.append(copy);from.firstElementChild.style.visibility='hidden';
 const blocked=allied?0:Math.min(damage,guard[target]);
 const net=damage-blocked;
 try{
  await animate(copy,[{transform:'translate(0,0)'},{offset:.32,transform:'translate('+(-dx*.045)+'px,'+(-dy*.045)+'px) rotate(-4deg)'},{transform:'translate('+dx*.89+'px,'+dy*.89+'px) rotate(3deg)'}],270);
  if(allied)life[target]=Math.max(0,life[target]-net);else{guard[target]-=blocked;vitality[target]=Math.max(0,vitality[target]-net)}
  const hit=document.createElement('b');hit.className='damage';hit.textContent=net?'−'+net:'格挡';hit.style.left=b.x+'px';hit.style.top=b.y+'px';stageFx.append(hit);
  if(!reduced()){const ring=document.createElement('i');ring.className='impact-ring';Object.assign(ring.style,{left:b.x+'px',top:b.y+'px',width:rect.width+'px',height:rect.width+'px'});stageFx.append(ring);setTimeout(()=>ring.remove(),340)}
  const fallen=(allied?life[target]:vitality[target])===0;
  try{await Promise.all([
   animate(copy,[{transform:'translate('+dx*.89+'px,'+dy*.89+'px) rotate(3deg)'},{transform:'translate(0,0)'}],290),
   animate(to,[{filter:'brightness(2.4)',transform:'rotate(4deg)'},{offset:.35,transform:'rotate(-4deg)'},{opacity:fallen?.15:1,transform:'rotate(0deg)'}],340),
   animate(hit,[{transform:'translate(-50%,-40%) scale(.8)'},{offset:.35,transform:'translate(-50%,-85%) scale(1.2)'},{opacity:.2,transform:'translate(-50%,-150%)'}],380)])}finally{hit.remove()}
 }finally{copy.remove();from.firstElementChild.style.visibility='';render()}
}
async function clash(){
 if(ending==='胜利'){resumeTrail();return}if(ending){location.reload();return}if(marching){encounterDistance=distance;return}
 if(locked||resolving||held||!dealt.some((a,i)=>a&&vitality[i]>0))return;
 resolving=true;locked=true;selected=-1;render();
 try{
  for(const side of ['player','enemy']){
   for(let i=0;i<7;i++){
    const own=side==='player';
    if(own?(!dealt[i]||!vitality[i]):!life[i])continue;
    const j=own?nearest(i,k=>life[k]>0):threat(i);
    if(j<0)break;
    say((own?roster[i].name:roster[7+rivals[i]].name)+' → '+(own?roster[7+rivals[j]].name:roster[j].name));
    await strike(side,i,j,own?power[i]:2);
    if(checkEnd())return
   }
  }
  if(common){for(let i=0;i<7;i++)if(dealt[i]&&vitality[i])vitality[i]=Math.min(6,vitality[i]+1)}
  round++;orders=2;recruits=2;say('选择人物部署或打出专属牌，再交锋');
 }finally{resolving=false;locked=false;render()}
}

function portrait(person){
  const node=document.createElement('span');node.className='card';
  const face=document.createElement('span');face.className='front';
  const image=new Image();image.className='seat-art';image.alt='';image.src=person.art;
  const name=document.createElement('span');name.className='nameplate';name.textContent=person.name;
  face.append(image,name);node.append(face);return node;
}
function tactic(owner,kind){
 const node=document.createElement('span');node.className='card drawn';
 const mark=document.createElement('span');mark.className='sigil';mark.textContent=['✦','◇','♨'][kind];
 const title=document.createElement('strong');title.textContent=arts[kind];
 const from=document.createElement('small');from.textContent=roster[owner].name;
 node.append(mark,title,from);return node;
}
function button(where,label,fn){
 const b=document.createElement('button');b.className=where;b.setAttribute('aria-label',label);b.onclick=fn;return b;
}
function addTag(node,text){const v=document.createElement('small');v.className='tag';v.textContent=text;node.append(v)}
function render(){
 const board=el('board'),party=el('party'),lead=dealt.findIndex((v,i)=>v&&vitality[i]);
 board.classList.toggle('roster-open',marching&&drawer);board.classList.toggle('camp-target',marching&&campReady);board.classList.toggle('lit',!!common);
 party.replaceChildren();if(lead>=0)party.append(portrait(roster[lead]));else party.append(portrait(roster[0]));
 const count=document.createElement('small');count.textContent=lead<0?'组建队伍':'队伍 '+dealt.filter(Boolean).length+'/7';party.append(count);
 el('camp').disabled=lead<0||locked;el('camp').textContent=common?'拔营':campReady?'收回篝火牌':'篝火牌';
 const you=el('player'),enemy=el('enemy'),decks=el('decks');you.replaceChildren();enemy.replaceChildren();decks.replaceChildren();
 roster.slice(0,7).forEach((p,i)=>{
   const e=button('place','敌方第'+(i+1)+'席'+(!marching&&life[i]?' '+roster[7+rivals[i]].name:''),()=>use('enemy',i));
   if(!marching&&life[i]){e.append(portrait(roster[7+rivals[i]]));addTag(e,'♥ '+life[i]);const n=threat(i);if(n>=0){const marker=document.createElement('span');marker.className='intent';marker.textContent='↓'+(n+1);marker.title='将攻击我方第 '+(n+1)+' 席';e.append(marker)}}
   e.disabled=marching||locked||held?.kind!==0||!life[i];if(!e.disabled)e.classList.add('armed');enemy.append(e);
   const a=button('place','我方第'+(i+1)+'席'+(dealt[i]?' '+p.name:''),()=>dealt[i]?use('ally',i):deploy(i));
   if(dealt[i]){a.append(portrait(p));addTag(a,'♥ '+vitality[i]+(guard[i]?' ◇'+guard[i]:''));a.classList.toggle('fallen',!vitality[i])}
   a.style.setProperty('--fan',((3-i)*110)+'%');for(const n of [a,e]){n.style.setProperty('--cast',((i-3)*1.5)+'px');n.style.setProperty('--bearing',(n===a?0:180)+(i-3)*(n===a?-15:15)+'deg')}
   a.disabled=locked||!(selected===i&&!dealt[i]||held?.kind===1&&dealt[i]&&vitality[i]);if(!a.disabled)a.classList.add('armed');you.append(a);
   const b=button('stack'+(dealt[i]?' open':''),p.name+(dealt[i]?'专属牌堆':'人物牌'),()=>select(i));
   if(!dealt[i])b.append(portrait(p));else if(held?.owner===i)b.append(tactic(i,held.kind));else{const s=document.createElement('span');s.textContent=p.name;b.append(s)}
   b.disabled=!!ending||locked||(!marching&&!dealt[i]&&!recruits)||(dealt[i]&&(!vitality[i]||!orders))||!!held&&held.owner!==i;
   if(selected===i||held?.owner===i)b.classList.add('armed');decks.append(b)
 });
 const pub=el('public');pub.replaceChildren();if(common)pub.append(tactic(common.owner,2));else pub.textContent='公共位';pub.disabled=!!ending||locked||held?.kind!==2;if(marching&&campReady)pub.disabled=false;pub.classList.toggle('armed',!pub.disabled);refreshHeader();
}
function select(i){
 if(locked||ending||(!marching&&!dealt[i]&&!recruits)||(dealt[i]&&(!orders||!vitality[i])))return;
 if(marching&&dealt[i]){say('林道行军中 · 遇敌后可使用专属牌');return}if(marching&&!dealt[i]){selected=i;deploy(i);return}if(!dealt[i]){selected=selected===i?-1:i;say(selected<0?'选择人物牌':roster[i].name+' · 点正上方亮起的我方席位上场');render();return}
 selected=-1;
 if(held){say('请先打出已抽出的'+arts[held.kind]);return}
 let kind=(draws[i]+i)%3;if(kind===0&&!life.some(Boolean))kind=1;
 held={owner:i,kind};draws[i]++;say(arts[kind]+' · '+['点亮起的敌方人物','点亮起的己方人物','点中央公共位'][kind]);render()
}
async function moveCard(node,a,b){
 if(reduced())return;const rig=actor(node,false);
 try{await deliver(rig,a,b,false)}finally{rig.shell.remove()}
}
async function deploy(i){
 if(ending||(!marching&&!recruits)||locked||selected!==i||dealt[i]||held)return;
 locked=true;const from=center(el('decks').children[i]),to=center(marching?el('party'):el('player').children[i]);
 render();el('decks').children[i].firstElementChild.style.visibility='hidden';
 try{await moveCard(portrait(roster[i]),from,to);dealt[i]=true;if(!marching)recruits--;selected=-1;say(roster[i].name+'已上场 · 对应牌堆已解锁')}
 finally{locked=false;render()}
}
async function use(side,i){
 if(ending||!orders||locked||!held)return;
 const {owner,kind}=held;
 if(!(side==='enemy'&&kind===0&&life[i]||side==='ally'&&kind===1&&dealt[i]||side==='public'&&kind===2))return;
 locked=true;const dest=side==='public'?el('public'):el(side==='ally'?'player':'enemy').children[i];
 const from=center(el('decks').children[owner]),to=center(dest);render();
 try{await moveCard(tactic(owner,kind),from,to);if(kind===0)await strike('player',owner,i,2);if(kind===1)guard[i]+=2;if(kind===2)common={owner};held=null;orders--;if(!checkEnd())say(orders?'可再打出一张专属牌，或交锋':'指挥已用完 · 点击交锋')}
 finally{locked=false;render()}
}
el('resolve').onclick=clash;
el('party').onclick=()=>{if(!locked){drawer=!drawer;render()}};
el('camp').onclick=()=>{if(common){common=null;say('队伍拔营')}else{campReady=!campReady;say(campReady?'将篝火牌放入中央亮起的公共位':'队伍继续行军')}render()};
el('public').onclick=()=>{if(marching&&campReady){common={owner:dealt.indexOf(true)};campReady=false;drawer=false;say('营火已点燃 · 拔营后继续行军');render()}else use('public',0)};
el('help').onclick=()=>el('rules').showModal();el('closeRules').onclick=()=>el('rules').close();
measureForest();window.addEventListener('resize',measureForest);document.addEventListener('visibilitychange',()=>{frameTime=0});requestAnimationFrame(updateForest);render();

</script></html>
