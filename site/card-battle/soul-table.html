<script>
/* Independent cabinet simulation. All input, reel motion and combat share one clock. */
(() => {
'use strict';
const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
const mod=(x,n)=>((x%n)+n)%n;
const lerp=(a,b,t)=>a+(b-a)*t;
const randomStream=seed=>()=>{
  let t=seed+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;
};
const foes=[
 {id:'warden', name:'LANCE WARDEN',place:'PLAINS OF PAIN',hp:160,power:15,color:'#e4a857'},
 {id:'egg',name:'EGGO',place:'PLAINS OF PAIN',hp:95,power:17,color:'#ffce80'},
 {id:'skeleton',name:'GRAVE SENTINEL',place:'DARK CEMETERY',hp:170,power:21,color:'#83c8d3'},
 {id:'maw',name:'HOLLOW MAW',place:'HOLLOW GROTTO',hp:185,power:22,color:'#b5d86e'},
 {id:'guard',name:'IRON WARDEN',place:'CINDER KEEP',hp:215,power:24,color:'#ed9e66'},
 {id:'toad',name:'MARSH KING',place:'THE MARSH',hp:230,power:27,color:'#ccdf69'},
 {id:'reaper',name:'DUNE REAPER',place:'EMBER WASTES',hp:260,power:32,color:'#ffae68'}
];
const items={
 sword:{name:'RUSTY SWORD',verb:'ATTACK!',damage:22},
 shield:{name:'WOODEN SHIELD',verb:'BLOCK!',armor:20},
 coin:{name:'GOLD COIN',verb:'GAIN COINS',money:1,multiplier:6},
 dagger:{name:'RITUAL DAGGER',verb:'STAB!',damage:24,check:true},
 bolt:{name:'STORM ROD',verb:'LIGHTNING!',damage:30,check:true},
 bow:{name:'SHORT BOW',verb:'LOOSE!',damage:28,check:true},
 gouge:{name:'BLOOD DROP',verb:'LIFE DRAIN!',damage:13,heal:9},
 charm:{name:'WARDING CHARM',verb:'WARD!',armor:15,heal:8,check:true},
 star:{name:'NOVA',verb:'STARFALL!',damage:38,check:true}
};
const activeRails=n=>n===3?[1,2,3]:n===4?[0,1,2,3]:[0,1,2,3,4];
class Machine{
 constructor(seed,emit,start=0){
  this.seed=seed;this.emit=emit;this.rng=randomStream(seed);this.time=0;this.paused=false;
  this.reset(start);
 }
 reset(start=0){
  this.training='';this.previewFaces=null;this.hp=125;this.maxHp=125;this.armor=0;this.cash=11;this.stage=start;this.count=3;
  this.pool=['shield','sword','coin','dagger'];this.levels={};this.purchases=new Set();
  this.turn=1;this.gain=0;this.lastAction='';this.streak=0;
  this.enterFight(start,true);this.emit('reset',{});
 }
 coinPractice(kind='coins'){
  this.reset(1);
  this.training=kind;
  if(kind==='single')this.cash=0;
  this.previewFaces=kind==='single'?['coin','shield','sword']:['coin','coin','coin'];
  this.log=kind==='single'?'SINGLE COIN':'COIN TEST';
  this.emit('reset',{});
 }
 get foe(){return foes[this.stage]}
 get active(){return activeRails(this.count)}
 setPhase(phase){this.phase=phase;this.age=0;this.emit('phase',{phase});}
 enterFight(index,instant=false){
  this.stage=index;this.enemyHp=this.foe.hp;this.turn=1;this.enemyShield=0;
  this.current=-1;this.hit=null;this.lastAction='';this.log='SPINNING!';this.feedback=null;
  this.wheels=Array.from({length:5},(_,i)=>this.makeWheel(i));this.nextStop=0;
  if(instant&&index===0){
   ['shield','sword','shield'].forEach((face,n)=>{
    const wheel=this.wheels[this.active[n]];wheel.p=wheel.strip.indexOf(face)+.18;
   });
  }
  if(instant)this.startSpin();else this.setPhase('arrival');
 }
 makeWheel(i){
  const strip=[...this.pool,...this.pool,...this.pool];
  for(let n=strip.length-1;n>0;n--){const j=Math.floor(this.rng()*(n+1));[strip[n],strip[j]]=[strip[j],strip[n]]}
  return {strip,p:this.rng()*strip.length,speed:11.02+i*.035+this.rng()*.045,status:'moving',brake:0,lastLatch:-99};
 }
 startSpin(){
  this.current=-1;this.lastAction='';this.feedback=null;this.nextStop=0;this.log='SPINNING!';
  this.wheels.forEach(w=>{w.status='moving';w.brake=0;});
  this.setPhase('spin');
 }
 symbol(i){const w=this.wheels[i];return w.strip[mod(Math.round(w.p),w.strip.length)];}
 action(){
  if(this.paused)return;
  if(this.phase==='spin'&&this.nextStop<this.active.length){
   const i=this.active[this.nextStop++],w=this.wheels[i];
   w.start=w.p;
   w.end=Math.ceil(w.p+.62);
   if(this.previewFaces){
    const target=this.previewFaces[this.nextStop-1];
    while(w.strip[w.end%w.strip.length]!==target)w.end++;
   }
   // The rotating strip travels at full speed to its next detent.
   // The pawl itself arrests it over about two 60 Hz video frames.
   w.travel=.032;
   w.coast=(w.end-w.start)/w.speed-w.travel*.5;
   w.status='braking';w.brake=0;
   this.emit('press',{i});return;
  }
  if(this.phase==='skill'&&this.age>.13){
   this.skillWon=Math.abs(this.needle()-.71)<.12;
   this.emit('press',{i:this.current});this.playSymbol(this.skillWon);return;
  }
  if(this.phase==='reward'&&this.age>.45){this.enterShop();return}
  if(this.phase==='shop'){this.leaveShop();return}
  if(this.phase==='defeat'||this.phase==='complete'){this.reset();return}
 }
 needle(){return .5-.5*Math.cos(this.age*5.7)}
 updateWheels(dt){
  if(this.phase!=='spin')return;
  for(const i of this.active){
   const w=this.wheels[i],prior=Math.floor(w.p);
   if(w.status==='moving')w.p+=dt*w.speed;
   else if(w.status==='braking'){
    if(w.coast>0){
     const coastStep=Math.min(w.coast,dt);
     w.p+=w.speed*coastStep;w.coast-=coastStep;
     if(w.coast>1e-8)continue;
     w.start=w.p;w.brake+=dt-coastStep;
    }else w.brake+=dt;
    const t=Math.min(1,w.brake/w.travel);
    w.p=lerp(w.start,w.end,1-(1-t)*(1-t));
    if(t===1){w.p=w.end;w.status='set';w.lastLatch=this.time;this.emit('latch',{i})}
   }
   if(i===this.active[0]&&w.status==='moving'&&Math.floor(w.p)!==prior)this.emit('tick',{});
  }
  if(this.active.every(i=>this.wheels[i].status==='set')){
   this.previewFaces=null;this.order=[...this.active];this.orderIndex=0;this.critSet=new Set();
   for(let j=0;j<this.order.length;){
    let k=j+1;while(k<this.order.length&&this.symbol(this.order[j])===this.symbol(this.order[k]))k++;
    if(k-j>=3)for(let n=j;n<k;n++)this.critSet.add(this.order[n]);
    j=k;
   }
   this.setPhase('settled');
  }
 }
 nextSymbol(){
  if(this.orderIndex>=this.order.length){this.current=-1;this.log='ENEMY ATTACK';this.setPhase('enemyWind');return}
  this.current=this.order[this.orderIndex++];this.currentItem=this.symbol(this.current);
  this.feedback=null;this.log=items[this.currentItem].name;
  this.emit('focus',{i:this.current});
  if(items[this.currentItem].check&&!this.critSet.has(this.current)){
   this.setPhase('skill');return;
  }
  this.playSymbol(false);
 }
 playSymbol(skill){
  const item=items[this.currentItem],crit=skill||this.critSet.has(this.current);
  const matched=this.critSet.has(this.current);
  const mega=matched&&this.critSet.size===5;
  const multiplier=matched?(item.multiplier||3)*(mega?2:1):skill?2:1;
  const scale=(1+(this.levels[this.currentItem]||0)*.35)*multiplier;
  this.hit={item:this.currentItem,crit,mega,skill,damage:Math.round((item.damage||0)*scale),heal:Math.round((item.heal||0)*scale),money:Math.round((item.money||0)*scale),armor:Math.round((item.armor||0)*scale)};
  this.didHit=false;this.log=item.verb;this.setPhase('resolve');
  this.emit('cast',{i:this.current,item:this.currentItem,crit});
 }
 applyHit(){
  const hit=this.hit;
  if(hit.damage){
   const blocked=Math.min(hit.damage,this.enemyShield);this.enemyShield-=blocked;
   this.enemyHp=Math.max(0,this.enemyHp-hit.damage+blocked);
   this.log=(hit.damage-blocked)+' DAMAGE';
  }
  if(hit.armor){this.armor=Math.min(125,this.armor+hit.armor);this.log='BLOCK +'+hit.armor;}
  if(hit.heal)this.hp=Math.min(this.maxHp,this.hp+hit.heal);
  if(hit.money){this.cash+=hit.money;this.log='GAIN '+hit.money+' COINS';}
  this.feedback={time:this.time,text:hit.mega?'MEGA CRIT!':hit.skill?'Critical Success!':hit.crit?'Critical Hit!':hit.damage?String(hit.damage):hit.armor?'+'+hit.armor:'+'+hit.money};
  this.emit('impact',{...hit,i:this.current});
 }
 takeHit(){
  const dmg=this.foe.power+(this.turn%3===0?5:0);
  const blocked=Math.min(this.armor,dmg);this.armor-=blocked;this.hp=Math.max(0,this.hp-dmg+blocked);
  this.log=blocked===dmg?'BLOCKED!':(dmg-blocked)+' DAMAGE';
  this.feedback={time:this.time,text:blocked===dmg?'Blocked!':'-'+(dmg-blocked)};
  this.emit('enemyHit',{damage:dmg-blocked,blocked});
 }
 win(){
  this.current=-1;this.gain=9+this.stage*2;this.cash+=this.gain;this.streak++;
  this.log='ENEMY DEFEATED';this.feedback=null;this.setPhase('reward');this.emit('payout',{count:this.gain});
 }
 enterShop(){
  if(this.stage===foes.length-1){this.setPhase('complete');return}
  this.offers=[this.pool[(this.stage+1)%this.pool.length],['bow','bolt','gouge','charm','star','dagger'][this.stage%6],this.count<5?'reel':'star'];
  this.prices=[6+this.stage,9+this.stage,12+this.stage];this.purchases.clear();
  this.focusOffer=0;this.log='UPGRADE A SYMBOL';this.setPhase('shop');
 }
 buy(slot){
  if(this.paused||this.phase!=='shop')return;
  if(slot>=3){
   const cost=slot===3?5:slot===4?7:10;
   if(this.cash<cost){this.reject();return}
   if(slot===3&&this.hp===this.maxHp){this.log='HEALTH FULL';return}
   this.cash-=cost;
   if(slot===3){this.hp=Math.min(this.maxHp,this.hp+35);this.log='HEALED +35'}
   if(slot===4){this.armor=Math.min(125,this.armor+25);this.log='GUARD +25'}
   if(slot===5){this.maxHp+=10;this.hp+=10;this.log='MAX HP +10'}
   this.emit('purchase',{slot,cost});return;
  }
  if(this.purchases.has(slot))return;
  const key=this.offers[slot],cost=this.prices[slot];this.focusOffer=slot;
  if(this.cash<cost){this.reject();return}
  this.cash-=cost;this.purchases.add(slot);
  if(key==='reel')this.count=Math.min(5,this.count+1);
  else if(this.pool.includes(key))this.levels[key]=(this.levels[key]||0)+1;
  else this.pool.push(key);
  this.log=key==='reel'?'REEL UNLOCKED':items[key].name+' +';
  this.emit('purchase',{slot,cost});
 }
 reject(){this.log='NEED MORE COINS';this.emit('deny',{})}
 leaveShop(){if(this.phase==='shop')this.enterFight(this.stage+1)}
 update(dt){
  if(this.paused)return;
  this.time+=dt;this.age+=dt;this.updateWheels(dt);
  switch(this.phase){
   case 'arrival':if(this.age>=1.3)this.startSpin();break;
   case 'settled':if(this.age>=.43)this.nextSymbol();break;
   case 'skill':if(this.age>=3.4)this.playSymbol(false);break;
   case 'resolve':
    if(!this.didHit&&this.age>=.115){this.didHit=true;this.applyHit()}
    if(this.age>=(this.hit.crit?.78:.535)){
     if(this.enemyHp===0)this.win();else this.nextSymbol();
    }break;
   case 'enemyWind':if(this.age>=.64){this.takeHit();this.setPhase('enemyHit')}break;
   case 'enemyHit':if(this.age>=.82){
    if(!this.hp){this.setPhase('defeat');this.emit('end',{})}
    else{this.turn++;this.startSpin()}
   }break;
   case 'reward':if(this.age>=2.25)this.enterShop();break;
  }
 }
}
window.SlotStudy={Machine,foes,items,clamp,lerp,mod,randomStream};
})();

</script>

 }

}

<script>
/* Cast case, timber, tabletop props and their illumination. All meshes, engraving
   and material maps are generated from the primitives below, in cabinet pixels. */
(() => {
'use strict';
const TAU = 2 * Math.PI;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(n, hi));
const fract = n => n - Math.floor(n);
const cache = new Map();
const P = {
  steel:  { base:[51,59,49], exposed:[151,145,114], rim:['#0c1211','#282e26','#a19775','#666958','#292f27','#111915','#080e0e','#4e5344'] },
  green:  { base:[52,66,54], exposed:[138,137,103], rim:['#101715','#303a30','#a59c78','#68705d','#354335','#1b2621','#0b1513','#515b47'] },
  brown:  { base:[102,68,43], exposed:[185,143,95], rim:['#251c16','#4a3320','#c29a68','#93704b','#5a3e29','#38291e','#251b15','#79563a'] },
  brass:  { base:[106,93,63], exposed:[188,169,115], rim:['#26281e','#494734','#d3b688','#a29069','#74664a','#463e2d','#292c23','#8f825c'] },
  dark:   { base:[37,43,37], exposed:[101,104,82], rim:['#0a1110','#202a23','#7e8166','#535d4b','#2d382e','#15231d','#09100e','#485240'] },
  glass:  { base:[29,36,30], exposed:[90,98,76], rim:['#0b110f','#141b17','#626850','#394735','#1b221b','#101512','#070c09','#353d2d'] }
};
function canvas(w,h) {
  const tmp = typeof OffscreenCanvas === 'function' ? new OffscreenCanvas(Math.ceil(w), Math.ceil(h)) : document.createElement('canvas');
  tmp.width = Math.ceil(w); tmp.height = Math.ceil(h);
  return tmp;
}
function cached(key,w,h,draw){
  let im=cache.get(key);
  if(!im){im=canvas(w,h);draw(im.getContext('2d'));cache.set(key,im);}
  return im;
}
function rng(seed){
  let a=seed>>>0;
  return ()=>{a=(Math.imul(a,1664525)+1013904223)>>>0;return a/4294967296;};
}
const nrand=rng(571344), noise=new Float32Array(16384);
for(let i=0;i<noise.length;i++)noise[i]=nrand();
function lattice(x,y){return noise[((x|0)*73+(y|0)*917)&16383];}
function smooth(x,y){
  const i=Math.floor(x),j=Math.floor(y);
  let u=x-i,v=y-j;u=u*u*(3-2*u);v=v*v*(3-2*v);
  return (lattice(i,j)*(1-u)+lattice(i+1,j)*u)*(1-v)+(lattice(i,j+1)*(1-u)+lattice(i+1,j+1)*u)*v;
}
function grad(c,x,y,u,v,stops){
  const g=c.createLinearGradient(x,y,u,v);
  for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);
  return g;
}

 [44,54,291,315,4,.24],[104,287,859,430,19,.58],
 [280,15,681,275,27,.54],[320,49,661,239,34,.78],[326,54,654,233,25,.19],
 [668,52,854,105,29,.68],[682,107,787,256,28,.43],[790,105,856,411,31,.66],
 [195,273,785,417,34,.67],[108,293,195,410,26,.53],
 [248,235,317,271,28,.5],[321,241,665,271,29,.63]

}

  const i=y*W+x,px=(x+.5)*STEP,py=(y+.5)*STEP;
  let z=.5,reflect=.15;
  for(const [x0,y0,x1,y1,top,spec] of bounds){
   if(px>=x0&&px<=x1&&py>=y0&&py<=y1){z=top;reflect=spec}
  }
  const cup=((px-938)/63)**2+((py-312)/76)**2;
  if(cup<1){z=23+25*Math.sqrt(1-cup);reflect=.82}

})();

  switch(name){
   case 'tick':this.hiss(1480,.022,.042,-.18);break;
   case 'press':this.tone(109,.06,'triangle',.24,34);this.hiss(720,.033,.15);break;
   case 'latch':this.hiss(1600,.082,.22,direction);this.tone(137,.095,'triangle',.22,47,direction);break;
   case 'focus':this.tone(411+(e.i||0)*54,.078,'triangle',.075,390,direction);break;
   case 'impact':
    if(e.damage){this.hiss(e.item==='bow'?2340:1680,e.crit?.17:.10,.22,direction);this.tone(e.crit?207:152,.16,'sawtooth',.095,44,direction)}
    if(e.armor){this.tone(479,.16,'triangle',.115,335,.1);this.tone(1023,.10,'sine',.068,869,.19)}
    if(e.crit){[617,824,1234].forEach((h,i)=>this.tone(h,.20,'triangle',.095,h*1.002,-.15+i*.15,i*.046))}
    break;
   case 'enemyHit':this.hiss(1570,.23,.31,.64);this.tone(142,.28,'sawtooth',.15,33,.55);this.tone(1230,.115,'triangle',.10,396,.68);break;
   case 'payout':[349,440,523,699].forEach((h,i)=>this.tone(h,.19,'triangle',.10,h,0,i*.072));break;
   case 'purchase':this.tone(710,.085,'sine',.10,754,-.05);this.tone(1120,.15,'triangle',.081,1290,.16,.067);break;
   case 'deny':this.tone(110,.17,'square',.041,61);break;
   case 'end':this.tone(175,.67,'triangle',.14,32);break;
  }
 }
 pump(g){
  if(!this.live||g.paused)return;const t=this.ac.currentTime;
  if(!this.nextBeat||this.nextBeat<t-.10)this.nextBeat=t+.045;
  const tick=60/86/4;
  while(this.nextBeat<t+.10){
   const n=this.beat++%32,delay=Math.max(0,this.nextBeat-t)+(n%2?.018:0);
   const intensity=g.phase==='shop'?.65:1;
   if(n%8===0||n===19||n===27)this.tone(106,.18,'sine',.11*intensity,38,0,delay);
   if(n%8===4){this.hiss(1810,.115,.085*intensity,.09,delay);this.tone(168,.09,'triangle',.047,122,0,delay)}
   if(n%2===0||n===15||n===29)this.hiss(5400,n%8===6?.065:.027,(n%4===0?.039:.024)*intensity,-.16,delay,1.1);
   if(n===0||n===6||n===16||n===23){const f=[65.41,77.78,58.27,51.91][(this.beat>>3)%4];this.tone(f,.27,'triangle',.047*intensity,f*.995,.04,delay)}
   this.nextBeat+=tick;
  }
 }
}
window.CabinetSound=CabinetSound;
})();

</script>
<script>
(() => {
'use strict';
const {Machine,Graphics,foes,items,clamp,label}=SlotStudy;
const $=id=>document.getElementById(id);
const display=$('glass'),screen=display.getContext('2d',{alpha:false});
const menu=$('settings'),keys=$('keys'),params=new URLSearchParams(location.search);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let gfx,game,layout,heldSince=0,lastRepeat=0,viewWidth=0,viewHeight=0,stylePhase='';
const buttons=new Map();
function telemetry(s){$('status').textContent=s}
const audio=new CabinetSound();
function notify(event,e){
 if(!game)return;
 gfx.event(event,e,game);audio.event(event,e);
 if(event==='reset'){gfx.stateReset(game)}
 if(event==='phase'){stylePhase='';telemetry({
  spin:'转动中，点 STOP 依次停轮。',settled:'卷轴已停止，依次结算。',skill:'点 GO 完成时机判定。',
  enemyWind:'敌方回合。',reward:'战斗胜利，金币落入左侧托盘。',shop:'选择符号升级，或点三角键前往下一场。',
  defeat:'战败，点 RESTART 再试。',complete:'通关，点 RESTART 重新开始。'
 }[e.phase]||game.log)}
}
function setupLayout(){
 const box=display.getBoundingClientRect();viewWidth=box.width;viewHeight=box.height;
 const dpr=Math.min(devicePixelRatio||1,2);display.width=Math.max(1,Math.round(box.width*dpr));display.height=Math.max(1,Math.round(box.height*dpr));
 const portrait=box.height>box.width*1.06;
 const w=portrait?480:960,h=portrait?clamp(box.height/box.width*480,685,1160):540;
 const s=Math.min(box.width/w,box.height/h);
 layout={portrait,w,h,s,ox:(box.width-w*s)/2,oy:(box.height-h*s)/2,dpr,parts:{}};
 stylePhase='';
}
function blit(c,world,src,dst){
 const k=gfx.scale;c.drawImage(world,src[0]*k,src[1]*k,src[2]*k,src[3]*k,...dst);
}
function part(c,world,key,src,dst){blit(c,world,src,dst);layout.parts[key]={src,dst}}
function portrait(c,world,g){
 const h=layout.h,head=clamp(117+(h-685)*.35,117,274),mid=head+254;
 const actualReel=mid+66,buttonY=actualReel+123+clamp((h-780)*.085,0,32);
 CabinetArt.desk(c,true,h,gfx.motion);
 const trayScale=clamp((head-21)/302,.32,.73);
 c.save();c.translate(-7,-4);c.scale(trayScale,trayScale);gfx.drawCoins(c,g);c.restore();
 CabinetArt.portraitChassis(c,head,actualReel,buttonY,h);
 part(c,world,'main',[282,20,395,252],[13,head,385,246]);
 part(c,world,'meter',[789,108,66,300],[404,head+5,59,245]);
 part(c,world,'turn',[670,53,185,51],[158,head-65,185,51]);
 part(c,world,'funds',[105,292,89,120],[12,mid+2,49,66]);
 CabinetArt.plaque(c,69,mid+9,391,42);
 label(c,g.log,265,mid+24,1.52,'#cbb782','center',336);
 part(c,world,'rail',[191,270,595,154],[9,actualReel,462,119]);
 if(g.phase==='shop'){
   part(c,world,'foot',[110,412,748,123],[8,buttonY,464,76]);
 }else if(g.phase==='skill'){
   const src=[217,410,540,92],dst=[12,buttonY,456,80];
   layout.parts.foot={src,dst};
   c.save();c.translate(dst[0],dst[1]);c.scale(dst[2]/src[2],dst[3]/src[3]);c.translate(-src[0],-src[1]);gfx.spinner(c,g);c.restore();
 }else{
   layout.parts.foot={src:[296,430,394,110],dst:[70,buttonY,340,95]};
   if(gfx.drawer>.002){
    c.save();c.beginPath();c.rect(67,buttonY-1,346,97);c.clip();
    CabinetArt.drawer(c,70,buttonY+99*(1-gfx.drawer),340,95,clamp(1-(g.time-gfx.pressedAt)/.12,0,1),g.phase==='defeat'||g.phase==='complete'?'RESTART':'STOP');c.restore();
   }
 }
 function local(key,x,y){
   const {src,dst}=layout.parts[key];
   return [dst[0]+(x-src[0])*dst[2]/src[2],dst[1]+(y-src[1])*dst[3]/src[3]];
 }
 gfx.effects.onPortrait(c,g,gfx.reduced,local);
 CabinetArt.leafShade(c,g.time,true,h);
}
function screenPos(key,rect){
 let [x,y,w,h]=rect;
 if(layout.portrait){
  const block=layout.parts[key];if(!block)return null;
  const {src,dst}=block;x=dst[0]+(x-src[0])*dst[2]/src[2];y=dst[1]+(y-src[1])*dst[3]/src[3];w*=dst[2]/src[2];h*=dst[3]/src[3];
 }
 return [layout.ox+x*layout.s,layout.oy+y*layout.s,w*layout.s,h*layout.s];
}
function draw(){
 const a=layout,world=gfx.paint(game,a.portrait);const pixel=a.dpr;
 screen.setTransform(1,0,0,1,0,0);screen.fillStyle='#101511';screen.fillRect(0,0,display.width,display.height);
 screen.setTransform(a.s*pixel,0,0,a.s*pixel,a.ox*pixel,a.oy*pixel);
 if(a.portrait)portrait(screen,world,game);
 else{
  // Letterbox on extra-wide displays. The glass and reel openings always retain reference aspect.
  screen.drawImage(world,0,0,960,540);
 }
 const bx=a.portrait?32:21,by=a.portrait?24:21;
 screen.save();screen.globalAlpha=gfx.hover==='menu'?.88:.43;screen.fillStyle='#182019';screen.fillRect(bx-10,by-10,22,22);
 screen.fillStyle='#ccb887';screen.fillRect(bx-4,by-4,2.3,9);screen.fillRect(bx+2,by-4,2.3,9);screen.restore();
 syncControls();
}
function bind(name,aria,run){
 const b=document.createElement('button');b.type='button';b.dataset.key=name;b.setAttribute('aria-label',aria);keys.appendChild(b);
 b.addEventListener('pointerenter',()=>{if(gfx)gfx.hover=name});
 b.addEventListener('pointerleave',()=>{if(gfx?.hover===name)gfx.hover=''});
 b.addEventListener('pointerdown',e=>{if(e.button!==0)return;audio.unlock();
  if(name==='action'&&game.phase==='spin'){heldSince=performance.now();lastRepeat=heldSince;}
 });
 b.addEventListener('click',e=>{e.preventDefault();audio.unlock();if(heldSince!==-1)run();heldSince=0;});
 buttons.set(name,b);
}
function place(name,coords,aria){
 const b=buttons.get(name);if(!coords){b.hidden=true;return}b.hidden=false;
 const [x,y,w,h]=coords;
 Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 if(aria)b.setAttribute('aria-label',aria);
}
const xCenters=[272,379,487,598,708];
function syncControls(){
 const g=game,id=[g.phase,g.current,g.count,g.nextStop,layout.portrait,viewWidth,viewHeight,g.paused,g.purchases.size].join(':');
 const glass=display.dataset;
 if(glass.phase!==g.phase)glass.phase=g.phase;
 glass.encounter=g.foe.id;glass.foeHp=g.enemyHp;glass.playerHp=g.hp;glass.gold=g.cash;glass.armor=g.armor;glass.reels=g.count;glass.stopped=g.nextStop;
 if(stylePhase===id)return;stylePhase=id;
 for(const b of buttons.values())b.hidden=true;
 const a=layout;
 place('menu',[a.ox+Math.max(0,(a.portrait?7:0)*a.s),a.oy,Math.max(34,45*a.s),Math.max(34,45*a.s)]);
 if(g.paused)return;
 if(g.phase==='spin'&&g.nextStop<g.active.length){
  place('action',screenPos('foot',[298,430,389,110]),'STOP · 停第'+(g.nextStop+1)+'个卷轴');
  const i=g.active[g.nextStop];place('reel'+i,screenPos('rail',[xCenters[i]-48,290,96,111]),'停轮 · 槽位 '+(i+1));
 }else if(g.phase==='skill')place('action',screenPos('foot',[xCenters[g.current]-44,410,88,78]),'GO · 时机判定');
 else if(g.phase==='defeat'||g.phase==='complete')place('action',screenPos('foot',[298,430,389,110]),'RESTART · 再来一局');
 else if(g.phase==='reward')place('action',screenPos('main',[326,54,328,179]),'领取战利品');
 else if(g.phase==='shop'){
  place('action',screenPos('foot',[785,413,73,87]),'下一场');
  for(let i=0;i<3;i++){
   const name=g.offers[i]==='reel'?'增加一个卷轴':items[g.offers[i]].name;
   if(!g.purchases.has(i))place('buy'+i,screenPos('rail',[330+i*109,291,103,113]),'购买 '+name+' · '+g.prices[i]+' 金币');
   place('use'+i,screenPos('foot',[129+i*94,425,88,94]),['补血','购买护甲','提高生命上限'][i]);
  }
 }
}
function pauseGame(){
 if(!game)return;heldSince=0;audio.suspend();game.paused=true;$('encounter').value=game.training||String(game.stage);menu.showModal();stylePhase='';
}
function resumeGame(){menu.close();game.paused=false;audio.unlock();stylePhase='';heldSince=0;}
function controls(){
 bind('action','STOP',()=>game.action());
 bind('menu','暂停与机台手册',pauseGame);
 for(let i=0;i<5;i++)bind('reel'+i,'停轮',()=>game.action());
 for(let i=0;i<3;i++){bind('buy'+i,'购买符号',()=>game.buy(i));bind('use'+i,'购买补给',()=>game.buy(i+3))}
 foes.forEach((f,i)=>{const op=document.createElement('option');op.value=i;op.textContent=f.place+' · '+f.name;$('encounter').append(op)});
 $('menuResume').onclick=resumeGame;
 $('practice').onclick=()=>{
  const choice=$('encounter').value;
  if(choice==='coins'||choice==='single')game.coinPractice(choice);else game.reset(Number(choice));
  resumeGame();draw();
 };
 for(const [value,name] of [['single','单枚出币 · 空托盘'],['coins','金币暴击 · 三个相邻金币符号']]){
  const op=document.createElement('option');op.value=value;op.textContent=name;$('encounter').append(op);
 }
 $('sound').textContent='声音 · '+(audio.enabled?'开':'关');
 $('sound').onclick=()=>{audio.setEnabled(!audio.enabled);$('sound').textContent='声音 · '+(audio.enabled?'开':'关')};
 menu.addEventListener('cancel',e=>{e.preventDefault();resumeGame()});
 addEventListener('keydown',e=>{
  if(!game||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
  if(game.paused)return;
  if(e.key==='Escape'||e.key.toLowerCase()==='p'){e.preventDefault();pauseGame();return}
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();audio.unlock();game.action();return}
  if(game.phase==='shop'&&/^[123]$/.test(e.key)){audio.unlock();game.buy(Number(e.key)-1)}
 });
 // Uninterrupted hold engages the ratchet. Quick taps still give independent timing control.
 addEventListener('pointerup',()=>{if(heldSince>0)heldSince=0;setTimeout(()=>{if(heldSince===-1)heldSince=0},80)});
 addEventListener('pointercancel',()=>{heldSince=0});addEventListener('blur',()=>{heldSince=0;lastRepeat=0});
}
async function run(){
 const seed=params.has('seed')?Number(params.get('seed'))>>>0:Math.random()*4294967296>>>0;
 gfx=new Graphics(seed,e=>audio.coin(e));
 const stage=foes.findIndex(v=>v.id===params.get('encounter'));
 game=new Machine(seed,notify,Math.max(0,stage));
 const practice=params.get('practice');
 if(practice==='coins'||practice==='single')game.coinPractice(practice);
 gfx.stateReset(game);
 controls();setupLayout();draw();$('loading').hidden=true;
 telemetry('点 STOP 依次停下三个卷轴，或按空格。');
 new ResizeObserver(()=>{setupLayout();draw()}).observe(display);
 let last=performance.now(),acc=0;
 document.addEventListener('visibilitychange',()=>{acc=0;last=performance.now();heldSince=0;if(document.hidden)audio.suspend();else if(audio.ac&&!game.paused)audio.unlock()});
 function loop(now){
  const delta=clamp((now-last)/1000,0,.25);last=now;
  if(!document.hidden&&!game.paused){
   acc+=delta;
   while(acc>=1/120){game.update(1/120);gfx.update(1/120,game);acc-=1/120;}
   if((heldSince>0&&now-heldSince>430||heldSince===-1)&&now-lastRepeat>405&&game.phase==='spin'){
    game.action();lastRepeat=now;heldSince=-1;
   }
   audio.pump(game);draw();
  }
  requestAnimationFrame(loop);
 }
 requestAnimationFrame(loop);
}
run().catch(e=>{const p=$('loading');p.textContent=e.message+' · 点击重新载入';p.onclick=()=>location.reload();console.error(e)});
})();

</script>
