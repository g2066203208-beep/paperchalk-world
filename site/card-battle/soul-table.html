<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>渡魂牌局 · 二十一点</title>
<style>
@font-face{font-family:Paper;src:url(../assets/fonts/PaperSerif-Medium.woff2)}*{box-sizing:border-box}body{margin:0;color:#f3dfaa;background:#121a17;font:16px Paper,Georgia,serif}main{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse at 40% 80%,#963e24aa,transparent 61%),radial-gradient(ellipse at 70% 14%,#335a4d,#555039 52%,#171f1c 93%)}main:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 13vw #080c0b;z-index:-1}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px clamp(12px,4vw,65px);background:#0c1210c9}header h1{margin:0;font-size:clamp(18px,2.8vw,38px);letter-spacing:.15em}small,.note{color:#cdbb8e}button,a{font:inherit;color:inherit;touch-action:manipulation}button{background:#191c16;border:1px solid #a78a50;padding:9px 14px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid #e6c786;outline-offset:2px}button:disabled{opacity:.55;cursor:default}.field{flex:1;width:min(1120px,97%);margin:auto;display:grid;align-content:center;gap:clamp(12px,3vh,30px);padding:3vh 0}.row{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1vw,16px);perspective:950px}.seat{width:clamp(40px,8vw,94px);text-align:center;font-size:clamp(12px,1.4vw,18px)}.seat b{display:block;color:#f5cf76;font-size:1.25em}.pile,.card,.slot{width:clamp(42px,9.8vw,116px);height:clamp(74px,14vw,159px);border-radius:6% / 4%;position:relative;flex:none}.pile{transform:rotate(-8deg);box-shadow:-2px 3px #42261a,-4px 5px #a68356,-6px 8px #201712,0 12px 13px #15130f;background:repeating-radial-gradient(ellipse,#512d23 0 2px,#8e5741 3px,#4c2820 4px);color:#f1c58a;text-shadow:0 1px 4px black;padding:0}.pile span{display:inline-block;background:#34251e;border:1px solid #a68056;padding:5px 2px}.card,.slot{padding:0}.slot{border:1px dashed #bfaa766b;background:#201c131c;color:#e1c8949c;font-size:clamp(10px,1.2vw,15px)}.available{border-color:#ffda82;background:#b67c2b45;color:#ffdda3;animation:glimmer 1.7s infinite alternate}.card{font-family:Georgia,serif;color:#242219;background:repeating-linear-gradient(113deg,transparent 0 6px,#8b62300b 7px 8px),radial-gradient(ellipse,#f4dab0,#dbb678 75%,#917244);border:2px solid #624324;box-shadow:inset 0 0 0 2px #d2ad73,inset 0 0 0 3px #8e6c45,2px 5px 6px #16110bb8;display:grid;place-items:center;transform:rotate(var(--tilt));font-size:clamp(18px,3.5vw,49px)}.red{color:#8b291e}.corner{font:bold clamp(12px,1.7vw,23px) Georgia;position:absolute;left:8%;top:5%}.card em{position:absolute;bottom:9%;font:clamp(9px,1vw,13px) Paper,serif}.pips{display:grid;grid-template-columns:repeat(2,1fr);font-size:.45em;line-height:1.02;gap:0 .18em}.scores{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,66px)}.score{min-width:52px;text-align:center;font:bold 27px Georgia}.score small{display:block;font:12px Paper,serif}.score i{background:#2d6264;display:inline-grid;place-items:center;min-width:48px;height:44px;clip-path:polygon(50% 0,94% 22%,94% 75%,50% 100%,6% 75%,6% 22%);color:#fff2ca;font-style:normal}.foe i{background:#803521}.target{font:34px Georgia;color:#f7d298;border:1px solid #b58c56;border-radius:50%;padding:5px 9px;box-shadow:0 0 0 4px #261d14,0 0 0 5px #94784f}.actions{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;flex-wrap:wrap}.actions button:first-child{background:#d2ae70;color:#251e14}.message{text-align:center;margin:0;min-height:1.5em}.new{animation:deal .32s ease-out}@keyframes deal{from{opacity:.1;translate:-45px -20px;rotate:-14deg}}@keyframes glimmer{to{box-shadow:inset 0 0 15px #d7a74450}}dialog{max-width:min(420px,92vw);background:#252820;color:#e8d6ad;border:1px solid #b19a6e;padding:24px}dialog::backdrop{background:#080b09bb}footer{font-size:13px}footer a{text-decoration:none} @media(max-width:600px){.seat{width:38px}.field{width:99%}.row{gap:4px}.card,.slot,.pile{width:12vw;height:19vw}.actions{padding:0 10px}.message{font-size:14px;padding:0 12px}header,footer{padding:10px}.score{font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<main><canvas id="grain" aria-hidden="true"></canvas><header><div><small>冥河渡口</small><h1>渡魂牌局</h1></div><span id="journey"></span><button id="help">桌规</button></header><section class="field"><div class="row" id="enemy"></div><div class="scores"><div class="score"><i id="myScore"></i><small>你的点数</small></div><div class="target">21</div><div class="score foe"><i id="theirScore"></i><small>亡魂点数</small></div></div><div class="row" id="player"></div><p class="message" aria-live="polite" id="message"></p><div class="actions" id="actions"></div></section><footer><a href="./coin-payout-3d.html">返回金币机</a><span id="progress"></span></footer></main>
<dialog id="rules"><h2>渡口桌规</h2><p>上下两席轮流行动。点击自己的牌堆，抽一张牌，再点空位落牌。每回合限抽一次，也可以停牌。双方停牌、牌位满或爆点后比大小，超过 21 点的一方落败。</p><p>A 计 1 或 11，自动取最优值。洞察位可看下张牌，灰烬位让该牌减 2 点（最低 1 点）。每局双方各押一枚魂币，平局各自取回。</p><p>赢光对手的魂币，选一项遗物再前往下一桌。过三桌即可渡河。</p><button id="closeRules">回到牌桌</button></dialog>
<script>
const el=id=>document.getElementById(id);
const suits=['♣','♦','♠','♥'], names=['守灯人','无名水手','摆渡人'], places=['芦苇岸','沉船湾','忘川'];
let stage=0,coins=4,rival=3,round=0,phase,deck,mine,theirs,pending,passed,insight,ash=2,ward=false,usedWard=false,log='';
function texture(){
 const c=el('grain'),w=c.width=1000,h=c.height=650,g=c.getContext('2d');let seed=23;
 function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
 for(let i=0;i<105000;i++){g.fillStyle=random()>.5?'rgba(0,0,0,.10)':'rgba(243,207,138,.08)';g.fillRect(random()*w,random()*h,random()*3+1,1)}
 for(let i=0;i<200;i++){let x=random()*w,y=random()*h;g.beginPath();g.moveTo(x,y);for(let j=0;j<9;j++){x+=random()*9-2;y+=random()*8-3;g.lineTo(x,y)}g.strokeStyle='rgba(35,24,15,.16)';g.stroke()}
 // Inked fingertips frame the table, outside the playable card slots.
 function hand(x,y,angle,scale){
  g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);
  g.shadowColor='#0b100dcc';g.shadowBlur=12;g.shadowOffsetY=6;
  g.fillStyle='#603527';g.strokeStyle='#211d17';g.lineWidth=3;
  const palm=new Path2D('M-35 -55 L31 -55 Q32 -19 44 2 Q53 18 59 35 Q55 45 48 37 L30 17 Q32 43 36 65 Q34 76 27 66 L14 28 L17 81 Q14 92 8 81 L0 32 L-3 84 Q-8 94 -12 82 L-15 30 L-25 68 Q-31 76 -32 65 L-27 22 Q-39 5 -35 -55Z');
  g.fill(palm);g.stroke(palm);g.shadowBlur=0;g.shadowOffsetY=0;g.clip(palm);
  for(let i=0;i<470;i++){let a=random()*100-40,b=random()*145-55;g.strokeStyle=random()>.5?'#c9905f55':'#21190f77';g.lineWidth=.8;g.beginPath();g.moveTo(a,b);g.lineTo(a+3,b+9);g.stroke()}
  g.restore()
 }
 hand(115,4,-.14,1.3);hand(902,650,3.27,1.35);
}texture();
function shuffled(){let d=[];for(const s of suits)for(let n=1;n<=10;n++)d.push({n,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function total(hand){let t=0,a=0;for(const c of hand.filter(Boolean)){t+=c.value??c.n;if(c.n===1&&c.value===undefined)a++}return a&&t+10<=21?t+10:t}
function begin(){round++;deck=shuffled();mine=[deck.pop(),null,null,null,null];theirs=[deck.pop(),null,null,null,null];passed=false;insight=false;usedWard=false;pending=null;phase='play';log='轮到你了。点击左侧牌堆抽牌。';render()}
function badge(c){return c.n===1?'A':c.n}
function card(c,i){const node=document.createElement('div');node.className='card '+('♦♥'.includes(c.s)?'red':'');node.style.setProperty('--tilt',[-3,2,-2,3,-1][i]+'deg');node.innerHTML='<b class="corner">'+badge(c)+c.s+'</b><span class="pips">'+Array.from({length:c.n},()=>'<span>'+c.s+'</span>').join('')+'</span><em>'+(c.value!==undefined?'灰烬 · '+c.value:'')+'</em>';node.setAttribute('aria-label',badge(c)+c.s);return node}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
function row(id,hand,own){const r=el(id);r.replaceChildren();const pile=button('',draw);pile.className='pile';pile.innerHTML='<span>'+(own?(pending?badge(pending)+pending.s:'抽牌'):'亡魂')+'</span>';pile.disabled=!own||phase!=='play'||!!pending;r.append(pile);
 hand.forEach((c,i)=>{if(c){r.append(card(c,i));return}const active=own&&phase==='play'&&!!pending;const b=button(own?(['','洞察','', '灰烬',''][i]||'落牌'):'',()=>place(i));b.className='slot'+(active?' available':'');b.disabled=!active;r.append(b)});
 const seat=document.createElement('span');seat.className='seat';seat.innerHTML=(own?'旅人':names[stage])+'<b>◉ '+(own?coins:rival)+'</b>';r.append(seat)}
function draw(){if(phase!=='play'||pending)return;pending=deck.pop();log='抽到 '+badge(pending)+pending.s+'，点下排空位落牌。';render()}
function place(i){if(!pending||mine[i]||phase!=='play')return;if(i===3)pending.value=Math.max(1,pending.n-ash);mine[i]=pending;pending=null;insight=i===1;opponent(false);if(phase==='play'&&insight)log+=' 下张牌：'+badge(deck.at(-1))+deck.at(-1).s;render();el('player').children[i+1].classList.add('new')}
function opponent(standing){const threshold=15+stage;let draws=0;while(total(mine)<=21&&!passed&&total(theirs)<threshold&&theirs.includes(null)){theirs[theirs.indexOf(null)]=deck.pop();draws++;if(!standing)break}
 passed=passed||total(theirs)>=threshold||!theirs.includes(null);
 if(standing||!mine.includes(null)||total(mine)>=21||total(theirs)>21){if(!standing&&total(mine)<=21&&total(theirs)<=21&&!passed){opponent(true);return}settle();return}
 log=total(theirs)>21?'亡魂爆点。':passed?'亡魂已停牌。你仍可以抽牌。':draws?'亡魂落了一张牌。轮到你。':'轮到你。'}
function settle(){let a=total(mine),b=total(theirs);let diff=a>21?-1:b>21?1:Math.sign(a-b);if(diff<0&&ward&&!usedWard&&a===22){diff=0;usedWard=true}coins+=diff;rival-=diff;log=a+' 比 '+b+' · '+(diff>0?'你赢得一枚魂币。':diff<0?'亡魂取走一枚魂币。':'平局，各自取回魂币。');phase=coins===0?'lost':rival===0?(stage===2?'won':'reward'):'next';if(phase==='won')log+=' 摆渡人收起船桨，让你登船。';if(phase==='lost')log+=' 你的魂币已耗尽。'}
function reward(type){if(type==='ash')ash+=2;else if(type==='coin')coins+=2;else ward=true;stage++;rival=3+stage;round=0;begin()}
function reset(){stage=0;coins=4;rival=3;round=0;ash=2;ward=false;begin()}
function render(){row('enemy',theirs,false);row('player',mine,true);el('myScore').textContent=total(mine);el('theirScore').textContent=total(theirs);el('journey').textContent=places[stage]+' · 第 '+round+' 局';el('progress').textContent='渡程 '+(stage+1)+' / 3';el('message').textContent=log;const a=el('actions');a.replaceChildren();
 if(phase==='play'&&!pending)a.append(button('停牌',()=>{opponent(true);render()}));if(phase==='next')a.append(button('下一局',begin));if(phase==='reward'){a.append(button('取两枚魂币',()=>reward('coin')),button('强化灰烬位',()=>reward('ash')));if(!ward)a.append(button('护符 · 22点免败',()=>reward('ward')))}if(['lost','won'].includes(phase))a.append(button('再渡一次',reset))}
el('help').onclick=()=>el('rules').showModal();el('closeRules').onclick=()=>el('rules').close();begin();
</script></html>
