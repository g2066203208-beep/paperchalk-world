#stage:after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:17;transition:opacity .35s}#stage.light-switch-off:after{opacity:.72}
@media(prefers-reduced-motion:reduce){.reel,.changing #frameflash{animation:none!important}#film-inner{transition:none}}
</style>

const roster=[

// Independent, moving light-source pass: computed each frame (not painted into a photograph).

function shadowPolygon(cx,cy,verts,reach,opacity){shadow.beginPath();verts.forEach(([x,y],i)=>{if(i===0)shadow.moveTo(x,y);else shadow.lineTo(x,y);});for(let i=verts.length-1;i>=0;i--){const [x,y]=verts[i];const dx=x-cx,dy=y-cy,mag=Math.hypot(dx,dy);shadow.lineTo(x+dx/(mag||1)*reach,y+dy/(mag||1)*reach);}shadow.closePath();shadow.fillStyle=`rgba(0,0,0,${opacity})`;shadow.fill();}

 // Ambient point light over the left pedestal, inverse-square-like radial attenuation.

 // Screen receives a projection beam with angular falloff and a soft volumetric boundary.

/* Paperchalk film projector selection stage: actual spatial lighting and PCF
   shadow maps on independent 2.5D receiving planes. No pre-baked shadows.
   Rendered underneath illustrated foreground cutouts and projection/UI. */
import * as THREE from '../sphere-maze/vendor/three.module.js';

const host = document.querySelector('#webgl-lighting');
const stage = document.querySelector('#stage');
if (host && stage) {
  try {
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(1600, 900, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.96;
    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.width = '1600px';
    renderer.domElement.style.height = '900px';
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.15, 60);
    camera.position.set(0, 0.8, 14);
    camera.lookAt(0, 0, -0.4);
    const ambient = new THREE.AmbientLight(0x80675a, 0.38);
    scene.add(ambient);

    function fabricTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0, '#302128'); bg.addColorStop(1, '#1b151b');
      g.fillStyle = bg; g.fillRect(0,0,512,512);
      for (let x=0;x<512;x+=42) {
        g.fillStyle = x%84 ? 'rgba(159,108,84,.036)' : 'rgba(0,0,0,.08)';
        g.fillRect(x,0,4,512);
      }
      for (let y=0;y<512;y+=6) {
        g.fillStyle='rgba(216,156,105,.011)'; g.fillRect(0,y,512,1);
      }
      const t = new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
    }
    function plankTexture(){
      const c=document.createElement('canvas');c.width=512;c.height=512;
      const g=c.getContext('2d');g.fillStyle='#2d1e1e';g.fillRect(0,0,512,512);
      for(let y=0;y<512;y+=75){
        g.fillStyle=y%150?'#322421':'#493024';g.fillRect(0,y,512,71);
        g.fillStyle='rgba(255,199,134,.08)';g.fillRect(0,y,512,2);
        g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,y+69,512,7);
        for(let x=0;x<512;x+=16){g.fillStyle='rgba(255,217,159,.018)';g.fillRect(x,y+4,1,60)}
      }
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;
    }
    const wall=new THREE.Mesh(new THREE.PlaneGeometry(14,7.9),new THREE.MeshStandardMaterial({map:fabricTexture(),color:0x8d736b,transparent:true,opacity:.52,roughness:1,metalness:0,side:THREE.DoubleSide}));
    wall.position.set(0,0,-2.9);wall.receiveShadow=true;scene.add(wall);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(14,12),new THREE.MeshStandardMaterial({map:plankTexture(),color:0x907769,transparent:true,opacity:.50,roughness:0.91,metalness:.04,side:THREE.DoubleSide}));
    floor.rotation.x=-Math.PI/2;floor.position.set(0,-2.95,1.6);floor.receiveShadow=true;scene.add(floor);

    // These silhouettes are planes with alpha cutouts, NOT solid imported models.
    // The same light casts dynamic shadows from them onto wall and floor.
    function silhouetteTexture(type){
      const c=document.createElement('canvas');c.width=512;c.height=512;
      const g=c.getContext('2d');g.clearRect(0,0,512,512);g.fillStyle='#fff';
      if(type==='body'){
        g.beginPath();g.moveTo(88,110);g.lineTo(380,108);g.lineTo(437,211);g.lineTo(402,390);g.lineTo(132,413);g.lineTo(83,312);g.closePath();g.fill();
        g.fillRect(100,400,350,32);g.fillRect(149,426,42,86);g.fillRect(352,426,42,86);
        g.beginPath();g.ellipse(430,236,60,44,0,0,Math.PI*2);g.fill();
      } else {
        g.beginPath();g.arc(256,256,238,0,Math.PI*2);g.fill();
        g.globalCompositeOperation='destination-out';
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3;const b=a+Math.PI/6;
          g.beginPath();g.moveTo(256+Math.cos(a)*62,256+Math.sin(a)*62);
          g.arc(256,256,190,a+.08,b+.43,false);
          g.lineTo(256+Math.cos(b)*62,256+Math.sin(b)*62);g.closePath();g.fill();
        }
        g.beginPath();g.arc(256,256,21,0,Math.PI*2);g.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const bodyShadow=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.7),new THREE.MeshStandardMaterial({map:silhouetteTexture('body'),alphaTest:.20,side:THREE.DoubleSide,transparent:true,opacity:0,colorWrite:false,depthWrite:false}));
    bodyShadow.position.set(-3.8,-0.75,1.05);bodyShadow.castShadow=true;scene.add(bodyShadow);
    const reelTexture=silhouetteTexture('reel');
    const reels=[[-4.62,2.12,.93,1.8],[-3.52,1.52,1.1,1.53]].map(([x,y,z,s])=>{
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshStandardMaterial({map:reelTexture,alphaTest:.18,side:THREE.DoubleSide,transparent:true,opacity:0,colorWrite:false,depthWrite:false}));
      mesh.position.set(x,y,z);mesh.castShadow=true;scene.add(mesh);return mesh;
    });
    // Independent real 3D shadow receiver behind the CSS screen projection.
    const projectionReceiver=new THREE.Mesh(new THREE.PlaneGeometry(5.75,3.65),new THREE.MeshStandardMaterial({color:0xd9b78d,roughness:.98,transparent:true,opacity:.23,side:THREE.DoubleSide,emissive:0x7b4f27,emissiveIntensity:.16}));
    projectionReceiver.position.set(2.18,.44,-2.72);projectionReceiver.receiveShadow=true;scene.add(projectionReceiver);
    const screenOuter = new THREE.Mesh(new THREE.PlaneGeometry(5.96,3.87),new THREE.MeshStandardMaterial({color:0x26191b,transparent:true,opacity:0,colorWrite:false,depthWrite:false}));
    screenOuter.position.set(2.18,.44,-2.62);screenOuter.castShadow=true;scene.add(screenOuter);

    // Visible warm lamp and projector beam, plus physically shadowed surfaces.
    const lamp=new THREE.PointLight(0xffc085,14.8,10,2);lamp.position.set(-4.65,1.68,2.9);scene.add(lamp);
    const overhead=new THREE.SpotLight(0xffd3a3,65,17,Math.PI/4.5,.72,1.6);
    overhead.position.set(-3.9,3.4,3.6);overhead.target.position.set(-1.2,-1.2,-1.5);
    overhead.castShadow=true;overhead.shadow.mapSize.set(1024,1024);
    overhead.shadow.bias=-.00016;overhead.shadow.normalBias=.04;
    scene.add(overhead,overhead.target);
    const projector = new THREE.SpotLight(0xffecd0,95,18,Math.PI/3.3,.73,1.4);
    projector.position.set(-2.55,.53,1.75);projector.target.position.set(1.75,.4,-2.8);
    projector.castShadow=true;projector.shadow.mapSize.set(1024,1024);
    projector.shadow.bias=-.00018;projector.shadow.normalBias=.02;
    scene.add(projector,projector.target);

    let lightOn=true, reelUntil=0, frameId=0;
    stage.addEventListener('projector-light-change',e=>{lightOn=!!e.detail?.on});
    stage.addEventListener('film-advance',()=>{reelUntil=performance.now()+680});
    const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function tick(ms){
      const time=ms*.001;
      const flicker=reduceMotion?1:(1+.017*Math.sin(time*41)+.009*Math.sin(time*97));
      const target=lightOn?1:0;
      projector.intensity=95*target*flicker;overhead.intensity=65*target;
      lamp.intensity=14.8*target;ambient.intensity=lightOn?.38:.08;
      projectionReceiver.material.emissiveIntensity=lightOn?.16:.008;
      if(ms<reelUntil && !reduceMotion){reels[0].rotation.z+=.04;reels[1].rotation.z-=.055;}
      renderer.render(scene,camera);
      frameId=requestAnimationFrame(tick);
    }
    frameId=requestAnimationFrame(tick);
    window.addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);renderer.dispose();});
    stage.dataset.webglShadows='active';
  } catch(error) {
    stage.dataset.webglShadows='unavailable';
    console.warn('2.5D real-time WebGL shadow pass unavailable; hand-painted/canvas fallback remains:',error);
  }
}
