<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170d16">
<meta name="description" content="纸片世界的胶片人物选择舞台：由独立的二维纸片与真实三维光影组成。">
<title>纸片世界｜老式电影机人物放映室</title>
<link rel="stylesheet" href="./production.css">
</head>
<body>
<main id="theater" aria-label="老式电影机 2.5D 人物选择场景">
  <div id="stage" role="img" aria-label="可交互的纸片马戏剧院舞台，左侧电影放映机、右侧人物幕布、前景七格胶片"></div>
  <div id="fallback" hidden role="alert">此浏览器无法启动 WebGL 场景。请使用最新版本的 Chrome 或 Edge。</div>
  <div id="controls" aria-label="胶片选择操作">
    <button id="previous" type="button" title="胶片倒退一格" aria-label="上一格">‹</button>
    <span id="counter" aria-live="polite">02 / 07</span>
    <button id="following" type="button" title="摇到下一格胶片" aria-label="下一格">›</button>
    <button id="illumination" type="button" aria-pressed="true" title="切换真实投影灯光">灯光</button>
    <button id="compare" type="button" aria-pressed="false" title="切换参考原图与可交互分层">对照</button>
  </div>
  <div id="hint">摇柄 / 胶片：点击切换　 ·　 方向键：逐格切换</div>
  <div id="loading">正在装载纸片舞台…</div>
</main>
<script type="module" src="./production.js"></script>
</body></html>
