<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18151b">
<title>纸片电影放映室｜2.5D 演出舞台 · 布局验收</title>
<link rel="stylesheet" href="./blockout.css">
</head>
<body>
<main id="viewport" role="region" aria-label="完全由2D纸片组成的三维空间选角放映室">
 <div id="viewport-3d"></div>
 <div class="corner-info">
  <div class="eyebrow">PAPERCHALK WORLD / PAPER CINEMA</div>
  <h1>角色放映室 <span>·</span> 纸片舞台</h1>
  <p>镜头与层次验收版 · 全部机械仍是可更换的 2D 纸片素材</p>
 </div>
 <div id="labels" hidden aria-hidden="true">
  <span data-label="screen">幕布 · 10.16 × 5.20</span>
  <span data-label="projector">放映机 · 单张纸片 + 独立卷轴</span>
  <span data-label="film">七格前景胶片轨道</span>
 </div>
 <div class="film-status"><span class="status-dot"></span><span id="character-name">血液医师</span><span id="selection">胶片 02 / 07</span></div>
 <div id="error" hidden>WebGL 未启动；请使用支持 WebGL 的浏览器。</div>
 <nav aria-label="放映机操作">
  <button id="prev" type="button" aria-label="摇到上一格胶片">‹ 上一格</button>
  <button id="next" type="button" aria-label="摇到下一格胶片">下一格 ›</button>
  <span class="separator" aria-hidden="true"></span>
  <button id="lighting" type="button" aria-pressed="true">关闭照明</button>
  <button id="portrait" type="button">预览原版立绘</button>
  <button id="guides" type="button" aria-pressed="false">显示空间标注</button>
  <button id="reset-camera" type="button">镜头复位</button>
 </nav>
 <div class="slider-panel">
  <label>镜头透视 <input id="fov" aria-label="镜头透视" type="range" min="26" max="42" value="30" step="1"><output id="fov-val">30°</output></label>
 </div>
 <div class="footnote">纸片数量、枢轴与透视可调 · 本版不使用任何 3D 电影机实体</div>
</main>
<script type="module" src="./paper-stage.js"></script>
</body></html>
