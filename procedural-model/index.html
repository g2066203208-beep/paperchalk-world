<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111419">
  <title>Paperchalk World · Ellen FBX 模型工作室</title>
  <script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <p>PAPERCHALK WORLD · MODEL</p>
        <h1>Ellen FBX 模型工作室 <span>Attack · AssaultAid</span></h1>
      </div>
      <div class="top-actions">
        <a href="../studio/" class="ghost-link">返回工作室</a>
        <label class="button file-button">导入其他 FBX<input id="importFbx" type="file" accept=".fbx,application/octet-stream"></label>
      </div>
    </header>

    <main class="model-workspace">
      <section class="stage-card">
        <div class="stage-toolbar">
          <div class="view-buttons" role="group" aria-label="视角">
            <button class="mini-button active" data-view="threeQuarter">3/4</button>
            <button class="mini-button" data-view="front">正面</button>
            <button class="mini-button" data-view="side">侧面</button>
          </div>
          <div class="display-toggles">
            <label><input id="showMesh" type="checkbox" checked> 模型</label>
            <label><input id="showSkeleton" type="checkbox"> 骨骼</label>
            <label><input id="showGrid" type="checkbox" checked> 网格</label>
          </div>
        </div>
        <div id="viewport" class="viewport" tabindex="0" aria-label="Ellen FBX 3D 视口">
          <div id="loadingOverlay" class="loading-overlay">
            <strong id="loadingTitle">加载 Ellen 模型</strong>
            <span id="loadingDetail">正在准备 FBX 资源…</span>
          </div>
          <div class="viewport-label">拖动旋转 · 滚轮缩放 · 右键/Shift+拖动平移</div>
        </div>
        <footer class="stage-status">
          <span id="modelStats">FBX</span>
          <span id="statusText">准备中</span>
        </footer>
      </section>

      <aside class="panel model-panel">
        <section>
          <div class="section-title"><div><p>MODEL</p><h2>模型信息</h2></div><span id="fbxBadge">Ellen</span></div>
          <div id="fbxInfo" class="fbx-info">Avatar_Female_Size02_Ellen_Ani_Attack_AssaultAid.fbx</div>
        </section>

        <section>
          <div class="section-title"><div><p>ANIMATION</p><h2>动画</h2></div><span>FBX Clip</span></div>
          <label class="select-row">
            <span>动画片段</span>
            <select id="animationSelect" disabled><option value="">等待模型</option></select>
          </label>
          <div class="row-buttons">
            <button id="playAnimation" class="button" disabled>播放</button>
            <button id="stopAnimation" class="button" disabled>停止</button>
          </div>
          <div class="axis-control compact-control">
            <label for="animationSpeed"><span>播放速度</span><output id="animationSpeedValue">1.00×</output></label>
            <input id="animationSpeed" type="range" min="0.1" max="2" step="0.05" value="1">
          </div>
        </section>

        <section>
          <div class="section-title"><div><p>RIG</p><h2>骨骼</h2></div><span id="boneCount">0</span></div>
          <div id="boneList" class="bone-list">模型载入后显示骨骼层级。</div>
        </section>
      </aside>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
