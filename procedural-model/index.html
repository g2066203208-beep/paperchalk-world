<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a1f">
  <title>Paperchalk World · 程序化模型工作室</title>
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <p>PAPERCHALK WORLD · TOOL</p>
        <h1>程序化模型工作室 <span>v0.1</span></h1>
      </div>
      <div class="top-actions">
        <a href="../studio/" class="ghost-link">返回重构工作室</a>
        <button id="resetAll" class="button">恢复默认</button>
        <button id="exportJson" class="button button-primary">导出 JSON</button>
        <label class="button file-button">载入 JSON<input id="importJson" type="file" accept="application/json"></label>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel left-panel">
        <section>
          <div class="section-title"><div><p>PROPORTIONS</p><h2>身体比例</h2></div><span>实时重建</span></div>
          <div id="proportionControls" class="control-list"></div>
        </section>
      </aside>

      <section class="stage-card">
        <div class="stage-toolbar">
          <div class="view-buttons" role="group" aria-label="视角">
            <button class="mini-button active" data-view="threeQuarter">3/4</button>
            <button class="mini-button" data-view="front">正面</button>
            <button class="mini-button" data-view="side">侧面</button>
          </div>
          <div class="display-toggles">
            <label><input id="showMesh" type="checkbox" checked> 实体</label>
            <label><input id="showSkeleton" type="checkbox" checked> 骨骼</label>
            <label><input id="showGrid" type="checkbox" checked> 网格</label>
          </div>
        </div>
        <div id="viewport" class="viewport" tabindex="0" aria-label="程序化 3D 人物视口">
          <div class="viewport-label">拖动旋转 · 滚轮缩放 · 右键/Shift+拖动平移</div>
        </div>
        <footer class="stage-status">
          <span><b id="segmentCount">15</b> 个身体段</span>
          <span>关节层级：<b>Root → Torso → Limbs</b></span>
          <span id="statusText">模型已生成</span>
        </footer>
      </section>

      <aside class="panel right-panel">
        <section>
          <div class="section-title"><div><p>POSE</p><h2>关节姿势</h2></div><span>父子联动</span></div>
          <label class="select-row">
            <span>编辑关节</span>
            <select id="jointSelect"></select>
          </label>
          <div class="axis-control">
            <label for="rotX"><span>X 旋转</span><output id="rotXValue">0°</output></label>
            <input id="rotX" type="range" min="-180" max="180" step="1" value="0">
          </div>
          <div class="axis-control">
            <label for="rotY"><span>Y 旋转</span><output id="rotYValue">0°</output></label>
            <input id="rotY" type="range" min="-180" max="180" step="1" value="0">
          </div>
          <div class="axis-control">
            <label for="rotZ"><span>Z 旋转</span><output id="rotZValue">0°</output></label>
            <input id="rotZ" type="range" min="-180" max="180" step="1" value="0">
          </div>
          <div class="row-buttons">
            <button id="zeroJoint" class="button">当前归零</button>
            <button id="resetPose" class="button">全部归零</button>
          </div>
        </section>

        <section class="hierarchy-section">
          <div class="section-title"><div><p>RIG</p><h2>骨骼结构</h2></div><span id="selectedJointLabel">骨盆根节点</span></div>
          <div id="hierarchy" class="hierarchy"></div>
        </section>
      </aside>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
