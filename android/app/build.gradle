plugins { id "com.android.application" }
android {
    namespace "com.paperchalk.lampkeep"
    compileSdk 35
    defaultConfig {
        applicationId "com.paperchalk.lampkeep"
        minSdk 26
        targetSdk 35
        versionCode (System.getenv("GITHUB_RUN_NUMBER") != null ? 1000 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) : 1)
        versionName "0.3." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        release {
            def ks = System.getenv("LAMPKEEP_KEYSTORE_PATH")
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv("LAMPKEEP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LAMPKEEP_KEY_ALIAS")
                keyPassword System.getenv("LAMPKEEP_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (System.getenv("LAMPKEEP_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
