plugins { id "com.android.application" }
android {
    namespace "com.paperchalk.lampkeep"
    compileSdk 35
    defaultConfig {
        applicationId "com.paperchalk.lampkeep"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    signingConfigs {
        release {
            def ks = System.getenv("LAMPKEEP_KEYSTORE_PATH")
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv("LAMPKEEP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LAMPKEEP_KEY_ALIAS")
                keyPassword System.getenv("LAMPKEEP_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (System.getenv("LAMPKEEP_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    // Debug-only HTML5 preview. The production Pages loader is unchanged.
    sourceSets {
        main.assets.srcDirs += ["$buildDir/generated/previewAssets"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("prepareGamePreviewAssets", Copy) {
    from(rootProject.file("..")) {
        include "index.html", "style.css", "sw.js", "src/**", "assets/anime/**", "assets/*.svg"
    }
    into("$buildDir/generated/previewAssets/web")
}
tasks.named("preBuild").configure { dependsOn("prepareGamePreviewAssets") }
