<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Paperchalk World · 修女 Spine 动画 Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p>PAPERCHALK WORLD · ANIMATION LAB</p>
      <h1>修女角色 · Spine 骨骼动画 Demo <span>4.3 Runtime</span></h1>
    </div>
    <a href="../studio/" class="link-button">返回工作室</a>
  </header>

  <main class="workspace">
    <section class="stage">
      <div class="toolbar">
        <div class="segmented" id="animationButtons">
          <button class="active" data-animation="idle">待机</button>
          <button data-animation="walk">走路</button>
          <button data-animation="blessing">祝祷</button>
        </div>
        <div class="toggles">
          <label><input id="showBones" type="checkbox"> 骨骼</label>
          <label><input id="explodeParts" type="checkbox"> 拆件视图</label>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="stageCanvas"></canvas>
        <div class="stage-note">真实 Spine 4.3 骨骼负责层级与动画；角色零件由独立矢量层挂到骨骼上。</div>
      </div>
      <footer>
        <span id="runtimeStatus">正在载入 Spine 4.3…</span>
        <span id="boneStatus">27 Bones</span>
        <span id="partStatus">23 Parts</span>
      </footer>
    </section>

    <aside class="panel">
      <section>
        <div class="section-head"><div><p>PLAYBACK</p><h2>动画控制</h2></div><span id="animationName">idle</span></div>
        <button id="pauseButton" class="wide-button">暂停</button>
        <label class="range-row">
          <span>播放速度 <output id="speedValue">1.00×</output></span>
          <input id="speed" type="range" min="0.15" max="2" step="0.05" value="1">
        </label>
      </section>

      <section>
        <div class="section-head"><div><p>PARTS</p><h2>拆分零件</h2></div><span>点击高亮</span></div>
        <div id="partList" class="part-list"></div>
      </section>

      <section>
        <div class="section-head"><div><p>RIG</p><h2>骨骼结构</h2></div><span>父子联动</span></div>
        <div id="boneList" class="bone-list"></div>
      </section>
    </aside>
  </main>

  <script src="../studio/assets/player/spine/spine43.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
