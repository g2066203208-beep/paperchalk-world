name: Paper Ocean - actual game 2D stage proof
on:
  push:
    paths:
      - 'site/game/paper-ocean-stage.js'
      - 'site/game/paper-ocean-stage.css'
      - 'site/assets/paper-ocean/**'
      - 'site/index.html'
      - 'site/scene-modules.js'
      - 'tests/paper-ocean-stage-preview.mjs'
      - '.github/workflows/paper-ocean-stage.yml'
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 scripts/build_scene_catalog.py
          python3 -m http.server 8765 --directory site >/tmp/paper-ocean.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/paper-ocean.log
          exit 1
      - run: node tests/paper-ocean-stage-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ocean-real-game-screenshot
          path: artifacts/paper-ocean/*.png
          if-no-files-found: warn
          retention-days: 14