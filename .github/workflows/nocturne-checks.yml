name: Nocturne Prototype Checks
on:
  push:
    paths:
      - 'studios/nocturne/**'
      - '.github/workflows/nocturne-checks.yml'
  pull_request:
    paths:
      - 'studios/nocturne/**'
      - '.github/workflows/nocturne-checks.yml'
permissions:
  contents: read
jobs:
  state-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript module syntax
        run: |
          node --check studios/nocturne/engine.mjs
          node --check studios/nocturne/game.js
      - name: Verify game state and narrative branches
        run: node --test studios/nocturne/tests/engine.test.mjs
      - name: Check isolated deployment paths
        run: |
          test -f studios/nocturne/index.html
          test -f studios/nocturne/game.css
          test -f studios/nocturne/MASTER_PROMPT.md
          grep -q './game.js' studios/nocturne/index.html
          grep -q './game.css' studios/nocturne/index.html
