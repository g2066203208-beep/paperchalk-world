name: Android Published Channel Smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Published mobile channel commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  real-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "8.10.2"
      - name: Build app and instrumentation
        working-directory: android-app
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run actual Android WebView smoke
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            [[ "$EXPECTED_VERSION" =~ ^[0-9a-f]{7,40}$ ]]
            mkdir -p artifacts/android
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -e expectedVersion "$EXPECTED_VERSION" com.paperchalk.world.test.test/com.paperchalk.world.SmokeInstrumentation | tee artifacts/android/instrumentation.txt
            grep -q 'status=PASS' artifacts/android/instrumentation.txt
            adb shell am start -n com.paperchalk.world.test/com.paperchalk.world.MainActivity
            sleep 8
            adb exec-out screencap -p > artifacts/android/android-launch.png
            adb logcat -d > artifacts/android/logcat.txt
      - name: Upload Android validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-webview-smoke
          path: artifacts/android
          if-no-files-found: ignore
