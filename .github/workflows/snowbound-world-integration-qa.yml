name: Snowbound Grounded World Stage - Real Screenshot and Video QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/ui/snowbound-forest-reference.css'
      - 'site/card-battle/ui/snowbound-portrait-cutouts.js'
      - 'site/card-battle/ui/snowbound-journey-ui.js'
      - 'site/card-battle/assets/snowy-forest-reference.webp'
      - 'site/card-battle/assets/forest-foreground-reeds-from-user.webp'
      - 'tests/snowbound-world-integration-browser.mjs'
      - '.github/workflows/snowbound-world-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original scene compositor and QA syntax
        run: |
          node --check site/card-battle/ui/snowbound-portrait-cutouts.js
          node --check tests/snowbound-world-integration-browser.mjs
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host GitHub game files
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/snow-world.log 2>&1 &
          sleep 2
      - name: Capture original forest plus Anima portraits on snow with actual Chromium alpha-foot geometry
        run: node tests/snowbound-world-integration-browser.mjs
      - name: Upload desktop, portrait and landscape original game screenshots and WebM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowbound-grounded-world-real-chromium-evidence
          path: artifacts/snowbound-world-integration/
          if-no-files-found: warn
          retention-days: 14
