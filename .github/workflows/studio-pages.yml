name: Classroom - independent continuous fog stage
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/fetch-game-fonts.sh'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minimal-stage-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local licensed game fonts (pinned and hash-verified)
        run: bash scripts/fetch-game-fonts.sh
      - name: Assert original complete classroom and independent fluid layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          image=Path('site/assets/classroom.webp').read_bytes()
          assert image[:4]==b'RIFF' and image[8:12]==b'WEBP'
          h=Path('site/index.html').read_text()
          for key in ('id="scene"','id="fog"','object-fit:contain',
                      '#scene::after','linear-gradient(to right','linear-gradient(to bottom',
                      'pointer-events:none','uniform sampler2D u_previous',
                      'Semi-Lagrangian transport','framebufferTexture2D',
                      'requestAnimationFrame(tick)','fog.dataset.frames',
                      'getBoundingClientRect','stage.style.transform=',
                      'sceneHalf.x','fluidTime+=','drawCPU(dt,fluidTime)', 'DeviceOrientationEvent.requestPermission',
                      "screen.orientation.lock('landscape')",
                      'window.__PAPERWORLD_NATIVE_ORIENTATION__',
                      "view.addEventListener('pointermove'", "window.addEventListener('orientationchange'",
                      "view.addEventListener('pointerdown',enableIOSMotionOnFirstTouch",
                      'body.mobile-mode.virtual-landscape #view',
                      'transform:rotate(90deg)', 'const logical=logicalSize()',
                      'mobile&&!nativeApp&&innerHeight>innerWidth',
                      'id="novel-ui"', 'id="dialogue-text"', 'id="auto-button"', 'id="log-button"'):
              assert key in h,key
          assert 'calibrate-motion' not in h and '重置中心' not in h
          assert 'motion-ui' not in h and 'motion-status' not in h
          assert 'enable-motion' not in h and '原生体感已连接' not in h
          assert '#novel-ui button' in h and 'background:none!important' in h
          assert 'id="cast-layer"' not in h and 'id="entry-panel"' not in h
          assert 'targetZoom' not in h
          assert 't-lastFog' not in h
          files=[p for p in Path('site').rglob('*') if p.is_file()]
          assert sorted(p.name for p in files)==['OFL-LICENSE.txt','PaperSans-Regular.woff2','PaperSerif-Medium.woff2','classroom.webp','enemy-front.webp','index.html','menu-wall.webp','player-back.webp'],files
          for path in ('site/assets/battle/player-back.webp','site/assets/battle/enemy-front.webp'):
              data=Path(path).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP',path
          assert 'id="battle-ui"' in h and 'id="battle-enemy-layer"' in h and 'id="battle-player-layer"' in h
          assert "openScene('battle');" in h and "beginAmbush();" in h
          assert 'NIGHT_RULES=Object.freeze({start:18*60,end:6*60' in h
          assert 'id="scene-transition"' in h and "async function changeScene(name)" in h
          assert "shade.dataset.phase='covered'" in h
          for font in ('--font-menu','--font-name','--font-dialogue','--font-ui'):
              assert font in h
          assert 'id="scene-menu"' in h and 'SCENES=Object.freeze' in h
          assert 'sourceImage.src=def.image' in h and 'stage.dataset.scene=name' in h
          print('PASS: complete image, independent viewport-space fluid fog, per-frame feedback and no zoom')
          PY
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('Main script missing');
          new Function(script);
          console.log('PASS: JS syntax valid');
          JS
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Test opening ambush, layered enemies, battle turns, gyroscope and persistent black fog
        run: |
          mkdir -p artifacts/classroom
          python3 -m http.server 8123 --directory site > /tmp/stage-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try{
              const configs=[
                {width:1280,height:720,mobile:false},
                {width:390,height:844,mobile:true},
                {width:844,height:390,mobile:true},
                {width:1024,height:768,mobile:false},
                {width:2560,height:1080,mobile:false},
                {width:320,height:568,mobile:true}
              ];
              for(const cfg of configs){
                const page=await browser.newPage({
                  viewport:{width:cfg.width,height:cfg.height},
                  isMobile:cfg.mobile,hasTouch:cfg.mobile
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                try{
                  await page.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
                  await page.waitForFunction(()=>document.getElementById('fog').dataset.frames>4);
                  assert.equal(await page.locator('#scene').getAttribute('data-scene'),'battle',
                    'game must START directly in combat, not main menu');
                  assert.equal(await page.locator('#battle-ui').isVisible(),true);
                  assert.equal(await page.locator('#scene-menu').isVisible(),false);
                  assert.equal(await page.locator('#novel-ui').isVisible(),false);
                  assert.equal(await page.locator('#battle-ui').getAttribute('data-time'),'18:04');
                  assert.equal(await page.evaluate(()=>document.body.dataset.otherworld),'true');
                  assert.ok((await page.locator('#battle-message').textContent()).includes('袭击'),
                    'opening scene should be an ambush');
                  assert.equal(await page.locator('#source').evaluate(el=>el.naturalWidth),1024);

                  // Three real separate stage layers, each independently transparent.
                  const art=await page.evaluate(async()=>{
                    const ids=['battle-enemy','battle-player'];
                    const imgs=await Promise.all(ids.map(async id=>{
                      const node=document.getElementById(id);
                      await node.decode();
                      const a=node.getBoundingClientRect();
                      return {id,complete:node.complete,w:node.naturalWidth,h:node.naturalHeight,
                        box:a.toJSON(),visible:getComputedStyle(node.parentElement).display!=='none'};
                    }));
                    return {art:imgs,scene:document.getElementById('scene').getBoundingClientRect().toJSON(),
                      fog:document.getElementById('fog').getBoundingClientRect().toJSON(),
                      virtual:document.body.classList.contains('virtual-landscape'),
                      font:getComputedStyle(document.getElementById('battle-actions')).fontSize};
                  });
                  assert.equal(art.art.length,2);
                  assert.ok(art.art.every(x=>x.complete&&x.w>200&&x.h>400&&x.visible),
                    'missing transparent enemy/player cutouts');
                  assert.ok(art.art.every(x=>x.box.width>30&&x.box.height>120));
                  assert.equal(art.virtual,cfg.mobile&&cfg.height>cfg.width);
                  assert.ok(Math.abs(art.fog.width-cfg.width)<3&&Math.abs(art.fog.height-cfg.height)<3,
                            'fog must cover the physical viewport independently');
                  assert.ok(art.scene.width<cfg.width*.95&&art.scene.height<cfg.height*.94);
                  await page.screenshot({path:'artifacts/classroom/'+cfg.width+'x'+cfg.height+'-battle-opening.png'});

                  // First attack must actually deduct HP, then unlock player actions.
                  await page.waitForFunction(()=>document.getElementById('battle-ui').dataset.phase==='ready',null,{timeout:6000});
                  const initialHP=Number(await page.locator('#battle-ui').getAttribute('data-hp'));
                  assert.ok(initialHP<100&&initialHP>0,'enemy failed to deal first attack damage');
                  const beginFrames=Number(await page.locator('#fog').getAttribute('data-frames'));
                  await page.locator('#fog').evaluate(el=>window.__originalFog=el);
                  await page.locator('#battle-attack').click();
                  await page.waitForFunction(()=>document.getElementById('battle-ui').dataset.phase==='ready',null,{timeout:6500});
                  const hurtEnemy=Number(await page.locator('#battle-ui').getAttribute('data-enemy-hp'));
                  assert.ok(hurtEnemy<100,'player attack failed to damage enemy');
                  assert.equal(await page.locator('#battle-ui').getAttribute('data-time'),'18:24',
                               'battle turn failed to advance the night clock');
                  await page.locator('#battle-guard').click();
                  await page.waitForFunction(()=>document.getElementById('battle-ui').dataset.phase==='ready',null,{timeout:6500});
                  assert.equal(await page.locator('#battle-ui').getAttribute('data-time'),'18:44');
                  await page.locator('#battle-heal').click();
                  await page.waitForFunction(()=>document.getElementById('battle-ui').dataset.phase==='ready',null,{timeout:6500});
                  assert.equal(await page.locator('#battle-ui').getAttribute('data-time'),'19:04');

                  // Stage-linked enemy and player tilt; original smoke stays still.
                  if(!cfg.mobile){
                    const old=await page.locator('#battle-enemy-layer').evaluate(el=>el.style.transform);
                    await page.mouse.move(cfg.width-1,cfg.height-1);
                    await page.waitForTimeout(330);
                    const transforms=await page.evaluate(()=>({
                      scene:document.querySelector('#scene').style.transform,
                      enemy:document.querySelector('#battle-enemy-layer').style.transform,
                      player:document.querySelector('#battle-player-layer').style.transform,
                      fog:document.querySelector('#fog').getBoundingClientRect().toJSON()
                    }));
                    assert.ok(transforms.scene.includes('rotateY('));
                    assert.notEqual(transforms.enemy,old,'enemy lacks independent parallax on tilt');
                    assert.ok(transforms.player.includes('translate3d('));
                    assert.equal(Math.round(transforms.fog.x),0);
                  }else{
                    await page.evaluate(()=>{
                      for(const a of [0,28]){
                        const ev=new Event('deviceorientation');
                        Object.defineProperty(ev,'beta',{value:a});
                        Object.defineProperty(ev,'gamma',{value:a});
                        dispatchEvent(ev);
                      }
                    });
                    await page.waitForTimeout(350);
                    assert.ok((await page.locator('#scene').evaluate(el=>el.style.transform)).includes('rotateY('));
                  }
                  assert.equal(await page.evaluate(()=>document.getElementById('fog')===window.__originalFog),true);
                  assert.ok(Number(await page.locator('#fog').getAttribute('data-frames'))>beginFrames+10,
                            'fluid fog did not continue while battling');

                  // Menu only opens ON DEMAND; 3D and fluid never reinitialize.
                  await page.locator('#battle-shortcuts').click();
                  await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                    &&document.getElementById('scene').dataset.scene==='menu',null,{timeout:6000});
                  assert.equal(await page.evaluate(()=>window.__originalFog===document.getElementById('fog')),true);
                  assert.ok(await page.locator('#menu-continue').isEnabled());
                  await page.locator('#menu-continue').click();
                  await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                    &&document.getElementById('scene').dataset.scene==='battle',null,{timeout:6000});
                  assert.equal(await page.locator('#battle-ui').getAttribute('data-time'),'19:04');
                  assert.deepEqual(errors,[],'browser JavaScript exception');
                  await page.screenshot({path:'artifacts/classroom/'+cfg.width+'x'+cfg.height+'-battle-resumed.png'});
                  console.log('PASS battle '+cfg.width+'x'+cfg.height+
                    ' initial attack, 3 layers, tilted enemy, independent fluid, clock & resume');
                }finally{await page.close()}
              }
              const sample=await browser.newPage({viewport:{width:1280,height:720}});
              await sample.goto('http://127.0.0.1:8123/');
              await sample.waitForFunction(()=>document.getElementById('battle-ui').dataset.phase==='ready');
              // Deterministic in-game dawn rule, evaluated from running game state.
              const rule=await sample.evaluate(()=>{
                const fn=document.querySelector('script:not([id])').textContent;
                return fn.includes('m>=NIGHT_RULES.start||m<NIGHT_RULES.end')&&
                  fn.includes("state.phase='dawn'")&&fn.includes("state.phase!=='dawn'");
              });
              assert.ok(rule,'18:00—06:00 realm entry/exit rule not installed');
              await sample.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-fluid-smoke-review
          path: artifacts/classroom
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
