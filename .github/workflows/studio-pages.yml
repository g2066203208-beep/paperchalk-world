name: Pixel Atelier - creative tools and Night Lamp Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pixel-tools-clean-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert retired games absent and tools plus Night Lamp intact
        run: |
          set -euo pipefail
          test ! -e site/game
          test ! -e site/horror-room
          test -s android/app/src/main/java/com/paperchalk/lampkeep/MainActivity.java
          test -s site/card-game/index.html
          test -s site/card-game/app.mjs
          node --check site/card-game/engine.mjs
          node --check site/card-game/app.mjs
          node --test tests/card-paradox.test.mjs
          test -s site/galgame/index.html
          node galgame/check.cjs
          test -s site/pixel-lab/index.html
          test -s site/world-builder/materials.html
          ! grep -q 'game/menu.js' site/index.html
          node --check site/world-builder/materials.js
          node --check site/world-builder/world-material-gl.js
          node --test tests/pixel-lab-structure.test.mjs tests/world-materials.test.mjs tests/learning-library.test.mjs
      - name: Install Chromium to test real 3-screen card play
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play real card game, shop and persistence on desktop and phones
        run: node tests/card-paradox-browser.mjs
      - name: Keep actual browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperworld-card-paradox-real-game-screenshots
          path: artifacts/card-paradox/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
      - name: Verify public tools and Night Lamp work while old games remain 404
        run: |
          set -euo pipefail
          root="https://g2066203208-beep.github.io/paperchalk-world"
          for i in $(seq 1 15); do
            page="$(curl -fsSL --max-time 16 -H 'Cache-Control: no-cache' "$root/?clear=$GITHUB_SHA-$i" || true)"
            horror="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 16 "$root/horror-room/?check=$GITHUB_SHA-$i" || true)"
            game="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 16 "$root/game/menu.js?check=$GITHUB_SHA-$i" || true)"
            if echo "$page" | grep -q 'PIXEL ATELIER' && [ "$horror" = 404 ] && [ "$game" = 404 ]; then
              curl -fsSL --max-time 16 "$root/pixel-lab/" -o /tmp/pixel-lab-public.html
              grep -q 'PIXEL LAB' /tmp/pixel-lab-public.html
              curl -fsSL --max-time 16 "$root/galgame/" -o /tmp/nightlamp-public.html
              grep -q '夜航灯' /tmp/nightlamp-public.html
              grep -q 'id="scene"' /tmp/nightlamp-public.html
              echo "PASS: public tools and Night Lamp live, retired game URLs 404"
              exit 0
            fi
            sleep 7
          done
          exit 1
