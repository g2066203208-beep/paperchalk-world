name: Minimal classroom stage - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minimal-stage-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert centered scene, procedural fog and zoom controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/assets/classroom.webp")
          data=p.read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          h=Path("site/index.html").read_text(encoding="utf-8")
          for marker in (
              'left:50%;top:50%', 'translate3d(-50%,-50%,0)',
              'float low=fbm', 'float reach=', 'float d=min(min(uv.x',
              'function mist(t)', 'targetZoom=0', 'toggleView()',
              "view.addEventListener('wheel'", "view.addEventListener('dblclick'",
              "view.addEventListener('pointerdown'", 'prefers-reduced-motion'
          ):
              assert marker in h, marker
          files=[f for f in Path("site").rglob("*") if f.is_file()]
          assert len(files)==2,files
          print("PASS: original image; centered scene; fractal fog; full-view toggle; two files")
          PY
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const code=html.match(/<script>\s*([\s\S]*?)<\/script>/)?.[1];
          if(!code)throw Error('Missing inline JS');
          new Function(code);
          console.log('PASS: JS parsed');
          JS
      - name: Install Chromium for desktop and mobile camera checks
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test camera centering, full view, zoom and mobile double-tap
        run: |
          mkdir -p artifacts/classroom
          python3 -m http.server 8123 --directory site > /tmp/stage-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try{
              const desk=await browser.newPage({viewport:{width:1280,height:720}});
              await desk.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
              await desk.waitForTimeout(1100);
              const natural=await desk.locator('#source').evaluate(im=>im.naturalWidth);
              assert.equal(natural,1024);
              const initial=await desk.locator('#scene').boundingBox();
              assert.ok(Math.abs(initial.x+initial.width/2-640)<3,'scene off horizontal center');
              assert.ok(Math.abs(initial.y+initial.height/2-360)<3,'scene off vertical center');
              assert.ok(initial.width>1280,'default is not close-up');
              await desk.screenshot({path:'artifacts/classroom/near.png'});
              await desk.dblclick('main',{position:{x:640,y:360}});
              await desk.waitForTimeout(1250);
              const fit=await desk.locator('#scene').boundingBox();
              console.log('Desktop fit bounds:',JSON.stringify(fit));
              assert.ok(fit.width<1200,'full image does not fit horizontally');
              assert.ok(fit.height<670,'full image does not fit vertically');
              assert.ok(Math.abs(fit.x+fit.width/2-640)<3,'fit scene not centered');
              await desk.screenshot({path:'artifacts/classroom/full.png'});
              await desk.mouse.wheel(0,-1400);
              await desk.waitForTimeout(1150);
              const zoomed=await desk.locator('#scene').boundingBox();
              assert.ok(zoomed.width>fit.width+250,'wheel zoom did not enlarge image');
              await desk.mouse.move(1230,360);
              await desk.waitForTimeout(600);
              const transform=await desk.locator('#scene').evaluate(el=>el.style.transform);
              assert.ok(transform.includes('rotateY('),'head-turn rotation missing');
              await desk.screenshot({path:'artifacts/classroom/turned.png'});
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await mobile.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
              await mobile.waitForTimeout(600);
              await mobile.evaluate(()=>{
                window.__touchLog=[];
                ['pointerdown','pointerup','dblclick'].forEach(type=>document.getElementById('view').addEventListener(type,e=>window.__touchLog.push({type,pointer:e.pointerType||'',t:Math.round(performance.now())}),true));
              });
              await mobile.tap('main',{position:{x:195,y:400}});
              await mobile.waitForTimeout(80);
              await mobile.tap('main',{position:{x:195,y:400}});
              await mobile.waitForTimeout(1250);
              const m=await mobile.locator('#scene').boundingBox();
              console.log('Mobile fit bounds:',JSON.stringify(m),'touch events:',JSON.stringify(await mobile.evaluate(()=>window.__touchLog)));
              assert.ok(m.width<390,'mobile double tap did not fit entire image');
              assert.ok(Math.abs(m.x+m.width/2-195)<4,'mobile scene not centered');
              await mobile.screenshot({path:'artifacts/classroom/mobile-full.png'});
              await mobile.close();await desk.close();
              console.log('PASS: desktop centered, full-scene return, wheel zoom, look-around and mobile full-scene toggle');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Preserve real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-stage-browser-review
          path: artifacts/classroom/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
