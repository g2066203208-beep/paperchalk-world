name: Minimal classroom stage - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minimal-stage-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Test original background and look-around stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/assets/classroom.webp")
          b=p.read_bytes()
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          h=Path("site/index.html").read_text(encoding="utf-8")
          assert './assets/classroom.webp' in h
          assert 'float d=min(min(uv.x' in h
          assert 'requestAnimationFrame(render)' in h
          assert "rotateY(" in h
          assert 'window.innerWidth' in h and 'window.innerHeight' in h
          assert "pointermove" in h
          assert 'prefers-reduced-motion' in h
          files=[p for p in Path('site').rglob('*') if p.is_file()]
          assert len(files)==2,files
          print("PASS: original 16:9 classroom, GPU rectangular fog, pan, tilt, mobile drag, exactly two published files")
          PY
      - name: Syntax-check embedded JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const code=html.match(/<script>\s*([\s\S]*?)<\/script>/)?.[1];
          if(!code)throw new Error('Missing main script');
          new Function(code);
          console.log('PASS: embedded game JavaScript parses');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
