name: Classroom and fog regression QA
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/ui-edge-fog-browser.mjs'
      - 'scripts/fetch-game-fonts.sh'
      - 'scripts/build_scene_catalog.py'
      - 'scripts/build_character_catalog.py'
      - 'scripts/build_v4_assets.py'
      - 'scripts/matte_character.py'
      - 'scripts/validate_character_alpha.py'
      - 'scripts/validate_character_identity.py'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
# New changes should queue, not interrupt an active browser QA / Pages publish.
concurrency:
  group: paperchalk-world-scene-qa
  cancel-in-progress: false
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local licensed game fonts (pinned and hash-verified)
        run: bash scripts/fetch-game-fonts.sh
      - name: Validate approved transparent character art (no destructive re-encoding)
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/validate_character_alpha.py
          python3 -m py_compile scripts/matte_character.py
          python3 scripts/repair_character_masks.py
      - name: Validate single canonical protagonist and approved front/back assets
        run: python3 scripts/validate_character_identity.py
      - name: Build CHAR-002 front source region rig
        run: |
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/build_char002_psd_rig.py
      - name: Generate character catalog for DEV editing (auto publish)
        run: python3 scripts/build_character_catalog.py
      - name: Generate scene catalog from room images (auto publish)
        run: |
          python3 scripts/build_scene_catalog.py
          node tests/scene-modules.test.cjs
          node tests/ground-perspective.test.mjs
      - name: Prove adding PNG or WebP auto-registers new scene IDs
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess, sys, tempfile, struct, zlib
          with tempfile.TemporaryDirectory() as folder:
              root=pathlib.Path(folder)
              script=root/'scripts'/'build_scene_catalog.py'
              script.parent.mkdir(parents=True)
              shutil.copyfile('scripts/build_scene_catalog.py',script)
              scenes=root/'site'/'assets'/'scenes'
              scenes.mkdir(parents=True)
              shutil.copyfile('site/assets/scenes/bedroom.webp',scenes/'reading-nook.webp')
              def png_chunk(kind,data):
                  return struct.pack('!I',len(data))+kind+data+struct.pack('!I',zlib.crc32(kind+data)&0xffffffff)
              png=b'\x89PNG\r\n\x1a\n'
              png+=png_chunk(b'IHDR',struct.pack('!2I5B',128,128,8,2,0,0,0))
              png+=png_chunk(b'IDAT',zlib.compress((b'\x00'+b'\x22\x44\x66'*128)*128))
              png+=png_chunk(b'IEND',b'')
              (scenes/'kitchen.png').write_bytes(png)
              subprocess.run([sys.executable,str(script)],check=True)
              generated=(root/'site'/'scene-catalog.generated.js').read_text()
              catalog=json.loads((root/'site'/'scene-catalog.generated.json').read_text())
              assert catalog['schema']==2
              assert len(catalog['scenes'])==2
              assert {e['id'] for e in catalog['scenes']}=={'reading-nook','kitchen'}
              for entry in catalog['scenes']:
                  assert entry['width']>=128 and entry['height']>=128
                  assert len(entry['version'])==12 and entry['type']=='environment'
              # Bad images and duplicate scene extensions must reject the
              # whole build instead of publishing silent broken thumbnails.
              (scenes/'invalid.webp').write_bytes(b'RIFF' + b'0'*100)
              bad=subprocess.run([sys.executable,str(script)],capture_output=True,text=True)
              assert bad.returncode!=0,'corrupt scene was accepted'
              (scenes/'invalid.webp').unlink()
              shutil.copyfile(scenes/'reading-nook.webp',scenes/'reading-nook.png')
              duplicate=subprocess.run([sys.executable,str(script)],capture_output=True,text=True)
              assert duplicate.returncode!=0,'duplicate scene ID was accepted'
              (scenes/'reading-nook.png').unlink()
              assert '"id":"reading-nook"' in generated
              assert '"file":"reading-nook.webp"' in generated
              assert '"title":"Reading Nook"' in generated
              assert '"id":"kitchen"' in generated and '"file":"kitchen.png"' in generated
              print('PASS: new PNG and WebP each auto-register from a single file')
          PY
      - name: Assert original complete classroom and independent fluid layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          image=Path('site/assets/classroom.webp').read_bytes()
          assert image[:4]==b'RIFF' and image[8:12]==b'WEBP'
          h=Path('site/index.html').read_text()
          for key in ('id="scene"','id="fog"','object-fit:contain',
                      '#scene::after','border-radius:16px','box-shadow:inset 0 0',
                      'pointer-events:none','uniform sampler2D u_previous',
                      'Semi-Lagrangian transport','framebufferTexture2D',
                      'requestAnimationFrame(tick)','fog.dataset.frames',
                      'getBoundingClientRect','stage.style.transform=',
                      'sceneHalf.x','fluidTime+=','drawCPU(dt,fluidTime)', 'DeviceOrientationEvent.requestPermission',
                      "screen.orientation.lock('landscape')",
                      'window.__PAPERWORLD_NATIVE_ORIENTATION__',
                      "view.addEventListener('pointermove'", "window.addEventListener('orientationchange'",
                      "view.addEventListener('pointerdown',enableIOSMotionOnFirstTouch",
                      'body.mobile-mode.virtual-landscape #view',
                      'transform:rotate(90deg)', 'const logical=logicalSize()',
                      'mobile&&!nativeApp&&innerHeight>innerWidth',
                      'id="novel-ui"', 'id="dialogue-text"', 'id="auto-button"', 'id="log-button"'):
              assert key in h,key
          assert 'calibrate-motion' not in h and '重置中心' not in h
          assert 'motion-ui' not in h and 'motion-status' not in h
          assert 'enable-motion' not in h and '原生体感已连接' not in h
          assert '#novel-ui button' in h and 'background:none!important' in h
          assert 'id="cast-layer"' not in h and 'id="entry-panel"' not in h
          assert 'targetZoom' not in h
          assert 't-lastFog' not in h
          files=[p for p in Path('site').rglob('*') if p.is_file()]
          required={'OFL-LICENSE.txt','PaperSans-Regular.woff2','PaperSerif-Medium.woff2','classroom.webp','protagonist-front.webp','protagonist-back.webp','index.html','menu-wall.webp','scene-catalog.generated.js'}
          assert required.issubset({p.name for p in files}),files
          rooms=list(Path('site/assets/scenes').glob('*.webp'))
          assert rooms and {p.name for p in rooms}>= {'living-room.webp','bedroom.webp','entrance.webp'},rooms
          from PIL import Image
          entrance=Image.open('site/assets/scenes/entrance.webp')
          assert entrance.format=='WEBP' and entrance.size==(1024,576)
          catalog=Path('site/scene-catalog.generated.js').read_text()
          assert '"id":"living-room"' in catalog and '"title":"客厅"' in catalog
          assert '"id":"bedroom"' in catalog and '"title":"卧室"' in catalog
          assert '"id":"entrance"' in catalog and '"title":"玄关"' in catalog
          assert 'PAPERWORLD_SCENE_CATALOG' in catalog
          from json import loads
          manifest=loads(Path('site/scene-catalog.generated.json').read_text())
          assert {e['id'] for e in manifest['scenes']} >= {'bedroom','living-room','entrance'}
          assert 'id="actor-enemy"' in h and 'id="actor-player"' in h
          assert '#enemy-depth-root #actor-enemy[hidden]{display:none!important}' in h
          assert 'id="battle-ui"' not in h and 'NIGHT_RULES' not in h
          assert 'id="camera-player-root"' in h and 'id="enemy-depth-root"' in h
          assert 'enemyDepth.style.transform=' in h
          assert 'sceneCamera.planeMatrix(world.depths.background,camera)' in h
          assert 'sceneCamera.billboard(world.depths.enemy,camera)' in h
          assert 'sceneCamera.pose(currentX,currentY,sizes.h)' in h
          assert Path('site/game/scene-camera.js').is_file()
          assert 'const world=sceneCamera.inspect(editorConfig,camera)' in h
          assert 'id="dev-tools"' in h and 'id="dev-layer"' in h
          assert 'id="dev-trigger"' not in h
          assert 'id="menu-gallery-button"' in h
          assert 'id="scene-switcher-toggle"' in h
          assert 'scene-catalog.generated.js' in h
          assert '<script src="./scene-modules.js"></script>' in h
          assert not any(x in h for x in ("title:'主角立绘'", "type:'portrait'"))
          assert '(?:webp|png|jpe?g)' in Path('site/scene-modules.js').read_text()
          # Black blotches were intentionally DELETED, not merely turned off.
          forbidden=('u_blotches','u_burns','burnUniform','blotchesEnabled',
                     'inkCPUAmount','inkStains','ink-toggle','advanceBurns',
                     'paperchalk-ink-blotches')
          for marker in forbidden:
              assert marker not in h,'old black-blotch logic survived: '+marker
          assert 'const hasPlayer=def.layers.player' in h
          assert 'enemyDepth.hidden=!def.layers.enemy' in h
          assert 'window.PAPERWORLD_SCENE_MODULES.buildRegistry' in h
          assert Path('site/scene-modules.js').is_file()
          assert Path('site/scene-catalog.generated.json').is_file()
          assert "view.classList.toggle('environment-scene'" in h
          assert '#view.environment-scene #camera-player-root #actor-player' not in h, 'Rooms must not override the user-saved character placement'
          assert "applyEditorVisuals();" in h and "const hasPlayer=def.layers.player" in h
          assert '--font-dialogue:var(--font-menu)' in h and '--font-ui:var(--font-menu)' in h
          assert 'id="protagonist-preview-root"' not in h
          assert 'id="protagonist-front"' not in h
          assert "type:'portrait'" not in h
          assert "title:'主角立绘'" not in h
          assert 'assets/battle/player-back.webp' not in h
          assert 'assets/battle/enemy-front.webp' not in h
          assert 'protagonist-back.webp' in h
          assert not Path('site/assets/battle/player-back.webp').exists()
          assert not Path('site/assets/battle/enemy-front.webp').exists()
          assert Path('site/assets/characters/protagonist-front.webp').read_bytes()[:4]==b'RIFF'
          assert Path('scripts/matte_character.py').is_file()
          assert Path('scripts/validate_character_alpha.py').is_file()
          from PIL import Image
          cutout=Image.open('site/assets/characters/protagonist-front.webp').convert('RGBA')
          cw,ch=cutout.size
          # At 69% the left leg overlaps the center line in the real artwork.
          # Sample the actual opening below the knees instead of skin pixels.
          assert cutout.getpixel((round(cw*.5),round(ch*.74)))[3]<8,'White background left between legs'
          assert cutout.getpixel((round(cw*.47),round(ch*.39)))[3]>235,'Character accidentally removed'
          assert cw>=300 and ch>=950,'Game sprite has been downscaled unexpectedly'
          assert cutout.getpixel((0,0))[3]==0,'Top corner not transparent'
          assert cutout.getpixel((cw-1,ch-1))[3]==0,'Bottom corner not transparent'
          back=Image.open('site/assets/characters/protagonist-back.webp').convert('RGBA')
          bw,bh=back.size
          assert bw>=250 and bh>=900,(bw,bh)
          assert back.getpixel((0,0))[3]==0 and back.getpixel((bw-1,0))[3]==0
          assert back.getpixel((bw//2,bh//2))[3]>200,'Back-facing protagonist alpha is missing'
          assert back.getpixel((round(bw*.5),round(bh*.74)))[3]<8,'Back leg gap still contains white'
          assert (cw,ch)==(1024,1024) and (bw,bh)==(1024,1024),'Original artwork was resized'
          # Original RGB and alpha are committed as immutable lossless WebP.
          # Exactly TWO layers: scene-attached rounded tiny feather + solid
          # black outside the centered safe region with live smoke at its edge.
          for marker in (
              '--rim-solid:12px', '--rim-feather:7px',
              'border:var(--rim-solid) solid #000',
              'box-shadow:inset 0 0 var(--rim-feather) 0 #000',
              'border-radius:16px', 'uniform vec4 u_fogSettings',
              'float safeDistance=', 'float alpha=safeDistance<=0.?1.:',
              'const safeDistance=', 'const alpha=safeDistance<=0?1:',
              "const FOG_KEY='paperchalk-fog-two-step-v2'",
              'width:3,opacity:82,offset:0,safe:96,solid:12,feather:7',
              'id="menu-dev"', 'id="game-dev"', 'id="dev-fog-tools"',
              'id="fog-safe-guide"', 'id="fog-width"',
              'id="fog-offset"', 'id="fog-safe"', 'id="fog-opacity"',
              'id="fog-solid"', 'id="fog-feather"',
              "function enterDeveloper(layer='fog')", "function useRig(active)",
              "function applyFogSettings()", "function refreshFogEditor()",
              'const m=fogMetrics()', 'safeHalfX=sceneHalf.x*sizes.w*m.safe*.01',
          ):
              assert marker in h,'missing two-step black fog: '+marker
          for obsolete in (
              "const FOG_KEY='paperchalk-fog-edge-v1'",
              'uniform vec2 u_rimSettings', 'float nearEdges=max(',
              'float safetyBlack=', 'const safetyBlack=',
              'width=min(318.', 'width=Math.min(318',
              'float width=min(112.', 'const width=Math.min(112',
              'transparent 9%,transparent 91%', 'id="dev-fog-trigger"',
              "event.key==='F3'", "event.key==='F2'"):
              assert obsolete not in h,'obsolete overlapping fog mask: '+obsolete
          assert 'width:min(94cqw,calc(94cqh * 16 / 9))' in h
          assert 'reach=40.' in h and 'const reach=40+' in h
          assert 'float wave=' in h and 'const wave=' in h
          assert 'aimX=0;aimY=0;currentX=0;currentY=0;' in h
          assert 'window.PAPERWORLD_SCENE_MODULES.buildRegistry' in h
          assert "function enterDeveloper(layer='fog')" in h and 'function exitDeveloper()' in h
          assert 'id="dev-fog-tools"' in h and 'id="dev-z-control"' in h
          assert 'id="dev-layer-actions"' in h and 'id="dev-3d-controls"' in h
          assert 'function showFogEditor(' not in h and 'id="dev-fog-close"' not in h
          assert 'id="dev-ground"' in h and 'rotateX(90deg)' in h
          assert 'ground:{y:77,z:-215,visible:1,horizon:52,lockPerspective:0,autoDepth:1,modelVersion:8}' in h
          assert 'enemy:{x:46,y:12,size:48,z:-40}' in h
          assert 'left:46%;bottom:12%;height:48%' in h
          assert 'cameraPlayer.style.transform=' in h
          assert 'player:{x:27,y:-43.5,size:128,z:300}' in h
          assert 'calc(27cqw - 64cqh)' in h
          assert 'safeDistance<=0.?1.' in h and 'safeDistance<=0?1:' in h
          assert '#fog{z-index:3}' in h and '#scene{z-index:1}' in h
          assert 'id="scene-transition"' in h and "async function changeScene(name)" in h
          assert "shade.dataset.phase='covered'" in h
          for font in ('--font-menu','--font-name','--font-dialogue','--font-ui'):
              assert font in h
          assert 'id="scene-menu"' in h and 'SCENES=Object.freeze' in h
          assert 'sourceImage.src=def.image' in h and 'stage.dataset.scene=name' in h
          print('PASS: complete image, independent viewport-space fluid fog, per-frame feedback and no zoom')
          PY
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('Main script missing');
          new Function(script);
          console.log('PASS: JS syntax valid');
          JS
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify one 3D camera projects background/NPC and preserves L2D + fog
        run: node tests/scene-camera-browser.mjs
      - name: Save 3D camera and scene-distance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-3d-scene-camera
          path: artifacts/scene-camera/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Verify all four independent UI edge fogs in real browser and capture screenshots
        run: node tests/ui-edge-fog-browser.mjs
      - name: Upload early real UI fog screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-fog-immediate-review
          path: artifacts/classroom/ui-fog-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Verify full background, two independent layers, and continuous frames
        run: |
          mkdir -p artifacts/classroom
          python3 -m http.server 8123 --directory site > /tmp/stage-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try {
              for(const cfg of [{width:1280,height:720,mobile:false},{width:390,height:844,mobile:true},{width:844,height:390,mobile:true}]){
                const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.mobile,hasTouch:cfg.mobile});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
                await page.waitForTimeout(900);
                assert.deepEqual(errors,[],'browser JS error');
                const scene=await page.locator('#scene').boundingBox();
                const fog=await page.locator('#fog').boundingBox();
                const actual=await page.locator('#source').evaluate(el=>[el.naturalWidth,el.naturalHeight]);
                assert.deepEqual(actual,[1024,576]);
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'menu','must begin in main menu');
                assert.equal(await page.locator('#novel-ui').isVisible(),false,'story controls shown on menu');
                const menuCoords=await page.locator('#menu-start').boundingBox();
                assert.ok(menuCoords.width>0&&menuCoords.height>0,'scene-attached main menu text missing');
                assert.equal(await page.locator('#menu-continue').isDisabled(),true,
                             'continue should be disabled with no save');
                assert.equal(await page.locator('#actor-player').isVisible(),false,'cast exposed in menu');
                assert.equal(await page.locator('#actor-enemy').isVisible(),false,'cast exposed in menu');
                assert.equal(await page.locator('#camera-player-root').isVisible(),false);
                assert.equal(await page.locator('#enemy-depth-root').isVisible(),false);
                await page.screenshot({path:'artifacts/classroom/'+
                  (cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-MAIN-MENU.png'});
                await page.locator('#menu-settings-button').click();
                assert.ok(await page.locator('#tilt-toggle').isVisible(),'settings text not accessible');
                // Settings opens the ONE developer panel in current-scene fog mode.
                assert.ok(await page.locator('#menu-dev').isVisible());
                await page.locator('#menu-dev').click();
                assert.equal(await page.locator('#dev-tools').isVisible(),true);
                assert.equal(await page.locator('#dev-fog-tools').isVisible(),true);
                assert.equal(await page.locator('#dev-stage').isVisible(),false);
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'menu');
                assert.equal(await page.locator('#dev-layer').inputValue(),'fog');
                await page.locator('#dev-exit').click();
                assert.equal(await page.locator('#dev-tools').isVisible(),false);
                await page.locator('#menu-settings-back').click();
                // One added image becomes a real menu destination automatically.
                await page.locator('#menu-gallery-button').click();
                assert.equal(await page.locator('#scene-menu-gallery [data-scene-target="living-room"]').count(),1);
                assert.equal(await page.locator('#scene-menu-gallery [data-scene-target="bedroom"]').count(),1);
                assert.equal(await page.locator('#scene-menu-gallery [data-scene-target="entrance"]').count(),1);
                // Validate EVERY current or future room without hardcoding
                // new IDs: auto menu registration and genuine image decoding.
                const autoRooms=await page.evaluate(()=>window.PAPERWORLD_SCENE_CATALOG);
                const menuIds=await page.locator('#scene-menu-gallery [data-scene-target]')
                  .evaluateAll(els=>els.map(el=>el.dataset.sceneTarget));
                for(const entry of autoRooms){
                  assert.ok(menuIds.includes(entry.id),
                    'new scene missing from preview UI: '+entry.id);
                }
                const decoded=await page.evaluate(async entries=>Promise.all(
                  entries.map(async entry=>{
                    const i=new Image();
                    i.src='./assets/scenes/'+entry.file;
                    await i.decode();
                    return {id:entry.id,w:i.naturalWidth,h:i.naturalHeight};
                  })
                ),autoRooms);
                for(let i=0;i<decoded.length;i++){
                  assert.deepEqual([decoded[i].w,decoded[i].h],
                    [autoRooms[i].width,autoRooms[i].height],
                    'scene image dimensions mismatch: '+decoded[i].id);
                }
                await page.locator('#scene-menu-gallery [data-scene-target="menu"]').click();
                const originFog=await page.locator('#fog').evaluate(el=>{window.__originalFogNode=el;return Number(el.dataset.frames)});
                await page.locator('#menu-start').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='out',null,{timeout:5500});
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'menu',
                             'background switched before blackout');
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='covered',null,{timeout:5500});
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'classroom','background not switched when black');
                assert.ok(Number(await page.locator('#scene-transition').getAttribute('data-darkness'))>.98,
                          'transition never becomes black');
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle',null,{timeout:5500});
                assert.equal(await page.evaluate(()=>window.__originalFogNode===document.getElementById('fog')),true,
                            'fog instance was recreated during scene switch');
                assert.ok(Number(await page.locator('#fog').getAttribute('data-frames'))>originFog+10,
                          'fluid simulation stopped during dark scene transition');
                assert.equal(await page.locator('#novel-ui').isVisible(),true);
                assert.equal(await page.locator('#scene-menu').isVisible(),false);
                assert.equal(await page.locator('#source').evaluate(el=>el.naturalWidth),1024);
                // The old bitmap is a TRANSPARENT layout anchor for the
                // actual L2D canvas. Playwright's isVisible() does not test
                // opacity:0, so presence alone is not a visual regression.
                const enemyLayer=await page.locator('#actor-enemy').evaluate(el=>{
                  const root=el.closest('[data-l2d-actor]');
                  const canvas=root?.querySelector('[data-l2d-canvas]');
                  return {
                    alpha:Number(getComputedStyle(el).opacity),
                    anchor:el.hasAttribute('data-l2d-image'),
                    animated:!!canvas
                  };
                });
                assert.equal(enemyLayer.alpha,0,'enemy bitmap anchor must not render');
                assert.equal(enemyLayer.anchor,true,'L2D position anchor is missing');
                assert.equal(enemyLayer.animated,true,'enemy must have a real L2D canvas');
                const art=page.locator('#actor-player');
                assert.equal(await art.isVisible(),true,'new protagonist back missing in classroom');
                const dimensions=await art.evaluate(async el=>{
                  await el.decode();
                  return [el.naturalWidth,el.naturalHeight,
                    document.getElementById('scene').dataset.scene];
                });
                assert.ok(dimensions[0]>=250&&dimensions[1]>=900,'new protagonist back not loaded');
                assert.equal(dimensions[2],'classroom');
                // Preserve the user's existing DEV x/y/size in every room.
                // Read COMPUTED pixels, not inline styles, so an !important
                // CSS override cannot evade this regression test.
                const playerPlacement=()=>page.locator('#actor-player').evaluate(el=>{
                  const s=getComputedStyle(el);
                  return {left:s.left,bottom:s.bottom,height:s.height};
                });
                const classroomPlacement=await playerPlacement();
                const fontFamilies=await page.evaluate(()=>({
                  menu:getComputedStyle(document.getElementById('scene-menu')).fontFamily,
                  speaker:getComputedStyle(document.getElementById('speaker')).fontFamily,
                  dialogue:getComputedStyle(document.getElementById('dialogue-text')).fontFamily,
                  button:getComputedStyle(document.getElementById('auto-button')).fontFamily
                }));
                for(const key of ['speaker','dialogue','button'])
                  assert.equal(fontFamilies[key],fontFamilies.menu,'All in-game text must use the menu font');
