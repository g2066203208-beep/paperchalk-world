name: Clear GitHub Pages site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cleared-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify website has no published content
        run: |
          set -euo pipefail
          test -f site/index.html
          test "$(find site -type f | wc -l)" -eq 1
          ! grep -Eiq 'PIXEL ATELIER|失序之夜|<main|<nav|<script' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
