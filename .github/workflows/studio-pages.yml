                  ()=>localStorage.getItem('paperchalk-layer-editor-v2')),null);

                // Reference coordinates (1803x872) map to current LOGICAL
                // game viewport; physical portrait screens rotate the whole UI.
                const layout=await page.evaluate(()=>{
                  const view=document.querySelector('#view');
                  const items=['#menu-toggle','#dialogue','#speaker','#dialogue-text','#next-line'];
                  const elements=Object.fromEntries(items.map(id=>{
                    const el=document.querySelector(id),rect=el.getBoundingClientRect();
                    return [id,{x:rect.left,y:rect.top,right:rect.right,bottom:rect.bottom,w:rect.width,h:rect.height}];
                  }));
                  return {view:view.getBoundingClientRect().toJSON(),
                    ui:getComputedStyle(document.querySelector('#novel-ui')).backgroundColor,
                    elements,
                    font:parseFloat(getComputedStyle(document.querySelector('#dialogue-text')).fontSize)};
                });
                assert.equal(layout.ui,'rgba(0, 0, 0, 0)','UI must not create a new black panel');
                for(const [name,r] of Object.entries(layout.elements)){
                  assert.ok(r.w>0&&r.h>0,'element has no dimensions: '+name);
                  assert.ok(r.x>=-3&&r.y>=-3&&r.right<=cfg.width+3&&r.bottom<=cfg.height+3,
                            'UI overflows viewport: '+name+' '+JSON.stringify(r));
                }
                assert.ok(layout.font>=12&&layout.font<=74,'dialogue text outside accessible scale');
                assert.equal(await page.locator('#speaker').textContent(),'???');
                assert.equal(await page.locator('#dialogue-text').textContent(),'这间教室……和我记忆里的，不太一样。');
                assert.equal(await page.locator('#motion-ui').count(),0,'sensor status must remain absent');
                const fonts=await page.evaluate(async()=>{
                  await document.fonts.load('500 20px PaperSerif','开始游戏');
                  await document.fonts.load('400 20px PaperSans','这间教室');
                  return {
                    menu:getComputedStyle(document.getElementById('menu-start')).fontFamily,
                    name:getComputedStyle(document.getElementById('speaker')).fontFamily,
                    dialogue:getComputedStyle(document.getElementById('dialogue-text')).fontFamily,
                    serif:document.fonts.check('500 20px PaperSerif','开始游戏'),
                    sans:document.fonts.check('400 20px PaperSans','这间教室')
                  };
                });
                assert.ok(fonts.menu.includes('PaperSerif')&&fonts.name.includes('PaperSerif'),
                          'narrative serif not applied to menu/speaker');
                assert.equal(fonts.dialogue,fonts.menu,'dialogue must use the same PaperSerif font as main menu');
                assert.ok(fonts.serif&&fonts.sans,'self-hosted game fonts unavailable');

                assert.equal(await page.locator('#motion-ui').count(),0,
                             'any remaining HUD text or sensor button is forbidden');
                if(cfg.mobile){
                  const mode=await page.evaluate(()=>{
                    const container=document.querySelector('#view');
                    const canvas=document.querySelector('#fog');
                    const scene=document.querySelector('#scene');
                    return {
                      virtual:document.body.classList.contains('virtual-landscape'),
                      view:container.getBoundingClientRect().toJSON(),
                      logicalScene:[scene.offsetWidth,scene.offsetHeight],
                      buffer:[canvas.width,canvas.height],
                      transform:getComputedStyle(container).transform,
                      overlay:document.getElementById('rotate-help')
                    };
                  });
                  assert.equal(mode.virtual,cfg.height>cfg.width,'mobile automatic landscape choice');
                  assert.equal(mode.overlay,null,'portrait blocking overlay still exists');
                  assert.ok(Math.abs(mode.view.x)<2&&Math.abs(mode.view.y)<2,'auto-rotated view offset');
                  assert.ok(Math.abs(mode.view.width-cfg.width)<2&&Math.abs(mode.view.height-cfg.height)<2,
                            'virtual landscape does not fill phone viewport');
                  assert.ok(mode.logicalScene[0]>mode.logicalScene[1],'game scene must remain logically landscape');
                  if(cfg.height>cfg.width){
                    assert.ok(mode.buffer[0]>mode.buffer[1],'portrait phone did not switch GPU to logical landscape dimensions');
                    assert.ok(mode.transform!=='none','portrait phone needs automatic 90 degree game rotation');
                  }
                  console.log('PASS: phone automatically opens full-viewport landscape scene without user input');
                }
                assert.ok(scene.width<=cfg.width*.96,'scene not fully visible horizontally');
                assert.ok(scene.height<=cfg.height*.96,'scene not fully visible vertically');
                assert.ok(scene.width>=cfg.width*.89||cfg.width/cfg.height>2.1,
                  'unused black margins too wide for ordinary 16:9 scene');
                assert.ok(Math.abs(scene.x+scene.width/2-cfg.width/2)<3,'scene horizontally off-center');
                assert.ok(Math.abs(scene.y+scene.height/2-cfg.height/2)<3,'scene vertically off-center');
                assert.ok(Math.abs(fog.width-cfg.width)<2 && Math.abs(fog.height-cfg.height)<2,'fog must be viewport-fixed');
                const before=await page.locator('#fog').getAttribute('data-frames');
                // SwiftShader in CI can throttle 3D+fog compositing heavily.
                // Watch actual simulation-frame progression (rather than
                // assuming a 450ms window guarantees six frames).
                await page.waitForFunction(baseline=>{
                  const value=Number(document.getElementById('fog').dataset.frames);
                  return value-Number(baseline)>=2;
                },before,{timeout:15000,polling:100});
                const after=await page.locator('#fog').getAttribute('data-frames');
                assert.ok(Number(after)-Number(before)>=2,'fluid stopped progressing after DEV');
                const renderer=await page.locator('#fog').getAttribute('data-renderer');
                // Every pointer extreme must keep independent, full-screen fog.
                for(const pt of [
                  [0,0],[cfg.width-1,0],[0,cfg.height-1],
                  [cfg.width-1,cfg.height-1],[cfg.width*.5,cfg.height*.5],
                  [cfg.width-1,cfg.height*.5],[1,cfg.height*.5]
                ]){
                  if(cfg.mobile)break;
                  await page.mouse.move(pt[0],pt[1]);
                  await page.waitForTimeout(90);
                  const check=await page.evaluate(()=>({
                    fog:document.querySelector('#fog').getBoundingClientRect().toJSON(),
                    transform:document.querySelector('#scene').style.transform
                  }));
                  assert.equal(check.fog.x,0,'fog should remain anchored');
                  assert.equal(check.fog.y,0,'fog should remain anchored');
                  assert.ok(Math.abs(check.fog.width-cfg.width)<2,'fog width changed');
                  assert.ok(Math.abs(check.fog.height-cfg.height)<2,'fog height changed');
                  assert.ok(check.transform.includes('rotateY('));
                }
                assert.ok(renderer==='gpu-advected-fluid'||renderer==='cpu-advected-fluid');
                if(!cfg.mobile){
                  const beforeFog=await page.locator('#fog').boundingBox();
                  await page.mouse.move(1200,600);
                  await page.waitForTimeout(380);
                  const transform=await page.locator('#scene').evaluate(e=>e.style.transform);
                  assert.ok(transform.includes('rotateY('));
                  const afterFog=await page.locator('#fog').boundingBox();
                  assert.deepEqual(afterFog,beforeFog,'fog moved with image');
                }

                // Regression: the actual PHOTO layer, without smoke help, must
                // be black at all four projected edges at maximal tilts.
                if(!cfg.mobile){
                  await page.locator('#fog').evaluate(el=>el.style.visibility='hidden');
                  await page.locator('#novel-ui').evaluate(el=>el.style.visibility='hidden');
                  const extremes=[[1,1],[cfg.width-2,1],[1,cfg.height-2],[cfg.width-2,cfg.height-2],[cfg.width/2,cfg.height/2]];
                  for(let k=0;k<extremes.length;k++){
                    const [mx,my]=extremes[k];
                    await page.mouse.move(mx,my);
                    await page.waitForTimeout(320);
                    const snapshot=PNG.sync.read(await page.screenshot({path:'artifacts/classroom/mask-pose-'+k+'.png'}));
                    const geometry=await page.locator('#scene').evaluate(el=>({
                      w:el.offsetWidth,h:el.offsetHeight,css:el.style.transform
                    }));
                    const yaw=Number(geometry.css.match(/rotateY\((-?[\d.]+)deg\)/)?.[1])*Math.PI/180;
                    const pitch=Number(geometry.css.match(/rotateX\((-?[\d.]+)deg\)/)?.[1])*Math.PI/180;
                    assert.ok(Number.isFinite(yaw)&&Number.isFinite(pitch),'rotation not numeric');
                    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([ux,uy])=>{
                      const xx=ux*geometry.w*.5,yy=uy*geometry.h*.5;
                      const y1=yy*Math.cos(pitch),z1=yy*Math.sin(pitch);
                      const x2=xx*Math.cos(yaw)+z1*Math.sin(yaw);
                      const z2=-xx*Math.sin(yaw)+z1*Math.cos(yaw);
                      const m=1500/(1500-z2);
                      return [cfg.width*.5+x2*m,cfg.height*.5+y1*m];
                    });
                    for(let j=0;j<4;j++){
                      const a=corners[j],b=corners[(j+1)%4];
                      const x=(a[0]+b[0])*.5,y=(a[1]+b[1])*.5;
                      const dx=cfg.width*.5-x,dy=cfg.height*.5-y;
                      const len=Math.hypot(dx,dy);
                      const sx=Math.round(x+dx/len*2),sy=Math.round(y+dy/len*2);
                      assert.ok(sx>=0&&sx<snapshot.width&&sy>=0&&sy<snapshot.height,'edge test sample outside screen');
                      const off=(sy*snapshot.width+sx)*4;
                      const rgb=[snapshot.data[off],snapshot.data[off+1],snapshot.data[off+2]];
                      assert.ok(rgb.every(v=>v<=12),'uncovered hard image border, pose '+k+', edge '+j+', RGB '+rgb);
                    }
                  }
                  await page.locator('#fog').evaluate(el=>el.style.visibility='visible');
                  await page.locator('#novel-ui').evaluate(el=>el.style.visibility='visible');
                  console.log('PASS: opaque black on all four scene edges at five maximum/mid tilt poses; smoke hidden for mask-only test');
                }
                if(cfg.mobile){
                  // Feed emulated orientation events in both physical landscape
                  // and auto-rotated portrait; game-space tilt must work in both.
                  // Feed emulated orientation events and verify that the SAME
                  // scene transform used on desktop responds to mobile tilt.
                  await page.evaluate(()=>{
                    for(const gamma of [0,26]){
                      const e=new Event('deviceorientation');
                      Object.defineProperty(e,'beta',{value:gamma});
                      Object.defineProperty(e,'gamma',{value:gamma});
                      dispatchEvent(e);
                    }
                  });
                  await page.waitForTimeout(400);
                  const transform=await page.locator('#scene').evaluate(el=>el.style.transform);
                  const yaw=Number(transform.match(/rotateY\((-?[\d.]+)deg\)/)?.[1]);
                  assert.ok(Math.abs(yaw)>1,'mobile gyro did not rotate the classroom: '+transform);
                  assert.equal(await page.locator('#calibrate-motion').count(),0,'recenter button must be absent');
                  console.log('PASS: mobile emulated gyroscope rotates classroom in '+(cfg.width>cfg.height?'real':'virtual')+' landscape');
                }
                await page.screenshot({path:'artifacts/classroom/'+(cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-ui.png'});
                await page.locator('#next-line').click();
                assert.equal(await page.locator('#dialogue-text').textContent(),'明明已经放学了，为什么还有声音？');
                assert.equal(await page.locator('#auto-button').isVisible(),false,'AUTO must not occupy the game HUD');
                assert.equal(await page.locator('#log-button').isVisible(),false,'LOG must not occupy the game HUD');
                assert.equal(await page.locator('#dialogue').isVisible(),true,'dialogue disappeared unexpectedly');
                await page.locator('#menu-toggle').click();
                assert.equal(await page.locator('#restart-button').isVisible(),true,'menu does not open');
                await page.locator('#restart-button').click();
                assert.equal(await page.locator('#dialogue-text').textContent(),'这间教室……和我记忆里的，不太一样。');
                await page.locator('#menu-toggle').click();
                await page.locator('#return-main').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                  &&document.getElementById('scene').dataset.scene==='menu',null,{timeout:6500});
                assert.equal(await page.locator('#menu-continue').isEnabled(),true);
                await page.locator('#menu-continue').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                  &&document.getElementById('scene').dataset.scene==='classroom',null,{timeout:6500});
                await page.screenshot({path:'artifacts/classroom/'+(cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-ui-tested.png'});
                console.log('PASS:',cfg.mobile?'mobile':'desktop',renderer,'fluid frames',Number(after)-Number(before));
                await page.close();
              }

              // Extra viewport audit beyond the three full smoke regressions:
              // ultrawide, 4:3, small portrait phone and large CSS-pixel 4K.
              for(const vp of [
                {width:2560,height:1080,mobile:false},
                {width:1024,height:768,mobile:false},
                {width:320,height:568,mobile:true},
                {width:720,height:1280,mobile:true},
                {width:3840,height:2160,mobile:false}
              ]){
                const p=await browser.newPage({
                  viewport:{width:vp.width,height:vp.height},
                  isMobile:vp.mobile,hasTouch:vp.mobile
                });
                try{
                  await p.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
                  await p.locator('#menu-start').click();
                  await p.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                    &&document.getElementById('scene').dataset.scene==='classroom',null,{timeout:6500});
                  const metrics=await p.evaluate(()=>{
                    const view=document.getElementById('view');
                    const selectors=['#menu-toggle','#speaker','#dialogue-text','#next-line'];
                    const locations=selectors.map(sel=>{
                      const rect=document.querySelector(sel).getBoundingClientRect();
                      return {sel,x:rect.left,y:rect.top,right:rect.right,bottom:rect.bottom};
                    });
                    return {locations,font:parseFloat(getComputedStyle(document.getElementById('dialogue-text')).fontSize),
                      logicalW:view.clientWidth,logicalH:view.clientHeight,
                      virtual:document.body.classList.contains('virtual-landscape')};
                  });
                  assert.equal(metrics.virtual,vp.mobile&&vp.height>vp.width);
                  for(const rect of metrics.locations){
                    assert.ok(rect.x>=-3&&rect.y>=-3&&rect.right<=vp.width+3&&rect.bottom<=vp.height+3,
                      'responsive overflow '+vp.width+'x'+vp.height+' '+JSON.stringify(rect));
                  }
                  if(vp.width===3840){
                    assert.ok(metrics.font>=60,'4K dialogue text does not scale up');
                  }
                  if(vp.width===320){
                    assert.ok(metrics.font>=12,'small-phone text illegibly small');
                  }
                  console.log('PASS: responsive '+vp.width+'x'+vp.height+
                    ' UI text '+metrics.font+'px');
                } finally{await p.close()}
              }
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-fluid-smoke-review
          path: artifacts/classroom
          retention-days: 7
          if-no-files-found: warn
      - name: Rebuild and verify original V4 clips (QA only; Pages publishes in canonical workflow)
        run: python3 scripts/build_v4_assets.py
