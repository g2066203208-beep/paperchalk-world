name: Classroom - independent continuous fog stage
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/fetch-game-fonts.sh'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minimal-stage-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local licensed game fonts (pinned and hash-verified)
        run: bash scripts/fetch-game-fonts.sh
      - name: Assert original complete classroom and independent fluid layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          image=Path('site/assets/classroom.webp').read_bytes()
          assert image[:4]==b'RIFF' and image[8:12]==b'WEBP'
          h=Path('site/index.html').read_text()
          for key in ('id="scene"','id="fog"','object-fit:contain',
                      '#scene::after','linear-gradient(to right','linear-gradient(to bottom',
                      'pointer-events:none','uniform sampler2D u_previous',
                      'Semi-Lagrangian transport','framebufferTexture2D',
                      'requestAnimationFrame(tick)','fog.dataset.frames',
                      'getBoundingClientRect','stage.style.transform=',
                      'sceneHalf.x','fluidTime+=','drawCPU(dt,fluidTime)', 'DeviceOrientationEvent.requestPermission',
                      "screen.orientation.lock('landscape')",
                      'window.__PAPERWORLD_NATIVE_ORIENTATION__',
                      "view.addEventListener('pointermove'", "window.addEventListener('orientationchange'",
                      "view.addEventListener('pointerdown',enableIOSMotionOnFirstTouch",
                      'body.mobile-mode.virtual-landscape #view',
                      'transform:rotate(90deg)', 'const logical=logicalSize()',
                      'mobile&&!nativeApp&&innerHeight>innerWidth',
                      'id="novel-ui"', 'id="dialogue-text"', 'id="auto-button"', 'id="log-button"'):
              assert key in h,key
          assert 'calibrate-motion' not in h and '重置中心' not in h
          assert 'motion-ui' not in h and 'motion-status' not in h
          assert 'enable-motion' not in h and '原生体感已连接' not in h
          assert '#novel-ui button' in h and 'background:none!important' in h
          assert 'id="cast-layer"' not in h and 'id="entry-panel"' not in h
          assert 'targetZoom' not in h
          assert 't-lastFog' not in h
          files=[p for p in Path('site').rglob('*') if p.is_file()]
          assert sorted(p.name for p in files)==['OFL-LICENSE.txt','PaperSans-Regular.woff2','PaperSerif-Medium.woff2','classroom.webp','enemy-front.webp','index.html','menu-wall.webp','player-back.webp'],files
          assert 'id="actor-enemy"' in h and 'id="actor-player"' in h
          assert 'id="battle-ui"' not in h and 'NIGHT_RULES' not in h
          assert 'id="camera-player-root"' in h and 'id="enemy-depth-root"' in h
          assert 'enemyDepth.style.transform=' in h
          assert 'const parallaxPx=Math.min(6,sizes.w*.005)*depthFactor' in h
          assert 'depthFactor=clamp(' in h
          assert 'id="dev-trigger"' in h and 'id="dev-tools"' in h
          assert 'function enterDeveloper()' in h and 'function exitDeveloper()' in h
          assert 'id="dev-ground"' in h and 'rotateX(90deg)' in h
          assert 'ground:{y:77,z:-215,visible:1}' in h
          assert 'enemy:{x:46,y:16,size:34,z:-190}' in h
          assert 'left:46%;bottom:16%;height:34%' in h
          assert 'cameraPlayer.style.transform=' in h
          assert 'float safetyBlack=' in h and 'const safetyBlack=' in h
          assert '#fog{z-index:3}' in h and '#scene{z-index:1}' in h
          assert 'id="scene-transition"' in h and "async function changeScene(name)" in h
          assert "shade.dataset.phase='covered'" in h
          for font in ('--font-menu','--font-name','--font-dialogue','--font-ui'):
              assert font in h
          assert 'id="scene-menu"' in h and 'SCENES=Object.freeze' in h
          assert 'sourceImage.src=def.image' in h and 'stage.dataset.scene=name' in h
          print('PASS: complete image, independent viewport-space fluid fog, per-frame feedback and no zoom')
          PY
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('Main script missing');
          new Function(script);
          console.log('PASS: JS syntax valid');
          JS
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify full background, two independent layers, and continuous frames
        run: |
          mkdir -p artifacts/classroom
          python3 -m http.server 8123 --directory site > /tmp/stage-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try {
              for(const cfg of [{width:1280,height:720,mobile:false},{width:390,height:844,mobile:true},{width:844,height:390,mobile:true}]){
                const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.mobile,hasTouch:cfg.mobile});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
                await page.waitForTimeout(900);
                assert.deepEqual(errors,[],'browser JS error');
                const scene=await page.locator('#scene').boundingBox();
                const fog=await page.locator('#fog').boundingBox();
                const actual=await page.locator('#source').evaluate(el=>[el.naturalWidth,el.naturalHeight]);
                assert.deepEqual(actual,[1024,576]);
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'menu','must begin in main menu');
                assert.equal(await page.locator('#novel-ui').isVisible(),false,'story controls shown on menu');
                const menuCoords=await page.locator('#menu-start').boundingBox();
                assert.ok(menuCoords.width>0&&menuCoords.height>0,'scene-attached main menu text missing');
                assert.equal(await page.locator('#menu-continue').isDisabled(),true,
                             'continue should be disabled with no save');
                assert.equal(await page.locator('#actor-player').isVisible(),false,'cast exposed in menu');
                assert.equal(await page.locator('#actor-enemy').isVisible(),false,'cast exposed in menu');
                assert.equal(await page.locator('#camera-player-root').isVisible(),false);
                assert.equal(await page.locator('#enemy-depth-root').isVisible(),false);
                await page.screenshot({path:'artifacts/classroom/'+
                  (cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-MAIN-MENU.png'});
                await page.locator('#menu-settings-button').click();
                assert.ok(await page.locator('#tilt-toggle').isVisible(),'settings text not accessible');
                await page.locator('#menu-settings-back').click();
                const originFog=await page.locator('#fog').evaluate(el=>{window.__originalFogNode=el;return Number(el.dataset.frames)});
                await page.locator('#menu-start').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='out',null,{timeout:5500});
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'menu',
                             'background switched before blackout');
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='covered',null,{timeout:5500});
                assert.equal(await page.locator('#scene').getAttribute('data-scene'),'classroom','background not switched when black');
                assert.ok(Number(await page.locator('#scene-transition').getAttribute('data-darkness'))>.98,
                          'transition never becomes black');
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle',null,{timeout:5500});
                assert.equal(await page.evaluate(()=>window.__originalFogNode===document.getElementById('fog')),true,
                            'fog instance was recreated during scene switch');
                assert.ok(Number(await page.locator('#fog').getAttribute('data-frames'))>originFog+10,
                          'fluid simulation stopped during dark scene transition');
                assert.equal(await page.locator('#novel-ui').isVisible(),true);
                assert.equal(await page.locator('#scene-menu').isVisible(),false);
                assert.equal(await page.locator('#source').evaluate(el=>el.naturalWidth),1024);
                const composition=await page.evaluate(()=>{
                  const stage=document.getElementById('enemy-depth-root');
                  const art=document.getElementById('actor-enemy');
                  // Use LOCAL plane coordinates, not projected bounding boxes:
                  // CSS perspective skews box extents during mouse tilt.
                  return {
                    x:parseFloat(art.style.left),
                    bottom:parseFloat(art.style.bottom),
                    h:parseFloat(art.style.height),
                    centerX:(art.offsetLeft+art.offsetWidth/2)/stage.offsetWidth,
                    footY:(art.offsetTop+art.offsetHeight)/stage.offsetHeight,
                    heightRatio:art.offsetHeight/stage.offsetHeight
                  };
                });
                assert.deepEqual([composition.x,composition.bottom,composition.h],[46,16,34],
                  'enemy default composition did not update');
                assert.ok(composition.centerX>.50&&composition.centerX<.55,
                  'enemy not near middle of classroom aisle');
                assert.ok(Math.abs(composition.footY-.84)<.02,
                  'enemy feet not grounded in the lower aisle');
                assert.ok(Math.abs(composition.heightRatio-.34)<.03,
                  'enemy still disproportionately large relative to background');
                for(const id of ['actor-enemy','actor-player']){
                  const art=page.locator('#'+id);
                  assert.equal(await art.isVisible(),true,'character not shown: '+id);
                  const dimensions=await art.evaluate(async el=>{
                    await el.decode();
                    return [el.naturalWidth,el.naturalHeight,document.getElementById('scene').dataset.scene];
                  });
                  assert.ok(dimensions[0]>100&&dimensions[1]>300,'missing standalone art: '+id);
                  assert.equal(dimensions[2],'classroom','character not shown in classroom');
                  assert.equal(await art.evaluate(el=>el.closest('#view')!==null),true);
                  assert.equal(await art.evaluate(el=>el.closest('#scene')===null),true,
                    'actor is still glued into the background layer');
                }
                const layerAudit=await page.evaluate(()=>{
                  const ids=['scene','enemy-depth-root','fog','camera-player-root'];
                  const layers=ids.map(id=>document.getElementById(id));
                  const parents=layers.map(el=>el.parentElement.id);
                  const z=layers.map(el=>Number(getComputedStyle(el).zIndex));
                  return {parents,z,player:document.getElementById('camera-player-root').style.transform,
                    order:layers.map(el=>Array.prototype.indexOf.call(el.parentElement.children,el))};
                });
                assert.deepEqual(layerAudit.parents,['view','view','view','view'],
                  'visual layers must be sibling planes, not all children of the scene');
                assert.deepEqual(layerAudit.z,[1,2,3,4],
                  'wrong 3D depth: bg < enemy < black fog < player');
                assert.ok(layerAudit.order.every((x,i,a)=>i===0||x>a[i-1]),
                  'painter order is reversed');
                if(!cfg.mobile){
                  await page.mouse.move(50,40);
                  await page.waitForTimeout(440);
                  const a=await page.evaluate(()=>({
                    player:document.getElementById('actor-player').getBoundingClientRect().toJSON(),
                    enemy:document.getElementById('actor-enemy').getBoundingClientRect().toJSON(),
                    fog:document.getElementById('fog').getBoundingClientRect().toJSON(),
                    enemyStyle:document.getElementById('enemy-depth-root').style.transform,
                    playerStyle:document.getElementById('camera-player-root').style.transform,
                    stageStyle:document.getElementById('scene').style.transform
                  }));
                  await page.mouse.move(cfg.width-50,cfg.height-50);
                  await page.waitForTimeout(580);
                  const b=await page.evaluate(()=>({
                    player:document.getElementById('actor-player').getBoundingClientRect().toJSON(),
                    enemy:document.getElementById('actor-enemy').getBoundingClientRect().toJSON(),
                    fog:document.getElementById('fog').getBoundingClientRect().toJSON(),
                    enemyStyle:document.getElementById('enemy-depth-root').style.transform,
                    playerStyle:document.getElementById('camera-player-root').style.transform,
                    stageStyle:document.getElementById('scene').style.transform
                  }));
                  assert.notEqual(a.playerStyle,b.playerStyle,
                    'foreground player must now tilt subtly with the camera');
                  assert.ok(Math.abs(a.player.x-b.player.x)<28&&Math.abs(a.player.y-b.player.y)<28,
                    'camera-near player shifted too far rather than only tilting');
                  assert.ok(Math.abs(a.enemy.x-b.enemy.x)>5||Math.abs(a.enemy.y-b.enemy.y)>5,
                    'enemy did not visibly parallax across mouse tilt');
                  assert.notEqual(a.enemyStyle,b.enemyStyle,'enemy plane never tilts');
                  const angles=(style,axis)=>{
                    const part=style.match(new RegExp(axis+'\\((-?[\\d.]+)deg\\)'));
                    assert.ok(part,'missing rotation '+axis+' in '+style);
                    return Number(part[1]);
                  };
                  for(const frame of [a,b]){
                    assert.ok(Math.abs(angles(frame.enemyStyle,'rotateY')-
                                       angles(frame.stageStyle,'rotateY'))<.6,
                      'enemy yaw too far from classroom');
                    assert.ok(Math.abs(angles(frame.enemyStyle,'rotateX')-
                                       angles(frame.stageStyle,'rotateX'))<.5,
                      'enemy pitch too far from classroom');
                  }
                  assert.deepEqual(a.fog,b.fog,'black fog moved with the world');
                }
                // The real GPU/CPU fog has an opaque pure-black perimeter
                // around the maximum tilt envelope. No gray edge can peek out.
                const edgeShot=PNG.sync.read(await page.screenshot());
                for(const [x,y] of [
                  [3,Math.floor(cfg.height/2)],
                  [cfg.width-4,Math.floor(cfg.height/2)],
                  [Math.floor(cfg.width/2),3],
                  [Math.floor(cfg.width/2),cfg.height-4]
                ]){
                  const ix=(y*edgeShot.width+x)*4;
                  assert.ok(edgeShot.data[ix]<4&&edgeShot.data[ix+1]<4&&edgeShot.data[ix+2]<4,
                    'safety rim not solid black at '+x+','+y);
                }
                await page.screenshot({path:'artifacts/classroom/'+
                  (cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-CHARACTERS-DEPTH.png'});

                // The actual live objects are separated into 3D planes:
                // free-camera perspective, direct edits, save, exit + restore.
                const liveFogBefore=await page.locator('#fog').evaluate(el=>{
                  window.__devOriginalFog=el;return Number(el.dataset.frames);
                });
                await page.locator('#dev-trigger').click();
                assert.equal(await page.locator('#dev-tools').isVisible(),true);
                const inspection=await page.evaluate(()=>({
                  mode:document.getElementById('view').classList.contains('dev-mode'),
                  parents:['scene','enemy-depth-root','fog','camera-player-root']
                    .map(id=>document.getElementById(id).parentElement.id),
                  hasFogGuide:!!document.getElementById('dev-fog-guide')
                }));
                assert.equal(inspection.mode,true);
                assert.deepEqual(inspection.parents,['dev-rig','dev-rig','view','dev-rig'],
                  'developer camera must detach three image planes without detaching WebGL canvas');
                assert.ok(inspection.hasFogGuide);
                assert.equal(await page.locator('#dev-ground').isVisible(),true,
                  'horizontal debug floor is missing');
                const groundTransform=await page.locator('#dev-ground').evaluate(el=>
                  getComputedStyle(el).transform);
                assert.ok(groundTransform.startsWith('matrix3d('),
                  'floor is not a real horizontal 3D plane');
                assert.equal(await page.locator('#dev-fog-preview').count(),1,
                  '4th plane must mirror the actual flowing fog');
                await page.locator('#dev-side').click();
                assert.equal(await page.locator('#dev-stage').getAttribute('data-yaw'),'-69');
                await page.locator('#dev-layer').selectOption('ground');
                assert.equal(await page.locator('#dev-floor-controls').isVisible(),true);
                await page.locator('#dev-ground-y').evaluate(el=>{
                  el.value='73.5';el.dispatchEvent(new Event('input',{bubbles:true}));
                });
                const floorTop=await page.locator('#dev-ground').evaluate(el=>
                  parseFloat(getComputedStyle(el).top));
                const floorExpected=await page.locator('#dev-rig').evaluate(el=>el.offsetHeight)*.735;
                assert.ok(Math.abs(floorTop-floorExpected)<1,
                  'horizontal floor height control did not update its 3D anchor');
                await page.locator('#dev-ground-toggle').uncheck();
                assert.equal(await page.locator('#dev-ground').isVisible(),false);
                await page.locator('#dev-ground-toggle').check();
                assert.equal(await page.locator('#dev-ground').isVisible(),true);
                await page.locator('#dev-top').click();
                await page.screenshot({path:'artifacts/classroom/'+
                  (cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-DEV-FLOOR-TOP.png'});
                await page.locator('#dev-side').click();
                await page.waitForFunction(()=>Number(
                  document.getElementById('dev-fog-preview').dataset.mirrorFrames)>0,
                  null,{timeout:4000});
                await page.screenshot({path:'artifacts/classroom/'+
                  (cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-DEV-FREE-CAMERA.png'});
                await page.locator('#dev-layer').selectOption('enemy');
                await page.locator('#dev-x').evaluate(el=>{
                  el.value='55';el.dispatchEvent(new Event('input',{bubbles:true}));
                });
                assert.equal(await page.locator('#actor-enemy').evaluate(el=>el.style.left),'55%');
                await page.locator('#dev-save').click();
                assert.equal(await page.evaluate(
                  ()=>JSON.parse(localStorage.getItem('paperchalk-layer-editor-v2')).enemy.x),55);
                await page.locator('#dev-exit').click();
                assert.equal(await page.locator('#view').evaluate(el=>el.classList.contains('dev-mode')),false);
                assert.deepEqual(await page.evaluate(
                  ()=>['scene','enemy-depth-root','fog','camera-player-root']
                    .map(id=>document.getElementById(id).parentElement.id)),
                  ['view','view','view','view']);
                assert.equal(await page.evaluate(
                  ()=>window.__devOriginalFog===document.getElementById('fog')),true);
                assert.ok(Number(await page.locator('#fog').getAttribute('data-frames'))>liveFogBefore,
                  'fluid simulation stopped while freely viewing the 3D planes');
                assert.equal(await page.locator('#actor-enemy').evaluate(el=>el.style.left),'55%',
                  'editing not applied to original gameplay scene');
                await page.locator('#dev-trigger').click();
                await page.locator('#dev-reset').click();
                await page.locator('#dev-exit').click();
                assert.equal(await page.locator('#actor-enemy').evaluate(el=>el.style.left),'46%',
                  'reset did not restore updated perspective placement');
                assert.equal(await page.evaluate(
                  ()=>localStorage.getItem('paperchalk-layer-editor-v2')),null);

                // Reference coordinates (1803x872) map to current LOGICAL
                // game viewport; physical portrait screens rotate the whole UI.
                const layout=await page.evaluate(()=>{
                  const view=document.querySelector('#view');
                  const items=['#menu-toggle','#auto-button','#log-button','#dialogue','#speaker','#dialogue-text','#next-line'];
                  const elements=Object.fromEntries(items.map(id=>{
                    const el=document.querySelector(id),rect=el.getBoundingClientRect();
                    return [id,{x:rect.left,y:rect.top,right:rect.right,bottom:rect.bottom,w:rect.width,h:rect.height}];
                  }));
                  return {view:view.getBoundingClientRect().toJSON(),
                    ui:getComputedStyle(document.querySelector('#novel-ui')).backgroundColor,
                    elements,
                    font:parseFloat(getComputedStyle(document.querySelector('#dialogue-text')).fontSize)};
                });
                assert.equal(layout.ui,'rgba(0, 0, 0, 0)','UI must not create a new black panel');
                for(const [name,r] of Object.entries(layout.elements)){
                  assert.ok(r.w>0&&r.h>0,'element has no dimensions: '+name);
                  assert.ok(r.x>=-3&&r.y>=-3&&r.right<=cfg.width+3&&r.bottom<=cfg.height+3,
                            'UI overflows viewport: '+name+' '+JSON.stringify(r));
                }
                assert.ok(layout.font>=12&&layout.font<=74,'dialogue text outside accessible scale');
                assert.equal(await page.locator('#speaker').textContent(),'???');
                assert.equal(await page.locator('#dialogue-text').textContent(),'这间教室……和我记忆里的，不太一样。');
                assert.equal(await page.locator('#motion-ui').count(),0,'sensor status must remain absent');
                const fonts=await page.evaluate(async()=>{
                  await document.fonts.load('500 20px PaperSerif','开始游戏');
                  await document.fonts.load('400 20px PaperSans','这间教室');
                  return {
                    menu:getComputedStyle(document.getElementById('menu-start')).fontFamily,
                    name:getComputedStyle(document.getElementById('speaker')).fontFamily,
                    dialogue:getComputedStyle(document.getElementById('dialogue-text')).fontFamily,
                    serif:document.fonts.check('500 20px PaperSerif','开始游戏'),
                    sans:document.fonts.check('400 20px PaperSans','这间教室')
                  };
                });
                assert.ok(fonts.menu.includes('PaperSerif')&&fonts.name.includes('PaperSerif'),
                          'narrative serif not applied to menu/speaker');
                assert.ok(fonts.dialogue.includes('PaperSans'),'readable sans dialogue missing');
                assert.ok(fonts.serif&&fonts.sans,'self-hosted game fonts unavailable');

                assert.equal(await page.locator('#motion-ui').count(),0,
                             'any remaining HUD text or sensor button is forbidden');
                if(cfg.mobile){
                  const mode=await page.evaluate(()=>{
                    const container=document.querySelector('#view');
                    const canvas=document.querySelector('#fog');
                    const scene=document.querySelector('#scene');
                    return {
                      virtual:document.body.classList.contains('virtual-landscape'),
                      view:container.getBoundingClientRect().toJSON(),
                      logicalScene:[scene.offsetWidth,scene.offsetHeight],
                      buffer:[canvas.width,canvas.height],
                      transform:getComputedStyle(container).transform,
                      overlay:document.getElementById('rotate-help')
                    };
                  });
                  assert.equal(mode.virtual,cfg.height>cfg.width,'mobile automatic landscape choice');
                  assert.equal(mode.overlay,null,'portrait blocking overlay still exists');
                  assert.ok(Math.abs(mode.view.x)<2&&Math.abs(mode.view.y)<2,'auto-rotated view offset');
                  assert.ok(Math.abs(mode.view.width-cfg.width)<2&&Math.abs(mode.view.height-cfg.height)<2,
                            'virtual landscape does not fill phone viewport');
                  assert.ok(mode.logicalScene[0]>mode.logicalScene[1],'game scene must remain logically landscape');
                  if(cfg.height>cfg.width){
                    assert.ok(mode.buffer[0]>mode.buffer[1],'portrait phone did not switch GPU to logical landscape dimensions');
                    assert.ok(mode.transform!=='none','portrait phone needs automatic 90 degree game rotation');
                  }
                  console.log('PASS: phone automatically opens full-viewport landscape scene without user input');
                }
                assert.ok(scene.width<=cfg.width*.92,'scene not fully visible horizontally');
                assert.ok(scene.height<=cfg.height*.90,'scene not fully visible vertically');
                assert.ok(Math.abs(scene.x+scene.width/2-cfg.width/2)<3,'scene horizontally off-center');
                assert.ok(Math.abs(scene.y+scene.height/2-cfg.height/2)<3,'scene vertically off-center');
                assert.ok(Math.abs(fog.width-cfg.width)<2 && Math.abs(fog.height-cfg.height)<2,'fog must be viewport-fixed');
                const before=await page.locator('#fog').getAttribute('data-frames');
                // SwiftShader in CI can throttle 3D+fog compositing heavily.
                // Watch actual simulation-frame progression (rather than
                // assuming a 450ms window guarantees six frames).
                await page.waitForFunction(baseline=>{
                  const value=Number(document.getElementById('fog').dataset.frames);
                  return value-Number(baseline)>=6;
                },before,{timeout:6000,polling:100});
                const after=await page.locator('#fog').getAttribute('data-frames');
                assert.ok(Number(after)-Number(before)>=6,'fluid stopped progressing after DEV');
                const renderer=await page.locator('#fog').getAttribute('data-renderer');
                // Every pointer extreme must keep independent, full-screen fog.
                for(const pt of [
                  [0,0],[cfg.width-1,0],[0,cfg.height-1],
                  [cfg.width-1,cfg.height-1],[cfg.width*.5,cfg.height*.5],
                  [cfg.width-1,cfg.height*.5],[1,cfg.height*.5]
                ]){
                  if(cfg.mobile)break;
                  await page.mouse.move(pt[0],pt[1]);
                  await page.waitForTimeout(90);
                  const check=await page.evaluate(()=>({
                    fog:document.querySelector('#fog').getBoundingClientRect().toJSON(),
                    transform:document.querySelector('#scene').style.transform
                  }));
                  assert.equal(check.fog.x,0,'fog should remain anchored');
                  assert.equal(check.fog.y,0,'fog should remain anchored');
                  assert.ok(Math.abs(check.fog.width-cfg.width)<2,'fog width changed');
                  assert.ok(Math.abs(check.fog.height-cfg.height)<2,'fog height changed');
                  assert.ok(check.transform.includes('rotateY('));
                }
                assert.ok(renderer==='gpu-advected-fluid'||renderer==='cpu-advected-fluid');
                if(!cfg.mobile){
                  const beforeFog=await page.locator('#fog').boundingBox();
                  await page.mouse.move(1200,600);
                  await page.waitForTimeout(380);
                  const transform=await page.locator('#scene').evaluate(e=>e.style.transform);
                  assert.ok(transform.includes('rotateY('));
                  const afterFog=await page.locator('#fog').boundingBox();
                  assert.deepEqual(afterFog,beforeFog,'fog moved with image');
                }

                // Regression: the actual PHOTO layer, without smoke help, must
                // be black at all four projected edges at maximal tilts.
                if(!cfg.mobile){
                  await page.locator('#fog').evaluate(el=>el.style.visibility='hidden');
                  await page.locator('#novel-ui').evaluate(el=>el.style.visibility='hidden');
                  const extremes=[[1,1],[cfg.width-2,1],[1,cfg.height-2],[cfg.width-2,cfg.height-2],[cfg.width/2,cfg.height/2]];
                  for(let k=0;k<extremes.length;k++){
                    const [mx,my]=extremes[k];
                    await page.mouse.move(mx,my);
                    await page.waitForTimeout(320);
                    const snapshot=PNG.sync.read(await page.screenshot({path:'artifacts/classroom/mask-pose-'+k+'.png'}));
                    const geometry=await page.locator('#scene').evaluate(el=>({
                      w:el.offsetWidth,h:el.offsetHeight,css:el.style.transform
                    }));
                    const yaw=Number(geometry.css.match(/rotateY\((-?[\d.]+)deg\)/)?.[1])*Math.PI/180;
                    const pitch=Number(geometry.css.match(/rotateX\((-?[\d.]+)deg\)/)?.[1])*Math.PI/180;
                    assert.ok(Number.isFinite(yaw)&&Number.isFinite(pitch),'rotation not numeric');
                    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([ux,uy])=>{
                      const xx=ux*geometry.w*.5,yy=uy*geometry.h*.5;
                      const y1=yy*Math.cos(pitch),z1=yy*Math.sin(pitch);
                      const x2=xx*Math.cos(yaw)+z1*Math.sin(yaw);
                      const z2=-xx*Math.sin(yaw)+z1*Math.cos(yaw);
                      const m=1500/(1500-z2);
                      return [cfg.width*.5+x2*m,cfg.height*.5+y1*m];
                    });
                    for(let j=0;j<4;j++){
                      const a=corners[j],b=corners[(j+1)%4];
                      const x=(a[0]+b[0])*.5,y=(a[1]+b[1])*.5;
                      const dx=cfg.width*.5-x,dy=cfg.height*.5-y;
                      const len=Math.hypot(dx,dy);
                      const sx=Math.round(x+dx/len*7),sy=Math.round(y+dy/len*7);
                      assert.ok(sx>=0&&sx<snapshot.width&&sy>=0&&sy<snapshot.height,'edge test sample outside screen');
                      const off=(sy*snapshot.width+sx)*4;
                      const rgb=[snapshot.data[off],snapshot.data[off+1],snapshot.data[off+2]];
                      assert.ok(rgb.every(v=>v<=12),'uncovered hard image border, pose '+k+', edge '+j+', RGB '+rgb);
                    }
                  }
                  await page.locator('#fog').evaluate(el=>el.style.visibility='visible');
                  await page.locator('#novel-ui').evaluate(el=>el.style.visibility='visible');
                  console.log('PASS: opaque black on all four scene edges at five maximum/mid tilt poses; smoke hidden for mask-only test');
                }
                if(cfg.mobile){
                  // Feed emulated orientation events in both physical landscape
                  // and auto-rotated portrait; game-space tilt must work in both.
                  // Feed emulated orientation events and verify that the SAME
                  // scene transform used on desktop responds to mobile tilt.
                  await page.evaluate(()=>{
                    for(const gamma of [0,26]){
                      const e=new Event('deviceorientation');
                      Object.defineProperty(e,'beta',{value:gamma});
                      Object.defineProperty(e,'gamma',{value:gamma});
                      dispatchEvent(e);
                    }
                  });
                  await page.waitForTimeout(400);
                  const transform=await page.locator('#scene').evaluate(el=>el.style.transform);
                  const yaw=Number(transform.match(/rotateY\((-?[\d.]+)deg\)/)?.[1]);
                  assert.ok(Math.abs(yaw)>1,'mobile gyro did not rotate the classroom: '+transform);
                  assert.equal(await page.locator('#calibrate-motion').count(),0,'recenter button must be absent');
                  console.log('PASS: mobile emulated gyroscope rotates classroom in '+(cfg.width>cfg.height?'real':'virtual')+' landscape');
                }
                await page.screenshot({path:'artifacts/classroom/'+(cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-ui.png'});
                await page.locator('#next-line').click();
                assert.equal(await page.locator('#dialogue-text').textContent(),'明明已经放学了，为什么还有声音？');
                await page.locator('#log-button').click();
                assert.equal(await page.locator('#history').isVisible(),true,'LOG does not open');
                await page.locator('#log-button').click();
                assert.equal(await page.locator('#dialogue').isVisible(),true,'LOG does not close');
                await page.locator('#auto-button').click();
                assert.equal(await page.locator('#auto-button').getAttribute('aria-pressed'),'true','AUTO did not start');
                await page.locator('#auto-button').click();
                assert.equal(await page.locator('#auto-button').getAttribute('aria-pressed'),'false','AUTO did not stop');
                await page.locator('#menu-toggle').click();
                assert.equal(await page.locator('#restart-button').isVisible(),true,'menu does not open');
                await page.locator('#restart-button').click();
                assert.equal(await page.locator('#dialogue-text').textContent(),'这间教室……和我记忆里的，不太一样。');
                await page.locator('#menu-toggle').click();
                await page.locator('#return-main').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                  &&document.getElementById('scene').dataset.scene==='menu',null,{timeout:6500});
                assert.equal(await page.locator('#menu-continue').isEnabled(),true);
                await page.locator('#menu-continue').click();
                await page.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                  &&document.getElementById('scene').dataset.scene==='classroom',null,{timeout:6500});
                await page.screenshot({path:'artifacts/classroom/'+(cfg.mobile?(cfg.width>cfg.height?'mobile-landscape':'mobile-portrait'):'desktop')+'-ui-tested.png'});
                console.log('PASS:',cfg.mobile?'mobile':'desktop',renderer,'fluid frames',Number(after)-Number(before));
                await page.close();
              }

              // Extra viewport audit beyond the three full smoke regressions:
              // ultrawide, 4:3, small portrait phone and large CSS-pixel 4K.
              for(const vp of [
                {width:2560,height:1080,mobile:false},
                {width:1024,height:768,mobile:false},
                {width:320,height:568,mobile:true},
                {width:720,height:1280,mobile:true},
                {width:3840,height:2160,mobile:false}
              ]){
                const p=await browser.newPage({
                  viewport:{width:vp.width,height:vp.height},
                  isMobile:vp.mobile,hasTouch:vp.mobile
                });
                try{
                  await p.goto('http://127.0.0.1:8123/',{waitUntil:'load'});
                  await p.locator('#menu-start').click();
                  await p.waitForFunction(()=>document.getElementById('scene-transition').dataset.phase==='idle'
                    &&document.getElementById('scene').dataset.scene==='classroom',null,{timeout:6500});
                  const metrics=await p.evaluate(()=>{
                    const view=document.getElementById('view');
                    const selectors=['#menu-toggle','#auto-button','#log-button','#speaker','#dialogue-text','#next-line'];
                    const locations=selectors.map(sel=>{
                      const rect=document.querySelector(sel).getBoundingClientRect();
                      return {sel,x:rect.left,y:rect.top,right:rect.right,bottom:rect.bottom};
                    });
                    return {locations,font:parseFloat(getComputedStyle(document.getElementById('dialogue-text')).fontSize),
                      logicalW:view.clientWidth,logicalH:view.clientHeight,
                      virtual:document.body.classList.contains('virtual-landscape')};
                  });
                  assert.equal(metrics.virtual,vp.mobile&&vp.height>vp.width);
                  for(const rect of metrics.locations){
                    assert.ok(rect.x>=-3&&rect.y>=-3&&rect.right<=vp.width+3&&rect.bottom<=vp.height+3,
                      'responsive overflow '+vp.width+'x'+vp.height+' '+JSON.stringify(rect));
                  }
                  if(vp.width===3840){
                    assert.ok(metrics.font>=60,'4K dialogue text does not scale up');
                  }
                  if(vp.width===320){
                    assert.ok(metrics.font>=12,'small-phone text illegibly small');
                  }
                  console.log('PASS: responsive '+vp.width+'x'+vp.height+
                    ' UI text '+metrics.font+'px');
                } finally{await p.close()}
              }
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-fluid-smoke-review
          path: artifacts/classroom
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
