name: Test and deploy untitled game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: untitled-pages-pixel-20261027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Logic and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Check independent game art assets
        run: |
          test -f index.html
          test -f assets/shop.svg
          for n in 01 02 03 04 05 06 07 08; do test -f "assets/guest-$n.svg"; done
          test -f android/app/src/main/AndroidManifest.xml
  browser-e2e:
    name: Two real mobile-size shop clients
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 peer@1.0.2 peerjs@1.5.5
      - name: Use installed Chromium-family browser or download fallback
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            echo "Using the Chromium-family browser already installed on the runner."
          else
            npx playwright install --with-deps chromium
          fi
      - name: Prepare Chinese UI fonts without blocking gameplay tests
        run: |
          # Font packages are optional; do not skip real Chromium multiplayer
          # checks when GitHub runner apt mirrors stall.
          if fc-list : family | grep -qi "Noto Sans CJK"; then
            echo "Noto CJK already available"
          else
            timeout 20s sudo apt-get update -qq || echo "apt mirror unavailable; using cached lists"
            timeout 35s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk || echo "CJK font install unavailable; continuing browser tests"
          fi
          fc-cache -f || true
          fc-match "Noto Sans CJK SC" || true
      - run: node tests/browser-e2e.mjs
      - name: Screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: untitled-kiosk-portrait-landscape-shots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    name: Publish site
    needs: [tests, browser-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site
        run: |
          mkdir -p _site/src _site/assets
          cp index.html style.css sw.js .nojekyll _site/
          cp src/kiosk-core.js src/kiosk-skin.js src/kiosk-pixel.js src/kiosk-view.js src/kiosk-guest.js src/kiosk-motion.js src/kiosk-item-motion.js src/kiosk-app.js src/network.js _site/src/
          cp assets/*.svg _site/assets/
      - name: Verify published ES module dependencies
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {dirname,resolve,sep} from 'node:path';
          const root=resolve('_site'),pending=[resolve(root,'src/kiosk-app.js')],seen=new Set();
          while(pending.length){
            const file=pending.pop();
            if(seen.has(file))continue;
            seen.add(file);
            if(!file.startsWith(root+sep)||!existsSync(file))throw Error('Missing deployed module: '+file);
            const source=readFileSync(file,'utf8');
            for(const m of source.matchAll(/\b(?:import|export)\s+(?:[^'"]*?\s+from\s+)?['"](\.[^'"]+)['"]/g)){
              const dep=resolve(dirname(file),m[1]);
              if(!dep.startsWith(root+sep))throw Error('Import escapes public directory: '+m[1]);
              pending.push(dep);
            }
          }
          console.log('Verified '+seen.size+' published ES modules: '+[...seen].map(p=>p.slice(root.length+1)).join(', '));
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
