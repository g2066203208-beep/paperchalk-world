name: WORLD Studio - Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: world-studio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify public examples
        run: |
          test -s dist/index.html
          test -s dist/style-study.html
          test -s dist/assets/style-study-*.js || ls -l dist/assets/
          test -s examples/kiosk.bbmodel
          test -s examples/street.bbmodel
          test -s examples/home.bbmodel
      - uses: actions/upload-artifact@v4
        with:
          name: world-studio-web-build
          path: dist/
          retention-days: 14
  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
      - name: Ensure readable Chinese glyphs in real browser screenshots
        run: |
          if ! fc-list :lang=zh family | grep -qi 'Noto Sans CJK'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - run: node tests/browser.mjs
      - name: Actual desktop and phone Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-studio-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    needs: [test, browser-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: world-studio-web-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
