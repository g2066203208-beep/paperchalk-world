name: Female six second outfit - actual PSD hosted L2D proof
on:
  push:
    branches: [main]
    paths:
      - 'site/assets/l2d/inbox/female-06-second-outfit.zip'
      - 'tests/test_female06_second_hosted_browser.cjs'
      - '.github/workflows/female06-second-hosted.yml'
      - 'scripts/build_l2d_library.py'
      - 'site/character-editor/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-real-outfit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install original art only, preserve the canonical bodies
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/build_char002_psd_rig.py
          python3 scripts/build_character_catalog.py
          python3 scripts/build_scene_catalog.py
      - name: Validate real 001.psd module and byte-identical original base
        run: |
          python3 tests/test_female06_base_immutable.py
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('site/assets/l2d')
          ident='female-06-second-outfit'
          zip_path=root/'inbox'/f'{ident}.zip'
          target=root/'library'/ident
          assert zip_path.is_file()
          with ZipFile(zip_path) as src:
              members=[x for x in src.namelist() if x.startswith(ident+'/') and not x.endswith('/')]
              for name in members:
                  installed=target/name[len(ident)+1:]
                  assert installed.is_file(),f'not installed: {name}'
                  if name.endswith('.png'):
                      assert hashlib.sha256(src.read(name)).digest()==hashlib.sha256(installed.read_bytes()).digest(),f'PSD ArtMesh raster modified: {name}'
              rig=json.loads((target/'front.rig.json').read_text())
              assert rig['sourceSha256']=='eedfee1ab0fa28a89ebe696c9824ddd3a9dda2460cb513584e1bf7c8408b71d8'
              assert len(rig['parts'])==16
              assert rig['parts']['bottomwear']['skinBinding']['target']=='legwear'
              assert 'bodyOcclusion' not in rig['parts']['bottomwear']['skinBinding']
              catalog=json.loads(Path('site/characters.catalog.json').read_text())
              ids={c['id']:c for c in catalog['characters']}
              assert ids[ident]['familyId']=='female-06'
              assert ids[ident]['variantCategory']=='outfit'
              assert ids[ident]['l2dModule']['front']['rig']['partCount']==16
          print('PASS: actual 001.psd new clothes published, original 16 PNGs preserved, correct 女六 second outfit in catalog')
          PY
      - name: Prepare real Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify hosted L2D with real new clothes and save preview
        run: |
          python3 -m http.server 8134 --directory site >/tmp/second-hosted.log 2>&1 &
          node tests/test_female06_second_hosted_browser.cjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: female06-second-hosted-real-001psd
          path: artifacts/character-editor/FEMALE06-SECOND-OUTFIT-HOSTED-L2D.png
          if-no-files-found: warn
          retention-days: 10
