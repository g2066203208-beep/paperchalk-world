name: Build independent approved GPT scene assets
on:
  push:
    branches: [main]
    paths:
      - tools/extract_approved_gpt_art.py
      - .github/workflows/extract-gpt-scene.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - name: Extract and validate authentic source pixels
        run: |
          python tools/extract_approved_gpt_art.py
          python - <<'PY'
          import json
          from PIL import Image
          from pathlib import Path
          root=Path('assets/gptimg/parts')
          m=json.loads((root/'manifest.json').read_text())
          assert len(m['sprites'])==27
          for n,meta in m['sprites'].items():
              p=root/meta['file'];assert p.exists(),n
              im=Image.open(p);assert list(im.size)==meta['size'],n
          a=Image.open(root/'customer-idle.png').getchannel('A')
          assert a.getextrema()==(0,255)
          print('Transparent customer and all 27 manifest entries validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-gpt-kiosk-png-sprites
          path: assets/gptimg/parts/
          retention-days: 30
      - name: Version generated assets in source control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gptimg/parts/
          if git diff --cached --quiet; then
            echo "No changes to extracted image bytes"
          else
            git commit -m "assets(gpt): commit separately loadable generated sprite crops"
            git push origin HEAD:main
          fi
