name: Horror Room - procedural 3D visual QA
on:
  push:
    branches: [main]
    paths:
      - 'site/horror-room/**'
      - 'tests/horror-room-browser.mjs'
      - '.github/workflows/horror-room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-horror-room:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and Chinese fonts
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Render and test original 3D horror room
        run: node tests/horror-room-browser.mjs
      - name: Save real Chromium snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-room-original-mesh-three-viewports
          path: artifacts/horror-room/
          retention-days: 14
          if-no-files-found: warn
