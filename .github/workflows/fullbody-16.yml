name: PixelLab - extend sixteen trained faces to complete full-body sprites
# ARCHIVED: isolated face/tiny-sprite/template research; never auto-train on main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: fullbody-sixteen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel ML training stack
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Restore two authentic D-palette full-body source poses
        run: python -m ml.style2.prepare
      - name: Fetch exact 16 FACE output PNGs from verified previous neural training
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow face-train.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          mkdir -p "$RUNNER_TEMP/face16"
          gh run download "$RUN_ID" --name pixel-face-trained-samples-and-weights --dir "$RUNNER_TEMP/face16"
          test -s "$RUNNER_TEMP/face16/site/pixel-lab/style2/face-lab/report.json"
          mkdir -p site/pixel-lab/style2/face-lab
          cp "$RUNNER_TEMP/face16/site/pixel-lab/style2/face-lab"/candidate_*.png site/pixel-lab/style2/face-lab/
          python - <<'PY'
          from pathlib import Path
          d=Path("site/pixel-lab/style2/face-lab")
          assert len(list(d.glob("candidate_*.png")))==16
          print("PASS: input exactly 16 original previously learned face PNGs")
          PY
      - name: Train real coarse body-part network and complete all 16 full bodies
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.extend_16_fullbody --steps 100
      - name: Verify every 384x512 PNG, body completeness and training checkpoint
        run: python -m ml.style2.verify_extend_16_fullbody
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium to check all 16 real sprites
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser check 16 fullbody PNGs and matched faces on desktop/mobile
        run: node tests/fullbody-16-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-sixteen-fullbody-384x512-model-and-gallery
          path: |
            site/pixel-lab/style2/fullbody-16/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit verified PNG images to Pages source (without the large neural weights)
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pixel-lab/style2/fullbody-16/*.png site/pixel-lab/style2/fullbody-16/report.json
          if git diff --cached --quiet; then
            echo 'All sixteen sprites already committed'
          else
            git commit -m 'assets(pixel-lab): publish verified sixteen full-body D pixel sprites'
            for i in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'PASS: model training output is now committed in public Pages source'
                exit 0
              fi
              sleep 2
            done
            echo '::error::Unable to commit trained pixel outputs to main'
            exit 1
          fi

