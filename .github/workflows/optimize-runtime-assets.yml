name: Optimize Runtime UI Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Build lossless WebP runtime copies
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          pairs = [
              ("assets/ui/backpack-ui-v2.png", "assets/ui/backpack-ui-v2.webp"),
              ("assets/ui/transitions/paper-ball.png", "assets/ui/transitions/paper-ball.webp"),
              ("assets/ui/transitions/paper-unfold.png", "assets/ui/transitions/paper-unfold.webp"),
          ]

          before = after = 0
          for src_name, dst_name in pairs:
              src, dst = Path(src_name), Path(dst_name)
              im = Image.open(src).convert("RGBA")
              im.save(dst, "WEBP", lossless=True, method=6, exact=True)
              before += src.stat().st_size
              after += dst.stat().st_size
              print(f"{src} {src.stat().st_size} -> {dst} {dst.stat().st_size}")

          print(f"runtime UI bytes: {before} -> {after} ({after / before:.1%})")
          PY
      - name: Commit optimized runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/backpack-ui-v2.webp assets/ui/transitions/paper-ball.webp assets/ui/transitions/paper-unfold.webp
          if git diff --cached --quiet; then
            echo "Optimized assets already current."
          else
            git commit -m "Add lossless WebP runtime UI assets"
            git push
          fi
