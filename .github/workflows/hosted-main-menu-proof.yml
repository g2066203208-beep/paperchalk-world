name: Main Menu — 3D Anima Scene Integration and Legacy Duel Cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/card-battle/anima-paintover-lab.html'
      - 'site/card-battle/engine/anima-paintover-lab.js'
      - 'tests/hosted-main-menu-proof-browser.mjs'
      - '.github/workflows/hosted-main-menu-proof.yml'
permissions:
  contents: read
jobs:
  current-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test syntax
        run: node --check tests/hosted-main-menu-proof-browser.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build real production scene catalog needed by root main menu
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/build_scene_catalog.py
      - name: Start checked-out source server (then independently inspect hosted Pages)
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/hosted-menu-web.log 2>&1 &
          sleep 2
      - name: Verify new menu entry, removed duel and real WebGL scene with screenshot
        run: node tests/hosted-main-menu-proof-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-main-menu-anima-3d-actual-before-after
          path: artifacts/hosted-main-menu-proof/
          retention-days: 14
          if-no-files-found: warn