name: Localize paper scenery r13
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow numpy
      - name: Download supplied artwork
        run: |
          mkdir -p /tmp/paper-scenery assets/backgrounds
          curl -L --fail --retry 3 -o /tmp/paper-scenery/mountain.jpg "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/9359f9c67716978284ae1b4edd8a6bb764c58cf7476c960a7a591581f44b6c52.jpg"
          curl -L --fail --retry 3 -o /tmp/paper-scenery/sun.jpg "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/9eefd05bf59f62b4e397393a50be77ede51259cd2a5303bdc5aab8839d308765.jpg"
          curl -L --fail --retry 3 -o /tmp/paper-scenery/moon.jpg "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/97d5976eea61b79105af1deb86532fee4a3bdfb8f35db908af57f6076f98ff25.jpg"
          curl -L --fail --retry 3 -o /tmp/paper-scenery/cloud.jpg "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/120f2d21f6c05b1f90db39cae8ef6de9cadcab509c4a068e788855e74e641eea.jpg"
      - name: Remove black backing and optimize
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from pathlib import Path
          
          def process(src,dst,max_w,quality):
              im=Image.open(src).convert("RGBA")
              a=np.asarray(im).copy()
              rgb=a[:,:,:3].astype("float32")
              m=rgb.max(axis=2)
              alpha=np.clip((m-18.0)/(55.0-18.0)*255.0,0,255).astype("uint8")
              a[:,:,3]=np.minimum(a[:,:,3],alpha)
              out=Image.fromarray(a,"RGBA")
              aa=np.asarray(out.getchannel("A"))
              ys,xs=np.where(aa>8)
              if len(xs):
                  out=out.crop((int(xs.min()),int(ys.min()),int(xs.max()+1),int(ys.max()+1)))
              if out.width>max_w:
                  out=out.resize((max_w,round(out.height*max_w/out.width)),Image.Resampling.LANCZOS)
              out.save(dst,"WEBP",quality=quality,method=6)
          
          process("/tmp/paper-scenery/mountain.jpg","assets/backgrounds/mountain-paper-r13.webp",1100,50)
          process("/tmp/paper-scenery/sun.jpg","assets/backgrounds/sun-paper-r13.webp",256,58)
          process("/tmp/paper-scenery/moon.jpg","assets/backgrounds/moon-paper-r13.webp",256,58)
          process("/tmp/paper-scenery/cloud.jpg","assets/backgrounds/cloud-paper-r13.webp",640,58)
          PY
      - name: Commit localized assets
        run: |
          git config user.name "paperchalk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/backgrounds/mountain-paper-r13.webp assets/backgrounds/sun-paper-r13.webp assets/backgrounds/moon-paper-r13.webp assets/backgrounds/cloud-paper-r13.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Localize supplied paper mountain and sky props"
          git push
