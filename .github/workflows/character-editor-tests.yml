      - name: Verify person tree, true Z order, save and live UV editing
        run: |
          python3 -m http.server 8134 --directory site >/tmp/l2d-studio-rework.log 2>&1 &
          node tests/test_l2d_studio_rework_browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-editor-screenshots
          path: artifacts/character-editor
          retention-days: 7
