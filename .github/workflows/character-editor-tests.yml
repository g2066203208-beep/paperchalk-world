name: Character editor smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'site/character-editor/**'
      - '.github/workflows/character-editor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check syntax, desktop drawing and phone layout
        run: |
          mkdir -p artifacts/character-editor
          python3 -m http.server 8123 --directory site >/tmp/character-server.log 2>&1 &
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),{chromium}=require('playwright');
          const html=fs.readFileSync('site/character-editor/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)[1];new Function(script);
          new Function(fs.readFileSync('site/character-editor/stage-motion.js','utf8'));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const vp of [{width:1340,height:830},{width:390,height:844}]){
                const page=await browser.newPage({viewport:vp,acceptDownloads:true,hasTouch:vp.width<500,isMobile:vp.width<500});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8123/character-editor/',{waitUntil:'load'});
                await page.waitForFunction(()=>window.characterEditor&&window.characterEditor.S.ready,{timeout:10000});
                await page.waitForFunction(()=>!!window.PaperchalkStageMotion,{timeout:10000});
                assert.ok(await page.locator('#main-play').isVisible(),'full viewport playback control must be visible');
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),true);
                await page.locator('#main-preview').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),false,'precision mode shows original coordinates');
                await page.locator('#main-preview').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),true,'live main viewport restored');
                await page.locator('#main-expand').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.expanded),true);
                const large=await page.locator('#stage').boundingBox();
                assert.ok(large.width>=vp.width*.9,'main animated canvas expands to window width');
                await page.locator('#main-expand').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.expanded),false);
                await page.waitForFunction(()=>document.getElementById('stage').clientWidth>250,null,{timeout:7000});
                const fitRect=await page.locator('#stage').boundingBox();
                assert.ok(fitRect.width>250,'main viewport must regain nonzero width after exit');
                const initialLayerCount=await page.locator('#layers .layer').count();
                assert.ok(initialLayerCount>=1);
                assert.equal(await page.locator('#status').textContent().then(x=>x.includes('载入')),true);
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-initial.png',fullPage:true});
                await page.locator('#add').click();
                assert.equal(await page.locator('#layers .layer').count(),initialLayerCount+1);
                await page.locator('[data-tool="brush"]').click();
                await page.locator('#view').scrollIntoViewIfNeeded();
                const rect=await page.locator('#view').boundingBox(),x=rect.x+rect.width/2,y=rect.y+rect.height/2;
                await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+9,y+9,{steps:3});await page.mouse.up();
                const painted=await page.evaluate(()=>{
                  const s=window.characterEditor.S,p=s.layers[s.side][s.sel],d=p.canvas.getContext('2d').getImageData(0,0,p.canvas.width,p.canvas.height).data;
                  let count=0,xmin=9999,ymin=9999,xmax=-1,ymax=-1;
                  for(let i=3;i<d.length;i+=4){if(d[i]>0){count++;const n=(i-3)/4,x=n%p.canvas.width,y=(n/p.canvas.width)|0;xmin=Math.min(xmin,x);ymin=Math.min(ymin,y);xmax=Math.max(xmax,x);ymax=Math.max(ymax,y)}}
                  return {count,bounds:[xmin,ymin,xmax,ymax],tool:s.tool,sel:s.sel,zoom:s.zoom,pan:[s.px,s.py],drag:s.drag,layer:p.name}
                });
                console.log('Draw diagnostic',painted);
                assert.ok(painted.count>0,'brush stroke produced no pixels');
                await page.locator('#btnUndo').click();
                await page.locator('#btnRedo').click();
                await page.locator('#btnSave').click();
                await page.waitForFunction(()=>document.getElementById('status').textContent.includes('已保存'),null,{timeout:12000});
                const dl=page.waitForEvent('download');await page.locator('#btnExport').click();const downloaded=await dl;
                assert.ok(downloaded.suggestedFilename().endsWith('.zip'));
                await page.locator('#backTab').click();
                assert.ok(await page.locator('#layers .layer').count()>=1);
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-back.png',fullPage:true});
                assert.deepEqual(errors,[],'JavaScript errors');
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-editor-screenshots
          path: artifacts/character-editor
          retention-days: 7
