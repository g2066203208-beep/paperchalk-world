name: Character editor smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'site/character-editor/**'
      - 'site/l2d/part-rig.js'
      - '.github/workflows/character-editor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - run: python3 scripts/build_v4_assets.py
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check syntax, desktop drawing and phone layout
        run: |
          mkdir -p artifacts/character-editor
          python3 -m http.server 8123 --directory site >/tmp/character-server.log 2>&1 &
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),{chromium}=require('playwright');
          const html=fs.readFileSync('site/character-editor/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)[1];new Function(script);
          // Legacy breath UI and runtime are deliberately NOT imported.
          new Function(fs.readFileSync('site/l2d/part-rig.js','utf8'));
          new Function(fs.readFileSync('site/character-editor/part-rig-studio.js','utf8'));
          new Function(fs.readFileSync('site/character-editor/stage-motion.js','utf8'));
          new Function(fs.readFileSync('site/character-editor/easy-mode.js','utf8'));
          assert.ok(fs.readFileSync('site/character-editor/index.html','utf8').includes('easy-mode.css'),'responsive simplified style must load');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const vp of [{width:1340,height:830},{width:390,height:844}]){
                const page=await browser.newPage({viewport:vp,acceptDownloads:true,hasTouch:vp.width<500,isMobile:vp.width<500});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8123/character-editor/',{waitUntil:'load'});
                await page.waitForFunction(()=>window.characterEditor&&window.characterEditor.S.ready,{timeout:10000});
                await page.waitForFunction(()=>!!window.PaperchalkStageMotion,{timeout:10000});
                await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist'&&
                  window.PaperchalkStudio?.countSourceParts?.()===17,null,{timeout:30000}).catch(async error=>{
                  console.error('Original layer audit',await page.evaluate(()=>({
                    status:document.querySelector('#studio-status')?.textContent,
                    editor:document.querySelector('#status')?.textContent,
                    current:window.PaperchalkStudio?.current,
                    side:window.PaperchalkStudio?.editSide,
                    count:window.PaperchalkStudio?.countSourceParts?.(),
                    parts:window.characterEditor?.S.layers.front.map(p=>[p.partId,p.role,p.sourcePart])
                  })));
                  console.error('Browser JS errors',errors);
                  throw error;
                });
                await page.waitForFunction(()=>window.PaperchalkPartRigStudio?.state?.active===true,null,{timeout:10000});
                assert.equal(await page.locator('#part-rig-panel').isVisible(),false,
                  'new mesh is active by default without opening a cluttered settings panel');
                assert.equal(await page.locator('#rig-quick-panel').isVisible(),true,
                  'all seven quick sliders must be visible beside the new animation');
                assert.equal(await page.locator('#rig-quick-sliders input').count(),7);
                assert.equal(await page.locator('#rig-quick-save').isVisible(),true);
                await page.evaluate(()=>{
                  window.__partRigArtBackup=window.characterEditor.S.layers.front
                    .find(p=>p.partId==='jacket').canvas.toDataURL();
                });
                assert.equal(await page.evaluate(()=>window.PaperchalkStudio.useV4()),false,
                  'real source parts must use the new mesh, not the legacy V4 clip');
                // Real user-facing entry must be visible, reachable and active
                // in default EASY mode without hunting for the canvas toolbar.
                assert.equal(await page.locator('#idle-open').isVisible(),true,'idle entry must be prominently visible');
                const idleButton=await page.locator('#idle-open').boundingBox();
                console.log('IDLE ENTRY VISIBLE RECT',JSON.stringify({viewport:vp,button:idleButton,
                  dimensions:await page.evaluate(()=>({innerWidth:innerWidth,
                    innerHeight:innerHeight,scrollWidth:document.documentElement.scrollWidth,
                    css:getComputedStyle(document.querySelector('#idle-open')).cssText}))}));
                assert.ok(idleButton.width>110&&idleButton.x>=0&&idleButton.y>=0&&
                  idleButton.x+idleButton.width<=vp.width+1,'idle entry must fit the visible viewport');
                assert.equal(await page.locator('#l2d-strength').isVisible(),false,
                  'deprecated and misleading breathing slider must be hidden');
                await page.locator('#idle-open').click();
                await page.waitForFunction(()=>window.PaperchalkPartRigStudio?.state?.active===true,null,{timeout:10000});
                assert.ok(await page.locator('#part-rig-panel').isVisible());
                // Heroine portrait must NOT draw the selected mesh and axes by default.
                assert.equal(await page.locator('#rig-guides').isChecked(),false);
                assert.equal(await page.evaluate(()=>window.PaperchalkPartRigStudio.state.showGuides),false);
                // Raster QA: a fully opaque original PNG must not develop
                // translucent triangular cracks when transformed by bones.
                const seamPixels=await page.evaluate(()=>{
                  const core=window.PaperchalkPartRigCore;
                  const tex=document.createElement('canvas');tex.width=240;tex.height=280;
                  const tc=tex.getContext('2d');tc.fillStyle='#ffffff';tc.fillRect(0,0,240,280);
                  const layer={partId:'front_hair',name:'front_hair',sourcePart:true,
                    canvas:tex,x:80,y:60,visible:true,opacity:1};
                  const model=core.project([layer],'protagonist','front');
                  const output=document.createElement('canvas');output.width=460;output.height=460;
                  const ctx=output.getContext('2d',{alpha:true});
                  let worst=0;
                  for(const phase of [.8,1.7,2.9]){
                    ctx.clearRect(0,0,460,460);
                    core.draw(ctx,[layer],model,phase);
                    const d=ctx.getImageData(120,110,155,165).data;
                    let gaps=0;
                    for(let n=3;n<d.length;n+=4)if(d[n]<160)gaps++;
                    worst=Math.max(worst,gaps);
                  }
                  return worst;
                });
                console.log('OPAQUE TRIANGLE SEAM PIXELS',vp.width,seamPixels);
                assert.ok(seamPixels<50,
                  'joint-warped opaque hair cannot develop visible mesh raster cracks');
                assert.equal(await page.locator('#idle-open').getAttribute('aria-expanded'),'true');
                assert.equal(await page.locator('[data-quick="fringe"]').isVisible(),true);
                assert.equal(await page.locator('[data-quick="rear"]').isVisible(),true);
                assert.equal(await page.locator('[data-quick="skirt"]').isVisible(),true);
                for(const key of ['hands','shoulders','hips','speed'])
                  assert.equal(await page.locator('[data-quick="'+key+'"]').isVisible(),true,key+' slider missing');
                const panelRect=await page.locator('#part-rig-panel').boundingBox();
                assert.ok(panelRect.width>220&&panelRect.height>200&&
                  panelRect.x>=0&&panelRect.x+panelRect.width<=vp.width+2,
                  'idle controls panel must be on-screen, including phone viewport');
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-VISIBLE-HAIR-SKIRT-CONTROLS.png',fullPage:false});
                if(vp.width>500){
                  // Inspect the SAME 17 original PNG parts across one
                  // standing cycle; never create three weather variants again.
                  const sheet=await page.evaluate(()=>{
                    const core=window.PaperchalkPartRigCore;
                    const base=window.PaperchalkPartRigStudio.state.model;
                    const layers=window.characterEditor.S.layers.front;
                    const pic=document.createElement('canvas');
                    pic.width=1024;pic.height=1024;
                    const out=document.createElement('canvas');
                    out.width=1600;out.height=410;
                    const ctx=out.getContext('2d');ctx.fillStyle='#17202a';
                    ctx.fillRect(0,0,out.width,out.height);
                    [0,1.5,3.1,4.7].forEach((phase,i)=>{
                      const f=pic.getContext('2d');f.clearRect(0,0,1024,1024);
                      core.draw(f,layers,base,phase,'');
                      ctx.drawImage(pic,0,0,1024,1024,i*400+5,20,390,385);
                      ctx.fillStyle='#f2f2f2';ctx.font='14px sans-serif';
                      ctx.fillText('基础站立 / '+phase,i*400+8,17);
                    });
                    return out.toDataURL('image/png').split(',')[1];
                  });
                  fs.writeFileSync('artifacts/character-editor/heroine-basic-standing-4-phases.png',
                    Buffer.from(sheet,'base64'));
                }
                assert.equal(await page.locator('[data-idle-preset]').count(),0,'no confusing animation presets');
                await page.locator('[data-quick="fringe"]').fill('0');
                assert.equal(await page.evaluate(()=>
                  window.PaperchalkPartRigStudio.state.model.idleProfile.parts.front_hair),0);
                await page.locator('[data-quick="fringe"]').fill('900');
                await page.locator('[data-quick="rear"]').fill('1100');
                await page.locator('[data-quick="skirt"]').fill('1250');
                await page.locator('[data-quick="hands"]').fill('230');
                await page.locator('[data-quick="shoulders"]').fill('310');
                await page.locator('[data-quick="hips"]').fill('270');
                await page.locator('[data-quick="speed"]').fill('210');
                const quickValues=await page.evaluate(()=>{
                  const p=window.PaperchalkPartRigStudio.state.model.idleProfile;
                  return [p.parts.front_hair,p.parts.rear_hair,p.parts.skirt,
                    p.joints.hands,p.joints.shoulders,p.joints.hips,p.hair.speed,p.cloth.speed];
                });
                assert.deepEqual(quickValues,[9,11,12.5,2.3,3.1,2.7,2.1,2.1],
                  'quick sliders must change the SAME model used by the game renderer');
                await page.locator('#rig-quick-save').click();
                await page.waitForFunction(async()=>{
                  const r=await window.PaperchalkStudio.readPartRig('protagonist','front');
                  return r?.idleProfile?.parts.front_hair===9&&r?.idleProfile?.parts.skirt===12.5&&
                    r?.idleProfile?.joints?.hands===2.3&&r?.idleProfile?.joints?.shoulders===3.1&&
                    r?.idleProfile?.joints?.hips===2.7;
                },null,{timeout:15000});
                assert.equal(await page.evaluate(()=>{
                  const c=window.PaperchalkPartRigCore, m=window.PaperchalkPartRigStudio.state.model;
                  return c.bodyPoseAt(1,m.idleProfile).lean;
                }),0,'normal standing must not move the whole girl left/right');
                assert.equal(await page.locator('#rig-part option').count(),17);
                assert.equal(await page.locator('[data-quick="fringe"]').inputValue(),'900');
                assert.equal(await page.locator('[data-quick="skirt"]').inputValue(),'1250');
                await page.locator('#rig-part').selectOption('rear_hair');
                assert.equal(await page.locator('#rig-bone option').count(),6,'hair needs three independently skinned two-joint strands');
                await page.locator('#rig-advanced').evaluate(el=>{el.open=true;});
                await page.locator('#rig-guides').check();
                assert.equal(await page.evaluate(()=>window.PaperchalkPartRigStudio.state.showGuides),true);
                await page.locator('#rig-guides').uncheck();
                assert.equal(await page.evaluate(()=>window.PaperchalkPartRigStudio.state.showGuides),false);
                await page.locator('#rig-bone').selectOption('left-tip');
                await page.locator('[data-bone="amplitude"]').fill('30');
                await page.evaluate(()=>{
                  const m=window.PaperchalkPartRigStudio.state.model;
                  window.__originalJacketPose=window.PaperchalkPartRigCore.warpPoint(m.parts.jacket,.5,.95,Math.PI/2);
                });
                await page.locator('[data-rig="motion.x"]').fill('35');
                assert.equal(await page.evaluate(()=>Object.keys(window.PaperchalkPartRigCore.CHAR002).length),16,
                  'CHAR-002 has its own documented 16-part rig blueprint, not the heroine texture');
                assert.equal(await page.evaluate(()=>Object.keys(window.PaperchalkPartRigCore.BACK).length),8,
                  'reverse view uses its own eight source-part bindings');
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-independent-rear-hair-mesh.png',fullPage:true});
                const rigEval=await page.evaluate(()=>{
                  const core=window.PaperchalkPartRigCore;
                  const m=window.PaperchalkPartRigStudio.state.model;
                  const h=m.parts.rear_hair,j=m.parts.jacket;
                  return {hair:core.warpPoint(h,.5,.95,Math.PI/2),
                    pivot:core.warpPoint(h,h.pivot.x,h.pivot.y,Math.PI/2),
                    staticJacket:core.warpPoint(j,.5,.95,Math.PI/2),
                    jacketBefore:window.__originalJacketPose,
                    hx:h.x+.5*h.w,jx:j.x+.5*j.w,jy:j.y+.95*j.h,
                    pivotX:h.x+h.pivot.x*h.w,pivotY:h.y+h.pivot.y*h.h};
                });
                // The x displacement at a SINGLE instant may cancel between
                // the independent bone angle and a user-authored local offset.
                // Use temporal travel, not position at one arbitrary phase.
                const hairTravel=await page.evaluate(()=>{
                  const core=window.PaperchalkPartRigCore;
                  const p=window.PaperchalkPartRigStudio.state.model.parts.rear_hair;
                  const span=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
                  const poses=[0,.7,1.4,2.1,3.1,4.2,5.4]
                    .map(t=>core.warpPoint(p,.5,.95,t));
                  return Math.max(...poses.map((pt,i)=>Math.max(...poses
                    .filter((_,j)=>j!==i).map(q=>span(pt,q)))));
                });
                assert.ok(hairTravel>3,
                  'selected hair original pixels must articulate over a complete idle cycle');
                assert.ok(Math.abs(rigEval.pivot.x-rigEval.pivotX)<1e-6 &&
                  Math.abs(rigEval.pivot.y-rigEval.pivotY)<1e-6,'local root stays planted');
                assert.deepEqual(rigEval.staticJacket,rigEval.jacketBefore,
                  'jacket moves only on its OWN bones, never because hair was edited');
                const armIsolation=await page.evaluate(()=>{
                  const core=window.PaperchalkPartRigCore;
                  const parts=window.PaperchalkPartRigStudio.state.model.parts;
                  const arm=parts.sleeves_and_hands;
                  const beforeLeft=core.warpPoint(arm,.18,.92,1.4);
                  const beforeRight=core.warpPoint(arm,.82,.92,1.4);
                  const elbow=arm.bones.find(b=>b.id==='left-elbow');
                  const old=elbow.amplitude;elbow.amplitude=35;
                  const afterLeft=core.warpPoint(arm,.18,.92,1.4);
                  const afterRight=core.warpPoint(arm,.82,.92,1.4);
                  elbow.amplitude=old;
                  return {left:Math.hypot(afterLeft.x-beforeLeft.x,afterLeft.y-beforeLeft.y),
                    right:Math.hypot(afterRight.x-beforeRight.x,afterRight.y-beforeRight.y),
                    skirt:parts.skirt.bones.length,jacket:parts.jacket.bones.length};
                });
                assert.ok(armIsolation.left>1,'left elbow must independently bend source arm pixels');
                assert.ok(armIsolation.right<armIsolation.left*.15,
                  'right arm must remain nearly unchanged when only left elbow is edited');
                assert.equal(armIsolation.skirt,6,'skirt has three separate two-bone pleat chains');
                assert.equal(armIsolation.jacket,4,'jacket left and right panels have independent chains');
                await page.locator('#rig-save').click();
                await page.waitForFunction(async()=>{
                  const saved=await window.PaperchalkStudio.readPartRig('protagonist','front');
                  return saved?.parts?.rear_hair?.motion?.x===35;
                },null,{timeout:10000});
                await page.locator('#rig-close').click();
                assert.equal(await page.locator('#part-rig-panel').isVisible(),false);
                assert.equal(await page.evaluate(()=>window.PaperchalkPartRigStudio.state.active),true,
                  'closing settings must not stop or revert the new mesh animation');
                assert.equal(await page.evaluate(()=>window.PaperchalkStudio.useV4()),false);
                assert.equal(await page.evaluate(()=>
                  window.characterEditor.S.layers.front.find(p=>p.partId==='jacket').canvas.toDataURL()===
                    window.__partRigArtBackup),true,'the old approved jacket pixels stay byte-identical');
                const directPage=await browser.newPage({viewport:vp,isMobile:vp.width<500,hasTouch:vp.width<500});
                await directPage.goto('http://127.0.0.1:8123/character-editor/?character=protagonist&side=front&idle=1',
                  {waitUntil:'load'});
                await directPage.waitForFunction(()=>window.PaperchalkPartRigStudio?.state?.active===true,null,{timeout:30000});
                assert.equal(await directPage.locator('#part-rig-panel').isVisible(),false,
                  'all entry URLs default to the same uncluttered new-animation canvas');
                await directPage.locator('#idle-open').click();
                assert.equal(await directPage.locator('[data-quick="fringe"]').isVisible(),true);
                await directPage.screenshot({path:'artifacts/character-editor/'+vp.width+'-DIRECT-URL-OPEN.png'});
                await directPage.close();

                assert.ok(await page.locator('#main-play').isVisible(),'full viewport playback control must be visible');
                assert.equal(await page.locator('#dev-l2d-preview-controls').count(),0,
                  'old 400% breathing panel must be deleted, not just hidden');
                assert.equal(await page.locator('#l2d-strength').count(),0);
                assert.equal(await page.evaluate(()=>window.PaperchalkLocalBreath),undefined,
                  'the retired breathing renderer must never load in the editor');
                const blinkMath=await page.evaluate(()=>{
                  const fn=window.PaperchalkPartRigCore.blinkAmount;
                  return {open:fn(0),closed:fn(.9*2*Math.PI/3.6),
                    reopened:fn(1.35*2*Math.PI/3.6)};
                });
                assert.ok(blinkMath.open<.001&&blinkMath.closed>.99&&blinkMath.reopened<.001,
                  'blink must close and reopen fully in one natural short cycle');
                assert.ok(await page.locator('#easy-quickbar').isVisible(),'large-screen and phone quick edit tools must exist');
                assert.ok(await page.locator('body.easy-mode').count()===1,'simple mode is the default');
                assert.ok(await page.locator('#easy-save-note').textContent().then(x=>x.includes('浏览器')),'save must disclose browser-only persistence');
                await page.locator('#easy-mode-switch').click();
                assert.ok(await page.locator('body.expert-mode').count()===1,'expert mode reveals full controls');
                await page.locator('#easy-mode-switch').click();
                assert.ok(await page.locator('body.easy-mode').count()===1,'simple mode can be restored');
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),true);
                await page.locator('#main-preview').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),false,'precision mode shows original coordinates');
                await page.locator('#main-preview').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.enabled),true,'live main viewport restored');
                await page.locator('#main-expand').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.expanded),true);
                const large=await page.locator('#stage').boundingBox();
                assert.ok(large.width>=vp.width*.9,'main animated canvas expands to window width');
                await page.locator('#main-expand').click();
                assert.equal(await page.evaluate(()=>window.PaperchalkStageMotion.state.expanded),false);
                await page.waitForFunction(()=>document.getElementById('stage').clientWidth>250,null,{timeout:7000});
                const fitRect=await page.locator('#stage').boundingBox();
                assert.ok(fitRect.width>250,'main viewport must regain nonzero width after exit');
                const initialLayerCount=await page.locator('#layers .layer').count();
                assert.ok(initialLayerCount>=1);
                assert.ok(await page.locator('#status').textContent().then(x=>x.length>0&&!x.includes('失败')),
                  'editor must report a non-error state after all hosted original parts load');
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-initial.png',fullPage:true});
                await page.locator('#add').click();
                assert.equal(await page.locator('#layers .layer').count(),initialLayerCount+1);
                await page.locator('[data-easy-tool="brush"]').click();
                await page.locator('#view').scrollIntoViewIfNeeded();
                const rect=await page.locator('#view').boundingBox(),x=rect.x+rect.width/2,y=rect.y+rect.height/2;
                await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+9,y+9,{steps:3});await page.mouse.up();
                const painted=await page.evaluate(()=>{
                  const s=window.characterEditor.S,p=s.layers[s.side][s.sel],d=p.canvas.getContext('2d').getImageData(0,0,p.canvas.width,p.canvas.height).data;
                  let count=0,xmin=9999,ymin=9999,xmax=-1,ymax=-1;
                  for(let i=3;i<d.length;i+=4){if(d[i]>0){count++;const n=(i-3)/4,x=n%p.canvas.width,y=(n/p.canvas.width)|0;xmin=Math.min(xmin,x);ymin=Math.min(ymin,y);xmax=Math.max(xmax,x);ymax=Math.max(ymax,y)}}
                  return {count,bounds:[xmin,ymin,xmax,ymax],tool:s.tool,sel:s.sel,zoom:s.zoom,pan:[s.px,s.py],drag:s.drag,layer:p.name}
                });
                console.log('Draw diagnostic',painted);
                assert.ok(painted.count>0,'brush stroke produced no pixels');
                await page.locator('#easy-undo').click();
                await page.locator('#easy-redo').click();
                await page.locator('#btnSave').click();
                await page.waitForFunction(()=>document.getElementById('status').textContent.includes('已保存'),null,{timeout:12000});
                const dl=page.waitForEvent('download');await page.locator('#btnExport').click();const downloaded=await dl;
                assert.ok(downloaded.suggestedFilename().endsWith('.zip'));
                await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist',{timeout:12000});
                await page.locator('#studio-side').selectOption('back');
                await page.waitForFunction(()=>window.PaperchalkStudio?.editSide==='back',{timeout:15000});
                assert.ok(await page.locator('#layers .layer').count()>=1);
                await page.screenshot({path:'artifacts/character-editor/'+vp.width+'-back.png',fullPage:true});
                assert.deepEqual(errors,[],'JavaScript errors');
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-editor-screenshots
          path: artifacts/character-editor
          retention-days: 7
