name: PixelLab - whole fullbody 384x512 training and visual evidence
on:
  push:
    branches: [main]
    paths:
      - 'ml/fullbody/**'
      - '.github/workflows/fullbody-learning.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fullbody-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native full-canvas training dependencies
        run: |
          python -m pip install --quiet "numpy==2.2.6" "Pillow==11.3.0"
          python -m pip install --quiet "torch==2.7.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train at 384x512 from complete illustration canvases ONLY
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m ml.fullbody.train --steps 110
      - name: Validate whole-figure checkpoint and model-generated reconstruction images
        run: python -m ml.fullbody.verify
      - name: Upload native-resolution model evidence and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-fullbody-384-native-torch-training
          path: |
            site/pixel-lab/fullbody-learning/
          retention-days: 21
          if-no-files-found: warn
      - name: Publish only verified images and honest training report to site
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pixel-lab/fullbody-learning/*.png site/pixel-lab/fullbody-learning/report.json
          if git diff --cached --quiet; then
            echo "Verified fullbody model previews unchanged"
            exit 0
          fi
          git commit -m 'assets(pixel-lab): publish native fullbody training evaluation and limitations'
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Could not publish; model artifacts remain available in this run"
          exit 1
