name: Stone Street Night WebGL QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/forest-level-01.html'
      - 'site/card-battle/engine/stone-street-environment.js'
      - 'site/card-battle/engine/forest-environment.js'
      - 'site/card-battle/engine/visual-look.js'
      - 'site/card-battle/engine/visual-shaders.js'
      - 'site/card-battle/engine/voxel-terrain.js'
      - 'site/card-battle/engine/world-time.js'
      - 'site/card-battle/engine/spatial-shadows.js'
      - 'tests/stone-street-browser.mjs'
      - 'tests/world-time.test.cjs'
      - '.github/workflows/stone-street-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-webgl-street:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modular environment syntax
        run: |
          node --check site/card-battle/engine/stone-street-environment.js
          node --check site/card-battle/engine/visual-look.js
          node --check site/card-battle/engine/visual-shaders.js
          node --check site/card-battle/engine/forest-environment.js
          node --check site/card-battle/engine/voxel-terrain.js
          node --check site/card-battle/engine/world-time.js
          node --check site/card-battle/engine/spatial-shadows.js
          node tests/world-time.test.cjs
          node --check tests/stone-street-browser.mjs
      - name: Install Chromium for real scene screenshots
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start actual game web server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/stone-street-http.log 2>&1 &
          sleep 2
      - name: Verify scene modules, real shadows, three-scene cycle and mobile
        run: node tests/stone-street-browser.mjs
      - name: Upload real WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stone-street-real-webgl
          path: artifacts/stone-street/
          if-no-files-found: warn
