name: Dot City Builder — official cases and real gameplay QA
on:
  push:
    branches: [main]
    paths:
      - 'site/game/city-builder.js'
      - 'site/game/city-builder-ui.js'
      - 'site/game/city-builder.css'
      - 'site/game/transit-map-ui.js'
      - 'site/index.html'
      - 'tests/city-builder.test.cjs'
      - 'tests/city-builder-browser.mjs'
      - '.github/workflows/dot-city-builder-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module-gameproof:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real city module compiler and 11 official examples
        run: |
          node --check site/game/city-builder.js
          node --check site/game/city-builder-ui.js
          node --check site/game/transit-map-ui.js
          node --test tests/city-builder.test.cjs tests/kirihama-location-masterplan.test.cjs
      - name: Install real Chrome renderer and project scene dependencies
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Serve actual horror game
        run: |
          python3 scripts/build_scene_catalog.py
          python3 -m http.server 8765 --directory site >/tmp/pw-dot-city-server.log 2>&1 &
          for k in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pw-dot-city-server.log
          exit 1
      - name: Open actual gameplay, assemble dot modules and prove save/reload
        run: node tests/city-builder-browser.mjs
      - name: Upload screenshots from real playable city editor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-city-builder-11-official-cases-real-chromium
          path: artifacts/city-builder/*.png
          if-no-files-found: warn
          retention-days: 14
