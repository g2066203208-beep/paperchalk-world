name: Restore Demo Lab After Production Deploy

on:
  workflow_run:
    workflows: ["Publish Mobile Test Channel"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paperchalk-pages
  cancel-in-progress: false

jobs:
  restore-demo-lab:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo-lab/
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: production
          fetch-depth: 1
      - name: Checkout current Demo Lab
        uses: actions/checkout@v7.0.1
        with:
          ref: demo-lab
          path: laboratory
          fetch-depth: 1
      - name: Rebuild public site without changing the mobile channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          git -C production archive HEAD | tar -x -C _site

          if git -C production ls-remote --exit-code --heads origin refs/heads/mobile-releases >/dev/null 2>&1; then
            git -C production fetch --depth=1 origin refs/heads/mobile-releases:refs/remotes/origin/mobile-releases
            git -C production archive refs/remotes/origin/mobile-releases app | tar -x -C _site
          fi

          lab_sha="$(git -C laboratory rev-parse HEAD)"
          lab_published_at="$(git -C laboratory show -s --format=%cI HEAD)"
          production_sha="$(git -C production rev-parse HEAD)"

          rm -rf _site/demo-lab
          mkdir -p _site/demo-lab
          cp -a laboratory/demo-lab/. _site/demo-lab/

          cat > _site/demo-lab/build-info.json <<EOF
          {
            "version": "$lab_sha",
            "publishedAt": "$lab_published_at",
            "channel": "experiment",
            "sourceMain": "$production_sha"
          }
          EOF

          # Keep an immutable copy of every published Demo Lab version.
          # The nested demo-lab/ directory preserves the same ../../vendor and
          # ../../assets relative paths used by the live lab.
          release_root="_site/demo-lab/releases/$lab_sha"
          mkdir -p "$release_root/demo-lab" "$release_root/vendor" "$release_root/assets"
          cp -a laboratory/demo-lab/. "$release_root/demo-lab/"
          cp -a production/vendor/three "$release_root/vendor/three"
          cp -a production/assets/player "$release_root/assets/player"
          cp production/visual-demo.html "$release_root/visual-demo.html"
          cp _site/demo-lab/build-info.json "$release_root/demo-lab/build-info.json"

          touch _site/.nojekyll

          test -f _site/demo-lab/index.html
          grep -q 'id="demoLabVersion"' _site/demo-lab/index.html
          test -f "$release_root/demo-lab/index.html"
          grep -q "\"version\": \"$lab_sha\"" _site/demo-lab/build-info.json
          test -f _site/app/channel.json
          echo "Production source: $production_sha"
          echo "Demo Lab source: $lab_sha"
          echo "Demo Lab immutable URL: /demo-lab/releases/$lab_sha/demo-lab/"
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy production plus isolated Demo Lab
        id: deployment
        uses: actions/deploy-pages@v5.0.1
