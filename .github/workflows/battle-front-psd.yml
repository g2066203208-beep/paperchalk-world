name: Battle-front PSD auto-load / real browser
on:
  push:
    branches: [main]
    paths:
      - 'site/assets/l2d/library/protagonist-battle-front/**'
      - 'site/character-editor/**'
      - 'site/characters.catalog.json'
      - 'site/l2d/part-rig.js'
      - 'tests/test_battle_front_studio_browser.js'
      - 'tests/test_l2d_action_mixer.js'
      - 'site/l2d/library-player.js'
      - 'scripts/build_l2d_library.py'
      - '.github/workflows/battle-front-psd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stable battle PSD Z order and action blending
        run: node tests/test_l2d_action_mixer.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Open hosted battle PSD in real Chromium, test meshes and capture screenshot
        run: |
          python3 -m http.server 8139 --directory site >/tmp/battle-front-http.log 2>&1 &
          node tests/test_battle_front_studio_browser.js
      - name: Upload render screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protagonist-battle-front-24-psd-layers
          path: artifacts/battle-front/
          retention-days: 7
