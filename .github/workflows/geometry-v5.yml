name: PixelLab V5 geometry - train and verify independently
on:
  push:
    branches: [main]
    paths:
      - 'ml/style2/volume_parts_v5.py'
      - 'ml/style2/verify_volume_parts_v5.py'
      - 'site/pixel-lab/style2/geometry-v5.html'
      - 'tests/geometry-v5-browser.mjs'
      - '.github/workflows/geometry-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geometry-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual CPU training stack
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Load exact D style gold source images
        run: python -m ml.style2.prepare
      - name: Train real anatomy and perspective model
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.volume_parts_v5 --steps 160
      - name: Gate trained checkpoint, depth, part labels, camera yaw and real D probes
        run: python -m ml.style2.verify_volume_parts_v5
      - name: Install real browser
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check V5 gallery actual output, angles, original characters and mobile viewport
        run: node tests/geometry-v5-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-v5-geometry-real-model-and-evidence
          path: |
            site/pixel-lab/style2/geometry-v5/
            repixel-browser-artifacts/geometry-v5-*.png
          retention-days: 30
          if-no-files-found: warn
