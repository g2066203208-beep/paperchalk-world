name: PixelLab model training and browser evidence (separate from game site)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'site/pixel-lab/**'
      - 'tests/v4_*'
      - 'tests/v5_*'
      - '.github/workflows/pixel-lab-training.yml'
permissions:
  contents: read
concurrency:
  group: pixellab-training-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact pixel processing dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Reconstruct original four-color source for legacy editor compatibility
        run: python -m ml.repixelize.engine --embedded ml/repixelize/reference-384.lzma.b64 --out-dir site/pixel-lab
      - name: Export D standing master WITHOUT old patch-MLP training
        run: python -m ml.repixelize.publish_d_standing
      - name: Verify source pixel grid conversion
        run: python -m unittest discover -s tests -p 'repixel_checks.py'
      - name: Prepare two D style reference sprites and region masks
        run: python -m ml.style2.prepare
      - name: Install PyTorch CPU for current V2 composition and native V3 detail models
        run: python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train V2 coarse composition four-token model
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.discrete_diffusion_v2 --steps 260
      - name: Check V2 composition weights and D colors
        run: python -m ml.style2.verify_discrete_v2
      - name: Recover 13 native 384x512 four-color images and train V4 conversion with a heldout pose
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m ml.style2.v4_pipeline --train
      - name: Train V5 body volume, perspective, anatomical-part and joint supervision
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.volume_parts_v5 --steps 160
      - name: Validate V5 learned anatomy, perspective, depth and joint predictions
        run: python -m ml.style2.verify_volume_parts_v5
      - name: Train V3 full 384x512 native detail model on 48x48 true-pixel crops
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.native_detail_v3 --steps 260
      - name: Verify all 384x512 native RGBs and compare fine-detail foreground with 192x256 baseline
        run: python -m ml.style2.verify_detail_v3
      - name: Install Chromium for relevant model UI
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify all V4 packed 384x512 images and strict draft quality boundaries
        run: python -m unittest discover -s tests -p 'v4_pipeline_checks.py'
      - name: Test true pixel converter upload
        run: node tests/repixel-browser.mjs
      - name: Test native pixel inspector
        run: node tests/repixel-grid-browser.mjs
      - name: Verify D color palette examples
        run: node tests/palette-browser.mjs
      - name: Verify immutable D standing master and grid
        run: node tests/d-standing-browser.mjs
      - name: Test V2 trained model browser on desktop/mobile
        run: node tests/discrete-v2-browser.mjs
      - name: Validate V4 person-asset review gallery and D palette in Chromium
        run: node tests/v4-gallery-browser.mjs
      - name: Browser-test V5 anatomy, perspective, depth and synthetic-to-real probes
        run: node tests/geometry-v5-browser.mjs
      - name: Test real full-resolution V3 character detail in Chromium desktop and mobile
        run: node tests/native-detail-v3-browser.mjs
      - name: Publish only current pixel artwork, masks, V2 and V3 weights and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelLab-native-384-detail-and-composition
          path: |
            repixel-browser-artifacts/
            site/pixel-lab/repixelized-384x512.png
            site/pixel-lab/repixelized-preview.png
            site/pixel-lab/repixelize-quality.json
            site/pixel-lab/d-standing-v1-384x512.png
            site/pixel-lab/d-standing-v1-preview-2x.png
            site/pixel-lab/d-standing-v1-report.json
            site/pixel-lab/style2/
          retention-days: 30
