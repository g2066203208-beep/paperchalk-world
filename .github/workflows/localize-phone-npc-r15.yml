name: Localize Phone NPC R15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-phone-npc-r15.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Download supplied character sheet
        run: |
          mkdir -p .tmp assets/npcs
          curl -L --fail --retry 3 \
            'https://cdn.openart.ai/openart-uploads/production/attachment-transfers/157aefd0835a5738804dd7c0ce41a96968e9578de47b97555e5b25b3b1da461d.jpg' \
            -o .tmp/phone-girl-sheet.jpg
      - name: Extract left character with transparency
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from PIL import Image

          src = cv2.imread('.tmp/phone-girl-sheet.jpg', cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('source image failed to load')
          h, w = src.shape[:2]

          # The supplied sheet is 1536x1024. Restrict GrabCut to the LEFT character
          # so the right costume design can never leak into this NPC asset.
          mask = np.zeros((h, w), np.uint8)
          bgd = np.zeros((1, 65), np.float64)
          fgd = np.zeros((1, 65), np.float64)
          rect = (300, 2, 390, h - 4)
          cv2.grabCut(src, mask, rect, bgd, fgd, 7, cv2.GC_INIT_WITH_RECT)

          alpha = np.where((mask == cv2.GC_FGD) | (mask == cv2.GC_PR_FGD), 255, 0).astype(np.uint8)

          # Keep only the main connected component around the left character.
          count, labels, stats, _ = cv2.connectedComponentsWithStats((alpha > 0).astype(np.uint8), 8)
          if count > 1:
              candidates = []
              for i in range(1, count):
                  x, y, ww, hh, area = stats[i]
                  cx = x + ww / 2
                  if 250 <= cx <= 720 and area > 2000:
                      candidates.append((area, i))
              if candidates:
                  keep = max(candidates)[1]
                  alpha = np.where(labels == keep, 255, 0).astype(np.uint8)

          # Slightly soften only the cut edge; no geometric resizing is performed.
          alpha = cv2.GaussianBlur(alpha, (3, 3), 0)
          ys, xs = np.where(alpha > 8)
          if not len(xs):
              raise SystemExit('left character segmentation is empty')
          x0, x1 = max(0, xs.min()-2), min(w, xs.max()+3)
          y0, y1 = max(0, ys.min()-2), min(h, ys.max()+3)

          rgba = cv2.cvtColor(src, cv2.COLOR_BGR2RGBA)
          rgba[:, :, 3] = alpha
          crop = rgba[y0:y1, x0:x1]
          out = Image.fromarray(crop, 'RGBA')
          out.save('assets/npcs/phone-girl-offline-r1.webp', 'WEBP', quality=82, method=6)

          print(f'NPC_NATIVE_SIZE={out.width}x{out.height}')
          print('NO_RESIZE_APPLIED=1')
          PY
      - name: Commit localized NPC asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/npcs/phone-girl-offline-r1.webp
          if git diff --cached --quiet; then
            echo 'asset already localized'
            exit 0
          fi
          git commit -m 'Add supplied left character as native-size NPC asset'
          git push origin HEAD:main
