name: Import Paper UI Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-backpack-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Download approved paper UI assets
        run: |
          mkdir -p assets/ui assets/ui/transitions
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/2fd972bd7bae028934699e818797a2f60920856791f105833ee247c8f4b12beb.png" \
            -o assets/ui/backpack-ui-v2.png
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/e800ad1b1055abe5be2347a5bdac787f8a1adf542b97c0c6c652e4beac66a23e.png" \
            -o assets/ui/transitions/paper-ball.png
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/c7977689e1f2d700a09ef9e75d7644d11db2d1234312ef944b6887e0b3bb2729.png" \
            -o assets/ui/transitions/paper-unfold.png
          file assets/ui/backpack-ui-v2.png assets/ui/transitions/paper-ball.png assets/ui/transitions/paper-unfold.png
          test "$(stat -c%s assets/ui/backpack-ui-v2.png)" -gt 1000000
          test "$(stat -c%s assets/ui/transitions/paper-ball.png)" -gt 200000
          test "$(stat -c%s assets/ui/transitions/paper-unfold.png)" -gt 500000
      - name: Build lossless WebP runtime copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          pairs = [
              ("assets/ui/backpack-ui-v2.png", "assets/ui/backpack-ui-v2.webp"),
              ("assets/ui/transitions/paper-ball.png", "assets/ui/transitions/paper-ball.webp"),
              ("assets/ui/transitions/paper-unfold.png", "assets/ui/transitions/paper-unfold.webp"),
          ]
          for src_name, dst_name in pairs:
              Image.open(src_name).convert("RGBA").save(dst_name, "WEBP", lossless=True, method=6, exact=True)
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/backpack-ui-v2.png assets/ui/backpack-ui-v2.webp assets/ui/transitions/paper-ball.png assets/ui/transitions/paper-ball.webp assets/ui/transitions/paper-unfold.png assets/ui/transitions/paper-unfold.webp
          if git diff --cached --quiet; then
            echo "Assets already current."
          else
            git commit -m "Add reusable paper transition assets"
            git push
          fi
