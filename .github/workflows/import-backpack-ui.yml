name: Import Backpack UI Asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-backpack-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved backpack UI
        run: |
          mkdir -p assets/ui
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/d40950ecd5b2909caab71dac968aec956d28948d53c7c1c0656d104ba3a41973.png" \
            -o assets/ui/backpack-ui-v1.png
          file assets/ui/backpack-ui-v1.png
          test "$(stat -c%s assets/ui/backpack-ui-v1.png)" -gt 1000000
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/backpack-ui-v1.png
          if git diff --cached --quiet; then
            echo "Asset already current."
          else
            git commit -m "Add approved paper-cut backpack UI asset"
            git push
          fi
