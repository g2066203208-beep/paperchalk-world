name: Import Player Action Assets

on:
  push:
    branches: [player-actions]
    paths:
      - ".github/workflows/import-player-actions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download supplied art
        run: |
          mkdir -p /tmp/player-actions assets/player
          curl -fL --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f9cec6da429ff2881eb4db2aebd19be22107ebba28365381403760e5508f64f7.jpg" -o /tmp/player-actions/idle.jpg
          curl -fL --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/407e0df56e8ca0689b92054a8e7cc251cab81c325fd6a668eaedfa06894c1825.jpg" -o /tmp/player-actions/crouch.jpg
          curl -fL --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/ea5830aa2d4da5235143c48bb0605c551503590e87ed72bf19b1f70b29616585.jpg" -o /tmp/player-actions/jump-up.jpg
          curl -fL --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/e6841c4b4d9ce74a309a4fd312ac004bb0e887e51091e020bb63ea4cbc190fad.jpg" -o /tmp/player-actions/jump-down.jpg
          curl -fL --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/ab247f28e7e22b4648a54a0366711c8698d3c309bac336534fbf922fb4b06e52.jpg" -o /tmp/player-actions/walk.jpg
      - run: python tools/process_player_actions.py /tmp/player-actions assets/player
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player/*.webp
          git diff --cached --quiet || (git commit -m "Add supplied player action sprites" && git push)
