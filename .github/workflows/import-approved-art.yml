name: Import approved anime art once
on:
  push:
    paths: [.github/workflows/import-approved-art.yml]
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Fetch original approved art and slice reusable transparent sprites
        env:
          SIGNED_SOURCES: '{"scene":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F470c7997-61a4-4c47-b89e-2b9053a831a0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHKidMXjlbehKkrc-IbbOOaEHxzyOflfsA8Wfg6GmD0I&exp=1793048217&osig=AAAAAAAAAAAAAAAAAAAAAHXpeOExZ5ZxB1BTWorD1co78_mgHIOULh6gTv0mL3X8&signer=media-rpc&token=AAIAAU0AJDQ3MGM3OTk3LTYxYTQtNGM0Ny1iODllLTJiOTA1M2E4MzFhMAAAAAABoXoAhajLdmdWV8ynoDqyUpWnftjF8EyPY2L5Zqn97LX7lHooaQ&x-canva-quality=thumbnail","customers":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F60059c3a-c80b-4028-861e-b3504642b6bb/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAL3rNF0ETyi-XnXLpC9N4s1GEiHYgkysG7rGz767dxMB&exp=1793049968&osig=AAAAAAAAAAAAAAAAAAAAABbhsMF9RU-14mO3Iq3iGe212YEzFRPzN7xOsLRfI_0M&signer=media-rpc&token=AAIAAU0AJDYwMDU5YzNhLWM4MGItNDAyOC04NjFlLWIzNTA0NjQyYjZiYgAAAAABoXobPYAjxR6pQiTzlJfBx1NA4sd0nCA3UyJwZ8J1FANSXd3qfg&x-canva-quality=thumbnail","goods":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fc3595f4d-541b-42b1-95f4-36a6352af47c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOv-EmZap2CWQeO0mlk76R_qvMasRJwy8_SAOm9-lA7r&exp=1793050013&osig=AAAAAAAAAAAAAAAAAAAAAIu-Fyj5DhA-dkqlYbQIJMPCmz7nu__CS5nCABfoG2fT&signer=media-rpc&token=AAIAAU0AJGMzNTk1ZjRkLTU0MWItNDJiMS05NWY0LTM2YTYzNTJhZjQ3YwAAAAABoXob7Uh_9asKCK3OoeDedbtueWhVT6eLmdyNquc1yTOMt5pVAQ&x-canva-quality=thumbnail","ui":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F2d801ae4-2b67-4b60-a8cf-c10bfe6aa615/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAfqtFjQbPDweVnoBh2hUeJk6Qp_iM9kLSpHaS3BmESN&exp=1793048636&osig=AAAAAAAAAAAAAAAAAAAAAGvdJd69Z3ro3YjrJ9eLg1Z-e92uI9MBJ9ssNIcC_0Da&signer=media-rpc&token=AAIAAU0AJDJkODAxYWU0LTJiNjctNGI2MC1hOGNmLWMxMGJmZTZhYTYxNQAAAAABoXoG6mDgHhmxlu0a6caag-n2ih0gkVYaEdLXBIPBb3_NZMiuVA&x-canva-quality=thumbnail"}'
        run: |
          import os,json,io,urllib.request,urllib.error
          from PIL import Image
          src=json.loads(os.environ["SIGNED_SOURCES"])
          os.makedirs("assets/anime",exist_ok=True)
          cut={
           "scene":{
           "window-open":(20,0,650,389),"window-closed":(635,0,1249,385),
           "cabinet-left-closed":(15,389,310,637),"cabinet-left-open":(311,386,641,640),
           "cabinet-right-closed":(643,387,869,645),"cabinet-right-open":(867,383,1135,652),
           "shelf-tower":(1130,360,1448,830),"drawer-closed":(25,635,336,818),
           "drawer-open":(332,638,655,811),"countertop":(0,809,666,1086),
           "mat":(636,645,950,816),"snow-street":(637,812,1061,1035),
           "lamp":(1212,0,1440,284),"upgrade-shelf":(936,646,1115,817),
           "upgrade-heater":(1093,669,1276,861)},
           "customers":{"girl":(0,0,724,543),"man":(724,0,1448,543),
           "woman":(0,543,724,1086),"child":(724,543,1448,1086)},
           "goods":{"bread":(0,0,362,362),"milk":(362,0,724,362),
           "battery":(724,0,1086,362),"cocoa":(1086,0,1448,362),
           "tea":(0,362,362,724),"chips":(362,362,724,724)},
           "ui":{"slope":(5,30,862,209),"panels":(26,225,847,551),
           "bottom":(28,911,1375,1030)}
          }
          ok=0
          for name,url in src.items():
           variants=[
            ("original",url.replace("height:150","height:1086").replace("width:200","width:1448").replace("x-canva-quality=thumbnail","x-canva-quality=preview")),
            ("original-signed",url.replace("height:150","height:1086").replace("width:200","width:1448")),
            ("thumbnail",url)
           ]
           img=None
           for label,link in variants:
            try:
             with urllib.request.urlopen(urllib.request.Request(link,headers={"User-Agent":"Mozilla/5.0"}),timeout=18) as rsp: data=rsp.read()
             im=Image.open(io.BytesIO(data)).convert("RGBA")
             print(name,label,im.size,len(data))
             img=im;break
            except Exception as e:print(name,label,type(e).__name__,str(e)[:65])
           if img is None:raise SystemExit("Cannot import "+name)
           sw,sh=img.size
           for key,(x0,y0,x1,y1) in cut[name].items():
            bb=(round(x0*sw/1448),round(y0*sh/1086),round(x1*sw/1448),round(y1*sh/1086))
            tile=img.crop(bb);tile.thumbnail((550,420),Image.Resampling.LANCZOS)
            tile.save("assets/anime/"+name+"-"+key+".webp",format="WEBP",quality=84,method=5)
            ok+=1
          print("ASSET_COUNT",ok)
          
      - name: Commit imported files for stable runtime use
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/anime/
          git commit -m "feat(art): import layered approved winter game sprites" || exit 0
          git push origin HEAD:main
