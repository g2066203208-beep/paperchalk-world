name: Pixel Character - Death Road individual structural learning
on:
  push:
    branches: [main]
    paths:
      - 'ml/deathroad_study/**'
      - 'tests/test_deathroad_character_study.py'
      - 'tests/test_deathroad_original_sprites.py'
      - '.github/workflows/deathroad-individual-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical training dependencies
        run: python -m pip install numpy Pillow
      - name: Unit-test thirty separately fitted native-pixel models
        run: python -m unittest discover -s tests -p test_deathroad_character_study.py -v
      - name: Train demo models on 30 ORIGINAL generated figures only
        run: python ml/deathroad_study/identity_lab.py --mode demo --output artifacts/deathroad-individual-demo
      - name: Publish independent-model diagnostic report, no third-party art
        uses: actions/upload-artifact@v4
        with:
          name: individual-character-30-original-demo-report
          path: artifacts/deathroad-individual-demo/
          retention-days: 14
  research-public-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analytical libraries
        run: python -m pip install numpy Pillow
      - name: Research thirty publicly visible reference slots WITHOUT publishing images
        run: |
          python ml/deathroad_study/identity_lab.py --mode reference --output artifacts/deathroad-reference-study
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/deathroad-reference-study')
          x=json.loads((p/'model-study.json').read_text())
          assert x['records_count']==30
          assert len(x['records'])==30
          model_files=sorted((p/'models').glob('DR2C-VISUAL-*.json'))
          assert len(model_files)==30,'each of 30 visible characters needs independent learned weights'
          assert all('contextual_weights' in json.loads(f.read_text()) for f in model_files)
          assert not list(p.rglob('*.png')),'no copyrighted sprite reproduction in artifacts'
          print('PASS: 30 independently trained parameter files, NO proprietary PNG exported')
          PY
      - name: Publish aggregate numerical descriptions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deathroad-30-independent-models-research-only
          path: artifacts/deathroad-reference-study/
          retention-days: 14
          if-no-files-found: warn

  render-original-characters:
    needs: [research-public-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-grid image inspection
        run: python -m pip install numpy Pillow
      - name: Download learned numerical palette statistics (never proprietary sprite images)
        uses: actions/download-artifact@v4
        with:
          name: deathroad-30-independent-models-research-only
          path: artifacts/model-input
      - name: Decode all thirty originally authored indexed sprite designs and apply learned palette statistics
        run: |
          python ml/deathroad_study/render_originals.py --study artifacts/model-input/model-study.json --out artifacts/original-characters
          python -m unittest discover -s tests -p test_deathroad_original_sprites.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("artifacts/original-characters")
          m=json.loads((p/"manifest.json").read_text())
          assert m["original_character_count"]==30
          assert all(x["reference_stat_conditioned"] for x in m["sprites"])
          assert Image.open(p/"contact-30-original.png").size == (1332,1555)
          print("PASS: actual 30 original playable-sized true pixel PNG assets")
          PY
      - name: Upload actual original PNGs individually and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: original-native-pixel-32x48-thirty-characters
          path: artifacts/original-characters/
          retention-days: 30
