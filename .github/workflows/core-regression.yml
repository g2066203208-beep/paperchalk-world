name: Core Runtime Regression

on:
  push:
    branches:
      - main
      - fix/core-runtime-20260924
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/web-smoke.js"
      - "tests/core-regression.mjs"
      - ".github/workflows/core-regression.yml"
      - "assets/**"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Run static smoke test
        run: node tests/web-smoke.js

      - name: Enforce runtime performance budgets
        run: node tests/performance-budget.mjs

      - name: Install browser driver and CJK fonts
        run: |
          npm install --no-save playwright-core
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium found"
            exit 1
          fi
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
          "$CHROME_PATH" --version

      - name: Start local game server
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/paperchalk-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/paperchalk-http.log
          exit 1

      - name: Run real browser regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/core-regression.mjs
