name: Visual Demo Main Regression

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "visual-demo.html"
      - "legacy-main.html"
      - "assets/**"
      - "vendor/three/**"
      - "tests/demo-main-*.mjs"
      - "package.json"
      - ".github/workflows/core-regression.yml"
  pull_request:
    paths:
      - "index.html"
      - "visual-demo.html"
      - "assets/**"
      - "vendor/three/**"
      - "tests/demo-main-*.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Verify root exactly matches visual demo
        run: npm test
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
          "$CHROME_PATH" --version
      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/paperchalk-http.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/paperchalk-http.log
          exit 1
      - name: Run new main browser regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run test:browser
      - name: Upload new main screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: new-main-visual-demo
          path: artifacts/new-main-visual-demo.png
          if-no-files-found: ignore
