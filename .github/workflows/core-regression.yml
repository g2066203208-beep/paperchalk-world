name: Core Paper Stage Runtime Regression

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/**"
      - "package.json"
      - "vendor/three/**"
      - "vendor/fastnoise-lite/**"
      - ".github/workflows/core-regression.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/**"
      - "package.json"
      - "vendor/three/**"
      - "vendor/fastnoise-lite/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Run paper-stage static architecture checks
        run: npm test
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
          "$CHROME_PATH" --version
      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/paperchalk-http.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/paperchalk-http.log
          exit 1
      - name: Run real browser paper-stage gameplay regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/core-regression.mjs
      - name: Run standalone prologue city regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/prologue-smoke.mjs
      - name: Upload prologue scene framebuffers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prologue-city-r1
          path: artifacts/prologue-*.png
          if-no-files-found: warn
