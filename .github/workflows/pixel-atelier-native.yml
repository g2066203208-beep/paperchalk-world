name: Pixel Atelier - Android native offline APK
on:
  push:
    branches:
      - 'feature/pixel-atelier-native-p0'
    paths:
      - 'pixel-atelier/**'
      - '.github/workflows/pixel-atelier-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pixel-atelier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify and use hosted Android SDK
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_HOME/cmdline-tools"
          if [ ! -f "$SDK_HOME/platforms/android-35/android.jar" ] || [ ! -x "$SDK_HOME/build-tools/35.0.0/aapt" ]; then
            SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK_HOME/platforms/android-35/android.jar"
          test -x "$SDK_HOME/build-tools/35.0.0/aapt"
      - name: JVM pixel-engine tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build genuine native debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and absence of INTERNET permission
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" apk-badging.txt; then
            echo "OFFLINE CONTRACT VIOLATION: INTERNET permission found" >&2
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-atelier-native-p0-debug-apk
          path: |
            pixel-atelier/app/build/outputs/apk/debug/app-debug.apk
            pixel-atelier/apk-sha256.txt
            pixel-atelier/apk-badging.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-atelier-p0-test-report
          path: pixel-atelier/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
