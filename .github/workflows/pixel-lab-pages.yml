name: PixelLab - isolated art QA and Pages deployment
on:
  push:
    branches: [main]
    paths:
      - 'site/pixel-lab/**'
      - 'tests/pixel-lab-structure.test.mjs'
      - '.github/workflows/pixel-lab-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated pixel art tests without unrelated game sensor regression
        run: |
          node --test tests/pixel-lab-structure.test.mjs
          node --test tests/hostess-redraw-native.test.mjs
          node --test tests/character-browser.mjs
      - name: Refuse to label failed model samples as approved character art
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/pixel-lab/fullbody-generated")
          if (p/"report.json").exists():
            result=json.loads((p/"report.json").read_text())
            review=json.loads((p/"visual-review.json").read_text())
            assert result["approved_for_game"]==0
            assert review["status"]=="rejected" and review["approved"]==0
            assert review["can_publish_as_new_character"] is False
            assert "visual-review.json" in (p/"../fullbody-learning.html").read_text()
          print("PixelLab failure states and model integrity pass")
          PY
  deploy:
    needs: verify_art
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
