name: Forest Level 01 Modular Engine QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/forest-level-01.html'
      - 'site/card-battle/engine/level-engine.js'
      - 'site/card-battle/engine/combat-choreography.js'
      - 'site/card-battle/engine/combat-turn-controller.js'
      - 'site/card-battle/engine/combat-feedback.js'
      - 'site/card-battle/engine/card-stat-badges.js'
      - 'site/card-battle/engine/battle-camera.js'
      - 'site/card-battle/engine/scene-card-hud.js'
      - 'site/card-battle/engine/flip-case-controller.js'
      - 'site/card-battle/engine/voxel-animations.js'
      - 'site/card-battle/engine/object-animations.js'
      - 'site/card-battle/engine/scene-transitions.js'
      - 'site/card-battle/engine/voxel-terrain.js'
      - 'site/card-battle/engine/forest-environment.js'
      - 'site/card-battle/engine/visual-look.js'
      - 'site/card-battle/engine/physical-board-frame.js'
      - 'site/card-battle/engine/spatial-shadows.js'
      - 'site/card-battle/engine/visual-shaders.js'
      - 'site/card-battle/engine/cloud-shadows.js'
      - 'site/card-battle/engine/forest-dressing.js'
      - 'site/card-battle/engine/stylized-materials.js'
      - 'site/card-battle/engine/profession-decks.js'
      - 'site/card-battle/engine/card-registry.js'
      - 'site/card-battle/engine/card-effect-engine.js'
      - 'site/card-battle/engine/object-anchor.js'
      - 'site/card-battle/data/card-packs.js'
      - 'site/card-battle/engine/scene-lifecycle.js'
      - 'site/card-battle/engine/farmer-facilities.js'
      - 'site/card-battle/engine/bandit-roster.js'
      - 'site/card-battle/ui/forest-hand.css'
      - 'site/card-battle/ui/forest-hand.js'
      - 'site/card-battle/ui/farmer-roster.js'
      - 'site/card-battle/engine/character-registry.js'
      - 'site/card-battle/data/characters.generated.js'
      - 'site/assets/characters/farmer-faction/**'
      - 'site/card-battle/levels/forest-01.js'
      - 'site/card-battle/levels/forest-02.js'
      - 'tests/forest-level-core.test.cjs'
      - 'tests/combat-choreography.test.cjs'
      - 'tests/combat-turn-controller.test.cjs'
      - 'tests/card-stat-badges.test.cjs'
      - 'tests/profession-decks.test.cjs'
      - 'tests/farmer-facilities.test.cjs'
      - 'tests/card-registry.test.cjs'
      - 'tests/card-effect-engine.test.cjs'
      - 'tests/scene-lifecycle.test.cjs'
      - 'tests/object-animations.test.cjs'
      - 'tests/scene-transitions.test.cjs'
      - 'tests/character-registry.test.cjs'
      - 'tests/forest-level-01-browser.mjs'
      - 'tests/battle-camera-controls.test.cjs'
      - 'tests/flip-case-controller.test.cjs'
      - '.github/workflows/forest-level-01-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-level:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated level and voxel animation engines
        run: |
          node tests/forest-level-core.test.cjs
          node --check site/card-battle/levels/forest-02.js
          node tests/combat-choreography.test.cjs
          node tests/combat-turn-controller.test.cjs
          node tests/card-stat-badges.test.cjs
          node --check site/card-battle/engine/card-stat-badges.js
          node --check site/card-battle/engine/combat-turn-controller.js
          node --check site/card-battle/engine/combat-choreography.js
          node --check site/card-battle/engine/combat-feedback.js
          node tests/battle-camera-controls.test.cjs
          node --check site/card-battle/engine/scene-card-hud.js
          node --check site/card-battle/engine/combat-feedback.js
          node --check site/card-battle/engine/battle-camera.js
          node --check site/card-battle/engine/physical-board-frame.js
          node --check site/card-battle/engine/spatial-shadows.js
          node --check site/card-battle/engine/visual-shaders.js
          node --check site/card-battle/engine/cloud-shadows.js
          node --check site/card-battle/engine/forest-dressing.js
          node --check site/card-battle/engine/stylized-materials.js
          node --check site/card-battle/engine/visual-look.js
          node --check site/card-battle/ui/forest-hand.js
          node tests/object-animations.test.cjs
          node tests/scene-transitions.test.cjs
          node tests/profession-decks.test.cjs
          node tests/farmer-facilities.test.cjs
          node tests/card-registry.test.cjs
          node tests/card-effect-engine.test.cjs
          node --check site/card-battle/engine/card-effect-engine.js
          node --check site/card-battle/engine/object-anchor.js
          node tests/scene-lifecycle.test.cjs
          node --check site/card-battle/engine/scene-lifecycle.js
          node --check site/card-battle/engine/card-registry.js
          node --check site/card-battle/data/card-packs.js
          node --check site/card-battle/engine/farmer-facilities.js
          node --check site/card-battle/engine/bandit-roster.js
          node tests/character-registry.test.cjs
      - name: Install Chromium + Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve deployed folder locally
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/forest-level-http.log 2>&1 &
          sleep 2
      - name: Verify real 3D battlefield border, seven-slot drawer, forest, mobile
        run: node tests/forest-level-01-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-level-01-qa-screenshots
          path: artifacts/forest-level-01/
          if-no-files-found: warn
