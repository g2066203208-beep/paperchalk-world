name: Temporary NPC source transfer diagnostic
on:
  push:
    paths:
      - .github/workflows/npc-media-transfer-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-media:
    runs-on: ubuntu-latest
    steps:
      - name: Probe original URL versus 1024px transformation
        env:
          THUMB: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F0f958b43-4208-47ce-8ed6-f63184a82d34/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHHlo7a5yuOWHEmxTdG1UUHibEopsq8Seq6J997yjXf2&exp=1794139872&osig=AAAAAAAAAAAAAAAAAAAAAJ2VgYQ0Achs4tzyDL6EI-1GoriXfNuqtkjmX-nf6y4T&signer=media-rpc&token=AAIAAU0AJDBmOTU4YjQzLTQyMDgtNDdjZS04ZWQ2LWY2MzE4NGE4MmQzNAAAAAABobsR2wA7ADlsmNPTWh55axSkIHL0MU18FR-3paOiVJz0m-5MUQ&x-canva-quality=thumbnail'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "Thumbnail request:"
          curl -L -sS --max-time 30 -w 'HTTP %{http_code}\n' -o t200.png "$THUMB" || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('t200.png')
          d=p.read_bytes() if p.exists() else b''
          print('thumbnail bytes',len(d),'is_png',d.startswith(b'\x89PNG\r\n\x1a\n'))
          if len(d)>24 and d.startswith(b'\x89PNG'):
           print('thumbnail IHDR',int.from_bytes(d[16:20],'big'),int.from_bytes(d[20:24],'big'))
          PY
          FULL="${THUMB//height:200/height:1024}"
          FULL="${FULL//width:200/width:1024}"
          printf '%s\n' "1024 request:"
          curl -L -sS --max-time 30 -w 'HTTP %{http_code}\n' -o t1024.png "$FULL" || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('t1024.png'); d=p.read_bytes() if p.exists() else b''
          print('1024 bytes',len(d),'is_png',d.startswith(b'\x89PNG\r\n\x1a\n'))
          if len(d)>24 and d.startswith(b'\x89PNG'):
           print('1024 IHDR',int.from_bytes(d[16:20],'big'),int.from_bytes(d[20:24],'big'))
          PY
