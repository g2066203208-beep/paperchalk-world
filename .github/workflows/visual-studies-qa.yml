name: Three Independent Scene Visual Studies - Real Browser Screenshot Video QA
on:
  push:
    branches: [main]
    paths:
      - 'site/visual-studies/**'
      - 'tests/visual-studies-browser.mjs'
      - '.github/workflows/visual-studies-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-visual-studies:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stage source and tests
        run: |
          node --check site/visual-studies/scene-studies.js
          node --check tests/visual-studies-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host GitHub game sources
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/visual-stage-server.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile actual stage, animation, lighting and depth
        run: node tests/visual-studies-browser.mjs
      - name: Store actual Chromium screenshots and WebM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-studies-3-modes-desktop-mobile-screens-and-video
          path: artifacts/visual-studies-20261117/
          if-no-files-found: warn
          retention-days: 14
