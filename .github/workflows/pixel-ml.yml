name: Pixel Art ML - train, inspect, preview
on:
  push:
    branches:
      - lab/pixel-art-ml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pixel-art-ml/requirements.txt
      - name: Install CPU Torch and support libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'pytest>=8,<10'
      - name: Unit tests
        working-directory: pixel-art-ml
        run: python -m pytest -q
      - name: Bootstrap owned synthetic data
        working-directory: pixel-art-ml
        run: python -m pixel_ml.data --out .pixel-data/bootstrap --count 160 --seed 1729
      - name: Train VAE (short reproducible CI experiment)
        working-directory: pixel-art-ml
        run: python -m pixel_ml.train --manifest .pixel-data/bootstrap/manifest.csv --out .pixel-runs/ci --epochs 24 --batch-size 32 --seed 1729
      - name: Learned latent recombinations
        working-directory: pixel-art-ml
        run: python -m pixel_ml.sample --checkpoint .pixel-runs/ci/best.pt --manifest .pixel-data/bootstrap/manifest.csv --out .pixel-runs/samples --count 12
      - name: Pixel constraints audit
        working-directory: pixel-art-ml
        run: python -m pixel_ml.quality --dir .pixel-runs/samples --report .pixel-runs/quality.json --max-colors 10
      - name: Assert training outputs exist
        working-directory: pixel-art-ml
        run: |
          test -s .pixel-runs/ci/best.pt
          test -s .pixel-runs/ci/metrics.json
          test -s .pixel-runs/samples/contact_sheet_3x.png
          test -s .pixel-runs/quality.json
      - name: Save real trained checkpoint, examples and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-ml-training-preview
          path: pixel-art-ml/.pixel-runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
