name: PixelLab - new character true-pixel + neural repair
on:
  push:
    branches: [main]
    paths:
      - 'ml/style2/assets/shower_new_reference_384x512.lzma.b64'
      - 'ml/style2/new_reference.py'
      - 'ml/style2/new_reference_train.py'
      - 'ml/style2/verify_new_reference.py'
      - 'site/pixel-lab/new-reference.html'
      - '.github/workflows/new-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pixel-new-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual CPU PyTorch image training dependencies
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Reconstruct uploaded image in exact 384x512 D pixel lattice
        run: python -m ml.style2.new_reference
      - name: Train masked native-pixel repair model on 2 gold poses plus candidate
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m ml.style2.new_reference_train --steps 160
      - name: Verify exact native palette, image SHA, ML weights and held-out region
        run: python -m ml.style2.verify_new_reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-uploaded-384-native-pixel-and-ml-repair
          path: site/pixel-lab/style2/new-reference/
          retention-days: 30
          if-no-files-found: warn
      - name: Rebuild Pages after verified training
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
