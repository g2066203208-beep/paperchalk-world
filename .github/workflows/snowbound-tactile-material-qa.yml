name: Snowbound Tactile Materials - Focused Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/motion/snowbound-tactile.js'
      - 'site/card-battle/motion/snowbound-motion.css'
      - 'tests/snowbound-tactile-browser.mjs'
      - '.github/workflows/snowbound-tactile-material-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tactile:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live material animation syntax
        run: |
          node --check site/card-battle/motion/snowbound-tactile.js
          node --check tests/snowbound-tactile-browser.mjs
      - name: Install Chromium for real scene test
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host original game scene
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/snowbound-test-http.log 2>&1 &
          sleep 2
      - name: Verify actual desktop hover and touch material, release and reduced motion
        run: node tests/snowbound-tactile-browser.mjs
      - name: Preserve real gameplay-material screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactile-material-actual-browser-proof
          path: artifacts/snowbound-tactile-proof/
          if-no-files-found: warn
          retention-days: 14
