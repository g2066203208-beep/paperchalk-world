name: PixelLab - actual CC0 motion prior training
on:
  push:
    branches: [main]
    paths:
      - 'ml/style2/motion_prior_cc0.py'
      - 'ml/style2/verify_motion_prior_cc0.py'
      - '.github/workflows/motion-prior.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cc0-pixel-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural learning stack
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download 3 licensed CC0 animated character sheets
        run: |
          set -euo pipefail
          mkdir -p ml/datasets/cc0-motions
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 'https://opengameart.org/sites/default/files/sheet-pixelchar-01.png' -o ml/datasets/cc0-motions/onur.png
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 'https://opengameart.org/sites/default/files/sheet-pixelchar03-james.png' -o ml/datasets/cc0-motions/james.png
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 'https://opengameart.org/sites/default/files/sheet-pixelchar-02.png' -o ml/datasets/cc0-motions/frank.png
          file ml/datasets/cc0-motions/*.png
      - name: Train real action-conditioned neural decoder from multiple animated people
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.motion_prior_cc0 --steps 500
      - name: Verify generated action diversity, real trained weights and model limitations
        run: python -m ml.style2.verify_motion_prior_cc0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trained-multi-person-cc0-motion-prior
          path: site/pixel-lab/style2/motion-prior/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish motion prior diagnostics
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
