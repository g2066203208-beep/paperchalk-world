# Fresh deployment run after GitHub re-run generated duplicate 'github-pages'
# artifacts under one run ID; never re-run failed deploy in the SAME run.
name: Publish tested 3D L2D ring arena
on:
  push:
    branches: [main]
    paths:
      - 'site/game/ring-arena-runtime.js'
      - 'site/assets/characters/female-07/**'
      - 'site/index.html'
      - 'site/convenience-store/**'
      - 'tests/convenience-store-browser.mjs'
      - 'site/character-editor/**'
      - 'site/assets/l2d/inbox/**'
      - 'site/assets/l2d/library/**'
      - 'scripts/build_l2d_library.py'
      - 'scripts/bind_female06_pants.py'
      - 'scripts/build_character_catalog.py'
      - 'tests/test_female06_base_immutable.py'
      - 'tests/test_female06_pants_skin.cjs'
      - 'tests/test_l2d_person_tree_model.cjs'
      - 'site/game/ring-arena-director.js'
      - 'site/game/ring-arena-director.css'
      - 'site/assets/characters/hero-axe-attack.webp'
      - 'site/assets/characters/enemy-suit-hit.webp'
      - 'site/assets/characters/enemy-suit-hit-no-hud.webp'
      - 'tests/ring-arena-director.test.cjs'
      - 'site/assets/characters/protagonist-back-combat-3q-final.webp'
      - 'site/assets/characters/protagonist-back-combat-eye-level-preview.webp'
      - 'tests/ring-arena.test.cjs'
      - 'tests/ring-arena-formation.test.cjs'
      - '.github/workflows/ring-arena-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
# The oldest general-purpose release may be stuck on unrelated fog/studio UI
# checks. A newly validated release must supersede older deployments, not
# publish an outdated Pages snapshot after the latest 3D scene.
concurrency:
  group: paperchalk-world-ring-fast-release
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://g2066203208-beep.github.io/paperchalk-world/
    steps:
      - name: Cancel obsolete general Pages builds so an older revision cannot overwrite this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/character-editor-pages.yml/runs?status=in_progress&per_page=50" --jq '.workflow_runs[] | select(.head_sha != env.GITHUB_SHA) | .id' | while read -r id; do
            [ -n "$id" ] || continue
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
          done
      - uses: actions/checkout@v4
      - name: Build the exact real game and authored Live2D assets
        run: |
          bash scripts/fetch-game-fonts.sh
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/repair_character_masks.py
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/fix_protagonist_neck_v4.py
          python3 scripts/build_char002_psd_rig.py
          python3 scripts/build_scene_catalog.py
          python3 scripts/build_character_catalog.py
          test -s site/index.html
          test -s site/characters.catalog.json
          test -s site/game/ring-arena-runtime.js
          test -s site/game/ring-arena-director.js
          test -s site/game/ring-arena-director.css
          test -s site/assets/characters/female-07/back.webp
          test -s site/assets/characters/hero-axe-attack.webp
          test -s site/assets/characters/enemy-suit-hit.webp
          test -s site/assets/characters/enemy-suit-hit-no-hud.webp
          test -s site/assets/characters/protagonist-back-combat-3q-final.webp
          test -s site/assets/characters/protagonist-back-combat-eye-level-preview.webp
          test -s site/assets/l2d/v4/back.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate release on fixed actors, authored L2D and real 3D camera
        run: |
          node site/convenience-store/store-core.test.cjs
          test -s site/convenience-store/assets/convenience-story.webp
          test -s site/convenience-store/parts/counter-top.svg
          test -s site/convenience-store/index.html
          node tests/ring-arena.test.cjs
          node tests/ring-arena-formation.test.cjs
          node tests/ring-arena-director.test.cjs
          node tests/scene-camera.test.cjs
          node tests/test_l2d_display_lifecycle.cjs
          node tests/test_l2d_studio_game_sync.cjs
          python3 tests/test_female06_base_immutable.py
          node tests/test_female06_pants_skin.cjs
          node tests/test_l2d_person_tree_model.cjs
          python3 - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          p=Path('site/assets/characters/female-07/back.webp')
          with Image.open(p) as im:
              assert im.size==(800,1436), im.size
              assert im.mode=='RGBA', im.mode
              assert im.getextrema()[-1][0]==0,'white source paper was not removed'
          catalog=json.loads(Path('site/characters.catalog.json').read_text())['characters']
          girl=next(row for row in catalog if row['id']=='female-07')
          assert girl['label']=='女七' and girl['back']=='./assets/characters/female-07/back.webp'
          assert not girl.get('front'), 'no unprovided front art is fabricated'
          print('PASS female07 original back axe portrait, alpha, catalog, role-ready')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('site/characters.catalog.json').read_text())['characters']
          selected=[x for x in rows if x['id'].startswith('female-06')]
          assert [x['id'] for x in selected]==['female-06'],selected
          six=selected[0]
          assert six['l2dModule']['front']['rig']['partCount']==17
          assert six['variantCategory']=='default'
          assert six['front'].startswith('./assets/l2d/library/female-06/')
          print('PASS deployed only female-six THIRD costume as one canonical 17-part L2D')
          PY
          node - <<'JS'
          const fs=require('fs');
          for(const path of [
            'site/game/ring-arena-runtime.js',
            'site/l2d/runtime.js',
            'site/dev/character-bridge.js'
          ])new Function(fs.readFileSync(path,'utf8'));
          const html=fs.readFileSync('site/index.html','utf8');
          if(!html.includes('ring-arena-runtime.js?v=female07-alpha-ground-sole-v32-20261106'))
            throw Error('Deployed HTML still points at stale ring-arena WebGL source');
          if(!html.includes("ringScene.setActive(name==='ring-arena')"))
            throw Error('3D ring scene was not integrated into the game');
          console.log('PASS: single left eye-level camera; 3/4 back pose; four animated enemy L2D; clean mobile projection');
          JS
      # Real Chromium screenshot proof of heroine + 4 enemies runs separately in
      # ring-arena-proof.yml. Do not block a ring-only deploy behind the
      # unrelated full fog/editor browser suite.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
