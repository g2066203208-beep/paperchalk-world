name: UI fog - fast real browser regression
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/game/survival-state.js'
      - 'site/game/ground-perspective.js'
      - 'site/game/l2d-ground-binding.js'
      - 'site/game/phone-ui.js'
      - 'site/game/frame-budget.js'
      - 'site/game/scene-preloader.js'
      - 'site/game/story-content.js'
      - 'site/game/dialogue-layout.css'
      - 'tests/game-runtime-modules.test.cjs'
      - 'tests/game-render-budget-browser.mjs'
      - 'site/game/phone-ui.css'
      - 'site/assets/phones/**'
      - 'tests/survival-state.test.cjs'
      - 'tests/ui-edge-fog-browser.mjs'
      - 'tests/phone-ui-browser.mjs'
      - 'tests/ground-perspective.test.mjs'
      - 'tests/ground-perspective-browser.mjs'
      - 'tests/character-camera-browser.mjs'
      - 'tests/character-fog-layer-browser.mjs'
      - '.github/workflows/ui-fog-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build scene catalog for actual game browser runtime
        # UI regression is independent of the separately verified L2D packaging.
        # A missing CHAR-002 PSD must never prevent testing the phone/fog HUD.
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/build_scene_catalog.py
      - name: Install Chromium and Playwright
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify deterministic gameplay status mathematics and persistence
        run: node tests/survival-state.test.cjs
      - name: Verify modular runtime cadence and bounded scene decoding
        run: node tests/game-runtime-modules.test.cjs
      - name: Verify full-rate world fog with independently budgeted UI fog
        run: node tests/game-render-budget-browser.mjs
      - name: Verify shared-ground projection physics
        run: node tests/ground-perspective.test.mjs
      - name: Test shared-ground calibration in actual game on desktop/mobile
        run: node tests/ground-perspective-browser.mjs
      - name: Verify true L2D stature + shoe-ground perspective on desktop/mobile
        run: node tests/character-camera-browser.mjs
      - name: Validate real L2D foreground occludes black fog and enemy stays behind
        run: node tests/character-fog-layer-browser.mjs
      - name: Test approved cat-ear phone asset and interactivity on desktop/mobile
        run: node tests/phone-ui-browser.mjs
      - name: Test black fog silhouettes and UI lifecycle on desktop/mobile
        run: node tests/ui-edge-fog-browser.mjs
      - name: Upload actual browser fog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-fog-browser-screenshots
          path: artifacts/classroom/ui-fog-*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the real approved phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-browser-screenshots
          path: artifacts/phone/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload character floor calibration browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-perspective-browser-screenshots
          path: artifacts/ground/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload corrected two-character camera comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-ground-perspective-camera
          path: artifacts/perspective/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload real scene foreground/fog compositor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-fog-foreground-vs-enemy
          path: artifacts/fog-layer/*.png
          retention-days: 7
          if-no-files-found: warn
