name: Demo Lab Regression

on:
  push:
    branches: [demo-lab]
    paths:
      - "demo-lab/**"
      - "tests/demo-lab-*.mjs"
      - ".github/workflows/demo-lab.yml"
      - "vendor/three/**"
      - "assets/player/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Verify isolated experiment baseline
        run: node --test tests/demo-lab-isolation.test.mjs
      - name: Confirm production channel is outside this workflow
        run: |
          test "$GITHUB_REF" = "refs/heads/demo-lab"
          echo "Demo Lab validated. Production mobile channel is untouched."

  request-pages-publish:
    needs: isolated-lab
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the main-only Pages publisher to refresh Demo Lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/demo-lab-pages.yml/dispatches" \
            -f ref=main
          echo "Requested isolated Demo Lab website publication from main."
