name: Seven-seat character battle - real browser QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/character-card-machine.html'
      - 'site/card-battle/character-card-machine-legacy.html'
      - 'site/card-battle/seven-seat-battle.html'
      - 'site/card-battle/seven-seat-battle.mjs'
      - 'site/card-battle/engine/seven-seat-duel.mjs'
      - 'site/card-battle/motion/seven-seat-card-physics.mjs'
      - 'site/card-battle/motion/seven-seat-card-kinetics.mjs'
      - 'site/card-battle/styles/seven-seat-blackjack-table.css'
      - 'site/card-battle/motion/character-card-sequence.mjs'
      - 'site/card-battle/motion/coin-payout-lighting.mjs'
      - 'site/card-battle/motion/card-image-relief.mjs'
      - 'site/card-battle/motion/card-physical-edge.mjs'
      - 'site/card-battle/motion/card-portrait-matte.mjs'
      - 'site/data/art/seven-card-groups.v1.json'
      - 'site/assets/characters/**'
      - 'site/card-battle/index.html'
      - 'site/index.html'
      - 'tests/seven-seat-duel.test.mjs'
      - 'tests/seven-seat-battle-browser.mjs'
      - 'tests/seven-seat-card-kinetics.test.mjs'
      - '.github/workflows/seven-seat-battle-qa.yml'
  workflow_dispatch:
concurrency:
  group: real-seven-seat-owner-stacks-pbr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test-real-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source, seven-seat logic, character matte and state transitions
        run: |
          node --check site/card-battle/engine/seven-seat-duel.mjs
          node --check site/card-battle/seven-seat-battle.mjs
          node --check site/card-battle/motion/seven-seat-card-physics.mjs
          node --check site/card-battle/motion/seven-seat-card-kinetics.mjs
          node --check site/card-battle/motion/card-portrait-matte.mjs
          node --check tests/seven-seat-duel.test.mjs
          node --check tests/seven-seat-battle-browser.mjs
          node --check tests/card-portrait-matte.test.mjs
          node tests/seven-seat-duel.test.mjs
          node tests/seven-seat-card-kinetics.test.mjs
          node tests/card-portrait-matte.test.mjs
          node -e "const fs=require('node:fs');const main=fs.readFileSync('site/card-battle/character-card-machine.html','utf8');const ref=fs.readFileSync('site/card-battle/character-card-machine-legacy.html','utf8');if(!main.includes('seven-seat-battle.mjs')||!ref.includes('character-card-machine.mjs'))process.exit(1);console.log('PASS new hosted route + archived original slot machine')"
      - name: Use preinstalled GitHub Chrome with lightweight Playwright recorder
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            npx playwright install ffmpeg
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            npx playwright install ffmpeg
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_BROWSER_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            npx playwright install ffmpeg
          else
            npx playwright install --with-deps chromium
          fi
      - name: Launch actual hosted static game tree
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/seven-seat-battle.log 2>&1 &
          sleep 2
      - name: Real browser user interactions and screenshots - desktop, portrait, landscape
        run: node tests/seven-seat-battle-browser.mjs
      - name: Commit verified whitebox screenshots to game repository
        if: success() && github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p site/card-battle/qa/seven-seat
          cp artifacts/seven-seat-battle/desktop-00-first-game-seven-vs-seven.png site/card-battle/qa/seven-seat/desktop-00-table.png
          cp artifacts/seven-seat-battle/desktop-01-real-ringmaster-deployed.png site/card-battle/qa/seven-seat/desktop-01-deployed.png
          cp artifacts/seven-seat-battle/desktop-02-first-attack-on-enemy.png site/card-battle/qa/seven-seat/desktop-02-attack.png
          cp artifacts/seven-seat-battle/desktop-08-amber-edge-hit-flare.png site/card-battle/qa/seven-seat/desktop-08-blackjacket-amber-impact.png
          cp artifacts/seven-seat-battle/phone-portrait-08-amber-edge-hit-flare.png site/card-battle/qa/seven-seat/phone-portrait-08-blackjacket-amber-impact.png
          cp artifacts/seven-seat-battle/desktop-03-support-ally-card.png site/card-battle/qa/seven-seat/desktop-03-ally-shield.png
          cp artifacts/seven-seat-battle/desktop-05-two-owners-two-independent-decks.png site/card-battle/qa/seven-seat/desktop-05-owner-stacks.png
          cp artifacts/seven-seat-battle/desktop-06-real-physical-ten-sided-gold-reward.png site/card-battle/qa/seven-seat/desktop-06-original-slot-coins.png
          cp artifacts/seven-seat-battle/desktop-07-physical-owner-hand-unfold.png site/card-battle/qa/seven-seat/desktop-07-character-hand-expanded.png
          cp artifacts/seven-seat-battle/phone-portrait-07-physical-owner-hand-unfold.png site/card-battle/qa/seven-seat/phone-portrait-07-character-hand-expanded.png
          cp artifacts/seven-seat-battle/phone-portrait-06-real-physical-ten-sided-gold-reward.png site/card-battle/qa/seven-seat/phone-portrait-06-original-slot-coins.png
          cp artifacts/seven-seat-battle/phone-portrait-00-first-game-seven-vs-seven.png site/card-battle/qa/seven-seat/phone-portrait-00-table.png
          cp artifacts/seven-seat-battle/phone-portrait-05-two-owners-two-independent-decks.png site/card-battle/qa/seven-seat/phone-portrait-05-decks.png
          cp artifacts/seven-seat-battle/phone-landscape-00-first-game-seven-vs-seven.png site/card-battle/qa/seven-seat/phone-landscape-00-table.png
          cp artifacts/seven-seat-battle/results.json site/card-battle/qa/seven-seat/results.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/card-battle/qa/seven-seat
          if ! git diff --cached --quiet; then
            git commit -m 'qa: archive real desktop/phone seven-seat game screenshots'
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo 'Could not safely archive screenshots' >&2
            exit 1
          fi
      - name: Upload complete real game screenshots and screen recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-seat-card-battle-real-desktop-phone-qa
          path: artifacts/seven-seat-battle/
          if-no-files-found: warn
          retention-days: 14
