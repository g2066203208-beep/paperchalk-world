name: Game DEV → all-character L2D studio E2E
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/dev/**'
      - 'site/l2d/**'
      - 'site/assets/l2d/**'
      - 'scripts/build_v4_assets.py'
      - 'site/character-editor/**'
      - '.github/workflows/game-character-dev-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - run: python3 scripts/build_v4_assets.py && python3 scripts/build_scene_catalog.py && python3 scripts/build_character_catalog.py
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Create small two-frame V4-format animation fixture
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import io, zipfile
          frames=[]
          for dx in (0,24):
              img=Image.new('RGBA',(335,1013),(0,0,0,0))
              ImageDraw.Draw(img).ellipse((90+dx,200,240+dx,560),fill=(250,120,140,230))
              frames.append(img)
          with zipfile.ZipFile('/tmp/paperchalk-v4-smoke.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for face in ('front','back'):
                  data=io.BytesIO()
                  frames[0].save(data,'WEBP',save_all=True,append_images=[frames[1]],duration=250,loop=0,quality=70)
                  archive.writestr(face+'.webp',data.getvalue())
          PY
      - name: Verify navigation, all imported actors, motion editor and game return
        run: |
          mkdir -p artifacts/l2d-studio
          python3 -m http.server 8129 --directory site >/tmp/l2d-studio-http.log 2>&1 &
          node - <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          for(const file of ['site/l2d/rig.js','site/l2d/runtime.js','site/dev/character-bridge.js','site/character-editor/l2d-mode.js','site/character-editor/studio.js']){
            new Function(fs.readFileSync(file,'utf8'));
          }
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try{
              for(const phone of [false,true]){
                const page=await b.newPage({viewport:phone?{width:390,height:844}:{width:1280,height:800},isMobile:phone,hasTouch:phone});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8129/?dev=1',{waitUntil:'load'});
                await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready && window.PaperchalkL2D?.get('player')?.rig?.source?.width===1024,{timeout:20000});
                assert.equal(await page.locator('[data-l2d-canvas]').count(),2);
                const motion=await page.evaluate(()=>{
                  const actor=window.PaperchalkL2D.get('player'),rig=actor.rig;
                  return {mode:actor.root.dataset.l2dMode,
                    hairA:rig.motionAt(480,296,.4),hairB:rig.motionAt(480,296,1.8),
                    skirtA:rig.motionAt(466,601,.4),skirtB:rig.motionAt(466,601,1.8),
                    shoeA:rig.motionAt(462,965,.4),shoeB:rig.motionAt(462,965,1.8)};
                });
                await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.root?.dataset.l2dEdition==='V4-official',{timeout:20000});
                await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.root?.dataset.l2dMode==='v4-decoder',{timeout:15000});
                const clipState=await page.evaluate(()=>{
                  const a=window.PaperchalkL2D.get('player');
                  return {type:a.clip?.type,count:a.clip?.count,w:a.clip?.w,h:a.clip?.h,mode:a.root.dataset.l2dMode};
                });
                assert.deepEqual(clipState,{type:'decoder',count:128,w:335,h:1013,mode:'v4-decoder'});
                // The DEV query starts on the menu, which intentionally
                // hides gameplay actors; expose only the test actor while
                // sampling renderer frames. Scene visibility is tested by
                // the independent classroom gameplay smoke suite.
                await page.evaluate(()=>{document.querySelector('#camera-player-root').hidden=false;});
                await page.waitForTimeout(550);

                // The actual visible V4 <img> is the runtime output, not the
                // hidden legacy rig.source; read animated frames from that
                // visible image to confirm the browser decoder advances.
                await page.waitForFunction(()=>Number(document.querySelector('#camera-player-root')?.dataset.l2dFrame)>=0,{timeout:16000});
                const inspect=()=>page.evaluate(()=>{
                  const a=window.PaperchalkL2D.get('player'),
                    pix=a.canvas.getContext('2d',{willReadFrequently:true}).getImageData(352,70,332,860).data;
                  let hash=2166136261;
                  for(let k=0;k<pix.length;k+=8){
                    hash=Math.imul(hash^pix[k],16777619)>>>0;
                    hash=Math.imul(hash^pix[k+3],16777619)>>>0;
                  }
                  return {hash,frame:a.root.dataset.l2dFrame,canvasHidden:getComputedStyle(a.canvas).visibility};
                });
                const firstFrame=await inspect();
                await page.waitForTimeout(750);
                const secondFrame=await inspect();
                assert.equal(secondFrame.canvasHidden,'visible','approved V4 must render into visible actor canvas');
                assert.notEqual(firstFrame.frame,secondFrame.frame,'V4 playback timeline must advance');
                assert.notEqual(firstFrame.hash,secondFrame.hash,'official V4 must change actual rendered Canvas pixels');

                assert.ok(Math.abs(motion.hairA.x-motion.hairB.x)>1,'hair tip must physically sway');
                assert.ok(Math.abs(motion.skirtA.x-motion.skirtB.x)>1,'skirt hem must physically sway');
                assert.ok(Math.abs(motion.shoeA.x-motion.shoeB.x)<.9,'feet must remain anchored');
                await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
                await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.root?.dataset.l2dEdition==='V4-official' && window.PaperchalkL2D.get('player')?.rig?.blinkEnabled===true,{timeout:15000});
                const blink=await page.evaluate(()=>{
                  const rig=window.PaperchalkL2D.get('player').rig;
                  return {closed:rig.blinkAmount(2.21),open:rig.blinkAmount(3.0)};
                });
                assert.ok(blink.closed>.95&&blink.open<.01,'front-facing actor must blink');

                assert.equal(await page.locator('#dev-character-overlay').count(),0,'legacy iframe overlay must be removed');
                await page.selectOption('#dev-layer','player');
                await page.locator('#dev-character-open').click({force:true});
                await page.waitForURL('**/character-editor/**',{timeout:15000});
                assert.equal(await page.locator('#studio-character').count(),1);
                await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist',{timeout:18000});
                assert.equal(await page.locator('#l2d-live-canvas').count(),1);
                await page.waitForFunction(()=>window.PaperchalkStudio?.edition==='V4-official'&&window.PaperchalkStudio?.useV4?.(),{timeout:18000});

                assert.equal(await page.locator('#studio-character option').count(),3,'whole GitHub character library including concept profiles');
                assert.equal(await page.locator('#studio-v4-wrap').isVisible(),true);
                assert.equal(await page.locator('#dev-l2d-preview-controls').isVisible(),false,'old generic breathing preview hidden for V4');
                assert.equal(await page.locator('#studio-frame').getAttribute('max'),'127');
                await page.locator('#studio-edit-scope').selectOption('frame');
                await page.locator('#studio-frame').fill('12');
                await page.waitForFunction(()=>window.PaperchalkStudio?.frame===12,{timeout:18000});
                await page.locator('#studio-edit-scope').selectOption('all');
                // Verify character-specific layer stacks, not a heroine-only static canvas.
                const initialLayers=await page.locator('#layers .layer').count();
                await page.locator('#add').click({force:true});
                assert.equal(await page.locator('#layers .layer').count(),initialLayers+1);
                await page.locator('#studio-save').click({force:true});
                await page.waitForFunction(()=>document.querySelector('#studio-status')?.textContent?.includes('已保存'),{timeout:18000});
                const tiny=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+v0kQAAAAASUVORK5CYII=','base64');
                await page.locator('#studio-import').setInputFiles({name:'sample-npc-front.png',mimeType:'image/png',buffer:tiny});
                await page.waitForFunction(()=>window.PaperchalkStudio?.list.size===4 && window.PaperchalkStudio.current!=='protagonist',{timeout:18000});
                assert.equal(await page.locator('#studio-character option').count(),4);
                await page.waitForFunction(()=>document.querySelectorAll('#layers .layer').length===1,{timeout:18000});
                await page.locator('#studio-character').selectOption('protagonist');
                await page.locator('#studio-side').selectOption('back');
                await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist' && document.querySelector('#studio-side')?.value==='back' && document.querySelectorAll('#layers .layer').length>=3,{timeout:18000});
                await page.locator('#studio-v4zip').setInputFiles('/tmp/paperchalk-v4-smoke.zip');
                await page.waitForFunction(()=>document.querySelector('#studio-status')?.textContent?.includes('V4 动态方向已导入'),{timeout:16000});
                assert.equal(await page.locator('#studio-v4-wrap').isVisible(),true,'V4 frames must preview in the L2D studio');
                await page.screenshot({path:'artifacts/l2d-studio/'+(phone?'mobile':'desktop')+'.png',fullPage:true});
                await page.locator('#studio-back').click({force:true});
                await page.waitForURL('**/?dev=1',{timeout:18000});
                await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,{timeout:18000});
                await page.waitForFunction(()=>window.PaperchalkL2D?.get('player')?.clip?.type==='decoder',{timeout:16000});
                const count=await page.locator('#dev-character-library option').count();
                assert.equal(count,4,'Game DEV must see all GitHub profiles and locally imported characters');
                assert.deepEqual(errors,[],'No browser errors');
                await page.close();
              }
            } finally{await b.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-character-l2d-studio-screenshots
          path: artifacts/l2d-studio
          retention-days: 7
