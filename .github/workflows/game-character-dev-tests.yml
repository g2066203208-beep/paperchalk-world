name: Game DEV → L2D game/editor face and idle E2E
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/dev/**'
      - 'site/l2d/**'
      - 'site/assets/l2d/**'
      - 'site/character-editor/**'
      - 'scripts/build_v4_assets.py'
      - 'scripts/build_protagonist_part_rig.py'
      - 'scripts/build_char002_v4.py'
      - 'scripts/build_character_catalog.py'
      - '.github/workflows/game-character-dev-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - run: |
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/build_char002_v4.py
          python3 scripts/build_scene_catalog.py
          python3 scripts/build_character_catalog.py
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real original heroine face, blink, editor and V4 backup on phone/desktop
        run: |
          mkdir -p artifacts/l2d-studio
          python3 -m http.server 8129 --directory site >/tmp/l2d-studio-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          const fs=require('node:fs');
          for(const file of ['site/l2d/part-rig.js','site/l2d/library-player.js',
              'site/l2d/runtime.js','site/dev/character-bridge.js',
              'site/character-editor/studio.js','site/character-editor/part-rig-studio.js'])
            new Function(fs.readFileSync(file,'utf8'));
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
          try{
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const phone=viewport.width<500,name=phone?'phone':'desktop';
              const page=await browser.newPage({viewport,hasTouch:phone,isMobile:phone,acceptDownloads:true});
              const errors=[];page.on('pageerror',err=>errors.push(err.message));
              await page.goto('http://127.0.0.1:8129/?dev=1',{waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,null,{timeout:30000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
              await page.waitForFunction(()=>window.PaperchalkL2DLibrary?.get('player')?.layers.length===17,
                null,{timeout:28000});
              const first=await page.evaluate(()=>{
                const a=window.PaperchalkL2DLibrary.get('player');
                const core=window.PaperchalkPartRigCore;
                return {id:window.PaperchalkCharacterDev.assigned.player.id,
                  mode:a.actor.root.dataset.l2dMode,layerCount:a.layers.length,
                  face:a.model.parts.face?.id,brows:a.model.parts.brows?.id,
                  nose:a.model.parts.nose?.id,iris:a.model.parts.irises?.id,
                  lashes:a.model.parts.lashes?.id,
                  blinkOpen:core.blinkAmount(0),
                  blinkClosed:core.blinkAmount(.9*2*Math.PI/3.6),
                  hasBreath:!!window.PaperchalkLocalBreath};
              });
              assert.equal(first.id,'protagonist');
              assert.equal(first.mode,'library-part-mesh');
              assert.equal(first.layerCount,17);
              for(const key of ['face','brows','nose','iris','lashes'])assert.ok(first[key],key+' missing');
              assert.equal(first.hasBreath,false,'obsolete breathing script cannot run');
              assert.ok(first.blinkOpen<.001&&first.blinkClosed>.99,'blinking must actually close');
              await page.screenshot({path:'artifacts/l2d-studio/'+name+'-game-protagonist.png'});
              // Shared URL must open the REAL editor panel, not an old breath overlay.
              await page.goto('http://127.0.0.1:8129/character-editor/?character=protagonist&side=front&idle=1',
                {waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist'&&
                window.PaperchalkPartRigStudio?.state.active===true,null,{timeout:35000});
              assert.equal(await page.locator('#dev-l2d-preview-controls').count(),0);
              assert.equal(await page.locator('#l2d-strength').count(),0);
              assert.ok(await page.locator('[data-idle="hair.amount"]').isVisible());
              assert.ok(await page.locator('[data-idle="cloth.amount"]').isVisible());
              assert.equal(await page.locator('#rig-part option').count(),17);
              // The inspector must be docked outside the moving canvas.
              const docked=await page.evaluate(()=>{
                const inspector=document.getElementById('part-rig-panel');
                return inspector?.parentElement?.classList.contains('right')&&
                  document.body.classList.contains('rig-authoring')&&
                  !document.getElementById('rig-advanced').open;
              });
              assert.ok(docked,'authoring controls must not cover the character');
              await page.screenshot({path:'artifacts/l2d-studio/'+name+'-actual-hair-skirt-controls.png'});
              // Simulate a one-pixel original PART edit, not a flat screen overlay.
              await page.evaluate(()=>{
                const p=window.characterEditor.S.layers.front.find(p=>p.partId==='rear_hair');
                if(!p?.sourcePart)throw Error('missing editable real hair part');
                const ctx=p.canvas.getContext('2d');ctx.fillStyle='#ff31b0';
                ctx.fillRect(20,140,3,3);
                window.characterEditor.render();
              });
              await page.locator('[data-idle-preset="realistic"]').click();
              await page.locator('[data-idle="hair.amount"]').evaluate(el=>{el.value='24';el.dispatchEvent(new Event('input',{bubbles:true}));});
              await page.locator('#btnSave').click(); // Primary Save must flush bone drafts
              await page.waitForFunction(async()=>{
                const saved=await window.PaperchalkStudio.readPartRig('protagonist','front');
                return saved?.idleProfile?.hair?.amount===.24;
              },null,{timeout:15000});
              await page.goto('http://127.0.0.1:8129/?dev=1',{waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,null,{timeout:30000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
              await page.waitForFunction(()=>
                window.PaperchalkL2DLibrary?.get('player')?.model.idleProfile?.hair.amount===.24,
                null,{timeout:28000}).catch(async error=>{
                  console.error('GAME RIG SAVE DIAGNOSTICS',await page.evaluate(async()=>{
                    const project=await new Promise(resolve=>{
                      const req=indexedDB.open('paperchalk-dev-characters-v1',1);
                      req.onsuccess=()=>{
                        const db=req.result,tr=db.transaction('kv','readonly'),
                          get=tr.objectStore('kv').get('part-rig:protagonist:front');
                        get.onsuccess=()=>resolve(get.result);get.onerror=()=>resolve(null);
                      };req.onerror=()=>resolve(null);
                    });
                    const a=window.PaperchalkL2DLibrary?.get('player');
                    return {savedHair:project?.idleProfile?.hair?.amount,
                      modelHair:a?.model?.idleProfile?.hair?.amount,
                      mode:window.PaperchalkCharacterDev?.heroineRenderer,
                      actorMode:window.PaperchalkL2D.get('player')?.root.dataset.l2dMode,
                      note:document.getElementById('dev-character-status')?.textContent,
                      partIds:Object.keys(project?.parts||{}).length,
                      loaded:a?.layers?.length};
                  }));
                  throw error;
                });
              // Original-part edits must replace the actual moving hair texture,
              // not an untracked stationary screen-space correction.
              const localPart=await page.evaluate(()=>{
                const a=window.PaperchalkL2DLibrary.get('player');
                const p=a.layers.find(x=>x.partId==='rear_hair');
                const temp=document.createElement('canvas');temp.width=p.canvas.width;temp.height=p.canvas.height;
                const g=temp.getContext('2d');g.drawImage(p.canvas,0,0);
                return {personalised:a.personalised,rgba:[...g.getImageData(20,140,1,1).data]};
              });
              assert.ok(localPart.personalised,'game did not load editor artwork into ArtMesh');
              assert.deepEqual(localPart.rgba,[255,49,176,255],
                'painted source pixel must travel with its own moving hair mesh');
              // The old 128-frame V4 is a backup, never a permanent replacement.
              await page.evaluate(()=>window.PaperchalkCharacterDev.setHeroineRenderer('v4'));
              await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.clip?.count===128,
                null,{timeout:22000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.setHeroineRenderer('bones'));
              await page.waitForFunction(()=>window.PaperchalkL2DLibrary?.get('player')?.layers?.length===17,
                null,{timeout:25000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('enemy','char-002','front'));
              await page.waitForFunction(()=>window.PaperchalkL2D.get('enemy')?.clip?.count===128,
                null,{timeout:22000});
              assert.deepEqual(errors,[],name+' console errors');
              console.log('PASS original heroine 17 PNG face + eyelid blink, no old breath, sliders save-game, protected V4 and second heroine',name);
              await page.close();
            }
          }finally{await browser.close();}
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2d-original-heroine-face-idle-desktop-mobile
          path: artifacts/l2d-studio
          retention-days: 7
