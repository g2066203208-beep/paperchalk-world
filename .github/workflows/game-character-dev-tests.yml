name: Game DEV → L2D game/editor face and idle E2E
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/dev/**'
      - 'site/l2d/**'
      - 'site/assets/l2d/**'
      - 'site/character-editor/**'
      - 'scripts/build_v4_assets.py'
      - 'scripts/build_protagonist_part_rig.py'
      - 'scripts/build_char002_v4.py'
      - 'scripts/build_char002_part_rig.py'
      - 'scripts/build_character_catalog.py'
      - '.github/workflows/game-character-dev-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - run: |
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/build_char002_v4.py
          python3 scripts/build_char002_part_rig.py
          python3 scripts/build_scene_catalog.py
          python3 scripts/build_character_catalog.py
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real original heroine face, blink, editor and V4 backup on phone/desktop
        run: |
          mkdir -p artifacts/l2d-studio
          python3 -m http.server 8129 --directory site >/tmp/l2d-studio-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          const fs=require('node:fs');
          for(const file of ['site/l2d/part-rig.js','site/l2d/library-player.js',
              'site/l2d/runtime.js','site/dev/character-bridge.js',
              'site/character-editor/studio.js','site/character-editor/part-rig-studio.js'])
            new Function(fs.readFileSync(file,'utf8'));
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
          try{
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const phone=viewport.width<500,name=phone?'phone':'desktop';
              const page=await browser.newPage({viewport,hasTouch:phone,isMobile:phone,acceptDownloads:true});
              const errors=[];page.on('pageerror',err=>errors.push(err.message));
              await page.goto('http://127.0.0.1:8129/?dev=1',{waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,null,{timeout:30000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
              await page.waitForFunction(()=>window.PaperchalkL2DLibrary?.get('player')?.layers.length===17,
                null,{timeout:28000});
              const first=await page.evaluate(()=>{
                const a=window.PaperchalkL2DLibrary.get('player');
                const core=window.PaperchalkPartRigCore;
                return {id:window.PaperchalkCharacterDev.assigned.player.id,
                  mode:a.actor.root.dataset.l2dMode,layerCount:a.layers.length,
                  face:a.model.parts.face?.id,brows:a.model.parts.brows?.id,
                  nose:a.model.parts.nose?.id,iris:a.model.parts.irises?.id,
                  lashes:a.model.parts.lashes?.id,
                  blinkOpen:core.blinkAmount(0),
                  blinkClosed:core.blinkAmount(.9*2*Math.PI/3.6),
                  hasBreath:!!window.PaperchalkLocalBreath};
              });
              assert.equal(first.id,'protagonist');
              assert.equal(first.mode,'library-part-mesh');
              assert.equal(first.layerCount,17);
              for(const key of ['face','brows','nose','iris','lashes'])assert.ok(first[key],key+' missing');
              // Verify the ACTUAL published 17-layer heroine, not a fake mannequin.
              const anatomy=await page.evaluate(()=>{
                const a=window.PaperchalkL2DLibrary.get('player');
                const model=a.model,p=model.parts,rig=model.bodyHierarchy,
                  core=window.PaperchalkPartRigCore;
                const missing=!rig;
                if(missing)return {bound:false,
                  positions:Object.fromEntries(['shoes','legs','skirt','jacket','neck','face']
                    .map(id=>[id,{x:p[id]?.x,y:p[id]?.y,h:p[id]?.h}]))};
                const idle=core.sanitizeIdleProfile({...model.idleProfile,
                  joints:{hands:0,shoulders:6,hips:6}});
                const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
                const wp=(part,u,v,t)=>core.warpPoint(p[part],u,v,t,null,idle);
                let anchored=0;
                for(const leg of [rig.left,rig.right]){
                  const u=(leg.ankle.x-p.legs.x)/p.legs.w,
                    v=(leg.ankle.y-p.legs.y)/p.legs.h;
                  for(const t of [.3,1.2,3.2,4.9])
                    anchored=Math.max(anchored,d(wp('legs',u,v,t),leg.ankle));
                }
                const neckJoint=rig.neck,shoulderJoint=rig.shoulder,
                  par=(id,q)=>core.parentPoint(p[id],q,1.4,idle);
                return {bound:true,anchored,
                  shoeMotion:d(wp('shoes',.5,.8,.4),wp('shoes',.5,.8,3.6)),
                  faceMotion:d(wp('face',.5,.5,.4),wp('face',.5,.5,3.6)),
                  neckMotion:d(wp('neck',.5,.5,.4),wp('neck',.5,.5,3.6)),
                  headCoupling:Math.max(...['neck','face','brows','nose','irises',
                     'front_hair','rear_hair'].map(id=>d(par(id,neckJoint),par('face',neckJoint)))),
                  shoulderCoupling:d(par('jacket',shoulderJoint),
                     par('sleeves_and_hands',shoulderJoint)),
                  lowerNeckCoupling:d(par('neck',{x:rig.neck.x,y:rig.neckBottom}),
                     par('sleeves_and_hands',{x:rig.neck.x,y:rig.neckBottom})),
                  waistCoupling:d(par('jacket',rig.pelvis),par('skirt',rig.pelvis)),
                  rig};
              });
              console.log('REAL GAME GROUNDED L2D HIERARCHY',name,JSON.stringify(anatomy));
              assert.ok(anatomy.bound,'real heroine must have a hierarchy derived from her source-part coordinates');
              assert.ok(anatomy.anchored<.00001&&anatomy.shoeMotion<.00001,
                'shoe layer and both ankles must stay planted during hip motion');
              assert.ok(anatomy.headCoupling<.00001&&anatomy.shoulderCoupling<.00001&&
                anatomy.lowerNeckCoupling<.00001&&anatomy.waistCoupling<.00001,
                'ankle, pelvis, shoulders and neck/head parent chain must be seam-free');
              assert.ok(anatomy.faceMotion>1&&anatomy.neckMotion>1,
                'shoulder movement must actually carry the visible head and neck');
              assert.equal(first.hasBreath,false,'obsolete breathing script cannot run');
              assert.ok(first.blinkOpen<.001&&first.blinkClosed>.99,'blinking must actually close');
              await page.screenshot({path:'artifacts/l2d-studio/'+name+'-game-protagonist.png'});
              // Shared URL must open the REAL editor panel, not an old breath overlay.
              await page.goto('http://127.0.0.1:8129/character-editor/?character=protagonist&side=front&idle=1',
                {waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkStudio?.current==='protagonist'&&
                window.PaperchalkPartRigStudio?.state.active===true,null,{timeout:35000});
              assert.equal(await page.locator('#dev-l2d-preview-controls').count(),0);
              assert.equal(await page.locator('#l2d-strength').count(),0);
              assert.equal(await page.locator('#part-rig-panel').isVisible(),false,
                'new mesh plays without a permanently open settings panel');
              assert.ok(await page.locator('[data-quick="fringe"]').isVisible());
              assert.ok(await page.locator('[data-quick="rear"]').isVisible());
              assert.ok(await page.locator('[data-quick="skirt"]').isVisible());
              for(const field of ['hands','shoulders','hips','breath','speed'])
                assert.ok(await page.locator('[data-quick="'+field+'"]').isVisible());
              await page.locator('#idle-open').click();
              assert.equal(await page.locator('#rig-part option').count(),17);
              // The inspector must be docked outside the moving canvas.
              const docked=await page.evaluate(()=>{
                const inspector=document.getElementById('part-rig-panel');
                return inspector?.parentElement?.classList.contains('right')&&
                  document.body.classList.contains('rig-authoring')&&
                  !document.getElementById('rig-advanced').open;
              });
              assert.ok(docked,'authoring controls must not cover the character');
              await page.screenshot({path:'artifacts/l2d-studio/'+name+'-actual-hair-skirt-controls.png'});
              // Simulate a one-pixel original PART edit, not a flat screen overlay.
              await page.evaluate(()=>{
                const p=window.characterEditor.S.layers.front.find(p=>p.partId==='rear_hair');
                if(!p?.sourcePart)throw Error('missing editable real hair part');
                const ctx=p.canvas.getContext('2d');ctx.fillStyle='#ff31b0';
                ctx.fillRect(20,140,3,3);
                window.characterEditor.render();
              });
              await page.locator('[data-quick="fringe"]').fill('1100');
              await page.locator('[data-quick="rear"]').fill('900');
              await page.locator('[data-quick="skirt"]').fill('1400');
              await page.locator('[data-quick="hands"]').fill('235');
              await page.locator('[data-quick="shoulders"]').fill('180');
              await page.locator('[data-quick="hips"]').fill('275');
              await page.locator('[data-quick="breath"]').fill('185');
              await page.locator('[data-quick="speed"]').fill('195');
              await page.locator('#rig-quick-save').click(); // One click saves ArtMesh PNGs + game rig
              await page.waitForFunction(()=>{
                const b=document.querySelector('#rig-quick-save'),
                  s=document.querySelector('#rig-quick-status');
                return b&&!b.disabled&&s?.textContent?.includes('已保存');
              },null,{timeout:30000});
              // Verify that the ORIGINAL source bitmap is durable before navigation.
              const artPersisted=await page.evaluate(async()=>{
                const db=await new Promise((resolve,reject)=>{
                  const r=indexedDB.open('pixelatelier-character-v1',1);
                  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
                });
                try{
                  const record=await new Promise((resolve,reject)=>{
                    const tr=db.transaction('art','readonly'),
                      q=tr.objectStore('art').get('character:protagonist');
                    q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
                  });
                  const src=record?.front?.find(x=>x.partId==='rear_hair');
                  if(!src?.img)return {found:false};
                  const img=new Image();img.src=src.img;await img.decode();
                  const cvs=document.createElement('canvas');cvs.width=img.width;cvs.height=img.height;
                  const g=cvs.getContext('2d');g.drawImage(img,0,0);
                  return {found:true,pixel:[...g.getImageData(20,140,1,1).data]};
                }finally{db.close();}
              });
              assert.equal(artPersisted.found,true,'source texture saved before rig');
              assert.deepEqual(artPersisted.pixel,[255,49,176,255],
                'one-click Save must persist original hair pixel before game navigation');
              await page.waitForFunction(async()=>{
                const saved=await window.PaperchalkStudio.readPartRig('protagonist','front');
                return saved?.idleProfile?.parts.front_hair===11&&
                  saved?.idleProfile?.parts.rear_hair===9&&
                  saved?.idleProfile?.parts.skirt===14&&saved?.idleProfile?.hair.speed===1.95&&
                  saved?.idleProfile?.joints?.hands===2.35&&
                  saved?.idleProfile?.joints?.shoulders===1.8&&
                  saved?.idleProfile?.joints?.hips===2.75&&
                  saved?.idleProfile?.breath?.amount===1.85&&
                  saved?.idleProfile?.breath?.speed===1.95;
              },null,{timeout:15000});
              await page.goto('http://127.0.0.1:8129/?dev=1',{waitUntil:'load'});
              await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,null,{timeout:30000});
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
              await page.waitForFunction(()=>
                window.PaperchalkL2DLibrary?.get('player')?.model.idleProfile?.parts.front_hair===11&&
                window.PaperchalkL2DLibrary?.get('player')?.model.idleProfile?.joints?.hips===2.75&&
                window.PaperchalkL2DLibrary?.get('player')?.model.idleProfile?.breath?.amount===1.85,
                null,{timeout:28000}).catch(async error=>{
                  console.error('GAME RIG SAVE DIAGNOSTICS',await page.evaluate(async()=>{
                    const project=await new Promise(resolve=>{
                      const req=indexedDB.open('paperchalk-dev-characters-v1',1);
                      req.onsuccess=()=>{
                        const db=req.result,tr=db.transaction('kv','readonly'),
                          get=tr.objectStore('kv').get('part-rig:protagonist:front');
                        get.onsuccess=()=>resolve(get.result);get.onerror=()=>resolve(null);
                      };req.onerror=()=>resolve(null);
                    });
                    const a=window.PaperchalkL2DLibrary?.get('player');
                    return {savedHair:project?.idleProfile?.parts?.front_hair,
                      modelHair:a?.model?.idleProfile?.parts?.front_hair,
                      mode:window.PaperchalkCharacterDev?.heroineRenderer,
                      actorMode:window.PaperchalkL2D.get('player')?.root.dataset.l2dMode,
                      note:document.getElementById('dev-character-status')?.textContent,
                      partIds:Object.keys(project?.parts||{}).length,
                      loaded:a?.layers?.length};
                  }));
                  throw error;
                });
              // Original-part edits must replace the actual moving hair texture,
              // not an untracked stationary screen-space correction.
              const localPart=await page.evaluate(()=>{
                const a=window.PaperchalkL2DLibrary.get('player');
                const p=a.layers.find(x=>x.partId==='rear_hair');
                const temp=document.createElement('canvas');temp.width=p.canvas.width;temp.height=p.canvas.height;
                const g=temp.getContext('2d');g.drawImage(p.canvas,0,0);
                return {personalised:a.personalised,rgba:[...g.getImageData(20,140,1,1).data]};
              });
              assert.ok(localPart.personalised,'game did not load editor artwork into ArtMesh');
              assert.deepEqual(localPart.rgba,[255,49,176,255],
                'painted source pixel must travel with its own moving hair mesh');
              // No user-facing V4 mode switching: source clip is a safe backup.
              const approved=await page.evaluate(()=>{
                const entries=new Map(window.PaperchalkCharacterDev.characters.map(c=>[c.id,c]));
                return {main:entries.get('protagonist')?.clips?.front?.frames,
                  secondary:entries.get('char-002')?.clips?.front?.frames,
                  secondaryMode:entries.get('char-002')?.l2dModule?.front?.renderer,
                  duplicate:entries.has('char-002-rig-v1')};
              });
              assert.deepEqual(approved,{
                main:128,secondary:128,secondaryMode:'part-mesh',duplicate:false
              },'keep original fallback clips and single canonical female-two identity');
              await page.evaluate(()=>window.PaperchalkCharacterDev.assign('enemy','char-002','front'));
              await page.waitForFunction(()=>
                window.PaperchalkL2DLibrary?.get('enemy')?.layers?.length===7,
                null,{timeout:25000});
              const secondary=await page.evaluate(()=>{
                const actor=window.PaperchalkL2DLibrary.get('enemy');
                return {id:actor.model.characterId,
                  provenance:actor.model.provenance,
                  names:Object.keys(actor.model.parts),
                  feetFixed:actor.model.parts.shoes?.parentId==='ground'};
              });
              assert.deepEqual(secondary,{
                id:'char-002-rig-v1',provenance:'derived-region',
                names:['shoes','legs','skirt','wave_hand','free_hand','head_hair','jacket'],
                feetFixed:true
              },'female two must use independent region rig without faking eye or hair layers');
              assert.deepEqual(errors,[],name+' console errors');
              console.log('PASS 17 real heroine parts + one-click saved art; female two 7 real source regions, protected source V4s',name);
              await page.close();
            }
          }finally{await browser.close();}
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2d-original-heroine-face-idle-desktop-mobile
          path: artifacts/l2d-studio
          retention-days: 7
