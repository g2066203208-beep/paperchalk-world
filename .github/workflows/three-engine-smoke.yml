name: Three.js 3D Engine Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/renderers/three-world-renderer.mjs"
      - "styles/**"
      - "vendor/three/**"
      - "tests/three-engine-smoke.mjs"
      - ".github/workflows/three-engine-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/renderers/three-world-renderer.mjs"
      - "styles/**"
      - "vendor/three/**"
      - "tests/three-engine-smoke.mjs"
      - ".github/workflows/three-engine-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Validate Three.js engine and pinned vendor pair
        run: |
          node --check src/renderers/three-world-renderer.mjs
          test -s vendor/three/three.module.js
          test -s vendor/three/three.core.js
          test -s vendor/three/LICENSE
          grep -q "from './three.core.js'" vendor/three/three.module.js

      - name: Install browser driver
        run: npm install --no-save playwright-core

      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium found"
            exit 1
          fi
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
          "$CHROME_PATH" --version

      - name: Start local game server
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/paperchalk-three-http.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/paperchalk-three-http.log
          exit 1

      - name: Run real 3D WebGL regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/three-engine-smoke.mjs
