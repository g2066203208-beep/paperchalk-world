name: Three.js Paper Stage Engine Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/game.js"
      - "src/engine3d/**"
      - "src/renderers/three-world-renderer.mjs"
      - "src/content/**"
      - "src/terrain/**"
      - "src/entities/**"
      - "styles/**"
      - "vendor/three/**"
      - "vendor/fastnoise-lite/**"
      - "tests/three-engine-smoke.mjs"
      - ".github/workflows/three-engine-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/game.js"
      - "src/engine3d/**"
      - "src/renderers/three-world-renderer.mjs"
      - "src/content/**"
      - "src/terrain/**"
      - "src/entities/**"
      - "styles/**"
      - "vendor/three/**"
      - "vendor/fastnoise-lite/**"
      - "tests/three-engine-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Validate production Three.js files
        run: |
          node --check src/game.js
          node --check src/engine3d/World3DEngine.js
          node --check src/engine3d/PaperTerrainRenderer.js
          node --check src/renderers/three-world-renderer.mjs
          node --check src/terrain/terrain-runtime.js
          node --check src/terrain/voxel-block-mesh.js
          node --check src/entities/PaperSpriteEntity.js
          node --check vendor/fastnoise-lite/FastNoiseLite.js
          test -s vendor/three/three.module.js
          test -s vendor/three/three.core.js
          grep -q "from './three.core.js'" vendor/three/three.module.js
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
      - name: Start local server
        run: |
          python3 -m http.server 8080 > /tmp/paperchalk-three-http.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/paperchalk-three-http.log
          exit 1
      - name: Run production WebGL regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/three-engine-smoke.mjs
      - name: Upload Paper Terrain A/B framebuffer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-terrain-phase1-ab
          path: artifacts/
          if-no-files-found: warn
