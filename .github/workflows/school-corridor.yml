name: School Corridor - real 2.5D WebGL proof
on:
  push:
    paths:
      - 'site/game/school-corridor-2p5d.js'
      - 'site/game/school-corridor-2p5d.css'
      - 'site/assets/school-room/corridor-end-door-blockout.svg'
      - 'site/index.html'
      - 'site/scene-modules.js'
      - 'tests/school-corridor-preview.mjs'
      - '.github/workflows/school-corridor.yml'
  workflow_dispatch:
jobs:
  corridor-actual-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Build scene catalog and serve game
        run: |
          python3 scripts/build_scene_catalog.py
          python3 -m http.server 8765 --directory site >/tmp/corridor-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/corridor-server.log
          exit 1
      - name: Render six real WebGL proof frames
        run: node tests/school-corridor-preview.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-corridor-real-webgl
          path: artifacts/school-corridor/*.png
          if-no-files-found: warn
          retention-days: 14