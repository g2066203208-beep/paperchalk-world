name: WORLD Studio - latest Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-studio-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Preserve signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kiosk-debug-signing-v1
      - run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: world-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Replace public latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk world-studio-latest-debug.apk
          if ! gh release view studio-latest-debug >/dev/null 2>&1; then
            gh release create studio-latest-debug --target "$GITHUB_SHA" --title "WORLD Studio - latest Android debug" --prerelease --notes "Loads the latest GitHub Pages studio. Manual APK installation is required."
          fi
          gh release upload studio-latest-debug world-studio-latest-debug.apk --clobber
          gh release edit studio-latest-debug --notes "Source revision: $GITHUB_SHA. Web code updates automatically; APK updates require manual installation."
