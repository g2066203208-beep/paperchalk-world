name: Build Android Test APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: untitled-kiosk-latest-android
  cancel-in-progress: true

jobs:
  apk:
    name: Android installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preserve test APK signing identity across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kiosk-debug-signing-v1
      - name: Build installable test APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-game-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish automatic latest debug APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk untitled-kiosk-latest-debug.apk
          if ! gh release view kiosk-latest-debug >/dev/null 2>&1; then
            gh release create kiosk-latest-debug --target "$GITHUB_SHA" \
              --title "Untitled kiosk — latest Android test build" --prerelease \
              --notes "Automatically built WebView test shell. This is not a native game engine or a signed production release."
          fi
          gh release upload kiosk-latest-debug untitled-kiosk-latest-debug.apk --clobber
          echo "Latest debug APK: https://github.com/${{ github.repository }}/releases/download/kiosk-latest-debug/untitled-kiosk-latest-debug.apk"
      - name: Prepare optional stable release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LAMPKEEP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > android/lampkeep.keystore
            echo "LAMPKEEP_KEYSTORE_PATH=../lampkeep.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          fi
      - name: Build signed release preserving Android update identity
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          LAMPKEEP_KEYSTORE_PASSWORD: ${{ secrets.LAMPKEEP_KEYSTORE_PASSWORD }}
          LAMPKEEP_KEY_ALIAS: ${{ secrets.LAMPKEEP_KEY_ALIAS }}
          LAMPKEEP_KEY_PASSWORD: ${{ secrets.LAMPKEEP_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Upload signed release when available
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-game-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
