name: Publish game + all-character L2D DEV (fast Pages deploy)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site/index.html'
      - 'site/l2d/**'
      - 'site/assets/l2d/**'
      - 'scripts/build_v4_assets.py'
      - 'scripts/build_protagonist_part_rig.py'
      - 'scripts/fix_protagonist_neck_v4.py'
      - 'scripts/build_char002_v4.py'
      - 'scripts/build_char002_part_rig.py'
      - 'scripts/build_char016_psd_rig.py'
      - 'site/dev/**'
      - 'site/characters.catalog.json'
      - 'site/assets/characters/**'
      - 'site/l2d/part-rig.js'
      - 'site/assets/l2d/source-masks/**'
      - 'scripts/build_character_catalog.py'
      - '.github/workflows/character-editor-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paperchalk-world-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: https://g2066203208-beep.github.io/paperchalk-world/
    steps:
      - uses: actions/checkout@v4
      - name: Preserve game assets and prepare existing site
        run: |
          bash scripts/fetch-game-fonts.sh
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/repair_character_masks.py
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 scripts/fix_protagonist_neck_v4.py
          python3 scripts/build_char002_v4.py
          python3 scripts/build_char002_part_rig.py
          python3 scripts/build_char016_psd_rig.py
          python3 scripts/build_scene_catalog.py
          python3 scripts/build_character_catalog.py
          test -s site/index.html
          test -s site/character-editor/index.html
          test -s site/assets/characters/protagonist-front.webp
          test -s site/assets/characters/protagonist-back.webp
          test -s site/assets/l2d/v4/front.webp
          test -s site/assets/l2d/v4/back.webp
          python3 - <<'PY'
          from PIL import Image
          with Image.open('site/assets/l2d/v4/front.webp') as im:
              assert im.size==(335,1013) and im.n_frames==128
          print('PASS protagonist revised neck animation: 128 frames')
          PY
          test -s site/assets/l2d/char-002/front.webp
          test -s site/assets/l2d/char-002/front-source-regions.zip
          python3 - <<'PY'
          from PIL import Image
          from zipfile import ZipFile
          from json import loads
          from pathlib import Path
          movie=Path('site/assets/l2d/char-002/front.webp')
          with Image.open(movie) as im:
              assert im.size==(335,1024) and im.n_frames==128
          with ZipFile('site/assets/l2d/char-002/front-source-regions.zip') as z:
              manifest=loads(z.read('layers.json'))
              assert len(manifest['layers']['front'])==7
              assert not manifest['layers']['back']
          catalog=loads(Path('site/characters.catalog.json').read_text())
          char=next(c for c in catalog['characters'] if c['id']=='char-002')
          assert char['front'].endswith('/char-002/front.png')
          assert char['clips']['front']['frames']==128 and not char.get('back')
          print('PASS: CHAR-002 animation, region layers and single-view safety')
          PY
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('site/character-editor/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1];
          new Function(s);
          for(const file of ['site/l2d/rig.js','site/l2d/runtime.js','site/dev/character-bridge.js','site/character-editor/part-rig-studio.js','site/l2d/part-rig.js','site/character-editor/studio.js'])
            new Function(fs.readFileSync(file,'utf8'));
          const editor=fs.readFileSync('site/character-editor/studio.js','utf8');
          if(!editor.includes('importComponentFiles')||!editor.includes('shouldDrawLayer'))
            throw Error('Universal source-component editor missing');
          if(fs.readFileSync('site/character-editor/index.html','utf8').includes('neck-collar.js'))
            throw Error('Obsolete neck/collar injection still loaded');
          const game=fs.readFileSync('site/index.html','utf8');
          if(!game.includes('data-l2d-actor="player"')||!game.includes('data-l2d-actor="enemy"'))throw Error('universal L2D actor bindings missing');
          if(game.includes('id="menu-character-breath"'))throw Error('legacy heroine-only link must be absent');
          console.log('PASS: game + L2D DEV scripts parse; all actor canvases and site assets retained');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
