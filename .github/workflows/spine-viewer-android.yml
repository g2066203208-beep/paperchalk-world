name: Build Spine Android Viewer

on:
  push:
    branches: [ spine-android-apk ]
    paths:
      - 'tools/spine-android-viewer/**'
      - '.github/workflows/spine-viewer-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/spine-android-viewer/**'
      - '.github/workflows/spine-viewer-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Spine ${{ matrix.spine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spine: ['4.2.12', '4.3.5']
    defaults:
      run:
        working-directory: tools/spine-android-viewer
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build integrated Stretchy Studio
        working-directory: .
        run: |
          rm -rf /tmp/stretchystudio
          git clone https://github.com/MangoLion/stretchystudio.git /tmp/stretchystudio
          cd /tmp/stretchystudio
          git checkout 24a83a27ba43e43e9d2e3de5e33994594e6199c2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.js')
          s = p.read_text()
          s = s.replace("export default defineConfig({", "export default defineConfig({\n  base: './',", 1)
          p.write_text(s)

          for path, line in [
              ('src/store/projectStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_PROJECT_STORE__ = useProjectStore;\n"),
              ('src/store/animationStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_ANIMATION_STORE__ = useAnimationStore;\n"),
              ('src/store/parameterStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_PARAMETER_STORE__ = useParameterStore;\n"),
          ]:
              q = Path(path)
              q.write_text(q.read_text() + line)
          PY
          npm ci
          npm run build
          TARGET="$GITHUB_WORKSPACE/tools/spine-android-viewer/app/src/main/assets/studio"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -R dist/. "$TARGET/"
          cp LICENSE "$TARGET/LICENSE.StretchyStudio.txt"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PspineVersion=${{ matrix.spine }} --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/PaperChalk-SpineViewer-${{ matrix.spine }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperChalk-SpineViewer-${{ matrix.spine }}
          path: tools/spine-android-viewer/artifacts/PaperChalk-SpineViewer-${{ matrix.spine }}.apk
          if-no-files-found: error
          retention-days: 30
