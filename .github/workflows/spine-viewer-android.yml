name: Build Spine Android Viewer

on:
  push:
    branches: [ spine-android-apk ]
    paths:
      - 'tools/spine-android-viewer/**'
      - '.github/workflows/spine-viewer-android.yml'
      - 'src/animation/paperchalk-motion.js'
      - 'index.html'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/spine-android-viewer/**'
      - '.github/workflows/spine-viewer-android.yml'
      - 'src/animation/paperchalk-motion.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PaperChalk Studio APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/spine-android-viewer
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build fully offline integrated Stretchy Studio
        working-directory: .
        run: |
          rm -rf /tmp/stretchystudio
          git clone https://github.com/MangoLion/stretchystudio.git /tmp/stretchystudio
          cd /tmp/stretchystudio
          git checkout 24a83a27ba43e43e9d2e3de5e33994594e6199c2

          npm ci
          npm install --no-save @mediapipe/tasks-vision@0.10.35

          mkdir -p public/ort public/mediapipe public/models

          # Bundle ONNX Runtime WASM locally for DWPose. No CDN at app runtime.
          cp node_modules/onnxruntime-web/dist/*.wasm public/ort/ || true
          cp node_modules/onnxruntime-web/dist/*.mjs public/ort/ || true

          # Bundle MediaPipe Tasks Vision WASM locally for camera pose tracking.
          cp -R node_modules/@mediapipe/tasks-vision/wasm/. public/mediapipe/

          # Bundle the two runtime models. Download occurs only during CI build;
          # the installed APK never needs network access.
          curl -L --fail --retry 3 \
            -o public/models/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          curl -L --fail --retry 3 \
            -o public/models/dw-ll_ucoco_384.onnx \
            https://huggingface.co/yzd-v/DWPose/resolve/main/dw-ll_ucoco_384.onnx

          python3 - <<'PY'
          from pathlib import Path

          p = Path('vite.config.js')
          s = p.read_text()
          s = s.replace("export default defineConfig({", "export default defineConfig({\n  base: './',", 1)
          p.write_text(s)

          # Expose stores and MediaPipe constructors to the Android bridge.
          main = Path('src/main.jsx')
          s = main.read_text()
          s = s.replace(
              "import { ThemeProvider } from './contexts/ThemeProvider.jsx'\n",
              "import { ThemeProvider } from './contexts/ThemeProvider.jsx'\n"
              "import { FilesetResolver, PoseLandmarker } from '@mediapipe/tasks-vision'\n"
          )
          s += "\nif (typeof window !== 'undefined') {\n"
          s += "  window.__PAPERCHALK_MEDIAPIPE__ = { FilesetResolver, PoseLandmarker };\n"
          s += "}\n"
          main.write_text(s)

          for path, line in [
              ('src/store/projectStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_PROJECT_STORE__ = useProjectStore;\n"),
              ('src/store/animationStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_ANIMATION_STORE__ = useAnimationStore;\n"),
              ('src/store/parameterStore.js', "\nif (typeof window !== 'undefined') window.__PAPERCHALK_PARAMETER_STORE__ = useParameterStore;\n"),
          ]:
              q = Path(path)
              q.write_text(q.read_text() + line)

          # Force auto-rig inference to use only assets shipped inside the APK.
          q = Path('src/io/armatureOrganizer.js')
          s = q.read_text()
          s = s.replace(
              "instance.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/';",
              "instance.env.wasm.wasmPaths = './ort/';"
          )
          s = s.replace(
              "export const DWPOSE_URL = 'https://huggingface.co/yzd-v/DWPose/resolve/main/dw-ll_ucoco_384.onnx';",
              "export const DWPOSE_URL = './models/dw-ll_ucoco_384.onnx';"
          )
          q.write_text(s)

          # Remove cloud/login wording and external See-Through shortcuts from the
          # embedded editor. PSD import itself is always local.
          for path in [
              'src/components/canvas/PsdImportWizard.jsx',
              'src/components/canvas/CanvasViewport.jsx',
              'src/components/preferences/PreferencesModal.jsx',
          ]:
              q = Path(path)
              if not q.exists():
                  continue
              s = q.read_text()
              s = s.replace('Download from HuggingFace', 'Use bundled offline DWPose')
              s = s.replace('Free HuggingFace Space', 'Offline mode')
              s = s.replace('https://huggingface.co/spaces/24yearsold/see-through-demo', '#offline-see-through-disabled')
              q.write_text(s)

          # Mobile adaptation for the upstream desktop-first editor:
          # horizontal top-toolbar scrolling, larger touch targets, and a
          # non-overlapping Staging/Animation switch on narrow screens.
          q = Path('src/app/layout/EditorLayout.jsx')
          s = q.read_text()
          s = s.replace(
              'className="h-10 border-b flex items-center px-4 shrink-0 bg-card gap-3 relative"',
              'className="min-h-11 border-b flex items-center px-2 sm:px-4 shrink-0 bg-card gap-1 sm:gap-3 relative overflow-x-auto overflow-y-hidden"'
          )
          s = s.replace(
              'className="font-semibold text-sm select-none tracking-tight"',
              'className="font-semibold text-sm select-none tracking-tight hidden sm:inline"'
          )
          s = s.replace(
              'className="text-xs text-muted-foreground border border-border/50 px-1.5 py-0.5 font-mono"',
              'className="text-xs text-muted-foreground border border-border/50 px-1.5 py-0.5 font-mono hidden md:inline"'
          )
          s = s.replace(
              'className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center bg-muted/30 rounded-lg p-0.5 border border-border/40"',
              'className="sm:absolute sm:left-1/2 sm:top-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 flex items-center bg-muted/30 rounded-lg p-0.5 border border-border/40 shrink-0"'
          )
          q.write_text(s)
          PY

          npm run build

          TARGET="$GITHUB_WORKSPACE/tools/spine-android-viewer/app/src/main/assets/studio"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -R dist/. "$TARGET/"
          cp LICENSE "$TARGET/LICENSE.StretchyStudio.txt"

      - name: Bundle MediaPipe cutout model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/selfie_segmenter.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite

      - name: Build debug APK
        run: gradle :app:assembleDebug -PspineVersion=4.3.5 --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/PaperChalk-SpineStudio.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperChalk-SpineStudio
          path: tools/spine-android-viewer/artifacts/PaperChalk-SpineStudio.apk
          if-no-files-found: error
          retention-days: 30
