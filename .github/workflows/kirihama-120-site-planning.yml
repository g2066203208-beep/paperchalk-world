name: Kirihama 120-site strict city planning proof
on:
  push:
    branches: [main]
    paths:
      - 'site/data/kirihama-location-masterplan.v1.json'
      - 'site/game/kirihama-location-plan.js'
      - 'scripts/build_kirihama_location_plan.mjs'
      - 'site/game/world-atlas.js'
      - 'site/game/destination-network.js'
      - 'site/kirihama-location-plan.html'
      - 'site/index.html'
      - 'tests/kirihama-location-masterplan.test.cjs'
      - 'tests/kirihama-location-review-browser.mjs'
      - 'tests/destination-network.test.cjs'
      - 'tests/world-atlas.test.cjs'
      - '.github/workflows/kirihama-120-site-planning.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kirihama-city-plan-proof
  cancel-in-progress: true
jobs:
  validate-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metric locations, original story IDs, true station access and return trips
        run: |
          node --check site/game/kirihama-location-plan.js
          node scripts/build_kirihama_location_plan.mjs --check
          node --check site/game/world-atlas.js
          node --check site/game/destination-network.js
          node --test tests/kirihama-location-masterplan.test.cjs tests/world-atlas.test.cjs tests/destination-network.test.cjs
      - name: Install real Chromium
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start locally served planning inspection page
        run: |
          python3 -m http.server 8765 --directory site >/tmp/kirihama-120-http.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/kirihama-location-plan.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kirihama-120-http.log
          exit 1
      - name: Verify district filters, authored school placement and screenshot real city plan
        run: node tests/kirihama-location-review-browser.mjs
      - name: Upload real rendered 120-site city review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kirihama-120-locations-15-districts-real-chrome
          path: artifacts/kirihama-location-plan/*.png
          retention-days: 14
          if-no-files-found: warn
