name: Vendor PixiJS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Fetch pinned PixiJS release
        run: |
          set -euo pipefail
          rm -rf /tmp/pixi-vendor
          mkdir -p /tmp/pixi-vendor vendor/pixi
          cd /tmp/pixi-vendor
          npm pack pixi.js@8.21.0 --silent
          tar -xzf pixi.js-8.21.0.tgz
          test -f package/LICENSE
          SRC=""
          for CANDIDATE in package/dist/pixi.min.mjs package/dist/pixi.mjs; do
            if [ -f "$CANDIDATE" ]; then SRC="$CANDIDATE"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "PixiJS distribution file not found"
            find package -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "$SRC" "$GITHUB_WORKSPACE/vendor/pixi/pixi-8.21.0.mjs"
          cp package/LICENSE "$GITHUB_WORKSPACE/vendor/pixi/LICENSE"
          printf 'PixiJS 8.21.0\nSource: npm pixi.js@8.21.0\nLicense: MIT (see LICENSE)\n' > "$GITHUB_WORKSPACE/vendor/pixi/README.txt"
          wc -c "$GITHUB_WORKSPACE/vendor/pixi/pixi-8.21.0.mjs"
      - name: Commit vendored renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pixi
          if git diff --cached --quiet; then
            echo "PixiJS vendor already current."
          else
            git commit -m "Vendor PixiJS 8.21.0"
            git push
          fi
