name: Scene Modules - fast validation
on:
  push:
    branches: [main]
    paths:
      - 'site/assets/scenes/**'
      - 'site/scene-modules.js'
      - 'site/index.html'
      - 'site/game/metro-platform-*.js'
      - 'site/game/ring-arena-runtime.js'
      - 'site/assets/metro/commuters/**'
      - 'tests/metro-platform-life.test.cjs'
      - 'scripts/build_scene_catalog.py'
      - 'tests/scene-modules.test.cjs'
      - '.github/workflows/scene-modules.yml'
  pull_request:
    paths:
      - 'site/assets/scenes/**'
      - 'site/scene-modules.js'
      - 'site/index.html'
      - 'site/game/metro-platform-*.js'
      - 'site/game/ring-arena-runtime.js'
      - 'site/assets/metro/commuters/**'
      - 'tests/metro-platform-life.test.cjs'
      - 'scripts/build_scene_catalog.py'
      - 'tests/scene-modules.test.cjs'
      - '.github/workflows/scene-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scene-modules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: All images -> catalog -> modular runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scene image decoder
        run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Validate and compile ALL installed scene images
        run: python3 scripts/build_scene_catalog.py
      - name: Check every image and reusable scene configuration
        run: node tests/scene-modules.test.cjs
      - name: Verify station passengers, boarding, new 3D seats and lighting
        run: |
          node --check site/game/metro-platform-life.js
          node --check site/game/metro-platform-3d.js
          node --check site/game/ring-arena-runtime.js
          node --test tests/metro-platform-life.test.cjs tests/metro-platform3d.test.cjs tests/metro-station-light.test.cjs
      - name: Verify game scripts parse independently
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          new Function(fs.readFileSync('site/scene-modules.js','utf8'));
          const h=fs.readFileSync('site/index.html','utf8');
          const m=h.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!m)throw Error('Main game script missing');
          new Function(m[1]);
          console.log('PASS: scene factory and main game JavaScript syntax');
          JS
