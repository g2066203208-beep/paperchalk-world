name: Slots & Daggers 3D Coin Whitebox - Physical and Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/motion/slot-3d-physics.js'
      - 'site/card-battle/coin-whitebox-lab.html'
      - 'tests/slot-3d-physics.test.cjs'
      - 'tests/slot-3d-browser.mjs'
      - '.github/workflows/slot-whitebox-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coin-3d-whitebox:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and deterministic three dimensional physics
        run: |
          node --check site/card-battle/motion/slot-3d-physics.js
          node --check tests/slot-3d-browser.mjs
          node tests/slot-3d-physics.test.cjs
      - name: Install Playwright Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the actual hosted game files
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/slot-3d-http.log 2>&1 &
          sleep 2
      - name: Inspect actual 3D coin motion and record screenshots and videos
        run: node tests/slot-3d-browser.mjs
      - name: Upload true Chrome visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slots-daggers-xyz-coin-physics-screenshots-and-webm
          path: artifacts/slot-daggers-3d-coin-whitebox/
          if-no-files-found: warn
          retention-days: 14