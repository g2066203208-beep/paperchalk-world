name: Slot whitebox coin payout - real 120Hz physics and mobile video
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/motion/slot-whitebox-physics.js'
      - 'site/card-battle/coin-whitebox-lab.html'
      - 'tests/slot-whitebox-physics.test.cjs'
      - 'tests/slot-whitebox-browser.mjs'
      - '.github/workflows/slot-whitebox-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-coin-collision-and-stacking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify node scripts and true rigid contacts
        run: |
          node --check site/card-battle/motion/slot-whitebox-physics.js
          node --check tests/slot-whitebox-browser.mjs
          node --test tests/slot-whitebox-physics.test.cjs
      - name: Install real browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host production site directory
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/slot-whitebox-server.log 2>&1 &
          sleep 2
      - name: Capture real desktop, portrait and landscape clips + physical QA
        run: node tests/slot-whitebox-browser.mjs
      - name: Upload visual QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot-whitebox-coin-collisions-stacking-screens-video
          path: artifacts/slot-whitebox-motion/
          retention-days: 14
          if-no-files-found: warn