name: Night Office - playable scene, tests, deploy
on:
  push:
    branches: [main, game/office-object-interactions]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-office-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check site/engine.js && node --check site/app.js && node --test tests/*.test.mjs
  playtest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Real browser playthrough (desktop, portrait and landscape)
        run: |
          python3 -m http.server 4173 --directory site > /tmp/site.log 2>&1 &
          node tests/browser.mjs
      - name: Upload real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-office-real-screenshots
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, playtest]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
        id: deployment
