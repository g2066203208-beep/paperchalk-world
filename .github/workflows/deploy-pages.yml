name: PAPERWORLD - fast game Pages publish and PixelLab routes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real procedural pixel game menu
        run: |
          node --check site/game/background.js
          node --check site/game/menu.js
          node --test tests/background-home.test.mjs
          test ! -f site/bone-lab/index.html
          test ! -f site/rig.js
          test ! -f site/app.js
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Browser-test actual procedural game menu and tactile controls on 4 screen sizes
        run: node tests/game-browser.mjs
      - name: Upload real browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperworld-clean-main-menu-and-curtain-four-viewports
          path: artifacts/game/
          retention-days: 14
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Include optional PixelLab model outputs (must never block game website)
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V5_ID=$(gh run list --workflow geometry-v5.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$V5_ID" && test "$V5_ID" != "null" || { echo "::error::No successful V5 model run to publish"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pixel-v5"
          gh run download "$V5_ID" --name pixel-v5-geometry-real-model-and-evidence --dir "$RUNNER_TEMP/pixel-v5"
          test -s "$RUNNER_TEMP/pixel-v5/site/pixel-lab/style2/geometry-v5/report.json"
          mkdir -p site/pixel-lab/style2/geometry-v5
          cp -a "$RUNNER_TEMP/pixel-v5/site/pixel-lab/style2/geometry-v5/." site/pixel-lab/style2/geometry-v5/

          FACE_ID=$(gh run list --workflow face-train.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$FACE_ID" ] && [ "$FACE_ID" != "null" ]; then
            mkdir -p "$RUNNER_TEMP/pixel-face"
            gh run download "$FACE_ID" --name pixel-face-trained-samples-and-weights --dir "$RUNNER_TEMP/pixel-face"
            test -s "$RUNNER_TEMP/pixel-face/site/pixel-lab/style2/face-lab/report.json"
            mkdir -p site/pixel-lab/style2/face-lab
            cp -a "$RUNNER_TEMP/pixel-face/site/pixel-lab/style2/face-lab/." site/pixel-lab/style2/face-lab/
            python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path("site/pixel-lab/style2/face-lab")
          r=json.loads((f/"report.json").read_text())
          assert r["trained"] and r["grid"]==[96,96] and len(r["generated_candidates"])==16
          assert r["human_approved_count"]==0 and (f/"contact_16.png").is_file()
          print("PASS: packaged 16 exact-color trained face candidates with honesty checks")
          PY
          else
            echo "::warning::Face training still running; face gallery will appear after verified workflow dispatches Pages"
          fi

          GENERAL_RUN=$(gh run list --workflow face-general.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$GENERAL_RUN" ] && [ "$GENERAL_RUN" != "null" ]; then
            mkdir -p "$RUNNER_TEMP/face-general"
            gh run download "$GENERAL_RUN" --name pixel-generic-multiface-trained-weights-and-samples --dir "$RUNNER_TEMP/face-general"
            test -s "$RUNNER_TEMP/face-general/site/pixel-lab/style2/face-general/general_report.json"
            mkdir -p site/pixel-lab/style2/face-general
            cp -a "$RUNNER_TEMP/face-general/site/pixel-lab/style2/face-general/." site/pixel-lab/style2/face-general/
            python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path('site/pixel-lab/style2/face-general')
          report=json.loads((folder/'general_report.json').read_text())
          assert report['pretrained'] and report['distinct_train_combinations']>=64 and report['candidate_count']>=8
          assert (folder/'generated_00.png').is_file()
          print('PASS: real multi-face training output packaged, not duplicated master poses')
          PY
          else
            echo "::warning::No validated multi-face checkpoint yet; the generic-face gallery will show unready state"
          fi

          LEGACY_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[]|select(.name=="PixelLab-native-384-detail-and-composition" and .expired==false)][0].workflow_run.id')
          if [ -n "$LEGACY_RUN" ] && [ "$LEGACY_RUN" != "null" ]; then
            mkdir -p "$RUNNER_TEMP/pixel-legacy"
            gh run download "$LEGACY_RUN" --name PixelLab-native-384-detail-and-composition --dir "$RUNNER_TEMP/pixel-legacy"
            if [ -d "$RUNNER_TEMP/pixel-legacy/site/pixel-lab" ]; then
              cp -a "$RUNNER_TEMP/pixel-legacy/site/pixel-lab/." site/pixel-lab/
            fi
          else
            echo "::warning::No previous V2–V4 artifacts; leaving those pages as legacy references"
          fi
          # Some newer ML evidence artifacts omit historical V2/V3 model files.
          # Fill in missing files from the last fully verified end-to-end PixelLab build.
          if [ ! -s site/pixel-lab/style2/v3/report.json ]; then
            if gh run download 41019933500 --name PixelLab-native-384-detail-and-composition --dir "$RUNNER_TEMP/pixel-full-history"; then
              if [ -d "$RUNNER_TEMP/pixel-full-history/site/pixel-lab" ]; then
                rsync -a --ignore-existing "$RUNNER_TEMP/pixel-full-history/site/pixel-lab/" site/pixel-lab/
              fi
            else
              echo "::warning::Historical PixelLab model artifact expired; V2/V3 archive should be regenerated"
            fi
          fi
          test -s site/pixel-lab/style2/geometry-v5/B_standing_pred_parts.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('site/pixel-lab/style2/geometry-v5/report.json').read_text())
          assert r['trained'] and r['no_claim_real_3d'] and r['no_claim_new_character_generation']
          assert len(r['preview'])==5
          assert Path('site/pixel-lab/learn.html').read_text().find('V5 人体结构')!=-1
          print('PASS: packaged V5 training report + real-character predictions + current V5 page')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published APK URL has actual PAPERWORLD main menu and code
        run: |
          set -euo pipefail
          URL="https://g2066203208-beep.github.io/paperchalk-world/"
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$URL?verify=$GITHUB_SHA-$i" -o /tmp/live-game.html                && grep -q 'blue8s-diagonal2' /tmp/live-game.html                && grep -q 'game/menu.js?v=20261030-menu3-click-fold' /tmp/live-game.html && ! grep -q 'BoneLab' /tmp/live-game.html                && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/background.js?verify=$GITHUB_SHA-$i" -o /tmp/live-background.js                && grep -q 'DIAGONAL_OVERSCAN_CELLS' /tmp/live-background.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/menu.js?verify=$GITHUB_SHA-$i" -o /tmp/live-menu.js && grep -q 'function paintFoldWipe' /tmp/live-menu.js && grep -q 'function emitClickPixels' /tmp/live-menu.js && grep -q 'data\[' /tmp/live-menu.js; then
              echo "PASS: Live GitHub Pages serves new diagonal game-only background"
              exit 0
            fi
            echo "Retry $i: CDN or Pages has not published current game source"
            sleep 8
          done
          echo "::error::Online GitHub Pages is not serving latest game after deploy"
          exit 1
