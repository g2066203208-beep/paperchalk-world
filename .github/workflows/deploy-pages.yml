name: PAPERWORLD - fast game Pages publish and PixelLab routes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real procedural pixel game menu
        run: |
          node --check site/game/background.js
          node --check site/game/menu.js
          node --check site/game/world3d.js
          node --check site/game/locomotion3d.js
          node --check site/game/motion3d.js
          node --check site/game/intro.js
          node --check site/game/lease.js
          node --check site/game/hostess-pixel.js
          node --test tests/background-home.test.mjs
          node --test tests/hostess-intro.test.mjs
          node --test tests/motion3d.test.mjs
          node --test tests/world3d-render.test.mjs
          node --test tests/locomotion3d.test.mjs
          node --test tests/pixel-lab-structure.test.mjs tests/hostess-redraw-native.test.mjs tests/character-browser.mjs
          test ! -f site/bone-lab/index.html
          test ! -f site/rig.js
          test ! -f site/app.js
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Browser-test actual procedural game menu and tactile controls on 4 screen sizes
        run: |
          node tests/game-browser.mjs
          node tests/hostess-redraw-browser.mjs
          node tests/fullbody-learning-browser.mjs
      - name: Upload real browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperworld-clean-main-menu-and-curtain-four-viewports
          path: |
            artifacts/game/
            artifacts/pixel-art/
            artifacts/fullbody-learning/
          retention-days: 14
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ship only checked-in current PixelLab full-figure evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/pixel-lab/fullbody-learning")
          d=json.loads((p/"report.json").read_text(encoding="utf-8"))
          assert d["trained_actual_full_canvas"] and d["native_model_grid"]==[384,512]
          assert d["training_independent_identities"]==1
          assert d["new_distinct_fullbody_characters_generated"]==0
          for row in d["records"]:
              assert (p/row["preview"]).is_file()
              assert (p/row["reconstruction"]).is_file()
          print("PASS: native whole-figure results checked in; no old tiny-face artifacts copied")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published APK URL has actual PAPERWORLD main menu and code
        run: |
          set -euo pipefail
          URL="https://g2066203208-beep.github.io/paperchalk-world/"
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$URL?verify=$GITHUB_SHA-$i" -o /tmp/live-game.html                && grep -q 'blue8s-diagonal2' /tmp/live-game.html                && grep -q 'game/menu.js?v=20261030-world3d-locomotion2' /tmp/live-game.html && ! grep -q 'BoneLab' /tmp/live-game.html                && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/background.js?verify=$GITHUB_SHA-$i" -o /tmp/live-background.js                && grep -q 'DIAGONAL_OVERSCAN_CELLS' /tmp/live-background.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/menu.js?verify=$GITHUB_SHA-$i" -o /tmp/live-menu.js && grep -q 'function paintFoldWipe' /tmp/live-menu.js && grep -q 'function emitTouchEffect' /tmp/live-menu.js && grep -q 'createHostessIntro' /tmp/live-menu.js && grep -q 'createWorld3D' /tmp/live-menu.js && grep -q 'data\[' /tmp/live-menu.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/intro.js?verify=$GITHUB_SHA-$i" -o /tmp/live-intro.js && grep -q 'function portraitLayers' /tmp/live-intro.js && grep -q 'function computeExteriorMask' /tmp/live-intro.js && grep -q 'CHAR_PER_SEC=10' /tmp/live-intro.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/hostess-pixel.js?verify=$GITHUB_SHA-$i" -o /tmp/live-hostess.js && grep -q 'HOSTESS_PNG' /tmp/live-hostess.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/lease.js?verify=$GITHUB_SHA-$i" -o /tmp/live-lease.js && grep -q 'createLeaseUI' /tmp/live-lease.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/stage.css?verify=$GITHUB_SHA-$i" -o /tmp/live-stage.css && grep -q 'pw-lease-card' /tmp/live-stage.css && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/world3d.js?verify=$GITHUB_SHA-$i" -o /tmp/live-world3d.js && grep -q 'makeTown' /tmp/live-world3d.js && grep -q 'BodyMotor' /tmp/live-world3d.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/motion3d.js?verify=$GITHUB_SHA-$i" -o /tmp/live-motion3d.js && grep -q 'class MotionPose' /tmp/live-motion3d.js && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${URL}game/locomotion3d.js?verify=$GITHUB_SHA-$i" -o /tmp/live-locomotion.js && grep -q 'class BodyMotor' /tmp/live-locomotion.js; then
              echo "PASS: Live GitHub Pages serves new diagonal game-only background"
              exit 0
            fi
            echo "Retry $i: CDN or Pages has not published current game source"
            sleep 8
          done
          echo "::error::Online GitHub Pages is not serving latest game after deploy"
          exit 1
