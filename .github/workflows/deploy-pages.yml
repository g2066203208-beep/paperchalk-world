name: BoneLab and PixelLab - test, learn, deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax, rig kinematics, SDF and facet-free checks
        run: |
          find site -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.mjs
          python3 -m compileall -q ml
          python3 -m unittest discover -s ml -p 'test_*.py'
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test BoneLab browser and take screenshots
        run: node tests/browser.mjs
      - name: Test Character Atelier geometric art, expressions and pixel previews
        run: node tests/character-browser.mjs
      - name: Check strict four-color sprite editor and capture real Chromium screenshot
        run: node tests/flat4-browser.mjs
      - name: Verify 112x160 four-color redrawn full-body sprite in Chromium
        run: node tests/flat4-redraw-browser.mjs
      - name: Upload true four-color sprite browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat4-four-color-browser-proof
          path: flat4-artifacts/
          retention-days: 30
      - name: Upload Character Atelier actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-atelier-browser-screenshots
          path: character-artifacts/
          retention-days: 30
      - name: Upload BoneLab visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonelab-browser-screenshots
          path: artifacts/
          retention-days: 30
  learn:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install CPU training dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Download CC0 sprites and train neural masked-pixel model
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python ml/train.py --steps 200
      - name: Reinforcement learning - train brush policy and holdout evaluation
        run: python ml/train_rl.py
      - name: Validate real exported model and train metrics
        run: |
          python ml/verify_outputs.py
          node tests/pixel-model.mjs
      - name: Collect artist-verified CC0 16x16 characters, train VAE and latent reinforcement policy
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          CHARACTER_TRAIN_STEPS: '440'
        run: |
          python ml/train_characters.py
          python ml/verify_characters.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for trained-model browser testing
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual neural browser inference and RL brush replay
        run: node tests/pixel-browser.mjs
      - name: Test real character-only VAE browser inference and original CC0 gallery
        run: node tests/character-generator-browser.mjs
      - name: Export first-party four-color master as strict pixel tokens
        run: node ml/flat4/export-source.mjs
      - name: Train genuine 5x5 masked-token neural pixel network on first-party art
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          FLAT4_TRAIN_STEPS: '260'
        run: python ml/train_flat4.py
      - name: Verify learned weights, honest validation and exact palette
        run: python ml/verify_flat4.py
      - name: Test trained network in real Chromium and capture proof
        run: node tests/flat4-trained-browser.mjs
      - name: Upload exact four-color neural repair proof and actual model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat4-learned-mlp-training-reconstruction-proof
          path: |
            flat4-artifacts/
            ml/flat4/source.json
            site/pixel-lab/flat4-source.json
            site/pixel-lab/flat4-model.json
          retention-days: 30
      - name: Reconstruct supplied pink-haired character from committed real pixel grid
        run: python -m ml.repixelize.engine --embedded ml/repixelize/reference-384.lzma.b64 --out-dir site/pixel-lab
      - name: Train RGB-patch denoising network on synthetic fake-pixel degradations
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m ml.repixelize.train --source ml/repixelize/reference-384.lzma.b64 --output repixel-ml-artifacts --steps 300
      - name: Validate native four-color repixelization, source snapshot and reconstruction fidelity
        run: |
          python -m unittest discover -s tests -p 'repixel_checks.py'
          python - <<'PY'
          import json
          from PIL import Image
          report=json.load(open('repixel-ml-artifacts/training-report.json'))
          assert report['training_steps']==300
          assert report['source_artwork_count']==1
          assert report['neural_accuracy']>.9
          image=Image.open('site/pixel-lab/repixelized-384x512.png')
          assert image.size==(384,512)
          print('REPIXEL: 4-color, native 384x512, reproducible training evidence and PNG validated')
          PY
      - name: Publish new D standing character in exact four-color native grid and train true patch MLP
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m ml.repixelize.publish_d_standing --steps 300
      - name: Verify new standing sprite and neural evidence
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          report=json.load(open('site/pixel-lab/d-standing-v1-report.json'))
          im=Image.open('site/pixel-lab/d-standing-v1-384x512.png')
          assert im.size == (384,512)
          assert report['distinct_rgb_colors'] == 4 and report['other_rgb_colors'] == 0 and report['alpha_pixels'] == 0
          assert report['palette']==['#393657','#F2A5C2','#A9BAE9','#FFF5E6']
          assert report['training']['training_steps']==300
          print('D STANDING: four exact RGB colors, true native pixels, trained model verified')
          PY
      - name: Prepare two D-style anchors, human-outline masks and 8 part crops
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m ml.style2.prepare
      - name: Train neural pixel restoration and masked-neighborhood drawing model on both characters
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m ml.style2.train
      - name: Validate D-style training, masks, crops and exact color limits
        run: python -m unittest discover -s tests -p 'style2_checks.py'
      - name: Install PyTorch CPU for exact four-token V2 generative model
        run: python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train V2 masked categorical diffusion with five procedural asset families and two character poses
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.discrete_diffusion_v2 --steps 260
      - name: Verify V2 true trained weights, native D palette, independent test examples and masks
        run: python -m ml.style2.verify_discrete_v2
      - name: Browser-test real image upload, palette locking and native PNG
        run: node tests/repixel-browser.mjs
      - name: Verify true per-pixel grid, zoom, point sampling, and unchanged PNG in Chromium
        run: node tests/repixel-grid-browser.mjs
      - name: Test eight original four-color palette live previews, export and mobile UI
        run: node tests/palette-browser.mjs
      - name: Test hosted D standing character, strict four colors and model evidence in Chromium
        run: node tests/d-standing-browser.mjs
      - name: Chromium-verify actual trained V2 output for all asset families and mobile
        run: node tests/discrete-v2-browser.mjs
      - name: Test hosted D four-token diffusion gallery, true grid, native download and mobile Chromium
        run: node tests/discrete-diffusion-browser.mjs
      - name: Upload trained repixelizer, faithful outputs and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pink-girl-repixel-true-four-colors-training-and-proof
          path: |
            repixel-ml-artifacts/
            repixel-browser-artifacts/
            site/pixel-lab/repixelized-384x512.png
            site/pixel-lab/repixelized-preview.png
            site/pixel-lab/repixelize-quality.json
            site/pixel-lab/d-standing-v1-384x512.png
            site/pixel-lab/d-standing-v1-preview-2x.png
            site/pixel-lab/d-standing-v1-neural-denoise-demo.png
            site/pixel-lab/d-standing-v1-neural-weights.npz
            site/pixel-lab/d-standing-v1-report.json
            site/pixel-lab/style2/
            site/pixel-lab/style2/diffusion-v2-gallery.json
          retention-days: 30
      - name: Upload true 16x16 human-only trained character evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-16x16-characters-vae-results
          path: |
            character-ml-artifacts/
            ml/characters/character-data-manifest.json
            ml/characters/character-report.json
            ml/characters/character-vae-weights.npz
            site/pixel-lab/characters.json
            site/pixel-lab/character-reference-sheet.png
            site/pixel-lab/character-generated-sheet.png
          retention-days: 30
      - name: Upload PixelLab real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixellab-trained-browser-screenshots
          path: pixel-artifacts/
          retention-days: 30
      - name: Upload learning artifacts and reproducibility proof
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lab-real-ml-model-and-evaluations
          path: |
            ml/metrics.json
            ml/rl_metrics.json
            site/pixel-lab/model.json
            site/pixel-lab/brush-policy.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify,browser,learn]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
