name: BoneLab and PixelLab - test, learn, deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax, rig kinematics, SDF and facet-free checks
        run: |
          find site -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.mjs
          python3 -m compileall -q ml
          python3 -m unittest discover -s ml -p 'test_*.py'
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test BoneLab browser and take screenshots
        run: node tests/browser.mjs
      - name: Test Character Atelier geometric art, expressions and pixel previews
        run: node tests/character-browser.mjs
      - name: Check strict four-color sprite editor and capture real Chromium screenshot
        run: node tests/flat4-browser.mjs
      - name: Upload true four-color sprite browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat4-four-color-browser-proof
          path: flat4-artifacts/
          retention-days: 30
      - name: Upload Character Atelier actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-atelier-browser-screenshots
          path: character-artifacts/
          retention-days: 30
      - name: Upload BoneLab visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonelab-browser-screenshots
          path: artifacts/
          retention-days: 30
  learn:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install CPU training dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Download CC0 sprites and train neural masked-pixel model
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python ml/train.py --steps 200
      - name: Reinforcement learning - train brush policy and holdout evaluation
        run: python ml/train_rl.py
      - name: Validate real exported model and train metrics
        run: |
          python ml/verify_outputs.py
          node tests/pixel-model.mjs
      - name: Collect artist-verified CC0 16x16 characters, train VAE and latent reinforcement policy
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          CHARACTER_TRAIN_STEPS: '440'
        run: |
          python ml/train_characters.py
          python ml/verify_characters.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for trained-model browser testing
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual neural browser inference and RL brush replay
        run: node tests/pixel-browser.mjs
      - name: Test real character-only VAE browser inference and original CC0 gallery
        run: node tests/character-generator-browser.mjs
      - name: Upload true 16x16 human-only trained character evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-16x16-characters-vae-results
          path: |
            character-ml-artifacts/
            ml/characters/character-data-manifest.json
            ml/characters/character-report.json
            ml/characters/character-vae-weights.npz
            site/pixel-lab/characters.json
            site/pixel-lab/character-reference-sheet.png
            site/pixel-lab/character-generated-sheet.png
          retention-days: 30
      - name: Upload PixelLab real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixellab-trained-browser-screenshots
          path: pixel-artifacts/
          retention-days: 30
      - name: Upload learning artifacts and reproducibility proof
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lab-real-ml-model-and-evaluations
          path: |
            ml/metrics.json
            ml/rl_metrics.json
            site/pixel-lab/model.json
            site/pixel-lab/brush-policy.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify,browser,learn]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
