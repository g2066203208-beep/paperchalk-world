name: Import original entrance scene
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-entrance.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original user-submitted entrance scene at native resolution
        env:
          SOURCE_IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:576/quality:100/uri:ifs%3A%2F%2FM%2F7186e2e9-4e06-46a8-a146-c38a1ccbcfdc/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAPNdSNSdm4umfj6dnfYpMxMEnb6GzqP4D3orBcA1AurH&exp=1793612060&osig=AAAAAAAAAAAAAAAAAAAAAMh1Rl9u1r-GbbS129LXzLe0hFZV8xX3ElsdISYp_u3L&signer=media-rpc&token=AAIAAU0AJDcxODZlMmU5LTRlMDYtNDZhOC1hMTQ2LWMzOGExY2NiY2ZkYwAAAAABoZucFWA7v0lGATq-WS_G8JAfWiDgUOnyOQmtRCFZUOs6BCfEAQ&x-canva-quality=thumbnail'
        run: |
          set -euo pipefail
          mkdir -p site/assets/scenes
          curl --fail --show-error --location --retry 3 --max-time 60 "$SOURCE_IMAGE_URL" -o /tmp/entrance.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/entrance.png').convert('RGB')
          assert im.size==(1024,576),f'Unexpected dimensions: {im.size}. Refusing thumbnail replacement.'
          im.save('site/assets/scenes/entrance.webp','WEBP',quality=96,method=6)
          assert Image.open('site/assets/scenes/entrance.webp').size==(1024,576)
          print('Entrance visual asset installed at full 1024x576 resolution')
          PY
      - name: Commit real binary image to the game repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/scenes/entrance.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(game): install original entrance scene image"
          git push origin HEAD:main
