name: Install provided entrance scene image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-entrance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified original composition into native resolution game scene
        run: |
          set -euo pipefail
          mkdir -p site/assets/scenes
          cat .asset-import/entrance/{00..07}.b64 | base64 --decode > site/assets/scenes/entrance.webp
          echo "974d093e9e9de49549c742b6fe13ce065c1a4a290293cb3a6172864a393201c5  site/assets/scenes/entrance.webp" | sha256sum -c -
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('site/assets/scenes/entrance.webp')
          assert im.format=='WEBP',im.format
          assert im.size==(1024,576),im.size
          print('Verified: user entrance scene 1024x576, genuine WebP')
          PY
      - name: Commit image and remove temporary transfer chunks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/scenes/entrance.webp
          git rm -r .asset-import/entrance
          git commit -m "art(game): add original entrance hallway image as reusable scene"
          git push origin HEAD:main
