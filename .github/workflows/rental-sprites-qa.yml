name: PAPERWORLD - isolated hostess and counter sprite QA
on:
  pull_request:
    paths:
      - 'site/game/intro.js'
      - 'site/game/art/**'
      - 'tests/rental-counter.test.mjs'
      - 'tests/rental-sprites-browser.mjs'
      - '.github/workflows/rental-sprites-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rental-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source PNGs, four inks, true transparency and independent render order
        run: |
          node --check site/game/intro.js
          node --test tests/rental-counter.test.mjs
      - name: Install real Chromium
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Capture and audit actual intro on four devices
        run: node tests/rental-sprites-browser.mjs
      - name: Upload game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-rental-sprites-four-screens
          path: artifacts/rental-sprites/
          retention-days: 14
