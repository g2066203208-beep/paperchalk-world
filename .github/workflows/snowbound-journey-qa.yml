name: Snowbound Journey Full-Flow Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/snowbound-journey.html'
      - 'site/card-battle/**'
      - 'tests/snowbound-motion-side-by-side-browser.mjs'
      - 'tests/snowbound-motion-side-by-side-audit.py'
      - 'site/card-battle/engine/snowbound-journey.js'
      - 'site/card-battle/ui/snowbound-journey.css'
      - 'site/card-battle/ui/snowbound-journey-ui.js'
      - 'tests/snowbound-journey-browser.mjs'
      - 'tests/snowbound-phase1-interaction-browser.mjs'
      - 'tests/snowbound-pixel-geometry-browser.mjs'
      - 'site/card-battle/ui/snowbound-battle-v3.css'
      - 'site/card-battle/ui/snowbound-forest-reference.css'
      - 'site/card-battle/assets/snowy-forest-reference.webp'
      - 'site/card-battle/ui/snowbound-card-geometry-v4.css'
      - 'site/card-battle/ui/snowbound-card-geometry-v4.css'
      - 'tests/snowbound-reference-comparison-report.mjs'
      - 'tests/snowbound-full-run.test.cjs'
      - 'tests/snowbound-semantic-events.test.cjs'
      - 'tests/snowbound-motion-capture-browser.mjs'
      - 'tests/snowbound-reference-clock-browser.mjs'
      - 'tests/snowbound-cinematic-outcomes-browser.mjs'
      - 'site/card-battle/motion/snowbound-motion.js'
      - 'site/card-battle/motion/snowbound-motion.css'
      - 'site/card-battle/motion/snowbound-tactile.js'
      - 'tests/snowbound-tactile-browser.mjs'
      - '.github/workflows/snowbound-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-screen-sizes:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone JS syntax
        run: |
          node --check site/card-battle/engine/snowbound-journey.js
          node --check site/card-battle/ui/snowbound-journey-ui.js
          node --check site/card-battle/motion/snowbound-motion.js
          node --check tests/snowbound-semantic-events.test.cjs
          node --check tests/snowbound-motion-capture-browser.mjs
          node --check tests/snowbound-motion-side-by-side-browser.mjs
          python3 -m py_compile tests/snowbound-motion-side-by-side-audit.py
          node --check tests/snowbound-tactile-browser.mjs
          node --check site/card-battle/motion/snowbound-tactile.js
          node --check tests/snowbound-reference-clock-browser.mjs
          node --check tests/snowbound-cinematic-outcomes-browser.mjs
          node --check tests/snowbound-journey-browser.mjs
          node --check tests/snowbound-reference-comparison-report.mjs
      - name: Verify semantic event sequence and atomic transaction behavior
        run: node tests/snowbound-semantic-events.test.cjs
      - name: Verify whole three-act campaign rule engine
        run: node tests/snowbound-full-run.test.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Host game files
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/snowbound-http.log 2>&1 &
          sleep 2
      - name: Run full screen flow checks
        run: node tests/snowbound-journey-browser.mjs
      - name: Verify drag-to-position, drag-to-attack and stage geometry
        run: node tests/snowbound-phase1-interaction-browser.mjs
      - name: Pixel geometry plus full-capacity visual stress benchmark
        run: node tests/snowbound-pixel-geometry-browser.mjs
      - name: Capture cinematic attack, merchant UI and actual browser videos
        run: node tests/snowbound-motion-capture-browser.mjs
      - name: Verify actual 1x and 2x original-GIF/video frame clocks in real game recordings
        run: node tests/snowbound-reference-clock-browser.mjs
      - name: Verify living card material, spring return and touch accessibility in real Chromium
        run: node tests/snowbound-tactile-browser.mjs
      - name: Validate fatal-hit death and full victory-defeat cinematic branch
        run: node tests/snowbound-cinematic-outcomes-browser.mjs
      - name: Capture REAL game input, timestamped cinematic frames and native Chromium video (desktop + phone)
        if: always()
        run: node tests/snowbound-motion-side-by-side-browser.mjs
      - name: Download official source GIF and 60fps trailer anew for side-by-side reference on EACH game update
        if: always()
        shell: bash
        run: |
          mkdir -p motion-source
          fetch_reference() {
            local dest="$1"; shift
            for url in "$@"; do
              echo "Original publisher clip: $url"
              if curl -fLSs --retry 3 --connect-timeout 12 --max-time 110 -A 'Mozilla/5.0' "$url" -o "motion-source/$dest"; then
                if [[ -s "motion-source/$dest" ]]; then
                  file "motion-source/$dest"
                  return 0
                fi
              fi
              rm -f "motion-source/$dest"
            done
            echo "::error::Could not download required original motion reference $dest"
            return 1
          }
          fetch_reference balatro_official_1.gif 'https://www.playbalatro.com/press-kit/Gifs/Balatro_gif_1%20.gif'
          fetch_reference slots_game_explainer.mp4 'https://video.akamai.steamstatic.com/store_trailers/257204109/movie480.mp4' 'https://cdn.akamai.steamstatic.com/steam/apps/257204109/movie480.mp4'
      - name: Install original-frame comparison and video decoding
        if: always()
        run: |
          if ! command -v ffmpeg >/dev/null || ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg python3-pil
          fi
          ffmpeg -version | head -n 1
          python3 -c 'import PIL; print("Pillow",PIL.__version__)'
      - name: Compare REAL publisher GIF/video frames and exact source playback speed against game PC/mobile screenshots and WebM
        if: always()
        run: python3 tests/snowbound-motion-side-by-side-audit.py
      - name: Publish side-by-side official reference and actual game screenshots
        if: always()
        run: node tests/snowbound-reference-comparison-report.mjs
      - name: Store actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowbound-journey-actual-game-screens
          path: |
            artifacts/snowbound-journey/
            artifacts/snowbound-phase1/
            artifacts/snowbound-pixel-audit/
            artifacts/snowbound-motion-v2/
            artifacts/snowbound-motion-reference-clocks/
            artifacts/snowbound-motion-side-by-side/
            artifacts/snowbound-tactile-proof/
            artifacts/snowbound-outcome-cinema/
            artifacts/snowbound-reference-comparison/
          if-no-files-found: warn
