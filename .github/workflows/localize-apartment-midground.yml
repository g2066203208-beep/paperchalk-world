name: Localize Apartment Midground

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/localize-apartment-midground.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Download approved apartment artwork
        run: |
          mkdir -p /tmp/paperchalk assets/backgrounds
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/dec343ecea57d90d50ceb8cff2ac579208fbcec5dcf5f73c0c438dfeb71b0908.jpg" \
            -o /tmp/paperchalk/apartment.jpg
          test "$(stat -c%s /tmp/paperchalk/apartment.jpg)" -gt 100000
      - name: Remove connected black background and optimize WebP
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image, ImageFilter
          import numpy as np

          src=Image.open("/tmp/paperchalk/apartment.jpg").convert("RGBA")
          arr=np.array(src)
          rgb=arr[:,:,:3].astype(np.int16)
          h,w=arr.shape[:2]

          dark=rgb.max(axis=2)<35
          connected=np.zeros((h,w),dtype=bool)
          q=deque()
          for x in range(w):
              for y in (0,h-1):
                  if dark[y,x] and not connected[y,x]:
                      connected[y,x]=True;q.append((y,x))
          for y in range(h):
              for x in (0,w-1):
                  if dark[y,x] and not connected[y,x]:
                      connected[y,x]=True;q.append((y,x))
          while q:
              y,x=q.popleft()
              for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                  ny,nx=y+dy,x+dx
                  if 0<=ny<h and 0<=nx<w and dark[ny,nx] and not connected[ny,nx]:
                      connected[ny,nx]=True;q.append((ny,nx))

          arr[connected,3]=0
          alpha=Image.fromarray(arr[:,:,3])
          near=np.array(alpha.filter(ImageFilter.MaxFilter(5)))<255
          lum=rgb.mean(axis=2)
          fringe=near&(lum<70)&(~connected)
          arr[fringe,3]=np.clip((lum[fringe]-20)/50*255,0,255).astype(np.uint8)

          out=Image.fromarray(arr,"RGBA")
          dst=Path("assets/backgrounds/apartment-midground.webp")
          out.save(dst,"WEBP",quality=82,method=6,alpha_quality=90)
          print("source",src.size,"output bytes",dst.stat().st_size)
          if src.size != (1152,1536):
              raise SystemExit(f"unexpected apartment dimensions: {src.size}")
          if dst.stat().st_size > 350000:
              raise SystemExit(f"apartment runtime asset too large: {dst.stat().st_size}")
          PY
      - name: Commit local apartment asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/backgrounds/apartment-midground.webp
          if git diff --cached --quiet; then
            echo "Apartment asset already current."
          else
            git commit -m "Localize optimized apartment midground asset"
            git push
          fi
