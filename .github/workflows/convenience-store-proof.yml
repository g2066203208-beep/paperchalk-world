name: Convenience store — real Chrome gameplay screenshots
on:
  push:
    branches: [main]
    paths:
      - 'site/convenience-store/**'
      - 'site/index.html'
      - 'tests/convenience-store-browser.mjs'
      - '.github/workflows/convenience-store-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convenience-store-real-browser
  cancel-in-progress: true
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual main game's dynamic scene catalog
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/build_scene_catalog.py
      - name: Test deterministic convenience-store economy and save
        run: node site/convenience-store/store-core.test.cjs
      - name: Install actual Chrome browser for gameplay screenshot
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Click through five customers in real Chromium
        run: node tests/convenience-store-browser.mjs
      - name: Preserve real browser gameplay screenshots and video even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convenience-store-real-chromium-gameplay
          path: artifacts/convenience-store/
          if-no-files-found: warn
          retention-days: 14
