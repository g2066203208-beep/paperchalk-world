name: Build Pixel Stripe Android APK
on:
  push:
    branches: [main]
    paths:
      - 'site/stripe-game/**'
      - 'android/stripe-game/**'
      - '.github/workflows/build-stripe-apk.yml'
  pull_request:
    paths:
      - 'site/stripe-game/**'
      - 'android/stripe-game/**'
      - '.github/workflows/build-stripe-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable debug APK
        working-directory: android/stripe-game
        run: gradle --no-daemon assembleDebug
      - name: Verify built APK exists
        run: test -s android/stripe-game/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelStripe-Android-debug-APK
          path: android/stripe-game/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
