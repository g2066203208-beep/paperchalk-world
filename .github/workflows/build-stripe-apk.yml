name: Build Pixel Stripe Android APK
on:
  push:
    branches: [main]
    paths:
      - 'site/stripe-game/**'
      - 'android/stripe-game/**'
      - '.github/workflows/build-stripe-apk.yml'
  pull_request:
    paths:
      - 'site/stripe-game/**'
      - 'android/stripe-game/**'
      - '.github/workflows/build-stripe-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stripe-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable debug APK
        working-directory: android/stripe-game
        run: gradle --no-daemon assembleDebug
      - name: Verify built APK exists
        run: test -s android/stripe-game/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelStripe-Android-debug-APK
          path: android/stripe-game/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish stable preview APK link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/stripe-game/app/build/outputs/apk/debug/app-debug.apk PixelStripe-latest.apk
          if gh release view stripe-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload stripe-preview PixelStripe-latest.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create stripe-preview PixelStripe-latest.apk --prerelease --repo "$GITHUB_REPOSITORY" --title "Pixel Stripe · Android Preview" --notes "Debug preview build. Web content fetches latest published site automatically; the native binary itself does not silently update."
          fi
