name: Heroine L2D online smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'site/l2d/**'
      - 'site/index.html'
      - '.github/workflows/l2d-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test mounted breathing animation and online UI
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<12'
          python3 scripts/build_scene_catalog.py
          mkdir -p artifacts/heroine-l2d
          python3 -m http.server 8132 --directory site > /tmp/l2d-server.log 2>&1 &
          node - <<'JS'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            try{
              for(const mobile of [false,true]){
                const page=await browser.newPage({viewport:mobile?{width:390,height:844}:{width:1360,height:900},isMobile:mobile,hasTouch:mobile});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8132/l2d/',{waitUntil:'load'});
                await page.waitForFunction(()=>window.paperchalkL2D?.rig?.source?.width===1024,{timeout:12000});
                assert.equal(await page.locator('#preview').count(),1);
                assert.equal(await page.locator('#front').getAttribute('aria-pressed'),'true');
                const grab=()=>page.evaluate(()=>{
                  const a=document.querySelector('canvas').getContext('2d').getImageData(360,100,320,650).data;
                  let sum=0; for(let k=0;k<a.length;k+=4)sum=(sum + a[k]*3+a[k+1]*5+a[k+2]*7+a[k+3]*11)>>>0;
                  return sum;
                });
                const first=await grab();await page.waitForTimeout(900);
                const second=await grab();assert.notEqual(first,second,'breathing must change rendered pixels');
                await page.locator('#bones').click();
                await page.locator('#static').click();
                await page.locator('#back').click();
                await page.waitForFunction(()=>window.paperchalkL2D?.rig?.source?.width===1024 && window.paperchalkL2D?.side==='back',{timeout:12000});
                await page.locator('#static').click();
                await page.locator('#strength').fill('97');
                assert.equal(await page.locator('#strengthValue').textContent(),'97%');
                await page.screenshot({path:'artifacts/heroine-l2d/'+(mobile?'mobile':'desktop')+'.png',fullPage:true});
                assert.deepEqual(errors,[],'browser console exceptions');
                await page.close();
              }
              const page=await browser.newPage({viewport:{width:1360,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8132/',{waitUntil:'load'});
              await page.waitForFunction(()=>window.paperchalkPlayerBreath?.rig?.source?.width===1024,{timeout:15000});
              const a=await page.evaluate(()=>{
                const img=document.querySelector('#actor-player'),can=document.querySelector('#actor-player-l2d');
                const r=img.getBoundingClientRect(),b=can.getBoundingClientRect();
                return {ready:document.querySelector('#camera-player-root').dataset.breathReady,delta:Math.max(Math.abs(r.left-b.left),Math.abs(r.top-b.top),Math.abs(r.width-b.width),Math.abs(r.height-b.height))};
              });
              assert.equal(a.ready,'true');
              // When the game menu is active the original player root is hidden.
              // Offsets become comparable only when it is made visible.
              await page.evaluate(()=>document.querySelector('#camera-player-root').hidden=false);
              await page.waitForTimeout(100);
              const b=await page.evaluate(()=>{
                const img=document.querySelector('#actor-player').getBoundingClientRect(),can=document.querySelector('#actor-player-l2d').getBoundingClientRect();
                return Math.max(Math.abs(img.left-can.left),Math.abs(img.top-can.top),Math.abs(img.width-can.width),Math.abs(img.height-can.height));
              });
              assert.ok(b<3,'in-game mesh must follow original player layout: '+b);
              assert.deepEqual(errors,[]);
              await page.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heroine-l2d-browser-screenshots
          path: artifacts/heroine-l2d
          retention-days: 7
