name: PAPERWORLD - bar interface visual QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bar-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check layout and recipe
        run: |
          node --check site/game/bar-scene.js
          node --test tests/bar-scene.test.mjs
      - name: Install headless Chromium and CJK fonts
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Render and test all four viewports
        run: node tests/bar-ui-browser.mjs
      - name: Publish genuine Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bar-ui-qa-four-viewports
          path: artifacts/bar-ui/
          retention-days: 14
          if-no-files-found: warn
