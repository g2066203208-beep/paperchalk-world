name: Pixel Lab - V4 detective real CNN pixel experiment
on:
  push:
    branches: [main]
    paths:
      - 'ml/portrait_v4/detective.py'
      - 'ml/portrait_v4/detective_topology.py'
      - '.github/workflows/detective-pixel-ml.yml'
      - 'tests/test_detective_pixel_ml.py'
      - 'site/pixel-lab/portrait-v4/source-v4-640-q92.webp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  detective-training:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing and CPU ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run actual source-trained inference and holdouts
        run: |
          test -f site/pixel-lab/portrait-v4/source-v4-640-q92.webp
          python -m ml.portrait_v4.detective \
            --input site/pixel-lab/portrait-v4/source-v4-640-q92.webp \
            --out artifacts/detective-v4-ml --steps 150 --colors 14
      - name: Clean disconnected pixel specks without editing protected facial features
        run: python -m ml.portrait_v4.detective_topology --dir artifacts/detective-v4-ml
      - name: Validate exact RGB pixel blocks and holdout provenance
        run: |
          python -m unittest discover -s tests -p test_detective_pixel_ml.py -v
      - name: Archive selected native pixel PNG to the Pixel Lab website
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/pixel-lab/portrait-v4
          cp artifacts/detective-v4-ml/R2C2-selected-native-128.png site/pixel-lab/portrait-v4/R2C2-detective-approved-direction-candidate-128.png
          cp artifacts/detective-v4-ml/R2C2-selected-native-128-preview-1024.png site/pixel-lab/portrait-v4/R2C2-detective-approved-direction-preview-1024.png
          cp artifacts/detective-v4-ml/R2C2-topology-gate-report.json site/pixel-lab/portrait-v4/R2C2-detective-topology-report.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add site/pixel-lab/portrait-v4/R2C2-detective-approved-direction-candidate-128.png site/pixel-lab/portrait-v4/R2C2-detective-approved-direction-preview-1024.png site/pixel-lab/portrait-v4/R2C2-detective-topology-report.json
          if ! git diff --cached --quiet; then
            git commit -m "art(pixel-lab): archive selected R2C2 128x128 discrete pixel candidate and audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish real R2C2 results (not synthetic smoke)
        uses: actions/upload-artifact@v4
        with:
          name: v4-detective-real-cnn-native-pixels
          path: artifacts/detective-v4-ml/
          retention-days: 30
          if-no-files-found: error
