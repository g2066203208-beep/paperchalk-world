name: PixelLab - discrete palette diffusion research (NOT approved art)
on:
  push:
    branches: [main]
    paths:
      - 'ml/fullbody_refine/discrete_pilot.py'
      - '.github/workflows/pixel-discrete-diffusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install torch CPU and palette image dependencies
        run: |
          python -m pip install --quiet numpy==2.2.6 Pillow==11.3.0 scipy==1.16.1
          python -m pip install --quiet 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Actually train categorical timestep denoiser and compare unapproved output
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m ml.fullbody_refine.discrete_pilot
      - name: Keep checkpoint, rejected-or-approved-later previews and loss metrics as research artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-palette-discrete-diffusion-research-only
          path: artifacts/pixel-discrete-diffusion/
          retention-days: 30
          if-no-files-found: warn
