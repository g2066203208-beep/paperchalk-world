name: PixelLab D Style Discrete Diffusion - real training smoke test
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'CPU training steps (research prototype, not game-ready)'
        required: false
        default: '180'
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight training prerequisites
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare two true four-color D style original sprites
        run: python -m ml.style2.prepare
      - name: Train real masked discrete diffusion and run coarse-guided generation
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.discrete_diffusion --steps "${{ inputs.steps }}"
      - name: Validate true training, noise masks, learned weights and four exact colors
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import torch
          from PIL import Image
          root=Path('site/pixel-lab/style2/diffusion')
          report=json.loads((root/'report.json').read_text())
          assert report['train_steps']>=80
          assert report['images']==2 and report['distinct_character_identities']==1
          assert (root/'weights.pt').stat().st_size>10000
          palette={(57,54,87),(242,165,194),(169,186,233),(255,245,230)}
          for pose in ('A','B'):
              for name in ('original','generated','repair','coarse'):
                  im=np.asarray(Image.open(root/f'{pose}_{name}.png').convert('RGB'))
                  assert im.shape==(64,48,3)
                  assert set(map(tuple,np.unique(im.reshape(-1,3),axis=0))).issubset(palette)
          print('PASS research ML train, 48x64 native tokens, exact D palette and real outputs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: D-style-discrete-diffusion-trained-prototype
          path: site/pixel-lab/style2/diffusion/
          retention-days: 30
