name: Mobile UI + Touch Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/main.js"
      - "src/input/**"
      - "src/player/**"
      - "styles/main.css"
      - "assets/player/**"
      - "tests/demo-main-browser.mjs"
      - ".github/workflows/ui-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/main.js"
      - "src/input/**"
      - "src/player/**"
      - "styles/main.css"
      - "assets/player/**"
      - "tests/demo-main-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Static main check
        run: npm test
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/paperchalk-ui-http.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/paperchalk-ui-http.log
          exit 1
      - name: Run responsive UI and touch movement regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          sed 's|127.0.0.1:8080|127.0.0.1:4173|g' tests/demo-main-browser.mjs > /tmp/demo-main-browser.mjs
          cp /tmp/demo-main-browser.mjs tests/demo-main-browser-4173.mjs
          node tests/demo-main-browser-4173.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-main-screenshots
          path: |
            artifacts/new-main-visual-demo.png
            artifacts/new-main-mobile.png
          if-no-files-found: ignore
