name: UI + Paper Stage Overlay Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"
      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/paperchalk-ui-http.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/paperchalk-ui-http.log
          exit 1
      - name: Run UI smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/ui-smoke.mjs
