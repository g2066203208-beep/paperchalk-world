name: PixelLab - REAL hostess fullbody refinement ML
on:
  push:
    branches: [main]
    paths:
      - 'ml/fullbody_refine/**'
      - '.github/workflows/fullbody-refiner.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostess-refine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-palette image refiner
        run: |
          python -m pip install --quiet numpy==2.2.6 Pillow==11.3.0
          python -m pip install --quiet 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train on real COMPLETE new hostess figure, apply conservative learned correction
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m ml.fullbody_refine.refine --steps 70
      - name: Reject empty, fake or damaging ML retouch output
        run: python -m ml.fullbody_refine.verify
      - name: Save actual checkpoint and native images for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullbody-hostess-ml-refinement-model-and-native-images
          path: site/pixel-lab/refine-output/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish checked pixel changes and measured QA report
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pixel-lab/refine-output/*.png site/pixel-lab/refine-output/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: trained hostess pixel refiner and independently verified tiny corrections"
          for n in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
