name: Map ripples - isolated real browser animated preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-ripple-real-browser-preview.yml'
      - 'tests/map-fluid-ripple-preview-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-live-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real grid, fog renderer and playable metro
        run: |
          node --check site/game/dot-fog-ripples.js
          node --check site/game/transit-map-ui.js
          node --test tests/metro-map-editor.test.cjs
      - name: Install real Chromium and image tools
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Serve actual game
        run: |
          python3 scripts/build_scene_catalog.py
          python3 -m http.server 8765 --directory site >/tmp/map-ripple-http.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/map-ripple-http.log
          exit 1
      - name: Capture real live fluid black fog and water-ripple dot animation
        env:
          PAPERCHALK_RIPPLE_GIF_CAPTURE: '1'
        run: node tests/map-fluid-ripple-preview-browser.mjs
      - name: Assemble real browser animation for visual review
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=sorted(Path('artifacts/map-ripples').glob('wave-*.png'))
          if len(paths)<2:
              print('Not enough actual browser frames for preview', len(paths))
          else:
              frames=[]
              for p in paths:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((940,530),Image.Resampling.LANCZOS)
                  frames.append(im)
              out=Path('artifacts/map-ripples/00-live-black-fog-dot-ripples.gif')
              frames[0].save(out,save_all=True,append_images=frames[1:],
                  duration=1600,loop=0,optimize=True,disposal=2)
              print('Real game GIF:',out,'frames:',len(frames),'bytes:',out.stat().st_size)
          PY
      - name: Upload source frames, screenshots and animated proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-game-fluid-fog-dot-ripples
          path: |
            artifacts/map-ripples/01-full-screen-black-fog-subtle-dots.png
            artifacts/map-ripples/wave-*.png
            artifacts/map-ripples/00-live-black-fog-dot-ripples.gif
          retention-days: 14
          if-no-files-found: warn
