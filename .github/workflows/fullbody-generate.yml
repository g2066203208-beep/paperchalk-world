name: PixelLab - generative NEW fullbody character sampling
on:
  push:
    branches: [main]
    paths:
      - 'ml/fullbody/generate.py'
      - 'ml/fullbody/verify_generation.py'
      - '.github/workflows/fullbody-generate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fullbody-generator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install whole-figure generative model + 500 image dataset readers
        run: |
          python -m pip install --quiet "numpy==2.2.6" "Pillow==11.3.0" "huggingface_hub>=0.29,<2" "pyarrow>=19,<26"
          python -m pip install --quiet "torch==2.7.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train new stochastic full-character generator and sample changed bodies, looks and actions
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          HF_HUB_DISABLE_XET: "1"
        run: python -m ml.fullbody.generate --steps 1150 --limit 330
      - name: Verify REAL model-only generated fullbody images and strict D palette
        run: python -m ml.fullbody.verify_generation
      - name: Preserve real checkpoint, original samples and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truly-generated-fullbody-poses-vae-model-and-evidence
          path: site/pixel-lab/fullbody-generated/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish tested model-generated candidate PNGs and report
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/pixel-lab/fullbody-generated/*.png site/pixel-lab/fullbody-generated/report.json
          if git diff --cached --quiet; then echo "No changed model samples"; exit 0; fi
          git commit -m 'assets(pixel-lab): deliver actual VAE-sampled different fullbody people and actions'
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Generated images verified but could not push; download Action artifact"
          exit 1
