name: Horror Room - publish and verify real public Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/horror-room/**'
      - 'tests/horror-room-browser.mjs'
      - 'tests/horror-room-live-browser.mjs'
      - '.github/workflows/horror-room-public.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: horror-room-public-pages
  cancel-in-progress: false
jobs:
  deploy-public-room:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current 3D room source and exact public-route file
        run: |
          test -s site/horror-room/index.html
          grep -q '__HORROR_ROOM__' site/horror-room/index.html
          grep -q '模拟敲门' site/horror-room/index.html
          node --check tests/horror-room-browser.mjs
          node --check tests/horror-room-live-browser.mjs
      - name: Upload ENTIRE site including horror-room to Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy actual GitHub Pages website
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Prepare Chromium for verification of LIVE public URL
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Re-download public site and test actual online door interactions
        run: node tests/horror-room-live-browser.mjs
      - name: Upload genuine public GitHub Pages browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-room-REAL-public-github-pages-screenshots
          path: artifacts/horror-room-live/
          if-no-files-found: warn
          retention-days: 14
