            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','qa-rig','front'));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.model?.idleProfile?.parts?.hair===.65,
              null,{timeout:22000});
            assert.equal(await page.evaluate(()=>
              window.PaperchalkL2DLibrary.get('player').model.idleProfile.parts.skirt),1.5,
              'editor hair and skirt sliders must affect the same in-game renderer');
            await browser.close();
            console.log('PASS full game and editor modular L2D playback + old V4 safety');
           }finally{await browser.close();}
