name: L2D modules - auto-register and game + studio integration
on:
  push:
    branches: [main]
    paths:
      - 'site/assets/l2d/library/**'
      - 'site/assets/l2d/inbox/**'
      - 'site/l2d/library-player.js'
      - 'site/l2d/part-rig.js'
      - 'site/assets/l2d/source-masks/**'
      - 'scripts/build_protagonist_part_rig.py'
      - 'site/dev/character-bridge.js'
      - 'site/character-editor/studio.js'
      - 'site/character-editor/part-rig-studio.js'
      - 'site/character-editor/index.html'
      - 'site/index.html'
      - 'scripts/build_l2d_library.py'
      - 'scripts/bind_female06_pants.py'
      - 'tests/test_female06_pants_skin.cjs'
      - 'scripts/build_character_catalog.py'
      - 'tests/test_l2d_library.py'
      - 'tests/test_l2d_idle.js'
      - 'tests/test_protagonist_crouch_asset.py'
      - 'tests/test_protagonist_crouch_dynamics.cjs'
      - 'scripts/qa_crouch_geometry.py'
      - 'tests/test_protagonist_crouch_studio_browser.mjs'
      - 'tests/test_protagonist_crouch_motion_browser.mjs'
      - 'tests/test_l2d_display_lifecycle.cjs'
      - 'tests/test_l2d_studio_game_sync.cjs'
      - 'tests/test_l2d_studio_game_browser.js'
      - 'tests/test_battle_front_studio.js'
      - 'tests/test_female5_teacher_alias_browser.js'
      - 'tests/test_protagonist_unified.py'
      - '.github/workflows/l2d-modules.yml'
  pull_request:
    paths:
      - 'site/assets/l2d/library/**'
      - 'site/assets/l2d/inbox/**'
      - 'site/l2d/library-player.js'
      - 'site/dev/character-bridge.js'
      - 'site/index.html'
      - 'site/character-editor/studio.js'
      - 'site/l2d/part-rig.js'
      - 'scripts/build_l2d_library.py'
      - 'scripts/bind_female06_pants.py'
      - 'tests/test_female06_pants_skin.cjs'
      - 'scripts/build_character_catalog.py'
      - 'tests/test_l2d_library.py'
      - 'tests/test_l2d_idle.js'
      - 'tests/test_protagonist_crouch_asset.py'
      - 'tests/test_protagonist_crouch_dynamics.cjs'
      - 'scripts/qa_crouch_geometry.py'
      - 'tests/test_protagonist_crouch_studio_browser.mjs'
      - 'tests/test_protagonist_crouch_motion_browser.mjs'
      - 'tests/test_battle_front_studio.js'
      - '.github/workflows/l2d-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Unit tests for real format, missing files, path escape and asset version
        run: python3 -m unittest discover -s tests -p 'test_l2d_library.py' -v
      - name: Validate realistic idle and independent per-part settings
        run: node tests/test_l2d_idle.js
      - name: Validate L2D asset reuse and latest-selection stability
        run: node tests/test_l2d_display_lifecycle.cjs
      - name: Ensure game renders saved Studio bones and textures (including unpublished rigs)
        run: node tests/test_l2d_studio_game_sync.cjs
      - name: Verify separate protagonist battle-front PSD studio and ZIP isolation
        run: node tests/test_battle_front_studio.js
      - name: Rebuild existing original L2D safely
        run: |
          python3 scripts/build_v4_assets.py
          python3 scripts/build_protagonist_part_rig.py
          python3 tests/test_protagonist_unified.py
          python3 scripts/build_char002_psd_rig.py
          python3 scripts/build_scene_catalog.py
      - name: Export ORIGINAL eye/nose/brow PNGs to face-only QA artifact for visual review
        run: |
          mkdir -p artifacts/l2d-face/source-parts
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          from pathlib import Path
          source=Path('site/assets/l2d/v4/protagonist-original-parts.zip')
          with ZipFile(source) as z:
              art=json.loads(z.read('layers.json'))['layers']['front']
              for entry in art:
                  if entry['id'] in ('face','brows','nose','eye_white','irises','lashes','front_hair'):
                      data=z.read(entry['file'])
                      Path('artifacts/l2d-face/source-parts/'+entry['id']+'.png').write_bytes(data)
                      from PIL import Image
                      import io
                      with Image.open(io.BytesIO(data)).convert('RGBA') as im:
                          a=im.getchannel('A')
                          print('REAL ORIGINAL PART',entry['id'],
                                'size',im.size,'alphaBounds',a.getbbox(),'pixelCount',
                                sum(1 for v in a.getdata() if v>30))
          PY
      - name: Generate disposable complete V4 + ArtMesh modules in CI only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path('site/assets/l2d/library')
          def out(p,data):p.write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')
          def poster(p):Image.new('RGBA',(1024,1024),(0,0,0,0)).save(p/'front.png')
          v=base/'qa-v4';v.mkdir(parents=True);poster(v)
          a=Image.new('RGBA',(80,110),(222,80,70,225))
          b=Image.new('RGBA',(80,110),(65,90,215,225))
          a.save(v/'clip.webp',save_all=True,append_images=[b],duration=70,loop=0,lossless=True)
          out(v/'module.json',{'schema':1,'id':'qa-v4','label':'测试逐帧模块',
            'views':{'front':{'portrait':'front.png','clip':{'type':'v4-webp',
              'file':'clip.webp','crop':{'x':300,'y':90,'w':80,'h':110},'frames':2,'fps':20}}}})
          p=base/'qa-rig';p.mkdir(parents=True);poster(p)
          parts={};textures={}
          for i,name in enumerate(('hair','skirt')):
            Image.new('RGBA',(80,120),(80+i*120,90,160,255)).save(p/(name+'.png'))
            textures[name]=name+'.png'
            parts[name]={'id':name,'name':name,'x':280+i*70,'y':80+i*210,'w':80,'h':120,
              'parentId':'root','kind':name,'pivot':{'x':.5,'y':.05},'tip':{'x':.5,'y':.95},
              'mesh':{'columns':4,'rows':6},
              'motion':{'x':25,'y':0,'angle':10,'frequency':1,'phase':0},'enabled':True}
          out(p/'front.rig.json',{'format':'paperchalk-part-rig-v1','characterId':'qa-rig',
            'face':'front','canvas':[1024,1024],'parts':parts})
          out(p/'module.json',{'schema':1,'id':'qa-rig','label':'测试独立网格模块',
            'views':{'front':{'portrait':'front.png','rig':{'type':'part-mesh',
            'file':'front.rig.json','textures':textures}}}})
          PY
          python3 scripts/build_character_catalog.py
          python3 - <<'PY'
          import json
          p=json.load(open('site/characters.catalog.json'))
          data={c['id']:c for c in p['characters']}
          assert {'protagonist','char-002','qa-v4','qa-rig'} <= set(data)
          assert data['protagonist']['clips']['front']['frames']==128
          assert data['protagonist']['clips']['back']['frames']==128
          assert not data['char-002'].get('clips'), 'old female-two V4 must not load'
          assert not data['char-002'].get('back')
          assert 'char-002-psd-v1' not in data, 'one female-two ID only'
          assert 'char-002-rig-v1' not in data, 'old fake rig is gone'
          assert 'protagonist-unified-v1' not in data, 'unified front is an internal module, not a new NPC'
          assert data['protagonist']['l2dModule']['front']['rig']['partCount']==20
          secondary=data['char-002']['l2dModule']['front']
          assert secondary['renderer']=='part-mesh'
          assert secondary['rig']['partCount']==18
          assert secondary['sourceParts']['provenance']=='original-psd'
          assert secondary['rig']['sourceCharacterId']=='char-002-psd-v1'
          assert 'char-016' not in data, 'deleted male-second character must remain absent'
          assert data['qa-rig']['l2dModule']['front']['rig']['partCount']==2
          assert data['qa-v4']['clips']['front']['frames']==2
          print('PASS catalog: CHAR-002 authentic 17 source layers and independent raised/lowered arm meshes')
          PY
      - name: Verify crouch source pixel integrity, eye layers, exact grips and 25 real textures
        run: python3 -m unittest tests/test_protagonist_crouch_asset.py -v
      - name: "Verify true crouch - rigid axe, dual grips, planted soles and waist-locked hem"
        run: node tests/test_protagonist_crouch_dynamics.cjs
      - name: Record real source layer bounds for fitted hem, planted feet and axe grip
        run: python3 scripts/qa_crouch_geometry.py
      - name: Verify game, independent ArtMesh player and editor parse
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          for(const p of ['site/l2d/part-rig.js','site/l2d/library-player.js',
                'site/dev/character-bridge.js','site/character-editor/studio.js',
                'site/character-editor/part-rig-studio.js'])
            new Function(fs.readFileSync(p,'utf8'));
          const h=fs.readFileSync('site/index.html','utf8');
          if(!h.includes('library-player.js')||!h.includes('part-rig.js'))
            throw Error('Game is not wired to published independent ArtMesh modules');
          console.log('PASS module player JS parse and game integration');
          JS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium inspect heroine crouch 25 layers, actions, viewport and game player
        run: node tests/test_protagonist_crouch_studio_browser.mjs
      - name: Real Chromium QA of crouch skirt inertia, two-hand axe and planted feet
        run: node tests/test_protagonist_crouch_motion_browser.mjs
      - name: Assemble TRUE rendered L2D poses into a ping-pong motion preview
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          base=Path('artifacts/protagonist-crouch/motion')
          paths=sorted(base.glob('phase-*.png'))
          assert len(paths)>=10,'motion browser frames must exist'
          w=h=576
          bg=Image.new('RGBA',(w,h),(34,39,48,255))
          g=ImageDraw.Draw(bg)
          for yy in range(0,h,24):
              for xx in range(0,w,24):
                  if (xx//24+yy//24)%2==0:
                      g.rectangle((xx,yy,xx+23,yy+23),fill=(41,47,57,255))
          images=[]
          for path in paths:
              with Image.open(path) as im:
                  art=im.convert('RGBA').resize((w,h),Image.Resampling.LANCZOS)
                  f=bg.copy()
                  f.alpha_composite(art)
                  images.append(f.convert('RGB').quantize(colors=192))
          timeline=images+list(reversed(images[1:-1]))
          timeline[0].save(base/'real-crouch-l2d-loop.gif',
              save_all=True,append_images=timeline[1:],duration=115,
              loop=0,disposal=2,optimize=False)
          print('PASS generated REAL played L2D art frames:',len(paths),
            'ping-pong preview:',len(timeline),
            'GIF bytes:',(base/'real-crouch-l2d-loop.gif').stat().st_size)
          PY
      - name: Actual browser loads V4 and true independent ArtMesh modules in game and studio
        run: |
          python3 -m http.server 8132 --directory site >/tmp/l2d-modules-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
           try{
            const page=await browser.newPage({viewport:{width:1200,height:850}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8132/?scene=classroom&dev=1',{waitUntil:'load'});
            await page.waitForFunction(()=>window.PaperchalkCharacterDev?.ready,{timeout:30000});
            // Both playable slots must exist even though enemy's layout anchor
            // originally had no src. The default NPC is canonical CHAR-002.
            const slots=await page.evaluate(()=>({
              visible:[...document.querySelector('#dev-character-list').options].map(x=>x.value),
              player:window.PaperchalkCharacterDev.assigned.player,
              enemy:window.PaperchalkCharacterDev.assigned.enemy
            }));
            assert.deepEqual(slots.visible,['player','enemy'],
              'both independent character zones must be selectable in DEV');
            assert.equal(slots.player.id,'protagonist');
            assert.equal(slots.enemy.id,'char-002');
            assert.equal(slots.enemy.side,'front');
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('enemy')?.layers?.length===18,
              null,{timeout:25000});
            // Verify real pixels, not just a loaded model: the classroom
            // NPC canvas must be visible and nontransparent.
            await page.waitForFunction(()=>{
              const a=window.PaperchalkL2D.get('enemy');
              if(!a||a.root.hidden||a.img.hidden||!a.canvas.width||!a.canvas.height)return false;
              const data=a.canvas.getContext('2d',{willReadFrequently:true})
                .getImageData(0,0,a.canvas.width,a.canvas.height).data;
              for(let i=3;i<data.length;i+=32)if(data[i]>0)return true;
              return false;
            },null,{timeout:25000});
            // Swapping one zone must never mutate the other actor. The true
            // female-two rig must survive returning to the NPC zone.
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('enemy','protagonist','front',false));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('enemy')?.layers?.length===20,
              null,{timeout:20000});
            assert.equal(await page.evaluate(()=>window.PaperchalkCharacterDev.assigned.player.id),
              'protagonist');
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('enemy','char-002','front',false));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('enemy')?.layers?.length===18,
              null,{timeout:25000});
            const names=await page.evaluate(()=>window.PaperchalkCharacterDev.characters.map(c=>c.id));
            assert.ok(names.includes('qa-rig')&&names.includes('qa-v4'),'new modules must show in live DEV game picker');
            assert.ok(!names.includes('char-016'),'deleted character must not appear in DEV picker');
            await page.evaluate(()=>{document.querySelector('#camera-player-root').hidden=false;});
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','qa-rig','front'));
            await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.root?.dataset.l2dMode==='library-part-mesh',{timeout:20000});
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.layers?.length===2,{timeout:12000});
            await page.waitForFunction(()=>{
              const a=window.PaperchalkL2D.get('player');
              if(!a?.canvas.width||!a?.canvas.height)return false;
              const im=a.canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,a.canvas.width,a.canvas.height).data;
              for(let i=3;i<im.length;i+=32)if(im[i]>0)return true;
              return false;
            },null,{timeout:20000});
            assert.equal(await page.evaluate(()=>window.PaperchalkL2DLibrary.get('player').model.parts.hair.motion.x),25);
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','qa-v4','front'));
            await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.clip?.count===2,{timeout:20000});
            assert.equal(await page.evaluate(()=>window.PaperchalkL2DLibrary.get('player')),null,
              'switching to V4 must unload the old independent texture renderer');
            // This is the ACTUAL heroine's original 25-layer ZIP, not a
            // synthetic QA bitmap or a full-image sinusoidal distortion.
            // The uploaded female-two PSD: 24 source layer records, 17
            // genuinely painted source textures. No seven-region fallback.
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','char-002','front'));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.layers?.length===18,
              null,{timeout:25000});
            const secondary=await page.evaluate(()=>{
              const a=window.PaperchalkL2DLibrary.get('player'),
                p=a.model.parts,core=window.PaperchalkPartRigCore;
              const f=core.sanitizeIdleProfile({...a.model.idleProfile,
                joints:{hands:0,shoulders:2,hips:2}});
              const move=(id,u,v)=>{
                const a=core.warpPoint(p[id],u,v,.5,null,f),
                  b=core.warpPoint(p[id],u,v,2.7,null,f);
                return Math.hypot(a.x-b.x,a.y-b.y);
              };
              const foot=p.footwear,q=core.warpPoint(foot,.5,.9,1.4,null,f);
              return {ids:Object.keys(p),provenance:a.model.provenance,
                rig:!!a.model.bodyHierarchy,
                feet:Math.hypot(q.x-foot.x-foot.w*.5,q.y-foot.y-foot.h*.9),
                fringe:move('front_hair',.5,.95),rear:move('back_hair',.5,.92),
                hem:move('bottomwear',.5,.93),
                eyes:!!p.eyewhite&&!!p.irides&&!!p.eyelash};
            });
            console.log('ORIGINAL CHAR-002 PSD IN GAME',JSON.stringify(secondary));
            assert.equal(secondary.ids.length,18);
            assert.ok(secondary.ids.includes('hand_raised')&&secondary.ids.includes('hand_lowered')&&!secondary.ids.includes('handwear'));
            assert.equal(secondary.provenance,'original-psd');
            assert.ok(secondary.rig&&secondary.feet<.00001,'both feet must stay grounded');
            assert.ok(secondary.fringe>0.02&&secondary.rear>0.02&&secondary.hem>0.02,
              'original hair and hem must actually animate');
            assert.equal(secondary.eyes,true);
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','front'));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.layers?.length===20,{timeout:20000});
            // Pixel-level regression on ACTUAL protagonist front textures.
            // This catches "bone values animate but brows/nose vanish" and
            // "eye parts exist but no actual eyelid closure".
            const faceCheck=await page.evaluate(()=>{
              const actor=window.PaperchalkL2DLibrary.get('player'),
                core=window.PaperchalkPartRigCore;
              const draw=(phase,except=[])=>{
                const canvas=document.createElement('canvas');
                canvas.width=1024;canvas.height=1024;
                core.draw(canvas.getContext('2d',{alpha:true}),
                  actor.layers.filter(x=>!except.includes(x.partId)),actor.model,phase);
                return canvas;
              };
              const open=draw(0),blink=draw(.9*2*Math.PI/3.6);
              const noBrow=draw(0,['brows']),noNose=draw(0,['nose']);
              const compare=(a,b,x,y,w,h)=>{
                const d=a.getContext('2d').getImageData(x,y,w,h).data;
                const e=b.getContext('2d').getImageData(x,y,w,h).data;
                let changed=0,total=0;
                for(let i=0;i<d.length;i+=4){
                  const delta=Math.abs(d[i]-e[i])+Math.abs(d[i+1]-e[i+1])+
                    Math.abs(d[i+2]-e[i+2])+Math.abs(d[i+3]-e[i+3]);
                  if(delta>15)changed++;
                  total+=delta;
                }
                return {changed,total};
              };
              const out={
                eyebrows:compare(open,noBrow,465,104,120,48),
                nose:compare(open,noNose,504,148,40,36),
                blink:compare(open,blink,465,118,115,50),
                eyes:[actor.model.parts.eye_white?.id,actor.model.parts.irises?.id,
                  actor.model.parts.lashes?.id],
                closed:core.blinkAmount(.9*2*Math.PI/3.6),
                open:core.blinkAmount(0)
              };
              // Include enlarged REAL face renders in browser artifacts.
              for(const [name,image] of [['eyes-open',open],['eyes-closed',blink]]){
                const zoom=document.createElement('canvas');
                zoom.width=600;zoom.height=560;zoom.id='qa-'+name;
                const ctx=zoom.getContext('2d');
                ctx.imageSmoothingEnabled=true;
                ctx.drawImage(image,400,20,260,250,0,0,600,560);
                zoom.style.cssText='position:fixed;top:20px;left:20px;z-index:100000;' +
                  'background:#1b2630;width:600px;height:560px;';
                document.body.appendChild(zoom);
              }
              return out;
            });
            console.log('REAL HEROINE FACE PIXEL AUDIT',JSON.stringify(faceCheck));
            assert.ok(faceCheck.eyebrows.changed>=8,
              'eyebrow must remain visible above face bitmap in the final game composite');
            assert.ok(faceCheck.nose.changed>=4,
              'nose must remain visible above face bitmap in the final game composite');
            assert.ok(faceCheck.blink.changed>=40&&faceCheck.closed>.99&&faceCheck.open<.001,
              'real eye white, iris and lash pixels must close then reopen, not static eyes');
            const fs=require('node:fs');
            fs.mkdirSync('artifacts/l2d-face',{recursive:true});
            for(const [id,file] of [['qa-eyes-open','original-heroine-open-face.png'],
                                    ['qa-eyes-closed','original-heroine-blinking-face.png']]){
              const data=await page.locator('#'+id).evaluate(canvas=>canvas.toDataURL('image/png').split(',')[1]);
              fs.writeFileSync('artifacts/l2d-face/'+file,Buffer.from(data,'base64'));
            }
            await page.evaluate(()=>document.querySelectorAll('[id^="qa-eyes-"]').forEach(n=>n.remove()));
            const physical=await page.evaluate(()=>{
              const core=window.PaperchalkPartRigCore;
              const m=window.PaperchalkL2DLibrary.get('player').model.parts;
              const check=(name,u,v)=>{
                const p=m[name];
                const a=core.warpPoint(p,u,v,0),b=core.warpPoint(p,u,v,1.4);
                return {joints:p.bones.length,moved:Math.hypot(a.x-b.x,a.y-b.y)};
              };
              const arms=m.sleeves_and_hands;
              const before=core.warpPoint(arms,.82,.92,1.4);
              const left=arms.bones.find(b=>b.id==='left-elbow');
              const original=left.amplitude;left.amplitude=35;
              const after=core.warpPoint(arms,.82,.92,1.4);
              left.amplitude=original;
              return {hair:check('rear_hair',.2,.95),
                frontHair:check('front_hair',.8,.92),
                skirt:check('skirt',.22,.95),
                jacket:check('jacket',.18,.95),
                arms:check('sleeves_and_hands',.2,.92),
                rightArmCrossTalk:Math.hypot(before.x-after.x,before.y-after.y)};
            });
            assert.deepEqual(Object.fromEntries(Object.entries(physical)
              .filter(([key])=>key!=='rightArmCrossTalk').map(([k,v])=>[k,v.joints])),
              {hair:6,frontHair:6,skirt:6,jacket:4,arms:4},
              'real protagonist source PNG parts must have independent authored joint chains');
            for(const [kind,part] of Object.entries(physical)){
              if(kind==='rightArmCrossTalk')continue;
              assert.ok(part.moved>.3,kind+' real source pixels must articulate between animation frames');
            }
            assert.ok(physical.rightArmCrossTalk<1,
              'right arm must not move from editing left elbow within the same real PNG');
            // Regression: with the SAME exact heroine PNGs, calm idle
            // must move less than the previously exaggerated factory rig.
            const expressive=await page.evaluate(()=>{
              const core=window.PaperchalkPartRigCore;
              const model=window.PaperchalkL2DLibrary.get('player').model;
              const upgraded=core.sanitizeIdleProfile({
                preset:'realistic',hair:{amount:.48},cloth:{amount:.34},parts:{}
              });
              const custom=core.sanitizeIdleProfile({
                preset:'custom',hair:{amount:.45},cloth:{amount:.31},
                parts:{front_hair:.5,skirt:0}
              });
              const idle=model.idleProfile;
              const quiet=JSON.parse(JSON.stringify(idle));
              quiet.hair.amount=.48;quiet.cloth.amount=.34;quiet.parts={};
              const travel=(id,u,v,profile)=>{
                const p=model.parts[id],xs=[],ys=[];
                for(let i=0;i<=90;i++){
                  const pt=core.warpPoint(p,u,v,i*.11,null,profile);
                  xs.push(pt.x);ys.push(pt.y);
                }
                return Math.hypot(Math.max(...xs)-Math.min(...xs),
                  Math.max(...ys)-Math.min(...ys));
              };
              return {hairNow:travel('front_hair',.22,.95,idle),
                hairBefore:travel('front_hair',.22,.95,quiet),
                skirtNow:travel('skirt',.16,.95,idle),
                skirtBefore:travel('skirt',.16,.95,quiet),
                migrated:[upgraded.hair.amount,upgraded.cloth.amount],
                custom:[custom.hair.amount,custom.cloth.amount,
                  custom.parts.front_hair,custom.parts.skirt],
                body:idle.body.amount};
            });
            console.log('CALIBRATED NATURAL FRINGE / SKIRT',JSON.stringify(expressive));
            assert.ok(expressive.hairNow>2&&expressive.hairNow<expressive.hairBefore*.8,
              'normal fringe should move, but less than the exaggerated previous idle');
            assert.ok(expressive.skirtNow>1&&expressive.skirtNow<expressive.skirtBefore*.85,
              'normal skirt should move gently, not flap as in the previous idle');
            assert.deepEqual(expressive.migrated,[.24,.18],
              'old settings migrate to the only approved basic standing animation');
            assert.deepEqual(expressive.custom,[.24,.18,1.3,1.5],
              'rejected v3 custom storm values cannot reactivate after reload');
            assert.equal(expressive.body,0,'no full-body left-right standing sway');
            assert.deepEqual(await page.evaluate(()=>{
              const core=window.PaperchalkPartRigCore,m=window.PaperchalkL2DLibrary.get('player').model;
              return [core.bodyPoseAt(3,m.idleProfile).lean,
                core.windField(m.parts.front_hair,.15,.95,3,m.idleProfile).x];
            }),[0,0],'the actual game renderer must have no lean or air force');
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','back'));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.layers?.length===8,{timeout:20000});
            const backBones=await page.evaluate(()=>{
              const p=window.PaperchalkL2DLibrary.get('player').model.parts;
              return [p.back_hair.bones.length,p.skirt.bones.length,p.sleeve_left.bones.length,p.sleeve_right.bones.length];
            });
            assert.deepEqual(backBones,[6,6,2,2],'back hair, skirt and separate sleeves are actual independent articulated source parts');
            await page.evaluate(()=>window.PaperchalkCharacterDev.assign('player','protagonist','back'));
            await page.waitForFunction(()=>window.PaperchalkL2DLibrary.get('player')?.layers?.length===8,{timeout:20000});
            assert.deepEqual(await page.evaluate(()=>{
              const a=window.PaperchalkL2DLibrary.get('player');
              const m=a.model.parts;
              return [a.actor.root.dataset.l2dMode,
                a.actor.root.dataset.l2dBreath,m.back_hair.bones.length,m.skirt.bones.length,
                m.sleeve_left.bones.length,m.sleeve_right.bones.length];
            }),['library-part-mesh','joint-parented',6,6,2,2],
              'ORIGINAL heroine must have independent hair, skirt and left/right sleeve joints by default');
            await page.evaluate(()=>window.PaperchalkCharacterDev.setHeroineRenderer('v4'));
            await page.waitForFunction(()=>window.PaperchalkL2D.get('player')?.clip?.count===128,{timeout:20000});
            assert.equal(await page.evaluate(()=>window.PaperchalkL2D.get('player').root.dataset.l2dEdition),'V4-official');
            assert.deepEqual(errors,[],'game page JavaScript errors');
            await page.goto('http://127.0.0.1:8132/character-editor/?character=qa-rig&side=front',{waitUntil:'load'});
            await page.waitForFunction(()=>window.PaperchalkStudio?.current==='qa-rig'&&
              window.PaperchalkStudio?.countSourceParts?.()===2,{timeout:30000});
            await page.waitForFunction(()=>window.PaperchalkPartRigStudio?.state.active,{timeout:12000});
            const editor=await page.evaluate(()=>window.PaperchalkPartRigStudio.state.model);
            assert.equal(editor.parts.hair.motion.x,25,
              'studio must load the published per-part rig rather than guessing animation');
            assert.equal(Object.keys(editor.parts).length,2);
            assert.equal(await page.locator('#rig-quick-panel').isVisible(),true);
            assert.equal(await page.locator('[data-idle-preset]').count(),0,
              'no old mode presets are exposed');
            assert.equal(await page.locator('[data-quick="fringe"]').isVisible(),true);
            assert.equal(await page.locator('[data-quick="skirt"]').isVisible(),true);
            await page.locator('[data-quick="fringe"]').fill('65');
            await page.locator('[data-quick="skirt"]').fill('150');
            await page.locator('[data-quick="speed"]').fill('140');
            await page.locator('#btnSave').click();
            await page.waitForFunction(async()=>{
              const m=await window.PaperchalkStudio.readPartRig('qa-rig','front');
              return m?.idleProfile?.parts?.hair===.65&&
                m?.idleProfile?.parts?.skirt===1.5&&m.idleProfile.hair.speed===1.4;
            },null,{timeout:15000});
            assert.equal(await page.locator('#idle-open').isVisible(),false);
            await page.locator('#rig-file-actions summary').click();
            assert.equal(await page.locator('#rig-module-export').count(),1);
            page.once('dialog',dialog=>dialog.accept('qa-export'));
            const zipDownload=page.waitForEvent('download',{timeout:20000});
            await page.locator('#rig-module-export').click();
            const downloaded=await zipDownload;
            assert.equal(downloaded.suggestedFilename(),'qa-export.zip');
            await downloaded.saveAs('/tmp/qa-export.zip');
            assert.equal(await page.locator('#part-rig-panel').isVisible(),true);
            await page.goto('http://127.0.0.1:8132/?dev=1',{waitUntil:'load'});
