name: V26 anatomical knee comparison and intersection audit
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/lowpoly-studio/knee-v26.html'
      - '.github/workflows/knee-v26-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knee-v26-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/card-battle/lowpoly-studio/knee-v26.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Capture actual browser and measure nonadjacent triangle intersections
        run: |
          mkdir -p review
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true}),page=await browser.newPage({viewport:{width:1000,height:1000}});
            const errors=[],results=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('file://'+path.resolve('site/card-battle/lowpoly-studio/knee-v26.html'));
            await page.waitForFunction(()=>window.__kneeGeometry);
            for(const method of ['v25','v26','v26nc']){
              await page.locator('#method').selectOption(method);
              for(const angle of [0,1,30,60,90,120,135,145]){
                await page.locator('#angle').evaluate((e,a)=>{e.value=a;e.dispatchEvent(new Event('input',{bubbles:true}))},angle);
                const result=await page.evaluate(()=>{
                  const {positions:P,rest,quads}=window.__kneeGeometry;
                  const sub=(a,b)=>a.map((x,i)=>x-b[i]),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
                  function hit(a,b,u,v,w){const d=sub(b,a),e=sub(v,u),f=sub(w,u),h=cross(d,f),det=dot(e,h);if(Math.abs(det)<1e-10)return false;const s=sub(a,u),q=cross(s,e),x=dot(s,h)/det,y=dot(d,q)/det,t=dot(f,q)/det;return x>1e-7&&y>1e-7&&x+y<1-1e-7&&t>1e-7&&t<1-1e-7}
                  const triangles=quads.flatMap((q,i)=>[[q[0],q[1],q[2]],[q[0],q[2],q[3]]].map(ids=>{const p=ids.map(j=>P[j]);return {ids,i,p,lo:[0,1,2].map(k=>Math.min(...p.map(v=>v[k]))),hi:[0,1,2].map(k=>Math.max(...p.map(v=>v[k])))}})).sort((a,b)=>a.lo[1]-b.lo[1]);
                  let intersections=0,faces=new Set();
                  for(let i=0;i<triangles.length;i++){const a=triangles[i];for(let j=i+1;j<triangles.length;j++){const b=triangles[j];if(b.lo[1]>a.hi[1])break;if(a.i===b.i||a.ids.some(k=>b.ids.includes(k))||[0,2].some(k=>a.hi[k]<b.lo[k]||b.hi[k]<a.lo[k]))continue;const test=(a,b)=>a.p.some((p,k)=>hit(p,a.p[(k+1)%3],...b.p));if(test(a,b)||test(b,a)){intersections++;faces.add(a.i);faces.add(b.i)}}}
                  let neutral=0;for(let i=0;i<P.length;i++)neutral=Math.max(neutral,Math.hypot(...sub(P[i],rest[i])));
                  return {...window.__kneeAudit,intersections,intersectingQuads:faces.size,maxRestDisplacement:neutral,vertices:P.length,quads:quads.length};
                });
                results.push(result);
                assert.equal(result.deg,angle);
                if(angle===0)assert.ok(result.maxRestDisplacement<1e-9);
                if(method==='v26'&&angle!==0)assert.ok(result.rigid<1e-8,'rigid edge changed length');
                if([0,60,90,120,145].includes(angle)&&method!=='v26nc'){
                  await page.locator('#side').click();
                  await page.screenshot({path:'review/'+method+'-side-'+angle+'.png'});
                  if([90,145].includes(angle)){
                    await page.locator('#wire').setChecked(true);
                    await page.screenshot({path:'review/'+method+'-wire-'+angle+'.png'});
                    await page.locator('#wire').setChecked(false);
                    await page.locator('#three').click();
                    await page.screenshot({path:'review/'+method+'-three-'+angle+'.png'});
                    await page.locator('#side').click();
                  }
                }
              }
            }
            fs.writeFileSync('review/report.json',JSON.stringify({commit:process.env.GITHUB_SHA,errors,results,limitations:'Triangle interior intersections only, excludes adjacent and coplanar pairs; not full collision certification. File URL browser test, not Pages.'},null,2));
            await browser.close();assert.deepEqual(errors,[]);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-v25-real-browser-comparison
          path: review
      - name: Archive exact screenshots and report in dedicated evidence branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/knee-review
          cp review/* /tmp/knee-review/
          cd /tmp/knee-review
          git init -b knee-v26-browser-review
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "V26 exact Chromium review ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:knee-v26-browser-review
