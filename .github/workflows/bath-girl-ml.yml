name: PixelLab - new girl native D conversion and training
on:
  push:
    branches: [main]
    paths:
      - 'ml/repixelize/bath_girl_candidate_384.lzma.b64'
      - 'ml/style2/bath_girl_import.py'
      - 'ml/style2/bath_girl_train.py'
      - 'ml/style2/verify_bath_girl.py'
      - 'site/pixel-lab/bath-girl.html'
      - '.github/workflows/bath-girl-ml.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: bath-girl-ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train_convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual CPU machine learning stack
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0'
          python -m pip install 'torch==2.7.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Decode committed 2-bit image; validate source-content RGB SHA256
        run: python -m ml.style2.bath_girl_import
      - name: Train pixel restoration from D gold and new pseudo-label; hold out B
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m ml.style2.bath_girl_train --steps 140
      - name: Verify 384x512, exact palette, hashes, holdout metrics and checkpoint
        run: python -m ml.style2.verify_bath_girl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-bath-girl-converted-and-trained
          path: site/pixel-lab/style2/bath-girl/
          retention-days: 30
          if-no-files-found: warn
      - name: Trigger GitHub Pages update with successful ML artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
