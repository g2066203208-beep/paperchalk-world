name: Import Formal Protagonist

on:
  push:
    branches: [formal-protagonist-original-test]
    paths:
      - ".github/workflows/import-formal-protagonist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Download the user-supplied formal protagonist
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/7b4ee4d6810f33567a4f861e0ca3be6823852b2d2951bd58a2236723fc906f64.jpg" \
            -o /tmp/formal-protagonist.jpg
      - name: Remove connected black background and keep original 1024x1536 dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          import numpy as np

          src=Image.open('/tmp/formal-protagonist.jpg').convert('RGBA')
          assert src.size==(1024,1536), src.size

          a=np.array(src)
          rgb=a[:,:,:3]
          mx=rgb.max(axis=2)
          h,w=mx.shape

          # Only remove near-black pixels connected to the outer image border.
          # The cream paper outline around the character protects her dark hair,
          # clothes, backpack and shoes from being keyed out.
          passable=mx<=42
          mask=np.zeros((h,w),dtype=np.uint8)
          q=deque()

          for x in range(w):
              if passable[0,x]:
                  mask[0,x]=1; q.append((0,x))
              if passable[h-1,x] and not mask[h-1,x]:
                  mask[h-1,x]=1; q.append((h-1,x))
          for y in range(h):
              if passable[y,0] and not mask[y,0]:
                  mask[y,0]=1; q.append((y,0))
              if passable[y,w-1] and not mask[y,w-1]:
                  mask[y,w-1]=1; q.append((y,w-1))

          while q:
              y,x=q.popleft()
              if y>0 and passable[y-1,x] and not mask[y-1,x]:
                  mask[y-1,x]=1; q.append((y-1,x))
              if y+1<h and passable[y+1,x] and not mask[y+1,x]:
                  mask[y+1,x]=1; q.append((y+1,x))
              if x>0 and passable[y,x-1] and not mask[y,x-1]:
                  mask[y,x-1]=1; q.append((y,x-1))
              if x+1<w and passable[y,x+1] and not mask[y,x+1]:
                  mask[y,x+1]=1; q.append((y,x+1))

          a[:,:,3][mask.astype(bool)]=0
          out=Image.fromarray(a,'RGBA')
          out.save('assets/traveler.webp','WEBP',lossless=True,method=6,exact=True)

          verify=Image.open('assets/traveler.webp')
          assert verify.size==(1024,1536)
          assert verify.mode in ('RGBA','RGB')
          print('formal protagonist:',verify.size,'bytes=',__import__('os').path.getsize('assets/traveler.webp'))
          PY
      - name: Commit formal protagonist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/traveler.webp
          if git diff --cached --quiet; then
            echo "Formal protagonist already current."
          else
            git commit -m "Replace placeholder traveler with formal protagonist"
            git push
          fi
