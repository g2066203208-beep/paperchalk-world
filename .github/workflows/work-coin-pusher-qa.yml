name: Work original-gold coin pusher - real Chromium QA
on:
  push:
    branches: [main]
    paths:
      - 'site/card-battle/slots-daggers/coin-pusher/**'
      - 'tests/work-coin-pusher-browser.mjs'
      - '.github/workflows/work-coin-pusher-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original Work renderer and separate new game syntax
        run: |
          node --check site/card-battle/slots-daggers/engine.js
          node --check site/card-battle/slots-daggers/cabinet-art.js
          node --check site/card-battle/slots-daggers/coin-art.js
          node --check site/card-battle/slots-daggers/coin-pusher/game.js
          node --check tests/work-coin-pusher-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual GitHub Pages source tree
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory site >/tmp/work-coin-pusher.log 2>&1 &
          sleep 2
      - name: Play coin pusher and capture actual desktop/phone screenshots and videos
        run: node tests/work-coin-pusher-browser.mjs
      - name: Preserve running-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-original-gold-coin-pusher-real-browser
          path: artifacts/work-coin-pusher/
          retention-days: 14
          if-no-files-found: warn
