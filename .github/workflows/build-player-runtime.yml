name: Build Player Runtime Assets

on:
  push:
    branches: [responsive-action-polish]
    paths:
      - ".github/workflows/build-player-runtime.yml"
      - "tools/build_player_runtime_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build_player_runtime_assets.py
      - name: Commit runtime sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player/runtime/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized player runtime sprites"
            git pull --rebase origin responsive-action-polish
            git push
          fi
