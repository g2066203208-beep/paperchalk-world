name: Classroom - landscape gyro Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clean-web-container-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK from hosted runner tools
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse previous debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kiosk-debug-signing-v1
      - name: Assert REAL native fullscreen (not CSS fake landscape)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          source=Path('android/app/src/main/java/com/paperchalk/lampkeep/MainActivity.java').read_text()
          html=Path('site/index.html').read_text()
          assert 'android:screenOrientation="landscape"' in manifest
          for token in ('SCREEN_ORIENTATION_LANDSCAPE','FLAG_FULLSCREEN','SYSTEM_UI_FLAG_IMMERSIVE_STICKY',
                        'SYSTEM_UI_FLAG_HIDE_NAVIGATION','setDecorFitsSystemWindows(false)',
                        'WindowInsets.Type.statusBars()','WindowInsets.Type.navigationBars()',
                        'LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES',
                        'web.setFitsSystemWindows(false)','root.setFitsSystemWindows(false)'):
              assert token in source, token
          assert 'setMargins(safe.left' not in source
          assert 'isNativeApp()' in source
          assert "mobile&&!nativeApp&&innerHeight>innerWidth" in html
          print('PASS: native locked landscape + immersive edge-to-edge WebView, no inset bars')
          PY
      - name: Build APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify compiled APK contains landscape activity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/classroom-manifest.txt
          grep -q 'screenOrientation' /tmp/classroom-manifest.txt
          echo 'PASS: compiled Android manifest includes screenOrientation'
          "$AAPT" dump badging "$APK" | grep 'launchable-activity'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish stable APK download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk classroom-latest-debug.apk
          if ! gh release view classroom-apk-latest >/dev/null 2>&1; then
            gh release create classroom-apk-latest --target "$GITHUB_SHA" --title "Classroom - Landscape Gyroscope APK" --prerelease --notes "Landscape Android app loads the latest GitHub Pages classroom and its independent fog; native rotation sensor bridge is available when supported. Web updates load on app launch."
          fi
          gh release upload classroom-apk-latest classroom-latest-debug.apk --clobber
          gh release edit classroom-apk-latest --notes "APK source: $GITHUB_SHA. Landscape classroom with native gyroscope bridge. Web changes load on app launch; APK code changes require installing the new APK."
