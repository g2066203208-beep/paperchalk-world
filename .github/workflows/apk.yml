name: Classroom - landscape gyro Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clean-web-container-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK from hosted runner tools
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse previous debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kiosk-debug-signing-v1
      - name: Build APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish stable APK download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk classroom-latest-debug.apk
          if ! gh release view classroom-apk-latest >/dev/null 2>&1; then
            gh release create classroom-apk-latest --target "$GITHUB_SHA" --title "Classroom - Landscape Gyroscope APK" --prerelease --notes "Landscape Android app loads the latest GitHub Pages classroom and its independent fog; native rotation sensor bridge is available when supported. Web updates load on app launch."
          fi
          gh release upload classroom-apk-latest classroom-latest-debug.apk --clobber
          gh release edit classroom-apk-latest --notes "APK source: $GITHUB_SHA. Landscape classroom with native gyroscope bridge. Web changes load on app launch; APK code changes require installing the new APK."
