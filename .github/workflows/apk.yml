name: APK - build latest web container
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clean-web-container-apk
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse previous debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kiosk-debug-signing-v1
      - name: Build APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-container-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish stable APK download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk paperworld-latest-debug.apk
          if ! gh release view apk-latest-debug >/dev/null 2>&1; then
            gh release create apk-latest-debug --target "$GITHUB_SHA" --title "Android Web Container - Latest Debug APK" --prerelease --notes "Web content is fetched live from GitHub Pages when the app launches."
          fi
          gh release upload apk-latest-debug paperworld-latest-debug.apk --clobber
          gh release edit apk-latest-debug --notes "APK source: $GITHUB_SHA. Web changes load automatically on app launch; APK code changes require manual installation."
      - name: Remove obsolete APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in studio-latest-debug kiosk-latest-debug mobile-test-v1.1.1 mobile-test-v1.1.0; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
