name: Overworld opening real-browser screenshots
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/game/daily-life-*'
      - 'site/game/overworld*'
      - 'site/game/world-atlas.js'
      - 'site/game/world-map-ui.js'
      - 'site/game/world-map-ui.css'
      - 'tests/world-atlas.test.cjs'
      - 'tests/world-map-browser.mjs'
      - 'site/game/metro-graph.js'
      - 'site/game/scene-environments.js'
      - 'site/game/scene-geometry.js'
      - 'tests/scene-geometry.test.cjs'
      - 'site/game/ring-arena-runtime.js'
      - 'site/game/metro-cabin.js'
      - 'site/game/metro-cabin.css'
      - 'site/assets/metro/side/**'
      - 'tests/scene-environments.test.cjs'
      - 'site/game/metro-side-renderer.js'
      - 'site/assets/metro/side/**'
      - 'tests/metro-master-art.test.cjs'
      - 'tests/metro-graph.test.cjs'
      - 'tests/phone-life.test.cjs'
      - 'site/game/story-content.js'
      - 'site/game/opening-flow.js'
      - 'site/game/phone-ui*'
      - 'site/scene-modules.js'
      - 'site/assets/locations/**'
      - 'tests/overworld-intro-browser.mjs'
      - 'tests/overworld-mobile-browser.mjs'
      - 'tests/transit-map-browser.mjs'
      - 'tests/metro-map-geometry.test.cjs'
      - 'site/game/metro-map-geometry.js'
      - 'site/game/transit-map-ui.js'
      - 'site/game/destination-network.js'
      - 'tests/destination-network.test.cjs'
      - 'site/game/transit-map-ui.css'
      - '.github/workflows/overworld-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paperchalk-overworld-screenshots
  cancel-in-progress: false
jobs:
  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet 'Pillow>=10,<12'
      - name: Generate room catalog only (do not mutate character art)
        run: python3 scripts/build_scene_catalog.py
      - name: Start real game server
        run: |
          python3 -m http.server 8765 --directory site >/tmp/paperchalk-web.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/paperchalk-web.log
          exit 1
      - name: Verify daytime state rules, all places and return journeys
        run: node --test tests/daily-life.test.cjs tests/metro-graph.test.cjs tests/metro-map-geometry.test.cjs tests/phone-life.test.cjs tests/world-atlas.test.cjs tests/destination-network.test.cjs tests/metro-master-art.test.cjs tests/scene-environments.test.cjs tests/scene-geometry.test.cjs
      # Capture map screens first: a slow 3D subway regression must not hide
      # the actual new transport-map view from designers.
      - name: Capture ten-city map with large pinned station photographs
        run: node tests/world-map-browser.mjs
      - name: Capture city metro routes, real cabin and subway arrival
        run: node tests/transit-map-browser.mjs
      # Both renderers share the actual state, place callbacks and staged scene.
      # Regression screenshots verify the city metro and intercity atlas together.
      - name: Make review overview from real browser frames
        if: success()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          shots=sorted(Path('artifacts/overworld').glob('[0-9][0-9]-*.png'))
          assert len(shots)>=6, f'Expected 6 actual regional map browser screens, got {shots}'
          labels=[p.stem.replace('-', ' ').upper() for p in shots]
          w,h=690,388
          rows=(len(shots)+1)//2
          board=Image.new('RGB',(2*w+54,rows*(h+46)+20),'#161b22')
          draw=ImageDraw.Draw(board)
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',17)
          except OSError: font=ImageFont.load_default()
          for i,shot in enumerate(shots):
              im=Image.open(shot).convert('RGB');im.thumbnail((w,h),Image.Resampling.LANCZOS)
              x=18+(i%2)*(w+18);y=12+(i//2)*(h+46)
              draw.text((x,y),labels[i],font=font,fill='#e7e1d8')
              board.paste(im,(x,y+27))
          board.save('artifacts/overworld/00-overview-contact.png',optimize=True)
          PY
      - name: Upload unaltered browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-regional-atlas-actual-chromium
          path: artifacts/overworld/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve screenshots for GitHub review
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/screenshots/overworld
          cp artifacts/overworld/*.png docs/screenshots/overworld/
          # Text transport allows the exact real screenshot to be surfaced
          # inline in review tools without an inaccessible binary fetch.
          base64 -w0 artifacts/overworld/00-overview-contact.png > docs/screenshots/overworld/00-overview-contact.base64.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/overworld/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: capture real overworld opening screenshots"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
