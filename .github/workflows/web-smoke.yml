name: Visual Demo Main Static Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "visual-demo.html"
      - "legacy-main.html"
      - "tests/demo-main-smoke.mjs"
      - "package.json"
      - ".github/workflows/web-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "visual-demo.html"
      - "tests/demo-main-smoke.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: npm test
