name: Web 3D Static Smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/web-smoke.js"
      - "tests/performance-budget.mjs"
      - ".github/workflows/web-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "styles/**"
      - "tests/web-smoke.js"
      - "tests/performance-budget.mjs"
      - ".github/workflows/web-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: node tests/web-smoke.js
      - run: node tests/performance-budget.mjs
