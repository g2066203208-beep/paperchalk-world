<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>纸艺世界 · 最新测试版</title>
<style>
body{margin:0;background:#f4f1e8;color:#30372d;font:16px/1.7 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{padding:32px;max-width:520px}h1{font-size:25px}button,a{font:inherit}button{padding:10px 20px;border:0;border-radius:8px;background:#66794d;color:white;cursor:pointer}a{color:#465735}small{color:#747c68}[hidden]{display:none}
</style>
<main><h1>纸艺世界 · 测试版</h1><p id="status" role="status">正在检查最新发布的内容…</p><button id="retry" hidden>重新检查</button><p><a href="https://github.com/g2066203208-beep/paperchalk-world/releases/tag/mobile-test-v1.1.1">获取 Android 测试版 1.1.1</a></p><small>只加载已经成功发布的完整版本。Android 测试版启动时也会自动检查。</small></main>
<script type="module">
const status=document.getElementById('status'),retry=document.getElementById('retry');
async function openLatest(){
  retry.hidden=true;status.textContent='正在检查最新发布的内容…';
  const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),12000);
  try{
    const response=await fetch('./channel.json?check='+Date.now(),{cache:'no-store',signal:abort.signal});
    if(!response.ok)throw Error('频道暂不可用，请稍后重试');
    const data=await response.json();
    if(data.schemaVersion!==1||!(/^[0-9a-f]{7,40}$/).test(data.version)||data.entry!==`releases/${data.version}/studio/index.html`)throw Error('发布信息不完整，请稍后重试');
    const target=new URL(data.entry,new URL('./',location.href));
    if(target.origin!==location.origin)throw Error('发布地址不正确');
    target.searchParams.set('play','1');
    status.textContent='正在打开版本 '+data.version.slice(0,8)+'…';
    location.replace(target.href);
  }catch(error){status.textContent=error.name==='AbortError'?'连接超时，请检查网络后重试':error.message;retry.hidden=false;}
  finally{clearTimeout(timer);}
}
retry.addEventListener('click',openLatest);openLatest();
</script>
</html>
