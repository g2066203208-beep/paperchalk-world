<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8cfbb">
<title>Paperchalk World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8cfbb}
body{font-family:"Noto Serif SC","Songti SC",serif}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.22),transparent 44%),#d8cfbb}
.paper{position:absolute;inset:0;opacity:.08;pointer-events:none;background:repeating-linear-gradient(13deg,rgba(255,255,255,.13) 0 1px,transparent 1px 8px),repeating-linear-gradient(-17deg,rgba(65,45,25,.05) 0 1px,transparent 1px 9px)}
.road{position:absolute;left:-5%;right:-5%;bottom:10vh;height:min(23vh,220px);background:url("./assets/road.webp") repeat-x 0 50%/auto 100%;will-change:background-position}
.walker-wrap{position:absolute;left:35%;bottom:18.2vh;width:min(17vw,190px);transform-origin:50% 100%;animation:body-sway 1.15s ease-in-out infinite}
.walker{display:block;width:100%;height:auto;transform-origin:50% 91%;filter:drop-shadow(4px 8px 4px rgba(65,43,24,.18));animation:cute-step .58s cubic-bezier(.45,0,.55,1) infinite}
.shadow{position:absolute;left:50%;bottom:-5px;width:52%;height:10px;transform:translateX(-50%);border-radius:50%;background:rgba(62,43,26,.18);filter:blur(5px);animation:shadow-step .58s ease-in-out infinite}
.caption{position:absolute;left:50%;bottom:5.6vh;transform:translateX(-50%);color:rgba(62,48,34,.58);font-size:clamp(11px,1.1vw,14px);letter-spacing:.18em;white-space:nowrap}
@keyframes body-sway{0%,100%{transform:translateX(-50%) rotate(-1.35deg)}50%{transform:translateX(-50%) rotate(1.35deg)}}
@keyframes cute-step{0%,100%{transform:translateY(0) rotate(-2.6deg) scale(1)}24%{transform:translate(3px,-9px) rotate(.8deg) scale(.983,1.022)}50%{transform:translate(5px,-1px) rotate(2.8deg) scale(1.02,.985)}76%{transform:translate(2px,-8px) rotate(-.7deg) scale(.989,1.018)}}
@keyframes shadow-step{0%,50%,100%{transform:translateX(-50%) scaleX(1);opacity:.78}25%,75%{transform:translateX(-50%) scaleX(.84);opacity:.50}}
@media(max-width:760px){.walker-wrap{left:31%;width:min(31vw,150px);bottom:17.8vh}.road{height:20vh}.caption{bottom:4.8vh}}
</style>
</head>
<body>
<main class="stage" aria-label="Paperchalk World road walk preview">
  <div class="paper"></div>
  <div id="road" class="road"></div>
  <div class="walker-wrap">
    <div class="shadow"></div>
    <img class="walker" src="./assets/traveler.webp" alt="行走中的旅行者">
  </div>
  <div class="caption">沿旧驿道前行</div>
</main>
<script>
const road=document.getElementById('road');
let last=performance.now(),x=0;
function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;x-=165*dt;road.style.backgroundPositionX=x+'px';requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
</body>
</html>
