<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#28251f">\n<link rel="icon" href="data:,">\n<title>Paperchalk World</title>
<style>
:root{
  --ink:#3f392f;
  --ink-soft:#716858;
  --paper:#e9dfca;
  --paper-deep:#d9c9a9;
  --line:#8b7654;
  --dark:#29261f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#28251f}
body{font-family:"Noto Serif SC","Songti SC","STSong",serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- WORLD ---------- */
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#e8dfcf}
.world-layer{position:absolute;left:0;right:0;pointer-events:none;overflow:hidden}
.track{position:absolute;left:0;top:0;height:100%;will-change:transform}
.road-layer{bottom:2.5vh;height:300px;z-index:3}
.road-track{display:flex;height:100%}
.road-tile{height:100%;width:auto;display:block;flex:none;margin-right:-1px}
.rear-layer{bottom:2.5vh;height:300px;z-index:4}
.front-layer{bottom:2.5vh;height:300px;z-index:6}
.prop-track{width:5000px;height:100%;position:absolute;left:0;top:0}
.prop{
  position:absolute;
  aspect-ratio:120/108;
  transform-origin:50% 88%;
  will-change:transform;
  background-image:var(--mid-atlas,none);
  background-size:300% 200%;
  background-repeat:no-repeat;
  filter:saturate(.90) contrast(.97) brightness(.99);
  pointer-events:none;
}
.sway-a{animation:swayA 3.9s ease-in-out infinite}
.sway-b{animation:swayB 4.8s ease-in-out infinite}
.sway-c{animation:swayC 5.6s ease-in-out infinite}
.sway-d{animation:swayD 4.3s ease-in-out infinite}
.static{animation:none}
@keyframes swayA{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.8deg)}}
@keyframes swayB{0%,100%{transform:rotate(1.8deg)}50%{transform:rotate(-3.1deg)}}
@keyframes swayC{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2.2deg)}}
@keyframes swayD{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-1.9deg)}}
.actor{
  --facing:1;
  position:absolute;left:35%;bottom:112px;width:126px;z-index:5;
  transform:translateX(-50%);pointer-events:none;will-change:left;
}
.actor.facing-left{--facing:-1}
.walker{
  position:relative;z-index:2;display:block;width:100%;height:auto;
  transform-origin:52% 96%;will-change:transform;
  transform:scaleX(var(--facing));
}
.actor.is-moving .walker{animation:walk-cycle var(--walk-duration,.62s) ease-in-out infinite}
.foot-shadow{
  position:absolute;z-index:1;left:53%;bottom:6px;width:76px;height:17px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(49,37,25,.42) 0%,rgba(49,37,25,.27) 38%,rgba(49,37,25,.10) 61%,rgba(49,37,25,0) 79%);
  filter:blur(2px);transform:translateX(-50%);opacity:.72;
}
.actor.is-moving .foot-shadow{animation:shadow-cycle var(--walk-duration,.62s) ease-in-out infinite}
@keyframes walk-cycle{
  0%,100%{transform:translate3d(0,0,0) rotate(-.8deg) scaleX(var(--facing))}
  25%{transform:translate3d(.5px,-2.2px,0) rotate(.3deg) scaleX(var(--facing))}
  50%{transform:translate3d(1px,-.35px,0) rotate(.8deg) scaleX(var(--facing))}
  75%{transform:translate3d(.5px,-1.8px,0) rotate(-.2deg) scaleX(var(--facing))}
}
@keyframes shadow-cycle{
  0%,50%,100%{transform:translateX(-50%) scaleX(1.06);opacity:.88}
  25%,75%{transform:translateX(-50%) scaleX(.88);opacity:.52}
}
.rear-layer .prop{bottom:128px}
.front-layer .prop{bottom:96px}

/* tiny in-world menu tab */
.world-menu-btn{
  position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
  width:46px;height:38px;border:0;background:rgba(239,227,203,.86);color:#4c4336;
  box-shadow:0 2px 9px rgba(44,35,25,.16);border-radius:5px;
  font-size:22px;line-height:38px;padding:0;
}


/* responsive movement controls */
.joystick-zone{
  position:absolute;z-index:28;left:0;bottom:0;width:56%;height:66%;
  display:none;touch-action:none;user-select:none;-webkit-user-select:none;
}
.joystick{
  --joy-x:0px;--joy-y:0px;
  position:absolute;left:50%;top:50%;width:118px;height:118px;
  transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;
  transition:opacity .10s ease;
}
.joystick.is-active{opacity:1}
.joystick-base{
  position:absolute;inset:0;
  border-radius:48% 52% 46% 54% / 53% 47% 55% 45%;
  background:rgba(218,200,163,.48);
  border:2px solid rgba(91,70,44,.32);
  box-shadow:
    inset 0 0 0 7px rgba(243,230,199,.16),
    4px 6px 0 rgba(67,50,30,.08);
  transform:rotate(-2deg);
}
.joystick-base::before{
  content:"";position:absolute;inset:15px;
  border:1px dashed rgba(88,67,42,.24);
  border-radius:52% 48% 55% 45% / 47% 53% 46% 54%;
}
.joystick-knob{
  position:absolute;left:50%;top:50%;width:58px;height:58px;
  margin-left:-29px;margin-top:-29px;
  transform:translate(var(--joy-x),var(--joy-y)) rotate(1.5deg);
  border-radius:47% 53% 51% 49% / 54% 46% 52% 48%;
  background:rgba(235,220,187,.94);
  border:2px solid rgba(80,61,39,.34);
  box-shadow:4px 5px 0 rgba(61,47,30,.13),inset 0 0 0 5px rgba(255,247,226,.22);
  will-change:transform;
}
.joystick-knob::after{
  content:"";position:absolute;inset:17px;border-radius:50%;
  background:rgba(96,74,47,.25);
}
.joystick-hint{
  position:absolute;left:18px;bottom:max(12px,env(safe-area-inset-bottom));
  display:none;color:#6d604d;font-size:11px;letter-spacing:.08em;
  background:rgba(224,207,171,.55);padding:5px 9px;
  clip-path:polygon(3% 0,98% 5%,100% 88%,95% 100%,1% 95%,0 9%);
  pointer-events:none;
}
.desktop-control-hint{
  position:absolute;z-index:27;left:18px;bottom:18px;display:none;
  padding:7px 12px;background:rgba(225,209,175,.78);color:#675a48;font-size:12px;letter-spacing:.08em;
  clip-path:polygon(2% 4%,98% 0,100% 90%,95% 100%,1% 96%,0 9%);
  filter:drop-shadow(2px 3px 0 rgba(61,47,30,.08));pointer-events:none;
}
@media (hover:none), (pointer:coarse){
  .joystick-zone{display:block}
  .joystick-hint{display:block}
}
@media (hover:hover) and (pointer:fine){
  .desktop-control-hint{display:block}
}

/* ---------- CUT-PAPER UI ---------- */
.ui-shell{
  position:fixed;inset:0;z-index:100;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.035),transparent 30%),
    #27241e;
  display:flex;align-items:stretch;justify-content:center;
  transition:opacity .28s ease;
}
.ui-shell.is-hidden{opacity:0;pointer-events:none}

.ui-board{
  position:relative;width:min(100%,1180px);height:100%;overflow:hidden;
  background:#cdbf9f;
  box-shadow:0 0 40px rgba(0,0,0,.5);
  clip-path:polygon(1.2% 0,98.8% .7%,100% 98.5%,98.6% 100%,1.3% 99.4%,0 1.8%);
}
.ui-shell.board-enter .ui-board{animation:boardIn .46s cubic-bezier(.21,.8,.31,1)}
@keyframes boardIn{from{transform:translateY(-104%)}to{transform:translateY(0)}}

.ui-board::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 27%),
    radial-gradient(circle at 74% 68%,rgba(96,72,42,.11),transparent 35%),
    repeating-linear-gradient(8deg,rgba(80,61,36,.11) 0 1px,transparent 1px 8px),
    repeating-linear-gradient(-13deg,rgba(255,255,255,.12) 0 1px,transparent 1px 11px);
}
.ui-board::after{
  content:"";position:absolute;inset:14px;pointer-events:none;opacity:.8;
  border:2px solid rgba(78,60,38,.18);
  clip-path:polygon(1% 0,99% 1%,100% 98%,98.7% 100%,.7% 99%,0 2%);
}

.ui-page{position:absolute;inset:0;display:none}
.ui-page.active{display:block}

/* left title card + right loose paper strips */
.menu-layout{
  position:relative;z-index:2;height:100%;display:grid;
  grid-template-columns:minmax(300px,44%) 1fr;
}
.brand{
  position:relative;
  margin:5.5vh 2.4vw 5vh 4vw;
  padding:4.5vh 3.5vw;
  display:flex;flex-direction:column;justify-content:space-between;
  background:#e6d8b9;
  clip-path:polygon(2% 1%,98.5% 0,100% 4%,98.8% 96%,96% 100%,2.2% 99%,0 95%,1% 5%);
  filter:drop-shadow(7px 9px 0 rgba(72,53,31,.12));
  transform:rotate(-.45deg);
}
.brand::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;
  background:
    repeating-linear-gradient(11deg,rgba(96,71,39,.13) 0 1px,transparent 1px 9px),
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.38),transparent 35%);
}
.brand-mark{position:relative;z-index:1;font-size:clamp(12px,1.1vw,16px);letter-spacing:.36em;color:#746650}
.brand h1{
  position:relative;z-index:1;margin:0;font-weight:500;line-height:.92;
  font-size:clamp(52px,8vw,112px);letter-spacing:-.06em;color:#443b30;
  text-shadow:1px 1px 0 rgba(255,255,255,.28);
}
.brand h1 span{display:block;font-size:.24em;letter-spacing:.3em;margin-top:18px;color:#766853}
.brand-foot{position:relative;z-index:1;font-size:12px;letter-spacing:.12em;color:#80725e}

.menu-panel{display:flex;align-items:center;justify-content:center;padding:6vh 5vw}
.menu-stack{width:min(430px,90%);display:flex;flex-direction:column;gap:13px}
.profile-note{
  align-self:flex-start;
  min-height:30px;padding:7px 14px 8px;
  background:#d7c59f;color:#665943;font-size:13px;
  clip-path:polygon(2% 3%,98% 0,100% 91%,96% 100%,1% 97%,0 10%);
  transform:rotate(-.35deg);
  filter:drop-shadow(3px 4px 0 rgba(73,55,32,.1));
}

.menu-btn{
  position:relative;width:100%;border:0;text-align:left;
  padding:15px 20px 14px 24px;
  color:#493f33;background:#e7d9ba;
  font-size:clamp(18px,2vw,24px);letter-spacing:.12em;
  clip-path:polygon(1.2% 7%,96.5% 0,100% 11%,98.8% 91%,95% 100%,1% 95%,0 13%);
  filter:drop-shadow(5px 6px 0 rgba(70,52,31,.13));
  transition:transform .12s ease,filter .12s ease,background .12s ease;
}
.menu-btn:nth-of-type(2){transform:rotate(.45deg)}
.menu-btn:nth-of-type(3){transform:rotate(-.35deg)}
.menu-btn:nth-of-type(4){transform:rotate(.25deg)}
.menu-btn::before{
  content:"";position:absolute;left:10px;top:50%;width:5px;height:55%;transform:translateY(-50%) rotate(4deg);
  background:rgba(91,69,42,.22);border-radius:50%;
}
.menu-btn::after{content:"›";position:absolute;right:17px;opacity:.42}
.menu-btn:hover,.menu-btn:active{
  background:#efe1c3;
  filter:drop-shadow(2px 3px 0 rgba(70,52,31,.18));
  translate:2px 2px;
}
.menu-btn.secondary{font-size:15px;color:#70634f;background:#dcccad}
.menu-btn.secondary::after{display:none}

/* auth/settings as layered torn-paper cards */
.auth-wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:26px}
.auth-card{
  position:relative;width:min(540px,92vw);padding:36px 40px 34px;
  background:#e7d9ba;
  clip-path:polygon(2% 1%,97% 0,100% 5%,98.8% 96%,95% 100%,2% 99%,0 95%,1% 5%);
  filter:drop-shadow(8px 10px 0 rgba(66,49,30,.14));
}
.auth-card::before{
  content:"";position:absolute;inset:-10px 18px 16px -10px;z-index:-1;
  background:#c9b487;opacity:.85;
  clip-path:polygon(1% 2%,98% 0,100% 96%,96% 100%,2% 98%,0 4%);
  transform:rotate(-1.2deg);
}
.auth-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;
  background:repeating-linear-gradient(12deg,rgba(86,65,38,.11) 0 1px,transparent 1px 8px);
}
.auth-title{position:relative;z-index:1;font-size:31px;letter-spacing:.16em;margin:0 0 8px;font-weight:500}
.auth-sub{position:relative;z-index:1;font-size:13px;color:#796c58;margin:0 0 22px;line-height:1.65}

.tabs{position:relative;z-index:1;display:flex;gap:8px;margin-bottom:20px}
.tab{
  border:0;padding:9px 18px;color:#776956;background:#d8c49d;
  clip-path:polygon(3% 0,97% 4%,100% 92%,95% 100%,1% 96%,0 8%);
  transform:rotate(-.4deg);
}
.tab:nth-child(2){transform:rotate(.5deg)}
.tab.active{color:#40372d;background:#f0e2c4;filter:drop-shadow(2px 3px 0 rgba(66,49,30,.11))}

.field{position:relative;z-index:1;margin:14px 0}
.field label{
  display:inline-block;font-size:12px;color:#70624f;margin:0 0 6px 5px;letter-spacing:.08em;
  background:#d6c39c;padding:3px 8px;
  clip-path:polygon(2% 0,100% 4%,97% 100%,0 96%);
}
.field input{
  width:100%;height:45px;border:0;outline:none;
  background:#f4ead3;color:#40382e;padding:0 14px;
  clip-path:polygon(1% 3%,99% 0,100% 92%,98% 100%,1% 97%,0 9%);
  box-shadow:inset 0 0 0 1px rgba(80,61,39,.18);
}
.field input:focus{background:#fff3dc;box-shadow:inset 0 0 0 2px rgba(103,78,47,.34)}

.auth-actions{position:relative;z-index:1;display:flex;gap:12px;margin-top:22px}
.paper-btn{
  min-width:124px;border:0;padding:11px 19px;color:#efe4cd;background:#504638;
  clip-path:polygon(3% 0,98% 4%,100% 90%,95% 100%,1% 96%,0 8%);
  filter:drop-shadow(3px 4px 0 rgba(62,46,28,.13));
  letter-spacing:.1em;
}
.paper-btn.ghost{background:#d7c39c;color:#564a3b}
.auth-msg{position:relative;z-index:1;min-height:22px;margin-top:13px;font-size:13px;color:#8b4c42}

.back-link{
  position:absolute;z-index:5;top:24px;left:28px;border:0;background:#d9c69e;color:#5e5241;
  padding:9px 14px;font-size:15px;
  clip-path:polygon(2% 0,98% 3%,100% 91%,96% 100%,1% 96%,0 8%);
  filter:drop-shadow(3px 4px 0 rgba(63,47,29,.11));
}

.settings-list{position:relative;z-index:1;display:grid;gap:13px;margin-top:22px}
.setting-row{
  display:flex;justify-content:space-between;align-items:center;
  background:#f0e2c5;padding:12px 14px;
  clip-path:polygon(1% 3%,99% 0,100% 92%,97% 100%,1% 96%,0 8%);
  color:#54493a;
}
.setting-row:nth-child(even){transform:rotate(.25deg)}
.setting-row select{
  max-width:58%;border:0;border-bottom:1px solid rgba(77,64,48,.35);
  background:rgba(245,235,213,.55);color:#4f4639;padding:5px 8px;border-radius:4px;
}
.setting-row input[type="checkbox"]{width:20px;height:20px;accent-color:#6e604c}
.settings-status{position:relative;z-index:2;min-height:20px;margin-top:10px;text-align:center;color:#665948;font-size:12px}
.orientation-hint{
  position:fixed;inset:0;z-index:170;display:none;align-items:center;justify-content:center;
  text-align:center;background:rgba(39,36,30,.96);color:#efe5d0;font-size:24px;letter-spacing:.12em;
}
.orientation-hint span{font-size:13px;letter-spacing:.08em;color:#cdbf9f}
@media (orientation:portrait) and (max-width:800px) and (pointer:coarse){
  body.prefer-landscape .orientation-hint{display:flex}
}

/* in-world UI itself is also a paper tab */
.world-menu-btn{
  position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
  width:52px;height:42px;border:0;padding:0;
  background:#e5d6b6;color:#504638;font-size:23px;line-height:42px;
  clip-path:polygon(6% 0,96% 5%,100% 86%,91% 100%,4% 94%,0 10%);
  filter:drop-shadow(4px 5px 0 rgba(61,47,30,.14));
}
@media(max-width:800px){
  .road-layer{bottom:2vh;height:220px}
  .rear-layer,.front-layer{bottom:2vh;height:220px}
  .rear-layer .prop{bottom:96px}
  .front-layer .prop{bottom:78px}
  .actor{left:34%;bottom:82px;width:106px}
  .foot-shadow{width:48px;height:11px;bottom:5px}
  .rear-layer .prop{scale:.80}
  .front-layer .prop{scale:.84}
  .menu-layout{grid-template-columns:42% 58%}
  .brand{padding:8vh 4vw 4vh}
  .menu-panel{padding:5vh 4vw}
  .menu-btn{padding:11px 10px 10px;font-size:17px}
  .brand h1{font-size:clamp(44px,9vw,72px)}
  .auth-card{padding:24px 28px}
}
@media(max-height:520px){
  .brand{padding-top:6vh}
  .menu-stack{gap:4px}
  .menu-btn{padding-top:9px;padding-bottom:9px}
  .auth-card{padding:18px 28px}
  .field{margin:9px 0}
  .field input{height:38px}
}

/* ---------- PAPERCHALK UI ATLAS V1 : generated from the FIRST approved sheet ---------- */
:root{--ui-atlas:url("./assets/ui/paperchalk-ui-atlas-v1.webp?v=1")}

/* Main board: keep the game dark behind actual painted paper pieces */
.ui-shell{background:#2b2822!important}
.ui-board{
  background:linear-gradient(180deg,#d8ccb2 0%,#c9b894 100%)!important;
  clip-path:polygon(.8% 0,99% .5%,100% 98.8%,98.8% 100%,.7% 99.4%,0 1.1%)!important;
}
.ui-board::before{opacity:.08!important}
.ui-board::after{display:none!important}

/* Main title is now an actual painted cut-paper panel from sheet #1 */
.brand{
  align-self:center!important;
  justify-self:center!important;
  width:min(520px,40vw)!important;
  height:auto!important;
  aspect-ratio:520/266!important;
  margin:0!important;
  padding:23% 12% 10%!important;
  background-color:transparent!important;
  background-image:var(--ui-atlas)!important;
  background-repeat:no-repeat!important;
  background-size:196.923% 210.526%!important;
  background-position:0% 0%!important;
  clip-path:none!important;
  filter:drop-shadow(7px 9px 0 rgba(54,42,29,.12))!important;
  transform:rotate(-.35deg)!important;
}
.brand::after{display:none!important}
.brand-mark{
  position:absolute!important;left:12%!important;top:18%!important;
  color:#6c604e!important;font-size:clamp(10px,1vw,14px)!important;
}
.brand h1{
  color:#4a4237!important;
  font-size:clamp(38px,5.8vw,78px)!important;
  line-height:.94!important;
  text-align:center!important;
  text-shadow:none!important;
}
.brand h1 span{font-size:.22em!important;margin-top:12px!important;letter-spacing:.22em!important}
.brand-foot{
  position:absolute!important;left:12%!important;right:12%!important;bottom:9%!important;
  text-align:center!important;color:#756957!important;font-size:10px!important;
}

/* Real painted button strips from sheet #1 */
.menu-stack{gap:9px!important;width:min(390px,92%)!important}
.menu-btn{
  min-height:58px!important;
  padding:0 54px 0 30px!important;
  display:flex!important;align-items:center!important;
  border:0!important;background-color:transparent!important;
  background-image:var(--ui-atlas)!important;
  background-repeat:no-repeat!important;
  clip-path:none!important;
  filter:drop-shadow(3px 4px 0 rgba(58,44,29,.10))!important;
  color:#eee3ca!important;
  font-size:clamp(16px,1.7vw,21px)!important;
  letter-spacing:.10em!important;
  transform:none!important;
}
.menu-btn::before{display:none!important}
.menu-btn::after{right:28px!important;color:#e7dbc1!important;opacity:.72!important}
.menu-btn:nth-of-type(1),.menu-btn:nth-of-type(4){
  background-size:403.150% 736.842%!important;
  background-position:0% 58.884%!important;
}
.menu-btn:nth-of-type(2){
  background-size:435.745% 736.842%!important;
  background-position:33.587% 58.884%!important;
  color:#52483a!important;
}
.menu-btn:nth-of-type(3){
  background-size:432.068% 736.842%!important;
  background-position:64.803% 58.884%!important;
}
.menu-btn:hover,.menu-btn:active{translate:1px 2px!important;filter:drop-shadow(1px 2px 0 rgba(58,44,29,.12))!important}
.profile-note{
  background-image:var(--ui-atlas)!important;background-repeat:no-repeat!important;
  background-size:401.569% 682.927%!important;background-position:52.016% 78.452%!important;
  background-color:transparent!important;clip-path:none!important;filter:none!important;
  color:#ede4cf!important;min-width:180px!important;text-align:center!important;
}

/* Login / register / settings use the painted hanging paper card */
.auth-card{
  width:min(430px,48vw)!important;
  min-height:min(470px,82vh)!important;
  padding:68px 48px 42px!important;
  border:0!important;background-color:transparent!important;
  background-image:var(--ui-atlas)!important;
  background-repeat:no-repeat!important;
  background-size:424.896% 210.526%!important;

  {s:1,x:1010,w:100,c:'sway-c'},

const front=[

  {s:5,x:1270,w:98,c:'sway-a'},

];

function spritePosition(index){
  const col=index%3,row=Math.floor(index/3);
  return (col*50)+'% '+(row*100)+'%';
}
function buildProps(id,data){
  const root=document.getElementById(id);
  for(let rep=0;rep<3;rep++){
    data.forEach((p,i)=>{
      const el=document.createElement('div');
      el.className='prop '+p.c;
      el.style.left=(rep*2200+p.x)+'px';
      el.style.width=p.w+'px';
      el.style.backgroundPosition=spritePosition(p.s);
      el.style.animationDelay=(-((i*.71+rep*.43)%4.8))+'s';
      root.appendChild(el);
    });
  }
}
buildProps('rearTrack',rear);
buildProps('frontTrack',front);

async function loadMidgroundAtlas(){
  try{
    const parts=await Promise.all([0,1,2,3].map(async i=>{
      const r=await fetch('./assets/midground-preview/p'+i+'.txt?v=2',{cache:'no-store'});
      if(!r.ok)throw new Error('atlas part '+i+' '+r.status);
      return (await r.text()).trim();
    }));
    const uri='data:image/webp;base64,'+parts.join('');
    document.documentElement.style.setProperty('--mid-atlas','url("'+uri+'")');
    document.documentElement.dataset.midground='ready';
  }catch(err){
    console.error('MIDGROUND_ATLAS_FAILED',err);
    document.documentElement.dataset.midground='failed';
  }
}

let worldMinutes=0;
let worldTimeScale=1;
let actorX=Math.round(innerWidth*.35);
let keyboardLeft=false,keyboardRight=false;
let joystickAxis=0;
let joystickPointer=null;
let joystickOriginX=0,joystickOriginY=0;
let facing=1;

function refreshRoadW(){
  const w=roadTile.getBoundingClientRect().width;
  if(w>0)roadW=w-1;
  actorX=Math.max(innerWidth*.12,Math.min(innerWidth*.82,actorX));
  actorEl.style.left=actorX+'px';
}
roadTile.addEventListener('load',refreshRoadW);
addEventListener('resize',refreshRoadW);
refreshRoadW();

function posMod(v,m){return ((v%m)+m)%m}
function worldInteractive(){
  const shell=document.getElementById('uiShell');
  return !!shell
    && shell.classList.contains('is-hidden')
    && !backpackOverlay.classList.contains('is-open');
}
function movementAxis(){
  if(keyboardLeft!==keyboardRight)return keyboardLeft?-1:1;
  return joystickAxis;
}
function setFacing(dir){
  if(!dir)return;
  facing=dir;
  actorEl.classList.toggle('facing-left',dir<0);
}
function renderWorld(){
  const roadOffset=posMod(worldX,roadW);
  const rearOffset=posMod(worldX*.97,2200);
  const frontOffset=posMod(worldX*1.03,2200);
  roadTrack.style.transform='translate3d('+(-roadOffset)+'px,0,0)';
  rearTrack.style.transform='translate3d('+(-rearOffset)+'px,0,0)';
  frontTrack.style.transform='translate3d('+(-frontOffset)+'px,0,0)';
  actorEl.style.left=actorX+'px';
}
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const interactive=worldInteractive();
  if(interactive && worldTimeScale>0)worldMinutes+=dt*worldTimeScale;
  const axis=interactive?movementAxis():0;
  const magnitude=Math.abs(axis);
  const moving=magnitude>.02;
  actorEl.classList.toggle('is-moving',moving);

  if(moving){
    const dir=Math.sign(axis);
    setFacing(dir);
    const maxSpeed=Math.max(155,Math.min(250,innerWidth*.19));
    const speed=maxSpeed*magnitude;
    actorEl.style.setProperty('--walk-duration',(0.90-0.34*magnitude).toFixed(2)+'s');
    let dx=dir*speed*dt;
    const leftFollow=innerWidth*.30;
    const rightFollow=innerWidth*.56;

    if(dir>0){
      const room=Math.max(0,rightFollow-actorX);
      const actorStep=Math.min(dx,room);
      actorX+=actorStep;
      dx-=actorStep;
      worldX+=dx;
    }else{
      const room=Math.max(0,actorX-leftFollow);
      const actorStep=Math.max(dx,-room);
      actorX+=actorStep;
      dx-=actorStep;
      worldX+=dx;
    }
  }
  renderWorld();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function isEditableTarget(target){
  return target instanceof HTMLElement &&
    (target.matches('input,textarea,select,[contenteditable="true"]'));
}
addEventListener('keydown',e=>{
  if(isEditableTarget(e.target)||!worldInteractive())return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keyboardLeft=true;e.preventDefault()}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keyboardRight=true;e.preventDefault()}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keyboardLeft=false;e.preventDefault()}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keyboardRight=false;e.preventDefault()}
});
function resetJoystick(){
  joystickAxis=0;
  joystickPointer=null;
  joystickEl.classList.remove('is-active');
  joystickEl.style.setProperty('--joy-x','0px');
  joystickEl.style.setProperty('--joy-y','0px');
}
addEventListener('blur',()=>{
  keyboardLeft=keyboardRight=false;
  resetJoystick();
});

const JOY_RADIUS=39;
const JOY_DEADZONE=.14;

function updateJoystick(clientX,clientY){
  let dx=clientX-joystickOriginX;
  let dy=clientY-joystickOriginY;
  const distance=Math.hypot(dx,dy);
  if(distance>JOY_RADIUS){
    const scale=JOY_RADIUS/distance;
    dx*=scale;dy*=scale;
  }
  joystickEl.style.setProperty('--joy-x',dx.toFixed(1)+'px');
  joystickEl.style.setProperty('--joy-y',dy.toFixed(1)+'px');

  const raw=dx/JOY_RADIUS;
  const a=Math.abs(raw);
  joystickAxis=a<=JOY_DEADZONE?0:Math.sign(raw)*Math.min(1,(a-JOY_DEADZONE)/(1-JOY_DEADZONE));
}
joystickZone.addEventListener('pointerdown',e=>{
  if(!worldInteractive()||joystickPointer!==null)return;
  e.preventDefault();
  joystickPointer=e.pointerId;

  const rect=joystickZone.getBoundingClientRect();
  const pad=62;
  joystickOriginX=Math.max(rect.left+pad,Math.min(rect.right-pad,e.clientX));
  joystickOriginY=Math.max(rect.top+pad,Math.min(rect.bottom-pad,e.clientY));

  joystickEl.style.left=(joystickOriginX-rect.left)+'px';
  joystickEl.style.top=(joystickOriginY-rect.top)+'px';
  joystickEl.classList.add('is-active');
  try{joystickZone.setPointerCapture(e.pointerId)}catch{}
  updateJoystick(e.clientX,e.clientY);
});
joystickZone.addEventListener('pointermove',e=>{
  if(e.pointerId!==joystickPointer)return;
  e.preventDefault();
  updateJoystick(e.clientX,e.clientY);
});
function endJoystick(e){
  if(e.pointerId!==joystickPointer)return;
  e.preventDefault();
  resetJoystick();
}
joystickZone.addEventListener('pointerup',endJoystick);
joystickZone.addEventListener('pointercancel',endJoystick);
joystickZone.addEventListener('lostpointercapture',e=>{
  if(e.pointerId===joystickPointer)resetJoystick();
});

/* reusable paper UI transition
   Any current/future UI can call:
   paperUIFrom(clickedElement, revealFunction, targetElement)
*/
let paperUIBusy=false;

function paperFxOrigin(triggerEl){
  if(triggerEl && typeof triggerEl.getBoundingClientRect==='function'){
    const r=triggerEl.getBoundingClientRect();
    if(r.width||r.height)return {x:r.left+r.width/2,y:r.top+r.height/2};
  }
  return {x:innerWidth*.5,y:innerHeight*.5};
}
function setPaperFxAt(el,x,y,size){
  el.style.left=(x-size/2)+'px';
  el.style.top=(y-size/2)+'px';
}
async function paperUIFrom(triggerEl,revealFn,targetEl){
  if(typeof revealFn!=='function')return;
  if(paperUIBusy){revealFn();return}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){revealFn();return}

  paperUIBusy=true;
  const origin=paperFxOrigin(triggerEl);
  const center={x:innerWidth*.5,y:innerHeight*.5};
  const ballSize=Math.max(54,Math.min(84,innerWidth*.062));
  const unfoldSize=Math.max(150,Math.min(290,innerWidth*.20));
  let flight=null,unfold=null,targetAnim=null;

  paperFxBall.getAnimations().forEach(a=>a.cancel());
  paperFxUnfold.getAnimations().forEach(a=>a.cancel());
  if(targetEl)targetEl.getAnimations().forEach(a=>a.cancel());
  paperFxBall.style.opacity='1';
  paperFxUnfold.style.opacity='0';
  setPaperFxAt(paperFxBall,origin.x,origin.y,ballSize);
  setPaperFxAt(paperFxUnfold,center.x,center.y,unfoldSize);

  const dx=center.x-origin.x;
  const dy=center.y-origin.y;
  const arc=-Math.min(74,Math.max(24,Math.abs(dx)*.09+24));

  try{
    flight=paperFxBall.animate([
      {transform:'translate(0,0) scale(.68) rotate(-10deg)',opacity:0},
      {offset:.12,transform:'translate(0,0) scale(.92) rotate(-4deg)',opacity:1},
      {offset:.56,transform:'translate('+(dx*.55)+'px,'+(dy*.55+arc)+'px) scale(1.03) rotate(145deg)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.82) rotate(310deg)',opacity:1}
    ],{duration:330,easing:'cubic-bezier(.22,.72,.22,1)',fill:'forwards'});
    await flight.finished;
    flight.cancel();
    flight=null;

    paperFxBall.style.opacity='0';
    revealFn();

    if(targetEl && typeof targetEl.animate==='function'){
      targetEl.classList.add('paper-ui-transitioning');
      targetAnim=targetEl.animate([
        {opacity:0,transform:'scale(.90) rotate(-.7deg)'},
        {offset:.62,opacity:1,transform:'scale(1.012) rotate(.18deg)'},
        {opacity:1,transform:'scale(1) rotate(0)'}
      ],{duration:260,easing:'cubic-bezier(.16,.82,.25,1)',fill:'both'});
    }

    paperFxUnfold.style.opacity='1';
    unfold=paperFxUnfold.animate([
      {transform:'scale(.18,.13) rotate(-13deg)',opacity:0},
      {offset:.22,transform:'scale(.48,.40) rotate(-7deg)',opacity:1},
      {offset:.72,transform:'scale(1.05,.96) rotate(1.6deg)',opacity:1},
      {transform:'scale(1.38,1.18) rotate(0)',opacity:0}
    ],{duration:270,easing:'cubic-bezier(.18,.78,.22,1)',fill:'forwards'});

    await Promise.allSettled([unfold.finished,targetAnim?targetAnim.finished:Promise.resolve()]);
  }catch(err){
    console.warn('PAPER_UI_TRANSITION_FALLBACK',err);
    revealFn();
  }finally{
    try{flight?.cancel()}catch{}
    try{unfold?.cancel()}catch{}
    try{targetAnim?.cancel()}catch{}
    if(targetEl)targetEl.classList.remove('paper-ui-transitioning');
    paperFxBall.getAnimations().forEach(a=>a.cancel());
    paperFxUnfold.getAnimations().forEach(a=>a.cancel());
    paperFxBall.style.opacity='0';
    paperFxUnfold.style.opacity='0';
    paperUIBusy=false;
  }
}
window.PaperUITransition={openFrom:paperUIFrom};

/* inventory */
const INVENTORY_CAPACITY=20;
const inventoryItems=Array.from({length:INVENTORY_CAPACITY},()=>null);
let inventorySelected=-1;
let backpackClosing=false;
let lastBackpackTrigger=null;

function normalizeInventory(raw){
  const source=Array.isArray(raw)?raw:[];
  return Array.from({length:INVENTORY_CAPACITY},(_,i)=>{
    const item=source[i];
    if(!item||typeof item!=='object')return null;
    const copy={...item};
    copy.count=Math.max(1,Math.floor(Number(copy.count)||1));
    copy.weight=Math.max(0,Number(copy.weight)||0);
    return copy;
  });
}
function setInventoryFromSave(raw){
  inventoryItems.splice(0,INVENTORY_CAPACITY,...normalizeInventory(raw));
  inventorySelected=-1;
  renderInventory();
}
function inventorySnapshot(){
  return inventoryItems.map(item=>item?{...item}:null);
}
function setInventoryMessage(message){
  inventoryItemDesc.textContent=message||'';
}
function decrementInventoryItem(index,amount=1){
  const item=inventoryItems[index];
  if(!item)return false;
  const left=Math.max(0,(Number(item.count)||1)-amount);
  if(left<=0)inventoryItems[index]=null;
  else item.count=left;
  if(!inventoryItems[index])inventorySelected=-1;
  return true;
}

for(let i=0;i<INVENTORY_CAPACITY;i++){
  const slot=document.createElement('button');
  slot.type='button';
  slot.className='inventory-slot';
  slot.dataset.index=String(i);
  slot.setAttribute('aria-label','背包格 '+(i+1));
  slot.addEventListener('click',()=>{
    inventorySelected=i;
    renderInventory();
  });
  backpackSlots.appendChild(slot);
}

function renderInventoryDetail(){
  const item=inventorySelected>=0?inventoryItems[inventorySelected]:null;
  if(!item){
    inventoryPreviewImage.removeAttribute('src');
    inventoryPreviewImage.style.display='none';
    inventoryItemName.textContent='';
    inventoryItemDesc.textContent='';
    inventoryItemWeight.textContent='0.0';
    inventoryItemCount.textContent='0';
    inventoryUse.disabled=true;
    inventoryDrop.disabled=true;
    return;
  }
  inventoryPreviewImage.style.display=item.icon?'block':'none';
  if(item.icon)inventoryPreviewImage.src=item.icon;
  else inventoryPreviewImage.removeAttribute('src');
  inventoryItemName.textContent=item.name||'未命名物品';
  inventoryItemDesc.textContent=item.desc||'';
  inventoryItemWeight.textContent=Number(item.weight||0).toFixed(1);
  inventoryItemCount.textContent=String(item.count||1);
  inventoryUse.disabled=!(item.consumable===true||item.usable===true||item.action==='consume');
  inventoryDrop.disabled=false;
}
function renderInventory(){
  [...backpackSlots.children].forEach((slot,i)=>{
    const item=inventoryItems[i];
    slot.classList.toggle('is-selected',i===inventorySelected);
    slot.setAttribute('aria-label','背包格 '+(i+1)+(item?'：'+(item.name||'物品'):'：空'));
    slot.innerHTML='';
    if(item){
      if(item.icon){
        const img=document.createElement('img');
        img.className='item-icon';img.src=item.icon;img.alt='';
        slot.appendChild(img);
      }
      if(Number(item.count||1)>1){
        const count=document.createElement('span');
        count.className='item-count';count.textContent=String(item.count);
        slot.appendChild(count);
      }
    }
  });
  renderInventoryDetail();
}
function backpackFocusables(){
  return [...backpackFrame.querySelectorAll('button:not(:disabled),[href],input:not(:disabled),select:not(:disabled),[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.hidden&&getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).display!=='none');
}
function revealBackpack(){
  backpackOverlay.classList.add('is-open');
  backpackOverlay.setAttribute('aria-hidden','false');
  worldEl.setAttribute('inert','');
}
function openBackpack(triggerEl=backpackBtn){
  const shell=document.getElementById('uiShell');
  if(!shell.classList.contains('is-hidden')||backpackClosing||backpackOverlay.classList.contains('is-open'))return;
  keyboardLeft=keyboardRight=false;
  resetJoystick();
  lastBackpackTrigger=triggerEl;
  renderInventory();
  paperUIFrom(triggerEl,revealBackpack,backpackFrame).then(()=>{
    if(backpackOverlay.classList.contains('is-open'))backpackClose.focus({preventScroll:true});
  });
}
function closeBackpack(immediate=false){
  if(!backpackOverlay.classList.contains('is-open'))return;
  backpackClosing=true;
  backpackOverlay.classList.remove('is-open');
  backpackOverlay.setAttribute('aria-hidden','true');
  if(document.getElementById('uiShell').classList.contains('is-hidden'))worldEl.removeAttribute('inert');
  backpackClosing=false;
  const restore=lastBackpackTrigger;
  lastBackpackTrigger=null;
  if(!immediate&&restore&&typeof restore.focus==='function')restore.focus({preventScroll:true});
}
inventoryUse.addEventListener('click',()=>{
  const item=inventorySelected>=0?inventoryItems[inventorySelected]:null;
  if(!item)return;
  if(!(item.consumable===true||item.usable===true||item.action==='consume')){
    setInventoryMessage('这个物品目前不能直接使用');
    return;
  }
  const name=item.name||'物品';
  if(item.consumable===true||item.action==='consume'){
    decrementInventoryItem(inventorySelected,1);
    saveWorldState();
    renderInventory();
    if(inventorySelected>=0)setInventoryMessage('已使用 '+name);
  }else{
    item.lastUsedAt=Date.now();
    saveWorldState();
    setInventoryMessage('已使用 '+name);
  }
});
inventoryDrop.addEventListener('click',()=>{
  const item=inventorySelected>=0?inventoryItems[inventorySelected]:null;
  if(!item)return;
  const name=item.name||'物品';
  decrementInventoryItem(inventorySelected,1);
  saveWorldState();
  renderInventory();
  if(inventorySelected>=0)setInventoryMessage('已丢弃 1 个 '+name);
});
backpackBtn.addEventListener('click',e=>openBackpack(e.currentTarget));
backpackClose.addEventListener('click',()=>closeBackpack(false));
backpackOverlay.addEventListener('pointerdown',e=>{
  if(e.target===backpackOverlay)closeBackpack(false);
});
addEventListener('keydown',e=>{
  if(backpackOverlay.classList.contains('is-open')){
    if(e.code==='Escape'){
      e.preventDefault();
      closeBackpack(false);
      return;
    }
    if(e.key==='Tab'){
      const focusable=backpackFocusables();
      if(focusable.length){
        const first=focusable[0],lastFocusable=focusable[focusable.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();lastFocusable.focus()}
        else if(!e.shiftKey&&document.activeElement===lastFocusable){e.preventDefault();first.focus()}
        else if(!backpackFrame.contains(document.activeElement)){e.preventDefault();first.focus()}
      }
      return;
    }
  }
  if(isEditableTarget(e.target))return;
  const shell=document.getElementById('uiShell');
  if(e.code==='KeyB' && shell.classList.contains('is-hidden')){
    e.preventDefault();
    backpackOverlay.classList.contains('is-open')?closeBackpack(false):openBackpack(backpackBtn);
  }
});
renderInventory();

/* -------------------- MENU / LOCAL ACCOUNT -------------------- */
const uiShell=document.getElementById('uiShell');
const pages={
  menu:document.getElementById('pageMenu'),
  auth:document.getElementById('pageAuth'),
  settings:document.getElementById('pageSettings')
};
const profileNote=document.getElementById('profileNote');
const continueBtn=document.getElementById('continueBtn');
const enterBtn=document.getElementById('enterBtn');
const authBtn=document.getElementById('authBtn');
const settingsBtn=document.getElementById('settingsBtn');
const authMsg=document.getElementById('authMsg');

const KEY_USERS='paperchalk.localUsers.v1';
const KEY_SESSION='paperchalk.session.v1';
const KEY_SAVE_LEGACY='paperchalk.save.v1';
const KEY_SAVE_PREFIX='paperchalk.save.v2.';
const KEY_SETTINGS='paperchalk.settings.v1';

const memoryStore={};
function storageGet(key){
  try{return localStorage.getItem(key)}catch{return memoryStore[key]??null}
}
function storageSet(key,value){
  try{localStorage.setItem(key,value);return true}
  catch{memoryStore[key]=String(value);return false}
}
function storageRemove(key){
  try{localStorage.removeItem(key)}catch{delete memoryStore[key]}
}
function getUsers(){
  try{return JSON.parse(storageGet(KEY_USERS)||'{}')}catch{return{}}
}
function getSession(){
  try{return JSON.parse(storageGet(KEY_SESSION)||'null')}catch{return null}
}
function setSession(v){return storageSet(KEY_SESSION,JSON.stringify(v))}
function accountSaveKey(account){
  return KEY_SAVE_PREFIX+encodeURIComponent(String(account||''));
}
function defaultSave(session){
  return {
    account:session.account,
    location:'A村',
    createdAt:Date.now(),
    worldMinutes:0,
    worldX:0,
    actorRatio:.35,
    inventory:Array.from({length:INVENTORY_CAPACITY},()=>null)
  };
}
function readSaveForSession(session=getSession()){
  if(!session||!session.account)return null;
  const key=accountSaveKey(session.account);
  let raw=storageGet(key);

  // One-time compatible migration from the original shared save.
  if(!raw){
    try{
      const legacy=JSON.parse(storageGet(KEY_SAVE_LEGACY)||'null');
      if(legacy&&legacy.account===session.account){
        storageSet(key,JSON.stringify(legacy));
        raw=JSON.stringify(legacy);
      }
    }catch{}
  }
  if(!raw)return null;
  try{
    const save=JSON.parse(raw);
    return save&&save.account===session.account?save:null;
  }catch{return null}
}
function writeSaveForSession(session,save){
  if(!session||!session.account)return false;
  save.account=session.account;
  return storageSet(accountSaveKey(session.account),JSON.stringify(save));
}
function getSettings(){
  const defaults={language:'zh-CN',timeScale:1,preferLandscape:true};
  try{
    const parsed=JSON.parse(storageGet(KEY_SETTINGS)||'{}');
    return {...defaults,...parsed};
  }catch{return defaults}
}
function applySettings(settings=getSettings()){
  const scale=Number(settings.timeScale);
  worldTimeScale=Number.isFinite(scale)?Math.max(0,Math.min(20,scale)):1;
  document.documentElement.lang=settings.language==='zh-CN'?'zh-CN':'zh-CN';
  document.body.classList.toggle('prefer-landscape',settings.preferLandscape!==false);
  settingLanguage.value='zh-CN';
  settingTimeScale.value=String(worldTimeScale);
  settingLandscape.checked=settings.preferLandscape!==false;
}
function saveSettingsFromUI(){
  const settings={
    language:settingLanguage.value||'zh-CN',
    timeScale:Number(settingTimeScale.value)||0,
    preferLandscape:settingLandscape.checked
  };
  storageSet(KEY_SETTINGS,JSON.stringify(settings));
  applySettings(settings);
  settingsStatus.textContent='设置已保存';
  clearTimeout(saveSettingsFromUI._timer);
  saveSettingsFromUI._timer=setTimeout(()=>{settingsStatus.textContent=''},1200);
}
function hashText(text){
  // Synchronous local-only hash for maximum Android WebView compatibility.
  // This is a prototype local account system, not server authentication.
  let h1=0x811c9dc5,h2=0x9e3779b9;
  const t='paperchalk-local-v1|'+String(text);
  for(let i=0;i<t.length;i++){
    const c=t.charCodeAt(i);
    h1^=c; h1=Math.imul(h1,0x01000193);
    h2^=(c+i); h2=Math.imul(h2,0x85ebca6b);
  }
  return (h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
}
function showPage(name){
  Object.values(pages).forEach(p=>{
    p.getAnimations().forEach(a=>a.cancel());
    p.classList.remove('active');
  });
  pages[name].classList.add('active');
  authMsg.textContent='';
  if(name==='settings'){
    applySettings();
    settingsStatus.textContent='';
  }
}
function refreshMenu(){
  const session=getSession();
  const hasSave=!!readSaveForSession(session);
  profileNote.textContent=session?'当前旅人：'+session.displayName:'尚未登录';
  continueBtn.style.display=(session&&hasSave)?'block':'none';
  enterBtn.textContent=session?'进入世界':'开始游戏';
  authBtn.textContent=session?'切换账号 / 退出':'登录 / 注册';
}
function saveWorldState(){
  const session=getSession();
  if(!session)return false;
  const save=readSaveForSession(session)||defaultSave(session);
  save.location=save.location||'A村';
  save.worldX=worldX;
  save.worldMinutes=worldMinutes;
  save.actorRatio=innerWidth>0?actorX/innerWidth:.35;
  save.inventory=inventorySnapshot();
  save.updatedAt=Date.now();
  return writeSaveForSession(session,save);
}
function loadWorldState(){
  const session=getSession();
  if(!session)return;
  const save=readSaveForSession(session)||defaultSave(session);
  worldX=Number.isFinite(save.worldX)?save.worldX:0;
  worldMinutes=Number.isFinite(save.worldMinutes)?save.worldMinutes:0;
  if(Number.isFinite(save.actorRatio))actorX=Math.max(innerWidth*.12,Math.min(innerWidth*.82,innerWidth*save.actorRatio));
  setInventoryFromSave(save.inventory);
  renderWorld();
}
function openUI(fromWorld=false){
  closeBackpack(true);
  if(fromWorld)saveWorldState();
  keyboardLeft=keyboardRight=false;
  resetJoystick();
  uiShell.getAnimations().forEach(a=>a.cancel());
  uiShell.removeAttribute('inert');
  worldEl.setAttribute('inert','');
  refreshMenu();
  showPage('menu');
  uiShell.classList.remove('is-hidden');
  uiShell.classList.remove('board-enter');
}
function enterWorld(){
  closeBackpack(true);
  const session=getSession();
  if(!session){showPage('auth');return}
  if(!readSaveForSession(session))writeSaveForSession(session,defaultSave(session));
  loadWorldState();
  keyboardLeft=keyboardRight=false;
  resetJoystick();
  uiShell.getAnimations().forEach(a=>a.cancel());
  uiShell.classList.add('is-hidden');
  uiShell.classList.remove('board-enter');
  uiShell.setAttribute('inert','');
  worldEl.removeAttribute('inert');
  backpackBtn.focus({preventScroll:true});
}
document.getElementById('worldMenuBtn').addEventListener('click',e=>{
  paperUIFrom(e.currentTarget,()=>openUI(true),uiShell);
});
continueBtn.addEventListener('click',enterWorld);
enterBtn.addEventListener('click',enterWorld);
settingsBtn.addEventListener('click',e=>{
  paperUIFrom(e.currentTarget,()=>showPage('settings'),pages.settings);
});
document.querySelectorAll('[data-back="menu"]').forEach(b=>b.addEventListener('click',e=>{
  paperUIFrom(e.currentTarget,()=>showPage('menu'),pages.menu);
}));

authBtn.addEventListener('click',e=>{
  const trigger=e.currentTarget;
  paperUIFrom(trigger,()=>{
    const session=getSession();
    if(session){
      saveWorldState();
      storageRemove(KEY_SESSION);
      setInventoryFromSave([]);
      worldX=0;
      worldMinutes=0;
      refreshMenu();
    }
    showPage('auth');
  },pages.auth);
});

settingLanguage.addEventListener('change',saveSettingsFromUI);
settingTimeScale.addEventListener('change',saveSettingsFromUI);
settingLandscape.addEventListener('change',saveSettingsFromUI);
applySettings();

const tabLogin=document.getElementById('tabLogin');
const tabRegister=document.getElementById('tabRegister');
const loginForm=document.getElementById('loginForm');
const registerForm=document.getElementById('registerForm');
function setAuthTab(mode){
  const isLogin=mode==='login';
  tabLogin.classList.toggle('active',isLogin);
  tabRegister.classList.toggle('active',!isLogin);
  loginForm.classList.toggle('hidden',!isLogin);
  registerForm.classList.toggle('hidden',isLogin);
  authMsg.textContent='';
}
tabLogin.addEventListener('click',()=>setAuthTab('login'));
tabRegister.addEventListener('click',()=>setAuthTab('register'));

registerForm.addEventListener('submit',e=>{
  e.preventDefault();
  authMsg.textContent='';
  try{
    const rawAccount=document.getElementById('regUser').value.trim();
    const account=rawAccount.toLocaleLowerCase();
    const displayName=document.getElementById('regName').value.trim();
    const pass=document.getElementById('regPass').value;

    if(account.length<2||account.length>24){
      authMsg.textContent='账号需要 2–24 个字符';return;
    }
    if(/\s/.test(account)){
      authMsg.textContent='账号中不能包含空格';return;
    }
    if(displayName.length<1||displayName.length>16){
      authMsg.textContent='旅人名称需要 1–16 个字符';return;
    }
    if(pass.length<4){
      authMsg.textContent='密码至少 4 位';return;
    }

    const users=getUsers();
    if(users[account]){
      authMsg.textContent='这个账号已经存在，可以切换到“登录”';return;
    }

    users[account]={
      displayName,
      passwordHash:hashText(pass),
      createdAt:Date.now()
    };

    const usersPersisted=storageSet(KEY_USERS,JSON.stringify(users));
    setSession({account,displayName});
    refreshMenu();

    if(!usersPersisted){
      authMsg.textContent='当前环境无法持久保存账号，已临时进入游戏';
    }
    enterWorld();
  }catch(err){
    console.error('REGISTER_FAILED',err);
    authMsg.textContent='注册失败：'+(err&&err.message?err.message:'未知错误');
  }
});

loginForm.addEventListener('submit',e=>{
  e.preventDefault();
  authMsg.textContent='';
  try{
    const account=document.getElementById('loginUser').value.trim().toLocaleLowerCase();
    const pass=document.getElementById('loginPass').value;
    const users=getUsers();
    const user=users[account];

    if(!user){authMsg.textContent='未找到这个账号';return}
    if(user.passwordHash!==hashText(pass)){authMsg.textContent='密码不正确';return}

    setSession({account,displayName:user.displayName});
    refreshMenu();
    enterWorld();
  }catch(err){
    console.error('LOGIN_FAILED',err);
    authMsg.textContent='登录失败：'+(err&&err.message?err.message:'未知错误');
  }
});

/* show fatal runtime problems instead of silently ignoring taps */
addEventListener('unhandledrejection',e=>{
  console.error('UNHANDLED_REJECTION',e.reason);
  if(!uiShell.classList.contains('is-hidden')){
    authMsg.textContent='运行错误：'+(e.reason&&e.reason.message?e.reason.message:String(e.reason||'未知错误'));
  }
});
addEventListener('pagehide',saveWorldState);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&worldInteractive())saveWorldState()});

/* first launch always lands on main menu, no prologue */
refreshMenu();
openUI(false);
</script>
</body>
</html>
