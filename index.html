<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181d28"><title>未命名 · 冬夜小店试玩</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js" defer></script>
<script type="module" src="./src/kiosk-app.js"></script>
</head><body>
<canvas id="game" aria-label="第一人称冬夜小店：点击窗台开窗，货架拿取商品，柜台交付收款"></canvas>
<div id="hud"><button id="menu" aria-label="打开菜单">☰</button><span id="roomCode"></span><span id="status" role="status">尚未营业</span></div>
<div id="lobby" class="modal">
  <div class="panel">
    <div class="eyebrow">FIRST PERSON · WINTER SHOP · PLAYABLE BUILD</div>
    <h1>冬夜杂货窗口</h1><p class="sub">未命名游戏 · 经营玩法测试版</p>
    <div class="shelf-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p class="instructions">先点窗闩打开售货窗口，顾客会来买东西。点货架拿商品，再点柜台的绿色交接台，最后点「收款」。柜门与抽屉可反复打开关闭，货物可以放回，也可以购买新库存。</p>
    <label>值班员称呼 <input id="nickname" maxlength="14" value="店长"></label>
    <div class="buttons"><button id="solo">单人开始营业</button><button id="resume" hidden>继续本地存档</button></div>
    <div class="buttons twin"><button id="host">创建多人小店</button><button id="join">加入好友小店</button></div>
    <label>加入码 <input id="joinCode" maxlength="8" placeholder="填写 8 位房间码" autocomplete="off"></label>
    <button id="closeLobby" class="close">返回游戏</button>
    <p class="fine">纯手绘程序化像素素材 · 单屏横竖适配 · 1–4 人协作实验版<br>本版没有使用 GPT 生成图片；多人依赖网络信令，手机浏览器版本非原生引擎。</p>
  </div>
</div>
</body></html>
