<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8dfcf">
<title>Paperchalk World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dfcf}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#e8dfcf}

/* Layer 1: one repeating dirt-road strip */
.road-layer{position:absolute;left:0;right:0;bottom:0;height:348px;overflow:hidden;z-index:1}
.road-track{position:absolute;left:0;bottom:0;height:348px;display:flex;will-change:transform}
.road-tile{height:348px;width:auto;display:block;flex:none;margin-right:-1px}

/* Layer 2: one fixed paper character, feet anchored to road surface */
.actor{
  position:absolute;
  left:35%;
  bottom:218px;
  width:170px;
  z-index:2;
  transform:translateX(-50%);
  pointer-events:none;
}
.walker{
  position:relative;
  z-index:2;
  display:block;
  width:100%;
  height:auto;
  transform-origin:52% 96%;
  will-change:transform;
  animation:walk-cycle .78s ease-in-out infinite;
}
.foot-shadow{
  position:absolute;
  z-index:1;
  left:52%;
  bottom:-5px;
  width:62px;
  height:13px;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(65,45,30,.28) 0%,
    rgba(65,45,30,.18) 42%,
    rgba(65,45,30,.07) 62%,
    rgba(65,45,30,0) 76%);
  filter:blur(1.6px);
  transform:translateX(-50%) scaleX(1);
  transform-origin:center;
  will-change:transform,opacity;
  animation:shadow-cycle .78s ease-in-out infinite;
}

@keyframes walk-cycle{
  0%,100%{transform:translate3d(0,0,0) rotate(-.18deg)}
  25%{transform:translate3d(.5px,-2.0px,0) rotate(.06deg)}
  50%{transform:translate3d(.9px,-.35px,0) rotate(.18deg)}
  75%{transform:translate3d(.4px,-1.7px,0) rotate(-.05deg)}
}
@keyframes shadow-cycle{
  0%,50%,100%{transform:translateX(-50%) scaleX(1.04);opacity:.82}
  25%,75%{transform:translateX(-50%) scaleX(.88);opacity:.53}
}

@media(max-width:800px){
  .road-layer,.road-track{height:285px}
  .road-tile{height:285px}
  .actor{left:32%;bottom:179px;width:145px}
  .foot-shadow{width:53px;height:11px;bottom:-4px}
}
</style>
</head>
<body>
<main class="stage" aria-label="Paperchalk World">
  <div class="road-layer">
    <div class="road-track" id="roadTrack">
      <img class="road-tile" id="roadTile" src="./assets/road.webp?v=road-1200x348-r2" alt="">
      <img class="road-tile" src="./assets/road.webp?v=road-1200x348-r2" alt="">
      <img class="road-tile" src="./assets/road.webp?v=road-1200x348-r2" alt="">
    </div>
  </div>

  <div class="actor">
    <div class="foot-shadow" aria-hidden="true"></div>
    <img class="walker" src="./assets/traveler.webp?v=traveler-279x320-r2" alt="旅行者">
  </div>
</main>

<script>
const track=document.getElementById('roadTrack');
const tile=document.getElementById('roadTile');
let last=performance.now();
let offset=0;
let tileWidth=1200;

function updateWidth(){
  const w=tile.getBoundingClientRect().width;
  if(w>0) tileWidth=w-1;
}
tile.addEventListener('load',updateWidth);
window.addEventListener('resize',updateWidth);
updateWidth();

function frame(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  offset=(offset+32*dt)%tileWidth;
  track.style.transform='translate3d('+(-offset)+'px,0,0)';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
