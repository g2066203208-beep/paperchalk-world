<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8cfbb">
<title>Paperchalk World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8cfbb}
body{font-family:"Noto Serif SC","Songti SC",serif}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.18),transparent 44%),#d8cfbb}
.paper{position:absolute;inset:0;opacity:.055;pointer-events:none;background:repeating-linear-gradient(13deg,rgba(255,255,255,.11) 0 1px,transparent 1px 8px),repeating-linear-gradient(-17deg,rgba(65,45,25,.035) 0 1px,transparent 1px 9px)}
.road{
  position:absolute;
  left:-6%;
  right:-6%;
  bottom:8.8vh;
  height:190px;
  background-image:url("./assets/road.webp");
  background-repeat:repeat-x;
  background-position:0 50%;
  background-size:auto 300%;
  will-change:background-position;
  filter:contrast(1.12) saturate(1.08) brightness(.98);
}
.walker-wrap{
  position:absolute;
  left:34%;
  bottom:17.4vh;
  width:150px;
  transform:translateX(-50%);
  transform-origin:50% 100%;
}
.walker{
  display:block;
  width:100%;
  height:auto;
  image-rendering:auto;
  backface-visibility:hidden;
  transform-origin:50% 92%;
  filter:drop-shadow(2px 3px 1px rgba(65,43,24,.12));
  animation:cute-step .72s ease-in-out infinite;
}
.shadow{
  position:absolute;
  left:50%;
  bottom:-3px;
  width:46%;
  height:7px;
  transform:translateX(-50%);
  border-radius:50%;
  background:rgba(62,43,26,.14);
  filter:blur(3px);
  animation:shadow-step .72s ease-in-out infinite;
}
.caption{position:absolute;left:50%;bottom:4.7vh;transform:translateX(-50%);color:rgba(62,48,34,.46);font-size:clamp(11px,1.05vw,13px);letter-spacing:.18em;white-space:nowrap}
@keyframes cute-step{
  0%,100%{transform:translate3d(0,0,0) rotate(-.45deg)}
  25%{transform:translate3d(.6px,-2.8px,0) rotate(.20deg)}
  50%{transform:translate3d(1px,-.4px,0) rotate(.55deg)}
  75%{transform:translate3d(.5px,-2.4px,0) rotate(-.15deg)}
}
@keyframes shadow-step{
  0%,50%,100%{transform:translateX(-50%) scaleX(1);opacity:.60}
  25%,75%{transform:translateX(-50%) scaleX(.94);opacity:.48}
}
@media(max-width:760px){
  .walker-wrap{left:31%;width:138px;bottom:17.1vh}
  .road{height:165px;background-size:auto 300%}
  .caption{bottom:4.2vh}
}
</style>
</head>
<body>
<main class="stage" aria-label="Paperchalk World road walk preview">
  <div class="paper"></div>
  <div id="road" class="road"></div>
  <div class="walker-wrap">
    <div class="shadow"></div>
    <img class="walker" src="./assets/traveler.webp" alt="行走中的旅行者">
  </div>
  <div class="caption">沿旧驿道前行</div>
</main>
<script>
const road=document.getElementById('road');
let last=performance.now(),x=0;
function tick(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  x-=82*dt;
  road.style.backgroundPositionX=x+'px';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
