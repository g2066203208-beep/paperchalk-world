<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7decc">
<title>Paperchalk World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7decc}
body{font-family:"Noto Serif SC","Songti SC",serif}
.stage{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.18),transparent 48%),#e7decc
}
.paper{
  position:absolute;inset:0;pointer-events:none;opacity:.045;
  background:repeating-linear-gradient(13deg,rgba(255,255,255,.12) 0 1px,transparent 1px 8px),
             repeating-linear-gradient(-17deg,rgba(65,45,25,.04) 0 1px,transparent 1px 9px)
}
.road-window{
  position:absolute;left:0;right:0;bottom:7.5vh;height:170px;
  overflow:hidden;z-index:1
}
.road-track{
  position:absolute;left:0;top:-170px;height:510px;
  display:flex;align-items:flex-start;
  will-change:transform
}
.road-tile{
  display:block;flex:0 0 auto;height:510px;width:auto;
  margin-right:-2px;
  filter:contrast(1.32) saturate(1.14) brightness(.93)
}
.walker-wrap{
  position:absolute;
  left:34%;
  bottom:calc(7.5vh + 158px);
  width:155px;
  z-index:3;
  transform:translateX(-50%);
  transform-origin:50% 100%
}
.walker{
  display:block;width:100%;height:auto;
  image-rendering:auto;
  transform-origin:50% 94%;
  filter:contrast(1.04) saturate(1.03) drop-shadow(2px 3px 1px rgba(65,43,24,.10));
  animation:cute-step .78s ease-in-out infinite
}
.shadow{
  position:absolute;left:50%;bottom:-2px;width:43%;height:6px;
  transform:translateX(-50%);
  border-radius:50%;background:rgba(62,43,26,.13);filter:blur(2.5px);
  animation:shadow-step .78s ease-in-out infinite
}
.caption{
  position:absolute;left:50%;bottom:3.4vh;transform:translateX(-50%);
  color:rgba(62,48,34,.42);font-size:12px;letter-spacing:.18em;white-space:nowrap
}
@keyframes cute-step{
  0%,100%{transform:translate3d(0,0,0) rotate(-.18deg)}
  25%{transform:translate3d(.3px,-1.7px,0) rotate(.08deg)}
  50%{transform:translate3d(.7px,-.2px,0) rotate(.22deg)}
  75%{transform:translate3d(.3px,-1.4px,0) rotate(-.06deg)}
}
@keyframes shadow-step{
  0%,50%,100%{transform:translateX(-50%) scaleX(1);opacity:.55}
  25%,75%{transform:translateX(-50%) scaleX(.96);opacity:.47}
}
@media(max-width:760px){
  .road-window{height:145px;bottom:7vh}
  .road-track{height:435px;top:-145px}
  .road-tile{height:435px}
  .walker-wrap{left:31%;width:138px;bottom:calc(7vh + 135px)}
  .caption{bottom:3vh}
}
</style>
</head>

<script>
const track=document.getElementById('roadTrack');
const tile=document.getElementById('roadTileA');
let last=performance.now();
let x=0;
let tileWidth=1760;

function refreshWidth(){
  const w=tile.getBoundingClientRect().width;
  if(w>0) tileWidth=w-2;
}
tile.addEventListener('load',refreshWidth);
window.addEventListener('resize',refreshWidth);
refreshWidth();

function tick(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  x += 46*dt;
  if(x>=tileWidth) x-=tileWidth;
  track.style.transform='translate3d('+(-x)+'px,0,0)';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
