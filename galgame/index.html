.logline{border-bottom:1px solid #344054;padding:9px 2px}
.logline b{color:#eeb779;margin-right:12px}
.close{background:#364057;color:white;border:1px solid #8894a0;padding:6px 13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:9px 16px;background:#252f40;color:#fff;border:1px solid #b99e7b;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}

@media(max-width:680px){body{padding:0;align-items:flex-start}#game{border-left:0;border-right:0;box-shadow:none}.brand{display:block}.brand strong{font-size:15px}.brand small{display:block;font-size:9px}.top-tools button{padding:5px 6px;font-size:12px}#story{padding:12px 13px;min-height:200px}#text{min-height:73px;font-size:15px}#choices{grid-template-columns:1fr;gap:6px}.choice{min-height:38px}footer{font-size:9px}#next{min-width:105px}.scene-top{left:8px;top:8px}}

</style>
