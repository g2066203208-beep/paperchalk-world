<rect x="774" y="178" width="126" height="546" fill="#5d4b47"/><g stroke="#b2936c" stroke-width="14"><path d="M778 332h120M778 472h120M778 622h120"/></g>
<g><rect x="795" y="246" width="38" height="78" rx="3" fill="#a18b70"/><rect x="841" y="222" width="34" height="101" fill="#50736c"/><rect x="785" y="399" width="40" height="64" fill="#a96d61"/><rect x="833" y="379" width="38" height="84" fill="#d2b988"/><rect x="796" y="536" width="35" height="79" fill="#67827a"/><rect x="844" y="515" width="35" height="101" fill="#a18b70"/></g>
