<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" aria-label="深夜店铺内景">
<defs>
<pattern id="grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r="0.65" fill="#e5ce9c" opacity=".16"/><circle cx="13" cy="14" r=".55" fill="#061b20" opacity=".22"/></pattern>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57777a"/><stop offset="1" stop-color="#213943"/></linearGradient>
<radialGradient id="lamp"><stop stop-color="#e6c692" stop-opacity=".45"/><stop offset="1" stop-color="#e6c692" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="900" fill="#26363c"/><path d="M0 0H900V900H0Z" fill="url(#grain)"/>
<path d="M0 0H900V128H0Z" fill="#171e24"/><rect y="125" width="900" height="10" fill="#80675c"/>
<rect x="136" y="170" width="630" height="574" fill="#121e24" stroke="#a38c73" stroke-width="14"/>
<rect x="159" y="192" width="586" height="532" fill="url(#glass)"/>
<!-- city street / stores beyond glass -->
<path d="M158 530L220 499L276 520L335 458L417 494L482 450L562 500L648 461L747 493V727H159Z" fill="#304950"/>
<g fill="#182d35"><rect x="178" y="365" width="95" height="322"/><rect x="298" y="302" width="115" height="398"/><rect x="469" y="343" width="92" height="358"/><rect x="623" y="296" width="95" height="404"/></g>
<g fill="#d7bc83" opacity=".62"><rect x="195" y="396" width="10" height="13"/><rect x="226" y="420" width="9" height="12"/><rect x="350" y="346" width="12" height="20"/><rect x="370" y="385" width="13" height="16"/><rect x="488" y="394" width="12" height="18"/><rect x="672" y="332" width="9" height="14"/></g>
