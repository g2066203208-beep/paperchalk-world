<path d="M45 795h204l24 53H30z" fill="#d8c2a0" stroke="#302d30" stroke-width="7"/><rect x="601" y="786" width="220" height="55" rx="5" fill="#3f4b4b" stroke="#c6a780" stroke-width="6"/>
<rect width="900" height="900" fill="url(#grain)" opacity=".65"/>
