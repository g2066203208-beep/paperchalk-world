<g fill="#1b3438" opacity=".84"><circle cx="236" cy="606" r="31"/><path d="M188 713Q185 640 234 641Q280 644 283 713Z"/><circle cx="664" cy="596" r="24"/><path d="M629 712Q621 633 665 632Q709 639 704 716Z"/></g>
