</style>
</head>

  <p>这版只做地板：在原来类似 Paper003 的大折纸基础上，加入更高频的纸纤维和纸浆颗粒，让草地更接近“毛毛的牛皮手工纸”。已删除装饰小草和石头。</p>
</div>

  <button id="final" class="active">完整效果</button>
  <button id="random" class="active">材质变化</button>
  <button id="layers" class="active">草层边缘</button>
  <button id="normal" class="active">纤维法线</button>
  <button id="shadow" class="active">软阴影</button>
  <button id="fog" class="active">空气雾</button>
  <div class="break"></div>
  <button id="dawn">清晨</button><button id="noon" class="active">正午</button><button id="sunset">黄昏</button><button id="night">夜晚</button><button id="auto">自动昼夜</button>
</div>

  <div class="row"><span>草层厚度</span><input id="thickSlider" type="range" min="2" max="14" value="7"><span id="thickVal" class="tag">0.07</span></div>

</div>

function preset(p){state.auto=false;state.preset=p;state.time=p==='dawn'?.27:p==='sunset'?.73:p==='night'?0:.5;sync();light(state.time)}function sync(){sky.visible=state.sky;contact.visible=state.shadow;renderer.shadowMap.enabled=state.shadow;sun.castShadow=moon.castShadow=state.shadow;if(!state.fog)scene.fog=null;document.getElementById('random').classList.toggle('active',randomOn);document.getElementById('layers').classList.toggle('active',layersOn);document.getElementById('normal').classList.toggle('active',normalsOn);document.getElementById('shadow').classList.toggle('active',state.shadow);document.getElementById('fog').classList.toggle('active',state.fog);['dawn','noon','sunset','night'].forEach(id=>document.getElementById(id).classList.toggle('active',state.preset===id&&!state.auto));document.getElementById('auto').classList.toggle('active',state.auto);document.getElementById('final').classList.toggle('active',randomOn&&layersOn&&normalsOn&&state.shadow&&state.fog)}
document.getElementById('random').onclick=()=>{randomOn=!randomOn;rebuild();sync()};document.getElementById('layers').onclick=()=>{layersOn=!layersOn;rebuild();sync()};document.getElementById('normal').onclick=()=>{normalsOn=!normalsOn;rebuild();sync()};document.getElementById('shadow').onclick=()=>{state.shadow=!state.shadow;sync()};document.getElementById('fog').onclick=()=>{state.fog=!state.fog;sync();light(state.time)};document.getElementById('dawn').onclick=()=>preset('dawn');document.getElementById('noon').onclick=()=>preset('noon');document.getElementById('sunset').onclick=()=>preset('sunset');document.getElementById('night').onclick=()=>preset('night');document.getElementById('auto').onclick=()=>{state.auto=!state.auto;if(state.auto)state.preset='';sync()};document.getElementById('final').onclick=()=>{const full=!(randomOn&&layersOn&&normalsOn&&state.shadow&&state.fog);randomOn=layersOn=normalsOn=state.shadow=state.fog=full;rebuild();sync();light(state.time)};
const vs=document.getElementById('varSlider'),ts=document.getElementById('thickSlider'),ns=document.getElementById('normalSlider');vs.oninput=()=>{variationStrength=+vs.value/100;document.getElementById('varVal').textContent=vs.value+'%';rebuild()};ts.oninput=()=>{capThickness=+ts.value/100;document.getElementById('thickVal').textContent=capThickness.toFixed(2);rebuild()};ns.oninput=()=>{normalStrength=+ns.value/100;document.getElementById('normalVal').textContent=normalStrength.toFixed(2);rebuild()};
let drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=clamp(pitch+(e.clientY-ly)*.004,.08,.62);lx=e.clientX;ly=e.clientY;placeCamera()});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.012,10,27);placeCamera()},{passive:true});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))});let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(state.auto)state.time=(state.time+dt/50)%1;light(state.time);sky.position.copy(camera.position);renderer.render(scene,camera)}rebuild();sync();loop(performance.now());
